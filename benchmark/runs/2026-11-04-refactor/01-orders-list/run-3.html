<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orders - Sales - ERP</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  .sk { background: linear-gradient(90deg,#e2e8f0 25%,#f1f5f9 50%,#e2e8f0 75%); background-size: 200% 100%; animation: sk 1.4s linear infinite; border-radius: 4px; }
  @keyframes sk { to { background-position: -200% 0; } }
  @media (prefers-reduced-motion: reduce) { .sk { animation: none; } }
  :focus-visible { outline: 2px solid #1d4ed8; outline-offset: 1px; }
  .tbl-wrap { overflow-x: auto; }
  th.stk, td.stk { position: sticky; left: 0; }
  input[type=checkbox] { accent-color: #1d4ed8; width: 16px; height: 16px; }
</style>
</head>
<body class="bg-slate-50 text-slate-900 text-sm">

<div class="flex min-h-screen">

    </div>
    <nav aria-label="Main" class="flex flex-col gap-4 p-2">
      <div class="flex flex-col gap-0.5">
        <p class="px-2 py-1 text-xs font-medium text-slate-600">Sales</p>
        <a href="#" class="flex h-8 items-center gap-2 rounded px-2 text-slate-700 hover:bg-slate-100">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h18v4H3zM5 7v14h14V7M9 12h6"/></svg>Quotations</a>
        <a href="#" aria-current="page" class="flex h-8 items-center gap-2 rounded bg-slate-100 px-2 font-medium text-slate-900">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2h12l2 5v15H4V7zM4 7h16M9 11h6"/></svg>Orders</a>
        <a href="#" class="flex h-8 items-center gap-2 rounded px-2 text-slate-700 hover:bg-slate-100">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 4h18v14H3zM7 22h10M9 18v4M15 18v4"/></svg>Customers</a>
        <a href="#" class="flex h-8 items-center gap-2 rounded px-2 text-slate-700 hover:bg-slate-100">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4zM4 10h16M10 4v16"/></svg>Price lists</a>
      </div>
      <div class="flex flex-col gap-0.5">
        <p class="px-2 py-1 text-xs font-medium text-slate-600">Inventory</p>
        <a href="#" class="flex h-8 items-center gap-2 rounded px-2 text-slate-700 hover:bg-slate-100">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8l-9-5-9 5v8l9 5 9-5zM3 8l9 5 9-5M12 13v8"/></svg>Products</a>
        <a href="#" class="flex h-8 items-center gap-2 rounded px-2 text-slate-700 hover:bg-slate-100">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 6h13v10H1zM14 9h5l4 4v3h-9zM6 19a2 2 0 100-4 2 2 0 000 4zM18 19a2 2 0 100-4 2 2 0 000 4z"/></svg>Shipments</a>
      </div>
      <div class="flex flex-col gap-0.5">
        <p class="px-2 py-1 text-xs font-medium text-slate-600">Finance</p>
        <a href="#" class="flex h-8 items-center gap-2 rounded px-2 text-slate-700 hover:bg-slate-100">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2h12v20l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6"/></svg>Invoices</a>
        <a href="#" class="flex h-8 items-center gap-2 rounded px-2 text-slate-700 hover:bg-slate-100">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 6h20v12H2zM12 9a3 3 0 100 6 3 3 0 000-6z"/></svg>Payments</a>
      </div>
    </nav>
  </aside>

  <div class="flex min-w-0 flex-1 flex-col">
    <header class="flex h-12 items-center justify-between border-b border-slate-200 bg-white px-4">
      <button type="button" class="flex h-8 w-72 max-w-full items-center gap-2 rounded border border-slate-300 bg-white px-2 text-slate-600 hover:bg-slate-50" aria-label="Search or run a command">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
        <span class="flex-1 text-left">Search or run a command</span><kbd class="rounded border border-slate-300 px-1 text-xs">Ctrl K</kbd>
      </button>
      <div class="flex items-center gap-2">
        <button type="button" class="flex h-8 w-8 items-center justify-center rounded text-slate-600 hover:bg-slate-100" aria-label="3 unread notifications">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0112 0c0 7 3 9 3 9H3s3-2 3-9M10 21h4"/></svg></button>
        <button type="button" class="flex h-8 w-8 items-center justify-center rounded-full bg-slate-200 text-xs font-medium text-slate-800" aria-label="Account menu">LH</button>
      </div>
    </header>

    <main class="min-w-0 flex-1 p-6">
      <!-- Page header -->
      <div class="mb-4 flex flex-col gap-2">
        <nav aria-label="Breadcrumb"><ol class="flex items-center gap-1 text-sm text-slate-600">
          <li><a href="#" class="hover:underline">Sales</a></li><li aria-hidden="true">/</li><li><span aria-current="page" class="text-slate-900">Orders</span></li></ol></nav>
        <div class="flex flex-wrap items-center justify-between gap-2">
          <h1 class="text-xl font-semibold">Orders</h1>
          <div class="flex items-center gap-2">
            <button id="btnImport" type="button" class="h-8 rounded border border-slate-300 bg-white px-3 font-medium text-slate-800 hover:bg-slate-50">Import</button>
            <button id="btnExport" type="button" class="h-8 rounded border border-slate-300 bg-white px-3 font-medium text-slate-800 hover:bg-slate-50">Export</button>
            <button id="btnCreate" type="button" class="h-8 rounded bg-blue-700 px-3 font-medium text-white hover:bg-blue-800">Create order</button>
          </div>
        </div>
      </div>

      <!-- Status tabs -->
      <div id="tabs" role="tablist" aria-label="Order status" class="flex flex-wrap gap-1 border-b border-slate-200"></div>

      <!-- Filter bar -->
      <div id="filterbar" class="relative flex flex-wrap items-center gap-2 py-3">
        <div class="relative">
          <svg class="pointer-events-none absolute left-2 top-2 h-4 w-4 text-slate-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
          <input id="q" type="search" aria-label="Search orders" placeholder="Search order no., customer, phone" class="h-8 w-72 rounded border border-slate-300 bg-white pl-8 pr-2 text-sm placeholder:text-slate-500">
        </div>
        <div class="relative">
          <button id="fStatusBtn" type="button" aria-haspopup="true" aria-expanded="false" class="h-8 rounded border border-slate-300 bg-white px-3 text-slate-800 hover:bg-slate-50">Status</button>
          <div id="fStatusPop" hidden class="absolute left-0 top-9 z-20 w-56 rounded-md border border-slate-200 bg-white p-2 shadow-lg"></div>
        </div>
        <label class="sr-only" for="fPay">Payment</label>
        <select id="fPay" class="h-8 rounded border border-slate-300 bg-white px-2 text-slate-800">
          <option value="">Payment: any</option><option>Paid</option><option>Partially paid</option><option>Unpaid</option><option>Overdue</option>
        </select>
        <label class="sr-only" for="fSales">Salesperson</label>
        <select id="fSales" class="h-8 rounded border border-slate-300 bg-white px-2 text-slate-800"></select>
        <div class="relative">
          <button id="fMoreBtn" type="button" aria-haspopup="dialog" aria-expanded="false" class="h-8 rounded border border-slate-300 bg-white px-3 text-slate-800 hover:bg-slate-50">More filters</button>
          <div id="fMorePop" hidden role="dialog" aria-label="More filters" class="absolute left-0 top-9 z-20 w-80 rounded-md border border-slate-200 bg-white p-4 shadow-lg">
            <div class="space-y-3">
              <fieldset><legend class="mb-1 text-sm font-medium">Order date</legend>
                <div class="flex items-center gap-2">
                  <input id="mFrom" type="date" aria-label="Order date from" class="h-8 w-full rounded border border-slate-300 px-2">
                  <span class="text-slate-600">to</span>
                  <input id="mTo" type="date" aria-label="Order date to" class="h-8 w-full rounded border border-slate-300 px-2">
                </div></fieldset>
              <fieldset><legend class="mb-1 text-sm font-medium">Total (VND)</legend>
                <div class="flex items-center gap-2">
                  <input id="mMin" type="number" min="0" inputmode="numeric" placeholder="Min" aria-label="Total minimum" class="h-8 w-full rounded border border-slate-300 px-2 text-right tabular-nums placeholder:text-slate-500">
                  <span class="text-slate-600">to</span>
                  <input id="mMax" type="number" min="0" inputmode="numeric" placeholder="Max" aria-label="Total maximum" class="h-8 w-full rounded border border-slate-300 px-2 text-right tabular-nums placeholder:text-slate-500">
                </div></fieldset>
              <div><label for="mChan" class="mb-1 block text-sm font-medium">Sales channel</label>
                <select id="mChan" class="h-8 w-full rounded border border-slate-300 bg-white px-2"><option value="">Any channel</option><option>Direct</option><option>Distributor</option><option>E-commerce</option><option>Marketplace</option></select></div>
            </div>
            <div class="mt-4 flex justify-between border-t border-slate-200 pt-3">
              <button id="mReset" type="button" class="h-8 rounded px-3 font-medium text-blue-700 hover:bg-slate-100">Reset</button>
              <button id="mApply" type="button" class="h-8 rounded bg-blue-700 px-3 font-medium text-white hover:bg-blue-800">Apply</button>
            </div>

        <div class="ml-auto flex items-center gap-2">
          <button id="densBtn" type="button" class="h-8 rounded border border-slate-300 bg-white px-3 text-slate-800 hover:bg-slate-50" aria-pressed="false">Compact rows</button>

      <div id="chips" class="flex flex-wrap items-center gap-2 pb-2"></div>

      <!-- Summary / bulk bar -->
      <div id="summary" class="flex h-10 items-center justify-between text-slate-700"></div>
      <p id="live" role="status" class="sr-only"></p>
      <div id="banner"></div>

      <div class="rounded-md border border-slate-200 bg-white">
        <div id="bulk" hidden class="flex h-10 items-center gap-3 border-b border-slate-200 bg-blue-50 px-3 text-blue-900"></div>
        <div class="tbl-wrap">
          <table id="tbl" class="w-full min-w-[1100px] border-collapse text-sm" aria-busy="false">
            <thead class="bg-slate-50 text-slate-700" id="thead"></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
        <div id="pager" class="flex h-12 flex-wrap items-center justify-between border-t border-slate-200 px-3 text-slate-700"></div>
      </div>
    </main>
  </div>
</div>

<!-- Row menu -->
<div id="rowMenu" hidden role="menu" class="fixed z-30 w-44 rounded-md border border-slate-200 bg-white py-1 shadow-lg"></div>

<!-- Dialog -->
<div id="dlg" hidden class="fixed inset-0 z-40 flex items-center justify-center bg-slate-900/40 p-4">
  <div role="alertdialog" aria-modal="true" aria-labelledby="dlgT" aria-describedby="dlgB" class="w-full max-w-md rounded-lg border border-slate-200 bg-white p-6 shadow-xl">
    <h2 id="dlgT" class="text-base font-semibold"></h2>
    <p id="dlgB" class="mt-2 text-slate-700"></p>
    <div class="mt-6 flex justify-end gap-2">
      <button id="dlgNo" type="button" class="h-8 rounded border border-slate-300 bg-white px-3 font-medium hover:bg-slate-50">Cancel</button>
      <button id="dlgYes" type="button" class="h-8 rounded bg-red-600 px-3 font-medium text-white hover:bg-red-700"></button>
    </div>
  </div>
</div>

<div id="toasts" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  /* ---------- Status vocabulary ---------- */
  const STATUS = {
    'Draft':     { tone: 'bg-slate-100 text-slate-700' },
    'Pending':   { tone: 'bg-blue-50 text-blue-800' },
    'Shipping':  { tone: 'bg-blue-50 text-blue-800' },
    'On hold':   { tone: 'bg-amber-50 text-amber-800' },
    'Completed': { tone: 'bg-green-50 text-green-800' },
    'Cancelled': { tone: 'bg-red-50 text-red-800' }
  };
  const STATUS_ORDER = ['Pending', 'Shipping', 'On hold', 'Completed', 'Draft', 'Cancelled'];
  const SALES = ['Nguyễn Thị Hoa', 'Trần Minh Quân', 'Lê Hoàng Nam', 'Phạm Thu Hà', 'Đặng Quốc Việt'];
  const CHANNELS = ['Direct', 'Distributor', 'E-commerce', 'Marketplace'];
  const PAYS = ['Paid', 'Partially paid', 'Unpaid', 'Overdue'];
  const CUSTOMERS = [
    ['Công ty TNHH Minh Phát', '0903 112 458'], ['Công ty CP Thương mại Đại Dương', '0912 887 301'],
    ['Siêu thị Hoàng Gia', '0938 554 219'], ['Công ty TNHH Điện máy Phương Nam', '0976 120 665'],
    ['Nhà phân phối Thành Đạt', '0908 331 742'], ['Công ty CP Nội thất Việt Á', '0987 640 118'],
    ['Cửa hàng Tiện ích An Khang', '0919 275 903'], ['Công ty TNHH Dược phẩm Hòa Bình', '0961 408 227'],
    ['Tập đoàn Xây dựng Sông Hồng', '0934 719 560'], ['Công ty TNHH Thực phẩm Đường Xanh', '0902 846 331'],
    ['Công ty CP Logistics Bến Thành', '0945 213 876'], ['Đại lý Nguyễn Văn Dũng', '0977 502 914']
  ];

  /* ---------- Deterministic mock data (96 orders) ---------- */
  let seed = 20260411;
  const rnd = () => (seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296;
  const pick = a => a[Math.floor(rnd() * a.length)];
  const ORDERS = [];
  for (let i = 0; i < 96; i++) {
    const c = pick(CUSTOMERS);
    const r = rnd();
    const status = r < 0.12 ? 'Draft' : r < 0.27 ? 'Pending' : r < 0.45 ? 'Shipping' : r < 0.52 ? 'On hold' : r < 0.9 ? 'Completed' : 'Cancelled';
    let pay = status === 'Completed' ? (rnd() < 0.85 ? 'Paid' : 'Overdue') : status === 'Cancelled' || status === 'Draft' ? 'Unpaid' : pick(['Paid', 'Partially paid', 'Unpaid', 'Unpaid']);
    const day = Math.floor(rnd() * 90);
    const d = new Date(2026, 10, 4 - day, 8 + Math.floor(rnd() * 9), Math.floor(rnd() * 60));
    const items = 1 + Math.floor(rnd() * 24);
    const total = Math.round((items * (180000 + rnd() * 2400000)) / 1000) * 1000;
    ORDERS.push({
      id: 'DH-' + (1043 - i + 0), customer: c[0], phone: c[1], status, pay,
      sales: pick(SALES), channel: pick(CHANNELS), date: d.getTime(), items, total
    });
  }

  const vnd = new Intl.NumberFormat('vi-VN');
  const nf = new Intl.NumberFormat('en-US');
  const fmtDate = ts => new Intl.DateTimeFormat('en-GB', { day: '2-digit', month: '2-digit', year: 'numeric' }).format(new Date(ts));
  const isoDay = ts => { const d = new Date(ts); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  const norm = s => String(s).normalize('NFD').replace(/\p{Diacritic}/gu, '').replace(/đ/gi, 'd').toLowerCase();
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const $ = id => document.getElementById(id);

  /* ---------- State from URL ---------- */
  const params = new URLSearchParams(location.search);
  const MOCK = params.get('state'); // empty | error | loading | null
  const SORTABLE = ['id', 'status', 'customer', 'date', 'items', 'total'];
  const S = {
    q: '', status: [], pay: '', sales: '', from: '', to: '', min: '', max: '', chan: '',
    sort: '-date', page: 1, size: 25, selected: new Set(), allMatching: false,
    loading: true, error: false, compact: false, failed: new Set()
  };
  function readUrl() {
    const p = new URLSearchParams(location.search);
    S.q = p.get('q') || '';
    S.status = p.getAll('status').filter(s => STATUS[s]);
    S.pay = PAYS.includes(p.get('pay')) ? p.get('pay') : '';
    S.sales = SALES.includes(p.get('sales')) ? p.get('sales') : '';
    S.from = /^\d{4}-\d{2}-\d{2}$/.test(p.get('from') || '') ? p.get('from') : '';
    S.to = /^\d{4}-\d{2}-\d{2}$/.test(p.get('to') || '') ? p.get('to') : '';
    S.min = /^\d+$/.test(p.get('min') || '') ? p.get('min') : '';
    S.max = /^\d+$/.test(p.get('max') || '') ? p.get('max') : '';
    S.chan = CHANNELS.includes(p.get('chan')) ? p.get('chan') : '';
    const sort = p.get('sort') || '-date';
    S.sort = SORTABLE.includes(sort.replace('-', '')) ? sort : '-date';
    S.page = Math.max(1, parseInt(p.get('page'), 10) || 1);
    S.size = [25, 50, 100].includes(parseInt(p.get('size'), 10)) ? parseInt(p.get('size'), 10) : 25;
  }
  function writeUrl(mode) {
    const p = new URLSearchParams();
    if (MOCK) p.set('state', MOCK);
    if (S.q) p.set('q', S.q);
    S.status.forEach(s => p.append('status', s));
    if (S.pay) p.set('pay', S.pay);
    if (S.sales) p.set('sales', S.sales);
    if (S.from) p.set('from', S.from);
    if (S.to) p.set('to', S.to);
    if (S.min) p.set('min', S.min);
    if (S.max) p.set('max', S.max);
    if (S.chan) p.set('chan', S.chan);
    if (S.sort !== '-date') p.set('sort', S.sort);
    if (S.page > 1) p.set('page', S.page);
    if (S.size !== 25) p.set('size', S.size);
    const qs = p.toString();
    try { history[mode === 'push' ? 'pushState' : 'replaceState'](null, '', qs ? '?' + qs : location.pathname); } catch (e) {}
  }
  function filtersChanged(mode) { S.page = 1; clearSelection(); writeUrl(mode || 'replace'); render(); }

  /* ---------- Filtering / sorting ---------- */
  function matches(o, skipStatus) {
    if (S.q) {
      const hay = norm(o.id + ' ' + o.customer + ' ' + o.phone.replace(/\s/g, '') + ' ' + o.phone);
      if (!norm(S.q).split(/\s+/).every(t => hay.includes(t))) return false;
    }
    if (!skipStatus && S.status.length && !S.status.includes(o.status)) return false;
    if (S.pay && o.pay !== S.pay) return false;
    if (S.sales && o.sales !== S.sales) return false;
    if (S.chan && o.channel !== S.chan) return false;
    if (S.from && isoDay(o.date) < S.from) return false;
    if (S.to && isoDay(o.date) > S.to) return false;
    if (S.min && o.total < +S.min) return false;
    if (S.max && o.total > +S.max) return false;
    return true;
  }
  function sorted(list) {
    const desc = S.sort.startsWith('-'), key = S.sort.replace('-', '');
    const cmp = (a, b) => {
      if (key === 'customer' || key === 'status') return a[key].localeCompare(b[key], 'vi');
      if (key === 'id') return (+a.id.slice(3)) - (+b.id.slice(3));
      return a[key] - b[key];
    };
    return list.slice().sort((a, b) => (desc ? -1 : 1) * cmp(a, b) || (+b.id.slice(3)) - (+a.id.slice(3)));
  }
  const activeCount = () => ORDERS.length;
  function hasFilters() { return !!(S.q || S.status.length || S.pay || S.sales || S.from || S.to || S.min || S.max || S.chan); }

  /* ---------- Rendering ---------- */
  function badge(s) {
    return `<span class="inline-flex h-6 items-center rounded-full px-2 text-xs font-medium ${STATUS[s].tone}">${s}</span>`;
  }
  function payText(p) {
    const c = p === 'Overdue' ? 'text-red-700 font-medium' : 'text-slate-700';
    return `<span class="${c}">${p}</span>`;
  }
  const ICON_SORT = '<svg class="h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">';
  function sortIcon(key) {
    if (S.sort === key) return ICON_SORT + '<path d="M6 15l6-6 6 6"/></svg>';
    if (S.sort === '-' + key) return ICON_SORT + '<path d="M6 9l6 6 6-6"/></svg>';
    return '<svg class="h-4 w-4 shrink-0 text-slate-500 opacity-0 group-hover:opacity-100 group-focus-visible:opacity-100" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 9l4-4 4 4M8 15l4 4 4-4"/></svg>';
  }
  function th(key, label, numeric) {
    const ariaSort = S.sort === key ? 'ascending' : S.sort === '-' + key ? 'descending' : null;
    const btnCls = 'group inline-flex items-center gap-1 font-medium ' + (numeric ? 'flex-row-reverse' : '');
    return `<th scope="col" class="h-10 px-3 font-medium ${numeric ? 'text-right' : 'text-left'}"${ariaSort ? ` aria-sort="${ariaSort}"` : ''}>
      <button type="button" data-sort="${key}" class="${btnCls}">${label} ${sortIcon(key)}</button></th>`;
  }
  const cell = S.compact ? 'py-1.5' : 'py-2.5';

  function renderHead(pageRows, allFilteredCount) {
    const sel = pageRows.filter(o => S.selected.has(o.id)).length;
    $('thead').innerHTML = `<tr class="border-b border-slate-200">
      <th scope="col" class="stk h-10 w-10 bg-slate-50 px-3"><input id="selAll" type="checkbox" aria-label="Select all rows on this page"></th>
      ${th('id', 'Order no.')}${th('status', 'Status')}${th('customer', 'Customer')}
      <th scope="col" class="h-10 px-3 text-left font-medium">Salesperson</th>
      ${th('date', 'Order date')}
      <th scope="col" class="h-10 px-3 text-left font-medium">Payment</th>
      ${th('items', 'Items', true)}${th('total', 'Total (VND)', true)}
      <th scope="col" class="h-10 w-28 px-3 text-right"><span class="sr-only">Actions</span></th></tr>`;
    const cb = $('selAll');
    cb.checked = pageRows.length > 0 && sel === pageRows.length;
    cb.indeterminate = sel > 0 && sel < pageRows.length;
    cb.disabled = pageRows.length === 0;
    cb.onchange = () => {
      pageRows.forEach(o => cb.checked ? S.selected.add(o.id) : S.selected.delete(o.id));
      if (!cb.checked) S.allMatching = false;
      renderBody(); renderBulk();
    };
  }

  function colspanRow(inner) { return `<tr><td colspan="10" class="px-3 py-14 text-center">${inner}</td></tr>`; }

  let view = { rows: [], filtered: [] };

  function render() {
    renderControls();
    const body = $('tbody');
    $('tbl').setAttribute('aria-busy', S.loading ? 'true' : 'false');
    $('tbl').classList.remove('opacity-60');

    if (S.loading) {
      renderHead([], 0);
      body.innerHTML = Array.from({ length: 9 }, () => `<tr class="border-b border-slate-100 h-10">
        <td class="px-3"><div class="sk h-4 w-4"></div></td><td class="px-3"><div class="sk h-4 w-20"></div></td><td class="px-3"><div class="sk h-5 w-20"></div></td>
        <td class="px-3"><div class="sk h-4 w-48"></div></td><td class="px-3"><div class="sk h-4 w-32"></div></td><td class="px-3"><div class="sk h-4 w-20"></div></td>
        <td class="px-3"><div class="sk h-4 w-20"></div></td><td class="px-3"><div class="sk ml-auto h-4 w-8"></div></td><td class="px-3"><div class="sk ml-auto h-4 w-24"></div></td><td class="px-3"></td></tr>`).join('');
      $('summary').innerHTML = '<span>Loading orders…</span>';
      $('pager').innerHTML = '<span>&nbsp;</span>';
      $('bulk').hidden = true; $('tabs').innerHTML = '';
      renderTabs(true);
      return;
    }
    if (S.error) {
      renderHead([], 0);
      body.innerHTML = colspanRow(`<p class="font-medium text-slate-900">Couldn't load orders</p>
        <p class="mt-1 text-slate-600">The server didn't respond. Your filters are kept.</p>
        <button type="button" id="retry" class="mt-4 h-8 rounded bg-blue-700 px-3 font-medium text-white hover:bg-blue-800">Retry</button>`);
      $('retry').onclick = () => { const p = new URLSearchParams(location.search); p.delete('state'); location.search = p.toString(); };
      $('summary').innerHTML = '<span class="text-red-700">Orders could not be loaded</span>';
      $('pager').innerHTML = '<span>&nbsp;</span>'; $('bulk').hidden = true; renderTabs(true);
      return;
    }

    const source = MOCK === 'empty' ? [] : ORDERS;
    const filtered = sorted(source.filter(o => matches(o)));
    const pages = Math.max(1, Math.ceil(filtered.length / S.size));
    if (S.page > pages) S.page = pages;
    const rows = filtered.slice((S.page - 1) * S.size, S.page * S.size);
    view = { rows, filtered };
    renderHead(rows, filtered.length);
    renderTabs(false);

    if (!rows.length) {
      if (source.length === 0) {
        body.innerHTML = colspanRow(`<p class="font-medium text-slate-900">No orders yet</p>
          <p class="mt-1 text-slate-600">Orders from every sales channel appear here once they are created.</p>
          <button type="button" class="mt-4 h-8 rounded bg-blue-700 px-3 font-medium text-white hover:bg-blue-800" data-create>Create order</button>`);
      } else {
        const term = S.q ? ` "${esc(S.q)}"` : ' these filters';
        body.innerHTML = colspanRow(`<p class="font-medium text-slate-900">No orders match${term}</p>
          <p class="mt-1 text-slate-600">Check the spelling or widen the date range.</p>
          <button type="button" id="clr2" class="mt-4 h-8 rounded border border-slate-300 bg-white px-3 font-medium hover:bg-slate-50">Clear filters</button>`);
        $('clr2').onclick = clearAll;
      }
      body.querySelectorAll('[data-create]').forEach(b => b.onclick = () => toast('Create order form would open here'));
      $('summary').innerHTML = `<span>0 orders</span>`;
      $('live').textContent = source.length ? 'No orders match' : '';
      $('pager').innerHTML = '<span>0 of 0</span>';
      $('bulk').hidden = true;
      return;
    }
    renderBody();
    const sum = filtered.reduce((a, o) => a + o.total, 0);
    $('summary').innerHTML = `<span>${nf.format(filtered.length)} orders · ${vnd.format(sum)} ₫</span>
      <span class="text-slate-600">Sorted by ${esc(sortLabel())}</span>`;
    $('live').textContent = `${filtered.length} orders match`;
    renderPager(filtered.length, pages);
    renderBulk();
  }

  function sortLabel() {
    const m = { id: 'order no.', status: 'status', customer: 'customer', date: 'order date', items: 'items', total: 'total' };
    const k = S.sort.replace('-', '');
    return m[k] + (S.sort.startsWith('-') ? ' (descending)' : ' (ascending)');
  }

  function renderBody() {
    const bulkOpen = S.selected.size > 0 || S.allMatching;
    const py = S.compact ? 'py-1' : 'py-2.5';
    $('tbody').innerHTML = view.rows.map(o => {
      const sel = S.selected.has(o.id) || S.allMatching;
      const failed = S.failed.has(o.id);
      return `<tr class="border-b border-slate-100 hover:bg-slate-50 ${sel ? 'bg-blue-50/60' : ''} ${failed ? 'bg-red-50/60' : ''}" data-row="${o.id}">
        <td class="stk px-3 ${py} ${sel ? 'bg-blue-50' : 'bg-white'}"><input type="checkbox" data-sel="${o.id}" aria-label="Select order ${o.id}" ${sel ? 'checked' : ''}></td>
        <td class="px-3 ${py} whitespace-nowrap"><a href="#" class="font-medium text-blue-700 hover:underline">${o.id}</a></td>
        <td class="px-3 ${py}">${badge(o.status)}</td>
        <td class="px-3 ${py}">${esc(o.customer)}</td>
        <td class="px-3 ${py} whitespace-nowrap text-slate-700">${esc(o.sales)}</td>
        <td class="px-3 ${py} whitespace-nowrap tabular-nums text-slate-700">${fmtDate(o.date)}</td>
        <td class="px-3 ${py} whitespace-nowrap">${payText(o.pay)}</td>
        <td class="px-3 ${py} text-right tabular-nums">${o.items}</td>
        <td class="px-3 ${py} text-right tabular-nums font-medium">${vnd.format(o.total)}</td>
        <td class="px-3 ${S.compact ? 'py-0.5' : 'py-1'}"><div class="flex items-center justify-end gap-1">
          <button type="button" data-edit="${o.id}" aria-label="Edit order ${o.id}" ${bulkOpen ? 'disabled' : ''} class="h-8 rounded px-2 font-medium text-blue-700 hover:bg-slate-100 disabled:cursor-not-allowed disabled:text-slate-500 disabled:hover:bg-transparent">Edit</button>
          <button type="button" data-menu="${o.id}" aria-haspopup="menu" aria-label="Actions for order ${o.id}" ${bulkOpen ? 'disabled' : ''} class="flex h-8 w-8 items-center justify-center rounded text-slate-700 hover:bg-slate-100 disabled:cursor-not-allowed disabled:text-slate-500 disabled:hover:bg-transparent">
            <svg class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button></div></td></tr>`;
    }).join('');
    $('tbody').querySelectorAll('[data-sel]').forEach(cb => cb.onchange = () => {
      if (S.allMatching) { S.allMatching = false; view.filtered.forEach(o => S.selected.add(o.id)); }
      cb.checked ? S.selected.add(cb.dataset.sel) : S.selected.delete(cb.dataset.sel);
      if (!cb.checked) S.allMatching = false;
      renderBody(); renderBulk();
      const pageRows = view.rows, n = pageRows.filter(o => S.selected.has(o.id)).length, all = $('selAll');
      all.checked = n === pageRows.length; all.indeterminate = n > 0 && n < pageRows.length;
    });
    $('tbody').querySelectorAll('[data-edit]').forEach(b => b.onclick = () => toast(`Editing order ${b.dataset.edit}`));
    $('tbody').querySelectorAll('[data-menu]').forEach(b => b.onclick = e => { e.stopPropagation(); openRowMenu(b); });
    const all = $('selAll');
    if (all) {
      const n = view.rows.filter(o => S.selected.has(o.id) || S.allMatching).length;
      all.checked = view.rows.length > 0 && n === view.rows.length; all.indeterminate = n > 0 && n < view.rows.length;
    }
  }

  function selCount() { return S.allMatching ? view.filtered.length : S.selected.size; }
  function renderBulk() {
    const bar = $('bulk'), n = selCount();
    if (!n) { bar.hidden = true; $('summary').classList.remove('hidden'); return; }
    bar.hidden = false;
    const pageAll = view.rows.length > 0 && view.rows.every(o => S.selected.has(o.id));
    const canAll = !S.allMatching && pageAll && view.filtered.length > view.rows.length;
    bar.innerHTML = `<span class="font-medium">${nf.format(n)} selected</span>
      ${canAll ? `<button type="button" id="selMatch" class="font-medium text-blue-700 underline hover:text-blue-800">Select all ${nf.format(view.filtered.length)} matching</button>` : ''}
      ${S.allMatching ? `<span>All ${nf.format(view.filtered.length)} matching selected</span><button type="button" id="selClear" class="font-medium text-blue-700 underline hover:text-blue-800">Clear selection</button>` : ''}
      <span class="mx-1 h-5 w-px bg-blue-200"></span>
      <button type="button" data-bulk="ship" class="h-8 rounded border border-slate-300 bg-white px-3 font-medium text-slate-900 hover:bg-slate-50">Mark as shipping</button>
      <button type="button" data-bulk="export" class="h-8 rounded border border-slate-300 bg-white px-3 font-medium text-slate-900 hover:bg-slate-50">Export selected</button>
      <button type="button" data-bulk="hold" class="h-8 rounded border border-slate-300 bg-white px-3 font-medium text-slate-900 hover:bg-slate-50">Put on hold</button>
      <button type="button" data-bulk="cancel" class="h-8 rounded border border-red-300 bg-white px-3 font-medium text-red-700 hover:bg-red-50">Cancel orders</button>
      <button type="button" id="bulkCancel" class="ml-auto h-8 rounded px-3 font-medium text-slate-800 hover:bg-blue-100">Clear selection</button>`;
    if ($('selMatch')) $('selMatch').onclick = () => { S.allMatching = true; renderBody(); renderBulk(); };
    if ($('selClear')) $('selClear').onclick = () => { clearSelection(); renderBody(); renderBulk(); };
    $('bulkCancel').onclick = () => { clearSelection(); renderBody(); renderBulk(); };
    bar.querySelectorAll('[data-bulk]').forEach(b => b.onclick = () => bulkAction(b.dataset.bulk));
  }
  function clearSelection() { S.selected.clear(); S.allMatching = false; S.failed.clear(); $('banner').innerHTML = ''; }

  function targets() { return S.allMatching ? view.filtered : ORDERS.filter(o => S.selected.has(o.id)); }
  function bulkAction(kind) {
    const list = targets(), n = list.length;
    if (kind === 'export') { toast(`Exported ${n} orders to CSV`); return; }
    if (kind === 'cancel') {
      const paid = list.filter(o => o.pay === 'Paid').length;
      confirmDlg(`Cancel ${n} orders?`, `${n} orders will be marked Cancelled.` + (paid ? ` ${paid} of them are paid and will need a refund.` : '') + ' Completed orders cannot be cancelled and will be skipped.', 'Cancel ' + n + ' orders', () => runBulk(kind, list));
      return;
    }
    runBulk(kind, list);
  }
  function runBulk(kind, list) {
    const rule = { ship: o => o.status === 'Pending', hold: o => ['Pending', 'Shipping', 'Draft'].includes(o.status), cancel: o => o.status !== 'Completed' && o.status !== 'Cancelled' };
    const next = { ship: 'Shipping', hold: 'On hold', cancel: 'Cancelled' }[kind];
    const ok = list.filter(rule[kind]), bad = list.filter(o => !rule[kind](o));
    ok.forEach(o => { o.status = next; });
    S.failed = new Set(bad.map(o => o.id));
    if (bad.length) {
      S.allMatching = false; S.selected = new Set(bad.map(o => o.id));
      $('banner').innerHTML = `<div class="mb-3 flex items-center gap-3 rounded-md border border-amber-300 bg-amber-50 px-3 py-2 text-amber-900" role="alert">
        <span><strong>${ok.length} updated, ${bad.length} failed.</strong> Failed orders aren't in a status that allows this action and stay selected.</span>
        <button type="button" id="viewFailed" class="ml-auto font-medium text-blue-800 underline">View failed (${bad.length})</button></div>`;
      $('viewFailed').onclick = () => { S.q = ''; S.status = []; render(); const f = $('tbody').querySelector('tr.bg-red-50\\/60'); if (f) f.scrollIntoView({ block: 'center' }); };
      toast(`${ok.length} orders updated, ${bad.length} failed`, 'warn');
    } else {
      clearSelection();
      toast(`${ok.length} orders updated`);
    }
    render();
  }

  function renderTabs(skeleton) {
    const base = MOCK === 'empty' ? [] : ORDERS.filter(o => matches(o, true));
    const tabs = [{ label: 'All', val: null }].concat(STATUS_ORDER.map(s => ({ label: s, val: s })));
    $('tabs').innerHTML = tabs.map(t => {
      const count = t.val ? base.filter(o => o.status === t.val).length : base.length;
      const active = t.val ? (S.status.length === 1 && S.status[0] === t.val) : S.status.length === 0;
      return `<button type="button" role="tab" aria-selected="${active}" data-tab="${t.val || ''}" class="-mb-px h-9 border-b-2 px-3 font-medium ${active ? 'border-blue-700 text-blue-700' : 'border-transparent text-slate-700 hover:text-slate-900'}">${t.label}${skeleton ? '' : ` <span class="font-normal tabular-nums ${active ? 'text-blue-700' : 'text-slate-600'}">${count}</span>`}</button>`;
    }).join('');
    $('tabs').querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { S.status = b.dataset.tab ? [b.dataset.tab] : []; S.page = 1; clearSelection(); writeUrl('push'); render(); });
  }

  function renderPager(total, pages) {
    const from = (S.page - 1) * S.size + 1, to = Math.min(total, S.page * S.size);
    const nums = [];
    for (let p = 1; p <= pages; p++) nums.push(p);
    $('pager').innerHTML = `<span class="tabular-nums">${from}–${to} of ${nf.format(total)}</span>
      <div class="flex items-center gap-3">
        <label class="flex items-center gap-2">Rows per page
          <select id="size" class="h-8 rounded border border-slate-300 bg-white px-2">${[25, 50, 100].map(n => `<option ${n === S.size ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
        <nav aria-label="Pagination" class="flex items-center gap-1">
          <button type="button" data-pg="${S.page - 1}" ${S.page === 1 ? 'disabled' : ''} class="h-8 rounded border border-slate-300 bg-white px-3 hover:bg-slate-50 disabled:cursor-not-allowed disabled:text-slate-500 disabled:hover:bg-white">Previous</button>
          ${nums.map(p => `<button type="button" data-pg="${p}" ${p === S.page ? 'aria-current="page"' : ''} class="h-8 min-w-8 rounded px-2 tabular-nums ${p === S.page ? 'bg-blue-700 font-medium text-white' : 'hover:bg-slate-100'}">${p}</button>`).join('')}
          <button type="button" data-pg="${S.page + 1}" ${S.page === pages ? 'disabled' : ''} class="h-8 rounded border border-slate-300 bg-white px-3 hover:bg-slate-50 disabled:cursor-not-allowed disabled:text-slate-500 disabled:hover:bg-white">Next</button>
        </nav></div>`;
    $('size').onchange = e => { S.size = +e.target.value; filtersChanged(); };
    $('pager').querySelectorAll('[data-pg]').forEach(b => b.onclick = () => { S.page = +b.dataset.pg; S.allMatching = false; S.selected.clear(); writeUrl('push'); render(); });
  }

  /* ---------- Filter controls + chips ---------- */
  function fmtIso(s) { const [y, m, d] = s.split('-'); return `${d}/${m}/${y}`; }
  function chipList() {
    const c = [];
    if (S.q) c.push({ k: 'q', label: `Search: ${S.q}` });
    S.status.forEach(s => c.push({ k: 'status', v: s, label: `Status: ${s}` }));
    if (S.pay) c.push({ k: 'pay', label: `Payment: ${S.pay}` });
    if (S.sales) c.push({ k: 'sales', label: `Salesperson: ${S.sales}` });
    if (S.chan) c.push({ k: 'chan', label: `Channel: ${S.chan}` });
    if (S.from || S.to) c.push({ k: 'date', label: `Order date: ${S.from ? fmtIso(S.from) : '…'} – ${S.to ? fmtIso(S.to) : '…'}` });
    if (S.min || S.max) c.push({ k: 'amt', label: `Total: ${S.min ? vnd.format(S.min) : '0'} – ${S.max ? vnd.format(S.max) : '…'} ₫` });
    return c;
  }
  function renderControls() {
    if (document.activeElement !== $('q')) $('q').value = S.q;
    $('fPay').value = S.pay;
    $('fSales').innerHTML = '<option value="">Salesperson: any</option>' + SALES.map(s => `<option ${s === S.sales ? 'selected' : ''}>${s}</option>`).join('');
    $('fStatusBtn').textContent = S.status.length ? `Status: ${S.status.length === 1 ? S.status[0] : S.status.length + ' selected'}` : 'Status';
    $('fStatusPop').innerHTML = STATUS_ORDER.map(s => `<label class="flex h-8 cursor-pointer items-center gap-2 rounded px-2 hover:bg-slate-50"><input type="checkbox" data-st="${s}" ${S.status.includes(s) ? 'checked' : ''}> ${s}</label>`).join('');
    $('fStatusPop').querySelectorAll('[data-st]').forEach(cb => cb.onchange = () => {
      S.status = STATUS_ORDER.filter(s => $('fStatusPop').querySelector(`[data-st="${s}"]`).checked); filtersChanged();
      $('fStatusPop').hidden = false; $('fStatusBtn').setAttribute('aria-expanded', 'true');
    });
    const more = [S.from || S.to, S.min || S.max, S.chan].filter(Boolean).length;
    $('fMoreBtn').textContent = more ? `More filters (${more})` : 'More filters';
    const chips = chipList();
    $('chips').innerHTML = chips.length ? chips.map((c, i) => `<span class="inline-flex h-6 items-center gap-1 rounded-full border border-slate-300 bg-white pl-2 pr-1 text-xs font-medium text-slate-800">${esc(c.label)}
        <button type="button" data-chip="${i}" aria-label="Remove filter ${esc(c.label)}" class="flex h-6 w-6 items-center justify-center rounded-full hover:bg-slate-100">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button></span>`).join('') +
      '<button type="button" id="clearAll" class="h-6 px-2 text-sm font-medium text-blue-700 hover:underline">Clear all</button>' : '';
    $('chips').querySelectorAll('[data-chip]').forEach(b => b.onclick = () => {
      const c = chips[+b.dataset.chip];
      if (c.k === 'q') S.q = ''; else if (c.k === 'status') S.status = S.status.filter(s => s !== c.v);
      else if (c.k === 'date') { S.from = ''; S.to = ''; } else if (c.k === 'amt') { S.min = ''; S.max = ''; } else S[c.k] = '';
      filtersChanged();
      const next = $('chips').querySelector('[data-chip]') || $('q'); next.focus();
    });
    if ($('clearAll')) $('clearAll').onclick = clearAll;
  }
  function clearAll() {
    S.q = ''; S.status = []; S.pay = ''; S.sales = ''; S.from = ''; S.to = ''; S.min = ''; S.max = ''; S.chan = '';
    $('q').value = ''; filtersChanged(); $('q').focus();
  }

  /* ---------- Popovers, menus, dialog, toast ---------- */
  function closePops() {
    ['fStatusPop', 'fMorePop'].forEach(id => { $(id).hidden = true; });
    $('fStatusBtn').setAttribute('aria-expanded', 'false'); $('fMoreBtn').setAttribute('aria-expanded', 'false');
    $('rowMenu').hidden = true;
  }
  $('fStatusBtn').onclick = e => { e.stopPropagation(); const open = $('fStatusPop').hidden; closePops(); $('fStatusPop').hidden = !open; $('fStatusBtn').setAttribute('aria-expanded', String(open)); };
  $('fMoreBtn').onclick = e => {
    e.stopPropagation(); const open = $('fMorePop').hidden; closePops();
    if (open) { $('mFrom').value = S.from; $('mTo').value = S.to; $('mMin').value = S.min; $('mMax').value = S.max; $('mChan').value = S.chan; }
    $('fMorePop').hidden = !open; $('fMoreBtn').setAttribute('aria-expanded', String(open));
  };
  $('fStatusPop').onclick = $('fMorePop').onclick = e => e.stopPropagation();
  $('mApply').onclick = () => {
    S.from = $('mFrom').value; S.to = $('mTo').value; S.min = $('mMin').value; S.max = $('mMax').value; S.chan = $('mChan').value;
    closePops(); filtersChanged(); $('fMoreBtn').focus();
  };
  $('mReset').onclick = () => { $('mFrom').value = ''; $('mTo').value = ''; $('mMin').value = ''; $('mMax').value = ''; $('mChan').value = ''; };
  document.addEventListener('click', closePops);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { if (!$('dlg').hidden) closeDlg(); else closePops(); }
    if (e.key === '/' && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); $('q').focus(); }
  });

  let menuFor = null;
  function openRowMenu(btn) {
    const id = btn.dataset.menu, was = menuFor === id && !$('rowMenu').hidden;
    closePops(); if (was) return;
    menuFor = id;
    const o = ORDERS.find(x => x.id === id);
    const item = (a, t, cls) => `<button type="button" role="menuitem" data-act="${a}" class="flex h-8 w-full items-center px-3 text-left hover:bg-slate-50 ${cls || 'text-slate-800'}">${t}</button>`;
    $('rowMenu').innerHTML = item('dup', 'Duplicate order') + item('print', 'Print order') + item('inv', 'Create invoice') +
      '<div class="my-1 border-t border-slate-200"></div>' +
      (o.status === 'Completed' || o.status === 'Cancelled' ? `<span class="flex h-8 items-center px-3 text-slate-600" title="Only open orders can be cancelled">Cancel order (unavailable)</span>` : item('cancel', 'Cancel order', 'text-red-700'));
    const r = btn.getBoundingClientRect();
    $('rowMenu').style.top = Math.min(r.bottom + 4, innerHeight - 190) + 'px';
    $('rowMenu').style.left = Math.max(8, r.right - 176) + 'px';
    $('rowMenu').hidden = false;
    $('rowMenu').querySelectorAll('[data-act]').forEach(b => b.onclick = () => {
      closePops();
      if (b.dataset.act === 'cancel') confirmDlg(`Cancel order ${id}?`, `${o.customer} will be notified${o.pay === 'Paid' ? ' and a refund of ' + vnd.format(o.total) + ' ₫ will be requested' : ''}. This cannot be undone.`, 'Cancel order', () => { o.status = 'Cancelled'; toast(`Order ${id} cancelled`); render(); });
      else toast({ dup: `Order ${id} duplicated as a draft`, print: `Printing order ${id}`, inv: `Invoice created for order ${id}` }[b.dataset.act]);
    });
  }

  let dlgCb = null, lastFocus = null;
  function confirmDlg(title, body, yes, cb) {
    lastFocus = document.activeElement;
    $('dlgT').textContent = title; $('dlgB').textContent = body; $('dlgYes').textContent = yes; dlgCb = cb;
    $('dlg').hidden = false; $('dlgNo').focus();
  }
  function closeDlg() { $('dlg').hidden = true; dlgCb = null; if (lastFocus) lastFocus.focus(); }
  $('dlgNo').onclick = closeDlg;
  $('dlgYes').onclick = () => { const cb = dlgCb; $('dlg').hidden = true; dlgCb = null; if (cb) cb(); };

  function toast(msg, tone) {
    const t = document.createElement('div');
    t.className = 'rounded-md border bg-white px-4 py-2 text-slate-900 shadow-lg ' + (tone === 'warn' ? 'border-amber-300' : 'border-slate-200');
    t.textContent = msg; $('toasts').appendChild(t); setTimeout(() => t.remove(), 4000);
  }

  /* ---------- Wire up ---------- */
  let qTimer;
  $('q').addEventListener('input', e => {
    clearTimeout(qTimer);
    qTimer = setTimeout(() => { const v = e.target.value.trim(); if (v.length === 1) return; S.q = v; filtersChanged(); }, 300);
  });
  $('q').addEventListener('keydown', e => { if (e.key === 'Enter') { clearTimeout(qTimer); S.q = e.target.value.trim(); filtersChanged(); } });
  $('fPay').onchange = e => { S.pay = e.target.value; filtersChanged(); };
  $('fSales').onchange = e => { S.sales = e.target.value; filtersChanged(); };
  $('thead').addEventListener('click', e => {
    const b = e.target.closest('[data-sort]'); if (!b) return;
    const k = b.dataset.sort;
    S.sort = S.sort === k ? '-' + k : S.sort === '-' + k ? '-date' : k;
    if (S.sort === '-date' && k === 'date') S.sort = 'date';
    S.page = 1; writeUrl('push'); render();
  });
  $('densBtn').onclick = () => {
    S.compact = !S.compact; $('densBtn').setAttribute('aria-pressed', S.compact);
    $('densBtn').textContent = S.compact ? 'Comfortable rows' : 'Compact rows'; renderBody();
  };
  $('btnCreate').onclick = () => toast('Create order form would open here');
  $('btnImport').onclick = () => toast('Import wizard would open here');
  $('btnExport').onclick = () => toast(`Exported ${view.filtered.length || 0} orders to CSV`);
  window.addEventListener('popstate', () => { readUrl(); clearSelection(); render(); });

  readUrl();
  if (MOCK === 'loading') { S.loading = true; render(); }
  else if (MOCK === 'error') { S.loading = false; S.error = true; render(); }
  else { S.loading = true; render(); setTimeout(() => { S.loading = false; render(); }, 450); }
})();
</script>
</body>
</html>
