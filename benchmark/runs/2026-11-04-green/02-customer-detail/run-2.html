      ${kf.map(([l, v]) => `<div><dt class="text-xs font-medium text-slate-600">${l}</dt><dd class="mt-0.5 font-medium">${v}</dd></div>`).join('')}
    </dl>
    <p class="mt-3 text-xs text-slate-600">Cập nhật lần cuối bởi ${esc(c.updatedBy)} lúc ${fmtDT(c.updatedAt)} · <a href="#tab=activity" class="${LINK}" data-action="tab" data-tab="activity" data-filter="change">Xem lịch sử thay đổi</a></p>
    <div role="tablist" aria-label="Chi tiết khách hàng" class="mt-4 flex gap-1 overflow-x-auto border-b border-slate-200">
      ${tabs.map(([k, l, n]) => `<button type="button" role="tab" id="tab-${k}" aria-selected="${S.tab === k}" aria-controls="panel" data-action="tab" data-tab="${k}"
        class="-mb-px inline-flex h-10 items-center gap-2 whitespace-nowrap border-b-2 px-3 text-sm ${S.tab === k ? 'border-blue-700 font-medium text-slate-900' : 'border-transparent text-slate-600 hover:text-slate-900'}">${l}${n != null ? `<span class="rounded-full bg-slate-100 px-1.5 text-xs font-medium text-slate-700">${n}</span>` : ''}</button>`).join('')}
    </div>`;
}

/* ============ Region plumbing ============ */
function skeletonRows(n, cols) {
  return Array.from({ length: n }, () => `<tr class="h-10 border-t border-slate-200" aria-hidden="true">${Array.from({ length: cols }, () => '<td class="px-3"><div class="h-4 w-full animate-pulse rounded bg-slate-200 motion-reduce:animate-none"></div></td>').join('')}</tr>`).join('');
}
function listSkeleton(n) {
  return `<div aria-hidden="true" class="space-y-3">${Array.from({ length: n }, () => '<div class="h-10 animate-pulse rounded bg-slate-100 motion-reduce:animate-none"></div>').join('')}</div>`;
}
function stateRow(cols, html) { return `<tr><td colspan="${cols}" class="px-3">${html}</td></tr>`; }
function errorBlock(what, key) {
  return `<div class="flex flex-col items-center gap-3 px-6 py-10 text-center" role="alert">
    <p class="flex items-center gap-2 font-medium text-red-700">${ic('alert')}Không tải được ${what}</p>
    <p class="max-w-sm text-slate-600">Kiểm tra kết nối mạng rồi thử lại. Các dữ liệu khác của khách hàng vẫn hiển thị bình thường.</p>
    <button type="button" class="${BO}" data-action="retry" data-key="${key}">${ic('refresh')}Thử lại</button></div>`;
}
function emptyBlock(title, desc, btn, action) {
  return `<div class="flex flex-col items-center gap-3 px-6 py-10 text-center"><p class="text-base font-medium">${title}</p>${desc ? `<p class="max-w-sm text-slate-600">${desc}</p>` : ''}${btn ? `<button type="button" class="${BO}" data-action="${action}">${btn}</button>` : ''}</div>`;
}

const tableShell = (head, body, foot = '') => `<div class="overflow-x-auto"><table class="w-full min-w-[640px] border-collapse text-sm"><thead class="bg-slate-50"><tr>${head}</tr></thead><tbody>${body}</tbody>${foot}</table></div>`;

function loadRegion(key) {
  const el = $('#r-' + key);
  if (!el) return;
  el.setAttribute('aria-busy', 'true');
  el.innerHTML = skeletonFor(key);
  fetchSrc(REGION_SRC[key]).then(rows => {
    cache[key] = rows;
    const e = $('#r-' + key);
    if (!e) return;
    e.setAttribute('aria-busy', 'false');
    paint(key);
  }).catch(() => {
    const e = $('#r-' + key);
    if (!e) return;
    e.setAttribute('aria-busy', 'false');
    e.innerHTML = errorFor(key);
  });
}
function skeletonFor(key) {
  if (key === 'orders') return tableShell(ordersHead(false), skeletonRows(8, 7));
  if (key === 'ov-orders') return tableShell(ordersHead(true), skeletonRows(5, 4));
  if (key === 'contacts') return tableShell(contactsHead(), skeletonRows(5, 6));
  return listSkeleton(key === 'ov-activity' ? 3 : key === 'ov-contacts' ? 3 : 6);
}
function errorFor(key) {
  const w = { orders: 'đơn hàng', 'ov-orders': 'đơn hàng gần đây', contacts: 'người liên hệ', 'ov-contacts': 'người liên hệ', activity: 'lịch sử hoạt động', 'ov-activity': 'hoạt động gần đây' }[key];
  const cols = { orders: 7, 'ov-orders': 4, contacts: 6 }[key];
  if (cols) return tableShell(key === 'contacts' ? contactsHead() : ordersHead(key === 'ov-orders'), stateRow(cols, errorBlock(w, key)));
  return errorBlock(w, key);
}
function paint(key) {
  const el = $('#r-' + key);
  if (!el || !cache[key]) return;
  el.innerHTML = { orders: paintOrders, 'ov-orders': paintOvOrders, contacts: paintContacts, 'ov-contacts': paintOvContacts, activity: paintActivity, 'ov-activity': paintOvActivity }[key]();
}
function repaintVisible() {
  $$('[data-region]').forEach(e => {
    const k = e.id.slice(2);
    if (S.mode === 'ok') cache[k] = STORE[REGION_SRC[k]].slice();
    paint(k);
  });
  renderHead();
}

/* ============ Orders ============ */
const OCOLS = [
  { k: 'id', l: 'Mã đơn' }, { k: 'date', l: 'Ngày đặt', sort: 1 }, { k: 'status', l: 'Trạng thái' }, { k: 'pay', l: 'Thanh toán' },
  { k: 'items', l: 'Số mặt hàng', r: 1 }, { k: 'total', l: 'Tổng tiền (VND)', r: 1, sort: 1 }, { k: 'act', l: '', sr: 'Thao tác' }
];
function ordersHead(mini) {
  const cols = mini ? OCOLS.filter(c => ['id', 'date', 'status', 'total'].includes(c.k)) : OCOLS;
  return cols.map(c => {
    let inner = c.l || `<span class="sr-only">${c.sr}</span>`, aria = '';
    if (!mini && c.sort) {
      const s = S.o.sort, on = s ? s.key === c.k : c.k === 'date', dir = s ? s.dir : 'desc';
      if (on) aria = ` aria-sort="${dir === 'asc' ? 'ascending' : 'descending'}"`;
      inner = `<button type="button" class="inline-flex items-center gap-1 font-medium hover:text-slate-900 ${c.r ? 'flex-row-reverse' : ''}" data-action="sort" data-key="${c.k}">${inner}${on ? ic(dir === 'asc' ? 'up' : 'down') : ''}</button>`;
    }
    return `<th scope="col"${aria} class="h-10 whitespace-nowrap px-3 text-xs font-medium text-slate-600 ${c.r ? 'text-right' : 'text-left'}">${inner}</th>`;
  }).join('');
}
function orderRow(o, mini) {
  const pt = PAY_STATUS[o.pay];
  return `<tr class="h-10 border-t border-slate-200 hover:bg-slate-50">
    <td class="whitespace-nowrap px-3"><a href="#" data-noop class="font-medium ${LINK}">${o.id}</a></td>
    <td class="whitespace-nowrap px-3 tnum">${fmtDate(o.date)}</td>
    <td class="whitespace-nowrap px-3">${badge(ORDER_STATUS[o.status], o.status)}</td>
    ${mini ? '' : `<td class="whitespace-nowrap px-3">${pt ? badge(pt, o.pay) : '<span class="text-slate-600">—</span>'}</td>
    <td class="whitespace-nowrap px-3 text-right tnum">${nf.format(o.items)}</td>`}
    <td class="whitespace-nowrap px-3 text-right tnum">${nf.format(o.total)}</td>
    ${mini ? '' : `<td class="whitespace-nowrap px-3 text-right"><button type="button" class="inline-flex size-7 items-center justify-center rounded hover:bg-slate-100" data-action="menu-order" data-menu data-id="${o.id}" aria-haspopup="menu" aria-expanded="false" aria-label="Actions for order ${o.id}">${ic('more')}</button></td>`}
  </tr>`;
}
function filteredOrders() {
  let r = cache.orders.slice();
  const q = S.o.q.trim().toLowerCase();
  if (q) r = r.filter(o => o.id.toLowerCase().includes(q));
  if (S.o.status) r = r.filter(o => o.status === S.o.status);
  const s = S.o.sort || { key: 'date', dir: 'desc' };
  r.sort((a, b) => (s.key === 'date' ? a.date - b.date : a.total - b.total) * (s.dir === 'asc' ? 1 : -1));
  return r;
}
function paintOrders() {
  const all = cache.orders, head = ordersHead(false);
  if (!all.length) return tableShell(head, stateRow(7, emptyBlock('Chưa có đơn hàng nào', 'Đơn hàng của khách hàng này sẽ hiển thị tại đây.', ic('plus') + 'Tạo đơn hàng', 'new-order')));
  const rows = filteredOrders();
  renderOrderChips();
  if (!rows.length) return tableShell(head, stateRow(7, emptyBlock('Không có đơn hàng nào khớp bộ lọc', 'Thử đổi từ khóa hoặc trạng thái.', 'Xóa bộ lọc', 'clear-orders')));
  const pages = Math.max(1, Math.ceil(rows.length / S.o.size));
  S.o.page = Math.min(S.o.page, pages);
  const from = (S.o.page - 1) * S.o.size, view = rows.slice(from, from + S.o.size);
  const foot = `<tfoot><tr class="h-10 border-t border-slate-300 bg-slate-50 font-medium"><td colspan="4" class="px-3">Tổng (${rows.length} đơn khớp)</td>
    <td class="px-3 text-right tnum">${nf.format(rows.reduce((s, o) => s + o.items, 0))}</td><td class="px-3 text-right tnum">${nf.format(rows.reduce((s, o) => s + o.total, 0))}</td><td></td></tr></tfoot>`;
  return tableShell(head, view.map(o => orderRow(o, false)).join(''), foot) + `
    <div class="flex h-10 items-center justify-between border-t border-slate-200 px-3 text-slate-600">
      <span class="tnum">${from + 1}–${from + view.length} / ${rows.length} đơn hàng</span>
      <div class="flex items-center gap-2"><span class="tnum">Trang ${S.o.page} / ${pages}</span>
        <button type="button" class="${BO} h-7 px-2" data-action="page" data-p="${S.o.page - 1}" ${S.o.page <= 1 ? 'disabled' : ''} aria-label="Trang trước">${ic('left')}</button>
        <button type="button" class="${BO} h-7 px-2" data-action="page" data-p="${S.o.page + 1}" ${S.o.page >= pages ? 'disabled' : ''} aria-label="Trang sau">${ic('right')}</button></div></div>`;
}
function paintOvOrders() {
  const head = ordersHead(true), all = cache['ov-orders'];
  if (!all.length) return tableShell(head, stateRow(4, emptyBlock('Chưa có đơn hàng nào', 'Đơn hàng của khách hàng này sẽ hiển thị tại đây.', ic('plus') + 'Tạo đơn hàng', 'new-order')));
  const rows = all.slice().sort((a, b) => b.date - a.date).slice(0, 5);
  return tableShell(head, rows.map(o => orderRow(o, true)).join(''));
}
function renderOrderChips() {
  const box = $('#o-chips');
  if (!box) return;
  const chips = [];
  if (S.o.q.trim()) chips.push(['q', `Mã đơn: ${S.o.q.trim()}`]);
  if (S.o.status) chips.push(['status', `Trạng thái: ${S.o.status}`]);
  box.innerHTML = chips.length ? chips.map(([k, l]) => `<span class="inline-flex h-6 items-center gap-1 rounded-full bg-blue-50 pl-2 pr-1 text-xs font-medium text-blue-800">${esc(l)}<button type="button" class="inline-flex size-4 items-center justify-center rounded-full hover:bg-blue-100" data-action="drop-chip" data-k="${k}" aria-label="Bỏ lọc ${esc(l)}">${ic('x', 'size-3')}</button></span>`).join('') + `<button type="button" class="text-xs ${LINK}" data-action="clear-orders">Xóa tất cả</button>` : '';
}

/* ============ Contacts ============ */
const contactsHead = () => ['Họ tên', 'Chức vụ', 'Vai trò', 'Điện thoại', 'Email', ''].map((l, i) =>
  `<th scope="col" class="h-10 whitespace-nowrap px-3 text-left text-xs font-medium text-slate-600">${l || '<span class="sr-only">Thao tác</span>'}</th>`).join('');
function contactRow(c) {
  return `<tr class="h-10 border-t border-slate-200 hover:bg-slate-50">
    <td class="whitespace-nowrap px-3"><span class="flex items-center gap-2"><span class="flex size-6 items-center justify-center rounded-full bg-slate-200 text-[11px] font-semibold text-slate-800" aria-hidden="true">${esc(initials(c.name))}</span><span class="font-medium">${esc(c.name)}</span>${c.primary ? badge('info', 'Đầu mối chính') : ''}</span></td>
    <td class="whitespace-nowrap px-3">${esc(c.position)}</td>
    <td class="whitespace-nowrap px-3">${badge('neutral', c.role)}</td>
    <td class="whitespace-nowrap px-3 tnum">${esc(c.phone)}</td>
    <td class="whitespace-nowrap px-3"><a href="mailto:${esc(c.email)}" class="${LINK}">${esc(c.email)}</a></td>
    <td class="whitespace-nowrap px-3 text-right"><span class="inline-flex items-center gap-1">
      <button type="button" class="${BO} h-7 px-2" data-action="edit-contact" data-id="${c.id}" aria-label="Sửa người liên hệ ${esc(c.name)}">Sửa</button>
      <button type="button" class="inline-flex size-7 items-center justify-center rounded hover:bg-slate-100" data-action="menu-contact" data-menu data-id="${c.id}" aria-haspopup="menu" aria-expanded="false" aria-label="Actions for contact ${esc(c.name)}">${ic('more')}</button></span></td>
  </tr>`;
}
function paintContacts() {
  const all = cache.contacts, head = contactsHead();
  if (!all.length) return tableShell(head, stateRow(6, emptyBlock('Chưa có người liên hệ', 'Thêm người liên hệ để ghi nhận đầu mối mua hàng, thanh toán và nhận hàng.', ic('plus') + 'Thêm người liên hệ', 'add-contact')));
  const q = S.c.q.trim().toLowerCase();
  const rows = all.filter(c => !q || [c.name, c.position, c.email, c.phone].join(' ').toLowerCase().includes(q))
    .sort((a, b) => (b.primary - a.primary) || a.name.localeCompare(b.name, 'vi'));
  if (!rows.length) return tableShell(head, stateRow(6, emptyBlock(`Không có người liên hệ nào khớp “${esc(S.c.q.trim())}”`, '', 'Xóa bộ lọc', 'clear-contacts')));
  return tableShell(head, rows.map(contactRow).join('')) + `<div class="flex h-10 items-center border-t border-slate-200 px-3 text-slate-600 tnum">${rows.length} / ${all.length} người liên hệ</div>`;

function paintOvContacts() {

  const rows = all.slice().sort((a, b) => b.primary - a.primary).slice(0, 3);
  return `<ul class="divide-y divide-slate-200">${rows.map(c => `<li class="py-2.5"><div class="flex items-center justify-between gap-2"><span class="font-medium">${esc(c.name)}</span>${c.primary ? badge('info', 'Đầu mối chính') : ''}</div>
    <p class="text-slate-600">${esc(c.position)}</p>
    <p class="mt-1 flex items-center gap-1.5 tnum">${ic('phone', 'size-3.5 text-slate-600')}${esc(c.phone)}</p>
    <p class="flex items-center gap-1.5 break-all">${ic('mail', 'size-3.5 text-slate-600')}<a href="mailto:${esc(c.email)}" class="${LINK}">${esc(c.email)}</a></p></li>`).join('')}</ul>`;
}

/* ============ Activity ============ */
function actItem(a) {

  const rel = relative(a.at);
  return `<li class="flex gap-3 py-3">
    <span class="mt-0.5 flex size-7 shrink-0 items-center justify-center rounded-full bg-slate-100 text-slate-700">${ic(icn)}</span>

      <p><span class="font-medium">${esc(a.actor)}</span> <span class="text-slate-600">· ${label}</span></p>

      ${a.changes ? `<ul class="mt-1.5 space-y-0.5">${a.changes.map(([f, o, n]) => `<li class="text-slate-700">${esc(f)}: <span class="text-slate-600 line-through">${esc(o)}</span> → <span class="font-medium text-slate-900">${esc(n)}</span></li>`).join('')}</ul>` : ''}
      <p class="mt-1 text-xs text-slate-600 tnum">${fmtDT(a.at)}${rel ? ` · ${rel}` : ''}</p>
    </div></li>`;
}
function paintActivity() {
  const all = cache.activity.slice().sort((a, b) => b.at - a.at);
  const cnt = k => k === 'all' ? all.length : all.filter(a => a.type === k).length;
  const f = S.actFilter;
  const bar = `<div class="mb-1 flex flex-wrap items-center gap-1.5" role="group" aria-label="Lọc hoạt động">${[['all', 'Tất cả'], ...Object.entries(ACT_TYPES).map(([k, v]) => [k, v[1]])].map(([k, l]) =>
    `<button type="button" data-action="act-filter" data-f="${k}" aria-pressed="${f === k}" class="inline-flex h-7 items-center gap-1 rounded-full border px-3 text-xs font-medium ${f === k ? 'border-blue-700 bg-blue-50 text-blue-800' : 'border-slate-300 bg-white text-slate-700 hover:bg-slate-50'}">${l}<span class="tnum">${cnt(k)}</span></button>`).join('')}</div>`;
  if (!all.length) return emptyBlock('Chưa có hoạt động nào', 'Ghi chú, cuộc gọi, email và thay đổi của khách hàng sẽ được ghi lại tại đây.', 'Thêm ghi chú', 'focus-note');
  const rows = f === 'all' ? all : all.filter(a => a.type === f);
  if (!rows.length) return bar + emptyBlock('Không có hoạt động nào thuộc loại này', '', 'Xem tất cả hoạt động', 'act-all');

function paintOvActivity() {
  const all = cache['ov-activity'].slice().sort((a, b) => b.at - a.at).slice(0, 3);

function showTab(t, filter) {

/* ============ Menu ============ */
let menuItems = [], menuBtn = null;
function closeMenu(focus) {
  const m = $('#menu');
  if (m) m.remove();
  if (menuBtn) { menuBtn.setAttribute('aria-expanded', 'false'); if (focus) menuBtn.focus(); }
  menuBtn = null;
}
function openMenu(btn, items) {
  closeMenu();
  menuItems = items; menuBtn = btn;
  btn.setAttribute('aria-expanded', 'true');
  const m = document.createElement('div');
  m.id = 'menu'; m.setAttribute('role', 'menu');
  m.className = 'fixed z-50 min-w-56 rounded-md border border-slate-200 bg-white py-1 shadow-lg';
  m.innerHTML = items.map((it, i) => it.sep ? '<div role="separator" class="my-1 border-t border-slate-200"></div>'
    : it.group ? `<p class="px-3 pb-1 pt-1.5 text-xs font-medium text-slate-600">${esc(it.group)}</p>`
    : `<button type="button" role="menuitem" data-i="${i}" ${it.disabled ? 'disabled' : ''} class="flex h-8 w-full items-center px-3 text-left text-sm hover:bg-slate-100 disabled:cursor-not-allowed disabled:text-slate-500 ${it.danger ? 'text-red-700' : 'text-slate-900'}">${esc(it.label)}</button>`).join('');
  document.body.appendChild(m);
  const r = btn.getBoundingClientRect();
  m.style.top = Math.min(r.bottom + 4, innerHeight - m.offsetHeight - 8) + 'px';
  m.style.right = Math.max(8, innerWidth - r.right) + 'px';
  const first = $('[role=menuitem]:not(:disabled)', m);
  if (first) first.focus();
}
document.addEventListener('keydown', e => {
  const m = $('#menu');
  if (!m) return;
  if (e.key === 'Escape') { e.stopPropagation(); closeMenu(true); }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    const its = $$('[role=menuitem]:not(:disabled)', m), i = its.indexOf(document.activeElement);
    its[(i + (e.key === 'ArrowDown' ? 1 : -1) + its.length) % its.length].focus();
  }
  if (e.key === 'Tab') closeMenu();
}, true);

/* ============ Toasts ============ */
function toast(msg) {
  const t = document.createElement('div');
  t.className = 'pointer-events-auto flex items-start gap-2 rounded-md border border-slate-200 bg-white p-3 shadow-lg';
  t.innerHTML = `<span class="mt-0.5 text-emerald-700">${ic('check')}</span><p class="flex-1">${esc(msg)}</p><button type="button" class="-m-1 inline-flex size-6 items-center justify-center rounded hover:bg-slate-100" aria-label="Đóng thông báo">${ic('x')}</button>`;
  $('#toasts').appendChild(t);
  let timer = setTimeout(() => t.remove(), 5000);
  t.addEventListener('mouseenter', () => clearTimeout(timer));
  t.addEventListener('mouseleave', () => { timer = setTimeout(() => t.remove(), 3000); });
  $('button', t).addEventListener('click', () => t.remove());
}

/* ============ Modal ============ */
let modalReturn = null;
function openModal(inner, { labelId, focus }) {
  closeModal(true);
  modalReturn = document.activeElement;
  const root = $('#modal-root');
  root.innerHTML = `<div class="fixed inset-0 z-50 flex items-start justify-center overflow-y-auto bg-slate-900/40 p-4 sm:pt-[8vh]" data-overlay>
    <div role="dialog" aria-modal="true" aria-labelledby="${labelId}" class="w-full max-w-[560px] rounded-lg bg-white shadow-xl" id="dlg">${inner}</div></div>`;
  const f = focus ? $(focus, root) : null;
  (f || $('input,select,textarea,button', $('#dlg'))).focus();
}
function closeModal(silent) {
  $('#modal-root').innerHTML = '';
  S.modalDirty = false;
  if (!silent && modalReturn && document.contains(modalReturn)) modalReturn.focus();
  modalReturn = null;
}
document.addEventListener('keydown', e => {
  const dlg = $('#dlg');
  if (!dlg || $('#menu')) return;
  if (e.key === 'Escape') { e.preventDefault(); const c = $('[data-dismiss]', dlg); if (c) c.click(); }
  if (e.key === 'Tab') {
    const f = $$('input,select,textarea,button,a[href]', dlg).filter(x => !x.disabled && x.offsetParent !== null);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});

function confirmDialog({ title, body, confirm, danger = true, onConfirm, infoOnly }) {
  openModal(`<div class="p-5"><h2 id="cd-t" class="text-base font-semibold">${esc(title)}</h2><p class="mt-2 text-slate-700">${body}</p></div>
    <div class="flex justify-end gap-2 border-t border-slate-200 px-5 py-3">
      ${infoOnly ? '' : `<button type="button" class="${BO}" data-dismiss id="cd-cancel">Giữ nguyên</button>`}
      <button type="button" class="${infoOnly ? BO : (danger ? BDANGER : BP)}" id="cd-ok" ${infoOnly ? 'data-dismiss' : ''}>${esc(confirm)}</button></div>`,
    { labelId: 'cd-t', focus: infoOnly ? '#cd-ok' : '#cd-cancel' });
  $$('[data-dismiss]').forEach(b => b.addEventListener('click', () => closeModal()));
  if (!infoOnly) $('#cd-ok').addEventListener('click', () => { closeModal(true); onConfirm(); });
}

/* Form dialog with blur validation, error summary, unsaved indicator */
function openForm({ title, fields, values, submitLabel, onSubmit }) {
  const errs = {}; let saving = false;
  const val = {};
  fields.forEach(f => val[f.name] = values[f.name] ?? '');
  const fieldHtml = f => {
    const common = `id="f-${f.name}" name="${f.name}" aria-describedby="e-${f.name}" ${f.required ? 'aria-required="true"' : ''}`;
    const cls = 'w-full rounded border border-slate-300 px-2 bg-white';
    let ctl;
    if (f.type === 'select') ctl = `<select ${common} class="h-8 ${cls}">${f.options.map(o => `<option ${val[f.name] === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
    else if (f.type === 'textarea') ctl = `<textarea ${common} rows="2" class="py-1.5 ${cls}">${esc(val[f.name])}</textarea>`;
    else ctl = `<input ${common} type="${f.input || 'text'}" value="${esc(val[f.name])}" class="h-8 ${cls}" ${f.ph ? `placeholder="${esc(f.ph)}"` : ''}>`;
    return `<div class="${f.wide ? 'sm:col-span-2' : ''}"><label for="f-${f.name}" class="mb-1 block text-xs font-medium text-slate-700">${esc(f.label)}${f.required ? ' <span class="text-red-700" aria-hidden="true">*</span>' : ''}</label>${ctl}<p id="e-${f.name}" class="mt-1 min-h-4 text-xs text-red-700"></p></div>`;
  };
  openModal(`<form id="frm" novalidate>
    <div class="flex items-center justify-between border-b border-slate-200 px-5 py-3"><h2 id="frm-t" class="text-base font-semibold">${esc(title)}</h2>
      <button type="button" class="inline-flex size-8 items-center justify-center rounded hover:bg-slate-100" data-dismiss aria-label="Đóng">${ic('x')}</button></div>
    <div class="px-5 py-4"><div id="frm-sum" class="mb-3 hidden rounded border border-red-300 bg-red-50 p-3 text-red-800" role="alert" tabindex="-1"></div>
      <p class="mb-3 text-xs text-slate-600">Trường có dấu <span class="text-red-700">*</span> là bắt buộc.</p>
      <div class="grid gap-x-4 gap-y-1 sm:grid-cols-2">${fields.map(fieldHtml).join('')}</div></div>
    <div id="frm-foot" class="flex items-center justify-between gap-3 border-t border-slate-200 px-5 py-3">
      <span id="frm-dirty" class="text-xs text-slate-600" role="status"></span>
      <div class="flex gap-2"><button type="button" class="${BO}" id="frm-cancel">Hủy</button>
        <button type="submit" class="${BP}" id="frm-save"><span id="frm-spin" class="hidden animate-spin">${ic('spin')}</span>${esc(submitLabel)}</button></div></div></form>`,
    { labelId: 'frm-t', focus: '#f-' + fields[0].name });
  const frm = $('#frm');
  const getV = f => $('#f-' + f.name).value;
  const check = f => {
    const v = getV(f).trim();
    if (f.required && !v) return `${f.label} là bắt buộc`;
    if (v && f.pattern && !f.pattern.test(v)) return f.msg;
    return '';
  };
  const showErr = (f, m) => {
    errs[f.name] = m;
    const inp = $('#f-' + f.name);
    $('#e-' + f.name).textContent = m;
    inp.classList.toggle('border-red-600', !!m); inp.classList.toggle('border-slate-300', !m);
    if (m) inp.setAttribute('aria-invalid', 'true'); else inp.removeAttribute('aria-invalid');
  };
  const sum = () => {
    const bad = fields.filter(f => errs[f.name]);
    const box = $('#frm-sum');
    if (bad.length >= 3) {
      box.classList.remove('hidden');
      box.innerHTML = `<p class="font-medium">Có ${bad.length} trường cần sửa</p><ul class="mt-1 list-disc pl-5">${bad.map(f => `<li><a href="#f-${f.name}" data-jump="${f.name}" class="underline">${esc(errs[f.name])}</a></li>`).join('')}</ul>`;
    } else { box.classList.add('hidden'); box.innerHTML = ''; }
  };
  frm.addEventListener('focusout', e => {
    const f = fields.find(x => 'f-' + x.name === e.target.id);
    if (f) { showErr(f, check(f)); if (!fields.some(x => errs[x.name])) sum(); }
  });
  frm.addEventListener('input', () => {
    S.modalDirty = fields.some(f => getV(f) !== String(values[f.name] ?? ''));
    $('#frm-dirty').textContent = S.modalDirty ? 'Chưa lưu thay đổi' : '';
  });
  frm.addEventListener('click', e => {
    const j = e.target.closest('[data-jump]');
    if (j) { e.preventDefault(); $('#f-' + j.dataset.jump).focus(); }
  });
  const askLeave = () => {
    if (!S.modalDirty) return closeModal();
    $('#frm-foot').innerHTML = `<span class="text-slate-800" role="alert">Bạn có thay đổi chưa lưu. Đóng và bỏ các thay đổi này?</span>
      <div class="flex gap-2"><button type="button" class="${BO}" id="lv-stay">Tiếp tục sửa</button><button type="button" class="${BDANGER}" id="lv-drop">Bỏ thay đổi</button></div>`;
    $('#lv-stay').focus();
    $('#lv-stay').addEventListener('click', () => {
      $('#frm-foot').innerHTML = `<span id="frm-dirty" class="text-xs text-slate-600" role="status">Chưa lưu thay đổi</span><div class="flex gap-2"><button type="button" class="${BO}" id="frm-cancel">Hủy</button><button type="submit" class="${BP}" id="frm-save"><span id="frm-spin" class="hidden animate-spin">${ic('spin')}</span>${esc(submitLabel)}</button></div>`;
      $('#frm-cancel').addEventListener('click', askLeave);
      $('#f-' + fields[0].name).focus();
    });
    $('#lv-drop').addEventListener('click', () => closeModal());
  };
  $('#frm-cancel').addEventListener('click', askLeave);
  $('[data-dismiss]', frm).addEventListener('click', askLeave);
  frm.addEventListener('submit', async e => {
    e.preventDefault();
    if (saving) return;
    fields.forEach(f => showErr(f, check(f)));
    sum();
    const first = fields.find(f => errs[f.name]);
    if (first) { $('#f-' + first.name).focus(); return; }
    saving = true;
    const btn = $('#frm-save'); btn.disabled = true; $('#frm-spin').classList.remove('hidden');
    const out = {}; fields.forEach(f => out[f.name] = getV(f).trim());
    try {
      await new Promise(r => setTimeout(r, 600));
      const msg = await onSubmit(out);
      closeModal(true);
      toast(msg);
    } catch (err) {
      saving = false;
      const b = $('#frm-save'); if (b) { b.disabled = false; $('#frm-spin').classList.add('hidden'); }
      const f = fields.find(x => x.name === err.field);
      if (f) { showErr(f, err.msg); $('#f-' + f.name).focus(); }
    }
  });
}
window.addEventListener('beforeunload', e => {
  if (S.modalDirty || S.noteDraft.trim()) { e.preventDefault(); e.returnValue = ''; }
});

/* ============ Forms: contact + customer ============ */
const PHONE = /^[0-9 +().-]{9,16}$/, EMAIL = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
const ROLES = ['Quyết định mua', 'Đặt hàng', 'Thanh toán', 'Nhận hàng', 'Kỹ thuật'];

      { name: 'phone', label: 'Điện thoại', required: true, pattern: PHONE, msg: 'Điện thoại chưa đúng định dạng (ví dụ 0903 412 886)', ph: '0903 412 886' },

/* ============ Event handling ============ */
document.addEventListener('click', e => {
  if (!e.target.closest('#menu') && !e.target.closest('[data-menu]')) closeMenu();
  if (e.target.closest('[data-noop]')) { e.preventDefault(); return; }
  const mi = e.target.closest('#menu [role=menuitem]');
  if (mi) { const it = menuItems[+mi.dataset.i]; closeMenu(); it && it.fn && it.fn(); return; }
  const a = e.target.closest('[data-action]');
  if (!a) return;
  const d = a.dataset;
  switch (d.action) {
    case 'sidebar': {
      const sb = $('#sidebar'), open = sb.classList.contains('hidden');
      sb.classList.toggle('hidden', !open);
      ['fixed', 'inset-y-0', 'left-0', 'z-40', 'shadow-lg'].forEach(c => sb.classList.toggle(c, open));
      a.setAttribute('aria-expanded', String(open));
      break;
    }
    case 'tab': e.preventDefault(); showTab(d.tab, d.filter); break;
    case 'retry': loadRegion(d.key); break;
    case 'sort': {
      const s = S.o.sort;
      if (!s || s.key !== d.key) S.o.sort = { key: d.key, dir: 'asc' };
      else if (s.dir === 'asc') S.o.sort = { key: d.key, dir: 'desc' };
      else S.o.sort = null;
      $('#r-orders').innerHTML = paintOrders(); break;
    }
    case 'page': S.o.page = +d.p; paint('orders'); break;
    case 'drop-chip':
      if (d.k === 'q') { S.o.q = ''; $('#o-q').value = ''; } else { S.o.status = ''; $('#o-status').value = ''; }
      S.o.page = 1; paint('orders'); break;
    case 'clear-orders': S.o.q = ''; S.o.status = ''; S.o.page = 1; $('#o-q').value = ''; $('#o-status').value = ''; paint('orders'); break;
    case 'clear-contacts': S.c.q = ''; $('#c-q').value = ''; paint('contacts'); break;
    case 'act-filter': S.actFilter = d.f; paint('activity'); break;
    case 'act-all': S.actFilter = 'all'; paint('activity'); break;
    case 'focus-note': $('#note').focus(); break;
    case 'new-order': toast('Mở biểu mẫu tạo đơn hàng cho khách hàng này (demo)'); break;
    case 'edit-customer': customerForm(); break;
    case 'add-contact': contactForm(); break;
    case 'edit-contact': contactForm(STORE.contacts.find(c => c.id === d.id)); break;
    case 'menu-account': openMenu(a, [{ label: 'Hồ sơ cá nhân', fn: () => toast('Demo: hồ sơ cá nhân') }, { label: 'Phím tắt', fn: () => toast('Demo: danh sách phím tắt') }, { sep: 1 }, { label: 'Đăng xuất', fn: () => toast('Demo: đăng xuất') }]); break;
    case 'menu-record': openMenu(a, [
      { label: 'Nhân bản khách hàng', fn: () => toast('Demo: nhân bản khách hàng') },
      { label: 'Gộp với khách hàng khác', fn: () => toast('Demo: gộp khách hàng') },
      customer.status === 'active'
        ? { label: 'Lưu trữ khách hàng', danger: true, fn: archiveCustomer }
        : { label: 'Khôi phục khách hàng', fn: restoreCustomer },
      { sep: 1 }, { group: 'Mô phỏng trạng thái dữ liệu (demo)' },
      { label: 'Dữ liệu bình thường' + (S.mode === 'ok' ? ' ✓' : ''), fn: () => setMode('ok') },
      { label: 'Các danh sách trống' + (S.mode === 'empty' ? ' ✓' : ''), fn: () => setMode('empty') },
      { label: 'Lỗi tải dữ liệu' + (S.mode === 'error' ? ' ✓' : ''), fn: () => setMode('error') }
    ]); break;
    case 'menu-order': openMenu(a, [
      { label: 'Xem chi tiết đơn ' + d.id, fn: () => toast('Demo: mở đơn ' + d.id) },
      { label: 'Nhân bản đơn hàng', fn: () => toast('Demo: nhân bản đơn ' + d.id) },
      { label: 'In phiếu giao hàng', fn: () => toast('Demo: in phiếu ' + d.id) }]); break;
    case 'menu-contact': {
      const c = STORE.contacts.find(x => x.id === d.id);
      openMenu(a, [
        { label: c.primary ? 'Đang là đầu mối chính' : 'Đặt làm đầu mối chính', disabled: c.primary, fn: () => { STORE.contacts.forEach(x => x.primary = x.id === c.id); addActivity('change', `Đặt ${c.name} làm đầu mối chính`); repaintVisible(); toast(`${c.name} là đầu mối chính`); } },
        { label: 'Gọi điện', fn: () => toast('Demo: gọi ' + c.phone) },
        { sep: 1 }, { label: 'Xóa người liên hệ', danger: true, fn: () => deleteContact(c) }]);
      break;
    }
  }
});
function setMode(m) {
  S.mode = m;
  renderHead();
  renderPanel();
}
function archiveCustomer() {
  const open = STORE.orders.filter(o => o.status === 'Chờ xác nhận' || o.status === 'Đang giao').length;
  confirmDialog({
    title: `Lưu trữ khách hàng ${customer.name}?`,
    body: `${open} đơn hàng đang xử lý vẫn được giữ và tiếp tục giao. Khách hàng sẽ bị ẩn khỏi danh sách mặc định và không thể tạo đơn mới cho đến khi khôi phục.`,
    confirm: 'Lưu trữ khách hàng',
    onConfirm: () => { customer.status = 'archived'; customer.updatedBy = CU; customer.updatedAt = nowD(); addActivity('change', 'Lưu trữ khách hàng', [['Trạng thái', 'Đang hoạt động', 'Đã lưu trữ']]); repaintVisible(); toast(`Đã lưu trữ khách hàng ${customer.name}`); }
  });
}
function restoreCustomer() {
  customer.status = 'active'; customer.updatedBy = CU; customer.updatedAt = nowD();
  addActivity('change', 'Khôi phục khách hàng', [['Trạng thái', 'Đã lưu trữ', 'Đang hoạt động']]);
  repaintVisible(); toast(`Đã khôi phục khách hàng ${customer.name}`);
}
function deleteContact(c) {
  if (c.primary) {
    confirmDialog({ title: `Không thể xóa ${c.name}`, body: `${esc(c.name)} đang là đầu mối chính của khách hàng. Hãy đặt người khác làm đầu mối chính trước, rồi xóa lại.`, confirm: 'Đã hiểu', infoOnly: true });
    return;
  }
  confirmDialog({
    title: `Xóa người liên hệ ${c.name}?`,
    body: 'Người này sẽ bị gỡ khỏi khách hàng. Các hoạt động đã ghi nhận vẫn được giữ lại trong lịch sử.',
    confirm: 'Xóa người liên hệ',
    onConfirm: () => { STORE.contacts = STORE.contacts.filter(x => x.id !== c.id); addActivity('change', `Xóa người liên hệ ${c.name}`); repaintVisible(); toast(`Đã xóa người liên hệ ${c.name}`); }
  });
}

document.addEventListener('input', e => {
  if (e.target.id === 'o-q') { S.o.q = e.target.value; S.o.page = 1; if (cache.orders) paint('orders'); }
  if (e.target.id === 'c-q') { S.c.q = e.target.value; if (cache.contacts) paint('contacts'); }
  if (e.target.id === 'note') {
    S.noteDraft = e.target.value;
    $('#note-dirty').textContent = S.noteDraft.trim() ? 'Chưa lưu thay đổi' : '';
    if (S.noteDraft.trim()) $('#note-err').textContent = '';
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'o-status') { S.o.status = e.target.value; S.o.page = 1; if (cache.orders) paint('orders'); }
});
document.addEventListener('focusout', e => {
  if (e.target.id === 'note' && !e.target.value.trim() && S.noteDraft === '' ) $('#note-err').textContent = '';
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'note-form') return;
  e.preventDefault();
  const v = $('#note').value.trim();
  if (!v) { $('#note-err').textContent = 'Nhập nội dung ghi chú trước khi lưu'; $('#note').setAttribute('aria-invalid', 'true'); $('#note').focus(); return; }
  addActivity('note', v);
  S.noteDraft = '';
  $('#note').value = ''; $('#note').removeAttribute('aria-invalid'); $('#note-dirty').textContent = '';
  S.actFilter = 'all';
  repaintVisible();
  toast(`Đã lưu ghi chú cho khách hàng ${customer.name}`);
});
document.addEventListener('keydown', e => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('#gsearch').focus(); }
  else if (e.key === '/' && !typing && !$('#dlg')) { e.preventDefault(); $('#gsearch').focus(); }
});
$('#gsearch').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.value.trim()) toast('Demo: tìm kiếm toàn hệ thống chưa được kết nối'); });
window.addEventListener('hashchange', () => {
  const m = location.hash.match(/tab=(\w+)/);
  if (m && ['overview', 'contacts', 'orders', 'activity'].includes(m[1]) && m[1] !== S.tab) showTab(m[1]);
});

/* ============ Boot ============ */
(function () {
  const m = location.hash.match(/tab=(\w+)/);
  if (m && ['overview', 'contacts', 'orders', 'activity'].includes(m[1])) S.tab = m[1];
  renderHead();
  renderPanel();
})();
</script>
</body>
</html>
