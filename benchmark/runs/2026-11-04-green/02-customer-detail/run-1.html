/* ---------- region loading ---------- */
function loadRegion(name) {
  S.reg[name] = { st:'loading' };
  paintRegion(name);
  setTimeout(() => {
    if (S.demo === 'error' && S.errOnce) { S.reg[name] = { st:'error' }; }
    else {
      const empty = S.demo === 'empty';
      if (name === 'contacts') S.contacts = empty ? [] : CONTACTS0.map(x => ({...x}));
      if (name === 'orders') S.orders = empty ? [] : ORDERS0.map(x => ({...x}));
      if (name === 'activity') S.activity = empty ? [] : ACTIVITY0.map(x => ({...x}));
      S.reg[name] = { st:'ready' };
    }
    paintRegion(name); renderTabs(); renderKeyFields();
  }, 450);
}
const loadAll = () => ['contacts','orders','activity'].forEach(loadRegion);
function paintRegion(name) {
  if (name === 'contacts') fillContacts();
  if (name === 'orders') { fillOrders(); fillRecent(); }
  if (name === 'activity') fillActivity();
}

/* ---------- toasts, menus, modals ---------- */
function toast(msg, action) {
  const n = document.createElement('div');
  n.className = 'flex items-start gap-2 rounded-md border border-slate-200 bg-white p-3 text-sm shadow-lg';
  n.innerHTML = `<span class="mt-0.5 text-green-700">${icon('check')}</span><p class="flex-1">${esc(msg)}</p>${action ? `<button class="font-medium text-blue-700 hover:underline" data-toast-action>${esc(action.label)}</button>` : ''}<button class="grid h-5 w-5 place-items-center rounded text-slate-600 hover:bg-slate-100" aria-label="Dismiss">${icon('x')}</button>`;
  let timer; const kill = () => { clearTimeout(timer); n.remove(); };
  const arm = () => { timer = setTimeout(kill, action ? 10000 : 5000); };
  n.querySelector('[aria-label="Dismiss"]').onclick = kill;
  n.querySelector('[data-toast-action]')?.addEventListener('click', () => { action.run(); kill(); });
  n.onmouseenter = () => clearTimeout(timer); n.onmouseleave = arm; n.onfocusin = () => clearTimeout(timer); n.onfocusout = arm;
  $('#toasts').appendChild(n); arm();
}
function closeMenu() { $('#menuRoot').innerHTML = ''; }
function openMenu(btn, items) {
  closeMenu();
  const r = btn.getBoundingClientRect();
  const m = document.createElement('div');
  m.setAttribute('role', 'menu'); m.setAttribute('aria-label', btn.getAttribute('aria-label'));
  m.className = 'fixed z-40 min-w-48 rounded-md border border-slate-200 bg-white py-1 text-sm shadow-lg';
  m.style.top = (r.bottom + 4) + 'px'; m.style.right = Math.max(8, window.innerWidth - r.right) + 'px';
  m.innerHTML = items.map((it, i) => it === '-' ? '<div class="my-1 border-t border-slate-200" role="separator"></div>' : `<button role="menuitem" data-mi="${i}" class="flex h-8 w-full items-center px-3 text-left hover:bg-slate-100 ${it.danger ? 'text-red-700' : ''}">${esc(it.label)}</button>`).join('');
  m.addEventListener('click', e => { const b = e.target.closest('[data-mi]'); if (!b) return; closeMenu(); btn.focus(); items[b.dataset.mi].run(); });
  m.addEventListener('keydown', e => {
    const its = [...m.querySelectorAll('[role=menuitem]')], i = its.indexOf(document.activeElement);
    if (e.key === 'ArrowDown') { e.preventDefault(); its[(i + 1) % its.length].focus(); }
    if (e.key === 'ArrowUp') { e.preventDefault(); its[(i - 1 + its.length) % its.length].focus(); }
    if (e.key === 'Escape') { closeMenu(); btn.focus(); }
  });
  $('#menuRoot').appendChild(m); m.querySelector('[role=menuitem]').focus();
}

let modalState = null;
function closeModal() {

  $('#modalRoot').innerHTML = ''; window.onbeforeunload = null;
  const f = modalState.opener; modalState = null; if (f && document.contains(f)) f.focus();
}
function dialogShell(title, bodyHtml, footHtml, wide) {
  const root = $('#modalRoot');

    <div role="dialog" aria-modal="true" aria-labelledby="dlgTitle" class="w-full ${wide ? 'max-w-lg' : 'max-w-md'} rounded-lg border border-slate-200 bg-white shadow-xl">

      ${bodyHtml}${footHtml}</div></div>`;

}
function trap(el) {
  el.addEventListener('keydown', e => {
    if (e.key === 'Escape') { e.stopPropagation(); modalState?.cancel(); }
    if (e.key !== 'Tab') return;
    const f = [...el.querySelectorAll('button:not([disabled]),input,select,textarea,a[href]')].filter(x => x.offsetParent !== null);
    if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f.at(-1).focus(); }
    else if (!e.shiftKey && document.activeElement === f.at(-1)) { e.preventDefault(); f[0].focus(); }
  });
}

function confirmDialog({ title, body, confirmLabel, cancelLabel, danger, onConfirm, onlyClose }) {
  const opener = document.activeElement;
  const el = dialogShell(title, `<div class="px-4 py-3 text-sm">${body}</div>`,
    `<div class="flex justify-end gap-2 border-t border-slate-200 px-4 py-3"><button class="${BTN_O}" data-cancel>${esc(cancelLabel || 'Cancel')}</button>${onlyClose ? '' : `<button class="${danger ? BTN_D : BTN_P}" data-ok>${esc(confirmLabel)}</button>`}</div>`);
  modalState = { opener, cancel: closeModal }; trap(el);
  el.querySelector('[data-cancel]').onclick = closeModal;
  const ok = el.querySelector('[data-ok]');
  if (ok) ok.onclick = () => { ok.disabled = true; ok.innerHTML = `${icon('loader', 'spin')}${esc(confirmLabel)}`; setTimeout(() => { closeModal(); onConfirm(); }, 500); };
  el.querySelector('[data-cancel]').focus();
}

/* form dialog: blur validation, summary at 3+ errors, unsaved changes, server errors */
function formDialog({ title, fields, values, submitLabel, onSave }) {
  const opener = document.activeElement;
  const cur = { ...values }, errs = {}; let dirty = false, saving = false;
  const body = () => `<form novalidate class="px-4 py-3" id="frm"><div id="summary"></div><div class="grid gap-3 sm:grid-cols-2">${fields.map(f => `
    <div class="${f.wide ? 'sm:col-span-2' : ''}"><label for="f-${f.id}" class="mb-1 block text-xs font-medium text-slate-800">${esc(f.label)}${f.required ? ' <span class="text-red-700" aria-hidden="true">*</span>' : ''}</label>
    ${f.type === 'select' ? `<select id="f-${f.id}" name="${f.id}" class="${INPUT}" ${f.required ? 'aria-required="true"' : ''}>${f.options.map(o => `<option ${cur[f.id] === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`
      : f.type === 'textarea' ? `<textarea id="f-${f.id}" name="${f.id}" rows="4" class="${INPUT} h-auto py-1.5">${esc(cur[f.id])}</textarea>`
      : `<input id="f-${f.id}" name="${f.id}" type="${f.type || 'text'}" ${f.inputmode ? `inputmode="${f.inputmode}"` : ''} value="${esc(cur[f.id])}" class="${INPUT}" ${f.required ? 'aria-required="true"' : ''} aria-describedby="e-${f.id}">`}
    <p id="e-${f.id}" class="mt-1 min-h-0 text-xs text-red-700"></p></div>`).join('')}</div></form>`;
  const foot = `<div class="sticky bottom-0 flex items-center justify-end gap-3 rounded-b-lg border-t border-slate-200 bg-white px-4 py-3"><span id="dirty" class="mr-auto hidden text-sm text-slate-600">Unsaved changes</span><button class="${BTN_O}" data-cancel type="button">Cancel</button><button class="${BTN_P}" data-save type="button">${esc(submitLabel)}</button></div>`;
  const el = dialogShell(title, body(), foot, true);
  const cancel = () => { if (saving) return; if (dirty && !confirm('Discard unsaved changes?')) return; closeModal(); };
  modalState = { opener, cancel }; trap(el);
  const get = id => el.querySelector('#f-' + id);
  const paintErr = id => { const p = el.querySelector('#e-' + id), i = get(id); p.textContent = errs[id] || ''; i.setAttribute('aria-invalid', errs[id] ? 'true' : 'false'); i.classList.toggle('border-red-600', !!errs[id]); };
  const check = f => {
    const v = String(cur[f.id] ?? '').trim(); let m = '';
    if (f.required && !v) m = `${f.label} is required.`;
    else if (v && f.id === 'email' && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) m = 'Enter a valid email address, like name@company.vn.';
    else if (v && f.type === 'number' && (isNaN(+v) || +v < 0)) m = `${f.label} must be a positive number.`;
    else if (v && f.id === 'taxCode' && !/^\d{10}(-\d{3})?$/.test(v)) m = 'Tax code has 10 digits, optionally followed by -000.';
    if (m) errs[f.id] = m; else delete errs[f.id]; paintErr(f.id); return !m;
  };
  fields.forEach(f => {
    const i = get(f.id);
    i.addEventListener('input', () => { cur[f.id] = i.value; if (!dirty) { dirty = true; el.querySelector('#dirty').classList.remove('hidden'); window.onbeforeunload = e => { e.preventDefault(); e.returnValue = ''; }; } if (errs[f.id]) check(f); });
    i.addEventListener('blur', () => check(f));
  });
  el.querySelector('[data-cancel]').onclick = cancel;
  const save = el.querySelector('[data-save]');
  const submit = async () => {
    if (saving) return;
    const bad = fields.filter(f => !check(f));
    const sm = el.querySelector('#summary');
    if (bad.length >= 3) {
      sm.innerHTML = `<div role="alert" class="mb-3 rounded border border-red-200 bg-red-50 p-3 text-sm text-red-800"><p class="font-medium">${bad.length} fields need attention</p><ul class="mt-1 list-disc pl-5">${bad.map(f => `<li><a href="#f-${f.id}" class="underline" data-jump="${f.id}">${esc(errs[f.id])}</a></li>`).join('')}</ul></div>`;
      sm.querySelectorAll('[data-jump]').forEach(a => a.onclick = e => { e.preventDefault(); get(a.dataset.jump).focus(); });
    } else sm.innerHTML = '';
    if (bad.length) { get(bad[0].id).focus(); return; }
    saving = true; save.disabled = true; save.innerHTML = `${icon('loader', 'spin')}${esc(submitLabel)}`;
    const res = await onSave({ ...cur });
    saving = false; save.disabled = false; save.textContent = submitLabel;
    if (res && res.errors) { Object.assign(errs, res.errors); Object.keys(res.errors).forEach(paintErr); get(Object.keys(res.errors)[0]).focus(); return; }
    dirty = false; closeModal();
  };
  save.onclick = submit;
  el.querySelector('#frm').addEventListener('submit', e => { e.preventDefault(); submit(); });
  el.querySelector('#frm').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); submit(); } });
  get(fields[0].id).focus();
}
const delay = ms => new Promise(r => setTimeout(r, ms));

/* ---------- actions ---------- */
const ROLES = ['Decision maker','Billing','Delivery','Technical'];
function contactForm(c) {
  const isNew = !c;
  formDialog({
    title: isNew ? 'Add contact' : `Edit contact ${c.name}`, submitLabel: isNew ? 'Add contact' : 'Save contact',
    fields: [
      { id:'name', label:'Full name', required:true, wide:true }, { id:'title', label:'Job title' },
      { id:'role', label:'Role', type:'select', options:ROLES, required:true },
      { id:'email', label:'Email', type:'email', required:true }, { id:'phone', label:'Phone', inputmode:'tel' }
    ],
    values: c ? { ...c } : { name:'', title:'', role:'Decision maker', email:'', phone:'' },
    onSave: async v => {
      await delay(700);
      const dup = S.contacts.find(x => x.email.toLowerCase() === v.email.trim().toLowerCase() && (!c || x.id !== c.id));
      if (dup) return { errors: { email: `A contact with this email already exists (${dup.name}).` } };
      if (c) Object.assign(S.contacts.find(x => x.id === c.id), { name:v.name.trim(), title:v.title.trim(), role:v.role, email:v.email.trim(), phone:v.phone.trim() });
      else S.contacts.push({ id:'c' + Date.now(), name:v.name.trim(), title:v.title.trim(), role:v.role, email:v.email.trim(), phone:v.phone.trim(), primary:!S.contacts.length, last:'2026-11-04' });
      fillContacts(); renderTabs(); toast(`Contact ${v.name.trim()} saved`);
    }
  });
}
function customerForm() {
  formDialog({
    title: 'Edit customer', submitLabel: 'Save customer',
    fields: [
      { id:'name', label:'Customer name', required:true, wide:true }, { id:'taxCode', label:'Tax code', required:true },
      { id:'owner', label:'Account owner', type:'select', options:['Nguyễn Thu Hà','Lê Văn Tuấn','Phạm Thanh Sơn'], required:true },
      { id:'terms', label:'Payment terms', type:'select', options:['Net 15','Net 30','Net 45','Prepaid'] },
      { id:'creditLimit', label:'Credit limit (VND)', type:'number', required:true, inputmode:'numeric' },
      { id:'notes', label:'Notes', type:'textarea', wide:true }
    ],
    values: { name:CUSTOMER.name, taxCode:CUSTOMER.taxCode, owner:CUSTOMER.owner, terms:CUSTOMER.terms, creditLimit:CUSTOMER.creditLimit, notes:CUSTOMER.notes },
    onSave: async v => {
      await delay(700);
      Object.assign(CUSTOMER, { name:v.name.trim(), taxCode:v.taxCode.trim(), owner:v.owner, terms:v.terms, creditLimit:+v.creditLimit, notes:v.notes.trim() });
      $('#recName').textContent = CUSTOMER.name; $('#moreBtn').setAttribute('aria-label', 'More actions for ' + CUSTOMER.name);
      document.title = CUSTOMER.name + ' – Customers – Northwind CRM';
      renderKeyFields(); setTab(S.tab, false); toast(`Customer ${CUSTOMER.name} saved`);
    }
  });
}
function noteForm() {
  formDialog({ title:'Add note', submitLabel:'Add note', fields:[{ id:'note', label:'Note', type:'textarea', required:true, wide:true }], values:{ note:'' },
    onSave: async v => { await delay(500); S.activity.unshift({ t:'2026-11-04T15:58', who:'Nguyễn Hạnh', kind:'note', text:'added a note', detail:v.note.trim() }); fillActivity(); toast('Note added to Công ty TNHH Minh Phát'); } });
}
function newOrder() { toast('Draft order created for ' + CUSTOMER.name); }
function removeContact(c) {
  confirmDialog({ title:`Remove contact ${c.name}?`, body:`${esc(c.name)} will no longer be linked to ${esc(CUSTOMER.name)}${c.primary ? ' and the customer will have no primary contact' : ''}. Order and activity history that mention this contact is kept.`,
    confirmLabel:'Remove contact', cancelLabel:'Keep contact', danger:true,
    onConfirm: () => { S.contacts = S.contacts.filter(x => x.id !== c.id); fillContacts(); renderTabs(); toast(`Contact ${c.name} removed`); } });
}
function deleteCustomer() {
  const open = S.orders.filter(o => o.status === 'Confirmed' || o.status === 'Shipping');
  if (open.length) {
    confirmDialog({ title:`Can't delete ${CUSTOMER.name}`, body:`${open.length} orders are still open (${open.map(o => o.no).join(', ')}). Complete or cancel them first, or archive the customer instead.`, cancelLabel:'Close', onlyClose:true });
    return;
  }
  confirmDialog({ title:`Delete customer ${CUSTOMER.name}?`, body:`This permanently deletes ${S.contacts.length} contacts and ${S.activity.length} activity entries. ${S.orders.length} orders are kept for accounting but lose their customer link.`, confirmLabel:'Delete customer', cancelLabel:'Keep customer', danger:true, onConfirm:() => toast('Customer deleted') });
}
function archiveCustomer() {
  S.archived = true; renderStatus();
  toast(`Customer ${CUSTOMER.name} archived`, { label:'Undo', run:() => { S.archived = false; renderStatus(); toast('Archive undone'); } });
}
const headerMenu = () => [
  { label:'Log a call', run:() => noteForm() }, { label:'Merge duplicates', run:() => toast('No duplicate customers found') },
  { label:'Export customer data', run:() => toast('Export started. You will be notified when it is ready.') }, '-',
  { label: S.archived ? 'Unarchive customer' : 'Archive customer', run:() => S.archived ? (S.archived = false, renderStatus(), toast('Customer unarchived')) : archiveCustomer() },
  { label:'Delete customer', danger:true, run:deleteCustomer }
];

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target;
  if (!t.closest('#menuRoot')) closeMenu();
  const q = s => t.closest(s);
  let b;
  if ((b = q('[data-tab]'))) return setTab(b.dataset.tab);
  if ((b = q('[data-retry]'))) { S.errOnce = false; return loadRegion(b.dataset.retry); }
  if ((b = q('[data-act]'))) { const a = b.dataset.act; return ({ addContact:() => contactForm(), newOrder, addNote:noteForm })[a](); }
  if ((b = q('[data-sort]'))) { const k = b.dataset.sort; if (S.osort.k === k) S.osort.dir *= -1; else S.osort = { k, dir: k === 'date' ? -1 : 1 }; S.opage = 1; return fillOrders(); }
  if ((b = q('[data-page]'))) { S.opage += +b.dataset.page; return fillOrders(); }
  if ((b = q('[data-rmchip]'))) { if (b.dataset.rmchip === 'q') S.oq = ''; else S.ostatus = ''; S.opage = 1; return renderOrders(); }
  if (q('[data-clear-orders]')) { S.oq = ''; S.ostatus = ''; S.opage = 1; return renderOrders(); }
  if (q('[data-clear-contacts]')) { S.cq = ''; return renderContacts(); }
  if (q('[data-clear-activity]')) { S.afilter = 'all'; return renderActivity(); }
  if (q('[data-more-activity]')) { S.ashown += 8; return fillActivity(); }
  if ((b = q('[data-cedit]'))) return contactForm(S.contacts.find(c => c.id === b.dataset.cedit));
  if ((b = q('[data-cmenu]'))) { const c = S.contacts.find(x => x.id === b.dataset.cmenu); e.stopPropagation();
    return openMenu(b, [{ label:'Set as primary contact', run:() => { S.contacts.forEach(x => x.primary = x.id === c.id); fillContacts(); toast(`${c.name} is now the primary contact`); } }, { label:'Copy email', run:() => { navigator.clipboard?.writeText(c.email); toast('Email copied'); } }, '-', { label:'Remove contact', danger:true, run:() => removeContact(c) }]); }
  if ((b = q('[data-reorder]'))) return toast(`Draft order created from ${b.dataset.reorder}`);
  if ((b = q('[data-omenu]'))) { const o = S.orders.find(x => x.no === b.dataset.omenu); e.stopPropagation();
    return openMenu(b, [{ label:'Download invoice', run:() => toast(`Invoice for ${o.no} downloaded`) }, { label:'Copy order number', run:() => { navigator.clipboard?.writeText(o.no); toast('Order number copied'); } }, { label:'Print delivery note', run:() => toast(`Delivery note for ${o.no} sent to printer`) }]); }
  if ((b = q('[data-order]'))) { e.preventDefault(); return; }
  if ((b = q('[data-adj]'))) return toast(`${b.dataset.adj} customer isn't available in this demo list.`);
  if (q('#moreBtn')) { e.stopPropagation(); return openMenu($('#moreBtn'), headerMenu()); }
  if (q('#editBtn')) return customerForm();
  if (q('#histLink')) { e.preventDefault(); return setTab('activity'); }
  if (q('#userBtn')) { e.stopPropagation(); return openMenu($('#userBtn'), [{ label:'Nguyễn Hạnh · hanh@northwind.vn', run:() => {} }, { label:'Profile', run:() => {} }, { label:'Keyboard shortcuts', run:() => {} }, '-', { label:'Sign out', run:() => toast('Signed out (demo)') }]); }
  if (q('#collapseBtn')) { const a = $('#sidebar'); const c = a.classList.toggle('collapsed'); q('#collapseBtn').setAttribute('aria-expanded', !c); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'oq') { S.oq = e.target.value; S.opage = 1; fillOrders(); }
  if (e.target.id === 'cq') { S.cq = e.target.value; fillContacts(); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'ostatus') { S.ostatus = e.target.value; S.opage = 1; fillOrders(); }
  if (e.target.id === 'afilter') { S.afilter = e.target.value; S.ashown = 8; fillActivity(); }
  if (e.target.id === 'demoState') { S.demo = e.target.value; S.errOnce = S.demo === 'error'; S.cq = S.oq = S.ostatus = ''; loadAll(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeMenu();
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('#gsearch').focus(); }
  if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) && !modalState) { e.preventDefault(); ($('#oq') || $('#cq') || $('#gsearch')).focus(); }
});
$('#tabs').addEventListener('keydown', e => {
  const k = TABS.map(t => t[0]), i = k.indexOf(S.tab);
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.preventDefault(); setTab(k[(i + (e.key === 'ArrowRight' ? 1 : k.length - 1)) % k.length]); $('#tab-' + S.tab).focus(); }
});

/* ---------- boot ---------- */
(function boot() {
  const groups = [
    ['Sales', [['Customers','building',true],['Contacts','users'],['Orders','cart'],['Quotes','file'],['Products','tag']]],
    ['Finance', [['Invoices','file'],['Payments','card']]],
    ['Insights', [['Reports','chart'],['Settings','cog']]]
  ];
  $('#nav').innerHTML = groups.map(([g, items]) => `<div class="flex flex-col gap-0.5"><p class="grp-label px-2 py-1 text-xs font-medium text-slate-600">${g}</p>${items.map(([l, ic, on]) =>
    `<a href="#" ${on ? 'aria-current="page"' : ''} title="${l}" class="flex h-8 items-center gap-2 rounded px-2 text-slate-700 hover:bg-slate-200 ${on ? 'bg-slate-200 font-medium text-slate-900' : ''}">${icon(ic, 'shrink-0')}<span class="nav-label">${l}</span></a>`).join('')}</div>`).join('');
  hydrateIcons();
  renderStatus(); renderKeyFields(); renderTabs();
  const m = location.hash.match(/tab=(\w+)/);
  setTab(m && TABS.some(t => t[0] === m[1]) ? m[1] : 'overview', false);
  loadAll();
})();
window.addEventListener('hashchange', () => { const m = location.hash.match(/tab=(\w+)/); if (m && TABS.some(t => t[0] === m[1]) && m[1] !== S.tab) setTab(m[1], false); });
</script>
</body>
