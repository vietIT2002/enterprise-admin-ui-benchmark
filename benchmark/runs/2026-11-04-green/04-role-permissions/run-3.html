<script>
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TZ = 'Asia/Ho_Chi_Minh';
const fmtDate = iso => new Intl.DateTimeFormat('en-GB', {day:'2-digit',month:'2-digit',year:'numeric',timeZone:TZ}).format(new Date(iso));
const fmt = iso => fmtDate(iso) + ' ' + new Intl.DateTimeFormat('en-GB', {hour:'2-digit',minute:'2-digit',hourCycle:'h23',timeZone:TZ}).format(new Date(iso));
const nf = new Intl.NumberFormat('en-US');
const plural = (n, w) => `${nf.format(n)} ${w}${n === 1 ? '' : 's'}`;

const P = {
  more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',
  lock:'<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  plus:'<path d="M5 12h14M12 5v14"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>',
  alert:'<path d="m21.7 18-8-14a2 2 0 0 0-3.4 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3Z"/><path d="M12 9v4M12 17h.01"/>',
  copy:'<rect x="8" y="8" width="14" height="14" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  circle:'<circle cx="12" cy="12" r="9"/>',
  shield:'<path d="M20 13c0 5-3.5 7.5-8 9-4.5-1.5-8-4-8-9V5l8-3 8 3z"/>',
  users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',
  file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h8"/>',
  cart:'<circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2 3h3l2.7 12.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 7H6"/>',
  history:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l4 2"/>',
  sliders:'<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',
  trash:'<path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
};
const ic = (n, cls = '') => `<svg class="shrink-0 ${cls}" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;
const spinner = '<svg class="animate-spin" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-opacity=".3" stroke-width="3"/><path d="M21 12a9 9 0 0 0-9-9" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>';

const FOCUS = 'focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-700';
const BTN = `inline-flex h-8 items-center justify-center gap-1.5 rounded px-3 text-sm font-medium disabled:cursor-not-allowed disabled:opacity-60 ${FOCUS}`;
const KIND = {
  primary: 'bg-blue-700 text-white hover:bg-blue-800',
  outline: 'border border-slate-300 bg-white text-slate-900 hover:bg-slate-50',
  danger: 'bg-red-700 text-white hover:bg-red-800',
};
const ICONBTN = `inline-flex h-8 w-8 items-center justify-center rounded text-slate-700 hover:bg-slate-100 ${FOCUS}`;

/* ---------- data ---------- */
const ACTIONS = [['v','View'],['c','Create'],['e','Edit'],['d','Delete'],['a','Approve']];
const AN = Object.fromEntries(ACTIONS);
const MODULES = [
  {id:'orders',name:'Orders',group:'Sales',acts:'vceda'},
  {id:'customers',name:'Customers',group:'Sales',acts:'vced'},
  {id:'quotes',name:'Quotes',group:'Sales',acts:'vceda'},
  {id:'invoices',name:'Invoices',group:'Finance',acts:'vceda'},
  {id:'payments',name:'Payments',group:'Finance',acts:'vceda'},
  {id:'expenses',name:'Expense reports',group:'Finance',acts:'vceda'},
  {id:'products',name:'Products',group:'Inventory',acts:'vced'},
  {id:'transfers',name:'Stock transfers',group:'Inventory',acts:'vceda'},
  {id:'employees',name:'Employees',group:'People',acts:'vced'},
  {id:'payroll',name:'Payroll',group:'People',acts:'vea'},
  {id:'users',name:'Users',group:'Administration',acts:'vced'},
  {id:'roles',name:'Roles',group:'Administration',acts:'vced'},
  {id:'settings',name:'Settings',group:'Administration',acts:'ve'},
];
const MOD = Object.fromEntries(MODULES.map(m => [m.id, m]));
const GROUPS = [...new Set(MODULES.map(m => m.group))];
const HIGH = new Set(['invoices','payments','expenses','payroll','employees']); // money and personal data
const ME = 'Nguyễn An';
const FULL = Object.fromEntries(MODULES.map(m => [m.id, m.acts]));
const toSet = spec => Object.fromEntries(MODULES.map(m => [m.id, new Set([...(spec[m.id] || '')].filter(c => m.acts.includes(c)))]));
const cloneP = p => Object.fromEntries(Object.entries(p).map(([k, v]) => [k, new Set(v)]));
const H = (at, by, what, diffs = []) => ({at, by, what, diffs});

const ROLES = [
  {id:'owner',name:'Owner',type:'System',users:2,desc:'Full control of the organisation, billing and security.',
   lockWhy:'so the account always has an administrator.',spec:FULL,by:'System',at:'2026-01-12T01:00:00Z',
   hist:[H('2026-01-12T01:00:00Z','System','Created')]},
  {id:'admin',name:'Administrator',type:'System',users:4,desc:'Manages users, settings and day-to-day configuration. Cannot change payroll.',
   lockWhy:'so someone can always manage users and settings.',spec:{...FULL,payroll:'v',employees:'vce'},by:'System',at:'2026-01-12T01:00:00Z',
   hist:[H('2026-01-12T01:00:00Z','System','Created')]},
  {id:'finance',name:'Finance manager',type:'Custom',users:3,desc:'Approves invoices, payments and expense reports.',
   spec:{orders:'v',customers:'v',quotes:'v',invoices:'vceda',payments:'vceda',expenses:'vceda',products:'v',payroll:'v'},by:'Lê Hoa',at:'2026-10-28T08:15:00Z',
   hist:[H('2026-10-28T08:15:00Z','Lê Hoa','Updated 2 permissions',['Expense reports – Approve: off → on','Payroll – View: off → on']),H('2026-03-02T03:00:00Z','Nguyễn An','Created')]},
  {id:'accountant',name:'Accountant',type:'Custom',users:6,desc:'Records invoices, payments and expenses. Cannot approve.',
   spec:{orders:'v',customers:'v',invoices:'vce',payments:'vce',expenses:'vce'},by:'Trần Minh Quân',at:'2026-09-14T02:40:00Z',
   hist:[H('2026-09-14T02:40:00Z','Trần Minh Quân','Updated 1 permission',['Payments – Edit: off → on']),H('2026-03-02T03:05:00Z','Nguyễn An','Created')]},
  {id:'salesmgr',name:'Sales manager',type:'Custom',users:5,desc:'Runs the sales team and approves orders and quotes.',
   spec:{orders:'vceda',customers:'vced',quotes:'vceda',invoices:'v',products:'v',transfers:'v'},by:'Nguyễn An',at:'2026-08-21T07:20:00Z',
   hist:[H('2026-08-21T07:20:00Z','Nguyễn An','Updated 1 permission',['Quotes – Approve: off → on']),H('2026-03-02T03:10:00Z','Nguyễn An','Created')]},
  {id:'salesstaff',name:'Sales staff',type:'Custom',users:12,desc:'Creates orders and quotes and maintains customer records.',
   spec:{orders:'vce',customers:'vce',quotes:'vce',invoices:'v',products:'v'},by:'Lê Hoa',at:'2026-11-03T09:14:00Z',
   hist:[H('2026-11-03T09:14:00Z','Lê Hoa','Updated 1 permission',['Orders – Delete: on → off']),H('2026-03-02T03:15:00Z','Nguyễn An','Created')]},
  {id:'warehouse',name:'Warehouse clerk',type:'Custom',users:9,desc:'Receives goods, prepares transfers and updates stock.',
   spec:{orders:'v',products:'vce',transfers:'vce'},by:'Phạm Quốc Bảo',at:'2026-07-09T04:00:00Z',
   hist:[H('2026-07-09T04:00:00Z','Phạm Quốc Bảo','Updated 1 permission',['Stock transfers – Create: off → on']),H('2026-03-02T03:20:00Z','Nguyễn An','Created')]},
  {id:'hr',name:'HR specialist',type:'Custom',users:2,desc:'Maintains employee records and reviews payroll.',
   spec:{employees:'vce',payroll:'ve',users:'v'},by:'Nguyễn An',at:'2026-06-30T06:45:00Z',
   hist:[H('2026-06-30T06:45:00Z','Nguyễn An','Updated 1 permission',['Payroll – Edit: off → on']),H('2026-03-02T03:25:00Z','Nguyễn An','Created')]},
];
ROLES.forEach(r => r.perms = toSet(r.spec));

const state = {
  roles: ROLES, selectedId: 'finance', draft: null, query: '', tab: 'all',
  phase: 'loading', loaded: false, refreshError: false, saving: false,
};
state.draft = cloneP(ROLES.find(r => r.id === 'finance').perms);

const cur = () => state.roles.find(r => r.id === state.selectedId);
const isLocked = r => r && r.type === 'System';
const allCells = (mods) => mods.flatMap(m => [...m.acts].map(a => [m.id, a]));

function changes() {
  const r = cur(); if (!r || !state.draft) return [];
  const out = [];
  MODULES.forEach(m => [...m.acts].forEach(a => {
    const was = r.perms[m.id].has(a), now = state.draft[m.id].has(a);
    if (was !== now) out.push({m, a, now});
  }));
  return out;
}
const dirty = () => !isLocked(cur()) && changes().length > 0;
const chText = c => `${c.m.name} – ${AN[c.a]}: ${c.now ? 'off → on' : 'on → off'}`;

/* ---------- small UI parts ---------- */
function typeBadge(r) {
  return `<span class="inline-flex h-6 items-center gap-1 rounded-full bg-slate-100 px-2 text-xs font-medium text-slate-700">${ic(r.type === 'System' ? 'lock' : 'circle')}${r.type}</span>`;
}
function toast(msg) {
  const t = document.createElement('div');
  t.className = 'flex items-center gap-2 rounded-md bg-slate-900 px-4 py-2.5 text-sm text-white shadow-lg';
  t.innerHTML = ic('check') + `<span>${esc(msg)}</span>`;
  $('#toasts').append(t);
  setTimeout(() => t.remove(), 4000);
}
let menuItems = [], menuBtn = null;
function closeMenu() { const m = $('#menu'); if (m) m.remove(); if (menuBtn) menuBtn.setAttribute('aria-expanded', 'false'); menuBtn = null; }
function openMenu(btn, items) {
  closeMenu(); menuItems = items; menuBtn = btn; btn.setAttribute('aria-expanded', 'true');
  const r = btn.getBoundingClientRect(), m = document.createElement('div');
  m.id = 'menu'; m.setAttribute('role', 'menu');
  m.className = 'fixed z-40 w-64 rounded-md border border-slate-200 bg-white py-1 shadow-lg';
  m.style.top = (r.bottom + 4) + 'px'; m.style.right = Math.max(8, innerWidth - r.right) + 'px';
  m.innerHTML = items.map((it, i) => `<button type="button" role="menuitem" data-mi="${i}" ${it.reason ? 'disabled' : ''} class="flex w-full flex-col items-start px-3 py-1.5 text-left ${it.reason ? 'cursor-not-allowed text-slate-600' : (it.danger ? 'text-red-700 hover:bg-red-50' : 'text-slate-900 hover:bg-slate-100')} ${FOCUS}"><span class="flex items-center gap-2">${it.icon ? ic(it.icon) : ''}${esc(it.label)}</span>${it.reason ? `<span class="text-xs text-slate-600">${esc(it.reason)}</span>` : ''}</button>`).join('');
  document.body.append(m);
  const first = m.querySelector('button:not([disabled])'); if (first) first.focus();
}

function dialog({title, body, actions, focus, wide}) {
  const prev = document.activeElement;
  const ov = document.createElement('div');
  ov.className = 'fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 p-4';
  const id = 'dlg' + Math.random().toString(36).slice(2, 7);
  ov.innerHTML = `<div role="dialog" aria-modal="true" aria-labelledby="${id}" class="max-h-[90vh] w-full ${wide ? 'max-w-2xl' : 'max-w-md'} overflow-y-auto rounded-lg bg-white shadow-xl">
    <div class="p-4"><h2 id="${id}" class="text-base font-semibold">${esc(title)}</h2><div class="mt-2 text-slate-700">${body}</div></div>
    <div class="flex justify-end gap-2 border-t border-slate-200 p-3">${actions.map((a, i) => `<button type="button" data-di="${i}" id="${a.id || ''}" class="${BTN} ${KIND[a.kind || 'outline']}">${esc(a.label)}</button>`).join('')}</div></div>`;
  const close = () => { ov.remove(); document.removeEventListener('keydown', onKey, true); if (prev && prev.focus && document.contains(prev)) prev.focus(); };
  const onKey = e => {
    if (e.key === 'Escape') { e.stopPropagation(); close(); }
    if (e.key === 'Tab') {
      const f = [...ov.querySelectorAll('button,input,select,textarea,a[href]')].filter(x => !x.disabled);
      if (!f.length) return;
      const a = f[0], z = f[f.length - 1];
      if (e.shiftKey && document.activeElement === a) { e.preventDefault(); z.focus(); }
      else if (!e.shiftKey && document.activeElement === z) { e.preventDefault(); a.focus(); }
    }
  };
  document.addEventListener('keydown', onKey, true);
  ov.addEventListener('click', e => {
    const b = e.target.closest('[data-di]');
    if (e.target === ov) return close();
    if (!b) return;
    const a = actions[+b.dataset.di];
    if (a.onClick && a.onClick(ov) === false) return;
    close();
  });
  document.body.append(ov);
  const f = focus ? ov.querySelector(focus) : ov.querySelector('button');
  (f || ov.querySelector('button')).focus();
  return {ov, close};
}

/* ---------- role list ---------- */
const skelRow = w => `<div class="flex h-10 items-center gap-3 border-b border-slate-100 px-3"><div class="h-3 animate-pulse rounded bg-slate-200" style="width:${w}%"></div></div>`;
function errorBlock(title, text) {
  return `<div class="p-6 text-center"><p class="font-medium">${esc(title)}</p><p class="mt-1 text-slate-600">${esc(text)}</p>
    <button type="button" data-act="retry" class="${BTN} ${KIND.outline} mt-3">Retry</button></div>`;
}
function renderList() {
  const body = $('#listBody'), tabs = $('#tabs'), chips = $('#chips'), meta = $('#listMeta'), banner = $('#listBanner');
  if (state.phase === 'loading') {
    tabs.innerHTML = ''; chips.innerHTML = ''; meta.innerHTML = '<span class="inline-block h-3 w-32 animate-pulse rounded bg-slate-200"></span>'; banner.innerHTML = '';
    body.innerHTML = [60,45,70,55,50,65,48,58].map(skelRow).join(''); body.setAttribute('aria-busy', 'true'); return;
  }
  body.removeAttribute('aria-busy');
  if (state.phase === 'error') {
    tabs.innerHTML = ''; chips.innerHTML = ''; meta.textContent = ''; banner.innerHTML = '';
    body.innerHTML = errorBlock("Couldn't load roles", 'The roles service did not respond. Nothing was changed.'); return;
  }
  banner.innerHTML = state.refreshError ? `<div role="alert" class="mb-2 flex items-start gap-2 rounded-md border border-amber-300 bg-amber-50 p-3 text-amber-900">${ic('alert', 'mt-0.5')}<p class="flex-1">Couldn't refresh roles. Showing the list as last loaded.</p><button type="button" data-act="retry" class="font-medium underline">Retry</button></div>` : '';
  const all = state.roles, sys = all.filter(r => r.type === 'System').length;
  const tabDefs = [['all', 'All', all.length], ['System', 'System', sys], ['Custom', 'Custom', all.length - sys]];

/* ---------- detail / matrix ---------- */
function cellsFor(key) {

  if (t === 'c') return MODULES.filter(m => m.acts.includes(a)).map(m => [m.id, a]);
  if (t === 'g') return MODULES.filter(m => m.group === a && m.acts.includes(b)).map(m => [m.id, b]);

}

/* ---------- permission logic ---------- */
function setCell(m, x, on) {
  const s = state.draft[m], out = {viewAdded: false, cleared: []};
  if (on) { s.add(x); if (x !== 'v' && !s.has('v')) { s.add('v'); out.viewAdded = true; } }
  else { s.delete(x); if (x === 'v') { [...s].forEach(a => { out.cleared.push(AN[a]); s.delete(a); }); } }
  return out;
}
function toggle(key, on) {
  const cells = cellsFor(key); let added = 0, cleared = 0, last = null;
  cells.forEach(([m, x]) => { last = setCell(m, x, on); if (last.viewAdded) added++; cleared += last.cleared.length; });
  const msg = $('#depMsg'), [t, a, b] = key.split(':');
  if (t === 'm' && last.viewAdded) msg.textContent = `${AN[b]} needs View, so View is on for ${MOD[a].name}.`;
  else if (t === 'm' && last.cleared.length) msg.textContent = `Turning off View for ${MOD[a].name} also turned off ${last.cleared.join(', ')}.`;
  else if (added) msg.textContent = `View was turned on for ${added} module${added > 1 ? 's' : ''} because other actions need it.`;
  else if (cleared) msg.textContent = `Turning off View also turned off ${cleared} other permission${cleared > 1 ? 's' : ''}.`;
  else msg.textContent = '';
  renderDetail();
}

/* ---------- navigation guard ---------- */

/* ---------- events ---------- */
document.addEventListener('click', e => {

    case 'nav': guard(() => toast('This page is not part of the mock')); break;

        {label: 'Simulate load error', icon: 'alert', run: () => load(true)}]); break;
    }

      if (menuBtn === el) return closeMenu();
      const r = act === 'row-menu' ? role : cur();
      openMenu(el, [{label: 'Duplicate role', icon: 'copy', run: () => { if (r.id === state.selectedId) duplicate(r); else duplicate(r); }},
        r.type === 'System' ? {label: 'Delete role', icon: 'trash', reason: `${r.name} is a system role and can't be deleted.`} : {label: 'Delete role', icon: 'trash', danger: true, run: () => deleteRole(r)}]); break;
    }
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#menu')) { const b = menuBtn; closeMenu(); if (b) b.focus(); }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    const m = $('#menu'); if (!m) return;
    const f = [...m.querySelectorAll('button:not([disabled])')], i = f.indexOf(document.activeElement);
    e.preventDefault(); f[(i + (e.key === 'ArrowDown' ? 1 : -1) + f.length) % f.length].focus();
  }
});
document.addEventListener('change', e => {
  const k = e.target.dataset && e.target.dataset.key;
  if (k) toggle(k, e.target.checked);
});
$('#search').addEventListener('input', e => { state.query = e.target.value; if (state.phase === 'ready') renderList(); });

/* ---------- init ---------- */
$('#searchIc').innerHTML = ic('search');
$('#pageMenuBtn').innerHTML = ic('more');
$('#createBtn').innerHTML = ic('plus') + 'Create role';

  .forEach(([id, i, l]) => { $('#' + id).innerHTML = ic(i) + `<span class="truncate">${l}</span>`; });
load(location.hash === '#error');
