<!DOCTYPE html>
<html lang="vi">
<head>

<script src="https://cdn.tailwindcss.com"></script>
<style>

</head>
<body class="bg-slate-50">
<div class="flex min-h-screen">

        <a href="#" aria-current="page" class="flex h-8 items-center gap-2 rounded bg-slate-100 px-2 font-medium text-slate-900"><svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>Tổng quan</a>
        <a href="/orders" class="flex h-8 items-center gap-2 rounded px-2 text-slate-700 hover:bg-slate-100"><svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18"/></svg>Đơn xuất kho</a>
        <a href="/receipts" class="flex h-8 items-center gap-2 rounded px-2 text-slate-700 hover:bg-slate-100"><svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 19h16"/></svg>Phiếu nhập kho</a>
        <a href="/shipments" class="flex h-8 items-center gap-2 rounded px-2 text-slate-700 hover:bg-slate-100"><svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="1" y="6" width="14" height="10"/><path d="M15 9h4l3 3v4h-7"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></svg>Vận chuyển</a>
      </div>
      <div class="flex flex-col gap-0.5">

        <a href="/locations" class="flex h-8 items-center gap-2 rounded px-2 text-slate-700 hover:bg-slate-100"><svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 21s-7-6-7-11a7 7 0 0 1 14 0c0 5-7 11-7 11z"/><circle cx="12" cy="10" r="2"/></svg>Vị trí kho</a>

      </div>
      <div class="flex flex-col gap-0.5">
        <p class="px-2 py-1 text-xs font-medium text-slate-600">Hệ thống</p>
        <a href="/settings" class="flex h-8 items-center gap-2 rounded px-2 text-slate-700 hover:bg-slate-100"><svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>Cài đặt</a>

  <div class="flex min-w-0 flex-1 flex-col">
    <!-- App header -->
    <header class="flex h-12 items-center justify-between gap-3 border-b border-slate-200 bg-white px-4">
      <button type="button" class="flex h-8 w-full max-w-xs items-center justify-between rounded border border-slate-300 bg-white px-3 text-slate-600 hover:bg-slate-50">
        <span>Tìm hoặc chạy lệnh</span><kbd class="rounded border border-slate-300 px-1 text-xs">Ctrl K</kbd>
      </button>
      <div class="flex items-center gap-2">
        <button type="button" aria-label="Thông báo, 3 chưa đọc" class="relative flex size-8 items-center justify-center rounded text-slate-700 hover:bg-slate-100">
          <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          <span class="absolute -right-0.5 -top-0.5 rounded-full bg-blue-700 px-1 text-xs leading-4 text-white" aria-hidden="true">3</span>
        </button>
        <button type="button" aria-label="Menu tài khoản" class="flex size-8 items-center justify-center rounded-full bg-slate-200 text-xs font-semibold text-slate-800">LH</button>
      </div>
    </header>

    <main class="min-w-0 flex-1 p-6" id="main">
      <!-- Page header -->
      <div class="mb-4 flex flex-wrap items-center gap-x-4 gap-y-2">
        <h1 class="text-xl font-semibold">Tổng quan vận hành kho</h1>
        <div class="flex items-center gap-2">
          <label for="range" class="sr-only">Khoảng thời gian</label>
          <select id="range" class="h-8 rounded border border-slate-300 bg-white px-2">
            <option value="today">Hôm nay</option>
            <option value="7d">7 ngày qua</option>
            <option value="30d">30 ngày qua</option>
          </select>
          <span id="resolved" class="tabular-nums text-slate-600"></span>
        </div>
        <div class="ml-auto flex items-center gap-2">
          <label for="demo" class="text-xs font-medium text-slate-600">Xem thử trạng thái</label>
          <select id="demo" class="h-8 rounded border border-slate-300 bg-white px-2">
            <option value="ok">Bình thường</option>
            <option value="loading">Đang tải</option>
            <option value="empty">Không có dữ liệu</option>
            <option value="error">Lỗi widget</option>
          </select>
          <span id="updated" class="tabular-nums text-slate-600"></span>
          <span id="refreshFail" class="hidden text-red-700">Làm mới thất bại · <button class="underline" data-act="refresh">Thử lại</button></span>
          <button type="button" id="refresh" class="inline-flex h-8 items-center gap-1.5 rounded border border-slate-300 bg-white px-3 hover:bg-slate-50">
            <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></svg>Làm mới
          </button>
        </div>
      </div>
      <p id="live" role="status" class="sr-only"></p>

      <!-- KPI tiles -->
      <section aria-label="Chỉ số chính" id="kpis" class="grid grid-cols-1 gap-4 sm:grid-cols-2 xl:grid-cols-6"></section>

      <div class="mt-4 grid grid-cols-1 gap-4 xl:grid-cols-3">
        <!-- Needs attention first -->
        <section aria-labelledby="attn-h" class="rounded-md border border-slate-200 bg-white xl:order-2">
          <h2 id="attn-h" class="border-b border-slate-200 px-4 py-3 text-base font-semibold">Cần xử lý</h2>
          <div id="attn" class="min-h-[320px]"></div>
        </section>

        <!-- Trend -->
        <section aria-labelledby="trend-h" class="rounded-md border border-slate-200 bg-white xl:order-1 xl:col-span-2">
          <div class="flex items-center justify-between border-b border-slate-200 px-4 py-3">
            <h2 id="trend-h" class="text-base font-semibold">Xu hướng xuất kho</h2>
            <button type="button" id="toggleTable" class="h-8 rounded px-2 text-blue-700 underline" aria-pressed="false">Xem dạng bảng</button>
          </div>
          <div id="trend" class="min-h-[320px] p-4"></div>
        </section>
      </div>

      <div class="mt-4 grid grid-cols-1 gap-4 xl:grid-cols-3">
        <section aria-labelledby="zone-h" class="rounded-md border border-slate-200 bg-white xl:col-span-1">
          <h2 id="zone-h" class="border-b border-slate-200 px-4 py-3 text-base font-semibold">Mức lấp đầy theo khu lưu trữ</h2>
          <div id="zones" class="min-h-[280px] p-4"></div>
        </section>
        <section aria-labelledby="dock-h" class="rounded-md border border-slate-200 bg-white xl:col-span-2">
          <div class="flex items-center justify-between border-b border-slate-200 px-4 py-3">
            <h2 id="dock-h" class="text-base font-semibold">Xe tại cổng hôm nay</h2>
            <a href="/shipments?view=dock" class="text-blue-700 underline">Xem tất cả</a>
          </div>
          <div id="dock" class="min-h-[280px]"></div>
        </section>
      </div>
    </main>
  </div>
</div>

<script>
const LOCALE = 'vi-VN';
const nf = new Intl.NumberFormat(LOCALE);
const pf = new Intl.NumberFormat(LOCALE, { style: 'percent', signDisplay: 'exceptZero', maximumFractionDigits: 1 });
const sf = new Intl.NumberFormat(LOCALE, { signDisplay: 'exceptZero' });
const df = new Intl.DateTimeFormat('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric' });
const tf = new Intl.DateTimeFormat('vi-VN', { hour: '2-digit', minute: '2-digit', hour12: false });
const $ = (s) => document.querySelector(s);
const box = 'rounded-md border border-slate-200 bg-white';

/* ---------- Mock data ---------- */
const NOW = new Date(2026, 10, 4, 16, 30);
const RANGES = {
  today: { label: 'hôm qua', days: 0 },
  '7d': { label: '7 ngày trước', days: 6 },
  '30d': { label: '30 ngày trước', days: 29 },
};
const KPI = {
  today: [
    { id: 'pending', label: 'Đơn chờ xuất kho', value: 184, prev: 161, kind: 'count', href: '/orders?status=pending' },
    { id: 'shipped', label: 'Đơn đã xuất', value: 742, prev: 716, kind: 'count', href: '/orders?status=shipped&date=today' },
    { id: 'received', label: 'Dòng hàng đã nhập', value: 1268, prev: 1390, kind: 'count', href: '/receipts?status=received&date=today' },
    { id: 'accuracy', label: 'Tỷ lệ lấy hàng đúng', value: 0.9964, prev: 0.9981, kind: 'pct', href: '/orders?issue=pick-error' },
    { id: 'late', label: 'Đơn trễ hạn giao', value: 9, prev: 4, kind: 'count', href: '/orders?status=late' },
    { id: 'low', label: 'SKU dưới mức tồn tối thiểu', value: 37, prev: 37, kind: 'count', href: '/inventory?stock=below-min' },
  ],
  '7d': [
    { id: 'pending', label: 'Đơn chờ xuất kho', value: 184, prev: 203, kind: 'count', href: '/orders?status=pending' },
    { id: 'shipped', label: 'Đơn đã xuất', value: 5126, prev: 4870, kind: 'count', href: '/orders?status=shipped&range=7d' },
    { id: 'received', label: 'Dòng hàng đã nhập', value: 8910, prev: 9244, kind: 'count', href: '/receipts?status=received&range=7d' },
    { id: 'accuracy', label: 'Tỷ lệ lấy hàng đúng', value: 0.9972, prev: 0.9968, kind: 'pct', href: '/orders?issue=pick-error' },
    { id: 'late', label: 'Đơn trễ hạn giao', value: 41, prev: 33, kind: 'count', href: '/orders?status=late' },
    { id: 'low', label: 'SKU dưới mức tồn tối thiểu', value: 37, prev: 29, kind: 'count', href: '/inventory?stock=below-min' },
  ],
  '30d': [
    { id: 'pending', label: 'Đơn chờ xuất kho', value: 184, prev: 176, kind: 'count', href: '/orders?status=pending' },
    { id: 'shipped', label: 'Đơn đã xuất', value: 21480, prev: 20115, kind: 'count', href: '/orders?status=shipped&range=30d' },
    { id: 'received', label: 'Dòng hàng đã nhập', value: 37620, prev: 36890, kind: 'count', href: '/receipts?status=received&range=30d' },
    { id: 'accuracy', label: 'Tỷ lệ lấy hàng đúng', value: 0.9969, prev: 0.9974, kind: 'pct', href: '/orders?issue=pick-error' },
    { id: 'late', label: 'Đơn trễ hạn giao', value: 152, prev: 168, kind: 'count', href: '/orders?status=late' },
    { id: 'low', label: 'SKU dưới mức tồn tối thiểu', value: 37, prev: 31, kind: 'count', href: '/inventory?stock=below-min' },
  ],
};
const ATTN = [
  { label: 'đơn trễ hạn giao', count: 9, href: '/orders?status=late', tone: 'danger', badge: 'Quá hạn' },
  { label: 'lô hàng cận hạn dùng (dưới 14 ngày)', count: 6, href: '/inventory?expiry=lt-14d', tone: 'danger', badge: 'Cận hạn' },
  { label: 'phiếu nhập chênh lệch số lượng', count: 5, href: '/receipts?status=discrepancy', tone: 'warning', badge: 'Cần đối soát' },
  { label: 'SKU dưới mức tồn tối thiểu', count: 37, href: '/inventory?stock=below-min', tone: 'warning', badge: 'Sắp hết' },
  { label: 'vị trí chờ kiểm kê lại', count: 12, href: '/stocktakes?status=recount', tone: 'info', badge: 'Chờ xử lý' },
];
const ATTN_TONE = {
  danger: 'bg-red-50 text-red-800', warning: 'bg-amber-50 text-amber-800', info: 'bg-blue-50 text-blue-800',
};
const ZONES = [
  { name: 'Khu C – Hàng lạnh', pct: 96 },
  { name: 'Khu A – Hàng nhanh', pct: 91 },
  { name: 'Khu B – Pallet', pct: 78 },
  { name: 'Khu E – Hàng cồng kềnh', pct: 64 },
  { name: 'Khu D – Hàng trả', pct: 41 },
];
const DOCKS = [
  { id: 'XE-5521', carrier: 'Giao Hàng Nhanh', dock: 'Cổng 2', type: 'Xuất', eta: '16:45', status: 'Đang bốc hàng', tone: 'info', items: 38 },
  { id: 'XE-5519', carrier: 'Viettel Post', dock: 'Cổng 4', type: 'Xuất', eta: '16:10', status: 'Trễ 20 phút', tone: 'danger', items: 52 },
  { id: 'NCC-2087', carrier: 'Công ty Hòa Phát Food', dock: 'Cổng 1', type: 'Nhập', eta: '16:00', status: 'Đang dỡ hàng', tone: 'info', items: 24 },
  { id: 'NCC-2091', carrier: 'Vinamilk', dock: 'Cổng 3', type: 'Nhập', eta: '17:15', status: 'Chờ đến', tone: 'neutral', items: 40 },
  { id: 'XE-5524', carrier: 'J&T Express', dock: 'Cổng 5', type: 'Xuất', eta: '17:30', status: 'Chờ đến', tone: 'neutral', items: 61 },
];
const DOCK_TONE = { info: 'bg-blue-50 text-blue-800', danger: 'bg-red-50 text-red-800', neutral: 'bg-slate-100 text-slate-700', success: 'bg-green-50 text-green-800' };

function seeded(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
function trendData(range) {
  const r = seeded(range === 'today' ? 11 : range === '7d' ? 23 : 37);
  if (range === 'today') {
    const hours = Array.from({ length: 17 }, (_, i) => i + 6);
    const shape = (h) => 18 + 50 * Math.exp(-Math.pow((h - 10.5) / 2.6, 2)) + 38 * Math.exp(-Math.pow((h - 15) / 2.2, 2));
    return { xLabel: 'Giờ trong ngày', yLabel: 'Đơn xuất kho (đơn/giờ)', cur: 'Hôm nay', prev: 'Hôm qua',
      x: hours.map((h) => String(h).padStart(2, '0') + ':00'),
      cur_v: hours.map((h) => (h <= 16 ? Math.round(shape(h) + r() * 8) : null)),
      prev_v: hours.map((h) => Math.round(shape(h) * 0.96 + r() * 8)) };
  }
  const n = range === '7d' ? 7 : 30;
  const x = Array.from({ length: n }, (_, i) => { const d = new Date(NOW); d.setDate(d.getDate() - (n - 1 - i)); return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0'); });
  const base = range === '7d' ? 730 : 715;
  return { xLabel: 'Ngày', yLabel: 'Đơn xuất kho (đơn/ngày)', cur: 'Kỳ này', prev: 'Kỳ trước',
    x, cur_v: x.map((_, i) => Math.round(base + 40 * Math.sin(i / 1.4) + r() * 60)),
    prev_v: x.map((_, i) => Math.round(base * 0.95 + 40 * Math.sin(i / 1.4 + 0.6) + r() * 60)) };
}

/* ---------- State ---------- */
const state = { range: new URLSearchParams(location.search).get('range') || 'today', demo: 'ok', widget: {}, showTable: false, updated: NOW, loaded: false };
if (!RANGES[state.range]) state.range = 'today';
$('#range').value = state.range;
const WIDGETS = ['kpis', 'attn', 'trend', 'zones', 'dock'];

function skeleton(id) {
  const el = $('#' + id);
  if (id === 'kpis') { el.innerHTML = Array.from({ length: 6 }, () => `<div class="${box} h-24 p-4"><div class="sk h-3 w-24"></div><div class="sk mt-3 h-6 w-16"></div><div class="sk mt-2 h-3 w-28"></div></div>`).join(''); return; }
  el.innerHTML = `<div class="space-y-3 p-4">${Array.from({ length: 6 }, (_, i) => `<div class="sk h-6" style="width:${100 - i * 8}%"></div>`).join('')}</div>`;
}
function errorBox(id, name) {
  const html = `<div class="p-4 text-slate-800"><p class="font-medium">Không tải được ${name}.</p><p class="mt-1 text-slate-600">Các phần khác của trang vẫn hiển thị bình thường.</p><button type="button" data-retry="${id}" class="mt-3 h-8 rounded border border-slate-300 bg-white px-3 hover:bg-slate-50">Thử lại</button></div>`;
  if (id === 'kpis') $('#kpis').innerHTML = `<div class="${box} sm:col-span-2 xl:col-span-6">${html}</div>`; else $('#' + id).innerHTML = html;
}
function emptyBox(id, msg, action) {
  const html = `<div class="p-4"><p class="text-slate-700">${msg}</p>${action ? `<button type="button" data-act="${action.act}" class="mt-3 h-8 rounded border border-slate-300 bg-white px-3 hover:bg-slate-50">${action.label}</button>` : ''}</div>`;
  if (id === 'kpis') $('#kpis').innerHTML = `<div class="${box} sm:col-span-2 xl:col-span-6">${html}</div>`; else $('#' + id).innerHTML = html;
}

/* ---------- Renderers ---------- */
function renderKpis() {
  const range = RANGES[state.range];
  $('#kpis').innerHTML = KPI[state.range].map((k) => {
    const fmt = k.kind === 'pct' ? new Intl.NumberFormat(LOCALE, { style: 'percent', minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(k.value) : nf.format(k.value);
    let delta;
    if (k.kind === 'pct') { const d = (k.value - k.prev) * 100; delta = new Intl.NumberFormat(LOCALE, { signDisplay: 'exceptZero', minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(d) + ' điểm %'; }
    else if (k.id === 'pending' || k.id === 'low' || k.id === 'late') delta = sf.format(k.value - k.prev);
    else delta = pf.format(k.value / k.prev - 1);
    if (/^0([,.]0+)?/.test(delta) && k.value === k.prev) delta = '0';
    const arrow = k.value > k.prev ? '▲' : k.value < k.prev ? '▼' : '–';
    return `<a href="${k.href}" class="${box} block min-h-24 p-4 hover:bg-slate-50">
      <p class="text-xs font-medium text-slate-600">${k.label}</p>
      <p class="mt-1 text-2xl font-semibold tabular-nums">${fmt}</p>
      <p class="text-xs text-slate-600 tabular-nums"><span aria-hidden="true">${arrow}</span> ${delta} so với ${range.label}</p>
    </a>`;
  }).join('');
}

function renderAttn() {
  if (!ATTN.length) { emptyBox('attn', `Không có việc cần xử lý. Kiểm tra lúc ${tf.format(state.updated)}.`); return; }
  $('#attn').innerHTML = `<ul>${ATTN.slice(0, 5).map((i) => `<li class="border-b border-slate-200 last:border-0">
    <a href="${i.href}" class="flex min-h-10 items-center gap-3 px-4 py-2 hover:bg-slate-50">
      <span class="w-9 text-base font-semibold tabular-nums">${nf.format(i.count)}</span>
      <span class="flex-1">${i.label}</span>
      <span class="rounded-full px-2 text-xs font-medium ${ATTN_TONE[i.tone]}">${i.badge}</span>
    </a></li>`).join('')}</ul>
    <div class="border-t border-slate-200 px-4 py-2"><a href="/tasks" class="text-blue-700 underline">Xem tất cả việc cần xử lý</a></div>`;
}

function renderTrend() {
  const d = trendData(state.range);
  const el = $('#trend');
  const total = (a) => a.reduce((s, v) => s + (v || 0), 0);
  if (state.showTable) {
    el.innerHTML = `<div class="max-h-[300px] overflow-auto"><table class="w-full text-left"><caption class="sr-only">${d.yLabel}</caption><thead class="sticky top-0 bg-white"><tr class="h-10 border-b border-slate-200 text-xs font-medium text-slate-600"><th class="font-medium">${d.xLabel}</th><th class="text-right font-medium">${d.cur}</th><th class="text-right font-medium">${d.prev}</th></tr></thead><tbody>${
      d.x.map((x, i) => `<tr class="h-10 border-b border-slate-100"><td class="tabular-nums">${x}</td><td class="text-right tabular-nums">${d.cur_v[i] == null ? '–' : nf.format(d.cur_v[i])}</td><td class="text-right tabular-nums">${nf.format(d.prev_v[i])}</td></tr>`).join('')}</tbody></table></div>`;
    return;
  }
  const W = 720, H = 300, L = 56, R = 70, T = 12, B = 48;
  const all = d.cur_v.concat(d.prev_v).filter((v) => v != null);
  const max = Math.ceil(Math.max(...all) / 20) * 20, min = 0;
  const xs = (i) => L + (i * (W - L - R)) / (d.x.length - 1);
  const ys = (v) => T + (H - T - B) * (1 - (v - min) / (max - min));
  const ticks = 5;
  let g = '';
  for (let t = 0; t <= ticks; t++) { const v = min + ((max - min) * t) / ticks; g += `<line x1="${L}" x2="${W - R}" y1="${ys(v)}" y2="${ys(v)}" stroke="#e2e8f0"/><text x="${L - 8}" y="${ys(v) + 4}" text-anchor="end" font-size="11" fill="#475569">${new Intl.NumberFormat(LOCALE, { notation: 'compact' }).format(v)}</text>`; }
  const step = d.x.length > 14 ? Math.ceil(d.x.length / 8) : d.x.length > 8 ? 2 : 1;
  d.x.forEach((x, i) => { if (i % step === 0) g += `<text x="${xs(i)}" y="${H - B + 16}" text-anchor="middle" font-size="11" fill="#475569">${x}</text>`; });
  const path = (arr) => { let p = '', pen = false; arr.forEach((v, i) => { if (v == null) { pen = false; return; } p += (pen ? 'L' : 'M') + xs(i).toFixed(1) + ' ' + ys(v).toFixed(1); pen = true; }); return p; };
  const lastCur = d.cur_v.map((v, i) => (v != null ? i : -1)).filter((i) => i >= 0).pop();
  const sumCur = total(d.cur_v), sumPrev = total(d.prev_v.filter((_, i) => d.cur_v[i] != null));
  const summary = `${d.yLabel}: ${d.cur} ${nf.format(sumCur)} so với ${d.prev} ${nf.format(sumPrev)} cùng khung thời gian.`;
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${summary}" class="w-full" style="height:300px">
    ${g}
    <line x1="${L}" x2="${W - R}" y1="${ys(0)}" y2="${ys(0)}" stroke="#94a3b8"/>
    <path d="${path(d.prev_v)}" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4"/>
    <path d="${path(d.cur_v)}" fill="none" stroke="#1d4ed8" stroke-width="2.5"/>
    <circle cx="${xs(lastCur)}" cy="${ys(d.cur_v[lastCur])}" r="4" fill="#1d4ed8"/>
    <text x="${xs(d.x.length - 1) + 8}" y="${ys(d.prev_v[d.x.length - 1]) + 4}" font-size="12" fill="#475569">${d.prev}</text>
    <text x="${Math.min(xs(lastCur) + 8, W - 54)}" y="${ys(d.cur_v[lastCur]) - 8}" font-size="12" font-weight="600" fill="#1d4ed8">${d.cur}</text>
    <text x="${(L + W - R) / 2}" y="${H - 6}" text-anchor="middle" font-size="12" fill="#334155">${d.xLabel}</text>
    <text transform="translate(14 ${(T + H - B) / 2}) rotate(-90)" text-anchor="middle" font-size="12" fill="#334155">${d.yLabel}</text>
  </svg>
  <p class="mt-1 text-xs text-slate-600 tabular-nums">${summary}</p>`;
}

function renderZones() {
  const rows = [...ZONES].sort((a, b) => b.pct - a.pct);
  $('#zones').innerHTML = `<div role="img" aria-label="Mức lấp đầy: ${rows.map((z) => z.name + ' ' + z.pct + '%').join(', ')}" class="space-y-3">${rows.map((z) => `
    <div><div class="flex justify-between text-sm"><span>${z.name}</span><span class="tabular-nums font-medium">${z.pct}%${z.pct >= 90 ? ' · <span class="text-red-700">Gần đầy</span>' : ''}</span></div>
    <div class="mt-1 h-2 rounded-sm bg-slate-200"><div class="h-2 rounded-sm ${z.pct >= 90 ? 'bg-blue-700' : 'bg-slate-500'}" style="width:${z.pct}%"></div></div></div>`).join('')}</div>
    <p class="mt-4 text-xs text-slate-600">Trục: mức lấp đầy (% sức chứa vị trí), bắt đầu từ 0%. Ngưỡng cảnh báo 90%.</p>`;
}

function renderDock() {
  if (!DOCKS.length) { emptyBox('dock', 'Hôm nay chưa có xe nào đặt lịch.'); return; }
  $('#dock').innerHTML = `<div class="overflow-x-auto"><table class="w-full min-w-[640px] text-left">
    <thead><tr class="h-10 border-b border-slate-200 text-xs font-medium text-slate-600"><th class="px-4 font-medium">Mã</th><th class="font-medium">Đối tác</th><th class="font-medium">Cổng</th><th class="font-medium">Loại</th><th class="text-right font-medium">Giờ hẹn</th><th class="text-right font-medium">Số pallet</th><th class="px-4 font-medium">Trạng thái</th></tr></thead>
    <tbody>${DOCKS.map((r) => `<tr class="h-10 border-b border-slate-100 last:border-0 hover:bg-slate-50"><td class="whitespace-nowrap px-4 font-medium"><a class="text-blue-700 underline" href="/shipments/${r.id}">${r.id}</a></td><td class="whitespace-nowrap">${r.carrier}</td><td class="whitespace-nowrap">${r.dock}</td><td>${r.type}</td><td class="text-right tabular-nums">${r.eta}</td><td class="text-right tabular-nums">${nf.format(r.items)}</td><td class="whitespace-nowrap px-4"><span class="rounded-full px-2 text-xs font-medium ${DOCK_TONE[r.tone]}">${r.status}</span></td></tr>`).join('')}</tbody></table></div>`;
}

const NAMES = { kpis: 'các chỉ số chính', attn: 'danh sách việc cần xử lý', trend: 'biểu đồ xu hướng', zones: 'mức lấp đầy các khu', dock: 'danh sách xe tại cổng' };
const RENDER = { kpis: renderKpis, attn: renderAttn, trend: renderTrend, zones: renderZones, dock: renderDock };

function paint(id) {
  const demo = state.demo;
  if (demo === 'loading') return skeleton(id);
  if (demo === 'error' && id !== 'zones') return errorBox(id, NAMES[id]);
  if (demo === 'empty') {
    const msg = { kpis: 'Không có số liệu trong khoảng thời gian này.', attn: 'Không có việc cần xử lý. Kiểm tra lúc ' + tf.format(state.updated) + '.', trend: 'Không có đơn xuất kho trong khoảng thời gian này.', zones: 'Chưa có khu lưu trữ nào được cấu hình.', dock: 'Hôm nay chưa có xe nào đặt lịch.' };
    return emptyBox(id, msg[id], id === 'kpis' || id === 'trend' ? { act: 'reset', label: 'Đổi khoảng thời gian' } : null);
  }
  RENDER[id]();
}
function paintAll() {
  $('#resolved').textContent = (() => { const from = new Date(NOW); from.setDate(from.getDate() - RANGES[state.range].days); return state.range === 'today' ? df.format(NOW) : df.format(from) + ' – ' + df.format(NOW); })();
  WIDGETS.forEach(paint);
}

function load(ms = 450) {
  const prev = state.demo;
  WIDGETS.forEach(skeleton);
  setTimeout(() => {
    state.updated = new Date(NOW.getTime() + (state.loaded ? Math.floor((Date.now() - T0) / 60000) * 60000 : 0));
    state.loaded = true;
    $('#updated').textContent = 'Cập nhật ' + tf.format(state.updated);
    $('#refreshFail').classList.add('hidden');
    paintAll();
    $('#live').textContent = state.demo === 'ok' ? `${ATTN.length} nhóm việc cần xử lý, cập nhật lúc ${tf.format(state.updated)}` : '';
  }, ms);
}
const T0 = Date.now();

/* ---------- Events ---------- */
$('#range').addEventListener('change', (e) => {
  state.range = e.target.value;
  const u = new URL(location.href); u.searchParams.set('range', state.range); history.replaceState(null, '', u);
  load();
});
$('#demo').addEventListener('change', (e) => { state.demo = e.target.value; load(300); });
$('#refresh').addEventListener('click', () => load());
$('#toggleTable').addEventListener('click', (e) => {
  state.showTable = !state.showTable;
  e.target.textContent = state.showTable ? 'Xem dạng biểu đồ' : 'Xem dạng bảng';
  e.target.setAttribute('aria-pressed', state.showTable);
  if (state.demo === 'ok') renderTrend();
});
document.addEventListener('click', (e) => {
  const retry = e.target.closest('[data-retry]');
  if (retry) { const id = retry.dataset.retry; state.demo = id === 'kpis' ? 'ok' : state.demo; if (state.demo === 'ok') $('#demo').value = 'ok'; skeleton(id); setTimeout(() => { state.demo = 'ok'; $('#demo').value = 'ok'; paintAll(); }, 400); }
  const act = e.target.closest('[data-act]');
  if (act) {
    if (act.dataset.act === 'reset') { state.demo = 'ok'; $('#demo').value = 'ok'; load(); }
    if (act.dataset.act === 'refresh') load();
  }
});

load(500);
</script>
</body>
</html>
