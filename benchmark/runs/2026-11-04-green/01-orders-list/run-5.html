<script>
(function () {
  'use strict';

  /* ---------- Mock data ---------- */
  var TODAY = new Date(2026, 10, 4);
  var STATUSES = ['Draft', 'Pending', 'Shipping', 'Delivered', 'On hold', 'Late', 'Cancelled'];
  var STATUS_TONE = { 'Draft': 'neutral', 'Pending': 'info', 'Shipping': 'info', 'Delivered': 'success', 'On hold': 'warning', 'Late': 'danger', 'Cancelled': 'neutral' };
  var PAYMENTS = ['Unpaid', 'Paid', 'Overdue', 'Refunded'];
  var PAY_TONE = { 'Unpaid': 'warning', 'Paid': 'success', 'Overdue': 'danger', 'Refunded': 'neutral' };
  var CHANNELS = ['Direct sales', 'Website', 'Distributor', 'Marketplace'];
  var REPS = ['Nguyễn Thị Hạnh', 'Trần Quốc Bảo', 'Lê Hoàng Nam', 'Phạm Thu Trang', 'Đặng Minh Khoa'];
  var TONES = {
    neutral: 'bg-slate-100 text-slate-700',
    info: 'bg-blue-50 text-blue-800',
    success: 'bg-green-50 text-green-800',
    warning: 'bg-amber-50 text-amber-800',
    danger: 'bg-red-50 text-red-800'
  };
  var CUSTOMERS = [
    ['Công ty TNHH Minh Phát', '0903 112 458'], ['Siêu thị Bách Hóa Xanh Q7', '0938 220 117'], ['Công ty CP Thực phẩm Đại Dương', '0912 884 063'],
    ['Nhà phân phối Hoàng Gia', '0987 301 295'], ['Cửa hàng Tiện Lợi An Khang', '0976 540 812'], ['Công ty TNHH Vận tải Đường Việt', '0909 773 640'],
    ['Đại lý Phú Thịnh', '0918 465 009'], ['Công ty CP Nội thất Nguyễn Kim', '0933 618 274'], ['Nhà hàng Hương Sen', '0966 207 531'],
    ['Công ty TNHH Điện máy Thành Công', '0944 125 880'], ['Chuỗi cà phê Highland Bắc', '0902 339 716'], ['Tập đoàn Xây dựng Hòa Bình', '0983 450 127'],
    ['Công ty TNHH Dược phẩm Tâm Đức', '0915 902 348'], ['Trường Quốc tế Á Châu', '0977 816 453'], ['Bệnh viện Đa khoa Đức Giang', '0908 271 905']
  ];
  var DATA = (function () {
    var rows = [], seed = 20261104;
    function rnd() { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; }
    for (var i = 0; i < 96; i++) {
      var c = CUSTOMERS[Math.floor(rnd() * CUSTOMERS.length)];
      var d = new Date(TODAY); d.setDate(d.getDate() - Math.floor(rnd() * 58));
      var r = rnd(), st;
      if (r < .10) st = 'Draft'; else if (r < .25) st = 'Pending'; else if (r < .42) st = 'Shipping';
      else if (r < .76) st = 'Delivered'; else if (r < .83) st = 'On hold'; else if (r < .90) st = 'Late'; else st = 'Cancelled';
      var pay;
      if (st === 'Delivered') pay = rnd() < .75 ? 'Paid' : 'Overdue';
      else if (st === 'Cancelled') pay = rnd() < .5 ? 'Refunded' : 'Unpaid';
      else if (st === 'Late') pay = rnd() < .5 ? 'Paid' : 'Overdue';
      else pay = rnd() < .45 ? 'Paid' : 'Unpaid';
      var total = Math.round((2 + rnd() * 160) * 1000000 / 10000) * 10000;
      rows.push({
        id: 'DH-' + (1043 - i + 53), customer: c[0], phone: c[1], status: st, payment: pay,
        channel: CHANNELS[Math.floor(rnd() * CHANNELS.length)], rep: REPS[Math.floor(rnd() * REPS.length)],
        date: d, total: total
      });
    }
    return rows;
  })();

  /* ---------- Helpers ---------- */
  var nfInt = new Intl.NumberFormat('vi-VN');
  var nfCount = new Intl.NumberFormat('en-US');
  function money(n) { return nfInt.format(n); }
  function fmtDate(d) {
    return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + d.getFullYear();
  }
  function norm(s) { return String(s).normalize('NFD').replace(/\p{Diacritic}/gu, '').replace(/đ/gi, 'd').toLowerCase(); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function $(id) { return document.getElementById(id); }
  function badge(text, tone) { return '<span class="inline-flex h-6 items-center whitespace-nowrap rounded-full px-2 text-xs font-medium ' + TONES[tone] + '">' + esc(text) + '</span>'; }
  var ICON = {
    x: '<svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>',
    chev: '<svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>',
    more: '<svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>',
    up: '<svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 15l-6-6-6 6"/></svg>',
    sliders: '<svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>',
    alert: '<svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>'
  };

  /* ---------- State ---------- */
  var params = new URLSearchParams(location.search);
  var DEFAULTS = { q: '', status: [], channel: [], date: '', payment: [], rep: '', min: '', max: '', sort: '-date', page: 1, size: 25 };
  var S = JSON.parse(JSON.stringify(DEFAULTS));
  S.q = params.get('q') || '';
  S.status = params.getAll('status').filter(function (v) { return STATUSES.indexOf(v) > -1; });
  S.channel = params.getAll('channel').filter(function (v) { return CHANNELS.indexOf(v) > -1; });
  S.payment = params.getAll('payment').filter(function (v) { return PAYMENTS.indexOf(v) > -1; });
  S.date = ['7d', '30d', 'month'].indexOf(params.get('date')) > -1 ? params.get('date') : '';
  S.rep = REPS.indexOf(params.get('rep')) > -1 ? params.get('rep') : '';
  S.min = /^\d+$/.test(params.get('min') || '') ? params.get('min') : '';
  S.max = /^\d+$/.test(params.get('max') || '') ? params.get('max') : '';
  S.sort = params.get('sort') || '-date';
  S.page = Math.max(1, parseInt(params.get('page'), 10) || 1);
  S.size = [25, 50, 100].indexOf(parseInt(params.get('size'), 10)) > -1 ? parseInt(params.get('size'), 10) : 25;
  var forced = params.get('state'); // loading | empty | error
  var UI = {
    load: forced === 'error' ? 'error' : forced === 'loading' ? 'loading' : 'loading',
    open: null, density: 'comfortable', selected: {}, allMatching: false,
    panelDraft: null, banner: null, dataset: forced === 'empty' ? [] : DATA.slice()
  };

  function syncUrl() {
    var p = new URLSearchParams();
    if (S.q) p.set('q', S.q);
    S.status.forEach(function (v) { p.append('status', v); });
    S.channel.forEach(function (v) { p.append('channel', v); });
    S.payment.forEach(function (v) { p.append('payment', v); });
    ['date', 'rep', 'min', 'max'].forEach(function (k) { if (S[k]) p.set(k, S[k]); });
    if (S.sort !== '-date') p.set('sort', S.sort);
    if (S.page > 1) p.set('page', S.page);
    if (S.size !== 25) p.set('size', S.size);
    if (forced) p.set('state', forced);
    var qs = p.toString();
    history.replaceState(null, '', qs ? '?' + qs : location.pathname);
  }

  /* ---------- Filtering ---------- */
  function dateOk(d) {
    if (!S.date) return true;
    var days = Math.round((TODAY - d) / 86400000);
    if (S.date === '7d') return days <= 6;
    if (S.date === '30d') return days <= 29;
    if (S.date === 'month') return d.getMonth() === TODAY.getMonth() && d.getFullYear() === TODAY.getFullYear();
    return true;
  }
  function matches(o, skipStatus) {
    if (!skipStatus && S.status.length && S.status.indexOf(o.status) < 0) return false;
    if (S.channel.length && S.channel.indexOf(o.channel) < 0) return false;
    if (S.payment.length && S.payment.indexOf(o.payment) < 0) return false;
    if (S.rep && o.rep !== S.rep) return false;
    if (S.min && o.total < parseInt(S.min, 10) * 1000000) return false;
    if (S.max && o.total > parseInt(S.max, 10) * 1000000) return false;
    if (!dateOk(o.date)) return false;
    if (S.q) {
      var q = norm(S.q).trim(), phone = o.phone.replace(/\s/g, '');
      if (norm(o.id).indexOf(q) < 0 && norm(o.customer).indexOf(q) < 0 && phone.indexOf(q.replace(/\s/g, '')) < 0) return false;
    }
    return true;
  }
  function sorted(list) {
    var desc = S.sort.charAt(0) === '-', key = desc ? S.sort.slice(1) : S.sort, dir = desc ? -1 : 1;
    return list.slice().sort(function (a, b) {
      var x = a[key], y = b[key], r;
      if (key === 'date') r = x - y;
      else if (key === 'total') r = x - y;
      else if (key === 'id') r = parseInt(x.slice(3), 10) - parseInt(y.slice(3), 10);
      else r = String(x).localeCompare(String(y), 'vi');
      return r * dir || (b.date - a.date);
    });
  }
  function filtered() { return sorted(UI.dataset.filter(function (o) { return matches(o, false); })); }

  /* ---------- Rendering ---------- */
  var lastFocus = null;
  function render() {
    var ae = document.activeElement;
    lastFocus = ae && ae.getAttribute ? ae.getAttribute('data-fk') : null;
    renderTabs(); renderFilters(); renderChips(); renderBanner(); renderTable(); renderBulk(); renderPager();
    if (lastFocus) { var el = document.querySelector('[data-fk="' + lastFocus + '"]'); if (el) el.focus(); }
    syncUrl();
  }

  function renderTabs() {
    var base = UI.dataset.filter(function (o) { return matches(o, true); });
    var tabs = [['All', null]].concat(['Pending', 'Shipping', 'Late', 'On hold', 'Delivered', 'Cancelled'].map(function (s) { return [s, s]; }));
    $('tabs').innerHTML = tabs.map(function (t) {
      var count = t[1] ? base.filter(function (o) { return o.status === t[1]; }).length : base.length;
      var active = t[1] ? (S.status.length === 1 && S.status[0] === t[1]) : S.status.length === 0;
      return '<button type="button" role="tab" aria-selected="' + active + '" data-fk="tab-' + esc(t[0]) + '" data-act="tab" data-v="' + (t[1] || '') + '" class="-mb-px h-9 shrink-0 whitespace-nowrap border-b-2 px-3 ' +

  }
  function confirmDialog(title, body, cta, danger, onOk) {
    $('dialog').innerHTML = '<div class="fixed inset-0 z-40 flex items-center justify-center bg-slate-900/40 p-4"><div role="alertdialog" aria-modal="true" aria-labelledby="dt" class="w-full max-w-md rounded-lg border border-slate-200 bg-white p-5 shadow-xl"><h2 id="dt" class="text-base font-semibold">' + esc(title) + '</h2><p class="mt-2 text-slate-700">' + esc(body) + '</p><div class="mt-5 flex justify-end gap-2"><button type="button" id="dno" class="h-8 rounded border border-slate-300 bg-white px-3 font-medium text-slate-800 hover:bg-slate-50">Keep orders</button><button type="button" id="dyes" class="h-8 rounded px-3 font-medium text-white ' + (danger ? 'bg-red-700 hover:bg-red-800' : 'bg-blue-700 hover:bg-blue-800') + '">' + esc(cta) + '</button></div></div></div>';
    var prev = document.activeElement;
    function close() { $('dialog').innerHTML = ''; if (prev && prev.focus && document.contains(prev)) prev.focus(); }
    $('dno').onclick = close; $('dyes').onclick = function () { close(); onOk(); }; $('dno').focus();
    $('dialog').onkeydown = function (e) { if (e.key === 'Escape') close(); };
  }

  function runBulk(kind) {
    var orders = selectedOrders(), ok = 0, failed = [], verb;
    if (kind === 'export') { toast('Exported ' + orders.length + ' orders to CSV'); UI.open = null; render(); return; }
    if (kind === 'print') { toast('Picking lists for ' + orders.length + ' orders sent to the printer'); UI.open = null; render(); return; }
    orders.forEach(function (o) {
      var live = DATA.filter(function (d) { return d.id === o.id; })[0];
      if (kind === 'confirm') { if (live.status === 'Draft') { live.status = 'Pending'; ok++; } else failed.push(o.id); }
      else if (kind === 'ship') { if (live.status === 'Pending' || live.status === 'On hold') { live.status = 'Shipping'; ok++; } else failed.push(o.id); }
      else if (kind === 'hold') { if (live.status === 'Pending' || live.status === 'Draft') { live.status = 'On hold'; ok++; } else failed.push(o.id); }
      else if (kind === 'cancel') { if (live.status !== 'Delivered' && live.status !== 'Cancelled') { live.status = 'Cancelled'; ok++; } else failed.push(o.id); }
    });
    verb = { confirm: 'confirmed', ship: 'shipped', hold: 'put on hold', cancel: 'cancelled' }[kind];
    UI.open = null;
    UI.selected = {}; UI.allMatching = false;
    failed.forEach(function (id) { UI.selected[id] = true; });
    UI.banner = failed.length ? { failed: true, text: ok + ' updated, ' + failed.length + ' failed.' } : { failed: false, text: ok + ' orders ' + verb + '.' };
    if (!failed.length) toast(ok + ' orders ' + verb);
    render();
  }

  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]');
    var inPop = e.target.closest('.relative');
    if (!t) { if (UI.open && !inPop) { UI.open = null; render(); } return; }
    var a = t.getAttribute('data-act'), v = t.getAttribute('data-v');
    switch (a) {
      case 'tab': S.status = v ? [v] : []; touchFilter(); break;
      case 'open':
        if (UI.open === v) UI.open = null; else { UI.open = v; if (v === 'more') UI.panelDraft = { payment: S.payment.slice(), rep: S.rep, min: S.min, max: S.max }; }
        render(); break;
      case 'chip':
        var k = t.getAttribute('data-k');
        if (k === 'q') { S.q = ''; $('q').value = ''; }
        else if (k === 'amount') { S.min = ''; S.max = ''; }
        else if (Array.isArray(S[k])) S[k] = S[k].filter(function (x) { return x !== v; });
        else S[k] = '';
        touchFilter();
        var nx = document.querySelector('[data-act="chip"]') || $('q'); if (nx) nx.focus(); break;
      case 'clearall':
        S.q = ''; $('q').value = ''; S.status = []; S.channel = []; S.date = ''; S.payment = []; S.rep = ''; S.min = ''; S.max = ''; touchFilter(); $('q').focus(); break;
      case 'draftpay':
        var i = UI.panelDraft.payment.indexOf(v); if (i > -1) UI.panelDraft.payment.splice(i, 1); else UI.panelDraft.payment.push(v); break;
      case 'panelreset': UI.panelDraft = { payment: [], rep: '', min: '', max: '' }; render(); break;
      case 'panelapply':
        UI.panelDraft.min = $('dmin').value.replace(/\D/g, ''); UI.panelDraft.max = $('dmax').value.replace(/\D/g, '');
        UI.panelDraft.rep = $('drep').value;
        S.payment = UI.panelDraft.payment.slice(); S.rep = UI.panelDraft.rep; S.min = UI.panelDraft.min; S.max = UI.panelDraft.max;
        UI.open = null; touchFilter(); var mb = document.querySelector('[data-fk="trg-more"]'); if (mb) mb.focus(); break;
      case 'density': UI.density = UI.density === 'compact' ? 'comfortable' : 'compact'; render(); break;
      case 'sort':
        S.sort = (S.sort === v) ? '-' + v : (S.sort === '-' + v ? '-date' : v);
        if (S.sort === '-date' && v !== 'date') { /* third click returns to default */ }
        S.page = 1; render(); break;
      case 'page': S.page = parseInt(v, 10); resetSelKeepNone(); render(); break;
      case 'retry': forced = null; UI.dataset = DATA.slice(); load(500); break;
      case 'create': case 'edit': toast(a === 'edit' ? 'Opening order ' + v : 'Opening the new order form'); break;
      case 'rowmenu': UI.open = UI.open === 'menu:' + v ? null : 'menu:' + v; render(); break;
      case 'mi':
        var p = v.split(':'); UI.open = null;
        if (p[0] === 'cancel') {
          var ord = DATA.filter(function (d) { return d.id === p[1]; })[0];
          if (ord.status === 'Delivered' || ord.status === 'Cancelled') { toast('Order ' + p[1] + ' is ' + ord.status.toLowerCase() + ' and can\'t be cancelled', 'error'); render(); }
          else confirmDialog('Cancel order ' + p[1] + '?', 'The reserved stock for ' + ord.customer + ' is released and the customer is notified. This can\'t be undone.', 'Cancel order', true, function () { ord.status = 'Cancelled'; toast('Order ' + p[1] + ' cancelled'); render(); });
        } else { toast((p[0] === 'print' ? 'Printing order ' : 'Duplicated order ') + p[1]); render(); }
        break;
      case 'selectall': UI.allMatching = true; render(); break;
      case 'clearsel': resetSel(); render(); break;
      case 'dismissbanner': UI.banner = null; render(); break;
      case 'bulk':
        var n = selectedOrders().length;
        if (v === 'cancel') {
          var paid = selectedOrders().filter(function (o) { return o.payment === 'Paid'; }).length;
          UI.open = null; render();
          confirmDialog('Cancel ' + n + ' order' + (n === 1 ? '' : 's') + '?', 'Reserved stock is released and customers are notified.' + (paid ? ' ' + paid + ' paid order' + (paid === 1 ? '' : 's') + ' will be queued for refund.' : '') + ' Delivered orders are skipped. This can\'t be undone.', 'Cancel ' + n + ' order' + (n === 1 ? '' : 's'), true, function () { runBulk('cancel'); });
        } else runBulk(v);
        break;
    }
  });
  function resetSelKeepNone() { if (!UI.allMatching) { /* selection is per page */ UI.selected = {}; } }

  document.addEventListener('change', function (e) {
    var t = e.target, a = t.getAttribute && t.getAttribute('data-act');
    if (t.id === 'selAll') {
      var rows = pageRows(filtered());
      if (t.checked) rows.forEach(function (r) { UI.selected[r.id] = true; }); else { UI.selected = {}; UI.allMatching = false; }
      render(); return;
    }
    if (!a) return;
    var v = t.getAttribute('data-v');
    if (a === 'row') { if (UI.allMatching) { UI.allMatching = false; filtered().forEach(function (o) { UI.selected[o.id] = true; }); UI.allMatching = false; } if (t.checked) UI.selected[v] = true; else delete UI.selected[v]; render(); }
    else if (a === 'multi') { var k = t.getAttribute('data-k'), i = S[k].indexOf(v); if (i > -1) S[k].splice(i, 1); else S[k].push(v); touchFilter(); }
    else if (a === 'date') { S.date = v; touchFilter(); }
    else if (a === 'size') { S.size = parseInt(t.value, 10); S.page = 1; resetSel(); render(); }
  });

  var timer;
  $('q').value = S.q;
  $('q').addEventListener('input', function (e) {
    clearTimeout(timer);
    var val = e.target.value;
    timer = setTimeout(function () { if (val.trim().length === 1) return; S.q = val.trim(); S.page = 1; resetSel(); UI.banner = null; render(); }, 300);
  });
  $('q').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { clearTimeout(timer); S.q = e.target.value.trim(); S.page = 1; resetSel(); render(); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && UI.open) { var key = UI.open; UI.open = null; render(); var b = document.querySelector('[data-fk="trg-' + key + '"]'); if (b) b.focus(); }
    if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test((document.activeElement || {}).tagName || '')) { e.preventDefault(); $('q').focus(); }
  });
  $('menuBtn').addEventListener('click', function () {
    var s = $('sidebar'), open = s.classList.contains('hidden');
    s.classList.toggle('hidden'); s.classList.toggle('absolute'); s.classList.toggle('z-40'); s.classList.toggle('h-full'); s.classList.toggle('flex');
    this.setAttribute('aria-expanded', open);
  });
  $('createBtn').addEventListener('click', function () { toast('Opening the new order form'); });
  $('importBtn').addEventListener('click', function () { toast('Import wizard opens on its own page'); });
  $('exportBtn').addEventListener('click', function () { toast('Exporting ' + filtered().length + ' orders to CSV'); });

  window.addEventListener('beforeunload', function () { /* list page holds no unsaved edits */ });

  /* ---------- Init ---------- */
  render();
  if (forced === 'loading') { /* stay in skeleton for inspection */ }
  else if (forced === 'error') { setTimeout(function () { UI.load = 'error'; render(); }, 500); }
  else setTimeout(function () { UI.load = 'ok'; render(); }, 500);
})();
</script>
</body>
</html>
