<script>
(() => {
'use strict';
// ---------- Mock data ----------
const STATUS = {
  draft:      { label: 'Nháp',            tone: 'neutral' },
  pending:    { label: 'Chờ xác nhận',    tone: 'warning' },
  shipping:   { label: 'Đang giao',       tone: 'info' },
  done:       { label: 'Hoàn thành',      tone: 'success' },
  cancelled:  { label: 'Đã hủy',          tone: 'neutral' },
  failed:     { label: 'Giao thất bại',   tone: 'danger' },
};
const PAY = {
  paid:    { label: 'Đã thanh toán',        tone: 'success' },
  partial: { label: 'Thanh toán một phần',  tone: 'warning' },
  unpaid:  { label: 'Chưa thanh toán',      tone: 'neutral' },
};
const TONE = {
  neutral: 'bg-slate-100 text-slate-700', info: 'bg-blue-50 text-blue-800', success: 'bg-emerald-50 text-emerald-800',
  warning: 'bg-amber-50 text-amber-800', danger: 'bg-red-50 text-red-800',
};
const CHANNELS = ['Trực tiếp', 'Website', 'Đại lý', 'Sàn TMĐT'];
const REPS = ['Nguyễn Thị Lan', 'Trần Minh Quân', 'Phạm Đức Hải', 'Lê Hoàng Yến', 'Đỗ Văn Thắng'];
const CUSTOMERS = [
  ['Công ty TNHH Minh Phát', '0903 112 445'], ['Cửa hàng Đường Việt', '0912 778 330'], ['Nguyễn Văn Dũng', '0987 654 120'],
  ['Công ty CP Thương mại Hải Long', '0283 822 1190'], ['Siêu thị Bách Hóa Xanh Q7', '0938 201 777'], ['Đại lý Hoàng Gia', '0905 334 611'],
  ['Trần Thị Mai', '0977 120 988'], ['Công ty TNHH Sao Việt', '0243 765 4321'], ['Nhà thuốc Phúc An', '0966 540 233'],
  ['Lê Quang Đạo', '0918 442 009'], ['Công ty CP Nông sản Tây Nguyên', '0262 385 2210'], ['Cửa hàng Ánh Dương', '0932 887 114'],
  ['Phạm Thu Hà', '0909 313 535'], ['Công ty TNHH Đông Dương', '0274 382 6600'], ['Đại lý Thành Đạt', '0944 556 178'],
];
function rng(seed) { let s = seed; return () => (s = (s * 1664525 + 1013904223) % 4294967296) / 4294967296; }
const NOW = new Date('2026-11-04T16:30:00+07:00').getTime();
const ALL = (() => {
  const r = rng(20261104), out = [];
  const stW = ['draft','draft','pending','pending','pending','shipping','shipping','shipping','done','done','done','done','done','done','cancelled','failed'];
  for (let i = 0; i < 126; i++) {
    const st = stW[Math.floor(r() * stW.length)];
    const c = CUSTOMERS[Math.floor(r() * CUSTOMERS.length)];
    const created = NOW - Math.floor(r() * 45 * 86400000) - i * 3600000;
    const total = Math.round((1 + r() * r() * 180) * 500000 / 1000) * 1000 + 250000;
    let pay = st === 'done' ? 'paid' : st === 'draft' || st === 'cancelled' ? 'unpaid' : ['paid','partial','unpaid'][Math.floor(r() * 3)];
    out.push({ id: 'DH-' + (1180 - i), status: st, customer: c[0], phone: c[1], channel: CHANNELS[Math.floor(r() * 4)],
      rep: REPS[Math.floor(r() * 5)], created, total, pay });
  }
  return out;
})();
let DB = ALL.slice();

// ---------- Helpers ----------
const $ = (s) => document.querySelector(s);
const vnd = new Intl.NumberFormat('vi-VN');
const vndC = new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' });
const fmtDate = (t) => new Intl.DateTimeFormat('vi-VN', { dateStyle: 'short', timeStyle: 'short', timeZone: 'Asia/Ho_Chi_Minh', hourCycle: 'h23' }).format(t).replace(/(\d{2}:\d{2}) (\d{2}\/\d{2}\/\d{4})/, '$2 $1').replace(', ', ' ');
const norm = (s) => s.normalize('NFD').replace(/\p{Diacritic}/gu, '').replace(/đ/gi, 'd').toLowerCase();
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ic = (p, cls = 'h-4 w-4') => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">${p}</svg>`;
const ICON = { x: '<path d="M18 6L6 18M6 6l12 12"/>', up: '<path d="M18 15l-6-6-6 6"/>', down: '<path d="M6 9l6 6 6-6"/>', dots: '<circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/>',
  warn: '<path d="M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0zM12 9v4M12 17h.01"/>', check: '<path d="M20 6L9 17l-5-5"/>', sort: '<path d="M7 15l5 5 5-5M7 9l5-5 5 5"/>' };
const badge = (m) => `<span class="inline-flex h-6 items-center whitespace-nowrap rounded-full px-2 text-xs font-medium ${TONE[m.tone]}">${m.label}</span>`;
const dayStart = (s) => new Date(s + 'T00:00:00+07:00').getTime();
const dayEnd = (s) => new Date(s + 'T23:59:59+07:00').getTime();

// ---------- State ----------
const DEF = { status: '', channel: [], rep: [], from: '', to: '', pay: [], min: '', max: '', q: '', sort: '-created', page: 1, size: 25 };
let S = { ...DEF };
let selected = new Set(), allMatching = false, density = 'normal', demo = 'normal', loadState = 'loading';
let hiddenCols = new Set(), failed = [], lastFocus = null;
const COLS = [
  { id: 'id', label: 'Mã đơn', sort: 'id' }, { id: 'status', label: 'Trạng thái' }, { id: 'customer', label: 'Khách hàng', sort: 'customer' },
  { id: 'phone', label: 'Điện thoại' }, { id: 'channel', label: 'Kênh bán' }, { id: 'rep', label: 'Phụ trách' },
  { id: 'created', label: 'Ngày tạo', sort: 'created' }, { id: 'pay', label: 'Thanh toán' }, { id: 'total', label: 'Tổng tiền (VND)', sort: 'total', right: true },
];
hiddenCols.add('phone');

// URL state
function readUrl() {
  const p = new URLSearchParams(location.search), s = { ...DEF, channel: [], rep: [], pay: [] };
  const st = p.get('status'); if (st && STATUS[st]) s.status = st;
  s.channel = p.getAll('channel').filter((v) => CHANNELS.includes(v));
  s.rep = p.getAll('rep').filter((v) => REPS.includes(v));
  s.pay = p.getAll('pay').filter((v) => PAY[v]);
  s.q = p.get('q') || ''; s.from = p.get('from') || ''; s.to = p.get('to') || ''; s.min = p.get('min') || ''; s.max = p.get('max') || '';
  const so = p.get('sort'); if (so && /^-?(id|customer|created|total)$/.test(so)) s.sort = so;
  s.page = Math.max(1, parseInt(p.get('page')) || 1); const sz = parseInt(p.get('size')); if ([25, 50, 100].includes(sz)) s.size = sz;
  return s;
}
function writeUrl() {
  const p = new URLSearchParams();
  if (S.status) p.set('status', S.status); S.channel.forEach((v) => p.append('channel', v)); S.rep.forEach((v) => p.append('rep', v)); S.pay.forEach((v) => p.append('pay', v));
  ['q', 'from', 'to', 'min', 'max'].forEach((k) => S[k] && p.set(k, S[k]));
  if (S.sort !== DEF.sort) p.set('sort', S.sort); if (S.page > 1) p.set('page', S.page); if (S.size !== DEF.size) p.set('size', S.size);
  const qs = p.toString(); try { history.replaceState(null, '', qs ? '?' + qs : location.pathname); } catch (e) {}
}

// ---------- Filtering ----------
function filtered(ignoreStatus) {
  const nq = norm(S.q.trim());
  const min = S.min ? Number(S.min) : null, max = S.max ? Number(S.max) : null;
  return DB.filter((o) =>
    (ignoreStatus || !S.status || o.status === S.status) &&
    (!S.channel.length || S.channel.includes(o.channel)) && (!S.rep.length || S.rep.includes(o.rep)) &&
    (!S.pay.length || S.pay.includes(o.pay)) &&
    (!S.from || o.created >= dayStart(S.from)) && (!S.to || o.created <= dayEnd(S.to)) &&
    (min === null || o.total >= min) && (max === null || o.total <= max) &&
    (nq.length < 2 || norm(o.id + ' ' + o.customer + ' ' + o.phone).includes(nq)));
}
function sorted(rows) {
  const desc = S.sort.startsWith('-'), key = S.sort.replace('-', '');
  const cmp = { id: (a, b) => parseInt(a.id.slice(3)) - parseInt(b.id.slice(3)), customer: (a, b) => a.customer.localeCompare(b.customer, 'vi'), created: (a, b) => a.created - b.created, total: (a, b) => a.total - b.total }[key];
  return rows.slice().sort((a, b) => (desc ? -1 : 1) * cmp(a, b));
}
const hasFilters = () => !!(S.status || S.channel.length || S.rep.length || S.pay.length || S.from || S.to || S.min || S.max || S.q.trim());

// ---------- Render ----------
function renderTabs() {
  const base = filtered(true), counts = { '': base.length };

  else if (c('#fDate')) togglePop('fDate', 'pDate', () => { $('#dFrom').value = S.from; $('#dTo').value = S.to; });
  else if (c('#fMore')) togglePop('fMore', 'pMore', () => { fillChecklist($('#mPay'), 'pay', Object.entries(PAY).map(([k, v]) => [k, v.label]), S.pay); $('#mMin').value = S.min; $('#mMax').value = S.max; });
  else if (c('#btnCols')) togglePop('btnCols', 'pCols', () => { $('#pCols').innerHTML = COLS.filter((x) => x.id !== 'id').map((x) => `<label class="flex h-8 cursor-pointer items-center gap-2 rounded px-2 hover:bg-slate-50"><input type="checkbox" data-col="${x.id}" class="h-4 w-4 accent-blue-700" ${hiddenCols.has(x.id) ? '' : 'checked'} aria-label="Hiển thị cột ${x.label}">${x.label}</label>`).join(''); });
  else if (c('#mApply')) { const min = $('#mMin').value.replace(/\D/g, ''), max = $('#mMax').value.replace(/\D/g, ''); const pay = [...document.querySelectorAll('#mPay input:checked')].map((i) => i.value); closePops(); $('#fMore').focus(); setFilters({ pay, min, max }); }
  else if (c('#mReset')) { fillChecklist($('#mPay'), 'pay', Object.entries(PAY).map(([k, v]) => [k, v.label]), []); $('#mMin').value = ''; $('#mMax').value = ''; }
  else if (c('#qClear')) { $('#q').value = ''; setFilters({ q: '' }); $('#q').focus(); }
  else if ((el = c('[data-chip]'))) {
    const k = el.dataset.chip, v = el.dataset.val;
    if (k === 'q') { $('#q').value = ''; setFilters({ q: '' }); } else if (k === 'status') setFilters({ status: '' });
    else if (k === 'date') setFilters({ from: '', to: '' }); else if (k === 'amount') setFilters({ min: '', max: '' });
    else setFilters({ [k]: S[k].filter((x) => x !== v) });
    ($('#chips button') || $('#q')).focus();
  }
  else if (c('#clearAll') || c('#clearAll2')) { $('#q').value = ''; setFilters({ status: '', channel: [], rep: [], pay: [], from: '', to: '', min: '', max: '', q: '' }); $('#q').focus(); }
  else if ((el = c('[data-sort]'))) { const k = el.dataset.sort, cur = S.sort; S.sort = cur === k ? '-' + k : cur === '-' + k ? DEF.sort : k; S.page = 1; render(); }
  else if ((el = c('[data-page]'))) { S.page = Number(el.dataset.page); render(); window.scrollTo({ top: 0 }); }
  else if (c('#retry')) load(500);
  else if (c('#btnDensity')) { density = density === 'normal' ? 'compact' : 'normal'; $('#btnDensity').setAttribute('aria-pressed', density === 'compact'); $('#btnDensity').classList.toggle('bg-slate-100', density === 'compact'); render(); }
  else if (c('#selMatching')) { allMatching = true; render(); }
  else if (c('#clearSel')) { selected.clear(); allMatching = false; render(); }
  else if (c('#bulkMore')) { const m = $('#bulkMenu'); m.classList.toggle('hidden'); $('#bulkMore').setAttribute('aria-expanded', String(!m.classList.contains('hidden'))); }
  else if ((el = c('[data-bulk]'))) { const m = $('#bulkMenu'); m && m.classList.add('hidden'); runBulk(el.dataset.bulk); }
  else if (c('#viewFailed')) dialog({ title: `Đơn lỗi (${failed.length})`, body: `<ul class="max-h-48 overflow-auto">${failed.map((f) => `<li class="py-1"><span class="font-medium">${f.id}</span>: ${esc(f.reason)}</li>`).join('')}</ul>`, confirm: 'Đóng', onOk: () => {} });
  else if ((el = c('[data-edit]'))) toast(`Mở màn hình sửa đơn ${el.dataset.edit}`);
  else if ((el = c('[data-menu]'))) {
    const id = el.dataset.menu, was = document.querySelector('.rowMenu'); closePops();
    if (was && was.dataset.for === id) return;
    const m = document.createElement('div'); m.className = 'rowMenu absolute right-0 top-8 z-30 w-44 rounded-md border border-slate-200 bg-white py-1 shadow-lg'; m.dataset.for = id;
    m.innerHTML = `<button data-ract="view" class="flex h-8 w-full items-center px-3 text-left text-sm hover:bg-slate-50">Xem chi tiết</button><button data-ract="copy" class="flex h-8 w-full items-center px-3 text-left text-sm hover:bg-slate-50">Nhân bản đơn</button><button data-ract="print" class="flex h-8 w-full items-center px-3 text-left text-sm hover:bg-slate-50">In phiếu</button><div class="my-1 border-t border-slate-200"></div><button data-ract="cancel" class="flex h-8 w-full items-center px-3 text-left text-sm text-red-700 hover:bg-red-50">Hủy đơn</button>`;
    el.parentElement.appendChild(m);
    m.onclick = (ev) => { const a = ev.target.closest('[data-ract]'); if (!a) return; m.remove(); const o = DB.find((x) => x.id === id);
      if (a.dataset.ract === 'cancel') {
        if (o.status === 'done') return dialog({ title: `Không thể hủy đơn ${id}`, body: 'Đơn đã hoàn thành. Hãy tạo phiếu trả hàng thay vì hủy đơn.', confirm: 'Đã hiểu', onOk: () => {} });
        dialog({ title: `Hủy đơn ${id}?`, body: `Đơn của ${esc(o.customer)} (${vnd.format(o.total)} ₫) sẽ chuyển sang "Đã hủy" và không thể hoàn tác.`, confirm: 'Hủy đơn', danger: true, onOk: () => { o.status = 'cancelled'; toast(`Đã hủy đơn ${id}`); render(); } });
      } else toast(`${a.textContent} – ${id}`); };
  }
  else if (c('#btnCreate') || c('[data-act="create"]')) toast('Mở form tạo đơn hàng');
  else if (c('#btnImport')) toast('Mở trình nhập đơn hàng từ CSV');
  else if (c('#btnExport')) toast(`Đang xuất ${filtered().length} đơn hàng ra Excel`);
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.id === 'selAll') { const rows = sorted(filtered()).slice((S.page - 1) * S.size, S.page * S.size); rows.forEach((o) => (t.checked ? selected.add(o.id) : selected.delete(o.id))); if (!t.checked) allMatching = false; render(); }
  else if (t.dataset.sel) { t.checked ? selected.add(t.dataset.sel) : selected.delete(t.dataset.sel); allMatching = false; render(); }
  else if (t.dataset.filter && t.dataset.filter !== 'pay') { const k = t.dataset.filter; const v = new Set(S[k]); t.checked ? v.add(t.value) : v.delete(t.value); S[k] = [...v]; S.page = 1; selected.clear(); allMatching = false; render(); }
  else if (t.dataset.col) { t.checked ? hiddenCols.delete(t.dataset.col) : hiddenCols.add(t.dataset.col); render(); }
  else if (t.id === 'dFrom' || t.id === 'dTo') setFilters({ from: $('#dFrom').value, to: $('#dTo').value });
  else if (t.id === 'size') { S.size = Number(t.value); S.page = 1; selected.clear(); allMatching = false; render(); }
  else if (t.id === 'demoState') { demo = t.value; selected.clear(); allMatching = false; showBanner(''); load(500); }
});
let qT; $('#q').addEventListener('input', (e) => { $('#qClear').classList.toggle('hidden', !e.target.value); $('#qClear').classList.toggle('flex', !!e.target.value); clearTimeout(qT); qT = setTimeout(() => setFilters({ q: e.target.value }), 300); });
$('#q').addEventListener('keydown', (e) => { if (e.key === 'Enter') { clearTimeout(qT); setFilters({ q: e.target.value }); } });
document.addEventListener('keydown', (e) => {
  if (e.key === '/' && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName) && $('#dlg').classList.contains('hidden')) { e.preventDefault(); $('#q').focus(); }
  if (e.key === 'Escape') closePops();
});
window.addEventListener('beforeunload', () => {});

// ---------- Init ----------
S = readUrl(); $('#q').value = S.q;
load(500);
})();
</script>
</body>
</html>
