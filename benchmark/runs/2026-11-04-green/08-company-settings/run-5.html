<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Company settings – Northwind Cloud admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 14px; color: #0f172a; }
  .skel { background: #e2e8f0; border-radius: 4px; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .5; } }
  .inp { height: 32px; width: 100%; border: 1px solid #94a3b8; border-radius: 4px; padding: 0 8px; background: #fff; color: #0f172a; }
  textarea.inp { height: auto; padding: 6px 8px; }
  .inp:focus, button:focus-visible, a:focus-visible, [role=switch]:focus-visible { outline: 2px solid #1d4ed8; outline-offset: 2px; }
  .inp[aria-invalid=true] { border-color: #b91c1c; }
  .btn { height: 32px; padding: 0 12px; border-radius: 4px; font-weight: 500; display: inline-flex; align-items: center; gap: 8px; }
  .btn-primary { background: #1d4ed8; color: #fff; } .btn-primary:hover { background: #1e40af; }
  .btn-primary:disabled { opacity: .7; cursor: not-allowed; }
  .btn-out { border: 1px solid #94a3b8; background: #fff; color: #0f172a; } .btn-out:hover { background: #f1f5f9; }
  .btn-danger { background: #b91c1c; color: #fff; } .btn-danger:hover { background: #991b1b; }
  .btn-danger:disabled { background: #fca5a5; color: #7f1d1d; cursor: not-allowed; }
  .btn-dout { border: 1px solid #b91c1c; color: #b91c1c; background: #fff; } .btn-dout:hover { background: #fef2f2; }
  .sw { width: 36px; height: 24px; border-radius: 9999px; background: #64748b; position: relative; transition: background .15s; flex: none; }
  .sw[aria-checked=true] { background: #1d4ed8; }
  .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 9999px; background: #fff; transition: transform .15s; }
  .sw[aria-checked=true]::after { transform: translateX(12px); }
  .spin { width: 16px; height: 16px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 9999px; animation: sp .7s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
</style>
</head>
<body class="bg-white">
<div class="flex min-h-screen">

  <!-- App sidebar -->
  <aside class="hidden w-60 shrink-0 border-r border-slate-200 bg-slate-50 lg:block">
    <div class="flex h-12 items-center gap-2 border-b border-slate-200 px-4">
      <span class="grid h-6 w-6 place-items-center rounded bg-blue-700 text-xs font-semibold text-white" aria-hidden="true">N</span>
      <span class="font-semibold">Northwind Cloud</span>
    </div>
    <nav aria-label="Main" class="flex flex-col gap-4 p-2">
      <div class="flex flex-col gap-0.5">
        <p class="px-2 py-1 text-xs font-medium text-slate-600">Workspace</p>
        <a href="#" class="flex h-8 items-center rounded px-2 hover:bg-slate-100">Overview</a>
        <a href="#" class="flex h-8 items-center rounded px-2 hover:bg-slate-100">Customers</a>
        <a href="#" class="flex h-8 items-center rounded px-2 hover:bg-slate-100">Subscriptions</a>
        <a href="#" class="flex h-8 items-center rounded px-2 hover:bg-slate-100">Invoices</a>
      </div>
      <div class="flex flex-col gap-0.5">
        <p class="px-2 py-1 text-xs font-medium text-slate-600">Administration</p>
        <a href="#" class="flex h-8 items-center rounded px-2 hover:bg-slate-100">Users &amp; roles</a>
        <a href="#" class="flex h-8 items-center rounded px-2 hover:bg-slate-100">Billing</a>
        <a href="#" aria-current="page" class="flex h-8 items-center rounded bg-slate-200 px-2 font-medium text-slate-900">Company settings</a>
      </div>
    </nav>
  </aside>

  <div class="flex min-w-0 flex-1 flex-col">
    <header class="flex h-12 items-center justify-between border-b border-slate-200 px-4">
      <button class="inline-flex h-8 w-64 max-w-full items-center justify-between rounded border border-slate-300 px-2 text-slate-600" type="button">
        <span>Search or run a command</span><kbd class="rounded border border-slate-300 px-1 text-xs">Ctrl K</kbd>
      </button>
      <div class="flex items-center gap-3">
        <span class="hidden text-slate-600 sm:inline">Linh Nguyen · Owner</span>
        <button type="button" aria-label="Account menu" class="grid h-8 w-8 place-items-center rounded-full bg-slate-200 text-xs font-medium">LN</button>
      </div>
    </header>

    <main id="main" class="min-w-0 flex-1 scroll-pb-20 px-6 pt-6">
      <nav aria-label="Breadcrumb" class="mb-2">
        <ol class="flex items-center gap-1 text-slate-600">
          <li>Administration</li><li aria-hidden="true">/</li><li aria-current="page" class="text-slate-900">Company settings</li>
        </ol>
      </nav>
      <div class="mb-4 flex flex-wrap items-center justify-between gap-2">
        <h1 class="text-xl font-semibold">Company settings</h1>
        <div class="relative">
          <button id="moreBtn" type="button" class="btn btn-out w-8 justify-center px-0" aria-label="More actions for company settings" aria-haspopup="menu" aria-expanded="false">&#8943;</button>
          <div id="moreMenu" role="menu" class="absolute right-0 z-20 mt-1 hidden w-56 rounded-md border border-slate-200 bg-white py-1 shadow-lg">
            <button role="menuitem" data-act="reload" class="flex h-8 w-full items-center px-3 text-left hover:bg-slate-100" type="button">Reload settings</button>
            <button role="menuitem" data-act="fail" class="flex h-8 w-full items-center px-3 text-left hover:bg-slate-100" type="button">Simulate load failure</button>
          </div>
        </div>
      </div>

      <div class="flex flex-col gap-6 md:flex-row">
        <!-- Settings navigation -->
        <nav aria-label="Settings" class="shrink-0 md:w-56">
          <div class="md:hidden">
            <label for="navSelect" class="mb-1 block text-xs font-medium text-slate-600">Settings section</label>
            <select id="navSelect" class="inp"></select>
          </div>
          <ul id="settingsNav" class="hidden flex-col gap-0.5 md:flex"></ul>
        </nav>

        <div class="min-w-0 max-w-[720px] flex-1">
          <div id="banner" role="alert"></div>
          <div id="panel"></div>
        </div>
      </div>
    </main>
  </div>
</div>

<div id="toasts" class="fixed bottom-20 right-4 z-40 flex flex-col gap-2" role="status" aria-live="polite"></div>
<div id="modalRoot"></div>

<script>
/* ---------- Mock data ---------- */
const DEFAULTS = {
  name: 'Northwind Logistics JSC', legal: 'Northwind Logistics Joint Stock Company', taxId: '0312345678',
  industry: 'Logistics', size: '201-500', website: 'https://www.northwind-logistics.vn',
  billingEmail: 'finance@northwind-logistics.vn', phone: '+84 28 3822 1234',
  address: '72 Lê Thánh Tôn, Bến Nghé', city: 'Ho Chi Minh City', postal: '700000', country: 'Vietnam',
  currency: 'VND', timezone: 'Asia/Ho_Chi_Minh', dateFormat: 'DD/MM/YYYY', numberFormat: 'vi-VN', weekStart: 'monday', language: 'en'
};
const NOTIF = [
  { id: 'invoice_overdue', label: 'Invoice overdue', desc: 'An invoice passes its due date unpaid', email: true, app: true },
  { id: 'payment_failed', label: 'Payment failed', desc: 'A subscription charge is declined', email: true, app: true },
  { id: 'user_invited', label: 'New user joined', desc: 'Someone accepts an invitation', email: false, app: true },
  { id: 'role_changed', label: 'Role or permission changed', desc: 'An admin edits a role or assigns one', email: true, app: true },
  { id: 'export_ready', label: 'Data export ready', desc: 'A requested export finishes', email: true, app: false },
  { id: 'weekly_digest', label: 'Weekly summary', desc: 'Every Monday at 08:00 in the company time zone', email: true, app: false },
];
const META = { general: { by: 'Trần Minh Quân', at: '28/10/2026 09:14' }, localization: { by: 'Linh Nguyen', at: '12/09/2026 16:40' }, notifications: { by: 'Linh Nguyen', at: '04/11/2026 08:02' } };
const IMPACT = { users: 48, customers: 1284, invoices: 312 };
const CURRENCIES = [['VND','Vietnamese dong (₫)'],['USD','US dollar ($)'],['EUR','Euro (€)'],['JPY','Japanese yen (¥)'],['SGD','Singapore dollar (S$)'],['GBP','British pound (£)']];
const TIMEZONES = [['Asia/Ho_Chi_Minh','(UTC+07:00) Ho Chi Minh City'],['Asia/Singapore','(UTC+08:00) Singapore'],['Asia/Tokyo','(UTC+09:00) Tokyo'],['Europe/London','(UTC+00:00) London'],['Europe/Berlin','(UTC+01:00) Berlin'],['America/New_York','(UTC-05:00) New York'],['America/Los_Angeles','(UTC-08:00) Los Angeles']];
const DATEFMT = [['DD/MM/YYYY','DD/MM/YYYY'],['MM/DD/YYYY','MM/DD/YYYY'],['YYYY-MM-DD','YYYY-MM-DD'],['D MMM YYYY','D MMM YYYY']];
const NUMFMT = [['vi-VN','1.250.000,50 (dot thousands, comma decimal)'],['en-US','1,250,000.50 (comma thousands, dot decimal)'],['de-CH',"1’250’000.50 (apostrophe thousands)"]];
const SECTIONS = [
  { id: 'general', label: 'General', group: 'Company', title: 'General information', desc: 'Legal identity and contact details used on invoices and emails.' },
  { id: 'localization', label: 'Localization', group: 'Company', title: 'Localization', desc: 'Currency, time zone and formats applied to every user in this company.' },
  { id: 'notifications', label: 'Notifications', group: 'Company', title: 'Notifications', desc: 'Company-wide defaults. Members can override them in their own profile.' },
  { id: 'danger', label: 'Danger zone', group: 'Danger zone', title: 'Danger zone', desc: 'Irreversible actions. Only the company owner can see and use these.' },
];

/* ---------- State ---------- */
const $ = (s, r = document) => r.querySelector(s);
const state = { section: 'general', loading: true, loadError: false, saved: { ...DEFAULTS }, draft: { ...DEFAULTS }, notif: JSON.parse(JSON.stringify(NOTIF)),
  errors: {}, touched: {}, saving: false, banner: '', failNext: false };
const FORM_KEYS = { general: ['name','legal','taxId','industry','size','website','billingEmail','phone','address','city','postal','country'], localization: ['currency','timezone','dateFormat','numberFormat','weekStart','language'] };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

const isDirty = () => (FORM_KEYS[state.section] || []).some(k => state.draft[k] !== state.saved[k]);
const anyDirty = isDirty;

/* ---------- Validation ---------- */
const RULES = {
  name: v => v.trim() ? '' : 'Enter the company name',
  legal: v => v.trim() ? '' : 'Enter the registered legal name',
  taxId: v => /^\d{10}(-\d{3})?$/.test(v.trim()) ? '' : 'Enter a tax ID of 10 digits, or 13 digits like 0312345678-001',
  billingEmail: v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim()) ? '' : 'Enter an email like name@company.com',
  website: v => !v.trim() || /^https?:\/\/[^\s.]+\.[^\s]+$/.test(v.trim()) ? '' : 'Enter a web address starting with https://',
  postal: v => !v.trim() || /^\d{4,10}$/.test(v.trim()) ? '' : 'Use digits only, 4 to 10 characters',
};
const FIELD_LABELS = { name: 'Company name', legal: 'Legal name', taxId: 'Tax ID', billingEmail: 'Billing email', website: 'Website', postal: 'Postal code' };
function validateField(k) { const r = RULES[k]; state.errors[k] = r ? r(state.draft[k]) : ''; if (!state.errors[k]) delete state.errors[k]; }

/* ---------- Format previews ---------- */
function fmtDate(d, f, tz) {
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-GB', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).formatToParts(d).map(x => [x.type, x.value]));
  const mon = new Intl.DateTimeFormat('en-GB', { timeZone: tz, month: 'short' }).format(d);
  return { 'DD/MM/YYYY': `${p.day}/${p.month}/${p.year}`, 'MM/DD/YYYY': `${p.month}/${p.day}/${p.year}`, 'YYYY-MM-DD': `${p.year}-${p.month}-${p.day}`, 'D MMM YYYY': `${+p.day} ${mon} ${p.year}` }[f] + ` ${p.hour}:${p.minute}`;
}
function previewHTML() {
  const d = state.draft, now = new Date('2026-11-04T08:58:00Z');
  let money, num;
  try { money = new Intl.NumberFormat(d.numberFormat, { style: 'currency', currency: d.currency }).format(1250000); num = new Intl.NumberFormat(d.numberFormat, { minimumFractionDigits: 2 }).format(1250000.5); } catch (e) { money = num = '—'; }
  const row = (l, v) => `<div class="flex items-baseline justify-between gap-4 py-1.5"><dt class="text-slate-600">${l}</dt><dd class="font-medium tabular-nums">${esc(v)}</dd></div>`;
  return `<dl class="divide-y divide-slate-200">${row('Date and time', fmtDate(now, d.dateFormat, d.timezone))}${row('Amount', money)}${row('Number', num)}</dl>`;
}

/* ---------- Field helpers ---------- */
function field(k, label, o = {}) {
  const err = state.errors[k], req = o.req, v = state.draft[k] ?? '';
  const help = o.help ? `<p id="${k}-help" class="mt-1 text-xs text-slate-600">${o.help}</p>` : '';
  const e = err ? `<p id="${k}-err" class="mt-1 flex items-center gap-1 text-sm text-red-700"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6.5"/><path d="M8 4.5v4M8 11v.01"/></svg>${esc(err)}</p>` : '';
  const desc = [o.help ? `${k}-help` : '', err ? `${k}-err` : ''].filter(Boolean).join(' ');
  let ctl;
  if (o.options) ctl = `<select id="${k}" data-k="${k}" class="inp" ${desc ? `aria-describedby="${desc}"` : ''}>${o.options.map(([val, t]) => `<option value="${esc(val)}" ${val === v ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select>`;
  else ctl = `<input id="${k}" data-k="${k}" class="inp" value="${esc(v)}" ${o.type ? `type="${o.type}"` : ''} ${o.ph ? `placeholder="${esc(o.ph)}"` : ''} ${req ? 'aria-required="true"' : ''} ${err ? 'aria-invalid="true"' : ''} ${desc ? `aria-describedby="${desc}"` : ''} autocomplete="off">`;
  return `<div class="${o.w || 'max-w-xl'}"><label for="${k}" class="mb-1 block text-xs font-medium text-slate-700">${label}${req ? ' <span aria-hidden="true">*</span>' : ''}</label>${ctl}${help}${e}</div>`;
}
const metaLine = id => `<p class="mt-1 text-xs text-slate-600">Last changed by ${META[id].by} on ${META[id].at} · <a href="#history" data-history="${id}" class="text-blue-700 underline">View history</a></p>`;

/* ---------- Render ---------- */
function renderNav() {
  const groups = [...new Set(SECTIONS.map(s => s.group))];
  $('#settingsNav').innerHTML = groups.map(g => {
    const items = SECTIONS.filter(s => s.group === g);
    const danger = g === 'Danger zone';
    return `<li class="${danger ? 'mt-3 border-t border-slate-200 pt-3' : ''}"><p class="px-2 py-1 text-xs font-medium text-slate-600">${g}</p><ul>${items.map(s => `<li><a href="#${s.id}" data-sec="${s.id}" ${s.id === state.section ? 'aria-current="page"' : ''} class="flex h-8 items-center rounded px-2 ${s.id === state.section ? 'bg-slate-200 font-medium text-slate-900' : (danger ? 'text-red-700 hover:bg-red-50' : 'hover:bg-slate-100')}">${s.label}</a></li>`).join('')}</ul></li>`;
  }).join('');
  $('#navSelect').innerHTML = SECTIONS.map(s => `<option value="${s.id}" ${s.id === state.section ? 'selected' : ''}>${s.label}</option>`).join('');
}

function skeleton() {
  const b = (w, h = 32) => `<div class="skel" style="width:${w};height:${h}px"></div>`;
  return `<div aria-busy="true" aria-label="Loading settings" class="space-y-6"><div class="space-y-2">${b('40%', 24)}${b('65%', 16)}</div>${[1,2,3,4,5].map(() => `<div class="space-y-2">${b('20%', 12)}${b('100%')}</div>`).join('')}</div>`;
}

function renderPanel() {
  const sec = SECTIONS.find(s => s.id === state.section);
  const p = $('#panel');
  if (state.loading) { p.innerHTML = skeleton(); return; }
  if (state.loadError) {
    p.innerHTML = `<div role="alert" class="rounded-md border border-red-200 bg-red-50 p-4 text-red-800"><p class="font-medium">Company settings could not be loaded</p><p class="mt-1">The settings service did not respond (timeout after 10 s). Nothing was changed.</p><button id="retry" type="button" class="btn btn-out mt-3">Retry</button></div>`;
    return;
  }
  const head = `<div class="mb-6"><h2 class="text-lg font-semibold">${sec.title}</h2><p class="text-slate-600">${sec.desc}</p>${META[sec.id] ? metaLine(sec.id) : ''}</div>`;
  let body = '';
  if (sec.id === 'general') body = generalForm();
  if (sec.id === 'localization') body = localizationForm();
  if (sec.id === 'notifications') body = notificationsView();
  if (sec.id === 'danger') body = dangerView();
  p.innerHTML = head + body;
  if (state.focusAfter) { const el = document.getElementById(state.focusAfter); state.focusAfter = null; el && el.focus(); }
}

function summaryHTML() {
  const keys = Object.keys(state.errors);
  if (keys.length < 3 || !state.submitted) return '';
  return `<div class="mb-6 rounded-md border border-red-200 bg-red-50 p-4 text-red-800"><p class="font-medium">${keys.length} fields need attention</p><ul class="mt-2 list-disc pl-5">${keys.map(k => `<li><a href="#${k}" data-jump="${k}" class="inline-flex min-h-6 items-center underline">${FIELD_LABELS[k]}: ${esc(state.errors[k])}</a></li>`).join('')}</ul></div>`;
}

function actionBar() {
  const dirty = isDirty();
  return `<div class="sticky bottom-0 -mx-6 mt-8 flex items-center justify-end gap-3 border-t border-slate-200 bg-white px-6 py-3">
    <span role="status" class="mr-auto flex items-center gap-1.5 text-slate-600">${dirty ? '<span aria-hidden="true" class="inline-block h-1.5 w-1.5 rounded-full bg-amber-600"></span>Unsaved changes' : ''}</span>
    <button type="button" id="cancel" class="btn btn-out">Cancel</button>
    <button type="submit" id="save" class="btn btn-primary" ${state.saving ? 'disabled' : ''}>${state.saving ? '<span class="spin" aria-hidden="true"></span>' : ''}Save</button>
  </div>`;
}

const sub = (t, inner) => `<section class="mb-8"><h3 class="mb-4 border-b border-slate-200 pb-2 text-base font-semibold">${t}</h3><div class="space-y-6">${inner}</div></section>`;

function generalForm() {
  const f = field;
  return `<form id="form" novalidate>
    <p class="mb-6 text-xs text-slate-600">* Required</p>${summaryHTML()}
    ${sub('Company profile', f('name', 'Company name', { req: 1, help: 'Shown in the sidebar, emails and on customer-facing pages.' }) + f('legal', 'Legal name', { req: 1, help: 'Printed on invoices.' }) + f('taxId', 'Tax ID', { req: 1, w: 'max-w-xs', ph: '0312345678', help: '10 digits, or 13 with a branch suffix.' }) +
      `<div class="grid max-w-xl gap-6 sm:grid-cols-2">${f('industry', 'Industry', { w: '', options: [['Logistics','Logistics'],['Retail','Retail'],['Manufacturing','Manufacturing'],['Software','Software'],['Other','Other']] })}${f('size', 'Company size', { w: '', options: [['1-50','1–50 employees'],['51-200','51–200 employees'],['201-500','201–500 employees'],['501+','501+ employees']] })}</div>` + f('website', 'Website', { ph: 'https://www.example.com' }))}
    ${sub('Contact', f('billingEmail', 'Billing email', { req: 1, type: 'email', help: 'Invoices and payment receipts are sent here.' }) + f('phone', 'Phone', { w: 'max-w-xs', ph: '+84 28 0000 0000' }))}
    ${sub('Registered address', f('address', 'Street address') + `<div class="grid max-w-xl gap-6 sm:grid-cols-[1fr_8rem]">${f('city', 'City', { w: '' })}${f('postal', 'Postal code', { w: '' })}</div>` + f('country', 'Country', { w: 'max-w-xs', options: [['Vietnam','Vietnam'],['Singapore','Singapore'],['Japan','Japan'],['United States','United States'],['Germany','Germany']] }))}
    ${actionBar()}</form>`;
}

function localizationForm() {
  const f = field;
  return `<form id="form" novalidate>
    <div class="mb-8 rounded-md border border-slate-200 bg-slate-50 p-4"><h3 class="mb-1 text-base font-semibold">Preview</h3><div id="preview">${previewHTML()}</div></div>
    ${sub('Currency and numbers', f('currency', 'Currency', { options: CURRENCIES, help: 'Default for new invoices. Existing invoices keep their currency.', w: 'max-w-sm' }) + f('numberFormat', 'Number format', { options: NUMFMT }))}
    ${sub('Date and time', f('timezone', 'Time zone', { options: TIMEZONES, help: 'Reports and scheduled emails follow this zone.', w: 'max-w-sm' }) + f('dateFormat', 'Date format', { options: DATEFMT, w: 'max-w-xs' }) + f('weekStart', 'First day of week', { options: [['monday','Monday'],['sunday','Sunday'],['saturday','Saturday']], w: 'max-w-xs' }))}
    ${sub('Language', f('language', 'Default language', { options: [['en','English'],['vi','Tiếng Việt'],['ja','日本語']], w: 'max-w-xs', help: 'New members start with this language.' }))}
    ${actionBar()}</form>`;
}

function notificationsView() {
  const sw = (n, ch) => `<button type="button" role="switch" class="sw" aria-checked="${n[ch]}" aria-label="${n.label} – ${ch === 'email' ? 'email' : 'in-app'}" data-n="${n.id}" data-ch="${ch}"></button>`;
  return `<div class="mb-3 flex items-center justify-between"><p class="text-slate-600">Changes apply as soon as you switch them.</p><span id="savedMsg" role="status" class="text-sm font-medium text-green-700"></span></div>
  <div class="overflow-x-auto rounded-md border border-slate-200"><table class="w-full text-left">
    <thead class="border-b border-slate-200 bg-slate-50 text-slate-700"><tr><th scope="col" class="h-10 px-3 font-medium">Event</th><th scope="col" class="h-10 w-20 px-3 text-center font-medium">Email</th><th scope="col" class="h-10 w-20 px-3 text-center font-medium">In-app</th></tr></thead>
    <tbody class="divide-y divide-slate-200">${state.notif.map(n => `<tr><td class="px-3 py-2"><div class="font-medium">${n.label}</div><div class="text-xs text-slate-600">${n.desc}</div></td><td class="px-3 py-2"><div class="flex justify-center">${sw(n, 'email')}</div></td><td class="px-3 py-2"><div class="flex justify-center">${sw(n, 'app')}</div></td></tr>`).join('')}</tbody></table></div>
  <p class="mt-3 text-xs text-slate-600">Security alerts (sign-in from a new device, owner changes) are always sent and cannot be turned off.</p>`;
}

function dangerView() {
  const item = (t, d, btn) => `<div class="flex flex-wrap items-center justify-between gap-4 px-4 py-4"><div class="max-w-md"><p class="font-medium">${t}</p><p class="text-slate-600">${d}</p></div>${btn}</div>`;
  return `<div class="rounded-md border border-red-300"><div class="divide-y divide-red-200">
    ${item('Export all company data', 'Download customers, invoices and settings as a ZIP of CSV files. The link is emailed to you.', '<button type="button" class="btn btn-out" data-danger="export">Request export</button>')}
    ${item('Transfer ownership', 'Make another admin the company owner. You become an admin.', '<button type="button" class="btn btn-dout" data-danger="transfer">Transfer ownership</button>')}
    ${item('Deactivate company', 'Members lose access and billing stops. Data is kept for 90 days and can be restored by support.', '<button type="button" class="btn btn-dout" data-danger="deactivate">Deactivate company</button>')}
    ${item('Delete company', `Permanently deletes ${IMPACT.users} users, ${IMPACT.customers.toLocaleString('en-US')} customers and ${IMPACT.invoices} invoices. This cannot be undone.`, '<button type="button" class="btn btn-danger" data-danger="delete">Delete company</button>')}
  </div></div>`;
}

/* ---------- Banner / toast ---------- */
function setBanner(msg) { state.banner = msg; $('#banner').innerHTML = msg ? `<div class="mb-6 rounded-md border border-red-200 bg-red-50 p-4 text-red-800"><p class="font-medium">${msg}</p><button type="button" id="bannerRetry" class="btn btn-out mt-3">Retry</button></div>` : ''; }
function toast(msg) {
  const t = document.createElement('div');
  t.className = 'rounded-md border border-slate-200 bg-white px-4 py-2 shadow-lg';
  t.textContent = msg; $('#toasts').appendChild(t); setTimeout(() => t.remove(), 3500);
}

/* ---------- Dialogs ---------- */
function dialog({ title, body, actions, onOpen }) {
  const root = $('#modalRoot'), prev = document.activeElement;
  root.innerHTML = `<div class="fixed inset-0 z-50 grid place-items-center bg-slate-900/40 p-4"><div role="dialog" aria-modal="true" aria-labelledby="dlgT" class="w-full max-w-md rounded-lg bg-white p-6 shadow-xl"><h2 id="dlgT" class="text-lg font-semibold">${title}</h2><div class="mt-2 text-slate-700">${body}</div><div class="mt-6 flex justify-end gap-3">${actions}</div></div></div>`;
  const close = () => { root.innerHTML = ''; prev && prev.focus && prev.focus(); };
  root.onkeydown = e => { if (e.key === 'Escape') close(); if (e.key === 'Tab') { const f = [...root.querySelectorAll('button:not([disabled]),input')]; const i = f.indexOf(document.activeElement); if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); } else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); } } };
  onOpen && onOpen(root, close);
  return close;
}
function confirmLeave(then) {
  dialog({ title: 'You have unsaved changes. Leave without saving?', body: 'Your edits to this section will be discarded.',
    actions: '<button type="button" id="stay" class="btn btn-primary">Stay</button><button type="button" id="leave" class="btn btn-out text-red-700">Leave</button>',
    onOpen: (r, close) => { $('#stay', r).focus(); $('#stay', r).onclick = close; $('#leave', r).onclick = () => { close(); discard(); then(); }; } });
}
function discard() { (FORM_KEYS[state.section] || []).forEach(k => state.draft[k] = state.saved[k]); state.errors = {}; state.submitted = false; setBanner(''); }

function dangerDialog(kind) {
  const co = state.saved.name;
  const conf = {
    export: { title: 'Request a full data export?', body: `<p>A ZIP of all data for <b>${esc(co)}</b> will be emailed to linh.nguyen@northwind-logistics.vn.</p>`, label: 'Request export', cls: 'btn-primary', type: false, done: 'Export requested. We will email you when it is ready' },
    transfer: { title: `Transfer ownership of ${esc(co)}?`, body: `<p>You will become an admin. The new owner can remove your access. Choose the new owner:</p><select id="newOwner" class="inp mt-3" aria-label="New owner"><option>Trần Minh Quân (Finance manager)</option><option>Phạm Thu Hà (Operations lead)</option></select>`, label: 'Transfer ownership', cls: 'btn-danger', type: true, done: 'Ownership transfer sent for confirmation' },
    deactivate: { title: `Deactivate ${esc(co)}?`, body: `<p>${IMPACT.users} users will lose access immediately and billing stops. Data is kept for 90 days.</p>`, label: 'Deactivate company', cls: 'btn-danger', type: true, done: 'Company deactivation scheduled' },
    delete: { title: `Delete ${esc(co)}?`, body: `<p>${IMPACT.users} users, ${IMPACT.customers.toLocaleString('en-US')} customers and ${IMPACT.invoices} invoices will be permanently deleted. This cannot be undone.</p>`, label: 'Delete company', cls: 'btn-danger', type: true, done: 'Company deletion scheduled' },
  }[kind];
  const typed = conf.type ? `<label for="confirmName" class="mt-4 block text-xs font-medium text-slate-700">Type <b>${esc(co)}</b> to confirm</label><input id="confirmName" class="inp mt-1" autocomplete="off">` : '';
  dialog({ title: conf.title, body: conf.body + typed, actions: `<button type="button" id="dc" class="btn btn-out">Cancel</button><button type="button" id="dok" class="btn ${conf.cls}" ${conf.type ? 'disabled' : ''}>${conf.label}</button>`,
    onOpen: (r, close) => {
      const first = conf.type ? (kind === 'transfer' ? $('#newOwner', r) : $('#confirmName', r)) : $('#dok', r); first.focus();
      $('#dc', r).onclick = close;
      const ok = $('#dok', r), inp = $('#confirmName', r);
      if (inp) inp.oninput = () => { ok.disabled = inp.value.trim() !== co; };
      ok.onclick = () => { close(); toast(conf.done); };
    } });
}

/* ---------- Actions ---------- */
function load(fail) {
  state.loading = true; state.loadError = false; renderPanel();
  setTimeout(() => { state.loading = false; state.loadError = !!fail; renderPanel(); }, 450);
}
function go(sec, push = true) {
  const run = () => { state.section = sec; state.errors = {}; state.submitted = false; setBanner(''); if (push) history.replaceState(null, '', '#' + sec); renderNav(); renderPanel(); };
  if (sec === state.section) return;
  if (isDirty()) confirmLeave(run); else run();
}

function submit() {
  if (state.saving) return;
  const keys = FORM_KEYS[state.section];
  state.submitted = true; keys.forEach(validateField);
  if (Object.keys(state.errors).length) {
    renderPanel();
    const first = keys.find(k => state.errors[k]); document.getElementById(first).focus(); return;
  }
  state.saving = true; setBanner(''); renderPanel();
  setTimeout(() => {
    state.saving = false;
    if (state.failNext) { state.failNext = false; setBanner('Company settings could not be saved. Your changes are still here.'); renderPanel(); return; }
    if (state.section === 'general' && state.draft.taxId === '0100109106') {
      state.errors.taxId = 'Tax ID already used by Công ty Minh Phát'; renderPanel(); document.getElementById('taxId').focus(); return;
    }
    keys.forEach(k => state.saved[k] = state.draft[k]);
    META[state.section] = { by: 'Linh Nguyen', at: '04/11/2026 15:58' };
    state.submitted = false; renderPanel(); toast(state.section === 'general' ? `Company ${state.saved.name} saved` : 'Localization settings saved');
  }, 700);
}

function toggleNotif(id, ch, btn) {
  const n = state.notif.find(x => x.id === id), old = n[ch];
  n[ch] = !old; btn.setAttribute('aria-checked', n[ch]);
  setTimeout(() => {
    const m = $('#savedMsg'); if (!m) return;
    m.textContent = 'Saved'; clearTimeout(state.savedT); state.savedT = setTimeout(() => { m.textContent = ''; }, 2000);
  }, 250);
}

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const t = e.target;
  const nav = t.closest('[data-sec]'); if (nav) { e.preventDefault(); go(nav.dataset.sec); return; }
  const jump = t.closest('[data-jump]'); if (jump) { e.preventDefault(); document.getElementById(jump.dataset.jump).focus(); return; }
  if (t.closest('[data-history]')) { e.preventDefault(); toast('Change history opens in a side panel in the full app'); return; }
  if (t.closest('#retry')) { load(false); return; }
  if (t.closest('#bannerRetry')) { submit(); return; }
  if (t.closest('#cancel')) { if (isDirty()) confirmLeave(renderPanel); return; }
  const sw = t.closest('[role=switch]'); if (sw) { toggleNotif(sw.dataset.n, sw.dataset.ch, sw); return; }
  const dg = t.closest('[data-danger]'); if (dg) { dangerDialog(dg.dataset.danger); return; }
  const mb = t.closest('#moreBtn');
  const menu = $('#moreMenu');
  if (mb) { const open = menu.classList.toggle('hidden') === false; mb.setAttribute('aria-expanded', open); return; }
  const mi = t.closest('[data-act]');
  if (mi) { menu.classList.add('hidden'); $('#moreBtn').setAttribute('aria-expanded', 'false'); if (isDirty()) { confirmLeave(() => load(mi.dataset.act === 'fail')); } else load(mi.dataset.act === 'fail'); return; }
  menu.classList.add('hidden');
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { $('#moreMenu').classList.add('hidden'); $('#moreBtn').setAttribute('aria-expanded', 'false'); } });
document.addEventListener('submit', e => { e.preventDefault(); submit(); });
document.addEventListener('focusout', e => {
  const k = e.target.dataset && e.target.dataset.k;
  if (!k || !RULES[k] || !(FORM_KEYS[state.section] || []).includes(k)) return;
  state.touched[k] = true; const before = state.errors[k]; validateField(k);
  if (before !== state.errors[k]) { const pos = e.relatedTarget && e.relatedTarget.id; state.focusAfter = pos || null; renderPanel(); }
});
document.addEventListener('input', e => {
  const k = e.target.dataset && e.target.dataset.k; if (!k) return;
  state.draft[k] = e.target.value;
  if (state.errors[k] !== undefined && RULES[k]) { validateField(k); if (!state.errors[k]) { const el = e.target, pos = el.selectionStart; renderPanel(); const n = document.getElementById(k); n.focus(); try { n.setSelectionRange(pos, pos); } catch (_) {} return; } }
  if (state.section === 'localization') { $('#preview').innerHTML = previewHTML(); }
  const bar = $('#form [role=status]'); if (bar) bar.innerHTML = isDirty() ? '<span aria-hidden="true" class="inline-block h-1.5 w-1.5 rounded-full bg-amber-600"></span>Unsaved changes' : '';
});
document.addEventListener('change', e => {
  if (e.target.id === 'navSelect') { const v = e.target.value; go(v); e.target.value = state.section; return; }
  const k = e.target.dataset && e.target.dataset.k; if (k) { state.draft[k] = e.target.value; const bar = $('#form [role=status]'); if (bar) bar.innerHTML = isDirty() ? '<span aria-hidden="true" class="inline-block h-1.5 w-1.5 rounded-full bg-amber-600"></span>Unsaved changes' : ''; if (state.section === 'localization') $('#preview').innerHTML = previewHTML(); }
});
window.addEventListener('beforeunload', e => { if (isDirty()) { e.preventDefault(); e.returnValue = ''; } });
document.addEventListener('click', e => {
  const a = e.target.closest('a[href]'); if (!a || a.dataset.sec || a.dataset.jump || a.dataset.history) return;
  if (isDirty()) { e.preventDefault(); confirmLeave(() => {}); }
}, true);

/* ---------- Init ---------- */
const h = location.hash.slice(1); if (SECTIONS.some(s => s.id === h)) state.section = h;
renderNav(); load(new URLSearchParams(location.search).get('state') === 'error');
</script>
</body>
</html>
