<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Company settings · Northwind Cloud admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 14px; color: #0f172a; }
  :focus-visible { outline: 2px solid #1d4ed8; outline-offset: 2px; }
  dialog::backdrop { background: rgba(15, 23, 42, .4); }
  @media (prefers-reduced-motion: reduce) { .animate-pulse, .animate-spin { animation: none !important; } }
</style>
</head>
<body class="bg-white">
<div class="flex h-screen overflow-hidden">

  <!-- App sidebar -->
  <aside class="hidden w-60 shrink-0 flex-col border-r border-slate-200 bg-slate-50 md:flex">
    <div class="flex h-12 items-center gap-2 border-b border-slate-200 px-4">
      <span class="flex size-6 items-center justify-center rounded bg-slate-900 text-xs font-semibold text-white" aria-hidden="true">N</span>
      <span class="font-semibold">Northwind Cloud</span>
    </div>
    <nav aria-label="Main" class="flex-1 overflow-y-auto p-2">
      <p class="px-2 py-1 text-xs font-medium text-slate-600">Sales</p>
      <a data-ext href="#" class="flex h-8 items-center gap-2 rounded px-2 hover:bg-slate-200/60"><svg class="size-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 3h18v6H3zM3 13h18v8H3z"/></svg>Orders</a>
      <a data-ext href="#" class="flex h-8 items-center gap-2 rounded px-2 hover:bg-slate-200/60"><svg class="size-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-7 7-7s7 3 7 7M17 11a3 3 0 100-6"/></svg>Customers</a>
      <p class="mt-4 px-2 py-1 text-xs font-medium text-slate-600">Finance</p>
      <a data-ext href="#" class="flex h-8 items-center gap-2 rounded px-2 hover:bg-slate-200/60"><svg class="size-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 2h12v20l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6"/></svg>Invoices</a>
      <a data-ext href="#" class="flex h-8 items-center gap-2 rounded px-2 hover:bg-slate-200/60"><svg class="size-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 3v18h18M7 15l4-4 3 3 5-6"/></svg>Reports</a>
      <p class="mt-4 px-2 py-1 text-xs font-medium text-slate-600">Administration</p>
      <a href="#general" aria-current="page" class="flex h-8 items-center gap-2 rounded bg-slate-200/70 px-2 font-medium text-slate-900"><svg class="size-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>Settings</a>
    </nav>
    <div class="border-t border-slate-200 p-3 text-xs text-slate-600">
      <p class="mb-1 font-medium">Demo states</p>
      <button id="demoLoad" type="button" class="inline-flex min-h-6 items-center text-blue-700 underline">Reload page</button> ·
      <button id="demoError" type="button" class="inline-flex min-h-6 items-center text-blue-700 underline">Simulate load error</button>
    </div>
  </aside>

  <div class="flex min-w-0 flex-1 flex-col">
    <header class="flex h-12 shrink-0 items-center justify-between gap-3 border-b border-slate-200 bg-white px-4">
      <span class="font-semibold md:hidden">Northwind Cloud</span>
      <button type="button" class="ml-auto hidden h-8 w-72 items-center justify-between rounded border border-slate-300 px-2 text-slate-600 sm:flex md:ml-0">
        <span class="flex items-center gap-2"><svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>Search or run a command</span>
        <kbd class="rounded border border-slate-300 px-1 text-xs">Ctrl K</kbd>
      </button>
      <div class="flex items-center gap-1">
        <button type="button" aria-label="Notifications, 3 unread" class="relative flex size-8 items-center justify-center rounded hover:bg-slate-100"><svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 8a6 6 0 0112 0c0 7 3 9 3 9H3s3-2 3-9M10 21h4"/></svg><span class="absolute -right-0.5 -top-0.5 flex size-4 items-center justify-center rounded-full bg-blue-700 text-[10px] font-medium text-white" aria-hidden="true">3</span></button>
        <button type="button" aria-label="Help" class="flex size-8 items-center justify-center rounded hover:bg-slate-100"><svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 114 2c-1 .7-1.500 1-1.500 2M12 17h.01"/></svg></button>
        <button type="button" aria-label="Account menu" class="flex size-8 items-center justify-center rounded-full bg-slate-200 text-xs font-medium text-slate-900">NA</button>
      </div>
    </header>

    <div id="scroll" class="flex-1 scroll-pb-24 overflow-y-auto">
      <div class="mx-auto flex max-w-[1100px] flex-col gap-6 p-6 lg:flex-row lg:gap-10">

        <!-- Settings navigation -->
        <div class="lg:w-56 lg:shrink-0">
          <label for="navSelect" class="mb-1 block text-xs font-medium text-slate-600 lg:hidden">Settings section</label>
          <select id="navSelect" class="h-8 w-full rounded border border-slate-300 bg-white px-2 lg:hidden"></select>
          <nav id="settingsNav" aria-label="Settings" class="sticky top-6 hidden flex-col gap-0.5 lg:flex"></nav>
        </div>

        <main class="min-w-0 max-w-[720px] flex-1" id="content" aria-live="off"></main>
      </div>
    </div>
  </div>
</div>

<!-- Toasts -->
<div id="toasts" role="status" aria-live="polite" class="pointer-events-none fixed right-4 top-14 z-50 flex w-80 flex-col gap-2"></div>

<!-- Dialog -->
<dialog id="dlg" class="w-[calc(100%-2rem)] max-w-md rounded-lg border border-slate-200 p-0 text-slate-900 shadow-xl" aria-labelledby="dlgTitle"></dialog>

<script>
/* ---------- Mock data ---------- */
const COMPANY_NAME = 'Công ty TNHH Minh Phát';
const SECTIONS = [
  { id: 'general', label: 'General', group: 'Company', title: 'General information', purpose: 'Legal and contact details shown on invoices, quotes and emails sent to your customers.' },
  { id: 'localization', label: 'Localization', group: 'Company', title: 'Localization', purpose: 'Currency, time zone and formats used for every user in this company.' },
  { id: 'notifications', label: 'Notifications', group: 'Company', title: 'Notifications', purpose: 'Choose which company events reach admins. Changes apply immediately.' },
  { id: 'danger', label: 'Danger zone', group: 'Irreversible', title: 'Danger zone', purpose: 'Actions here affect the whole company and are hard or impossible to undo.' }
];
const INDUSTRIES = ['Wholesale and distribution', 'Retail', 'Manufacturing', 'Logistics', 'Professional services', 'Software'];
const SIZES = ['1–10 employees', '11–50 employees', '51–200 employees', '201–1,000 employees', 'More than 1,000'];
const COUNTRIES = ['Vietnam', 'Singapore', 'Japan', 'United States', 'Germany', 'Australia'];
const CURRENCIES = [['VND', 'Vietnamese dong (₫)'], ['USD', 'US dollar ($)'], ['EUR', 'Euro (€)'], ['JPY', 'Japanese yen (¥)'], ['SGD', 'Singapore dollar (S$)']];
const TIMEZONES = [['Asia/Ho_Chi_Minh', '(UTC+07:00) Ho Chi Minh City'], ['Asia/Singapore', '(UTC+08:00) Singapore'], ['Asia/Tokyo', '(UTC+09:00) Tokyo'], ['Europe/London', '(UTC+00:00) London'], ['Europe/Berlin', '(UTC+01:00) Berlin'], ['America/New_York', '(UTC−05:00) New York'], ['America/Los_Angeles', '(UTC−08:00) Los Angeles'], ['Australia/Sydney', '(UTC+11:00) Sydney']];
const DATE_FORMATS = [['DD/MM/YYYY', 'DD/MM/YYYY'], ['MM/DD/YYYY', 'MM/DD/YYYY'], ['YYYY-MM-DD', 'YYYY-MM-DD'], ['DD MMM YYYY', 'DD MMM YYYY']];
const NUMBER_FORMATS = [['vi-VN', '1.234.567,89'], ['en-US', '1,234,567.89'], ['fr-FR', '1 234 567,89']];
const LANGS = [['vi', 'Tiếng Việt'], ['en', 'English']];
const WEEKDAYS = [['1', 'Monday'], ['0', 'Sunday'], ['6', 'Saturday']];

const EVENTS = [
  { id: 'invoice_issued', label: 'Invoice issued', hint: 'A new invoice is sent to a customer' },
  { id: 'payment_received', label: 'Payment received', hint: 'A customer payment is matched' },
  { id: 'payment_failed', label: 'Payment failed', hint: 'A card or bank payment is declined' },
  { id: 'renewal', label: 'Subscription renewal reminder', hint: '14 days before renewal' },
  { id: 'user_invited', label: 'User invited or removed', hint: 'Changes to company membership' },
  { id: 'role_changed', label: 'Role or permission changed', hint: 'Edits to roles in Users & roles' },
  { id: 'new_device', label: 'Sign-in from a new device', hint: 'For owners and admins', locked: { email: 'Email is always on for security events' } }
];

const saved = {
  general: { name: COMPANY_NAME, legalName: 'Công ty Trách nhiệm hữu hạn Minh Phát', taxCode: '0312345679-001', industry: 'Wholesale and distribution', size: '51–200 employees', email: 'ketoan@minhphat.vn', phone: '+84 28 3822 0123', website: 'https://minhphat.vn', address: '27 Nguyễn Huệ, Phường Bến Nghé, Quận 1', city: 'TP. Hồ Chí Minh', postal: '700000', country: 'Vietnam' },
  localization: { language: 'vi', currency: 'VND', timezone: 'Asia/Ho_Chi_Minh', dateFormat: 'DD/MM/YYYY', numberFormat: 'vi-VN', weekStart: '1' },
  notifications: {
    matrix: { invoice_issued: { email: true, app: true }, payment_received: { email: true, app: true }, payment_failed: { email: true, app: true }, renewal: { email: true, app: false }, user_invited: { email: false, app: true }, role_changed: { email: true, app: true }, new_device: { email: true, app: true } },
    digest: 'weekly'
  }
};
const META = {
  general: { by: 'Trần Thu Hà (Owner)', at: '28/10/2026 14:12' },
  localization: { by: 'Nguyễn Văn An (Admin)', at: '12/09/2026 09:40' },
  notifications: { by: 'Nguyễn Văn An (Admin)', at: '30/10/2026 17:05' },
  danger: { by: 'Trần Thu Hà (Owner)', at: '03/01/2026 10:30' }
};
const HISTORY = {
  general: [['28/10/2026 14:12', 'Trần Thu Hà', 'Phone', '+84 28 3822 0100', '+84 28 3822 0123'], ['28/10/2026 14:12', 'Trần Thu Hà', 'Company size', '11–50 employees', '51–200 employees'], ['02/06/2026 08:55', 'Nguyễn Văn An', 'Billing email', 'admin@minhphat.vn', 'ketoan@minhphat.vn']],
  localization: [['12/09/2026 09:40', 'Nguyễn Văn An', 'Date format', 'MM/DD/YYYY', 'DD/MM/YYYY'], ['12/09/2026 09:40', 'Nguyễn Văn An', 'Time zone', 'Asia/Singapore', 'Asia/Ho_Chi_Minh']],
  notifications: [['30/10/2026 17:05', 'Nguyễn Văn An', 'User invited or removed – Email', 'On', 'Off'], ['14/08/2026 11:20', 'Trần Thu Hà', 'Activity digest', 'Daily', 'Weekly']],
  danger: [['03/01/2026 10:30', 'Trần Thu Hà', 'Company owner', 'Lê Quốc Bảo', 'Trần Thu Hà']]
};
const OWNERS = ['Nguyễn Văn An (Admin)', 'Phạm Minh Quân (Finance manager)', 'Lê Quốc Bảo (Admin)'];
const IMPACT = { users: 48, orders: 1284, invoices: 312, files: 9420 };

/* ---------- Helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const clone = o => JSON.parse(JSON.stringify(o));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const delay = ms => new Promise(r => setTimeout(r, ms));
const ICON = {
  alert: '<svg class="size-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>',
  check: '<svg class="size-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>',
  spin: '<svg class="size-4 animate-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M12 3a9 9 0 019 9" /></svg>'
};
const BTN = 'inline-flex h-8 items-center justify-center gap-2 rounded px-3 font-medium';
const BTN_PRIMARY = BTN + ' bg-blue-700 text-white hover:bg-blue-800 disabled:cursor-not-allowed disabled:opacity-70';
const BTN_SECONDARY = BTN + ' border border-slate-300 bg-white text-slate-900 hover:bg-slate-50';
const BTN_DANGER = BTN + ' bg-red-700 text-white hover:bg-red-800 disabled:cursor-not-allowed disabled:opacity-50';
const BTN_DANGER_OUT = BTN + ' border border-red-700 bg-white text-red-700 hover:bg-red-50';
const INPUT = 'h-8 w-full rounded border border-slate-300 bg-white px-2 text-slate-900 placeholder:text-slate-500';

let current = 'general';
let draft = { general: clone(saved.general), localization: clone(saved.localization) };
let errors = { general: {}, localization: {} };
let loadState = 'loading'; // loading | error | ready
let forceError = new URLSearchParams(location.search).get('state') === 'error';
let saving = false;
let ignoreHash = false;
let pending = null;

const isDirty = id => (id === 'general' || id === 'localization') && JSON.stringify(draft[id]) !== JSON.stringify(saved[id]);
const anyDirty = () => isDirty('general') || isDirty('localization');

/* ---------- Settings nav ---------- */
function renderNav() {
  let html = '', group = '';
  SECTIONS.forEach(s => {
    if (s.group !== group) { group = s.group; html += `<p class="${html ? 'mt-4 ' : ''}px-2 py-1 text-xs font-medium text-slate-600">${s.group}</p>`; }
    const act = s.id === current;
    html += `<a href="#${s.id}" ${act ? 'aria-current="page"' : ''} class="flex h-8 items-center rounded px-2 ${act ? 'bg-slate-200/70 font-medium text-slate-900' : 'text-slate-700 hover:bg-slate-100'} ${s.id === 'danger' ? 'text-red-700' : ''}">${s.label}${isDirty(s.id) ? '<span class="ml-auto size-1.5 rounded-full bg-amber-500" title="Unsaved changes"></span><span class="sr-only">Unsaved changes</span>' : ''}</a>`;
  });
  $('#settingsNav').innerHTML = html;
  const sel = $('#navSelect');
  sel.innerHTML = SECTIONS.map(s => `<option value="${s.id}" ${s.id === current ? 'selected' : ''}>${s.label}</option>`).join('');
}
$('#navSelect').addEventListener('change', e => { location.hash = e.target.value; });

/* ---------- Field builders ---------- */
function fieldHtml(form, name, label, o = {}) {
  const v = draft[form][name] ?? '';
  const id = `${form}-${name}`;
  const err = errors[form][name];
  const desc = [o.help ? id + '-help' : '', err ? id + '-error' : ''].filter(Boolean).join(' ');
  const attrs = `id="${id}" data-form="${form}" data-f="${name}" ${o.required ? 'aria-required="true"' : ''} ${err ? 'aria-invalid="true"' : ''} ${desc ? `aria-describedby="${desc}"` : ''}`;
  const cls = INPUT + (err ? ' !border-red-700' : '');
  let control;
  if (o.options) {
    control = `<select ${attrs} class="${cls}">${o.options.map(op => { const [val, text] = Array.isArray(op) ? op : [op, op]; return `<option value="${esc(val)}" ${val === v ? 'selected' : ''}>${esc(text)}</option>`; }).join('')}</select>`;
  } else {
    control = `<input ${attrs} type="${o.type || 'text'}" value="${esc(v)}" ${o.placeholder ? `placeholder="${esc(o.placeholder)}"` : ''} ${o.inputmode ? `inputmode="${o.inputmode}"` : ''} autocomplete="off" class="${cls}">`;
  }
  return `<div class="${o.width || 'max-w-xl'} w-full">
    <label for="${id}" class="mb-1 block text-xs font-medium text-slate-700">${label}${o.required ? ' <span aria-hidden="true">*</span>' : ''}</label>
    ${control}
    ${o.help ? `<p id="${id}-help" class="mt-1 text-xs text-slate-600">${o.help}</p>` : ''}
    <p id="${id}-error" class="mt-1 flex items-center gap-1 text-xs text-red-700 ${err ? '' : 'hidden'}">${err ? ICON.alert + esc(err) : ''}</p>
  </div>`;
}

/* ---------- Validation ---------- */
const RULES = {
  general: {
    name: v => v.trim() ? '' : 'Enter the company name',
    legalName: v => v.trim() ? '' : 'Enter the registered legal name',
    taxCode: v => /^\d{10}(-\d{3})?$/.test(v.trim()) ? '' : 'Enter 10 digits, or 13 with a branch code like 0312345679-001',
    email: v => /^\S+@\S+\.\S+$/.test(v.trim()) ? '' : 'Enter an email like name@company.com',
    phone: v => !v.trim() || /^\+?[\d\s().-]{8,}$/.test(v.trim()) ? '' : 'Enter a phone number like +84 28 3822 0123',
    website: v => !v.trim() || /^https?:\/\/\S+\.\S+$/.test(v.trim()) ? '' : 'Enter a URL starting with https://',
    postal: v => !v.trim() || /^\d{5,6}$/.test(v.trim()) ? '' : 'Enter 5 or 6 digits'
  },
  localization: {}
};
const LABELS = { name: 'Company name', legalName: 'Legal name', taxCode: 'Tax code', email: 'Billing email', phone: 'Phone', website: 'Website', postal: 'Postal code' };
function validateField(form, name) {
  const rule = RULES[form][name];
  const msg = rule ? rule(draft[form][name] || '') : '';
  if (msg) errors[form][name] = msg; else delete errors[form][name];
  paintError(form, name);
  return msg;
}
function paintError(form, name) {
  const id = `${form}-${name}`, input = document.getElementById(id), p = document.getElementById(id + '-error');
  if (!input || !p) return;
  const msg = errors[form][name];
  p.classList.toggle('hidden', !msg);
  p.innerHTML = msg ? ICON.alert + esc(msg) : '';
  input.classList.toggle('!border-red-700', !!msg);
  if (msg) {
    input.setAttribute('aria-invalid', 'true');
    input.setAttribute('aria-describedby', [document.getElementById(id + '-help') ? id + '-help' : '', id + '-error'].filter(Boolean).join(' '));
  } else {
    input.removeAttribute('aria-invalid');
    input.setAttribute('aria-describedby', document.getElementById(id + '-help') ? id + '-help' : '');
    if (!document.getElementById(id + '-help')) input.removeAttribute('aria-describedby');
  }
}
function validateAll(form) {
  Object.keys(RULES[form]).forEach(n => validateField(form, n));
  const keys = Object.keys(errors[form]);
  const sum = document.getElementById(form + '-summary');
  if (sum) {
    sum.innerHTML = keys.length >= 3 ? `<div class="mb-6 rounded border border-red-300 bg-red-50 p-4 text-red-900"><p class="flex items-center gap-2 font-medium">${ICON.alert}${keys.length} fields need attention</p><ul class="mt-2 list-disc pl-6">${keys.map(k => `<li><a href="#${form}-${k}" data-jump="${form}-${k}" class="inline-flex min-h-6 items-center underline">${LABELS[k]}: ${esc(errors[form][k])}</a></li>`).join('')}</ul></div>` : '';
  }
  if (keys.length) {
    const first = Object.keys(RULES[form]).find(k => errors[form][k]);
    document.getElementById(`${form}-${first}`).focus();
  }
  return keys.length === 0;
}

/* ---------- Section renderers ---------- */
function metaLine(id) {
  const m = META[id];
  return `<p class="mt-2 text-xs text-slate-600">Last changed by ${esc(m.by)} on ${m.at} · <button type="button" data-history="${id}" class="inline-flex min-h-6 items-center text-blue-700 underline">View history</button></p>`;
}
function sectionHeader(s) {
  return `<nav aria-label="Breadcrumb" class="mb-2"><ol class="flex items-center gap-1 text-slate-600"><li>Settings</li><li aria-hidden="true">/</li><li aria-current="page" class="text-slate-900">${s.label}</li></ol></nav>
  <h1 class="text-xl font-semibold">${s.title}</h1>
  <p class="mt-1 text-slate-600">${s.purpose}</p>
  ${metaLine(s.id)}`;
}
function actionBar(form) {
  return `<div class="sticky bottom-0 -mx-1 mt-8 flex items-center justify-end gap-3 border-t border-slate-200 bg-white px-1 py-3">
    <span id="${form}-dirty" role="status" class="mr-auto flex items-center gap-1.5 text-slate-700"></span>
    <button type="button" data-cancel="${form}" class="${BTN_SECONDARY}">Cancel</button>
    <button type="submit" id="${form}-save" class="${BTN_PRIMARY}"><span data-spin class="hidden">${ICON.spin}</span>Save</button>
  </div>`;
}
function sub(title, body, first) {
  return `<section class="${first ? '' : 'mt-8'}"><h2 class="mb-4 border-b border-slate-200 pb-2 text-base font-semibold">${title}</h2><div class="flex flex-col gap-6">${body}</div></section>`;
}

function renderGeneral() {
  const s = SECTIONS[0];
  return `${sectionHeader(s)}
  <div id="serverBanner" role="alert"></div>
  <form id="form-general" novalidate class="mt-6">
    <div id="general-summary" role="status"></div>
    <p class="mb-6 text-xs text-slate-600">* Required</p>
    ${sub('Company profile', `
      ${fieldHtml('general', 'name', 'Company name', { required: true, help: 'Shown in the app header and on documents.' })}
      ${fieldHtml('general', 'legalName', 'Legal name', { required: true })}
      ${fieldHtml('general', 'taxCode', 'Tax code', { required: true, width: 'max-w-xs', help: 'Printed on every invoice.' })}
      <div class="flex flex-col gap-6 sm:flex-row">
        ${fieldHtml('general', 'industry', 'Industry', { options: INDUSTRIES, width: 'sm:w-1/2' })}
        ${fieldHtml('general', 'size', 'Company size', { options: SIZES, width: 'sm:w-1/2' })}
      </div>`, true)}
    ${sub('Contact', `
      ${fieldHtml('general', 'email', 'Billing email', { required: true, type: 'email', help: 'Invoices and billing notices are sent here.' })}
      <div class="flex flex-col gap-6 sm:flex-row">
        ${fieldHtml('general', 'phone', 'Phone', { width: 'sm:w-56', type: 'tel' })}
        ${fieldHtml('general', 'website', 'Website', { placeholder: 'https://example.com', width: 'sm:flex-1' })}
      </div>`)}
    ${sub('Address', `
      ${fieldHtml('general', 'address', 'Street address')}
      <div class="flex flex-col gap-6 sm:flex-row">
        ${fieldHtml('general', 'city', 'City', { width: 'sm:flex-1' })}
        ${fieldHtml('general', 'postal', 'Postal code', { width: 'sm:w-28', inputmode: 'numeric' })}
      </div>
      ${fieldHtml('general', 'country', 'Country', { options: COUNTRIES, width: 'max-w-xs' })}`)}
    ${actionBar('general')}
  </form>`;
}

function renderLocalization() {
  const s = SECTIONS[1];
  return `${sectionHeader(s)}
  <form id="form-localization" novalidate class="mt-6">
    ${sub('Currency and language', `
      ${fieldHtml('localization', 'language', 'Language', { options: LANGS, width: 'max-w-xs' })}
      ${fieldHtml('localization', 'currency', 'Currency', { options: CURRENCIES, width: 'max-w-xs', help: 'Existing documents keep the currency they were issued in.' })}`, true)}
    ${sub('Time and dates', `
      ${fieldHtml('localization', 'timezone', 'Time zone', { options: TIMEZONES, width: 'max-w-sm' })}
      <div class="flex flex-col gap-6 sm:flex-row">
        ${fieldHtml('localization', 'dateFormat', 'Date format', { options: DATE_FORMATS, width: 'sm:w-52' })}
        ${fieldHtml('localization', 'weekStart', 'First day of week', { options: WEEKDAYS, width: 'sm:w-52' })}
      </div>
      ${fieldHtml('localization', 'numberFormat', 'Number format', { options: NUMBER_FORMATS, width: 'max-w-xs' })}`)}
    ${sub('Preview', `<div class="rounded-md border border-slate-200 bg-slate-50 p-4"><p class="text-xs font-medium text-slate-600">How a document dated today reads</p><dl id="preview" class="mt-3 grid grid-cols-[8rem_1fr] gap-x-4 gap-y-2" aria-live="polite"></dl></div>`)}
    ${actionBar('localization')}
  </form>`;
}

function formatPreview(l) {
  const ref = new Date(Date.UTC(2026, 10, 4, 8, 58));
  const parts = Object.fromEntries(new Intl.DateTimeFormat('en-GB', { timeZone: l.timezone, year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(ref).map(p => [p.type, p.value]));
  const mon = new Intl.DateTimeFormat('en-GB', { timeZone: l.timezone, month: 'short' }).format(ref);
  const time = new Intl.DateTimeFormat('en-GB', { timeZone: l.timezone, hour: '2-digit', minute: '2-digit', hour12: false }).format(ref);
  const date = { 'DD/MM/YYYY': `${parts.day}/${parts.month}/${parts.year}`, 'MM/DD/YYYY': `${parts.month}/${parts.day}/${parts.year}`, 'YYYY-MM-DD': `${parts.year}-${parts.month}-${parts.day}`, 'DD MMM YYYY': `${parts.day} ${mon} ${parts.year}` }[l.dateFormat];
  const money = new Intl.NumberFormat(l.numberFormat, { style: 'currency', currency: l.currency }).format(1250000);
  const num = new Intl.NumberFormat(l.numberFormat, { minimumFractionDigits: 2 }).format(1234567.89);
  return [['Date', date], ['Date and time', `${date} ${time}`], ['Amount', money], ['Number', num]];
}
function paintPreview() {
  const el = $('#preview');
  if (!el) return;
  const rows = formatPreview(draft.localization);
  el.innerHTML = rows.map(([k, v]) => `<dt class="text-slate-600">${k}</dt><dd class="font-medium tabular-nums">${esc(v)}</dd>`).join('') +
    `<dt class="text-slate-600">Combined</dt><dd class="font-medium tabular-nums">${esc(rows[0][1])} · ${esc(rows[2][1])}</dd>`;
}

function renderNotifications() {
  const s = SECTIONS[2], n = saved.notifications;
  const rows = EVENTS.map(ev => {
    const cell = ch => {
      const lbl = `${ev.label} – ${ch === 'email' ? 'Email' : 'In-app'}`;
      const locked = ev.locked && ev.locked[ch];
      return `<td class="p-0 text-center"><label class="flex h-10 min-w-[4rem] cursor-pointer items-center justify-center" ${locked ? `title="${esc(ev.locked[ch])}"` : ''}><input type="checkbox" data-ev="${ev.id}" data-ch="${ch}" aria-label="${esc(lbl)}" class="size-4 accent-blue-700" ${n.matrix[ev.id][ch] ? 'checked' : ''} ${locked ? 'disabled' : ''}></label></td>`;
    };
    return `<tr class="h-10 border-t border-slate-200"><th scope="row" class="py-1.5 pr-3 text-left font-normal"><span class="font-medium">${ev.label}</span><span class="block text-xs text-slate-600">${ev.hint}${ev.locked ? ' · Email is always on' : ''}</span></th>${cell('email')}${cell('app')}<td class="w-16 pl-2"><span role="status" data-saved="${ev.id}" class="flex items-center gap-1 text-xs text-green-800"></span></td></tr>`;
  }).join('');
  return `${sectionHeader(s)}
  <div class="mt-6">
    ${sub('Events', `<div class="overflow-x-auto"><table class="w-full">
      <caption class="sr-only">Notification events by channel</caption>
      <thead><tr class="h-10 text-xs text-slate-700"><th scope="col" class="text-left font-medium">Event</th><th scope="col" class="text-center font-medium">Email</th><th scope="col" class="text-center font-medium">In-app</th><th scope="col" class="w-16"><span class="sr-only">Status</span></th></tr></thead>
      <tbody>${rows}</tbody></table></div>
      <p class="text-xs text-slate-600">Billing notices go to ${esc(saved.general.email)}. Change it in General.</p>`, true)}
    ${sub('Summary email', `<div class="flex items-end gap-3"><div class="w-full max-w-xs"><label for="digest" class="mb-1 block text-xs font-medium text-slate-700">Activity digest</label>
      <select id="digest" class="${INPUT}"><option value="off" ${n.digest === 'off' ? 'selected' : ''}>Off</option><option value="daily" ${n.digest === 'daily' ? 'selected' : ''}>Daily at 08:00</option><option value="weekly" ${n.digest === 'weekly' ? 'selected' : ''}>Weekly on Monday</option></select></div>
      <span role="status" data-saved="digest" class="mb-1.5 flex items-center gap-1 text-xs text-green-800"></span></div>`)}
  </div>`;
}

function renderDanger() {
  const s = SECTIONS[3];
  const row = (title, text, btn) => `<div class="flex flex-col gap-3 py-4 sm:flex-row sm:items-center sm:justify-between"><div class="max-w-md"><h3 class="font-medium">${title}</h3><p class="mt-0.5 text-slate-600">${text}</p></div>${btn}</div>`;
  return `${sectionHeader(s)}
  <div class="mt-6 rounded-md border border-red-300">
    <div class="divide-y divide-slate-200 px-4">
      ${row('Export all company data', `Download ${IMPACT.orders.toLocaleString('en-US')} orders, ${IMPACT.invoices} invoices and ${IMPACT.users} user records as CSV. We email a link when it is ready.`, `<button type="button" id="btnExport" class="${BTN_SECONDARY} shrink-0">Export data</button>`)}
      ${row('Transfer ownership', 'The new owner gets full billing and security control. You become an admin.', `<button type="button" id="btnTransfer" class="${BTN_DANGER_OUT} shrink-0">Transfer ownership</button>`)}
      ${row('Delete this company', `Permanently deletes ${esc(COMPANY_NAME)} with all users, orders, invoices and files. This can't be undone.`, `<button type="button" id="btnDelete" class="${BTN_DANGER} shrink-0">Delete company</button>`)}
    </div>
  </div>`;
}

function skeleton() {
  const b = w => `<div class="h-8 ${w} rounded bg-slate-200 animate-pulse"></div>`;
  return `<div aria-busy="true"><span class="sr-only" role="status">Loading settings</span><div aria-hidden="true">
    <div class="h-4 w-40 rounded bg-slate-200 animate-pulse"></div><div class="mt-3 h-6 w-64 rounded bg-slate-200 animate-pulse"></div><div class="mt-2 h-4 w-96 max-w-full rounded bg-slate-200 animate-pulse"></div>
    <div class="mt-8 flex flex-col gap-6">${[1, 2, 3, 4, 5].map(() => `<div><div class="mb-2 h-3 w-24 rounded bg-slate-200 animate-pulse"></div>${b('max-w-xl')}</div>`).join('')}</div></div></div>`;
}
function errorState() {
  return `<div class="rounded-md border border-slate-200 p-8 text-center">
    <p class="flex items-center justify-center gap-2 text-base font-medium text-red-700">${ICON.alert}Couldn't load company settings</p>
    <p class="mx-auto mt-2 max-w-sm text-slate-600">The server didn't respond. Check your connection and try again. Your saved settings are not affected.</p>
    <button type="button" id="retry" class="${BTN_SECONDARY} mt-4">Retry</button></div>`;
}

/* ---------- Render ---------- */
function render() {
  renderNav();
  const sec = SECTIONS.find(s => s.id === current);
  document.title = `${sec.label} · Company settings`;
  const c = $('#content');
  if (loadState === 'loading') { c.innerHTML = skeleton(); return; }
  if (loadState === 'error') { c.innerHTML = `<h1 class="text-xl font-semibold">${sec.title}</h1><div class="mt-6">${errorState()}</div>`; return; }
  c.innerHTML = { general: renderGeneral, localization: renderLocalization, notifications: renderNotifications, danger: renderDanger }[current]();
  paintPreview();
  paintDirty();
}
function paintDirty() {
  ['general', 'localization'].forEach(f => {
    const el = document.getElementById(f + '-dirty');
    if (el) el.innerHTML = isDirty(f) ? '<span aria-hidden="true" class="inline-block size-1.5 rounded-full bg-amber-500"></span>Unsaved changes' : '';
  });
  renderNavDirtyOnly();
}
function renderNavDirtyOnly() { const keep = document.activeElement; renderNav(); if (keep && keep.id && document.contains(keep) === false) { /* focus lives in content */ } }

async function load() {
  loadState = 'loading'; render();
  await delay(500);
  if (forceError) { loadState = 'error'; forceError = false; } else loadState = 'ready';
  render();
}

/* ---------- Routing and guards ---------- */
function targetFromHash() { const h = location.hash.slice(1); return SECTIONS.some(s => s.id === h) ? h : null; }
window.addEventListener('hashchange', () => {
  if (ignoreHash) { ignoreHash = false; return; }
  const t = targetFromHash();
  if (!t || t === current) return;
  if (isDirty(current)) {
    ignoreHash = true; location.hash = current;
    guardDialog(() => { pending = t; leaveTo(t); }, current);
    return;
  }
  current = t; render(); $('#scroll').scrollTop = 0;
});
function leaveTo(t) { discard(current); current = t; ignoreHash = true; location.hash = t; render(); $('#scroll').scrollTop = 0; }
function discard(f) { if (draft[f]) { draft[f] = clone(saved[f]); errors[f] = {}; } }
window.addEventListener('beforeunload', e => { if (anyDirty()) { e.preventDefault(); e.returnValue = ''; } });
document.addEventListener('click', e => {
  const ext = e.target.closest('[data-ext]');
  if (ext) { e.preventDefault(); if (isDirty(current)) guardDialog(() => { discard(current); render(); toast('Demo: this link is not part of the settings page'); }, current); else toast('Demo: this link is not part of the settings page'); }
});

/* ---------- Dialog ---------- */
const dlg = $('#dlg');
let lastTrigger = null;
function openDialog(html, focusSel) {
  lastTrigger = document.activeElement;
  dlg.innerHTML = html;
  dlg.showModal();
  (focusSel ? $(focusSel, dlg) : dlg.querySelector('button'))?.focus();
}
function closeDialog() { dlg.close(); }
dlg.addEventListener('close', () => { if (lastTrigger && document.contains(lastTrigger)) lastTrigger.focus(); });
function guardDialog(onLeave, form) {
  openDialog(`<div class="p-6"><h2 id="dlgTitle" class="text-base font-semibold">You have unsaved changes. Leave without saving?</h2>
    <p class="mt-2 text-slate-600">Your edits to ${esc(SECTIONS.find(s => s.id === form).label)} will be lost if you leave now.</p>
    <div class="mt-6 flex flex-wrap justify-end gap-2">
      <button type="button" data-d="leave" class="${BTN_SECONDARY} !text-red-700">Leave</button>
      <button type="button" data-d="stay" class="${BTN_PRIMARY}">Stay</button></div></div>`, '[data-d=stay]');
  $('[data-d=stay]', dlg).onclick = closeDialog;
  $('[data-d=leave]', dlg).onclick = () => { closeDialog(); onLeave(); };
}
function historyDialog(id) {
  const rows = HISTORY[id].map(r => `<tr class="h-10 border-t border-slate-200"><td class="pr-3 tabular-nums">${r[0]}</td><td class="pr-3">${esc(r[1])}</td><td class="pr-3">${esc(r[2])}</td><td>${esc(r[3])} → <span class="font-medium">${esc(r[4])}</span></td></tr>`).join('');
  openDialog(`<div class="p-6"><h2 id="dlgTitle" class="text-base font-semibold">${SECTIONS.find(s => s.id === id).label} history</h2>
    <div class="mt-4 overflow-x-auto"><table class="w-full text-left"><thead><tr class="h-8 text-xs text-slate-700"><th class="pr-3 font-medium">Date</th><th class="pr-3 font-medium">Changed by</th><th class="pr-3 font-medium">Field</th><th class="font-medium">Change</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="mt-6 flex justify-end"><button type="button" data-d="close" class="${BTN_SECONDARY}">Close</button></div></div>`);
  $('[data-d=close]', dlg).onclick = closeDialog;
}
function typedDialog({ title, body, confirmText, verb, keepVerb, extra, onConfirm }) {
  openDialog(`<div class="p-6"><h2 id="dlgTitle" class="text-base font-semibold">${title}</h2>
    <p class="mt-2 text-slate-600">${body}</p>
    ${extra || ''}
    <label for="typed" class="mt-4 block text-xs font-medium text-slate-700">Type <span class="select-all rounded bg-slate-100 px-1 font-semibold text-slate-900">${esc(confirmText)}</span> to confirm</label>
    <input id="typed" autocomplete="off" class="${INPUT} mt-1" aria-describedby="typed-err">
    <p id="typed-err" class="mt-1 hidden text-xs text-red-700"></p>
    <p id="dlg-fail" role="alert" class="mt-3 text-xs text-red-700"></p>
    <div class="mt-6 flex flex-wrap justify-end gap-2">
      <button type="button" data-d="keep" class="${BTN_SECONDARY}">${keepVerb}</button>
      <button type="button" data-d="go" class="${BTN_DANGER}" disabled><span data-spin class="hidden">${ICON.spin}</span>${verb}</button></div></div>`, '[data-d=keep]');
  const typed = $('#typed', dlg), go = $('[data-d=go]', dlg);
  typed.addEventListener('input', () => { go.disabled = typed.value !== confirmText; });
  $('[data-d=keep]', dlg).onclick = closeDialog;
  go.onclick = async () => {
    go.disabled = true; $('[data-spin]', go).classList.remove('hidden');
    await delay(800);
    closeDialog(); onConfirm();
  };
}

/* ---------- Toast ---------- */
function toast(msg) {
  const el = document.createElement('div');
  el.className = 'pointer-events-auto flex items-start gap-2 rounded-md border border-slate-200 bg-white p-3 shadow-lg';
  el.innerHTML = `<span class="mt-0.5 text-green-800">${ICON.check}</span><p class="flex-1">${esc(msg)}</p><button type="button" aria-label="Dismiss" class="flex size-6 items-center justify-center rounded text-slate-600 hover:bg-slate-100"><svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>`;
  const dismiss = () => el.remove();
  let t = setTimeout(dismiss, 5000);
  el.addEventListener('mouseenter', () => clearTimeout(t));
  el.addEventListener('mouseleave', () => { t = setTimeout(dismiss, 5000); });
  el.addEventListener('focusin', () => clearTimeout(t));
  el.querySelector('button').onclick = dismiss;
  $('#toasts').appendChild(el);
}

/* ---------- Saving ---------- */
function nowStamp() {
  const d = new Date(), p = n => String(n).padStart(2, '0');
  return `${p(d.getDate())}/${p(d.getMonth() + 1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
async function save(form) {
  if (saving) return false;
  $('#serverBanner') && ($('#serverBanner').innerHTML = '');
  if (!validateAll(form)) return false;
  saving = true;
  const btn = $(`#${form}-save`);
  btn.disabled = true; $('[data-spin]', btn).classList.remove('hidden');
  await delay(700);
  saving = false;
  btn.disabled = false; $('[data-spin]', btn).classList.add('hidden');
  if (form === 'general' && draft.general.taxCode.trim() === '0312345678') {
    errors.general.taxCode = 'Tax code already used by Công ty Cổ phần Hoàng Long';
    paintError('general', 'taxCode');
    $('#general-taxCode').focus();
    return false;
  }
  if (form === 'general' && draft.general.name.trim().toLowerCase() === 'fail') {
    $('#serverBanner').innerHTML = `<div class="mt-4 flex items-start gap-2 rounded border border-red-300 bg-red-50 p-3 text-red-900">${ICON.alert}<p>Couldn't save company settings because the service didn't respond. Your changes are still here. Try saving again.</p></div>`;
    return false;
  }
  saved[form] = clone(draft[form]);
  META[form] = { by: 'Nguyễn Văn An (you)', at: nowStamp() };
  const label = form === 'general' ? `Company profile for ${saved.general.name} saved` : 'Localization settings saved';
  toast(label);
  render();
  return true;
}

/* ---------- Event wiring ---------- */
const content = $('#content');
content.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.f) {
    draft[t.dataset.form][t.dataset.f] = t.value;
    if (errors[t.dataset.form][t.dataset.f]) validateField(t.dataset.form, t.dataset.f);
    if (t.dataset.form === 'localization') paintPreview();
    paintDirty();
  }
});
content.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.f && t.tagName === 'SELECT') { draft[t.dataset.form][t.dataset.f] = t.value; if (t.dataset.form === 'localization') paintPreview(); paintDirty(); }
  if (t.dataset.ev) autosave(() => { saved.notifications.matrix[t.dataset.ev][t.dataset.ch] = t.checked; }, t.dataset.ev, t);
  if (t.id === 'digest') autosave(() => { saved.notifications.digest = t.value; }, 'digest', t);
});
content.addEventListener('focusout', e => {
  const t = e.target;
  if (t.dataset && t.dataset.f && RULES[t.dataset.form][t.dataset.f]) validateField(t.dataset.form, t.dataset.f);
});
content.addEventListener('submit', e => { e.preventDefault(); save(e.target.id.replace('form-', '')); });
content.addEventListener('click', e => {
  const t = e.target.closest('button, a');
  if (!t) return;
  if (t.dataset.jump) { e.preventDefault(); document.getElementById(t.dataset.jump).focus(); }
  if (t.dataset.history) historyDialog(t.dataset.history);
  if (t.dataset.cancel) {
    const f = t.dataset.cancel;
    if (isDirty(f)) guardDialog(() => { discard(f); render(); }, f); else { discard(f); render(); }
  }
  if (t.id === 'retry') load();
  if (t.id === 'btnExport') toast('Export started. We will email ' + saved.general.email + ' when it is ready.');
  if (t.id === 'btnTransfer') {
    typedDialog({
      title: `Transfer ownership of ${esc(COMPANY_NAME)}?`,
      body: 'The new owner takes over billing and security settings. You become an admin and can no longer delete the company.',
      extra: `<label for="newOwner" class="mt-4 block text-xs font-medium text-slate-700">New owner</label><select id="newOwner" class="${INPUT} mt-1">${OWNERS.map(o => `<option>${esc(o)}</option>`).join('')}</select>`,
      confirmText: COMPANY_NAME, verb: 'Transfer ownership', keepVerb: 'Keep ownership',
      onConfirm: () => { const o = $('#newOwner') ? '' : ''; META.danger = { by: 'Nguyễn Văn An (you)', at: nowStamp() }; toast('Ownership transfer requested. The new owner must accept it within 7 days.'); render(); }
    });
  }
  if (t.id === 'btnDelete') {
    typedDialog({
      title: `Delete company ${esc(COMPANY_NAME)}?`,
      body: `${IMPACT.users} users will lose access. ${IMPACT.orders.toLocaleString('en-US')} orders, ${IMPACT.invoices} invoices and ${IMPACT.files.toLocaleString('en-US')} files will be permanently deleted. This can't be undone.`,
      confirmText: COMPANY_NAME, verb: 'Delete company', keepVerb: 'Keep company',
      onConfirm: () => toast(`Deletion of ${COMPANY_NAME} is scheduled. Owners can cancel within 14 days.`)
    });
  }
});

const savedTimers = {};
async function autosave(apply, key, input) {
  const slot = $(`[data-saved="${key}"]`);
  if (slot) slot.textContent = 'Saving…';
  await delay(350);
  apply();
  META.notifications = { by: 'Nguyễn Văn An (you)', at: nowStamp() };
  const meta = $('#content p.mt-2.text-xs'); if (meta) meta.outerHTML = metaLine('notifications');
  if (slot) {
    slot.innerHTML = ICON.check + 'Saved';
    clearTimeout(savedTimers[key]);
    savedTimers[key] = setTimeout(() => { slot.textContent = ''; }, 2000);
  }
}

$('#demoLoad').onclick = () => { if (isDirty(current)) { guardDialog(() => { discard(current); load(); }, current); } else load(); };
$('#demoError').onclick = () => { forceError = true; if (isDirty(current)) { guardDialog(() => { discard(current); load(); }, current); } else load(); };

/* ---------- Init ---------- */
(function init() {
  const t = targetFromHash();
  if (t) current = t;
  load();
})();
</script>
</body>
</html>
