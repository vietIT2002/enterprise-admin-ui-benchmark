<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Import products · Stockroom</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 14px; color: #0f172a; }
  .tnum { font-variant-numeric: tabular-nums; }
  dialog::backdrop { background: rgba(15,23,42,.45); }
  dialog { padding: 0; }
  :focus-visible { outline: 2px solid #1d4ed8; outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .animate-pulse, .prog { animation: none !important; transition: none !important; } }
</style>
</head>
<body class="bg-slate-50">
<div class="flex h-screen">
  <!-- Sidebar -->
  <aside class="hidden md:flex w-56 shrink-0 flex-col border-r border-slate-200 bg-slate-50">
    <div class="flex h-12 items-center gap-2 px-4 border-b border-slate-200 font-semibold">Stockroom</div>
    <nav aria-label="Main" class="flex-1 p-2 space-y-0.5" id="sidenav"></nav>
    <div class="border-t border-slate-200 p-3 text-xs text-slate-600">Nguyễn Thu Hà<br>Inventory manager</div>
  </aside>

  <div class="flex min-w-0 flex-1 flex-col">
    <header class="flex h-12 shrink-0 items-center justify-between border-b border-slate-200 bg-white px-6">
      <nav aria-label="Breadcrumb" class="text-sm text-slate-600">
        <ol class="flex items-center gap-1.5">
          <li><a href="#products" class="text-blue-700 hover:underline" data-guard="products">Products</a></li>
          <li aria-hidden="true">/</li>
          <li aria-current="page" class="text-slate-900">Import</li>
        </ol>
      </nav>
      <div class="relative">
        <button id="jobsBtn" class="inline-flex h-8 items-center gap-2 rounded border border-slate-300 bg-white px-3 text-sm hover:bg-slate-50" aria-haspopup="true" aria-expanded="false">
          Jobs <span id="jobsCount" class="inline-flex h-5 min-w-5 items-center justify-center rounded-full bg-slate-100 px-1.5 text-xs font-medium text-slate-700">0</span>
        </button>
        <div id="jobsPop" class="hidden absolute right-0 top-10 z-30 w-80 rounded-lg border border-slate-200 bg-white p-3 shadow-lg" role="region" aria-label="Background jobs"></div>
      </div>
    </header>

    <main id="main" class="flex-1 overflow-y-auto" tabindex="-1">
      <div class="mx-auto max-w-6xl px-6 pt-6 pb-6" id="page"></div>
    </main>
  </div>
</div>

<!-- Toasts: live region always present -->
<div id="toasts" role="status" aria-live="polite" class="fixed right-4 top-4 z-50 flex w-96 flex-col gap-2"></div>
<!-- Dialog -->
<dialog id="dlg" class="w-[28rem] max-w-[92vw] rounded-lg border border-slate-200 text-slate-900 shadow-xl">
  <form method="dialog" class="p-6" id="dlgForm">
    <h2 id="dlgTitle" class="text-base font-semibold"></h2>
    <p id="dlgBody" class="mt-2 text-sm text-slate-600"></p>
    <div class="mt-6 flex justify-end gap-2">
      <button type="button" id="dlgCancel" class="h-8 rounded border border-slate-300 bg-white px-3 text-sm hover:bg-slate-50"></button>
      <button type="button" id="dlgOk" class="h-8 rounded px-3 text-sm font-medium text-white"></button>
    </div>
  </form>
</dialog>

<script>
/* ---------- Config & helpers ---------- */
const nf = new Intl.NumberFormat('vi-VN');
const vnd = n => n == null || n === '' ? '—' : nf.format(n);
const dtf = new Intl.DateTimeFormat('en-GB', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false });
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = (s, r = document) => r.querySelector(s);
const CATEGORIES = ['Beverages', 'Snacks', 'Household', 'Personal care', 'Stationery', 'Electronics accessories'];
const WAREHOUSES = ['Hà Nội', 'TP. HCM', 'Đà Nẵng'];
const FIELDS = [
  { key: 'sku', label: 'SKU', req: true, syn: ['sku', 'productcode', 'itemcode', 'code'] },
  { key: 'name', label: 'Product name', req: true, syn: ['productname', 'name', 'itemname', 'title'] },
  { key: 'category', label: 'Category', req: true, syn: ['category', 'productcategory', 'group'] },
  { key: 'cost', label: 'Cost price (VND)', req: true, syn: ['costpricevnd', 'costprice', 'cost', 'unitcost', 'purchaseprice'] },
  { key: 'price', label: 'Selling price (VND)', req: false, syn: ['sellingpricevnd', 'sellingprice', 'price', 'retailprice'] },
  { key: 'qty', label: 'Quantity on hand', req: true, syn: ['qtyonhand', 'quantity', 'qty', 'stock', 'onhand'] },
  { key: 'reorder', label: 'Reorder level', req: false, syn: ['reorderlevel', 'reorderpoint', 'minstock', 'minimum'] },
  { key: 'barcode', label: 'Barcode', req: false, syn: ['barcode', 'ean', 'upc', 'gtin'] },
  { key: 'warehouse', label: 'Warehouse', req: false, syn: ['warehouse', 'location', 'site'] },
];
const STEPS = ['Upload file', 'Map columns', 'Preview', 'Import'];
const CONFLICT_BARCODES = {}; // barcode -> existing SKU, used by the mock server

const ico = {
  upload: '<path d="M12 15V3m0 0L7 8m5-5 5 5M4 17v3h16v-3"/>',
  file: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5"/>',
  down: '<path d="M12 3v12m0 0 5-5m-5 5-5-5M4 17v3h16v-3"/>',
  check: '<path d="m5 12 5 5L20 7"/>',
  alert: '<path d="M12 9v4m0 4h.01M10.3 3.9 2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
  x: '<path d="M18 6 6 18M6 6l12 12"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5m0-8h.01"/>',
  box: '<path d="m21 8-9-5-9 5v8l9 5 9-5zM3 8l9 5 9-5M12 13v8"/>',
  grid: '<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>',
  layers: '<path d="m12 3 9 5-9 5-9-5zM3 13l9 5 9-5"/>',
  truck: '<path d="M3 6h11v10H3zM14 9h4l3 3v4h-7zM7 19a1.5 1.5 0 1 0 0-.01M17 19a1.5 1.5 0 1 0 0-.01"/>',
  users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/>',
  chart: '<path d="M4 20V4m0 16h16M8 16v-5m4 5V8m4 8v-3"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M19 5l-2 2M7 17l-2 2"/>',
};
const icon = (n, c = '') => `<svg class="h-4 w-4 shrink-0 ${c}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ico[n]}</svg>`;
const spinner = '<svg class="h-4 w-4 animate-spin motion-reduce:animate-none" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-opacity=".3" stroke-width="3"/><path d="M21 12a9 9 0 0 0-9-9" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>';

const TONES = {
  neutral: 'bg-slate-100 text-slate-700',
  info: 'bg-blue-50 text-blue-800',
  success: 'bg-green-50 text-green-800',
  warning: 'bg-amber-50 text-amber-800',
  danger: 'bg-red-50 text-red-800',
};
const badge = (tone, text) => `<span class="inline-flex h-6 items-center rounded-full px-2 text-xs font-medium ${TONES[tone]}">${esc(text)}</span>`;
const BTN = 'inline-flex h-8 items-center justify-center gap-2 rounded px-3 text-sm font-medium disabled:cursor-not-allowed ';
const btnPrimary = BTN + 'bg-blue-700 text-white hover:bg-blue-800 disabled:bg-slate-200 disabled:text-slate-600';
const btnSecondary = BTN + 'border border-slate-300 bg-white text-slate-900 hover:bg-slate-50 disabled:text-slate-500';
const btnDanger = BTN + 'bg-red-700 text-white hover:bg-red-800';

/* ---------- State ---------- */
const S = {
  step: 0, maxStep: 0,
  file: null,            // {name,size,text}
  uploadError: null,
  headers: [], raw: [],  // raw rows (arrays)
  mapping: {},           // fieldKey -> header index or -1
  mapErrors: null,
  rows: [],              // validated rows
  loading: false, loadError: false, failNextValidation: false,
  existing: new Set(),
  existingMode: 'update',
  tab: 'all', q: '', page: 1, pageSize: 25,
  job: null,             // {id, status, total, done, created, updated, failed:[], skipped, startedAt, bg}
  jobTimer: null,
  dirty: false,
};

/* ---------- CSV ---------- */
function parseCSV(text) {
  const out = []; let row = [], cur = '', q = false;
  text = text.replace(/^﻿/, '');
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"' && text[i + 1] === '"') { cur += '"'; i++; }
      else if (c === '"') q = false;
      else cur += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cur); out.push(row); row = []; cur = ''; }
    else cur += c;
  }
  if (cur !== '' || row.length) { row.push(cur); out.push(row); }
  return out.filter(r => r.some(v => v.trim() !== ''));
}
const csvCell = v => /[",\n]/.test(v) ? '"' + String(v).replace(/"/g, '""') + '"' : String(v);
const toCSV = rows => '﻿' + rows.map(r => r.map(csvCell).join(',')).join('\r\n');
function download(name, text) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv;charset=utf-8' }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
}
const fmtSize = b => b < 1024 ? b + ' B' : (b / 1024).toFixed(1) + ' KB';

/* ---------- Mock data ---------- */
function buildSample() {
  const base = [
    ['BEV', 'Beverages', ['Mineral water 500 ml', 'Green tea 330 ml', 'Iced coffee can 250 ml', 'Orange juice 1 L'], 4000],
    ['SNK', 'Snacks', ['Rice crackers 120 g', 'Roasted peanuts 200 g', 'Seaweed chips 40 g', 'Dried mango 100 g'], 9000],
    ['HOU', 'Household', ['Dish soap 750 ml', 'Laundry powder 3 kg', 'Trash bags roll 60 L', 'Glass cleaner 500 ml'], 22000],
    ['PRS', 'Personal care', ['Shampoo 650 ml', 'Toothpaste 180 g', 'Hand soap refill 500 ml', 'Face tissue box'], 18000],
    ['STA', 'Stationery', ['Ballpoint pen blue (12)', 'A4 paper ream 500', 'Sticky notes 76 mm', 'Spiral notebook A5'], 7000],
    ['ELE', 'Electronics accessories', ['USB-C cable 1 m', 'Wireless mouse', 'Phone stand', 'AA batteries (8)'], 35000],
  ];
  const sizes = ['', ' – pack of 6', ' – carton of 24', ' – value pack'];
  const rows = [['SKU', 'Product name', 'Category', 'Cost price (VND)', 'Selling price (VND)', 'Qty on hand', 'Reorder at', 'Barcode', 'Warehouse', 'Notes']];
  let i = 0;
  for (const s of sizes) for (const [pre, cat, names, cost0] of base) for (let k = 0; k < 4 && rows.length <= 64; k++) {
    if (k !== sizes.indexOf(s) && sizes.indexOf(s) < 4) { /* spread names across sizes */ }
  }
  // deterministic 64 rows
  const flat = [];
  base.forEach(([pre, cat, names, c]) => names.forEach((n, k) => sizes.forEach((sz, z) => flat.push([pre, cat, n + sz, c * (1 + k * .4) * (1 + z * .8)]))));
  for (i = 0; i < 64; i++) {
    const [pre, cat, name, cost] = flat[(i * 3) % flat.length];
    const c = Math.round(cost / 500) * 500;
    rows.push([`${pre}-${1000 + i}`, name, cat, String(c), String(Math.round(c * 1.32 / 500) * 500), String(20 + ((i * 37) % 300)), String(10 + (i % 5) * 10), '893456' + String(1000000 + i * 7), WAREHOUSES[i % 3], i % 9 === 0 ? 'Seasonal item' : '']);
  }
  const R = k => rows[k + 1]; // data row k (0-based)
  R(4)[1] = '';                          // blank name
  R(9)[5] = 'abc';                       // qty not a number
  R(13)[5] = '-5';                       // negative qty
  R(17)[2] = 'Gadgets';                  // unknown category
  R(26)[3] = '';                         // blank cost
  R(30)[0] = R(3)[0];                    // duplicate SKU
  R(38)[7] = '89345';                    // short barcode
  R(52)[5] = '12.5';                     // fractional qty
  R(11)[4] = String(Number(R(11)[3]) - 2000); // price below cost (warning)
  R(24)[4] = String(Number(R(24)[3]) - 1000);
  CONFLICT_BARCODES[R(21)[7]] = 'HOU-0412'; CONFLICT_BARCODES[R(45)[7]] = 'STA-0087';
  const existing = new Set(rows.slice(1).filter((_, k) => k % 6 === 1).map(r => r[0]));
  return { csv: toCSV(rows), existing };
}
const SAMPLE = buildSample();

/* ---------- Validation ---------- */
const norm = s => String(s).toLowerCase().replace(/[^a-z0-9]/g, '');
function autoMap() {
  const used = new Set(); const m = {};
  FIELDS.forEach(f => {
    let idx = -1;
    for (const syn of f.syn) {
      const h = S.headers.findIndex((x, i) => !used.has(i) && norm(x) === syn);
      if (h >= 0) { idx = h; break; }
    }
    if (idx >= 0) used.add(idx);
    m[f.key] = idx;
  });
  return m;
}
const isNum = v => v !== '' && !isNaN(Number(String(v).replace(/[,\s₫đ]/g, '')));
const toNum = v => Number(String(v).replace(/[,\s₫đ]/g, ''));
function validateAll() {
  const seen = new Map();
  S.rows = S.raw.map((r, i) => {
    const v = {};
    FIELDS.forEach(f => { v[f.key] = S.mapping[f.key] >= 0 ? (r[S.mapping[f.key]] ?? '').trim() : ''; });
    const errors = [], warns = [];
    const E = (field, msg) => errors.push({ field, msg });
    if (!v.sku) E('SKU', 'SKU is required');
    else if (!/^[A-Za-z0-9-]{3,20}$/.test(v.sku)) E('SKU', 'SKU must be 3–20 letters, digits or hyphens');
    else if (seen.has(v.sku.toUpperCase())) E('SKU', `Duplicate SKU, first used in row ${seen.get(v.sku.toUpperCase())}`);
    else seen.set(v.sku.toUpperCase(), i + 2);
    if (!v.name) E('Product name', 'Product name is required');
    else if (v.name.length > 120) E('Product name', 'Product name is longer than 120 characters');
    const cat = CATEGORIES.find(c => c.toLowerCase() === v.category.toLowerCase());
    if (!v.category) E('Category', 'Category is required');
    else if (!cat) E('Category', `Category "${v.category}" doesn't exist`); else v.category = cat;
    if (v.cost === '') E('Cost price (VND)', 'Cost price is required');
    else if (!isNum(v.cost) || toNum(v.cost) < 0) E('Cost price (VND)', 'Cost price must be a number of 0 or more');
    if (v.price !== '' && (!isNum(v.price) || toNum(v.price) < 0)) E('Selling price (VND)', 'Selling price must be a number of 0 or more');
    if (v.qty === '') E('Quantity on hand', 'Quantity is required');
    else if (!isNum(v.qty)) E('Quantity on hand', `"${v.qty}" is not a number`);
    else if (toNum(v.qty) < 0) E('Quantity on hand', 'Quantity can\'t be negative');
    else if (!Number.isInteger(toNum(v.qty))) E('Quantity on hand', 'Quantity must be a whole number');
    if (v.reorder !== '' && (!isNum(v.reorder) || toNum(v.reorder) < 0 || !Number.isInteger(toNum(v.reorder)))) E('Reorder level', 'Reorder level must be a whole number of 0 or more');
    if (v.barcode !== '' && !/^(\d{8}|\d{13})$/.test(v.barcode)) E('Barcode', 'Barcode must be 8 or 13 digits');
    if (v.warehouse !== '') {
      const w = WAREHOUSES.find(x => x.toLowerCase() === v.warehouse.toLowerCase());
      if (!w) E('Warehouse', `Warehouse "${v.warehouse}" doesn't exist`); else v.warehouse = w;
    } else if (S.mapping.warehouse >= 0) { v.warehouse = 'Hà Nội'; warns.push({ field: 'Warehouse', msg: 'Warehouse is blank, Hà Nội will be used' }); }
    else v.warehouse = 'Hà Nội';
    if (!errors.length && v.price !== '' && toNum(v.price) < toNum(v.cost)) warns.push({ field: 'Selling price (VND)', msg: 'Selling price is below cost price' });
    const exists = !!v.sku && S.existing.has(v.sku);
    return { n: i + 2, raw: r, v, errors, warns, exists, status: errors.length ? 'error' : warns.length ? 'warning' : 'valid' };
  });
}
const counts = () => ({
  all: S.rows.length,
  error: S.rows.filter(r => r.status === 'error').length,
  warning: S.rows.filter(r => r.status === 'warning').length,
  valid: S.rows.filter(r => r.status === 'valid').length,
});
const importable = () => S.rows.filter(r => r.status !== 'error' && !(r.exists && S.existingMode === 'skip'));

/* ---------- Dialog / toast / guard ---------- */
let dlgOnOk = null, dlgTrigger = null;
function confirmDialog({ title, body, ok, cancel = 'Cancel', danger = false, onOk }) {
  dlgTrigger = document.activeElement;
  $('#dlgTitle').textContent = title; $('#dlgBody').textContent = body;
  const okBtn = $('#dlgOk'), c = $('#dlgCancel');
  okBtn.textContent = ok; okBtn.className = danger ? btnDanger : btnPrimary;
  c.textContent = cancel; c.className = btnSecondary;
  dlgOnOk = onOk; $('#dlg').showModal(); c.focus();
}
$('#dlgOk').onclick = () => { $('#dlg').close(); const f = dlgOnOk; dlgOnOk = null; f && f(); };
$('#dlgCancel').onclick = () => $('#dlg').close();
$('#dlg').addEventListener('close', () => { if (dlgTrigger && document.contains(dlgTrigger)) dlgTrigger.focus(); });

function toast(msg, link) {
  const t = document.createElement('div');
  t.className = 'flex items-start gap-2 rounded-lg border border-slate-200 bg-white p-3 text-sm shadow-lg';
  t.innerHTML = `${icon('check', 'mt-0.5 text-green-700')}<div class="flex-1">${esc(msg)}${link ? ` <button class="font-medium text-blue-700 underline" data-tlink>${esc(link.label)}</button>` : ''}</div><button class="rounded p-0.5 text-slate-600 hover:bg-slate-100" aria-label="Dismiss notification">${icon('x')}</button>`;
  $('#toasts').appendChild(t);
  let timer; const kill = () => t.remove(); const start = () => { timer = setTimeout(kill, link ? 10000 : 5000); };
  start();
  t.addEventListener('mouseenter', () => clearTimeout(timer)); t.addEventListener('mouseleave', start);
  t.addEventListener('focusin', () => clearTimeout(timer)); t.addEventListener('focusout', start);
  t.querySelector('[aria-label]').onclick = kill;
  const l = t.querySelector('[data-tlink]'); if (l) l.onclick = () => { kill(); link.fn(); };
}
const hasUnsaved = () => !!S.file && S.step < 3 && !(S.job && S.job.status === 'done');
function guard(fn) {
  if (!hasUnsaved()) return fn();
  confirmDialog({ title: 'Leave this import?', body: `${S.file.name} (${nf.format(S.raw.length)} rows) hasn't been imported. Your column mapping will be discarded.`, ok: 'Discard import', cancel: 'Keep editing', danger: true, onOk: () => { resetAll(); fn(); } });
}
window.addEventListener('beforeunload', e => { if (hasUnsaved() || (S.job && S.job.status === 'running')) { e.preventDefault(); e.returnValue = ''; } });

/* ---------- Shell ---------- */
const NAV = [['Dashboard', 'grid'], ['Products', 'box'], ['Stock levels', 'layers'], ['Purchase orders', 'truck'], ['Suppliers', 'users'], ['Reports', 'chart'], ['Settings', 'gear']];
$('#sidenav').innerHTML = NAV.map(([n, i]) => `<a href="#${n.toLowerCase()}" data-guard="${n}" ${n === 'Products' ? 'aria-current="page"' : ''} class="flex h-8 items-center gap-2 rounded px-2 text-sm ${n === 'Products' ? 'bg-slate-200 font-medium text-slate-900' : 'text-slate-700 hover:bg-slate-100'}">${icon(i)}${n}</a>`).join('');
document.addEventListener('click', e => {
  const a = e.target.closest('[data-guard]'); if (!a) return;
  e.preventDefault();
  guard(() => { if (S.file || S.job) { resetAll(); toast('Import discarded'); } });
});
function renderJobs() {
  const j = S.job; const active = j && (j.status === 'running' || (j.bg && j.status === 'done'));
  $('#jobsCount').textContent = j ? '1' : '0';
  $('#jobsPop').innerHTML = j ? `<p class="text-xs font-medium text-slate-600">Recent jobs</p>
    <div class="mt-2 flex items-center justify-between gap-2 rounded border border-slate-200 p-2">
      <div class="min-w-0"><p class="truncate text-sm font-medium">Import ${esc(j.id)}</p><p class="truncate text-xs text-slate-600">${esc(S.file ? S.file.name : '')} · ${j.status === 'running' ? `${nf.format(j.done)} of ${nf.format(j.total)}` : 'Finished'}</p></div>
      ${j.status === 'running' ? badge('info', 'In progress') : j.failed.length ? badge('warning', 'Needs attention') : badge('success', 'Completed')}
    </div>
    <button class="${btnSecondary} mt-2 w-full" id="jobOpen">${j.status === 'running' ? 'View progress' : 'View results'}</button>`
    : '<p class="text-sm text-slate-600">No import jobs yet. Imports you run in the background appear here.</p>';
  const o = $('#jobOpen'); if (o) o.onclick = () => { S.job.bg = false; S.step = 3; S.maxStep = 3; $('#jobsPop').classList.add('hidden'); render(); };
}
$('#jobsBtn').onclick = () => { const p = $('#jobsPop'); const open = p.classList.toggle('hidden') === false; $('#jobsBtn').setAttribute('aria-expanded', open); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') { $('#jobsPop').classList.add('hidden'); $('#jobsBtn').setAttribute('aria-expanded', 'false'); } });

/* ---------- Rendering ---------- */
function stepper() {
  return `<nav aria-label="Import steps"><ol class="flex flex-wrap items-center gap-2">${STEPS.map((s, i) => {
    const done = i < S.step || (i === 3 && S.job && S.job.status === 'done');
    const cur = i === S.step;
    const clickable = i < S.step && !(S.job && S.job.status === 'running') && !(S.job && S.job.status === 'done');
    const dot = `<span class="inline-flex h-6 w-6 items-center justify-center rounded-full text-xs font-medium ${done ? 'bg-blue-700 text-white' : cur ? 'border-2 border-blue-700 text-blue-700' : 'border border-slate-300 text-slate-600'}">${done ? icon('check', 'h-3 w-3') : i + 1}</span>`;
    const label = `${dot}<span class="${cur ? 'font-semibold text-slate-900' : 'text-slate-700'}">${s}</span>`;

function takeFile(name, size, text, opts = {}) {

  if (size > 5 * 1024 * 1024) return fail('File is too large', `${name} is ${fmtSize(size)}. The limit is 5 MB. Split the file and import it in parts.`);
  const rows = parseCSV(text);
  if (!rows.length) return fail('The file is empty', `${name} has no content. Check the export and upload it again.`);
  if (rows.length < 2) return fail('No data rows found', `${name} only has a header row. Add at least one product row.`);
  if (rows.length - 1 > 5000) return fail('Too many rows', `${name} has ${nf.format(rows.length - 1)} rows. The limit is 5,000 per import.`);
  if (rows[0].length < 3) return fail('Columns not recognised', `${name} has ${rows[0].length} column. Is it comma separated? Semicolon or tab separated files aren't supported.`);
  S.file = { name, size, text }; S.headers = rows[0]; S.raw = rows.slice(1);

}

      <h2 class="text-base font-semibold">Importing products</h2>
      <p class="mt-1 text-sm text-slate-600">You can leave this page. The import keeps running and shows under Jobs.</p>
      <div class="mt-5 flex items-baseline justify-between text-sm"><span id="progText" role="status" class="font-medium tnum">Importing ${nf.format(j.done)} of ${nf.format(j.total)}</span><span id="progPct" class="tnum text-slate-600">${pct}%</span></div>
      <div class="mt-2 h-2 overflow-hidden rounded-full bg-slate-100" role="progressbar" aria-label="Import progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}" id="progBar"><div class="prog h-full bg-blue-700 transition-all" style="width:${pct}%" id="progFill"></div></div>
      <p class="mt-3 text-sm text-slate-600 tnum" id="progSub">${nf.format(j.created)} created · ${nf.format(j.updated)} updated · ${nf.format(j.failed.length)} failed so far</p>
      <div class="mt-6 flex gap-2"><button class="${btnSecondary}" id="bgBtn">Run in background</button><button class="${btnSecondary}" id="stopBtn">Stop import</button></div></section>`;
  }
  const f = j.failed;
  const tone = f.length ? 'warning' : 'success';
  const fig = (label, n, t) => `<div class="rounded-md border border-slate-200 p-4"><p class="text-sm text-slate-600">${label}</p><p class="mt-1 text-2xl font-semibold tnum">${nf.format(n)}</p>${t ? `<div class="mt-1">${t}</div>` : ''}</div>`;
  return `<section class="rounded-md border border-slate-200 bg-white">
    <div class="p-6"><div class="flex flex-wrap items-center justify-between gap-2"><h2 class="text-base font-semibold">${j.stopped ? 'Import stopped' : 'Import finished'}</h2>${badge(f.length || j.stopped ? 'warning' : 'success', f.length || j.stopped ? 'Needs attention' : 'Completed')}</div>
      <p class="mt-1 text-sm text-slate-600">Job ${esc(j.id)} · ${esc(S.file.name)} · started by Nguyễn Thu Hà on ${dtf.format(j.startedAt).replace(',', '')}</p>
      <div role="status" class="mt-4 flex items-start gap-2 rounded border p-3 text-sm ${f.length || j.stopped ? 'border-amber-200 bg-amber-50 text-amber-800' : 'border-green-200 bg-green-50 text-green-800'}">${icon(f.length || j.stopped ? 'alert' : 'check', 'mt-0.5')}<p>${nf.format(j.created)} created, ${nf.format(j.updated)} updated, ${nf.format(f.length)} failed${j.skipped ? `, ${nf.format(j.skipped)} skipped` : ''}.${j.stopped ? ` You stopped the import after ${nf.format(j.done)} of ${nf.format(j.total)} rows; imported rows were kept.` : ''}${f.length ? ' Fix the failed rows and import them again.' : ''}</p></div>
      <div class="mt-4 grid gap-3 sm:grid-cols-4">${fig('Created', j.created, '')}${fig('Updated', j.updated, '')}${fig('Failed', f.length, f.length ? badge('danger', 'See below') : '')}${fig('Skipped', j.skipped, '<span class="text-xs text-slate-600">Existing SKUs kept</span>'.replace(/^.*$/, j.skipped ? '<span class="text-xs text-slate-600">Existing SKUs kept</span>' : ''))}</div></div>
    ${f.length ? `<div class="border-t border-slate-200"><div class="flex flex-wrap items-center justify-between gap-2 p-4"><h3 class="text-base font-semibold" id="failedHead" tabindex="-1">Failed rows (${nf.format(f.length)})</h3><button class="${btnSecondary}" id="dlFailed">${icon('down')}Download failed rows</button></div>
      <div class="overflow-x-auto"><table class="w-full text-sm"><thead class="bg-slate-50 text-slate-700"><tr><th class="h-10 px-3 text-right font-medium">Row</th><th class="px-3 text-left font-medium">SKU</th><th class="px-3 text-left font-medium">Product name</th><th class="px-3 text-left font-medium">Field</th><th class="px-3 text-left font-medium">Reason</th></tr></thead>
      <tbody>${f.slice(0, 50).map(r => `<tr class="h-10 border-t border-slate-100 hover:bg-slate-50"><td class="px-3 text-right tnum">${r.n}</td><td class="px-3 whitespace-nowrap">${esc(r.v.sku) || '—'}</td><td class="px-3 whitespace-nowrap">${esc(r.v.name) || '—'}</td><td class="px-3 whitespace-nowrap">${esc(r.field)}</td><td class="px-3 whitespace-nowrap text-red-800">${esc(r.reason)}</td></tr>`).join('')}</tbody></table></div></div>` : ''}
    <div class="flex flex-wrap justify-end gap-2 border-t border-slate-200 p-4"><button class="${btnSecondary}" id="again">Import another file</button><a href="#products" class="${btnPrimary}" data-guard="Products">View products</a></div></section>`;
}
function startJob() {
  const list = importable(); const bad = S.rows.filter(r => r.status === 'error');
  const id = 'IMP-' + (2041 + Math.floor(Math.random() * 40));
  S.job = { id, status: 'running', total: list.length, done: 0, created: 0, updated: 0, failed: bad.map(r => ({ n: r.n, v: r.v, raw: r.raw, field: r.errors[0].field, reason: r.errors[0].msg + (r.errors.length > 1 ? ` (+${r.errors.length - 1} more)` : ''), errors: r.errors })), skipped: S.rows.filter(r => r.status !== 'error' && r.exists && S.existingMode === 'skip').length, startedAt: new Date(), bg: false, queue: list, stopped: false };
  S.step = 3; S.maxStep = 3; S.dirty = false; render();
  $('#main').focus();
  clearInterval(S.jobTimer);
  S.jobTimer = setInterval(tick, 250);
}
function tick() {
  const j = S.job; if (!j || j.status !== 'running') return clearInterval(S.jobTimer);
  const batch = j.queue.splice(0, 4);
  batch.forEach(r => {
    j.done++;
    const other = r.v.barcode && CONFLICT_BARCODES[r.v.barcode];
    if (other) { j.failed.push({ n: r.n, v: r.v, raw: r.raw, field: 'Barcode', reason: `Barcode is already used by ${other}`, errors: [] }); return; }
    if (r.exists) j.updated++; else j.created++;
  });
  if (!j.queue.length) return finishJob(false);
  if (S.step === 3 && !j.bg) {
    const pct = Math.round(j.done / j.total * 100);
    const t = $('#progText'); if (!t) return;
    t.textContent = `Importing ${nf.format(j.done)} of ${nf.format(j.total)}`;
    $('#progPct').textContent = pct + '%'; $('#progFill').style.width = pct + '%'; $('#progBar').setAttribute('aria-valuenow', pct);
    $('#progSub').textContent = `${nf.format(j.created)} created · ${nf.format(j.updated)} updated · ${nf.format(j.failed.length)} failed so far`;
  }
  document.title = `Importing ${Math.round(j.done / j.total * 100)}%… · Stockroom`;
  renderJobs();
}
function finishJob(stopped) {
  clearInterval(S.jobTimer);
  const j = S.job; j.status = 'done'; j.stopped = stopped; j.skipped += stopped ? j.queue.length : 0; j.queue = [];
  document.title = 'Import finished · Stockroom';
  if (j.bg) toast(`Import finished: ${nf.format(j.created)} created, ${nf.format(j.updated)} updated, ${nf.format(j.failed.length)} failed.`, { label: 'View results', fn: () => { j.bg = false; S.step = 3; render(); } });
  else { render(); $('#main').focus(); }
  if (!j.bg && j.failed.length === 0) toast(`Import ${j.id} finished`);
  renderJobs();
}

/* ---------- Events ---------- */
function bind() {
  const p = $('#page');
  const on = (sel, fn) => { const el = $(sel, p); if (el) el.onclick = fn; };
  on('#useSample', () => takeFile('products-november.csv', new Blob([SAMPLE.csv]).size, SAMPLE.csv, { existing: SAMPLE.existing }));
  on('#useFlaky', () => takeFile('products-november-flaky.csv', new Blob([SAMPLE.csv]).size, SAMPLE.csv, { existing: SAMPLE.existing, flaky: true }));
  on('#useBad', () => takeFile('price-list.xlsx', 48213, 'PK\u0003\u0004binary'));
  const fi = $('#fileIn', p); if (fi) fi.onchange = () => { const f = fi.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => takeFile(f.name, f.size, String(r.result)); r.onerror = () => fail('Couldn\'t read the file', 'The browser could not read ' + f.name + '. Try again.'); r.readAsText(f); };
  const drop = $('#drop', p);
  if (drop) { drop.ondragover = e => { e.preventDefault(); drop.classList.add('border-blue-700', 'bg-blue-50'); }; drop.ondragleave = () => drop.classList.remove('border-blue-700', 'bg-blue-50'); drop.ondrop = e => { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) { const r = new FileReader(); r.onload = () => takeFile(f.name, f.size, String(r.result)); r.readAsText(f); } }; }
  on('#replaceFile', () => guard(() => { resetAll(); render(); }));
  on('#cancelImport', () => guard(() => { resetAll(); render(); toast('Import cancelled'); }));
  p.querySelectorAll('[data-map]').forEach(s => s.onchange = () => {
    const v = +s.value, k = s.dataset.map;
    if (v >= 0) FIELDS.forEach(f => { if (f.key !== k && S.mapping[f.key] === v) S.mapping[f.key] = -1; document.getElementById('map-' + f.key).value = S.mapping[f.key]; });
    S.mapping[k] = v;
    if (S.mapErrors) S.mapErrors = FIELDS.filter(f => f.req && S.mapping[f.key] < 0);
    if (S.mapErrors && !S.mapErrors.length) { S.mapErrors = null; const sm = $('#mapSummary'); sm && sm.remove(); }
    updateMapView();
  });
  p.querySelectorAll('[data-map]').forEach(s => s.onblur = () => { const f = FIELDS.find(x => x.key === s.dataset.map); if (f.req && S.mapping[f.key] < 0) { S.mapErrors = FIELDS.filter(x => x.req && S.mapping[x.key] < 0); } });
  if (S.step === 1) updateMapView();
  p.querySelectorAll('[data-focus]').forEach(a => a.onclick = e => { e.preventDefault(); document.getElementById(a.dataset.focus).focus(); });
  on('#toPreview', () => {
    const miss = FIELDS.filter(f => f.req && S.mapping[f.key] < 0);
    if (miss.length) {
      S.mapErrors = miss; render();
      const el = miss.length >= 3 ? $('#mapSummary') : document.getElementById('map-' + miss[0].key);
      (miss.length >= 3 ? document.getElementById('map-' + miss[0].key) : el).focus(); return;
    }
    S.mapErrors = null; S.step = 2; S.maxStep = 2; startValidation();
  });
  on('#retryVal', () => startValidation());
  p.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { S.tab = b.dataset.tab; S.page = 1; render(); });
  const q = $('#q', p); if (q) q.oninput = () => { S.q = q.value; S.page = 1; render(); const n = $('#q'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); };
  p.querySelectorAll('[data-clearq]').forEach(b => b.onclick = () => { S.q = ''; render(); });
  on('#clearFilters', () => { S.q = ''; S.tab = 'all'; S.page = 1; render(); });
  p.querySelectorAll('[data-page]').forEach(b => b.onclick = () => { S.page = +b.dataset.page; render(); });
  const ps = $('#pgSize', p); if (ps) ps.onchange = () => { S.pageSize = +ps.value; S.page = 1; render(); };
  p.querySelectorAll('[name=exmode]').forEach(r => r.onchange = () => { S.existingMode = r.value; render(); });
  on('#dlFailed', () => {
    const list = S.step === 3 && S.job ? S.job.failed : S.rows.filter(r => r.status === 'error');
    const rows = list.map(r => ({ raw: r.raw, errors: r.errors || [], reason: r.reason }));
    download('products-failed-rows.csv', failedRowsCSV(rows)); toast(`Downloaded ${nf.format(list.length)} failed rows`);
  });
  on('#runImport', () => {
    const n = importable().length; const c = counts();
    confirmDialog({ title: `Import ${nf.format(n)} products?`, body: `${nf.format(S.rows.filter(r => r.status !== 'error' && !r.exists).length)} new products will be created and ${S.existingMode === 'update' ? nf.format(S.rows.filter(r => r.status !== 'error' && r.exists).length) + ' existing products updated' : 'existing SKUs kept as they are'}. ${c.error ? nf.format(c.error) + ' rows with errors are skipped.' : ''}`, ok: `Import ${nf.format(n)} rows`, cancel: 'Cancel', onOk: startJob });
  });
  on('#bgBtn', () => {
    S.job.bg = true; S.step = 0; const keep = S.job; resetUi(); S.job = keep; render();
    toast('Import continues in the background. Open Jobs to follow it.');
  });
  on('#stopBtn', () => confirmDialog({ title: 'Stop import?', body: `${nf.format(S.job.done)} rows are already imported and won't be rolled back. The remaining ${nf.format(S.job.queue.length)} rows will not be imported.`, ok: 'Stop import', cancel: 'Keep importing', danger: true, onOk: () => finishJob(true) }));
  on('#again', () => { resetAll(); render(); });
  const fh = $('#failedHead', p);
}
function resetUi() { Object.assign(S, { step: 0, maxStep: 0, file: null, uploadError: null, headers: [], raw: [], mapping: {}, mapErrors: null, rows: [], loading: false, loadError: false, tab: 'all', q: '', page: 1, dirty: false, existing: new Set(), existingMode: 'update' }); }
function resetAll() { clearInterval(S.jobTimer); resetUi(); S.job = null; }

render();
</script>
</body>
</html>
