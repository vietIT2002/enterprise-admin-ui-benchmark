<!DOCTYPE html>
<html lang="vi">

<title>Đơn hàng · Bán hàng · ERP</title>

<body class="bg-white text-sm text-slate-900">

  </form>
</dialog>

<!-- Toasts -->
<div id="toasts" class="fixed bottom-4 right-4 z-40 flex flex-col gap-2" role="status" aria-live="polite"></div>

<script>
/* ---------- helpers ---------- */
const PATHS = {

  wallet:'<path d="M20 12V8H6a2 2 0 0 1 0-4h12v4M4 6v12a2 2 0 0 0 2 2h14v-4"/><path d="M18 12a2 2 0 0 0 0 4h4v-4z"/>',
  chart:'<path d="M3 3v18h18M7 14l4-4 4 4 5-6"/>',
  settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>',
  bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0"/>',
  help:'<circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3M12 17h.01"/>',
  alert:'<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3zM12 9v4M12 17h.01"/>',
  check:'<path d="M20 6 9 17l-5-5"/>'
};
const ic = (n, c = 'h-4 w-4') => `<svg class="${c}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${PATHS[n]}</svg>`;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = (s) => String(s).normalize('NFD').replace(/\p{Diacritic}/gu, '').replace(/đ/gi, 'd').toLowerCase();
const nf = new Intl.NumberFormat('vi-VN');
const cur = new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' });
const p2 = (n) => String(n).padStart(2, '0');
const fmtDT = (d) => `${p2(d.getDate())}/${p2(d.getMonth() + 1)}/${d.getFullYear()} ${p2(d.getHours())}:${p2(d.getMinutes())}`;
const fmtISO = (s) => { const [y, m, d] = s.split('-'); return `${d}/${m}/${y}`; };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

/* ---------- vocabulary ---------- */
const TONE = {
  neutral: 'bg-slate-100 text-slate-700', info: 'bg-blue-50 text-blue-800', success: 'bg-green-50 text-green-800',
  warning: 'bg-amber-50 text-amber-800', danger: 'bg-red-50 text-red-800'
};
const STATUS = {
  draft: { label: 'Nháp', tone: 'neutral' }, pending: { label: 'Chờ duyệt', tone: 'info' },
  shipping: { label: 'Đang giao', tone: 'info' }, done: { label: 'Hoàn tất', tone: 'success' },
  hold: { label: 'Tạm giữ', tone: 'warning' }, cancelled: { label: 'Đã hủy', tone: 'danger' }
};
const PAY = {
  unpaid: { label: 'Chưa thanh toán', tone: 'neutral' }, partial: { label: 'Thanh toán một phần', tone: 'warning' },
  paid: { label: 'Đã thanh toán', tone: 'success' }, overdue: { label: 'Quá hạn', tone: 'danger' }
};
const badge = (v) => `<span class="inline-flex h-6 items-center whitespace-nowrap rounded-full px-2 text-xs font-medium ${TONE[v.tone]}">${v.label}</span>`;
const CHANNELS = ['Bán trực tiếp', 'Website', 'Đại lý', 'Sàn TMĐT'];
const OWNERS = ['Nguyễn Thị Hoa', 'Trần Minh Quân', 'Lê Quốc Huy', 'Phạm Thu Trang', 'Đặng Văn Long', 'Vũ Ngọc Anh'];

/* ---------- mock data ---------- */
const NOW = new Date(2026, 10, 4, 15, 58);
const CUSTOMERS = [
  ['Công ty TNHH Minh Phát', '0903 112 456'], ['Công ty CP Thực phẩm Đại Dương', '0912 884 201'], ['Cửa hàng Nguyễn Văn Dũng', '0987 345 110'],
  ['Công ty TNHH Thương mại An Khang', '0938 220 771'], ['Siêu thị Bình Minh', '0977 650 982'], ['Công ty CP Dược Hưng Long', '0909 118 334'],
  ['Nhà phân phối Đường Việt', '0918 407 623'], ['Công ty TNHH Xây dựng Phú Gia', '0966 301 245'], ['Đại lý Trần Thị Lan', '0945 778 190'],
  ['Công ty CP Công nghệ Tân Phát', '0932 567 008'], ['Khách sạn Hoàng Long', '0903 944 512'], ['Công ty TNHH Nội thất Đông Á', '0989 120 663'],
  ['Hợp tác xã Nông sản Sạch', '0914 336 870'], ['Công ty CP Vận tải Thành Công', '0976 205 417'], ['Cửa hàng Lê Hoàng Nam', '0908 713 559'], ['Công ty TNHH Điện máy Hải Nam', '0937 449 126']
];
let seed = 20261104;
const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
const pick = (a) => a[Math.floor(rnd() * a.length)];
function genOrders(n) {
  const out = []; let t = NOW.getTime() - 25 * 60000;
  const W = [['draft', 8], ['pending', 14], ['shipping', 22], ['done', 40], ['hold', 5], ['cancelled', 11]];
  for (let i = 0; i < n; i++) {
    let r = rnd() * 100, st = 'done';
    for (const [k, w] of W) { if (r < w) { st = k; break; } r -= w; }
    if (i < 4 && st === 'done') st = 'pending';
    const c = pick(CUSTOMERS); t -= (2 + rnd() * 16) * 3600000;

    if (st === 'done') pay = rnd() < .8 ? 'paid' : 'overdue';
    else if (st === 'shipping') pay = pick(['partial', 'unpaid', 'paid']);
    else if (st === 'pending' || st === 'hold') pay = rnd() < .2 ? 'partial' : 'unpaid';
    const total = Math.round((2.5e6 + Math.pow(rnd(), 2) * 175e6) / 1000) * 1000;
    out.push({ id: 'DH-' + (2048 - i), n: 2048 - i, customer: c[0], phone: c[1], status: st, pay, channel: pick(CHANNELS), owner: pick(OWNERS), created: new Date(t), total });
  }
  return out;

let DATA = genOrders(128);

/* ---------- state & URL ---------- */
const DEF_SORT = '-created', SIZES = [10, 25, 50, 100], SORTS = ['id', 'customer', 'created', 'total'];
const P = { q: '', status: 'all', channel: '', owner: '', pay: '', from: '', to: '', min: '', max: '', sort: DEF_SORT, page: 1, size: 25 };
const S = { phase: 'loading', sel: new Set(), allMatching: false, failed: null, force: new URLSearchParams(location.search).get('state') };

function readUrl() {
  const u = new URLSearchParams(location.search);
  P.q = u.get('q') || '';
  P.status = (u.get('status') in STATUS) ? u.get('status') : 'all';
  P.channel = CHANNELS.includes(u.get('channel')) ? u.get('channel') : '';
  P.owner = OWNERS.includes(u.get('owner')) ? u.get('owner') : '';
  P.pay = (u.get('pay') in PAY) ? u.get('pay') : '';
  const iso = /^\d{4}-\d{2}-\d{2}$/;
  P.from = iso.test(u.get('from') || '') ? u.get('from') : '';
  P.to = iso.test(u.get('to') || '') ? u.get('to') : '';
  P.min = /^\d+$/.test(u.get('min') || '') ? u.get('min') : '';
  P.max = /^\d+$/.test(u.get('max') || '') ? u.get('max') : '';
  const s = u.get('sort') || DEF_SORT;
  P.sort = SORTS.includes(s.replace(/^-/, '')) ? s : DEF_SORT;
  P.page = Math.max(1, parseInt(u.get('page'), 10) || 1);
  P.size = SIZES.includes(parseInt(u.get('size'), 10)) ? parseInt(u.get('size'), 10) : 25;
}
function writeUrl(push) {
  const u = new URLSearchParams();
  if (S.force) u.set('state', S.force);
  if (P.q) u.set('q', P.q);
  if (P.status !== 'all') u.set('status', P.status);
  ['channel', 'owner', 'pay', 'from', 'to', 'min', 'max'].forEach((k) => P[k] && u.set(k, P[k]));
  if (P.sort !== DEF_SORT) u.set('sort', P.sort);
  if (P.page > 1) u.set('page', P.page);
  if (P.size !== 25) u.set('size', P.size);
  const qs = u.toString();
  history[push ? 'pushState' : 'replaceState'](null, '', location.pathname + (qs ? '?' + qs : ''));
}
/* change filters: reset page and selection, replace history */
function setP(patch, push = false) {
  const resetsPage = !('page' in patch);
  Object.assign(P, patch);
  if (resetsPage) P.page = 1;
  S.sel.clear(); S.allMatching = false;
  writeUrl(push); render();
}

/* ---------- filtering ---------- */
function matches(o, skipStatus) {
  if (S.failed && !S.failed.has(o.id)) return false;
  if (!skipStatus && P.status !== 'all' && o.status !== P.status) return false;
  if (P.channel && o.channel !== P.channel) return false;
  if (P.owner && o.owner !== P.owner) return false;
  if (P.pay && o.pay !== P.pay) return false;
  if (P.from && o.created < new Date(P.from + 'T00:00:00')) return false;
  if (P.to && o.created > new Date(P.to + 'T23:59:59')) return false;
  if (P.min && o.total < +P.min) return false;
  if (P.max && o.total > +P.max) return false;
  if (P.q) {
    const hay = norm(o.id + ' ' + o.customer + ' ' + o.phone.replace(/\s/g, '') + ' ' + o.phone);
    if (!norm(P.q).split(/\s+/).every((w) => hay.includes(w))) return false;
  }
  return true;
}
function getRows() {
  const rows = DATA.filter((o) => matches(o));
  const desc = P.sort[0] === '-', k = P.sort.replace(/^-/, '');
  const val = { id: (o) => o.n, created: (o) => o.created.getTime(), total: (o) => o.total };
  rows.sort((a, b) => {

}

function toast(msg, tone = 'ok') {

  t.innerHTML = `<span class="mt-0.5 ${tone === 'err' ? 'text-red-700' : 'text-green-700'}">${ic(tone === 'err' ? 'alert' : 'check')}</span><span>${esc(msg)}</span>`;
  $('toasts').appendChild(t); setTimeout(() => t.remove(), 4500);
}
let menuItems = [];
function openMenu(anchor, items) {
  menuItems = items; const m = $('menu');
  m.innerHTML = items.map((it, i) => `${it.sep ? '<div class="my-1 border-t border-slate-200"></div>' : ''}<button type="button" role="menuitem" data-mi="${i}" ${it.disabled ? 'disabled' : ''} class="flex h-8 w-full items-center px-3 text-left hover:bg-slate-100 disabled:cursor-not-allowed disabled:text-slate-500 disabled:hover:bg-white ${it.danger ? 'text-red-700' : 'text-slate-900'}">${it.label}</button>`).join('');
  m.hidden = false;
  const r = anchor.getBoundingClientRect();
  m.style.left = Math.max(8, Math.min(r.right - m.offsetWidth, innerWidth - m.offsetWidth - 8)) + 'px';
  m.style.top = (r.bottom + m.offsetHeight + 8 > innerHeight ? r.top - m.offsetHeight - 4 : r.bottom + 4) + 'px';
  m.querySelector('button:not([disabled])')?.focus(); m._anchor = anchor;
}
function closeMenu() { const m = $('menu'); if (!m.hidden) { m.hidden = true; m._anchor?.focus?.(); } }
function confirmDlg(title, body, yes) {
  return new Promise((res) => {
    $('dlgTitle').textContent = title; $('dlgBody').textContent = body; $('dlgYes').textContent = yes;
    const d = $('dlg'); d.showModal();
    const done = (v) => { $('dlgYes').onclick = $('dlgNo').onclick = null; d.onclose = null; if (d.open) d.close(); res(v); };
    $('dlgYes').onclick = () => done(true); $('dlgNo').onclick = () => done(false); d.onclose = () => done(false);
  });
}

/* ---------- actions ---------- */
const targets = () => (S.allMatching ? getRows() : DATA.filter((o) => S.sel.has(o.id)));
function singleMenu(btn) {
  const o = DATA.find((x) => x.id === btn.dataset.menu), locked = o.status === 'done' || o.status === 'cancelled';
  openMenu(btn, [
    { label: 'Xem chi tiết', run: () => toast('Mở chi tiết ' + o.id) },
    { label: 'Nhân bản đơn', run: () => toast('Đã tạo bản nháp từ ' + o.id) },
    { label: 'In phiếu giao hàng', run: () => toast('Đang in phiếu giao hàng ' + o.id) },
    { label: locked ? 'Hủy đơn (đơn ' + STATUS[o.status].label.toLowerCase() + ')' : 'Hủy đơn', danger: true, sep: true, disabled: locked, run: () => runBulk('cancel', [o]) }
  ]);
}
async function runBulk(kind, list, btn) {
  const ok = [], fail = [];
  if (kind === 'cancel') {
    const bad = list.filter((o) => o.status === 'done' || o.status === 'cancelled').length, good = list.length - bad;
    const subject = list.length === 1 ? `đơn ${list[0].id}` : `${nf.format(good)} đơn hàng`;
    const body = (bad && list.length > 1 ? `${nf.format(bad)} đơn đã hoàn tất hoặc đã hủy sẽ bị bỏ qua. ` : '') + 'Hàng đang giữ kho của các đơn bị hủy sẽ được hoàn lại tồn kho; thao tác này không thể hoàn tác.';
    if (!(await confirmDlg(`Hủy ${subject}?`, body, 'Hủy đơn'))) return;
  }
  if (btn) { btn.disabled = true; btn.innerHTML = `<svg class="spin h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.2-8.55"/></svg>Đang xử lý…`; }
  await sleep(700);
  list.forEach((o) => {
    if (kind === 'approve') { if (o.status === 'pending') { o.status = 'shipping'; ok.push(o); } else fail.push([o, 'Chỉ duyệt được đơn ở trạng thái Chờ duyệt']); }
    else if (kind === 'hold') { if (o.status === 'pending' || o.status === 'shipping') { o.status = 'hold'; ok.push(o); } else fail.push([o, 'Chỉ tạm giữ được đơn chờ duyệt hoặc đang giao']); }
    else if (kind === 'cancel') { if (o.status !== 'done' && o.status !== 'cancelled') { o.status = 'cancelled'; ok.push(o); } else fail.push([o, 'Đơn đã hoàn tất hoặc đã hủy']); }
    else if (kind === 'print') { if (o.status === 'draft' || o.status === 'cancelled') fail.push([o, 'Không in phiếu cho đơn nháp hoặc đã hủy']); else ok.push(o); }
    else ok.push(o);
  });
  const verb = { approve: 'Đã duyệt', hold: 'Đã tạm giữ', cancel: 'Đã hủy', print: 'Đã gửi in phiếu giao hàng cho', export: 'Đã xuất' }[kind];
  S.sel.clear(); S.allMatching = false;
  if (fail.length) {
    fail.forEach(([o]) => S.sel.add(o.id));
    S.failedList = fail;
    const banner = $('banner');
    banner.hidden = false;
    banner.innerHTML = `<span class="mt-0.5">${ic('alert')}</span><div class="flex-1"><p class="font-medium">${verb} ${nf.format(ok.length)} đơn, ${nf.format(fail.length)} đơn thất bại</p><p>${esc(fail[0][1])}${fail.length > 1 ? ' (và các lý do tương tự)' : ''}. Các đơn lỗi vẫn được chọn để bạn xử lý lại.</p></div>
      <button type="button" data-act="viewFailed" class="h-6 rounded px-2 font-medium text-amber-900 underline hover:bg-amber-100">Xem đơn lỗi (${fail.length})</button>
      <button type="button" data-act="closeBanner" aria-label="Đóng thông báo" class="inline-flex h-6 w-6 items-center justify-center rounded hover:bg-amber-100">${ic('x')}</button>`;
    toast(`${verb} ${ok.length} đơn, ${fail.length} thất bại`, 'err');
  } else {
    $('banner').hidden = true;
    toast(kind === 'export' ? `Đã xuất ${nf.format(ok.length)} đơn hàng ra tệp CSV` : `${verb} ${nf.format(ok.length)} đơn hàng`);
  }
  render();
}

/* ---------- loading ---------- */
async function load() {
  S.phase = 'loading'; render();
  if (S.force === 'loading') return;
  await sleep(S.force === 'error' ? 400 : 500);
  if (S.force === 'error') S.phase = 'error';
  else { S.phase = 'ready'; if (S.force === 'empty') DATA = []; }
  render();
}

/* ---------- events ---------- */
document.addEventListener('click', (e) => {
  const t = e.target;
  const menuBtn = t.closest('[data-menu]');
  if (menuBtn && !menuBtn.disabled) { e.stopPropagation(); if (!$('menu').hidden && $('menu')._anchor === menuBtn) closeMenu(); else singleMenu(menuBtn); return; }
  const mi = t.closest('[data-mi]');
  if (mi) { const it = menuItems[+mi.dataset.mi]; const m = $('menu'); m.hidden = true; it.run(); return; }
  if (!t.closest('#menu')) { $('menu').hidden = true; }
  if (!t.closest('#morePanel') && !t.closest('#btnMore')) closeMore();

  const tab = t.closest('[data-tab]'); if (tab) { setP({ status: tab.dataset.tab }, true); return; }
  const sort = t.closest('[data-sort]');
  if (sort) {
    const c = sort.dataset.sort; let next;
    if (P.sort === c) next = '-' + c;
    else if (P.sort === '-' + c) next = DEF_SORT === '-' + c ? c : DEF_SORT;
    else next = c;
    setP({ sort: next }); return;
  }
  const pg = t.closest('[data-page]'); if (pg && !pg.disabled) { setP({ page: +pg.dataset.page }, true); window.scrollTo({ top: 0 }); return; }
  const chip = t.closest('[data-chip]');
  if (chip) {
    const k = chip.dataset.chip, patch = {};
    if (k === 'date') { patch.from = ''; patch.to = ''; } else if (k === 'amount') { patch.min = ''; patch.max = ''; }
    else if (k === 'failed') { S.failed = null; } else patch[k] = '';
    setP(patch); $('chips').querySelector('button')?.focus(); return;
  }
  const bulk = t.closest('[data-bulk]');
  if (bulk) { runBulk(bulk.dataset.bulk, targets(), bulk); return; }
  if (t.closest('[data-bulkmore]')) {
    e.stopPropagation();
    openMenu(t.closest('[data-bulkmore]'), [
      { label: 'Tạm giữ đơn', run: () => runBulk('hold', targets()) },
      { label: 'Hủy đơn', danger: true, sep: true, run: () => runBulk('cancel', targets()) }
    ]); return;
  }
  const edit = t.closest('[data-edit]'); if (edit && !edit.disabled) { toast('Mở form sửa đơn ' + edit.dataset.edit); return; }
  const act = t.closest('[data-act]');
  if (act) {
    const a = act.dataset.act;
    if (a === 'clearAll' || a === 'clearFilters') { S.failed = null; setP({ q: '', channel: '', owner: '', pay: '', from: '', to: '', min: '', max: '' }); }
    else if (a === 'retry') { S.force = null; writeUrl(false); load(); }
    else if (a === 'selAllMatching') { S.allMatching = true; render(); }
    else if (a === 'clearSel') { S.sel.clear(); S.allMatching = false; render(); }
    else if (a === 'closeBanner') $('banner').hidden = true;
    else if (a === 'viewFailed') { S.failed = new Set(S.sel); P.status = 'all'; P.page = 1; writeUrl(false); $('banner').hidden = true; render(); }
    else if (a === 'create') toast('Mở form tạo đơn hàng mới');
    else if (a === 'import') toast('Mở trình nhập đơn hàng từ file');
    else if (a === 'export') toast('Đang xuất danh sách đơn hàng…');
  }
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.id === 'selAll') {
    const pr = pageRows(getRows());
    if (t.checked) pr.forEach((o) => S.sel.add(o.id)); else { pr.forEach((o) => S.sel.delete(o.id)); S.allMatching = false; }
    render();
  } else if (t.dataset.row) {
    if (S.allMatching) { S.sel = new Set(pageRows(getRows()).map((o) => o.id)); S.allMatching = false; }
    t.checked ? S.sel.add(t.dataset.row) : S.sel.delete(t.dataset.row); render();
  } else if (t.id === 'fChannel') setP({ channel: t.value });
  else if (t.id === 'fOwner') setP({ owner: t.value });
  else if (t.id === 'pgSize') setP({ size: +t.value });
});

let qTimer;
$('q').addEventListener('input', (e) => {
  const v = e.target.value.trim(); $('qClear').hidden = !e.target.value;
  clearTimeout(qTimer);
  if (v.length === 1) return;
  qTimer = setTimeout(() => setP({ q: v }), 300);
});
$('q').addEventListener('keydown', (e) => { if (e.key === 'Enter') { clearTimeout(qTimer); setP({ q: e.target.value.trim() }); } });
$('qClear').addEventListener('click', () => { $('q').value = ''; setP({ q: '' }); $('q').focus(); });

function closeMore() { $('morePanel').hidden = true; $('btnMore').setAttribute('aria-expanded', 'false'); }
$('btnMore').addEventListener('click', () => {
  const p = $('morePanel');
  if (p.hidden) {
    $('mPay').value = P.pay; $('mFrom').value = P.from; $('mTo').value = P.to; $('mMin').value = P.min; $('mMax').value = P.max;
    p.hidden = false; $('btnMore').setAttribute('aria-expanded', 'true'); $('mPay').focus();
  } else closeMore();
});
$('mApply').addEventListener('click', () => {
  closeMore();
  setP({ pay: $('mPay').value, from: $('mFrom').value, to: $('mTo').value, min: $('mMin').value, max: $('mMax').value });
  $('btnMore').focus();
});
$('mReset').addEventListener('click', () => { $('mPay').value = ''; $('mFrom').value = ''; $('mTo').value = ''; $('mMin').value = ''; $('mMax').value = ''; });

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { if (!$('menu').hidden) closeMenu(); if (!$('morePanel').hidden) { closeMore(); $('btnMore').focus(); } }
  if (e.key === '/' && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName) && !$('filterRow').hidden) { e.preventDefault(); $('q').focus(); }
});
window.addEventListener('popstate', () => { readUrl(); S.sel.clear(); S.allMatching = false; render(); });

/* ---------- init ---------- */
renderStatic(); readUrl(); load();
</script>
</body>
</html>
