<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orders – Sales – Meridian ERP</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  [hidden] { display: none !important; }
  html { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  body { color: #0f172a; }
  .tnum { font-variant-numeric: tabular-nums; }
  @keyframes pulse2 { 0%,100% { opacity: 1 } 50% { opacity: .45 } }
  .skel { animation: pulse2 1.2s ease-in-out infinite; background: #e2e8f0; border-radius: 4px; height: 12px; }
  .sr-only-live { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  :focus-visible { outline: 2px solid #1d4ed8; outline-offset: 1px; }
  input[type=checkbox] { accent-color: #1d4ed8; width: 16px; height: 16px; }
</style>
</head>
<body class="bg-white text-sm text-slate-900">
<p id="live" role="status" class="sr-only-live"></p>

<div class="flex min-h-screen">
  <!-- Sidebar -->
  <aside class="hidden w-60 shrink-0 border-r border-slate-200 bg-slate-50 lg:block" aria-label="Sidebar">
    <div class="flex h-12 items-center gap-2 border-b border-slate-200 px-4">
      <span class="flex size-6 items-center justify-center rounded bg-blue-700 text-xs font-semibold text-white">M</span>
      <span class="font-semibold">Meridian ERP</span>
    </div>
    <nav aria-label="Main" class="flex flex-col gap-4 p-2">
      <div class="flex flex-col gap-0.5">
        <p class="px-2 py-1 text-xs font-medium text-slate-600">Sales</p>
        <a href="#" class="flex h-8 items-center gap-2 rounded px-2 text-slate-700 hover:bg-slate-200/60"><svg class="size-4" data-i="quote"></svg>Quotations</a>
        <a href="#" aria-current="page" class="flex h-8 items-center gap-2 rounded bg-slate-200 px-2 font-medium text-slate-900"><svg class="size-4" data-i="cart"></svg>Orders</a>
        <a href="#" class="flex h-8 items-center gap-2 rounded px-2 text-slate-700 hover:bg-slate-200/60"><svg class="size-4" data-i="users"></svg>Customers</a>
        <a href="#" class="flex h-8 items-center gap-2 rounded px-2 text-slate-700 hover:bg-slate-200/60"><svg class="size-4" data-i="truck"></svg>Shipments</a>
      </div>
      <div class="flex flex-col gap-0.5">
        <p class="px-2 py-1 text-xs font-medium text-slate-600">Inventory</p>
        <a href="#" class="flex h-8 items-center gap-2 rounded px-2 text-slate-700 hover:bg-slate-200/60"><svg class="size-4" data-i="box"></svg>Products</a>
        <a href="#" class="flex h-8 items-center gap-2 rounded px-2 text-slate-700 hover:bg-slate-200/60"><svg class="size-4" data-i="warehouse"></svg>Stock levels</a>
      </div>
      <div class="flex flex-col gap-0.5">
        <p class="px-2 py-1 text-xs font-medium text-slate-600">Finance</p>
        <a href="#" class="flex h-8 items-center gap-2 rounded px-2 text-slate-700 hover:bg-slate-200/60"><svg class="size-4" data-i="file"></svg>Invoices</a>
        <a href="#" class="flex h-8 items-center gap-2 rounded px-2 text-slate-700 hover:bg-slate-200/60"><svg class="size-4" data-i="wallet"></svg>Payments</a>
      </div>
    </nav>
  </aside>

  <div class="flex min-w-0 flex-1 flex-col">
    <header class="flex h-12 shrink-0 items-center justify-between border-b border-slate-200 bg-white px-4">
      <button type="button" class="inline-flex h-8 w-72 items-center gap-2 rounded border border-slate-300 px-2 text-slate-600 hover:bg-slate-50" aria-label="Search or run a command">
        <svg class="size-4" data-i="search"></svg><span>Search or run a command</span><kbd class="ml-auto rounded border border-slate-300 px-1 text-xs text-slate-600">Ctrl K</kbd>
      </button>
      <div class="flex items-center gap-2">
        <button type="button" class="inline-flex size-8 items-center justify-center rounded text-slate-700 hover:bg-slate-100" aria-label="Notifications, 3 unread"><svg class="size-4" data-i="bell"></svg></button>
        <button type="button" class="inline-flex size-8 items-center justify-center rounded text-slate-700 hover:bg-slate-100" aria-label="Help"><svg class="size-4" data-i="help"></svg></button>
        <button type="button" class="inline-flex size-8 items-center justify-center rounded-full bg-slate-200 text-xs font-semibold text-slate-800" aria-label="Account menu">LH</button>
      </div>
    </header>

    <main class="min-w-0 flex-1 p-6">
      <!-- Page header -->
      <div class="mb-4 flex flex-col gap-2">
        <nav aria-label="Breadcrumb">
          <ol class="flex items-center gap-1 text-sm text-slate-600">
            <li><a href="#" class="inline-flex min-h-6 items-center hover:text-slate-900 hover:underline">Sales</a></li>
            <li aria-hidden="true">/</li>
            <li><span aria-current="page" class="text-slate-900">Orders</span></li>
          </ol>
        </nav>
        <div class="flex flex-wrap items-center justify-between gap-2">
          <h1 class="text-xl font-semibold">Orders</h1>
          <div class="flex items-center gap-2">
            <button type="button" id="btnImport" class="inline-flex h-8 items-center gap-1.5 rounded border border-slate-300 bg-white px-3 font-medium text-slate-800 hover:bg-slate-50"><svg class="size-4" data-i="upload"></svg>Import</button>
            <button type="button" id="btnExport" class="inline-flex h-8 items-center gap-1.5 rounded border border-slate-300 bg-white px-3 font-medium text-slate-800 hover:bg-slate-50"><svg class="size-4" data-i="download"></svg>Export</button>
            <button type="button" id="btnCreate" class="inline-flex h-8 items-center gap-1.5 rounded bg-blue-700 px-3 font-medium text-white hover:bg-blue-800"><svg class="size-4" data-i="plus"></svg>Create order</button>
          </div>
        </div>
      </div>

      <!-- Partial failure banner -->
      <div id="banner" hidden class="mb-3 flex items-center gap-3 rounded-md border border-amber-300 bg-amber-50 px-3 py-2 text-amber-900" role="alert">
        <span id="bannerText"></span>
        <button type="button" id="bannerView" class="font-medium text-blue-700 underline">View failed</button>
        <button type="button" id="bannerClose" class="ml-auto inline-flex size-6 items-center justify-center rounded hover:bg-amber-100" aria-label="Dismiss"><svg class="size-4" data-i="x"></svg></button>
      </div>

      <!-- Status tabs -->
      <div id="tabs" role="tablist" aria-label="Order status" class="flex gap-1 overflow-x-auto border-b border-slate-200"></div>

      <!-- Filter row -->
      <div class="relative flex flex-wrap items-center gap-2 py-3">
        <div class="relative">
          <svg class="pointer-events-none absolute left-2 top-2 size-4 text-slate-500" data-i="search"></svg>
          <input id="q" type="search" aria-label="Search orders" placeholder="Search order no., customer, phone" autocomplete="off"
            class="h-8 w-80 rounded border border-slate-300 bg-white pl-8 pr-8 placeholder:text-slate-500 [&::-webkit-search-cancel-button]:hidden">
          <button type="button" id="qClear" hidden aria-label="Clear search" class="absolute right-1 top-1 inline-flex size-6 items-center justify-center rounded text-slate-600 hover:bg-slate-100"><svg class="size-4" data-i="x"></svg></button>
        </div>
        <select id="fPayment" aria-label="Payment" class="h-8 rounded border border-slate-300 bg-white px-2 text-slate-800">
          <option value="">Payment: All</option><option>Unpaid</option><option>Paid</option><option>Refunded</option>
        </select>
        <select id="fChannel" aria-label="Channel" class="h-8 rounded border border-slate-300 bg-white px-2 text-slate-800">
          <option value="">Channel: All</option><option>Website</option><option>Marketplace</option><option>Direct sales</option><option>Distributor</option>
        </select>
        <select id="fRange" aria-label="Created date" class="h-8 rounded border border-slate-300 bg-white px-2 text-slate-800">
          <option value="">Created: Any time</option><option value="today">Today</option><option value="7d">Last 7 days</option><option value="30d">Last 30 days</option><option value="month">This month</option>
        </select>
        <div class="relative">
          <button type="button" id="btnMore" aria-expanded="false" aria-controls="morePanel" class="inline-flex h-8 items-center gap-1.5 rounded border border-slate-300 bg-white px-3 font-medium text-slate-800 hover:bg-slate-50"><svg class="size-4" data-i="filter"></svg><span id="moreLabel">More filters</span></button>
          <div id="morePanel" hidden class="absolute left-0 top-9 z-30 w-72 rounded-lg border border-slate-200 bg-white p-4 shadow-lg" role="dialog" aria-label="More filters">
            <div class="mb-3">
              <label for="pOwner" class="mb-1 block text-sm font-medium">Owner</label>
              <select id="pOwner" class="h-8 w-full rounded border border-slate-300 bg-white px-2"></select>
            </div>
            <div class="mb-4">
              <span class="mb-1 block text-sm font-medium" id="amtLbl">Total (VND)</span>
              <div class="flex items-center gap-2" role="group" aria-labelledby="amtLbl">
                <input id="pMin" inputmode="numeric" aria-label="Minimum total" placeholder="Min" class="tnum h-8 w-full rounded border border-slate-300 px-2 text-right placeholder:text-slate-500">
                <span class="text-slate-600">–</span>
                <input id="pMax" inputmode="numeric" aria-label="Maximum total" placeholder="Max" class="tnum h-8 w-full rounded border border-slate-300 px-2 text-right placeholder:text-slate-500">
              </div>
            </div>
            <div class="flex justify-end gap-2 border-t border-slate-200 pt-3">
              <button type="button" id="pReset" class="inline-flex h-8 items-center rounded border border-slate-300 px-3 font-medium hover:bg-slate-50">Reset</button>
              <button type="button" id="pApply" class="inline-flex h-8 items-center rounded bg-blue-700 px-3 font-medium text-white hover:bg-blue-800">Apply</button>
            </div>
          </div>
        </div>
        <div class="ml-auto flex items-center gap-2">
          <div class="relative">
            <button type="button" id="btnCols" aria-expanded="false" class="inline-flex h-8 items-center gap-1.5 rounded border border-slate-300 bg-white px-3 font-medium text-slate-800 hover:bg-slate-50"><svg class="size-4" data-i="columns"></svg><span id="colsLabel">Columns</span></button>
            <div id="colsPanel" hidden class="absolute right-0 top-9 z-30 w-52 rounded-lg border border-slate-200 bg-white p-2 shadow-lg" role="group" aria-label="Visible columns"></div>
          </div>
          <button type="button" id="btnDensity" aria-pressed="false" class="inline-flex h-8 items-center gap-1.5 rounded border border-slate-300 bg-white px-3 font-medium text-slate-800 hover:bg-slate-50"><svg class="size-4" data-i="rows"></svg>Compact</button>
        </div>
      </div>

      <!-- Chips -->
      <div id="chips" class="flex flex-wrap items-center gap-2 pb-3" hidden></div>

      <!-- Summary line -->
      <p id="summary" class="mb-2 text-slate-700"></p>

      <!-- Table card -->
      <div class="rounded-md border border-slate-200 bg-white">
        <div id="bulk" hidden class="flex h-10 items-center gap-3 border-b border-slate-200 bg-blue-50 px-3 text-blue-900">
          <span id="bulkCount" class="font-medium tnum"></span>
          <button type="button" id="bulkAll" hidden class="font-medium text-blue-700 underline"></button>
          <div class="ml-2 flex items-center gap-2">
            <button type="button" data-bulk="confirm" class="inline-flex h-8 items-center gap-1.5 rounded bg-blue-700 px-3 font-medium text-white hover:bg-blue-800"><svg class="size-4" data-i="check"></svg>Confirm orders</button>
            <button type="button" data-bulk="export" class="inline-flex h-8 items-center gap-1.5 rounded border border-slate-300 bg-white px-3 font-medium text-slate-800 hover:bg-slate-50"><svg class="size-4" data-i="download"></svg>Export selected</button>
            <button type="button" data-bulk="print" class="inline-flex h-8 items-center gap-1.5 rounded border border-slate-300 bg-white px-3 font-medium text-slate-800 hover:bg-slate-50"><svg class="size-4" data-i="printer"></svg>Print picking lists</button>
            <div class="relative">
              <button type="button" id="bulkMoreBtn" aria-expanded="false" class="inline-flex h-8 items-center gap-1 rounded border border-slate-300 bg-white px-3 font-medium text-slate-800 hover:bg-slate-50">More<svg class="size-4" data-i="chevron"></svg></button>
              <div id="bulkMore" hidden class="absolute left-0 top-9 z-30 w-48 rounded-lg border border-slate-200 bg-white p-1 shadow-lg">
                <button type="button" data-bulk="cancel" class="flex h-8 w-full items-center rounded px-2 text-left font-medium text-red-700 hover:bg-red-50">Cancel orders</button>
              </div>
            </div>
          </div>
          <button type="button" id="bulkCancel" class="ml-auto inline-flex h-8 items-center rounded px-3 font-medium text-blue-800 hover:bg-blue-100">Clear selection</button>
        </div>

        <div class="overflow-x-auto">
          <table id="tbl" class="w-full border-collapse text-left" aria-label="Orders" aria-busy="false">
            <thead id="thead" class="bg-slate-50"></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>

        <div id="pager" class="flex h-12 flex-wrap items-center justify-between gap-3 border-t border-slate-200 px-3"></div>
      </div>
    </main>
  </div>
</div>

<!-- Row action menu -->
<div id="rowMenu" hidden class="fixed z-40 w-48 rounded-lg border border-slate-200 bg-white p-1 shadow-lg" role="menu"></div>

<!-- Dialog -->
<div id="dlg" hidden class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 p-4">
  <div role="dialog" aria-modal="true" aria-labelledby="dlgTitle" class="w-full max-w-md rounded-lg bg-white p-5 shadow-xl">
    <h2 id="dlgTitle" class="text-base font-semibold"></h2>
    <p id="dlgBody" class="mt-2 text-slate-700"></p>
    <div class="mt-5 flex justify-end gap-2">
      <button type="button" id="dlgNo" class="inline-flex h-8 items-center rounded border border-slate-300 px-3 font-medium hover:bg-slate-50">Keep orders</button>
      <button type="button" id="dlgYes" class="inline-flex h-8 items-center rounded px-3 font-medium text-white"></button>
    </div>
  </div>
</div>

<!-- Toasts -->
<div id="toasts" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  /* ---------- Icons (16px, one stroke set) ---------- */
  var ICONS = {

    searchx: '<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3M8.5 8.5l5 5M13.5 8.5l-5 5"/>'
  };
  function icon(name, cls) {
    return '<svg class="' + (cls || 'size-4') + ' shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONS[name] || '') + '</svg>';
  }
  function hydrateIcons(root) {
    (root || document).querySelectorAll('svg[data-i]').forEach(function (s) {
      s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('fill', 'none'); s.setAttribute('stroke', 'currentColor');
      s.setAttribute('stroke-width', '2'); s.setAttribute('stroke-linecap', 'round'); s.setAttribute('stroke-linejoin', 'round');
      s.setAttribute('aria-hidden', 'true'); s.classList.add('shrink-0');
      s.innerHTML = ICONS[s.getAttribute('data-i')] || ''; s.removeAttribute('data-i');
    });
  }

  /* ---------- Formatting ---------- */
  var nfVND = new Intl.NumberFormat('vi-VN');
  var nfInt = new Intl.NumberFormat('en-US');
  var vnd = function (n) { return nfVND.format(n); };
  var vndC = function (n) { return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(n); };
  function pad(n) { return String(n).padStart(2, '0'); }
  function fmtDate(d) { return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function norm(s) { return String(s).normalize('NFD').replace(/\p{Diacritic}/gu, '').replace(/đ/gi, 'd').toLowerCase(); }

  ];
  var OWNERS = ['Nguyễn Thanh Tùng', 'Trần Minh Quân', 'Lê Thu Hà', 'Phạm Đức Anh', 'Võ Ngọc Lan'];
  var CHANNELS = ['Website', 'Marketplace', 'Direct sales', 'Distributor'];
  var STATUS = {
    'Draft': 'neutral', 'Pending': 'info', 'Shipping': 'info', 'Delivered': 'success', 'Late': 'danger', 'Cancelled': 'neutral'
  };
  var STATUS_ORDER = ['Pending', 'Shipping', 'Late', 'Delivered', 'Draft', 'Cancelled'];
  var STATUS_LABEL = { Late: 'Late delivery' };
  var PAY = { 'Unpaid': 'warning', 'Paid': 'success', 'Refunded': 'neutral' };
  var TONE = {
    neutral: 'bg-slate-100 text-slate-700', info: 'bg-blue-50 text-blue-800', success: 'bg-green-50 text-green-800',
    warning: 'bg-amber-50 text-amber-800', danger: 'bg-red-50 text-red-800'
  };
  function badge(label, tone) { return '<span class="inline-flex h-6 items-center whitespace-nowrap rounded-full px-2 text-xs font-medium ' + TONE[tone] + '">' + esc(label) + '</span>'; }

  var seed = 20261104;
  function rnd() { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; }
  var ORDERS = (function () {
    var arr = [], t = NOW.getTime();
    for (var i = 96; i >= 1; i--) {
      var idx = 96 - i; // 0 = newest

          var ok = 0, fail = [];
          ids.forEach(function (id) { var o = data.find(function (x) { return x.id === id; }); if (o.status === 'Delivered' || o.status === 'Cancelled') fail.push(id); else { o.status = 'Cancelled'; if (o.payment === 'Paid') o.payment = 'Refunded'; ok++; } });
          selected = new Set(fail); allMatching = false;
          if (fail.length) showBanner(ok + ' updated, ' + fail.length + ' failed. Delivered or already cancelled orders were skipped.', fail); else toast(nfInt.format(ok) + ' orders cancelled');
          render();
        }
      });
    }
  }
  var failedIds = null;
  function showBanner(text, ids) {
    failedIds = new Set(ids); $('bannerText').textContent = text; $('bannerView').textContent = 'View failed (' + ids.length + ')'; $('banner').hidden = false;
  }

  /* ---------- Menus ---------- */
  function closeMenus(except) {
    ['morePanel', 'colsPanel', 'bulkMore', 'rowMenu'].forEach(function (id) { if (id !== except) $(id).hidden = true; });
    $('btnMore').setAttribute('aria-expanded', !$('morePanel').hidden);
    $('btnCols').setAttribute('aria-expanded', !$('colsPanel').hidden);
    $('bulkMoreBtn').setAttribute('aria-expanded', !$('bulkMore').hidden);
  }
  function fillMore() {
    $('pOwner').innerHTML = '<option value="">All owners</option>' + OWNERS.map(function (o) { return '<option' + (o === S.owner ? ' selected' : '') + '>' + o + '</option>'; }).join('');
    $('pMin').value = S.min ? vnd(S.min) : ''; $('pMax').value = S.max ? vnd(S.max) : '';
  }
  function fillCols() {
    $('colsPanel').innerHTML = COLS.map(function (c, i) {
      return '<div class="flex h-8 items-center gap-1 px-1"><label class="flex flex-1 items-center gap-2"><input type="checkbox" data-col="' + c.k + '"' + (hiddenCols.has(c.k) ? '' : ' checked') + '>' + esc(c.label) + '</label>' +
        '<button type="button" data-colmove="' + i + ':-1" aria-label="Move ' + esc(c.label) + ' up"' + (i === 0 ? ' disabled' : '') + ' class="inline-flex size-6 items-center justify-center rounded text-slate-700 hover:bg-slate-100 disabled:text-slate-500">' + icon('chevronUp') + '</button>' +
        '<button type="button" data-colmove="' + i + ':1" aria-label="Move ' + esc(c.label) + ' down"' + (i === COLS.length - 1 ? ' disabled' : '') + ' class="inline-flex size-6 items-center justify-center rounded text-slate-700 hover:bg-slate-100 disabled:text-slate-500">' + icon('chevron') + '</button></div>';
    }).join('');
  }
  function parseAmt(s) { var n = parseInt(String(s).replace(/\D/g, ''), 10); return n > 0 ? n : 0; }

  /* ---------- Events ---------- */
  var qTimer;
  $('q').addEventListener('input', function (e) {
    var v = e.target.value; $('qClear').hidden = !v;
    clearTimeout(qTimer); qTimer = setTimeout(function () { if (v.trim().length === 0 || v.trim().length >= 2) setFilter({ q: v.trim() }); }, 300);
  });
  $('q').addEventListener('keydown', function (e) { if (e.key === 'Enter') { clearTimeout(qTimer); setFilter({ q: e.target.value.trim() }); } });
  $('qClear').addEventListener('click', function () { setFilter({ q: '' }); $('q').focus(); });
  $('fPayment').addEventListener('change', function (e) { setFilter({ payment: e.target.value }); });
  $('fChannel').addEventListener('change', function (e) { setFilter({ channel: e.target.value }); });
  $('fRange').addEventListener('change', function (e) { setFilter({ range: e.target.value }); });

  $('btnMore').addEventListener('click', function (e) { e.stopPropagation(); var open = $('morePanel').hidden; closeMenus('morePanel'); if (open) fillMore(); $('morePanel').hidden = !open; $('btnMore').setAttribute('aria-expanded', open); });
  $('morePanel').addEventListener('click', function (e) { e.stopPropagation(); });
  $('pApply').addEventListener('click', function () {
    var mn = parseAmt($('pMin').value), mx = parseAmt($('pMax').value);
    if (mn && mx && mn > mx) { var t = mn; mn = mx; mx = t; }
    setFilter({ owner: $('pOwner').value, min: mn, max: mx }); closeMenus(); $('btnMore').focus();
  });
  $('pReset').addEventListener('click', function () { $('pOwner').value = ''; $('pMin').value = ''; $('pMax').value = ''; });

  $('btnCols').addEventListener('click', function (e) { e.stopPropagation(); var open = $('colsPanel').hidden; closeMenus('colsPanel'); if (open) fillCols(); $('colsPanel').hidden = !open; $('btnCols').setAttribute('aria-expanded', open); });
  $('colsPanel').addEventListener('click', function (e) { e.stopPropagation(); });
  $('colsPanel').addEventListener('change', function (e) {
    var k = e.target.getAttribute('data-col'); if (!k) return;
    if (e.target.checked) hiddenCols.delete(k); else hiddenCols.add(k); render();
  });
  $('colsPanel').addEventListener('click', function (e) {
    var b = e.target.closest('[data-colmove]'); if (!b) return;
    var p = b.getAttribute('data-colmove').split(':'), i = +p[0], j = i + +p[1];
    var tmp = COLS[i]; COLS[i] = COLS[j]; COLS[j] = tmp; fillCols(); render();
  });
  $('btnDensity').addEventListener('click', function () { compact = !compact; render(); });

  $('tabs').addEventListener('click', function (e) { var b = e.target.closest('[data-tab]'); if (b) setFilter({ status: b.getAttribute('data-tab') }); });
  $('chips').addEventListener('click', function (e) {
    if (e.target.closest('#clearAll')) { clearFilters(); return; }
    var b = e.target.closest('[data-chip]'); if (!b) return;
    var k = b.getAttribute('data-chip');
    if (k === 'amount') setFilter({ min: 0, max: 0 }); else if (k === 'failed') { failedOnly = null; setFilter({}); } else { var p = {}; p[k] = ''; setFilter(p); }
    var next = $('chips').querySelector('[data-chip]'); (next || $('q')).focus();
  });

  $('thead').addEventListener('click', function (e) {
    var b = e.target.closest('[data-sort]');
    if (b) {
      var k = b.getAttribute('data-sort'), cur = S.sort, next;
      var firstDir = (k === 'total' || k === 'created') ? '-' : '';
      // first click: default direction for the column, next: reverse, third: back to default order
      if (cur.replace('-', '') !== k) next = firstDir + k;
      else if (cur === firstDir + k) next = (firstDir ? '' : '-') + k;
      else next = DEFAULTS.sort;
      S.sort = next; S.page = 1; syncURL(); render(); return;
    }
    if (e.target.id === 'selAll') {
      var rows = pageRows().rows;
      if (e.target.checked) rows.forEach(function (o) { selected.add(o.id); }); else { rows.forEach(function (o) { selected.delete(o.id); }); allMatching = false; }
      render();
    }
  });

  $('tbody').addEventListener('change', function (e) {
    var id = e.target.getAttribute('data-sel'); if (!id) return;
    if (allMatching) { allMatching = false; filtered().forEach(function (o) { selected.add(o.id); }); }
    if (e.target.checked) selected.add(id); else selected.delete(id);
    render();
  });
  $('tbody').addEventListener('click', function (e) {
    if (e.target.closest('#retry')) { MODE = ''; loaded = false; syncURL(); render(); setTimeout(function () { loaded = true; render(); }, 500); return; }
    if (e.target.closest('#clearFilters')) { clearFilters(); return; }
    if (e.target.closest('#emptyCreate')) { toast('Create order form would open here'); return; }
    var a = e.target.closest('[data-open]'); if (a) { e.preventDefault(); toast('Opening order ' + a.getAttribute('data-open')); return; }
    var ed = e.target.closest('[data-edit]'); if (ed && !ed.disabled) { toast('Editing order ' + ed.getAttribute('data-edit')); return; }
    var m = e.target.closest('[data-menu]');
    if (m && !m.disabled) {
      e.stopPropagation();
      var id = m.getAttribute('data-menu'), menu = $('rowMenu');
      if (!menu.hidden && menu.getAttribute('data-for') === id) { closeMenus(); return; }
      closeMenus('rowMenu');
      var o = data.find(function (x) { return x.id === id; });
      var item = 'flex h-8 w-full items-center rounded px-2 text-left text-slate-800 hover:bg-slate-100';
      menu.setAttribute('aria-label', 'Actions for order ' + id); menu.setAttribute('data-for', id);
      menu.innerHTML = '<button type="button" role="menuitem" data-ra="view" class="' + item + '">View order</button>' +
        '<button type="button" role="menuitem" data-ra="dup" class="' + item + '">Duplicate</button>' +
        '<button type="button" role="menuitem" data-ra="invoice" class="' + item + '">Print invoice</button>' +
        '<div class="my-1 border-t border-slate-200"></div>' +
        (o.status === 'Delivered' || o.status === 'Cancelled'
          ? '<button type="button" role="menuitem" disabled title="' + o.status + ' orders cannot be cancelled" class="flex h-8 w-full items-center rounded px-2 text-left text-slate-500">Cancel order</button>'
          : '<button type="button" role="menuitem" data-ra="cancel" class="flex h-8 w-full items-center rounded px-2 text-left font-medium text-red-700 hover:bg-red-50">Cancel order</button>');
      var r = m.getBoundingClientRect();
      menu.style.top = Math.min(r.bottom + 4, window.innerHeight - 190) + 'px'; menu.style.left = Math.max(8, r.right - 192) + 'px';
      menu.hidden = false; menu.querySelector('button').focus();
    }
  });
  $('rowMenu').addEventListener('click', function (e) {
    var b = e.target.closest('[data-ra]'); if (!b) return;
    var id = $('rowMenu').getAttribute('data-for'), o = data.find(function (x) { return x.id === id; }), act = b.getAttribute('data-ra');
    closeMenus();
    if (act === 'view') toast('Opening order ' + id);
    else if (act === 'dup') toast('Draft copy of ' + id + ' created');
    else if (act === 'invoice') toast('Invoice for ' + id + ' sent to the printer');
    else if (act === 'cancel') openDialog({
      title: 'Cancel order ' + id + '?', danger: true, confirm: 'Cancel order', cancel: 'Keep order',
      body: o.customer + ' will be notified and stock is released.' + (o.payment === 'Paid' ? ' The paid amount of ' + vndC(o.total) + ' will be marked for refund.' : ''),
      onConfirm: function () { o.status = 'Cancelled'; if (o.payment === 'Paid') o.payment = 'Refunded'; toast('Order ' + id + ' cancelled'); render(); }
    });
  });

  $('pager').addEventListener('click', function (e) { var b = e.target.closest('[data-page]'); if (b && !b.disabled) { S.page = +b.getAttribute('data-page'); syncURL(); render(); } });
  $('pager').addEventListener('change', function (e) { if (e.target.id === 'pageSize') { S.size = +e.target.value; S.page = 1; syncURL(); render(); } });

  $('bulkAll').addEventListener('click', function () { allMatching = true; render(); });
  $('bulkCancel').addEventListener('click', function () { selected.clear(); allMatching = false; render(); });
  $('bulk').addEventListener('click', function (e) { var b = e.target.closest('[data-bulk]'); if (b) { closeMenus(); bulkRun(b.getAttribute('data-bulk')); } });
  $('bulkMoreBtn').addEventListener('click', function (e) { e.stopPropagation(); var open = $('bulkMore').hidden; closeMenus('bulkMore'); $('bulkMore').hidden = !open; $('bulkMoreBtn').setAttribute('aria-expanded', open); });

  $('bannerClose').addEventListener('click', function () { $('banner').hidden = true; });
  $('bannerView').addEventListener('click', function () { failedOnly = new Set(failedIds); $('banner').hidden = true; S.status = ''; S.page = 1; render(); });

  $('dlgYes').addEventListener('click', function () { var cb = dlgCb; $('dlg').hidden = true; dlgCb = null; if (cb) cb(); });
  $('dlgNo').addEventListener('click', closeDialog);
  $('dlg').addEventListener('click', function (e) { if (e.target === $('dlg')) closeDialog(); });

  $('btnImport').addEventListener('click', function () { toast('Import: download the template, then upload your CSV'); });
  $('btnExport').addEventListener('click', function () { toast('Exporting ' + nfInt.format(filtered().length) + ' orders to CSV'); });
  $('btnCreate').addEventListener('click', function () { toast('Create order form would open here'); });

  document.addEventListener('click', function () { closeMenus(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { if (!$('dlg').hidden) closeDialog(); else closeMenus(); }
    if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test((document.activeElement || {}).tagName || '') && $('dlg').hidden) { e.preventDefault(); $('q').focus(); }
  });

  /* ---------- Boot ---------- */
  hydrateIcons();
  render();
  if (MODE === 'loading') { /* held skeleton */ }
  else if (MODE === 'error') { loaded = true; render(); }
  else if (MODE === 'empty') { loaded = true; render(); }
  else setTimeout(function () { loaded = true; render(); }, 450);
})();
</script>
</body>
</html>
