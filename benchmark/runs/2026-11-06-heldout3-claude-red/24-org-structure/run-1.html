        <p class="text-sm text-slate-500 mt-0.5">Northwind Technologies &middot; Department hierarchy, managers &amp; headcount</p>
      </div>
      <div class="text-right">
        <p class="text-sm font-medium text-slate-700" id="total-headcount"></p>
        <p class="text-xs text-slate-400">Total headcount across all units</p>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-8 grid grid-cols-1 lg:grid-cols-3 gap-6">

      <div class="px-5 py-4 border-b border-slate-200 flex items-center justify-between">
        <h2 class="text-sm font-semibold text-slate-700 uppercase tracking-wide">Department Hierarchy</h2>
        <span class="text-xs text-slate-400">Click a unit to view details</span>
      </div>
      <div id="org-tree" class="p-5 overflow-x-auto"></div>
    </section>

    <aside class="lg:col-span-1">
      <div class="bg-white rounded-lg border border-slate-200 shadow-sm sticky top-6">
        <div class="px-5 py-4 border-b border-slate-200">
          <h2 class="text-sm font-semibold text-slate-700 uppercase tracking-wide">Unit Details</h2>
        </div>
        <div id="unit-details" class="p-5"></div>
      </div>
    </aside>
  </main>

  <footer class="max-w-7xl mx-auto px-6 pb-8 text-xs text-slate-400">
    Data shown is illustrative sample data for internal demo purposes.
  </footer>
</div>

        description: "Oversees talent acquisition, employee experience, and HR operations.",
        children: [
          { id: "people-ta", name: "Talent Acquisition", manager: { name: "Victor Alonso", title: "Talent Acquisition Manager", email: "victor.alonso@northwindtech.com" }, headcount: 8, location: "Remote", costCenter: "CC-5010", description: "Recruiting and hiring across all departments.", children: [] },
          { id: "people-ops", name: "HR Operations", manager: { name: "Chloe Bennett", title: "HR Operations Manager", email: "chloe.bennett@northwindtech.com" }, headcount: 10, location: "London, UK", costCenter: "CC-5020", description: "Payroll, benefits, and employee relations.", children: [] }
        ]
      }
    ]
  };

  function sumHeadcount(node) {
    return node.headcount + node.children.reduce((sum, c) => sum + sumHeadcount(c), 0);
  }

  function countDescendantUnits(node) {
    return node.children.reduce((sum, c) => sum + 1 + countDescendantUnits(c), 0);
  }

  function flatten(node, out) {
    out.push(node);
    node.children.forEach(c => flatten(c, out));
    return out;
  }

  const allUnits = flatten(ORG, []);
  const byId = Object.fromEntries(allUnits.map(u => [u.id, u]));
  let selectedId = ORG.id;

  function renderTree() {
    const container = document.getElementById("org-tree");
    container.innerHTML = buildNodeHtml(ORG, 0);
    attachTreeHandlers();
  }

  function buildNodeHtml(node, depth) {
    const isSelected = node.id === selectedId;
    const rowClasses = [
      "flex items-center gap-3 rounded-md px-3 py-2 cursor-pointer border transition-colors",
      isSelected ? "bg-indigo-50 border-indigo-200" : "bg-white border-transparent hover:bg-slate-50 hover:border-slate-200"
    ].join(" ");

    const children = node.children.length
      ? `<div class="mt-1 ml-5 border-l border-slate-200 pl-4 space-y-1">${node.children.map(c => buildNodeHtml(c, depth + 1)).join("")}</div>`
      : "";

    return `
      <div class="mb-1">
        <div class="unit-row ${rowClasses}" data-id="${node.id}">
          <div class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-xs font-semibold text-slate-500 shrink-0">
            ${initials(node.manager.name)}
          </div>
          <div class="flex-1 min-w-0">
            <p class="text-sm font-medium text-slate-900 truncate">${node.name}</p>
            <p class="text-xs text-slate-500 truncate">${node.manager.name} &middot; ${node.manager.title}</p>
          </div>
          <span class="shrink-0 inline-flex items-center gap-1 text-xs font-medium text-slate-600 bg-slate-100 rounded-full px-2 py-0.5">
            ${sumHeadcount(node)}
          </span>
        </div>
        ${children}
      </div>
    `;
  }

  function initials(name) {
    return name.split(" ").map(p => p[0]).join("").slice(0, 2).toUpperCase();
  }

  function attachTreeHandlers() {
    document.querySelectorAll(".unit-row").forEach(row => {
      row.addEventListener("click", () => {
        selectedId = row.dataset.id;
        renderTree();
        renderDetails();
      });
    });
  }

  function renderDetails() {
    const node = byId[selectedId];
    const panel = document.getElementById("unit-details");
    const direct = node.children.length;
    const total = sumHeadcount(node);
    const descendantUnits = countDescendantUnits(node);

    panel.innerHTML = `
      <div class="flex items-start gap-3 pb-4 border-b border-slate-200">
        <div class="w-12 h-12 rounded-full bg-indigo-100 flex items-center justify-center text-sm font-semibold text-indigo-700 shrink-0">
          ${initials(node.manager.name)}
        </div>
        <div class="min-w-0">
          <h3 class="text-base font-semibold text-slate-900">${node.name}</h3>
          <p class="text-xs text-slate-500 mt-0.5">${node.costCenter} &middot; ${node.location}</p>
        </div>
      </div>

      <div class="py-4 space-y-3">
        <div>
          <p class="text-xs font-medium text-slate-400 uppercase tracking-wide">Manager</p>
          <p class="text-sm text-slate-800 mt-1">${node.manager.name}</p>
          <p class="text-xs text-slate-500">${node.manager.title}</p>
          <a href="mailto:${node.manager.email}" class="text-xs text-indigo-600 hover:underline">${node.manager.email}</a>
        </div>

        <div>
          <p class="text-xs font-medium text-slate-400 uppercase tracking-wide">Description</p>
          <p class="text-sm text-slate-700 mt-1">${node.description}</p>
        </div>
      </div>

      <div class="grid grid-cols-3 gap-2 py-4 border-t border-slate-200">
        <div class="text-center">
          <p class="text-lg font-semibold text-slate-900">${node.headcount}</p>
          <p class="text-xs text-slate-500">Direct staff</p>
        </div>
        <div class="text-center">
          <p class="text-lg font-semibold text-slate-900">${total}</p>
          <p class="text-xs text-slate-500">Total headcount</p>
        </div>
        <div class="text-center">
          <p class="text-lg font-semibold text-slate-900">${direct}</p>
          <p class="text-xs text-slate-500">Sub-units</p>
        </div>
      </div>

      ${node.children.length ? `
        <div class="pt-4 border-t border-slate-200">
          <p class="text-xs font-medium text-slate-400 uppercase tracking-wide mb-2">Reporting units (${descendantUnits})</p>
          <ul class="space-y-1.5">
            ${node.children.map(c => `
              <li class="flex items-center justify-between text-sm">
                <button class="jump-link text-slate-700 hover:text-indigo-600 hover:underline text-left" data-id="${c.id}">${c.name}</button>
                <span class="text-xs text-slate-500">${sumHeadcount(c)} people</span>
              </li>
            `).join("")}
          </ul>
        </div>
      ` : `
        <div class="pt-4 border-t border-slate-200">
          <p class="text-xs text-slate-400">No sub-units &mdash; this is a leaf team.</p>
        </div>
      `}
    `;

    panel.querySelectorAll(".jump-link").forEach(btn => {
      btn.addEventListener("click", () => {
        selectedId = btn.dataset.id;
        renderTree();
        renderDetails();
      });
    });
  }

  document.getElementById("total-headcount").textContent = `${sumHeadcount(ORG)} employees`;
  renderTree();
  renderDetails();
</script>
