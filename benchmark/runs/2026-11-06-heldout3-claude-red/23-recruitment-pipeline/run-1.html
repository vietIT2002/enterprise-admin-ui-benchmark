const candidates = RAW_CANDIDATES.map((row, i) => {
  const [name, jobId, stage, rating, appliedDate, source, exp, currentTitle, company, salary, rejectedFrom] = row;
  return {
    id: 'c' + (i + 1),
    name, jobId, stage, rating,
    appliedDate, source,
    experienceYears: exp,
    currentTitle, company,
    salaryExpectation: salary,
    location: CITIES[(name.length * 7 + i) % CITIES.length],
    email: name.toLowerCase().replace(/\s+/g, '.') + '@examplemail.com',
    phone: '(555) ' + String(100 + (i * 13) % 800).padStart(3, '0') + '-' + String(1000 + (i * 97) % 9000),
    skills: shuffleSkills(SKILL_SETS[jobId], i),
    notes: NOTES[name] || '',
    rejectedFrom: rejectedFrom || 'screening',
  };
});

function shuffleSkills(arr, seed) {
  const copy = [...arr];
  const n = 3 + (seed % 2); // 3 or 4 skills shown
  const out = [];
  let idx = seed % copy.length;
  for (let i = 0; i < n; i++) {
    out.push(copy[idx % copy.length]);
    idx += 3;
  }
  return [...new Set(out)];
}

function getStageHistory(c) {
  const uptoStage = c.stage === 'rejected' ? c.rejectedFrom : c.stage;
  let idx = STAGE_ORDER.indexOf(uptoStage);
  if (idx === -1) idx = 0;
  const base = new Date(c.appliedDate + 'T00:00:00');
  const hist = [];
  for (let i = 0; i <= idx; i++) {
    const d = new Date(base);
    d.setDate(d.getDate() + STAGE_OFFSET_DAYS[i]);
    hist.push({ stage: STAGE_ORDER[i], date: d.toISOString().slice(0, 10) });
  }
  if (c.stage === 'rejected') {
    const d = new Date(base);
    d.setDate(d.getDate() + STAGE_OFFSET_DAYS[idx] + 2);
    hist.push({ stage: 'rejected', date: d.toISOString().slice(0, 10) });
  }
  return hist;
}

function stageMeta(id) { return STAGES.find(s => s.id === id); }

function getFiltered() {
  const q = state.query.trim().toLowerCase();
  return candidates.filter(c => {
    if (c.jobId !== state.jobId) return false;
    if (state.source !== 'all' && c.source !== state.source) return false;
    if (state.minRating > 0 && c.rating < state.minRating) return false;
    if (state.minExp > 0 && c.experienceYears < state.minExp) return false;
    if (q) {
      const hay = (c.name + ' ' + c.email + ' ' + c.skills.join(' ') + ' ' + c.currentTitle).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

  }).join('');
  sel.value = state.jobId;
}

function renderStats() {
  const all = candidates.filter(c => c.jobId === state.jobId);
  const total = all.length;
  const active = all.filter(c => c.stage !== 'hired' && c.stage !== 'rejected').length;
  const offers = all.filter(c => c.stage === 'offer').length;
  const hired = all.filter(c => c.stage === 'hired').length;
  const rejected = all.filter(c => c.stage === 'rejected').length;
  const avgRated = all.filter(c => c.rating > 0);
  const avgRating = avgRated.length ? (avgRated.reduce((s, c) => s + c.rating, 0) / avgRated.length).toFixed(1) : '—';

  const items = [
    ['Total Candidates', total, 'text-slate-900'],
    ['Active in Pipeline', active, 'text-sky-600'],
    ['Offers Extended', offers, 'text-violet-600'],
    ['Hired', hired, 'text-emerald-600'],
    ['Rejected', rejected, 'text-rose-500'],
    ['Avg. Rating', avgRating === '—' ? avgRating : avgRating + ' ★', 'text-amber-600'],
  ];
  document.getElementById('statsRow').innerHTML = items.map(([label, value, color]) => `
    <div class="border border-slate-100 rounded-lg px-3 py-2.5 bg-slate-50/50">
      <p class="text-xs text-slate-400">${label}</p>

}

  <div draggable="true" data-card-id="${c.id}"
    class="group bg-white border border-slate-200 rounded-lg p-3 cursor-pointer hover:shadow-md hover:border-indigo-200 transition-shadow">
    <div class="flex items-start justify-between gap-2">
      <div class="flex items-center gap-2 min-w-0">
        <div class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-semibold shrink-0 ${avatarColor(c.name)}">${initials(c.name)}</div>
        <div class="min-w-0">
          <p class="text-sm font-semibold text-slate-900 truncate">${c.name}</p>
          <p class="text-xs text-slate-400 truncate">${c.currentTitle}</p>
        </div>
      </div>
      <button data-action="reject" data-id="${c.id}" title="Reject candidate"
        class="opacity-0 group-hover:opacity-100 text-slate-300 hover:text-rose-500 transition-opacity shrink-0">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18 18 6M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="mt-2">${stars(c.rating)}</div>
    <div class="mt-2 flex flex-wrap gap-1">${skillBadges}${extra}</div>
    <div class="mt-2.5 flex items-center justify-between text-[11px] text-slate-400">
      <span>${c.source}</span>
      <span>Applied ${daysAgo(c.appliedDate)}d ago</span>
    </div>
    ${canAdvance ? `
    <button data-action="advance" data-id="${c.id}" data-next="${nextStage}"
      class="mt-2.5 w-full flex items-center justify-center gap-1 text-xs font-medium text-indigo-600 hover:bg-indigo-50 border border-indigo-100 rounded-md py-1.5 transition-colors">
      Move to ${stageMeta(nextStage).label}
      <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
    </button>` : ''}
  </div>`;
}

function renderBoard() {
  const filtered = getFiltered();
  const board = document.getElementById('board');
  board.innerHTML = STAGES.map(stage => {
    const items = filtered.filter(c => c.stage === stage.id);
    return `
    <div class="flex flex-col w-[290px] shrink-0 bg-slate-50 border border-slate-200 rounded-xl max-h-[calc(100vh-280px)]"
         data-column="${stage.id}">
      <div class="px-3 py-2.5 border-b rounded-t-xl flex items-center justify-between ${stage.header}">
        <div class="flex items-center gap-2">
          <span class="w-2 h-2 rounded-full ${stage.dot}"></span>
          <span class="text-sm font-semibold text-slate-700">${stage.label}</span>
        </div>
        <span class="text-xs font-semibold px-2 py-0.5 rounded-full ${stage.badge}">${items.length}</span>
      </div>
      <div class="flex-1 overflow-y-auto scrollbar-thin p-2.5 space-y-2.5 min-h-[120px]" data-dropzone="${stage.id}">
        ${items.length ? items.map(candidateCard).join('') : `<p class="text-xs text-slate-400 text-center py-6">No candidates</p>`}
      </div>
    </div>`;
  }).join('');
}

function renderResultsCount() {
  const filtered = getFiltered();
  const total = candidates.filter(c => c.jobId === state.jobId).length;
  document.getElementById('resultsCount').textContent =
    `Showing ${filtered.length} of ${total} candidate${total === 1 ? '' : 's'} for this opening`;
}

function renderAll() {
  renderJobMeta();
  renderStats();
  renderBoard();
  renderResultsCount();
}

/* ---------------------------------------------------------------------- */
/* Modal                                                                   */
/* ---------------------------------------------------------------------- */

function openModal(id) {
  const c = candidates.find(x => x.id === id);
  if (!c) return;
  const job = JOBS.find(j => j.id === c.jobId);
  const history = getStageHistory(c);

  document.getElementById('modalPanel').innerHTML = `
    <div class="p-5 border-b border-slate-100 flex items-start justify-between gap-3 sticky top-0 bg-white rounded-t-2xl">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-full flex items-center justify-center text-sm font-semibold ${avatarColor(c.name)}">${initials(c.name)}</div>
        <div>
          <h2 class="text-lg font-semibold text-slate-900">${c.name}</h2>
          <p class="text-sm text-slate-500">${c.currentTitle} · ${c.company}</p>
          <p class="text-xs text-slate-400 mt-0.5">Applying for ${job.title}</p>
        </div>
      </div>
      <button id="closeModal" class="text-slate-300 hover:text-slate-600">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18 18 6M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="p-5 space-y-5">
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 text-sm">
        <div><p class="text-xs text-slate-400">Email</p><p class="text-slate-700 truncate">${c.email}</p></div>
        <div><p class="text-xs text-slate-400">Phone</p><p class="text-slate-700">${c.phone}</p></div>
        <div><p class="text-xs text-slate-400">Location</p><p class="text-slate-700">${c.location}</p></div>
        <div><p class="text-xs text-slate-400">Experience</p><p class="text-slate-700">${c.experienceYears} yrs</p></div>
        <div><p class="text-xs text-slate-400">Source</p><p class="text-slate-700">${c.source}</p></div>
        <div><p class="text-xs text-slate-400">Applied</p><p class="text-slate-700">${fmtDate(c.appliedDate)}</p></div>
        <div><p class="text-xs text-slate-400">Salary Expectation</p><p class="text-slate-700">${c.salaryExpectation}</p></div>
        <div><p class="text-xs text-slate-400">Rating</p>${stars(c.rating)}</div>
      </div>

      <div>
        <p class="text-xs font-medium text-slate-400 mb-1.5">Skills</p>
        <div class="flex flex-wrap gap-1.5">
          ${c.skills.map(s => `<span class="px-2 py-1 rounded-md bg-indigo-50 text-indigo-600 text-xs font-medium">${s}</span>`).join('')}
        </div>
      </div>

      <div>
        <p class="text-xs font-medium text-slate-400 mb-2">Pipeline Progress</p>
        <div class="flex items-center">
          ${STAGE_ORDER.map((sid, i) => {
            const reached = history.some(h => h.stage === sid);
            const isCurrent = c.stage === sid;
            const isRejectedPast = c.stage === 'rejected' && STAGE_ORDER.indexOf(c.rejectedFrom) >= i;
            const active = reached || isRejectedPast;
            return `
            <div class="flex items-center ${i > 0 ? 'flex-1' : ''}">
              ${i > 0 ? `<div class="flex-1 h-0.5 ${active ? 'bg-indigo-400' : 'bg-slate-200'}"></div>` : ''}
              <div class="flex flex-col items-center gap-1 ${i > 0 ? 'ml-0' : ''}">
                <div class="w-3 h-3 rounded-full ${active ? (isCurrent ? 'bg-indigo-600 ring-4 ring-indigo-100' : 'bg-indigo-400') : 'bg-slate-200'}"></div>
                <span class="text-[10px] text-slate-400 whitespace-nowrap">${stageMeta(sid).label}</span>
              </div>
            </div>`;
          }).join('')}
        </div>
        ${c.stage === 'rejected' ? `<p class="text-xs text-rose-500 mt-3">Rejected after ${stageMeta(c.rejectedFrom).label} stage on ${fmtDate(history[history.length - 1].date)}</p>` : ''}
      </div>

      <div>
        <p class="text-xs font-medium text-slate-400 mb-1.5">Recruiter Notes</p>
        <p class="text-sm text-slate-600 bg-slate-50 border border-slate-100 rounded-lg p-3">${c.notes || 'No notes yet.'}</p>
      </div>

      <div>
        <p class="text-xs font-medium text-slate-400 mb-1.5">Move to Stage</p>
        <div class="flex flex-wrap gap-2">
          ${STAGES.map(s => `
            <button data-action="set-stage" data-id="${c.id}" data-stage="${s.id}"
              class="text-xs font-medium px-3 py-1.5 rounded-md border transition-colors ${c.stage === s.id ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white text-slate-600 border-slate-200 hover:border-indigo-300'}">
              ${s.label}
            </button>`).join('')}
        </div>
      </div>
    </div>
  `;
  document.getElementById('modalBackdrop').classList.remove('hidden');
}

function closeModal() {
  document.getElementById('modalBackdrop').classList.add('hidden');
}

/* ---------------------------------------------------------------------- */
/* Event wiring                                                           */
/* ---------------------------------------------------------------------- */

document.getElementById('jobSelect').addEventListener('change', e => {
  state.jobId = e.target.value;
  renderAll();
});
document.getElementById('searchInput').addEventListener('input', e => {
  state.query = e.target.value;
  renderBoard();
  renderResultsCount();
});
document.getElementById('sourceFilter').addEventListener('change', e => {
  state.source = e.target.value;
  renderBoard();
  renderResultsCount();
});
document.getElementById('ratingFilter').addEventListener('change', e => {
  state.minRating = Number(e.target.value);
  renderBoard();
  renderResultsCount();
});
document.getElementById('expFilter').addEventListener('change', e => {
  state.minExp = Number(e.target.value);
  renderBoard();
  renderResultsCount();
});
document.getElementById('clearFilters').addEventListener('click', () => {
  state.query = ''; state.source = 'all'; state.minRating = 0; state.minExp = 0;
  document.getElementById('searchInput').value = '';
  document.getElementById('sourceFilter').value = 'all';
  document.getElementById('ratingFilter').value = '0';
  document.getElementById('expFilter').value = '0';
  renderBoard();
  renderResultsCount();
});

document.getElementById('modalBackdrop').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});

// Delegated clicks on the board: open modal, advance stage, reject
document.getElementById('board').addEventListener('click', e => {
  const advanceBtn = e.target.closest('[data-action="advance"]');
  const rejectBtn = e.target.closest('[data-action="reject"]');
  if (advanceBtn) {
    e.stopPropagation();
    const c = candidates.find(x => x.id === advanceBtn.dataset.id);
    if (c) { c.stage = advanceBtn.dataset.next; renderAll(); }
    return;
  }
  if (rejectBtn) {
    e.stopPropagation();
    const c = candidates.find(x => x.id === rejectBtn.dataset.id);
    if (c) { c.rejectedFrom = c.stage === 'rejected' ? c.rejectedFrom : c.stage; c.stage = 'rejected'; renderAll(); }
    return;
  }
  const card = e.target.closest('[data-card-id]');
  if (card) openModal(card.dataset.cardId);
});

// Delegated click inside modal: close + set-stage buttons
document.getElementById('modalPanel').addEventListener('click', e => {
  if (e.target.closest('#closeModal')) { closeModal(); return; }
  const stageBtn = e.target.closest('[data-action="set-stage"]');
  if (stageBtn) {
    const c = candidates.find(x => x.id === stageBtn.dataset.id);
    if (c) {
      if (stageBtn.dataset.stage === 'rejected' && c.stage !== 'rejected') c.rejectedFrom = c.stage;
      c.stage = stageBtn.dataset.stage;
      renderAll();
      openModal(c.id);
    }
  }
});

// Drag and drop between columns
let draggingId = null;
document.getElementById('board').addEventListener('dragstart', e => {
  const card = e.target.closest('[data-card-id]');
  if (!card) return;
  draggingId = card.dataset.cardId;
  card.classList.add('card-dragging');
});
document.getElementById('board').addEventListener('dragend', e => {
  const card = e.target.closest('[data-card-id]');
  if (card) card.classList.remove('card-dragging');
  document.querySelectorAll('[data-dropzone]').forEach(z => z.closest('[data-column]').classList.remove('col-dragover'));
});
document.getElementById('board').addEventListener('dragover', e => {
  const zone = e.target.closest('[data-dropzone]');
  if (!zone) return;
  e.preventDefault();
  document.querySelectorAll('[data-column]').forEach(col => col.classList.remove('col-dragover'));
  zone.closest('[data-column]').classList.add('col-dragover');
});
document.getElementById('board').addEventListener('drop', e => {
  const zone = e.target.closest('[data-dropzone]');
  if (!zone || !draggingId) return;
  e.preventDefault();
  const c = candidates.find(x => x.id === draggingId);
  if (c) {
    const newStage = zone.dataset.dropzone;
    if (newStage === 'rejected' && c.stage !== 'rejected') c.rejectedFrom = c.stage;
    c.stage = newStage;
    draggingId = null;
    renderAll();
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

/* ---------------------------------------------------------------------- */
/* Init                                                                    */
/* ---------------------------------------------------------------------- */

renderJobSelect();
renderSourceOptions();
renderAll();

</script>
</body>
</html>
