<script>
(function () {
  'use strict';

  /* ---------------------------------------------------------------------
     Reference data
  --------------------------------------------------------------------- */

  var STATUS_META = {
    operational:    { label: 'Operational',            tone: 'success' },
    maintenance:    { label: 'Scheduled maintenance',  tone: 'info' },
    attention:      { label: 'Needs attention',        tone: 'warning' },
    down:           { label: 'Down',                   tone: 'danger' },
    decommissioned: { label: 'Decommissioned',         tone: 'neutral' }
  };
  var STATUS_ORDER = ['operational', 'maintenance', 'attention', 'down', 'decommissioned'];

  var TONE_CLASSES = {
    neutral: 'bg-slate-100 text-slate-700',
    info:    'bg-blue-50 text-blue-700',
    success: 'bg-emerald-50 text-emerald-700',
    warning: 'bg-amber-50 text-amber-800',
    danger:  'bg-red-50 text-red-700'
  };

  var TYPES = [
    { name: 'CNC Milling Machine',       code: 'CNC', category: 'Machining',          interval: 90 },
    { name: 'Lathe Machine',             code: 'LTH', category: 'Machining',          interval: 90 },
    { name: 'Drill Press',               code: 'DRL', category: 'Machining',          interval: 120 },
    { name: 'Band Saw',                  code: 'BSW', category: 'Machining',          interval: 120 },
    { name: 'Laser Cutter',              code: 'LSR', category: 'Machining',          interval: 90 },
    { name: 'Hydraulic Press',           code: 'HPR', category: 'Forming',            interval: 120 },
    { name: 'Injection Molding Machine', code: 'IMM', category: 'Forming',            interval: 90 },
    { name: 'Vacuum Forming Machine',    code: 'VFM', category: 'Forming',            interval: 120 },
    { name: 'Conveyor Belt System',      code: 'CNV', category: 'Material handling',  interval: 60 },
    { name: 'Forklift',                  code: 'FLT', category: 'Material handling',  interval: 60 },
    { name: 'Overhead Crane',            code: 'CRN', category: 'Material handling',  interval: 90 },
    { name: 'Palletizer Robot',          code: 'PAL', category: 'Material handling',  interval: 120 },
    { name: 'Industrial Robot Arm',      code: 'ROB', category: 'Robotics',           interval: 180 },
    { name: 'Air Compressor',            code: 'CMP', category: 'Utility',            interval: 120 },
    { name: 'Boiler Unit',               code: 'BLR', category: 'Utility',            interval: 180 },
    { name: 'HVAC Chiller Unit',         code: 'HVC', category: 'Utility',            interval: 180 },
    { name: 'Diesel Generator',          code: 'GEN', category: 'Utility',            interval: 180 },
    { name: 'Water Treatment Pump',      code: 'WTP', category: 'Utility',            interval: 90 },
    { name: 'Cooling Tower',             code: 'CLT', category: 'Utility',            interval: 180 },
    { name: 'Dust Collection System',    code: 'DST', category: 'Utility',            interval: 120 },
    { name: 'Welding Station',           code: 'WLD', category: 'Fabrication',        interval: 90 },
    { name: 'Paint Spray Booth',         code: 'PNT', category: 'Finishing',          interval: 120 },
    { name: 'Packaging Machine',         code: 'PKG', category: 'Packaging',          interval: 60 },
    { name: 'Shrink Wrap Machine',       code: 'SWM', category: 'Packaging',          interval: 60 }
  ];

  var LOCATIONS = ['Assembly Line A', 'Assembly Line B', 'Assembly Line C', 'Packaging Hall', 'Warehouse 1',
    'Warehouse 2', 'Boiler Room', 'Utility Yard', 'Paint Shop', 'Tool Room', 'Loading Dock', 'Machine Shop',
    'Maintenance Bay', 'Cold Storage', 'Quality Lab'];

  var MANUFACTURERS = ['Haas Automation', 'Siemens', 'ABB Robotics', 'Caterpillar', 'Atlas Copco',
    'Toyota Industries', 'Fanuc', 'Bosch Rexroth', 'Ingersoll Rand', 'Cummins', 'Lincoln Electric',
    'KUKA', 'Mitsubishi Electric', 'Trane', 'Grundfos'];

  var TECHNICIANS = ['James Carter', 'Maria Gonzalez', 'David Kim', 'Priya Patel', 'Robert Chen',
    'Linda Johnson', 'Omar Hassan', 'Sarah Williams', 'Michael Brown', 'Aisha Khan', 'Thomas Lee', 'Elena Rodriguez'];

  var CATEGORIES = ['Machining', 'Forming', 'Material handling', 'Robotics', 'Utility', 'Fabrication', 'Finishing', 'Packaging'];

  var STATUS_CYCLE = ['operational', 'operational', 'operational', 'operational', 'operational', 'operational',
    'maintenance', 'attention', 'operational', 'down', 'operational', 'decommissioned'];

  /* ---------------------------------------------------------------------
     Formatting helpers
  --------------------------------------------------------------------- */

  var dateFmt = new Intl.DateTimeFormat('en-US', { day: 'numeric', month: 'short', year: 'numeric' });

  function startOfDay(d) { var x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
  function addDays(d, days) { var x = new Date(d); x.setDate(x.getDate() + days); return x; }
  function isoDate(d) { return d.toISOString().slice(0, 10); }
  function formatDate(iso) {
    if (!iso) return null;
    return dateFmt.format(new Date(iso + 'T00:00:00'));
  }
  function today() { return startOfDay(new Date()); }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /* ---------------------------------------------------------------------
     Mock data
  --------------------------------------------------------------------- */

  var DATA = [];
  var nextSeq = 0;

  function buildRow(i) {
    var type = TYPES[i % TYPES.length];
    var location = LOCATIONS[(i * 3 + 2) % LOCATIONS.length];
    var manufacturer = MANUFACTURERS[(i * 5 + 1) % MANUFACTURERS.length];
    var technician = TECHNICIANS[i % TECHNICIANS.length];
    var status = STATUS_CYCLE[i % STATUS_CYCLE.length];
    var assetTag = type.code + '-' + (1000 + i);
    var lastOffset = 5 + ((i * 17) % 250);
    var lastService = addDays(today(), -lastOffset);
    var nextInspection = null;
    if (status !== 'decommissioned') {
      var jitter = ((i * 11) % 40) - 20;
      nextInspection = addDays(lastService, type.interval + jitter);
    }
    var histTechnician = TECHNICIANS[(i + 3) % TECHNICIANS.length];
    return {
      id: 'EQ-' + (2000 + i),
      assetTag: assetTag,
      name: type.name,
      category: type.category,
      location: location,
      manufacturer: manufacturer,
      technician: technician,
      status: status,
      lastService: isoDate(lastService),
      nextInspection: nextInspection ? isoDate(nextInspection) : null,
      serial: type.code + (100000 + i * 37),
      history: [
        { date: isoDate(lastService), note: 'Routine preventive maintenance completed', technician: technician },
        { date: isoDate(addDays(lastService, -type.interval)), note: 'Scheduled inspection passed', technician: histTechnician }
      ]
    };
  }

  function buildEquipment(count) {
    var rows = [];
    for (var i = 0; i < count; i++) rows.push(buildRow(i));
    nextSeq = count;
    return rows;
  }

  DATA = buildEquipment(48);

  /* ---------------------------------------------------------------------
     App state
  --------------------------------------------------------------------- */

  var urlState = new URLSearchParams(location.search).get('state');

  var state = {
    search: '',
    statusTab: 'all',
    locations: new Set(),
    categories: new Set(),
    manufacturers: new Set(),
    dateFrom: null,
    dateTo: null,
    sortKey: 'urgency',
    sortDir: 'asc',
    page: 1,
    pageSize: 25,
    density: 'comfortable',
    hiddenCols: new Set(),
    selected: new Set(),
    selectAllMatching: false,
    pageState: urlState === 'loading' || urlState === 'error' || urlState === 'empty' ? urlState : 'loading'
  };

  var COLS = [
    { key: 'category', label: 'Category' },
    { key: 'technician', label: 'Technician' }
  ];

  var lastFocusedTrigger = null;

  /* ---------------------------------------------------------------------
     Derived data
  --------------------------------------------------------------------- */

  function urgencyGroup(row) {
    if (!row.nextInspection) return 3;
    var diff = Math.round((new Date(row.nextInspection + 'T00:00:00') - today()) / 86400000);
    if (diff < 0) return 0;
    if (diff <= 14) return 1;
    return 2;
  }

  function urgencyText(row) {
    if (!row.nextInspection) return null;
    var diff = Math.round((new Date(row.nextInspection + 'T00:00:00') - today()) / 86400000);
    if (diff < 0) return { text: 'Overdue by ' + Math.abs(diff) + ' day' + (Math.abs(diff) === 1 ? '' : 's'), cls: 'text-red-600 font-medium' };
    if (diff === 0) return { text: 'Due today', cls: 'text-amber-700 font-medium' };
    if (diff <= 14) return { text: 'Due in ' + diff + ' day' + (diff === 1 ? '' : 's'), cls: 'text-amber-700 font-medium' };
    return null;
  }

  function matchesNonStatusFilters(r) {
    if (state.locations.size && !state.locations.has(r.location)) return false;
    if (state.categories.size && !state.categories.has(r.category)) return false;
    if (state.manufacturers.size && !state.manufacturers.has(r.manufacturer)) return false;
    if (state.dateFrom && !(r.nextInspection && r.nextInspection >= state.dateFrom)) return false;
    if (state.dateTo && !(r.nextInspection && r.nextInspection <= state.dateTo)) return false;
    var q = state.search.trim().toLowerCase();
    if (q) {
      var hay = [r.name, r.assetTag, r.id, r.location, r.technician, r.manufacturer].join(' ').toLowerCase();
      if (hay.indexOf(q) === -1) return false;
    }
    return true;
  }

  function tabCounts() {
    var base = DATA.filter(matchesNonStatusFilters);
    var counts = { all: base.length };
    STATUS_ORDER.forEach(function (s) { counts[s] = base.filter(function (r) { return r.status === s; }).length; });
    return counts;
  }

  function getFiltered() {
    var rows = DATA.filter(matchesNonStatusFilters);
    if (state.statusTab !== 'all') rows = rows.filter(function (r) { return r.status === state.statusTab; });
    return rows;
  }

  function getFilteredSorted() {
    var rows = getFiltered();
    rows.sort(function (a, b) {
      var cmp = 0;
      if (state.sortKey === 'urgency') {
        cmp = urgencyGroup(a) - urgencyGroup(b);
        if (cmp === 0) {
          var da = a.nextInspection || '9999-99-99', db = b.nextInspection || '9999-99-99';
          cmp = da < db ? -1 : da > db ? 1 : 0;
        }
      } else if (state.sortKey === 'name') {
        cmp = a.name.localeCompare(b.name);
      } else if (state.sortKey === 'location') {
        cmp = a.location.localeCompare(b.location);
      } else if (state.sortKey === 'status') {
        cmp = STATUS_META[a.status].label.localeCompare(STATUS_META[b.status].label);
      } else if (state.sortKey === 'lastService') {
        cmp = a.lastService < b.lastService ? -1 : a.lastService > b.lastService ? 1 : 0;
      } else if (state.sortKey === 'nextInspection') {
        var na = a.nextInspection || '9999-99-99', nb = b.nextInspection || '9999-99-99';
        cmp = na < nb ? -1 : na > nb ? 1 : 0;
      }
      if (state.sortDir === 'desc') cmp = -cmp;
      return cmp;
    });
    return rows;
  }

  function visibleColumnCount() {
    return 2 + (6 - state.hiddenCols.size); // select + name + status + location + lastService + nextInspection + (category/technician)
  }

  /* ---------------------------------------------------------------------
     Toast
  --------------------------------------------------------------------- */

  function toast(message) {
    var region = document.getElementById('toast-region');
    var el = document.createElement('div');
    el.className = 'flex items-center gap-2 rounded-md border border-slate-200 bg-white px-4 py-2.5 text-sm text-slate-900 shadow-lg';
    el.innerHTML = '<svg class="size-4 shrink-0 text-emerald-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>' + escapeHtml(message) + '</span>';
    region.appendChild(el);
    var timer = setTimeout(remove, 5000);
    el.addEventListener('mouseenter', function () { clearTimeout(timer); });
    el.addEventListener('mouseleave', function () { timer = setTimeout(remove, 2000); });
    function remove() { el.remove(); }
  }

  /* ---------------------------------------------------------------------
     Rendering: status tabs
  --------------------------------------------------------------------- */

  function renderTabs() {
    var counts = tabCounts();
    var tabs = [{ key: 'all', label: 'All' }].concat(STATUS_ORDER.map(function (s) { return { key: s, label: STATUS_META[s].label }; }));
    var html = tabs.map(function (t) {
      var active = state.statusTab === t.key;
      var cls = active
        ? 'border-blue-700 text-blue-700 font-medium'
        : 'border-transparent text-slate-600 hover:text-slate-900 hover:border-slate-300';
      return '<button type="button" data-tab="' + t.key + '" aria-current="' + (active ? 'true' : 'false') + '" ' +
        'class="whitespace-nowrap border-b-2 px-1 py-2.5 text-sm ' + cls + ' focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-700">' +
        escapeHtml(t.label) + ' <span class="tabular-nums text-slate-500">' + (counts[t.key] != null ? counts[t.key] : 0) + '</span></button>';
    }).join('');
    document.getElementById('status-tabs').innerHTML = html;
  }

  /* ---------------------------------------------------------------------
     Rendering: filter popovers
  --------------------------------------------------------------------- */

  function multiSelectPanel(panelId, setRef, options, labelSingular) {
    var panel = document.getElementById(panelId);
    var html = '<div class="max-h-64 overflow-y-auto"><ul class="space-y-0.5">';
    options.forEach(function (opt) {
      var checked = setRef.has(opt);
      var cid = panelId + '-' + opt.replace(/\s+/g, '-');
      html += '<li><label for="' + cid + '" class="flex items-center gap-2 rounded px-2 py-1.5 hover:bg-slate-50 cursor-pointer">' +
        '<input type="checkbox" id="' + cid + '" data-value="' + escapeHtml(opt) + '" ' + (checked ? 'checked' : '') +
        ' class="size-4 rounded border-slate-400 text-blue-700 focus:ring-blue-700">' +
        '<span class="text-sm text-slate-700">' + escapeHtml(opt) + '</span></label></li>';
    });
    html += '</ul></div><div class="mt-2 flex justify-end border-t border-slate-200 pt-2">' +
      '<button type="button" data-action="clear" class="text-sm font-medium text-blue-700 hover:underline">Clear</button></div>';
    panel.innerHTML = html;
  }

  function renderLocationPanel() { multiSelectPanel('panel-location', state.locations, LOCATIONS); }
  function renderCategoryPanel() { multiSelectPanel('panel-category', state.categories, CATEGORIES); }

  function renderMorePanel() {
    var panel = document.getElementById('panel-more');
    var manOptions = MANUFACTURERS.map(function (m) {
      var checked = state.manufacturers.has(m);
      var cid = 'man-' + m.replace(/\s+/g, '-');
      return '<li><label for="' + cid + '" class="flex items-center gap-2 rounded px-2 py-1 hover:bg-slate-50 cursor-pointer">' +
        '<input type="checkbox" id="' + cid + '" data-man="' + escapeHtml(m) + '" ' + (checked ? 'checked' : '') +
        ' class="size-4 rounded border-slate-400 text-blue-700 focus:ring-blue-700"><span class="text-sm text-slate-700">' + escapeHtml(m) + '</span></label></li>';
    }).join('');
    panel.innerHTML =
      '<p class="mb-1 text-xs font-medium text-slate-500">Manufacturer</p>' +
      '<ul class="mb-3 max-h-40 space-y-0.5 overflow-y-auto">' + manOptions + '</ul>' +
      '<p class="mb-1 text-xs font-medium text-slate-500">Next inspection date range</p>' +
      '<div class="flex items-center gap-2">' +
      '<label class="sr-only" for="more-date-from">From</label>' +
      '<input type="date" id="more-date-from" value="' + (state.dateFrom || '') + '" class="h-8 w-full rounded border border-slate-300 px-2 text-sm">' +
      '<span class="text-slate-400">&ndash;</span>' +
      '<label class="sr-only" for="more-date-to">To</label>' +
      '<input type="date" id="more-date-to" value="' + (state.dateTo || '') + '" class="h-8 w-full rounded border border-slate-300 px-2 text-sm">' +
      '</div>' +
      '<div class="mt-3 flex items-center justify-between border-t border-slate-200 pt-3">' +
      '<button type="button" id="more-reset" class="text-sm font-medium text-slate-600 hover:underline">Reset</button>' +
      '<button type="button" id="more-apply" class="inline-flex h-8 items-center rounded bg-blue-700 px-3 text-sm font-medium text-white hover:bg-blue-800">Apply</button>' +
      '</div>';
  }

  function renderColumnsPanel() {
    var panel = document.getElementById('panel-columns');
    var html = '<ul class="space-y-0.5">' + COLS.map(function (c) {
      var checked = !state.hiddenCols.has(c.key);
      return '<li><label class="flex items-center gap-2 rounded px-2 py-1.5 hover:bg-slate-50 cursor-pointer">' +
        '<input type="checkbox" data-col="' + c.key + '" ' + (checked ? 'checked' : '') +
        ' class="size-4 rounded border-slate-400 text-blue-700 focus:ring-blue-700"><span class="text-sm text-slate-700">' + c.label + '</span></label></li>';
    }).join('') + '</ul>';
    panel.innerHTML = html;
  }

  function closeAllPanels(except) {
    ['panel-location', 'panel-category', 'panel-more', 'panel-columns'].forEach(function (id) {
      if (id === except) return;
      var p = document.getElementById(id);
      p.hidden = true;
      var trigger = document.getElementById(id.replace('panel-', 'trigger-'));
      if (trigger) trigger.setAttribute('aria-expanded', 'false');
    });
  }

  function togglePanel(panelId, triggerId, renderFn) {
    var panel = document.getElementById(panelId);
    var trigger = document.getElementById(triggerId);
    var willOpen = panel.hidden;
    closeAllPanels(willOpen ? panelId : null);
    if (willOpen) {
      renderFn();
      panel.hidden = false;
      trigger.setAttribute('aria-expanded', 'true');
    } else {
      panel.hidden = true;
      trigger.setAttribute('aria-expanded', 'false');
    }
  }

  /* ---------------------------------------------------------------------
     Rendering: chips
  --------------------------------------------------------------------- */

  function updateTriggerLabels() {
    document.getElementById('trigger-location-label').textContent = state.locations.size ? 'Location (' + state.locations.size + ')' : 'Location';
    document.getElementById('trigger-category-label').textContent = state.categories.size ? 'Category (' + state.categories.size + ')' : 'Category';
    var moreCount = state.manufacturers.size + (state.dateFrom ? 1 : 0) + (state.dateTo ? 1 : 0);
    document.getElementById('trigger-more-label').textContent = moreCount ? 'More filters (' + moreCount + ')' : 'More filters';
    document.getElementById('trigger-columns-label').textContent = state.hiddenCols.size ? 'Columns (' + state.hiddenCols.size + ' hidden)' : 'Columns';
  }

  function chip(key, value, label) {
    return '<span class="inline-flex h-6 items-center gap-1 rounded-full border border-slate-300 bg-slate-50 pl-2 pr-1 text-xs font-medium leading-5 text-slate-700">' +
      escapeHtml(label) +
      '<button type="button" data-chip-key="' + key + '" data-chip-value="' + escapeHtml(value) + '" aria-label="Remove filter ' + escapeHtml(label) + '" ' +
      'class="inline-flex size-5 items-center justify-center rounded-full hover:bg-slate-200">' +
      '<svg class="size-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>' +
      '</button></span>';
  }

  function renderChips() {
    var chips = [];
    state.locations.forEach(function (v) { chips.push(chip('location', v, 'Location: ' + v)); });
    state.categories.forEach(function (v) { chips.push(chip('category', v, 'Category: ' + v)); });
    state.manufacturers.forEach(function (v) { chips.push(chip('manufacturer', v, 'Manufacturer: ' + v)); });
    if (state.dateFrom || state.dateTo) {
      var label = 'Next inspection: ' + (state.dateFrom ? formatDate(state.dateFrom) : '…') + ' – ' + (state.dateTo ? formatDate(state.dateTo) : '…');
      chips.push(chip('dateRange', 'range', label));
    }
    if (state.search.trim()) chips.push(chip('search', state.search, 'Search: ' + state.search.trim()));

    var row = document.getElementById('chips-row');
    if (!chips.length) { row.hidden = true; row.innerHTML = ''; return; }
    row.hidden = false;
    row.innerHTML = chips.join('') + '<button type="button" id="clear-all-chips" class="text-sm font-medium text-blue-700 hover:underline">Clear all</button>';
  }

  function clearAllFilters() {
    state.search = '';
    document.getElementById('search-input').value = '';
    document.getElementById('search-clear').hidden = true;
    state.locations = new Set();
    state.categories = new Set();
    state.manufacturers = new Set();
    state.dateFrom = null;
    state.dateTo = null;
    resetPageAndSelection();
    renderAll();
  }

  /* ---------------------------------------------------------------------
     Rendering: table head
  --------------------------------------------------------------------- */

  function sortButton(key, label, align) {
    var active = state.sortKey === key;
    var dir = active ? state.sortDir : null;
    var icon = active
      ? (dir === 'asc'
        ? '<svg class="size-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>'
        : '<svg class="size-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>')
      : '<svg class="size-3.5 opacity-0 group-hover:opacity-50 group-focus-visible:opacity-50" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
    var rowDir = align === 'right' ? 'flex-row-reverse' : '';
    return '<button type="button" data-sort="' + key + '" class="group inline-flex ' + rowDir + ' items-center gap-1 text-sm font-medium text-slate-700 hover:text-slate-900 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-700">' +
      escapeHtml(label) + icon + '</button>';
  }

  function renderHead() {
    var rowHeight = state.density === 'compact' ? 'h-8' : 'h-10';
    var pageIds = getFilteredSorted().slice((state.page - 1) * state.pageSize, (state.page - 1) * state.pageSize + state.pageSize).map(function (r) { return r.id; });
    var allSelected = pageIds.length > 0 && pageIds.every(function (id) { return state.selected.has(id); });
    var someSelected = !allSelected && pageIds.some(function (id) { return state.selected.has(id); });

    var html = '<tr class="' + rowHeight + '">';
    html += '<th scope="col" class="w-10 px-3"><input type="checkbox" id="select-all" aria-label="Select all equipment on this page" ' +
      (allSelected ? 'checked' : '') + ' class="size-4 rounded border-slate-400 text-blue-700 focus:ring-blue-700"></th>';
    html += '<th scope="col" class="px-3 text-left"' + (state.sortKey === 'name' ? ' aria-sort="' + (state.sortDir === 'asc' ? 'ascending' : 'descending') + '"' : '') + '>' + sortButton('name', 'Equipment') + '</th>';
    html += '<th scope="col" class="px-3 text-left"' + (state.sortKey === 'status' ? ' aria-sort="' + (state.sortDir === 'asc' ? 'ascending' : 'descending') + '"' : '') + '>' + sortButton('status', 'Status') + '</th>';
    html += '<th scope="col" class="px-3 text-left"' + (state.sortKey === 'location' ? ' aria-sort="' + (state.sortDir === 'asc' ? 'ascending' : 'descending') + '"' : '') + '>' + sortButton('location', 'Location') + '</th>';
    if (!state.hiddenCols.has('category')) html += '<th scope="col" class="px-3 text-left text-sm font-medium text-slate-700">Category</th>';
    html += '<th scope="col" class="px-3 text-left"' + (state.sortKey === 'lastService' ? ' aria-sort="' + (state.sortDir === 'asc' ? 'ascending' : 'descending') + '"' : '') + '>' + sortButton('lastService', 'Last service') + '</th>';
    html += '<th scope="col" class="px-3 text-left"' + (state.sortKey === 'nextInspection' || state.sortKey === 'urgency' ? ' aria-sort="' + (state.sortDir === 'asc' ? 'ascending' : 'descending') + '"' : '') + '>' + sortButton('nextInspection', 'Next inspection') + '</th>';
    if (!state.hiddenCols.has('technician')) html += '<th scope="col" class="px-3 text-left text-sm font-medium text-slate-700">Technician</th>';
    html += '</tr>';

    document.getElementById('table-head').innerHTML = html;
    var selectAllEl = document.getElementById('select-all');
    if (someSelected) selectAllEl.indeterminate = true;
  }

  /* ---------------------------------------------------------------------
     Rendering: table body
  --------------------------------------------------------------------- */

  function statusBadge(status) {
    var meta = STATUS_META[status];
    return '<span class="inline-flex h-6 items-center rounded-full px-2 text-xs font-medium leading-5 ' + TONE_CLASSES[meta.tone] + '">' + meta.label + '</span>';
  }

  function skeletonRows(n, cols) {
    var rowH = state.density === 'compact' ? 'h-8' : 'h-10';
    var row = '<tr class="' + rowH + '" aria-hidden="true">' +
      new Array(cols).fill(0).map(function () {
        return '<td class="px-3 py-0"><span class="block h-4 w-full max-w-[160px] animate-pulse rounded bg-slate-200"></span></td>';
      }).join('') + '</tr>';
    return new Array(n).fill(row).join('');
  }

  function renderBody() {
    var tbody = document.getElementById('table-body');
    var colCount = visibleColumnCount();

    if (state.pageState === 'loading') {
      tbody.setAttribute('aria-busy', 'true');
      tbody.innerHTML = skeletonRows(8, colCount);
      return;
    }
    tbody.setAttribute('aria-busy', 'false');

    if (state.pageState === 'error') {
      tbody.innerHTML = '<tr><td colspan="' + colCount + '" class="px-6 py-12 text-center">' +
        '<p class="text-sm font-medium text-slate-900">Couldn\'t load equipment</p>' +
        '<p class="mt-1 text-sm text-slate-500">Check your connection and try again.</p>' +
        '<button type="button" id="retry-load" class="mt-3 inline-flex h-8 items-center rounded border border-slate-300 bg-white px-3 text-sm font-medium text-slate-700 hover:bg-slate-50">Retry</button>' +
        '</td></tr>';
      return;
    }

    if (state.pageState === 'empty') {
      tbody.innerHTML = '<tr><td colspan="' + colCount + '" class="px-6 py-12 text-center">' +
        '<p class="text-sm font-medium text-slate-900">No equipment yet</p>' +
        '<p class="mx-auto mt-1 max-w-sm text-sm text-slate-500">Equipment added to the maintenance system appears here, with its location, status and service history.</p>' +
        '<button type="button" id="empty-add" class="mt-3 inline-flex h-8 items-center rounded bg-blue-700 px-3 text-sm font-medium text-white hover:bg-blue-800">Add equipment</button>' +
        '</td></tr>';
      return;
    }

    var rows = getFilteredSorted();
    var total = rows.length;
    var pageCount = Math.max(1, Math.ceil(total / state.pageSize));
    if (state.page > pageCount) state.page = pageCount;
    var start = (state.page - 1) * state.pageSize;
    var pageRows = rows.slice(start, start + state.pageSize);
    var rowH = state.density === 'compact' ? 'h-8' : 'h-10';

    if (!total) {
      tbody.innerHTML = '<tr><td colspan="' + colCount + '" class="px-6 py-12 text-center">' +
        '<p class="text-sm font-medium text-slate-900">No equipment match' + (state.search.trim() ? ' "' + escapeHtml(state.search.trim()) + '"' : ' these filters') + '</p>' +
        '<p class="mt-1 text-sm text-slate-500">Check the spelling or clear filters to see every machine.</p>' +
        '<button type="button" id="clear-filters-empty" class="mt-3 inline-flex h-8 items-center rounded border border-slate-300 bg-white px-3 text-sm font-medium text-slate-700 hover:bg-slate-50">Clear filters</button>' +
        '</td></tr>';
      return;
    }

    tbody.innerHTML = pageRows.map(function (r) {
      var selected = state.selected.has(r.id);
      var ut = urgencyText(r);
      var cells = '';
      cells += '<td class="px-3 py-0"><input type="checkbox" data-row-select="' + r.id + '" aria-label="Select equipment ' + escapeHtml(r.name) + ' (' + r.assetTag + ')" ' + (selected ? 'checked' : '') + ' class="size-4 rounded border-slate-400 text-blue-700 focus:ring-blue-700"></td>';
      cells += '<td class="px-3 py-0">' +
        '<button type="button" data-open-drawer="' + r.id + '" class="text-left font-medium text-blue-700 hover:underline focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-700">' + escapeHtml(r.name) + '</button>' +
        '<div class="text-xs text-slate-500">' + r.assetTag + '</div></td>';
      cells += '<td class="px-3 py-0">' + statusBadge(r.status) + '</td>';
      cells += '<td class="px-3 py-0 text-slate-700">' + escapeHtml(r.location) + '</td>';
      if (!state.hiddenCols.has('category')) cells += '<td class="px-3 py-0 text-slate-700">' + escapeHtml(r.category) + '</td>';
      cells += '<td class="px-3 py-0 tabular-nums text-slate-700">' + formatDate(r.lastService) + '</td>';
      cells += '<td class="px-3 py-0 tabular-nums text-slate-700">' +
        (r.nextInspection ? formatDate(r.nextInspection) : '<span class="text-slate-400">—</span>') +
        (ut ? ' <span class="' + ut.cls + '">· ' + ut.text + '</span>' : '') + '</td>';
      if (!state.hiddenCols.has('technician')) cells += '<td class="px-3 py-0 text-slate-700">' + escapeHtml(r.technician) + '</td>';
      return '<tr class="' + rowH + ' hover:bg-slate-50' + (selected ? ' bg-blue-50/60' : '') + '" data-row-id="' + r.id + '">' + cells + '</tr>';
    }).join('');

    document.getElementById('result-announcer').textContent = total + ' machine' + (total === 1 ? '' : 's') + ' match';
  }

  /* ---------------------------------------------------------------------
     Rendering: toolbar (summary line / bulk bar)
  --------------------------------------------------------------------- */

  function renderToolbar() {
    var el = document.getElementById('toolbar-row');
    if (state.pageState !== 'data') { el.innerHTML = ''; return; }

    if (state.selected.size > 0) {
      var rows = getFiltered();
      var total = rows.length;
      var count = state.selectAllMatching ? total : state.selected.size;
      var onPageIds = getFilteredSorted().slice((state.page - 1) * state.pageSize, (state.page - 1) * state.pageSize + state.pageSize).map(function (r) { return r.id; });
      var allOnPageSelected = onPageIds.length > 0 && onPageIds.every(function (id) { return state.selected.has(id); });
      var showSelectAllMatching = allOnPageSelected && !state.selectAllMatching && total > onPageIds.length;

      el.innerHTML =
        '<div class="flex w-full items-center gap-3 rounded-md border border-blue-200 bg-blue-50 px-3 py-1.5">' +
        '<span class="tabular-nums text-sm font-medium text-blue-900">' + (state.selectAllMatching ? 'All ' + total + ' matching selected' : count + ' selected') + '</span>' +
        (showSelectAllMatching ? '<button type="button" id="select-all-matching" class="text-sm font-medium text-blue-700 hover:underline">Select all ' + total + ' matching</button>' : '') +
        '<div class="ml-auto flex items-center gap-2">' +
        '<button type="button" id="bulk-inspect" class="inline-flex h-8 items-center rounded border border-slate-300 bg-white px-3 text-sm font-medium text-slate-700 hover:bg-slate-50">Mark as inspected</button>' +
        '<button type="button" id="bulk-export" class="inline-flex h-8 items-center rounded border border-slate-300 bg-white px-3 text-sm font-medium text-slate-700 hover:bg-slate-50">Export selected</button>' +
        '<button type="button" id="bulk-cancel" class="inline-flex h-8 items-center rounded px-3 text-sm font-medium text-slate-600 hover:bg-slate-100">Cancel</button>' +
        '</div></div>';
      return;
    }

    var all = getFiltered();
    var attention = all.filter(function (r) { return urgencyGroup(r) <= 1; }).length;
    el.innerHTML = '<p class="tabular-nums text-sm text-slate-600">' + all.length + ' machine' + (all.length === 1 ? '' : 's') +
      (attention ? ' · <span class="font-medium text-amber-700">' + attention + ' need' + (attention === 1 ? 's' : '') + ' attention</span>' : '') + '</p>';
  }

  /* ---------------------------------------------------------------------
     Rendering: pagination
  --------------------------------------------------------------------- */

  function renderPagination() {
    var el = document.getElementById('pagination-row');
    if (state.pageState !== 'data') { el.innerHTML = ''; return; }
    var total = getFiltered().length;
    if (!total) { el.innerHTML = ''; return; }
    var pageCount = Math.max(1, Math.ceil(total / state.pageSize));
    var start = (state.page - 1) * state.pageSize + 1;
    var end = Math.min(total, state.page * state.pageSize);

    el.innerHTML =
      '<p class="tabular-nums">' + start + '–' + end + ' of ' + total + '</p>' +
      '<div class="flex items-center gap-3">' +
      '<label class="flex items-center gap-1.5" for="page-size-select">Rows per page' +
      '<select id="page-size-select" class="h-8 rounded border border-slate-300 bg-white px-2 text-sm">' +
      [10, 25, 50].map(function (n) { return '<option value="' + n + '"' + (state.pageSize === n ? ' selected' : '') + '>' + n + '</option>'; }).join('') +
      '</select></label>' +
      '<div class="flex items-center gap-1">' +
      '<button type="button" id="page-prev" ' + (state.page <= 1 ? 'disabled' : '') + ' class="inline-flex h-8 items-center rounded border border-slate-300 bg-white px-2.5 text-sm font-medium text-slate-700 disabled:opacity-40 hover:bg-slate-50">Previous</button>' +
      '<span class="px-2 tabular-nums">Page ' + state.page + ' of ' + pageCount + '</span>' +
      '<button type="button" id="page-next" ' + (state.page >= pageCount ? 'disabled' : '') + ' class="inline-flex h-8 items-center rounded border border-slate-300 bg-white px-2.5 text-sm font-medium text-slate-700 disabled:opacity-40 hover:bg-slate-50">Next</button>' +
      '</div></div>';
  }

  /* ---------------------------------------------------------------------
     Master render
  --------------------------------------------------------------------- */

  function renderAll() {
    renderTabs();
    updateTriggerLabels();
    renderChips();
    renderToolbar();
    renderHead();
    renderBody();
    renderPagination();
  }

  function resetPageAndSelection() {
    state.page = 1;
    state.selected = new Set();
    state.selectAllMatching = false;
  }

  /* ---------------------------------------------------------------------
     Drawer (equipment detail)
  --------------------------------------------------------------------- */

  function openDrawer(id, triggerEl) {
    var r = DATA.find(function (x) { return x.id === id; });
    if (!r) return;
    lastFocusedTrigger = triggerEl || null;
    var ut = urgencyText(r);
    var historyHtml = r.history.map(function (h) {
      return '<li class="py-2.5"><p class="text-sm text-slate-900">' + escapeHtml(h.note) + '</p>' +
        '<p class="mt-0.5 text-xs text-slate-500 tabular-nums">' + formatDate(h.date) + ' · ' + escapeHtml(h.technician) + '</p></li>';
    }).join('');

    document.getElementById('drawer-content').innerHTML =
      '<div class="flex items-start justify-between gap-3 border-b border-slate-200 px-5 py-4">' +
      '<div><h2 id="drawer-title" class="text-base font-semibold text-slate-900">' + escapeHtml(r.name) + '</h2>' +
      '<p class="text-sm text-slate-500">' + r.assetTag + ' · ' + r.id + '</p></div>' +
      '<button type="button" id="drawer-close" aria-label="Close equipment details" class="flex size-7 shrink-0 items-center justify-center rounded hover:bg-slate-100 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-700">' +
      '<svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>' +
      '<div class="flex-1 overflow-y-auto px-5 py-4">' +
      '<div class="mb-4">' + statusBadge(r.status) + '</div>' +
      '<dl class="grid grid-cols-2 gap-x-4 gap-y-3 text-sm">' +
      '<div><dt class="text-slate-500">Location</dt><dd class="font-medium text-slate-900">' + escapeHtml(r.location) + '</dd></div>' +
      '<div><dt class="text-slate-500">Category</dt><dd class="font-medium text-slate-900">' + escapeHtml(r.category) + '</dd></div>' +
      '<div><dt class="text-slate-500">Manufacturer</dt><dd class="font-medium text-slate-900">' + escapeHtml(r.manufacturer) + '</dd></div>' +
      '<div><dt class="text-slate-500">Serial number</dt><dd class="font-medium text-slate-900">' + r.serial + '</dd></div>' +
      '<div><dt class="text-slate-500">Last service</dt><dd class="font-medium text-slate-900 tabular-nums">' + formatDate(r.lastService) + '</dd></div>' +
      '<div><dt class="text-slate-500">Next inspection</dt><dd class="font-medium text-slate-900 tabular-nums">' + (r.nextInspection ? formatDate(r.nextInspection) : '—') + (ut ? ' <span class="' + ut.cls + '">(' + ut.text + ')</span>' : '') + '</dd></div>' +
      '<div class="col-span-2"><dt class="text-slate-500">Assigned technician</dt><dd class="font-medium text-slate-900">' + escapeHtml(r.technician) + '</dd></div>' +
      '</dl>' +
      '<p class="mt-4 text-xs text-slate-500">Last changed by ' + escapeHtml(r.technician) + ' on ' + formatDate(r.lastService) + '</p>' +
      '<div class="mt-6">' +
      '<h3 class="text-sm font-semibold text-slate-900">Maintenance history</h3>' +
      '<ul class="mt-1 divide-y divide-slate-200">' + historyHtml + '</ul>' +
      '</div></div>';

    document.getElementById('drawer-backdrop').hidden = false;
    document.getElementById('drawer').hidden = false;
    document.getElementById('drawer-close').focus();
  }

  function closeDrawer() {
    document.getElementById('drawer-backdrop').hidden = true;
    document.getElementById('drawer').hidden = true;
    if (lastFocusedTrigger) lastFocusedTrigger.focus();
  }

  /* ---------------------------------------------------------------------
     Add equipment modal
  --------------------------------------------------------------------- */

  var addModalOpenerEl = null;

  function fieldRow(id, label, required, inputHtml) {
    return '<div>' +
      '<label for="' + id + '" class="block text-sm font-medium text-slate-900">' + label + (required ? ' <span class="text-red-600">*</span>' : '') + '</label>' +
      inputHtml +
      '<p id="' + id + '-error" class="mt-1 hidden text-sm text-red-600"></p>' +
      '</div>';
  }

  function selectOptions(opts, placeholder) {
    return '<option value="">' + placeholder + '</option>' + opts.map(function (o) { return '<option value="' + escapeHtml(o) + '">' + escapeHtml(o) + '</option>'; }).join('');
  }

  function renderAddForm() {
    var html = '';
    html += fieldRow('f-name', 'Equipment name', true,
      '<input id="f-name" name="name" type="text" class="mt-1 h-8 w-full rounded border border-slate-400 px-2.5 text-sm focus:border-blue-700 focus:outline focus:outline-2 focus:outline-blue-700" placeholder="e.g. CNC Milling Machine">');
    html += fieldRow('f-location', 'Location', true,
      '<select id="f-location" name="location" class="mt-1 h-8 w-full rounded border border-slate-400 bg-white px-2.5 text-sm focus:border-blue-700 focus:outline focus:outline-2 focus:outline-blue-700">' + selectOptions(LOCATIONS, 'Select a location') + '</select>');
    html += fieldRow('f-category', 'Category', true,
      '<select id="f-category" name="category" class="mt-1 h-8 w-full rounded border border-slate-400 bg-white px-2.5 text-sm focus:border-blue-700 focus:outline focus:outline-2 focus:outline-blue-700">' + selectOptions(CATEGORIES, 'Select a category') + '</select>');
    html += fieldRow('f-status', 'Status', true,
      '<select id="f-status" name="status" class="mt-1 h-8 w-full rounded border border-slate-400 bg-white px-2.5 text-sm focus:border-blue-700 focus:outline focus:outline-2 focus:outline-blue-700">' +
      STATUS_ORDER.map(function (s) { return '<option value="' + s + '"' + (s === 'operational' ? ' selected' : '') + '>' + STATUS_META[s].label + '</option>'; }).join('') + '</select>');
    html += fieldRow('f-last-service', 'Last service date', true,
      '<input id="f-last-service" name="lastService" type="date" class="mt-1 h-8 w-full rounded border border-slate-400 px-2.5 text-sm focus:border-blue-700 focus:outline focus:outline-2 focus:outline-blue-700">');
    html += fieldRow('f-next-inspection', 'Next inspection date', true,
      '<input id="f-next-inspection" name="nextInspection" type="date" class="mt-1 h-8 w-full rounded border border-slate-400 px-2.5 text-sm focus:border-blue-700 focus:outline focus:outline-2 focus:outline-blue-700">');
    html += fieldRow('f-technician', 'Assigned technician', true,
      '<select id="f-technician" name="technician" class="mt-1 h-8 w-full rounded border border-slate-400 bg-white px-2.5 text-sm focus:border-blue-700 focus:outline focus:outline-2 focus:outline-blue-700">' + selectOptions(TECHNICIANS, 'Select a technician') + '</select>');
    document.getElementById('add-form-fields').innerHTML = html;
  }

  function openAddModal(triggerEl) {
    addModalOpenerEl = triggerEl || null;
    renderAddForm();
    document.getElementById('add-form-errors').hidden = true;
    document.getElementById('modal-backdrop').hidden = false;
    document.getElementById('add-modal').hidden = false;
    document.getElementById('f-name').focus();
  }

  function closeAddModal() {
    document.getElementById('modal-backdrop').hidden = true;
    document.getElementById('add-modal').hidden = true;
    if (addModalOpenerEl) addModalOpenerEl.focus();
  }

  function validateAddForm(form) {
    var errors = [];
    var fields = ['name', 'location', 'category', 'status', 'lastService', 'nextInspection', 'technician'];
    var labels = { name: 'Equipment name', location: 'Location', category: 'Category', status: 'Status', lastService: 'Last service date', nextInspection: 'Next inspection date', technician: 'Assigned technician' };
    fields.forEach(function (name) {
      var el = form.elements.namedItem(name);
      var errorEl = document.getElementById('f-' + (name === 'lastService' ? 'last-service' : name === 'nextInspection' ? 'next-inspection' : name) + '-error');
      var value = el.value.trim();
      if (!value) {
        errors.push({ field: name, el: el, message: labels[name] + ' is required.' });
        errorEl.textContent = labels[name] + ' is required.';
        errorEl.hidden = false;
        el.classList.add('border-red-500');
      } else {
        errorEl.hidden = true;
        el.classList.remove('border-red-500');
      }
    });
    return errors;
  }

  function submitAddForm(e) {
    e.preventDefault();
    var form = e.target;
    var errors = validateAddForm(form);
    var errorBox = document.getElementById('add-form-errors');
    var errorList = document.getElementById('add-form-error-list');
    if (errors.length >= 3) {
      errorList.innerHTML = errors.map(function (er) { return '<li>' + escapeHtml(er.message) + '</li>'; }).join('');
      errorBox.hidden = false;
    } else {
      errorBox.hidden = true;
    }
    if (errors.length) {
      errors[0].el.focus();
      return;
    }

    var saveBtn = document.getElementById('add-save');
    var spinner = document.getElementById('add-save-spinner');
    saveBtn.disabled = true;
    spinner.hidden = false;

    var values = {
      name: form.elements.namedItem('name').value.trim(),
      location: form.elements.namedItem('location').value,
      category: form.elements.namedItem('category').value,
      status: form.elements.namedItem('status').value,
      lastService: form.elements.namedItem('lastService').value,
      nextInspection: form.elements.namedItem('nextInspection').value,
      technician: form.elements.namedItem('technician').value
    };

    setTimeout(function () {
      var type = TYPES.find(function (t) { return values.category === t.category; }) || TYPES[0];
      var newRow = {
        id: 'EQ-' + (2000 + nextSeq),
        assetTag: type.code + '-' + (1000 + nextSeq),
        name: values.name,
        category: values.category,
        location: values.location,
        manufacturer: MANUFACTURERS[nextSeq % MANUFACTURERS.length],
        technician: values.technician,
        status: values.status,
        lastService: values.lastService,
        nextInspection: values.nextInspection || null,
        serial: type.code + (900000 + nextSeq),
        history: [{ date: values.lastService, note: 'Equipment registered in the maintenance system', technician: values.technician }]
      };
      nextSeq += 1;
      DATA.unshift(newRow);
      saveBtn.disabled = false;
      spinner.hidden = true;
      closeAddModal();
      toast('Equipment "' + values.name + '" added');
      if (state.pageState === 'empty') state.pageState = 'data';
      resetPageAndSelection();
      renderAll();
    }, 500);
  }

  /* ---------------------------------------------------------------------
     CSV export
  --------------------------------------------------------------------- */

  function exportRows(rows, filename) {
    var header = ['Asset tag', 'Name', 'Category', 'Location', 'Manufacturer', 'Status', 'Last service', 'Next inspection', 'Technician'];
    var lines = [header.join(',')];
    rows.forEach(function (r) {
      var line = [r.assetTag, r.name, r.category, r.location, r.manufacturer, STATUS_META[r.status].label,
        r.lastService || '', r.nextInspection || '', r.technician]
        .map(function (v) { return '"' + String(v).replace(/"/g, '""') + '"'; }).join(',');
      lines.push(line);
    });
    var blob = new Blob([lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  /* ---------------------------------------------------------------------
     Event wiring
  --------------------------------------------------------------------- */

  document.addEventListener('click', function (e) {
    var target = e.target;

    // Status tabs
    var tabBtn = target.closest('[data-tab]');
    if (tabBtn) {
      state.statusTab = tabBtn.getAttribute('data-tab');
      resetPageAndSelection();
      renderAll();
      return;
    }

    // Filter popover triggers
    if (target.closest('#trigger-location')) { togglePanel('panel-location', 'trigger-location', renderLocationPanel); return; }
    if (target.closest('#trigger-category')) { togglePanel('panel-category', 'trigger-category', renderCategoryPanel); return; }
    if (target.closest('#trigger-more')) { togglePanel('panel-more', 'trigger-more', renderMorePanel); return; }
    if (target.closest('#trigger-columns')) { togglePanel('panel-columns', 'trigger-columns', renderColumnsPanel); return; }

    // Clicks outside any open panel close it
    if (!target.closest('[id^="panel-"]') && !target.closest('[id^="trigger-"]')) closeAllPanels(null);

    // Location / category checkbox toggles
    var locCheckbox = target.closest('#panel-location input[type="checkbox"]');
    if (locCheckbox) {
      var lv = locCheckbox.getAttribute('data-value');
      if (locCheckbox.checked) state.locations.add(lv); else state.locations.delete(lv);
      resetPageAndSelection();
      renderAll();
      renderLocationPanel();
      document.getElementById('panel-location').hidden = false;
      return;
    }
    var catCheckbox = target.closest('#panel-category input[type="checkbox"]');
    if (catCheckbox) {
      var cv = catCheckbox.getAttribute('data-value');
      if (catCheckbox.checked) state.categories.add(cv); else state.categories.delete(cv);
      resetPageAndSelection();
      renderAll();
      return;
    }

    // Location / category "Clear"
    if (target.closest('#panel-location [data-action="clear"]')) { state.locations = new Set(); resetPageAndSelection(); renderAll(); renderLocationPanel(); return; }
    if (target.closest('#panel-category [data-action="clear"]')) { state.categories = new Set(); resetPageAndSelection(); renderAll(); renderCategoryPanel(); return; }

    // More filters
    if (target.closest('#more-apply')) {
      var manBoxes = document.querySelectorAll('#panel-more input[data-man]');
      state.manufacturers = new Set();
      manBoxes.forEach(function (b) { if (b.checked) state.manufacturers.add(b.getAttribute('data-man')); });
      state.dateFrom = document.getElementById('more-date-from').value || null;
      state.dateTo = document.getElementById('more-date-to').value || null;
      resetPageAndSelection();
      renderAll();
      closeAllPanels(null);
      document.getElementById('trigger-more').focus();
      return;
    }
    if (target.closest('#more-reset')) {
      document.querySelectorAll('#panel-more input[data-man]').forEach(function (b) { b.checked = false; });
      document.getElementById('more-date-from').value = '';
      document.getElementById('more-date-to').value = '';
      return;
    }

    // Columns toggles
    var colCheckbox = target.closest('#panel-columns input[data-col]');
    if (colCheckbox) {
      var ck = colCheckbox.getAttribute('data-col');
      if (colCheckbox.checked) state.hiddenCols.delete(ck); else state.hiddenCols.add(ck);
      renderAll();
      renderColumnsPanel();
      document.getElementById('panel-columns').hidden = false;
      return;
    }

    // Density toggle
    if (target.closest('#density-comfortable')) {
      state.density = 'comfortable';
      document.getElementById('density-comfortable').setAttribute('aria-pressed', 'true');
      document.getElementById('density-compact').setAttribute('aria-pressed', 'false');
      renderAll();
      return;
    }
    if (target.closest('#density-compact')) {
      state.density = 'compact';
      document.getElementById('density-comfortable').setAttribute('aria-pressed', 'false');
      document.getElementById('density-compact').setAttribute('aria-pressed', 'true');
      renderAll();
      return;
    }

    // Chips
    var chipRemove = target.closest('[data-chip-key]');
    if (chipRemove) {
      var key = chipRemove.getAttribute('data-chip-key');
      var value = chipRemove.getAttribute('data-chip-value');
      if (key === 'location') state.locations.delete(value);
      else if (key === 'category') state.categories.delete(value);
      else if (key === 'manufacturer') state.manufacturers.delete(value);
      else if (key === 'dateRange') { state.dateFrom = null; state.dateTo = null; }
      else if (key === 'search') { state.search = ''; document.getElementById('search-input').value = ''; document.getElementById('search-clear').hidden = true; }
      resetPageAndSelection();
      renderAll();
      return;
    }
    if (target.closest('#clear-all-chips')) { clearAllFilters(); return; }
    if (target.closest('#clear-filters-empty')) { clearAllFilters(); return; }

    // Sorting
    var sortBtn = target.closest('[data-sort]');
    if (sortBtn) {
      var sk = sortBtn.getAttribute('data-sort');
      if (state.sortKey !== sk) { state.sortKey = sk; state.sortDir = 'asc'; }
      else if (state.sortDir === 'asc') { state.sortDir = 'desc'; }
      else { state.sortKey = 'urgency'; state.sortDir = 'asc'; }
      renderHead();
      renderBody();
      return;
    }

    // Row selection
    var rowCheckbox = target.closest('[data-row-select]');
    if (rowCheckbox) {
      var rid = rowCheckbox.getAttribute('data-row-select');
      if (rowCheckbox.checked) state.selected.add(rid); else { state.selected.delete(rid); state.selectAllMatching = false; }
      renderToolbar();
      renderHead();
      renderBody();
      return;
    }
    if (target.closest('#select-all')) {
      var pageIds = getFilteredSorted().slice((state.page - 1) * state.pageSize, (state.page - 1) * state.pageSize + state.pageSize).map(function (r) { return r.id; });
      var allSel = pageIds.every(function (id) { return state.selected.has(id); });
      if (allSel) { pageIds.forEach(function (id) { state.selected.delete(id); }); state.selectAllMatching = false; }
      else { pageIds.forEach(function (id) { state.selected.add(id); }); }
      renderToolbar();
      renderHead();
      renderBody();
      return;
    }
    if (target.closest('#select-all-matching')) {
      getFiltered().forEach(function (r) { state.selected.add(r.id); });
      state.selectAllMatching = true;
      renderToolbar();
      renderHead();
      renderBody();
      return;
    }
    if (target.closest('#bulk-cancel')) {
      resetPageAndSelection();
      renderToolbar();
      renderHead();
      renderBody();
      document.getElementById('select-all').focus();
      return;
    }
    if (target.closest('#bulk-export')) {
      var selRows = state.selectAllMatching ? getFiltered() : DATA.filter(function (r) { return state.selected.has(r.id); });
      exportRows(selRows, 'equipment-selected.csv');
      toast('Exported ' + selRows.length + ' machine' + (selRows.length === 1 ? '' : 's'));
      return;
    }
    if (target.closest('#bulk-inspect')) {
      var ids = state.selectAllMatching ? getFiltered().map(function (r) { return r.id; }) : Array.from(state.selected);
      var todayIso = isoDate(today());
      var n = 0;
      DATA.forEach(function (r) {
        if (ids.indexOf(r.id) !== -1 && r.status !== 'decommissioned') {
          var type = TYPES.find(function (t) { return t.category === r.category; }) || { interval: 90 };
          r.lastService = todayIso;
          r.nextInspection = isoDate(addDays(today(), type.interval));
          if (r.status === 'attention' || r.status === 'down') r.status = 'operational';
          r.history.unshift({ date: todayIso, note: 'Inspection completed and logged', technician: r.technician });
          n++;
        }
      });
      resetPageAndSelection();
      renderAll();
      toast(n + ' machine' + (n === 1 ? '' : 's') + ' marked as inspected');
      return;
    }

    // Open drawer
    var openBtn = target.closest('[data-open-drawer]');
    if (openBtn) { openDrawer(openBtn.getAttribute('data-open-drawer'), openBtn); return; }
    if (target.closest('#drawer-close') || target.closest('#drawer-backdrop')) { closeDrawer(); return; }

    // Add equipment modal
    if (target.closest('#btn-add') || target.closest('#empty-add')) { openAddModal(target.closest('#btn-add') || target.closest('#empty-add')); return; }
    if (target.closest('#add-modal-close') || target.closest('#add-cancel') || target.closest('#modal-backdrop')) { closeAddModal(); return; }

    // Header export (current filtered view)
    if (target.closest('#btn-export')) {
      var exportRowsAll = getFilteredSorted();
      exportRows(exportRowsAll, 'equipment-list.csv');
      toast('Exported ' + exportRowsAll.length + ' machine' + (exportRowsAll.length === 1 ? '' : 's'));
      return;
    }

    // Pagination
    if (target.closest('#page-prev')) { state.page = Math.max(1, state.page - 1); renderBody(); renderPagination(); renderHead(); return; }
    if (target.closest('#page-next')) { state.page = state.page + 1; renderBody(); renderPagination(); renderHead(); return; }

    // Retry on error
    if (target.closest('#retry-load')) {
      state.pageState = 'data';
      renderAll();
      return;
    }
  });

  document.addEventListener('change', function (e) {
    if (e.target.id === 'page-size-select') {
      state.pageSize = Number(e.target.value);
      resetPageAndSelection();
      renderAll();
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if (!document.getElementById('drawer').hidden) closeDrawer();
      else if (!document.getElementById('add-modal').hidden) closeAddModal();
      else closeAllPanels(null);
    }
  });

  var searchTimer = null;
  document.getElementById('search-input').addEventListener('input', function (e) {
    var val = e.target.value;
    document.getElementById('search-clear').hidden = !val;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function () {
      state.search = val;
      resetPageAndSelection();
      renderAll();
    }, 300);
  });
  document.getElementById('search-clear').addEventListener('click', function () {
    document.getElementById('search-input').value = '';
    document.getElementById('search-clear').hidden = true;
    state.search = '';
    resetPageAndSelection();
    renderAll();
  });

  document.getElementById('add-form').addEventListener('submit', submitAddForm);

  /* ---------------------------------------------------------------------
     Boot
  --------------------------------------------------------------------- */

  renderAll();
  if (state.pageState === 'loading') {
    setTimeout(function () {
      state.pageState = 'data';
      renderAll();
    }, 550);
  }

})();
</script>
</body>
</html>
