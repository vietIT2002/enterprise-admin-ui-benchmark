/* ---------- CSV parsing ---------- */
function detectDelim(text) {
  const line = text.replace(/^﻿/, '').split(/\r?\n/)[0] || '';
  let inQ = false; const c = { ',': 0, ';': 0, '\t': 0 };
  for (const ch of line) { if (ch === '"') inQ = !inQ; else if (!inQ && ch in c) c[ch]++; }
  const best = Object.entries(c).sort((a, b) => b[1] - a[1])[0];
  return best[1] ? best[0] : ',';
}
function parseCsv(text, d) {
  text = text.replace(/^﻿/, '');
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += ch; }
    else if (ch === '"') q = true;
    else if (ch === d) { row.push(f); f = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(f); f = ''; rows.push(row); row = []; }
    else f += ch;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  return rows.filter((r) => r.some((c) => c.trim() !== ''));
}
const DELIM_NAME = { ',': 'Comma', ';': 'Semicolon', '\t': 'Tab' };
/* vi-VN numbers: "." thousands, "," decimals. Returns NaN when it is not a number. */
function parseVi(s) {
  s = String(s).replace(/[\s₫đ]|VND/gi, '');
  if (!s) return NaN;
  if (/^-?\d+$/.test(s)) return Number(s);
  if (/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) return Number(s.replace(/\./g, '').replace(',', '.'));
  if (/^-?\d+,\d+$/.test(s)) return Number(s.replace(',', '.'));
  if (/^-?\d+\.\d{1,2}$/.test(s)) return Number(s);
  return NaN;
}

}

function mapIssues() {
  const dup = {}; const used = {};
  S.mapping.forEach((k, i) => { if (!k) return; if (used[k] !== undefined) dup[i] = used[k]; else used[k] = i; });
  const missing = FIELDS.filter((f) => f.req && used[f.key] === undefined);
  return { dup, used, missing };
}

/* ---------- Validation (same rules as the product form) ---------- */
function validate() {
  const { used } = mapIssues();
  const idx = (k) => used[k] === undefined ? -1 : used[k];
  const cat = catalog();
  const get = (r, k) => { const i = idx(k); return i < 0 ? '' : String(r[i] ?? '').trim(); };
  const rows = S.data.map((raw, i) => ({ n: i + 2, raw, errors: [], rec: {}, num: {} }));
  const seen = {};
  rows.forEach((r) => {
    const rec = {}; FIELDS.forEach((f) => { rec[f.key] = get(r.raw, f.key); }); r.rec = rec;
    const err = (f, kind, msg) => r.errors.push({ f, kind, msg });
    if (!rec.sku) err('sku', 'Missing required value', 'SKU is required');
    else if (!/^[A-Z0-9][A-Z0-9-]{2,19}$/.test(rec.sku)) err('sku', 'Invalid format', `SKU '${rec.sku}' can only have capital letters, digits and hyphens`);
    if (!rec.name) err('name', 'Missing required value', 'Product name is required');
    else if (rec.name.length > 120) err('name', 'Invalid format', 'Product name is longer than 120 characters');
    if (rec.category && !CATS.includes(rec.category)) err('category', 'Unknown category or unit', `Category '${rec.category}' does not exist`);
    if (!rec.unit) err('unit', 'Missing required value', 'Unit is required');
    else if (!UNITS.includes(rec.unit)) err('unit', 'Unknown category or unit', `Unit '${rec.unit}' is not valid`);
    [['price', true], ['cost', false], ['stock', false], ['reorder', false]].forEach(([k, req]) => {
      const v = rec[k];
      if (!v) { if (req) err(k, 'Missing required value', `${F[k].label} is required`); return; }
      const n = parseVi(v);
      if (Number.isNaN(n)) err(k, 'Invalid number', `${F[k].label} '${v}' is not a number`);
      else if (n < 0) err(k, 'Invalid number', `${F[k].label} cannot be negative`);
      else if ((k === 'stock' || k === 'reorder') && !Number.isInteger(n)) err(k, 'Invalid number', `${F[k].label} must be a whole number`);
      else r.num[k] = n;
    });
    if (r.num.cost != null && r.num.price != null && r.num.cost > r.num.price) err('cost', 'Invalid number', 'Cost price is higher than sale price');
    if (rec.barcode && !/^(\d{8}|\d{13})$/.test(rec.barcode)) err('barcode', 'Invalid format', `Barcode '${rec.barcode}' must be 8 or 13 digits`);
    if (rec.sku) (seen[rec.sku] = seen[rec.sku] || []).push(r);
  });
  Object.entries(seen).forEach(([sku, list]) => {
    if (list.length > 1) list.forEach((r) => { const other = list.find((x) => x !== r); r.errors.push({ f: 'sku', kind: 'Duplicate SKU', msg: `SKU ${sku} also appears in row ${other.n}` }); });
  });
  rows.forEach((r) => { r.exists = !!r.rec.sku && cat.has(r.rec.sku); });
  const kinds = {};
  rows.forEach((r) => { new Set(r.errors.map((e) => e.kind)).forEach((k) => { kinds[k] = (kinds[k] || 0) + 1; }); });
  return { rows, kinds };
}
const outcome = (r) => {
  if (r.errors.length) return 'error';
  const o = S.option;
  if (r.exists) return o === 'create' ? 'skip' : 'update';
  return o === 'update' ? 'skip' : 'create';
};
function tally() {
  const t = { create: 0, update: 0, skip: 0, error: 0, valid: 0, isNew: 0, isExisting: 0 };
  S.V.rows.forEach((r) => { const o = outcome(r); t[o]++; if (o !== 'error') { t.valid++; r.exists ? t.isExisting++ : t.isNew++; } });
  t.act = t.create + t.update;
  return t;
}

function resultLine() {

/* ---------- Page render ---------- */
function bar() {

  const left = dirty() ? `<span class="flex items-center gap-1 text-slate-700"><span class="h-2 w-2 rounded-full bg-amber-500" aria-hidden="true"></span>Unsaved changes: nothing is imported until you confirm</span>` : '<span></span>';

  const fid = document.activeElement && document.activeElement.id;

  else panel = [stepUpload, stepMap, stepReview, stepImport][S.step]();

    <div class="mb-4 flex flex-wrap items-center justify-between gap-2"><h1 class="text-xl font-semibold">Import products</h1>${S.file && S.step < 3 ? `<p class="text-slate-600">File: ${esc(S.file.name)}</p>` : ''}</div>

}

/* ---------- File handling ---------- */
function fileError(msg) { S.uploadError = msg; S.focus = '#upload-error'; render(); }
function acceptText(name, size, text, hadReplacement) {
  if (hadReplacement || text.includes('�')) return fileError("This file isn't UTF-8, so Vietnamese letters can't be read. In Excel, save it as CSV UTF-8 (comma delimited) and upload it again.");
  const d = detectDelim(text);
  const rows = parseCsv(text, d);
  if (rows.length < 2) return fileError('This file has no data rows. Add at least one product under the header row.');
  if (rows.length - 1 > LIMITS.rows) return fileError(`This file has ${fmtNum(rows.length - 1)} rows. The limit is ${fmtNum(LIMITS.rows)}. Split it into smaller files.`);
  S = { ...fresh(), file: { name, size, text }, delim: d };
  S.headers = rows[0]; S.data = rows.slice(1);
  const mem = loadRemembered();
  S.mapping = mem || autoMap(S.headers); S.remembered = !!mem;
  S.step = 0;
  render();
  toast(`${name} loaded: ${fmtNum(S.data.length)} rows`, 'info');
}
function reparse(mode) {
  S.delimMode = mode;
  S.delim = mode === 'auto' ? detectDelim(S.file.text) : mode;
  const rows = parseCsv(S.file.text, S.delim);
  S.headers = rows[0] || []; S.data = rows.slice(1);
  S.mapping = autoMap(S.headers); S.remembered = false; S.triedNext = false;
}
async function handleFile(file) {
  if (!file) return;
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  if (ext === 'xlsx' || ext === 'xls') return fileError('Excel files are not read directly. In Excel, choose Save as > CSV UTF-8 and upload that file.');
  if (ext !== 'csv') return fileError(`“${file.name}” is not a CSV file. Only .csv files are accepted.`);
  if (file.size > LIMITS.bytes) return fileError(`“${file.name}” is ${fmtBytes(file.size)}. The limit is 10 MB.`);
  const buf = await file.arrayBuffer();
  const text = new TextDecoder('utf-8').decode(buf);
  acceptText(file.name, file.size, text, false);
}
function useSample() {
  const t = sampleCsv();
  acceptText('products-2026-11.csv', new Blob([t]).size, t, false);
}

/* ---------- Import job ---------- */
const OPT_LABEL = { create: 'Create new only', update: 'Update existing by SKU', both: 'Create and update' };
let timer = null;
function startJob() {
  const t = tally();
  const queue = S.V.rows.filter((r) => ['create', 'update'].includes(outcome(r))).map((r) => ({ n: r.n, sku: r.rec.sku, kind: outcome(r) }));
  const lastCreate = [...queue].reverse().find((q) => q.kind === 'create');
  const failAt = queue.length >= 6 && lastCreate ? lastCreate : null;
  J = {
    id: 218, file: S.file.name, started: new Date(), status: 'running', bg: false, total: queue.length, done: 0, queue, failAt,
    optionLabel: OPT_LABEL[S.option], mapDesc: '', serverFail: [], skippedOpt: t.skip, invalid: t.error, created: 0, updated: 0, res: null,
  };
  S.mapping.forEach((k, i) => { if (k) J.mapDesc += (J.mapDesc ? '; ' : '') + `${S.headers[i]} → ${F[k].label}`; });
  S.step = 3; S.focus = 'title'; S.showLog = false;
  render();
  clearInterval(timer);
  timer = setInterval(tick, 140);
}
function summarize() {
  J.res = { created: J.created, updated: J.updated, skipped: J.skippedOpt, failed: J.invalid + J.serverFail.length };
}
function tick() {
  const step = Math.max(1, Math.ceil(J.total / 22));
  const upto = Math.min(J.total, J.done + step);
  for (let i = J.done; i < upto; i++) {
    const q = J.queue[i];
    if (J.failAt && q === J.failAt) J.serverFail.push({ n: q.n, sku: q.sku, msg: `SKU ${q.sku} was created by Trần Minh Quân a moment ago` });
    else if (q.kind === 'create') J.created++; else J.updated++;
  }
  J.done = upto;
  if (J.done >= J.total) { clearInterval(timer); J.status = 'done'; finishJob(); return; }
  if (S.step === 3 || J.bg) refreshProgress();
}
function refreshProgress() {
  const pct = Math.round(J.done / J.total * 100);
  document.querySelectorAll('[role="progressbar"]').forEach((p) => { p.setAttribute('aria-valuenow', J.done); p.firstElementChild.style.width = pct + '%'; });
  const txt = (el) => { if (el) el.innerHTML = el.innerHTML.replace(/\d[\d.]* of [\d.]+( \(\d+%\))?/, `${fmtNum(J.done)} of ${fmtNum(J.total)}${el.dataset.pct === '0' ? '' : ` (${pct}%)`}`); };
  document.querySelectorAll('#main p.font-medium').forEach((p) => { if (/\d of \d/.test(p.textContent) && /Importing/.test(p.textContent)) txt(p); });
  const live = $('#progress-live'); if (live && pct % 25 < 5) live.textContent = `Importing ${fmtNum(J.done)} of ${fmtNum(J.total)}`;
}
function finishJob() {
  summarize();
  const time = fmtDT(new Date());
  const failed = J.res.failed > 0;
  if (J.bg) {
    notes.unshift({ text: resultLine() + (failed ? '' : ''), tone: failed ? 'danger' : 'success', time, read: false });
    if (!failed) toast(resultLine(), 'success', { act: 'open-results', label: 'View results' });
  } else if (!failed) toast(resultLine());
  else notes.unshift({ text: resultLine(), tone: 'danger', time, read: true });
  S.focus = J.bg ? '' : 'title';
  render();
}

/* ---------- Actions ---------- */
function goStep(n, focus = 'title') { S.step = n; S.focus = focus; S.runMsg = ''; render(); window.scrollTo({ top: 0 }); }
function toReview() {
  S.step = 2; S.checking = true; S.V = null; S.filter = 'all'; S.page = 1; S.focus = 'title'; render();
  setTimeout(() => { S.V = validate(); S.checking = false; render(); }, 450);
}
function failedCsv() {
  const d = S.delim === '\t' ? ',' : S.delim;
  const lines = [csvLine([...S.headers, 'Error'], d)];
  S.V.rows.filter((r) => r.errors.length).forEach((r) => lines.push(csvLine([...S.headers.map((h, i) => r.raw[i] ?? ''), r.errors.map((e) => e.msg).join(' | ')], d)));
  if (J) J.serverFail.forEach((x) => { const r = S.V.rows.find((y) => y.n === x.n); if (r) lines.push(csvLine([...S.headers.map((h, i) => r.raw[i] ?? ''), x.msg], d)); });
  return lines.join('\r\n') + '\r\n';
}
async function leaveTo(label) {
  if (!dirty()) { toast(`Navigation to ${label} is not part of this demo`, 'info'); return; }
  const ok = await ask({ title: 'Leave this import?', body: `“${S.file.name}” and your column mapping will be discarded. Nothing has been imported yet.`, cancel: 'Stay on this page', ok: 'Leave page', danger: true });
  if (ok) { S = fresh(); render(); toast('Import discarded', 'info'); }
}

document.addEventListener('click', async (e) => {
  const nav = e.target.closest('a[data-nav]');
  if (nav) { e.preventDefault(); return leaveTo(nav.dataset.nav); }
  if (e.target.closest('[data-nav-result]')) { e.preventDefault(); return toast('The product list filtered to import #218 opens here', 'info'); }
  const el = e.target.closest('[data-act]');
  if (!el) { const n = $('#notif'); if (!n.hidden && !e.target.closest('#notif')) { n.hidden = true; $('#bell').setAttribute('aria-expanded', 'false'); } return; }
  const act = el.dataset.act;
  switch (act) {
    case 'bell': { const n = $('#notif'); n.hidden = !n.hidden; el.setAttribute('aria-expanded', String(!n.hidden)); if (!n.hidden) { notes.forEach((x) => { x.read = true; }); setTimeout(renderBell, 0); } break; }
    case 'close-toast': document.getElementById(el.dataset.id)?.remove(); break;
    case 'choose': $('#file-input').click(); break;
    case 'sample': useSample(); break;
    case 'template': downloadText('products-template.csv', 'SKU,Product name,Category,Unit,Cost price,Sale price,Stock,Reorder level,Barcode\r\nVPP-001,Bút bi Thiên Long TL-027 (xanh),Văn phòng phẩm,hộp,38000,52000,420,100,8934563138165\r\n'); toast('Template downloaded: products-template.csv', 'info'); break;
    case 'goto': goStep(Number(el.dataset.step)); break;
    case 'back': goStep(S.step - 1); break;
    case 'retry': loadFailed = false; pageState = ''; ready = false; render(); setTimeout(() => { ready = true; render(); }, 500); break;
    case 'next':
      if (S.step === 0) {
        if (!S.file) { S.uploadError = 'Choose a CSV file to continue.'; S.focus = '#choose-btn'; render(); $('#upload-error')?.focus(); break; }
        goStep(1);
      } else if (S.step === 1) {
        const { dup, missing } = mapIssues();
        if (missing.length || Object.keys(dup).length) {
          S.triedNext = true; render();
          const first = missing[0] ? $('#req-err-' + missing[0].key) : $('#map-' + Object.keys(dup)[0]);
          first?.focus(); break;
        }
        saveRemembered(); toReview();
      }
      break;
    case 'filter': S.filter = el.dataset.v; S.page = 1; render(); break;
    case 'page': S.page += Number(el.dataset.d); render(); break;
    case 'dl-failed': downloadText('products-failed-rows.csv', failedCsv()); toast(`Failed rows downloaded: ${tally().error}`, 'info'); break;
    case 'dl-failed-final': downloadText('products-failed-rows.csv', failedCsv()); toast(`Failed rows downloaded: ${J.res.failed}`, 'info'); break;
    case 'reset': S = fresh(); render(); break;
    case 'another': S = fresh(); J = J && J.status === 'running' ? J : null; render(); break;
    case 'log': S.showLog = !S.showLog; render(); break;
    case 'run': {
      const t = tally();
      if (J && J.status === 'running') { S.runMsg = 'Another import is still running. Wait for it to finish or stop it first.'; render(); break; }
      if (!t.act) { S.runMsg = 'No row can be imported with this option. Choose another option or upload a new file.'; render(); break; }
      S.runMsg = ''; startJob(); break;
    }
    case 'bg': {
      J.bg = true; S = fresh(); S.focus = 'title'; render(); toast('Import continues in the background', 'info'); break;
    }
    case 'stop': {
      const ok = await ask({ title: 'Stop import?', body: `${fmtNum(J.done)} ${plural(J.done, 'row is', 'rows are')} already imported and will be kept.`, cancel: 'Keep importing', ok: 'Stop import', danger: true });
      if (ok && J && J.status === 'running') { clearInterval(timer); J.status = 'stopped'; summarize(); finishJob(); }
      break;
    }
    case 'open-results': J.bg = false; $('#notif').hidden = true; S.step = 3; S.focus = 'title'; S.showLog = false; if (!S.file) { S.file = null; } render(); break;
    case 'dismiss-banner': J.bg = false; J = null; render(); break;
  }
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.matches('[data-map]')) { S.mapping[Number(t.dataset.map)] = t.value; S.remembered = false; render(); }
  else if (t.matches('[data-delim]')) { reparse(t.value); render(); }
  else if (t.matches('[data-opt]')) { S.option = t.value; S.page = 1; S.runMsg = ''; render(); }
  else if (t.matches('[data-size]')) { S.size = Number(t.value); S.page = 1; render(); }
  else if (t.id === 'file-input') { handleFile(t.files[0]); t.value = ''; }
});
document.addEventListener('dragover', (e) => { if (e.target.closest('[data-drop]')) { e.preventDefault(); e.target.closest('[data-drop]').classList.add('bg-blue-50', 'border-blue-700'); } });
document.addEventListener('dragleave', (e) => { e.target.closest?.('[data-drop]')?.classList.remove('bg-blue-50', 'border-blue-700'); });
document.addEventListener('drop', (e) => { if (e.target.closest('[data-drop]')) { e.preventDefault(); handleFile(e.dataTransfer.files[0]); } });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { const n = $('#notif'); if (!n.hidden) { n.hidden = true; $('#bell').setAttribute('aria-expanded', 'false'); $('#bell').focus(); } } });
window.addEventListener('beforeunload', (e) => { if (dirty()) { e.preventDefault(); e.returnValue = ''; } });

/* ---------- Boot: ?state=loading | error | empty ---------- */
render();
if (pageState === 'loading') { /* skeleton held */ }
else if (pageState === 'error') setTimeout(() => { loadFailed = true; render(); }, 500);
else setTimeout(() => { ready = true; render(); }, 500);
</script>
</body>
</html>
