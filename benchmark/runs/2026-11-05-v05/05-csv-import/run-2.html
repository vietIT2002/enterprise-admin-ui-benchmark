  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }

async function readFile(file) {
  S.fileError = '';
  if (!/\.csv$/i.test(file.name) && !/csv/.test(file.type)) return fileFail('File phải có định dạng .csv. Mở file trong Excel và lưu dưới dạng "CSV UTF-8".');
  if (file.size > MAX_BYTES) return fileFail(`File nặng ${fmtSize(file.size)}, vượt giới hạn 10 MB. Tách file thành nhiều phần rồi tải lại.`);
  const text = new TextDecoder('utf-8').decode(await file.arrayBuffer());
  acceptText(file.name, text, file.size);
}
function fileFail(msg) { S.fileError = msg; render(); const e = $('#file-error'); e && e.focus && 0; }
function acceptText(name, text, size) {
  if (text.includes('�')) return fileFail('File không phải mã hóa UTF-8 nên không đọc được chữ tiếng Việt. Trong Excel, hãy lưu lại bằng "CSV UTF-8 (phân tách bằng dấu phẩy)".');
  text = text.replace(/^﻿/, '');
  const d = detectDelim(text), rows = parseCSV(text, d);
  if (rows.length < 2) return fileFail('File không có dòng dữ liệu nào ngoài dòng tiêu đề.');
  if (rows.length - 1 > MAX_ROWS) return fileFail(`File có ${fmtNum(rows.length - 1)} dòng, vượt giới hạn ${fmtNum(MAX_ROWS)} dòng. Tách file rồi tải lại.`);
  S.file = { name, text, size }; S.delim = d; S.fileError = '';
  reparse(); render();
  toast(`Đã đọc ${esc(name)}: ${fmtNum(S.data.length)} dòng dữ liệu`, 'info');
}
function reparse() {
  const rows = parseCSV(S.file.text, S.delim);
  S.headers = rows[0]; S.data = rows.slice(1).map(r => { const x = r.slice(0, S.headers.length); while (x.length < S.headers.length) x.push(''); return x; });
  S.analysis = null; S.mapErr = null; S.remembered = false;
  const memKey = 'imp-map:' + S.headers.join('|');
  let saved = null; try { saved = JSON.parse(localStorage.getItem(memKey)); } catch (e) {}
  if (saved && saved.length === S.headers.length) { S.mapping = saved; S.remembered = true; }
  else {
    const used = new Set();
    S.mapping = S.headers.map(h => {
      const k = headerKey(h), f = FIELDS.find(x => !used.has(x.key) && x.alias.includes(k));
      if (f) { used.add(f.key); return f.key; } return '';
    });
  }
}

    <p class="pb-1.5 text-slate-700">Đã nhận ra: ${DELIMS[S.delim]} · <span class="tnum">${fmtNum(S.data.length)}</span> dòng dữ liệu · file ${esc(S.file.name)}</p>
  </div>
  <div class="mt-4 rounded-md border ${showErr && missing.length ? 'border-red-300 bg-red-50' : 'border-slate-200 bg-slate-50'} p-3">
    <p class="mb-1.5 font-medium">Trường bắt buộc</p><ul class="flex flex-wrap gap-x-6 gap-y-1">${pills}</ul></div>
  <div class="mt-4 overflow-x-auto rounded-md border border-slate-200"><table class="w-full min-w-[780px] border-collapse">

  <p class="mt-3 text-slate-700">${unmapped.length ? `${unmapped.length} cột sẽ không được nhập: ${esc(unmapped.join(', '))}.` : 'Tất cả các cột trong file sẽ được nhập.'}</p>`;
}

/* ========== Step 3: review ========== */
function cellFor(r, k) {
  const raw = r.raw[k], bad = r.errors.find(e => e.field === k);
  if (bad) return `<span class="inline-flex items-center gap-1 rounded bg-red-50 px-1.5 text-red-700">${ic('alert', 'size-3.5')}${raw ? esc(raw) : 'Trống'}</span>`;
  if (raw === '' || raw === undefined) return empty();
  if (k === 'cost' || k === 'price') return fmtAmt(r.val[k]);
  if (k === 'stock') return fmtNum(r.val.stock);
  return esc(raw);
}
const NUMERIC = new Set(['cost', 'price', 'stock']);
function viewReview() {

  const body = slice.map(r => {
    const o = outcome(r);
    const tag = { error: badge('danger', 'Lỗi'), create: badge('success', 'Tạo mới'), update: badge('info', 'Cập nhật'), skip: badge('neutral', 'Bỏ qua') }[o];
    let det = '';
    if (r.errors.length) { const all = r.errors.map(e => `${F[e.field].label}: ${e.msg}`).join('; '); det = `<span class="text-red-700" title="${esc(all)}">${esc(F[r.errors[0].field].label + ': ' + r.errors[0].msg)}${r.errors.length > 1 ? ` (+${r.errors.length - 1})` : ''}</span>`; }
    else if (o === 'skip') det = `<span class="text-slate-600">${S.mode === 'create' ? 'SKU đã có trong kho' : 'SKU chưa có trong kho'}</span>`;
    else if (r.warnings.length) det = `<span class="inline-flex items-center gap-1 text-amber-800">${ic('warn', 'size-3.5')}Cảnh báo: ${r.warnings[0].msg}</span>`;
    return `<tr class="${r.errors.length ? 'bg-red-50/40' : ''}"><td class="${TD} text-right tnum text-slate-700">${r.row}</td>
      ${cols.map(f => `<td class="${TD} ${NUMERIC.has(f.key) ? 'text-right tnum' : ''} ${f.key === 'name' ? 'max-w-[20rem] truncate' : ''}" ${f.key === 'name' ? `title="${esc(r.raw.name)}"` : ''}>${cellFor(r, f.key)}</td>`).join('')}
      <td class="${TD}">${tag}</td><td class="${TD} max-w-[24rem] truncate">${det}</td></tr>`;
  }).join('');
  const modeOpt = (v, label, hint) => `<label class="flex min-h-6 items-start gap-2"><input type="radio" name="mode" value="${v}" class="mt-0.5 size-4 accent-blue-700" ${S.mode === v ? 'checked' : ''}><span>${label}<span class="block text-slate-600">${hint}</span></span></label>`;
  const noRows = list.length === 0
    ? `<tr><td colspan="${cols.length + 3}" class="px-3 py-8 text-center"><p class="font-medium">Không có dòng nào lỗi</p><p class="mt-1 text-slate-600">Tất cả các dòng đều hợp lệ.</p><button type="button" class="${B2} mt-3" data-act="filter" data-f="all">Xem tất cả dòng</button></td></tr>` : '';
  return `
  <h2 id="stepHeading" tabindex="-1" class="text-base font-semibold">Xem trước và kiểm tra dữ liệu</h2>
  <p class="mt-1 text-slate-700 tnum" id="sum-line"><span class="font-medium">${fmtNum(c.total)}</span> dòng · <span class="font-medium">${fmtNum(c.valid)}</span> hợp lệ · <span class="font-medium ${c.errors ? 'text-red-700' : ''}">${fmtNum(c.errors)}</span> có lỗi${c.warnings ? ` · ${c.warnings} cảnh báo` : ''}. Số tiền và số lượng đã được đọc theo định dạng Việt Nam (1.250.000 là một triệu hai trăm năm mươi nghìn).</p>

  ${c.errors ? `<details class="mt-4 rounded-md border border-red-200 bg-red-50" ${c.valid === 0 ? 'open' : ''}>
    <summary class="flex min-h-10 cursor-pointer items-center gap-2 px-3 font-medium text-red-800">${ic('alert')}<span>${c.errors} dòng có lỗi</span></summary>
    <ul class="max-h-48 space-y-1 overflow-y-auto border-t border-red-200 px-3 py-2 text-red-800">${errs.flatMap(r => r.errors.map(e => `<li class="flex gap-1.5">${ic('alert', 'size-3.5 mt-1')}<span>${esc(errLine(r, e))}</span></li>`)).join('')}</ul>
    <div class="flex flex-wrap gap-2 border-t border-red-200 px-3 py-2"><button type="button" class="${B2}" data-act="download-failed">${ic('download')}Tải các dòng lỗi (${c.errors})</button><button type="button" class="${B2}" data-act="filter" data-f="errors">Chỉ xem dòng lỗi</button></div></details>` : ''}

  ${c.valid ? `<fieldset class="mt-4 rounded-md border border-slate-200 p-4"><legend class="px-1 font-medium">Khi SKU đã có trong kho</legend>
    <div class="grid gap-3 md:grid-cols-3">
      ${modeOpt('create', 'Chỉ tạo mới (mặc định)', 'Dòng có SKU đã có sẽ bị bỏ qua.')}

      ${modeOpt('both', 'Tạo mới và cập nhật', 'SKU đã có thì cập nhật, chưa có thì tạo mới.')}</div>
    <p class="mt-3 text-slate-700 tnum"><span class="font-medium">${fmtNum(c.isNew)}</span> mới · <span class="font-medium">${fmtNum(c.isOld)}</span> đã có trong kho. Khi cập nhật, ô trống giữ nguyên giá trị hiện tại.</p></fieldset>` : ''}

  <div class="mt-4 flex flex-wrap items-center justify-between gap-2">
    <div class="inline-flex rounded border border-slate-300" role="group" aria-label="Lọc dòng xem trước">
      <button type="button" data-act="filter" data-f="all" aria-pressed="${S.filter === 'all'}" class="h-8 rounded-l px-3 ${S.filter === 'all' ? 'bg-blue-50 font-medium text-blue-700' : 'bg-white hover:bg-slate-50'}">Tất cả dòng (${fmtNum(c.total)})</button>
      <button type="button" data-act="filter" data-f="errors" aria-pressed="${S.filter === 'errors'}" class="h-8 rounded-r border-l border-slate-300 px-3 ${S.filter === 'errors' ? 'bg-blue-50 font-medium text-blue-700' : 'bg-white hover:bg-slate-50'}">Chỉ dòng lỗi (${fmtNum(c.errors)})</button></div>
    ${S.filter === 'errors' ? `<button type="button" class="text-blue-700 underline" data-act="filter" data-f="all">Xóa bộ lọc</button>` : ''}
  </div>
  <div class="mt-2 overflow-x-auto rounded-md border border-slate-200"><table class="w-full min-w-[1000px] border-collapse">
    <caption class="sr-only">Xem trước các dòng sẽ nhập</caption>
    <thead><tr><th class="${TH} !text-right">Dòng</th>${head}<th class="${TH}">Kết quả</th><th class="${TH}">Chi tiết</th></tr></thead>
    <tbody>${body}${noRows}</tbody></table></div>
  <div class="mt-2 flex flex-wrap items-center justify-between gap-2 text-slate-700">
    <p class="tnum">Hiển thị ${list.length ? fmtNum(from + 1) : 0}–${fmtNum(from + slice.length)} trên ${fmtNum(list.length)} dòng</p>
    <div class="flex items-center gap-2"><label for="psize">Số dòng mỗi trang</label>
      <select id="psize" class="h-8 rounded border border-slate-300 bg-white px-2">${[10, 25, 50].map(n => `<option ${S.size === n ? 'selected' : ''}>${n}</option>`).join('')}</select>
      <button type="button" class="${B2} !px-2" data-act="page" data-d="-1" aria-label="Trang trước" ${S.page <= 1 ? 'disabled' : ''}>${ic('left')}</button>
      <span class="tnum">Trang ${S.page} / ${pages}</span>
      <button type="button" class="${B2} !px-2" data-act="page" data-d="1" aria-label="Trang sau" ${S.page >= pages ? 'disabled' : ''}>${ic('right')}</button></div></div>
  <p class="mt-2 text-slate-600">Dòng được đánh số như trong Excel (dòng 1 là tiêu đề).</p>`;
}

/* ========== Step 4: run and summary ========== */
function viewRun() {
  const j = S.job, pct = Math.round(j.done / j.total * 100);
  if (S.bg) return `<h2 id="stepHeading" tabindex="-1" class="text-base font-semibold">Đang nhập ở chế độ nền</h2>
    <p class="mt-1 text-slate-600">Bạn có thể tiếp tục làm việc khác. Tiến trình hiển thị ở đầu trang và bạn sẽ nhận thông báo khi xong.</p>
    <button type="button" class="${B2} mt-4" data-act="view-progress">Xem tiến trình</button>`;
  return `<h2 id="stepHeading" tabindex="-1" class="text-base font-semibold">Đang nhập sản phẩm</h2>
    <div class="mt-4 max-w-2xl rounded-md border border-slate-200 p-4">
      <p class="flex items-center gap-2 font-medium tnum">${spinner()}<span id="run-text">Đang nhập ${fmtNum(j.done)} trên ${fmtNum(j.total)}</span><span class="ml-auto font-normal text-slate-700" id="run-pct">${pct}%</span></p>
      <div class="mt-3 h-2 overflow-hidden rounded-full bg-slate-200" role="progressbar" aria-label="Tiến trình nhập sản phẩm" aria-valuemin="0" aria-valuemax="${j.total}" aria-valuenow="${j.done}" id="run-bar"><div class="h-full bg-blue-700" style="width:${pct}%" id="run-fill"></div></div>
      <p class="mt-3 text-slate-700">Bạn có thể rời trang này. Bạn sẽ nhận thông báo khi nhập xong.</p>
      <div class="mt-4 flex gap-2"><button type="button" class="${B2}" data-act="bg-import">Chạy nền</button><button type="button" class="${B2}" data-act="stop-import">Dừng nhập</button></div>
    </div>`;
}
function viewSummary() {
  const r = S.result, bad = r.failed > 0, stopped = r.status === 'Đã dừng';
  const fig = (l, v, tone) => `<div class="rounded-md border border-slate-200 p-3"><p class="text-slate-600">${l}</p><p class="mt-1 text-2xl font-semibold tnum ${tone || ''}">${fmtNum(v)}</p></div>`;
  return `
  <h2 id="stepHeading" tabindex="-1" class="text-base font-semibold">Kết quả nhập <span class="tnum font-normal text-slate-600">${r.id}</span></h2>
  <div class="mt-3 flex items-start gap-2 rounded-md border p-3 ${stopped ? 'border-slate-300 bg-slate-50' : bad ? 'border-amber-300 bg-amber-50 text-amber-900' : 'border-green-300 bg-green-50 text-green-900'}" role="status">
    ${ic(bad || stopped ? 'warn' : 'check', 'size-4 mt-0.5')}
    <p>${stopped ? `Đã dừng nhập: ${fmtNum(r.stoppedAt ?? r.created + r.updated)} dòng đã nhập trước khi dừng.` : bad ? `Nhập xong: ${fmtNum(r.created)} tạo mới · ${fmtNum(r.updated)} cập nhật · ${fmtNum(r.failed)} lỗi.` : `Nhập xong: ${fmtNum(r.created)} tạo mới · ${fmtNum(r.updated)} cập nhật, không có lỗi.`}</p></div>
  <div class="mt-4 grid max-w-3xl grid-cols-2 gap-3 md:grid-cols-4">${fig('Đã tạo', r.created)}${fig('Đã cập nhật', r.updated)}${fig('Bỏ qua', r.skipped)}${fig('Lỗi', r.failed, r.failed ? 'text-red-700' : '')}</div>
  <div class="mt-4 flex flex-wrap gap-2">
    <a href="#/products?import=${r.id}" class="${B1}" data-act="view-products">Xem sản phẩm đã nhập</a>
    ${r.failed ? `<button type="button" class="${B2}" data-act="download-failed">${ic('download')}Tải các dòng lỗi (${r.failed})</button>` : ''}
    <button type="button" class="${B2}" data-act="toggle-log" aria-expanded="${S.showLog}">Xem nhật ký nhập</button>
    <button type="button" class="${B2}" data-act="import-another">Nhập file khác</button></div>
  ${S.showLog ? `<dl class="mt-4 grid max-w-3xl grid-cols-[160px_1fr] gap-y-1.5 rounded-md border border-slate-200 bg-slate-50 p-4">
    <dt class="text-slate-600">File</dt><dd>${esc(r.file)}</dd><dt class="text-slate-600">Người nhập</dt><dd>${esc(r.user)}</dd>
    <dt class="text-slate-600">Thời gian</dt><dd class="tnum"><time datetime="${r.at}">${fmtDT(r.at)}</time></dd><dt class="text-slate-600">Tùy chọn</dt><dd>${esc(r.mode)}</dd>
    ${r.mapSummary ? `<dt class="text-slate-600">Ghép cột</dt><dd>${esc(r.mapSummary)}</dd>` : ''}
    <dt class="text-slate-600">Số lượng</dt><dd class="tnum">${fmtNum(r.created)} tạo mới · ${fmtNum(r.updated)} cập nhật · ${fmtNum(r.skipped)} bỏ qua · ${fmtNum(r.failed)} lỗi</dd></dl>` : ''}
  ${r.failedRows.length ? `<h3 class="mb-2 mt-6 font-medium">Các dòng lỗi (${r.failedRows.length})</h3>
    <div class="max-w-4xl overflow-x-auto rounded-md border border-slate-200"><table class="w-full border-collapse"><thead><tr><th class="${TH} !text-right">Dòng</th><th class="${TH}">SKU</th><th class="${TH}">Lý do</th></tr></thead>
    <tbody>${r.failedRows.map(f => `<tr><td class="${TD} text-right tnum">${f[0]}</td><td class="${TD}">${f[1] ? esc(f[1]) : empty()}</td><td class="${TD} !whitespace-normal !h-auto py-2.5 text-red-700">${esc(f[2])}</td></tr>`).join('')}</tbody></table></div>` : ''}
  <p class="mt-4 text-slate-600">Địa chỉ trang này được giữ cố định và lưu 30 ngày: <span class="tnum">#/products/import/${r.id}</span></p>`;
}

/* ========== Import job (simulated) ========== */
function startImport() {
  const todo = S.analysis.recs.filter(r => ['create', 'update'].includes(outcome(r)));
  const c = counts();
  S.job = { id: 'IMP-0219', total: todo.length, done: 0, created: 0, updated: 0, runFailed: [], todo, status: 'running', skippedN: c.skip, startAt: new Date().toISOString() };
  S.step = 4; S.bg = false; S.focus = true; render();
  S.timer = setInterval(tick, 450);
}
function tick() {
  const j = S.job; if (!j || j.status !== 'running') return clearInterval(S.timer);
  for (let n = 0; n < 2 && j.done < j.total; n++) {
    const r = j.todo[j.done++], o = outcome(r);
    if (o === 'create' && r.raw.sku.toUpperCase() === RACE_SKU) j.runFailed.push([r.row, r.raw.sku, 'SKU đã được tạo bởi Phạm Quốc Bảo vài giây trước']);
    else if (o === 'create') j.created++; else j.updated++;
  }
  updateProgress();
  if (j.done >= j.total) finishJob('Hoàn tất');
}
function updateProgress() {
  const j = S.job, pct = Math.round(j.done / j.total * 100);
  const t = $('#run-text'); if (t) { t.textContent = `Đang nhập ${fmtNum(j.done)} trên ${fmtNum(j.total)}`; $('#run-pct').textContent = pct + '%'; $('#run-fill').style.width = pct + '%'; $('#run-bar').setAttribute('aria-valuenow', j.done); }
  if (S.bg) renderBanner();
  const m = Math.floor(pct / 25); if (m !== j.milestone) { j.milestone = m; $('#sr-progress').textContent = `Đã nhập ${fmtNum(j.done)} trên ${fmtNum(j.total)} sản phẩm`; }
}
function finishJob(status) {
  clearInterval(S.timer);
  const j = S.job, c = counts(), errs = S.analysis.recs.filter(r => r.errors.length);
  const failedRows = [...errs.flatMap(r => r.errors.map(e => [r.row, r.raw.sku || '', `${F[e.field].label}: ${e.msg}`])), ...j.runFailed].sort((a, b) => a[0] - b[0]);
  const names = FIELDS.filter(f => f.key in S.analysis.colOf).map(f => `${S.headers[S.analysis.colOf[f.key]]} → ${f.label}`).join('; ');
  j.status = 'done';
  S.result = { id: j.id, file: S.file.name, user: CURRENT_USER, at: new Date().toISOString(), created: j.created, updated: j.updated, skipped: j.skippedN, failed: errs.length + j.runFailed.length,
    status, stoppedAt: j.done, mode: { create: 'Chỉ tạo mới (khóa: SKU)', update: 'Chỉ cập nhật theo SKU', both: 'Tạo mới và cập nhật theo SKU' }[S.mode], mapSummary: names, failedRows,
    failedRaw: errs.map(r => ({ row: r.row, reason: r.errors.map(e => `${F[e.field].label}: ${e.msg}`).join('; ') })).concat(j.runFailed.map(f => ({ row: f[0], reason: f[2] }))) };
  history.replaceState(null, '', '#/products/import/' + j.id);
  if (S.bg) {
    S.bannerPending = S.result;
    if (!S.result.failed) toast(`Nhập xong: ${fmtNum(S.result.created)} tạo mới · ${fmtNum(S.result.updated)} cập nhật`, 'success', { label: 'Xem kết quả', fn: () => { S.bg = false; S.bannerPending = null; S.focus = true; render(); } });
  }
  S.focus = !S.bg; render();
}

/* ========== Banner (background jobs) ========== */
function renderBanner() {
  const el = $('#banner'), j = S.job;
  if (S.bg && j && j.status === 'running') {
    const pct = Math.round(j.done / j.total * 100);
    el.innerHTML = `<div class="flex flex-wrap items-center gap-3 rounded-md border border-blue-200 bg-blue-50 p-3 text-blue-900"><span class="text-blue-700">${spinner()}</span>
      <div class="min-w-0 flex-1"><p class="font-medium tnum">Đang nhập ${fmtNum(j.total)} sản phẩm · ${fmtNum(j.done)} trên ${fmtNum(j.total)}</p>
      <div class="mt-1.5 h-1.5 overflow-hidden rounded-full bg-blue-200" role="progressbar" aria-label="Tiến trình nhập nền" aria-valuemin="0" aria-valuemax="${j.total}" aria-valuenow="${j.done}"><div class="h-full bg-blue-700" style="width:${pct}%"></div></div></div>
      <button type="button" class="${B2}" data-act="view-progress">Xem tiến trình</button><button type="button" class="${B2}" data-act="stop-import">Dừng</button></div>`;
  } else if (S.bannerPending) {
    const r = S.bannerPending, bad = r.failed > 0;
    el.innerHTML = `<div class="flex flex-wrap items-center gap-3 rounded-md border p-3 ${bad ? 'border-amber-300 bg-amber-50 text-amber-900' : 'border-green-300 bg-green-50 text-green-900'}" role="status">${ic(bad ? 'warn' : 'check')}
      <p class="min-w-0 flex-1 tnum">Nhập xong: ${fmtNum(r.created)} tạo mới · ${fmtNum(r.updated)} cập nhật · ${fmtNum(r.failed)} lỗi</p>
      <button type="button" class="${B2}" data-act="view-results">Xem kết quả</button></div>`;
  } else el.innerHTML = '';
}

/* ========== Bar ========== */
function renderBar() {
  const bar = $('#bar'); let left = '', right = '', show = true;
  if (S.step === 1 && !S.job) { left = S.file ? `<span class="inline-flex items-center gap-1.5 text-slate-700">${ic('file')}${esc(S.file.name)}</span>` : '<span class="text-slate-600">Chưa chọn file</span>'; right = `<button type="button" class="${B1}" data-act="next">Tiếp theo: ghép cột${ic('right')}</button>`; }
  else if (S.step === 2) { left = S.mapErr ? `<span class="inline-flex items-center gap-1.5 text-red-700" role="alert">${ic('alert')}Cần ghép đủ các trường bắt buộc</span>` : ''; right = `<button type="button" class="${B2}" data-act="back">Quay lại</button><button type="button" class="${B1}" data-act="next">Tiếp theo: xem trước${ic('right')}</button>`; }
  else if (S.step === 3 && S.analysis) {
    const c = counts();
    if (!c.valid) { left = '<span class="text-red-700">Không có dòng nào hợp lệ để nhập. Sửa lỗi trong file rồi tải lại.</span>'; right = `<button type="button" class="${B2}" data-act="back">Quay lại</button><button type="button" class="${B1}" data-act="new-file">Tải file mới</button>`; }
    else {
      left = `<span class="text-slate-700">${c.errors ? `${fmtNum(c.errors)} dòng lỗi sẽ bị bỏ qua. Sửa trong file rồi tải lại, hoặc nhập ngay ${fmtNum(c.valid)} dòng hợp lệ.` : `Tất cả ${fmtNum(c.valid)} dòng đều hợp lệ.`}${c.skip ? ` ${fmtNum(c.skip)} dòng hợp lệ bị bỏ qua theo tùy chọn đã chọn.` : ''}</span>`;
      right = `<button type="button" class="${B2}" data-act="back">Quay lại</button><button type="button" class="${B2}" data-act="new-file">Tải file mới</button>` +
        (c.run ? `<button type="button" class="${B1}" data-act="start-import">Nhập ${fmtNum(c.run)} sản phẩm</button>` : `<button type="button" class="${B1} opacity-50" aria-disabled="true" data-act="noop" title="Không có dòng nào để nhập theo tùy chọn này">Nhập 0 sản phẩm</button>`);
    }
  } else show = false;
  bar.hidden = !show;
  bar.innerHTML = show ? `<div class="flex flex-wrap items-center justify-between gap-3 px-6 py-3"><div class="min-w-0 flex-1">${left}</div><div class="flex items-center gap-2">${right}</div></div>` : '';
}

/* ========== Render ========== */
function render() {
  renderStepper(); renderBanner();
  let html;
  if (S.result && !(S.bg && !S.bannerPending === false)) html = viewSummary();
  else if (S.job && S.step === 4) html = viewRun();
  else html = S.step === 1 ? viewUpload() : S.step === 2 ? viewMapping() : viewReview();
  if (S.result && S.bg) html = viewRun();
  $('#view').innerHTML = html;
  renderBar();
  if (S.step === 1 && !S.job && !S.result) renderRecent();
  if (S.focus) { S.focus = false; const h = $('#stepHeading'); h && h.focus(); }
  if (S.refocus) { const e = $(S.refocus); S.refocus = null; e && e.focus(); }
}

/* ========== Actions ========== */
function failedCsv() {
  const r = S.result;
  if (S.analysis && r && r.id === S.job?.id) {
    const rows = [[...S.headers, 'Lỗi']];
    r.failedRaw.sort((a, b) => a.row - b.row).forEach(f => rows.push([...S.data[f.row - 2], f.reason]));
    return toCSV(rows);
  }
  return toCSV([['Dòng', 'SKU', 'Lỗi'], ...r.failedRows]);
}
async function goNext() {
  if (S.step === 1) {
    if (!S.file) { S.fileError = 'Chọn một file CSV để tiếp tục.'; render(); const b = $('#choose-btn'); b && b.focus(); return; }
    S.step = 2; S.focus = true; render();
  } else if (S.step === 2) {
    const { dups, missing } = mappingCheck();
    if (missing.length || Object.keys(dups).length) {
      S.mapErr = { missing, dups }; S.refocus = missing.length ? '#err-' + missing[0] : '#err-col-' + Object.keys(dups)[0]; render(); return;
    }
    S.mapErr = null; try { localStorage.setItem('imp-map:' + S.headers.join('|'), JSON.stringify(S.mapping)); } catch (e) {}
    analyze(); S.filter = 'all'; S.page = 1; S.step = 3; S.focus = true; render();
  }
}
document.addEventListener('click', async e => {
  const nav = e.target.closest('[data-nav]');
  if (nav) { e.preventDefault(); if (dirty() && !(await confirmDialog({ title: 'Rời khỏi trang nhập?', body: 'File đã chọn và cách ghép cột sẽ không được giữ lại.', ok: 'Rời trang', cancel: 'Ở lại' }))) return; resetWizard(); render(); loadRecent(); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  if (act === 'view-products') { e.preventDefault(); toast('Bản demo: danh sách sản phẩm không có trong tệp này.', 'info'); return; }
  switch (act) {
    case 'choose-file': $('#file-input').click(); break;
    case 'use-sample': acceptText('san-pham-mau.csv', SAMPLE_TEXT, new Blob([SAMPLE_TEXT]).size); break;
    case 'download-template': saveBlob('mau-nhap-san-pham.csv', toCSV([SAMPLE_HEAD.slice(0, 8), ['NK-MI-003', 'Mì Hảo Hảo chua cay (thùng 30 gói)', 'Thực phẩm khô', 'Thùng', '108000', '126000', '240', '8934563138165']])); toast('Đã tải mau-nhap-san-pham.csv'); break;
    case 'change-file': if (await confirmDialog({ title: 'Đổi file?', body: `Cách ghép cột cho ${esc(S.file.name)} sẽ không được giữ lại.`, ok: 'Đổi file', cancel: 'Giữ file hiện tại', danger: false })) { S.file = null; S.analysis = null; S.fileError = ''; S.focus = true; render(); } break;
    case 'new-file': if (await confirmDialog({ title: 'Tải file mới?', body: 'Kết quả kiểm tra của file hiện tại sẽ không được giữ lại. Các dòng lỗi vẫn có thể tải về trước khi rời trang.', ok: 'Tải file mới', cancel: 'Ở lại', danger: false })) { S.file = null; S.analysis = null; S.step = 1; S.focus = true; render(); } break;
    case 'retry-recent': loadRecent(); break;
    case 'next': goNext(); break;
    case 'back': S.step--; S.focus = true; render(); break;
    case 'goto': S.step = +a.dataset.step; S.focus = true; render(); break;
    case 'filter': S.filter = a.dataset.f; S.page = 1; S.refocus = '[data-act="filter"][data-f="' + S.filter + '"]'; render(); break;
    case 'page': S.page += +a.dataset.d; render(); break;
    case 'download-failed': {
      if (S.result) saveBlob(`dong-loi-${S.result.id}.csv`, failedCsv());
      else { const rows = [[...S.headers, 'Lỗi']]; S.analysis.recs.filter(r => r.errors.length).forEach(r => rows.push([...S.data[r.row - 2], r.errors.map(x => `${F[x.field].label}: ${x.msg}`).join('; ')])); saveBlob('dong-loi-' + S.file.name, toCSV(rows)); toast(`Đã tải ${counts().errors} dòng lỗi (cột "Lỗi" ở cuối sẽ được bỏ qua khi nhập lại)`); }
      break; }
    case 'start-import': startImport(); break;
    case 'stop-import': {
      const j = S.job;
      if (await confirmDialog({ title: 'Dừng nhập?', body: `${fmtNum(j.created + j.updated)} sản phẩm đã được nhập và sẽ được giữ lại. Các dòng còn lại chưa được xử lý.`, ok: 'Dừng nhập', cancel: 'Tiếp tục nhập' }) && j.status === 'running') { S.bg = false; finishJob('Đã dừng'); }
      break; }
    case 'bg-import': S.bg = true; S.step = 3 + 1; render(); toast('Việc nhập đang chạy nền. Bạn sẽ nhận thông báo khi xong.', 'info'); break;
    case 'view-progress': S.bg = false; S.focus = true; render(); break;
    case 'view-results': S.bg = false; S.bannerPending = null; S.focus = true; render(); break;
    case 'toggle-log': S.showLog = !S.showLog; S.refocus = '[data-act="toggle-log"]'; render(); break;
    case 'import-another': resetWizard(); S.focus = true; render(); loadRecent(); break;
    case 'open-summary': {
      const r = RECENT.find(x => x.id === a.dataset.id);
      S.result = { ...r, skipped: r.skipped, stoppedAt: r.stoppedAt }; S.job = { id: r.id, status: 'done' }; S.step = 4; S.showLog = false;
      history.replaceState(null, '', '#/products/import/' + r.id); S.focus = true; render(); break; }
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.map !== undefined) { S.mapping[+t.dataset.map] = t.value; if (S.mapErr) S.mapErr = null; S.remembered = false; S.refocus = '#' + t.id; render(); }
  else if (t.id === 'delim') { S.delim = t.value === 'tab' ? '\t' : t.value; reparse(); S.refocus = '#delim'; render(); }
  else if (t.name === 'mode') { S.mode = t.value; S.refocus = 'input[name="mode"][value="' + t.value + '"]'; render(); }
  else if (t.id === 'psize') { S.size = +t.value; S.page = 1; S.refocus = '#psize'; render(); }
  else if (t.id === 'file-input') { const f = t.files[0]; t.value = ''; if (f) readFile(f); }
});
document.addEventListener('dragover', e => { if ($('#dropzone')) e.preventDefault(); });
document.addEventListener('drop', e => { const z = $('#dropzone'); if (!z) return; e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) readFile(f); });
window.addEventListener('beforeunload', e => { if (dirty()) { e.preventDefault(); e.returnValue = ''; } });

/* ========== Boot ========== */
(function boot() {
  const m = location.hash.match(/import\/(IMP-\d+)/);
  const hist = m && RECENT.find(x => x.id === m[1]);
  if (hist) { S.result = { ...hist }; S.job = { id: hist.id, status: 'done' }; S.step = 4; }
  render();
  if (!hist) loadRecent();
})();
</script>
</body>
</html>
