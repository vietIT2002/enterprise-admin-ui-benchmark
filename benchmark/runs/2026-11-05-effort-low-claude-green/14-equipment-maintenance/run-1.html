<title>Equipment — Maintenance</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  [hidden] { display: none !important; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .tabular-nums { font-variant-numeric: tabular-nums; }
</style>
<body class="bg-slate-50 text-[#0f172a] text-sm">
  <div class="min-h-screen flex flex-col">
    <!-- Page header -->
    <header class="bg-white border-b border-slate-200">
      <div class="max-w-[1400px] mx-auto px-6 py-4">
        <nav class="text-xs text-slate-500 mb-1" aria-label="Breadcrumb">Maintenance</nav>
        <div class="flex items-center justify-between gap-4">
          <h1 class="text-xl font-semibold text-[#0f172a]">Equipment</h1>
          <div class="flex items-center gap-2">
            <button class="h-8 px-3 rounded text-sm font-medium border border-slate-300 bg-white text-slate-700 hover:bg-slate-50">Export</button>
            <button class="h-8 px-3 rounded text-sm font-medium border border-slate-300 bg-white text-slate-700 hover:bg-slate-50">Import</button>
            <button class="h-8 px-3 rounded text-sm font-medium bg-blue-700 text-white hover:bg-blue-800">Add equipment</button>
          </div>
        </div>
      </div>
    </header>

    <main class="max-w-[1400px] mx-auto w-full px-6 py-5 flex-1">
      <!-- Status tabs -->
      <div class="flex items-center gap-1 border-b border-slate-200 mb-4" role="tablist" aria-label="Status filter">
        <button class="tab-btn px-3 py-2 text-sm font-medium border-b-2 border-blue-700 text-blue-700" data-tab="all" aria-selected="true" role="tab">All <span class="tabular-nums">24</span></button>
        <button class="tab-btn px-3 py-2 text-sm font-medium border-b-2 border-transparent text-slate-600 hover:text-slate-900" data-tab="operational" aria-selected="false" role="tab">Operational <span class="tabular-nums">16</span></button>
        <button class="tab-btn px-3 py-2 text-sm font-medium border-b-2 border-transparent text-slate-600 hover:text-slate-900" data-tab="maintenance" aria-selected="false" role="tab">In maintenance <span class="tabular-nums">4</span></button>
        <button class="tab-btn px-3 py-2 text-sm font-medium border-b-2 border-transparent text-slate-600 hover:text-slate-900" data-tab="down" aria-selected="false" role="tab">Down <span class="tabular-nums">2</span></button>
        <button class="tab-btn px-3 py-2 text-sm font-medium border-b-2 border-transparent text-slate-600 hover:text-slate-900" data-tab="retired" aria-selected="false" role="tab">Retired <span class="tabular-nums">2</span></button>
      </div>

      <!-- Filter bar -->
      <div class="flex flex-wrap items-center gap-2 mb-3">
        <div class="relative">
          <input id="searchInput" type="search" placeholder="Search machine or ID" class="h-8 w-64 pl-3 pr-3 rounded border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-blue-700" aria-label="Search equipment">
        </div>
        <select id="locationFilter" class="h-8 rounded border border-slate-300 text-sm px-2 bg-white" aria-label="Filter by location">
          <option value="">Location: all</option>
          <option>Line A — Stamping</option>
          <option>Line A — Welding</option>
          <option>Line B — Assembly</option>
          <option>Line B — Packaging</option>
          <option>Line C — Paint shop</option>
          <option>Warehouse</option>
          <option>Utilities room</option>
        </select>
        <select id="statusFilter" class="h-8 rounded border border-slate-300 text-sm px-2 bg-white" aria-label="Filter by status">
          <option value="">Status: all</option>
          <option value="operational">Operational</option>
          <option value="maintenance">In maintenance</option>
          <option value="down">Down</option>
          <option value="retired">Retired</option>
        </select>
        <button id="moreFiltersBtn" class="h-8 px-3 rounded border border-slate-300 text-sm text-slate-700 bg-white hover:bg-slate-50">More filters</button>
        <div id="chipsRow" class="flex items-center gap-2 flex-wrap"></div>
      </div>

      <p id="summaryLine" class="text-sm text-slate-600 mb-2">24 machines</p>

      <!-- Table -->
      <div class="rounded-md border border-slate-200 bg-white overflow-x-auto">
        <table class="w-full" aria-label="Equipment list">
          <thead>
            <tr class="h-10 border-b border-slate-200">
              <th class="px-3 text-left text-sm font-medium text-slate-600">Machine</th>
              <th class="px-3 text-left text-sm font-medium text-slate-600">Location</th>
              <th class="px-3 text-left text-sm font-medium text-slate-600">Status</th>
              <th class="px-3 text-left text-sm font-medium text-slate-600">Last service</th>
              <th class="px-3 text-left text-sm font-medium text-slate-600">Next inspection</th>
              <th class="px-3 text-right text-sm font-medium text-slate-600">Hours run</th>
              <th class="px-3"><span class="sr-only">Actions</span></th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>

      <!-- Pagination -->
      <div class="flex items-center justify-between mt-3 text-sm text-slate-600">
        <span id="paginationSummary">1–24 of 24</span>
        <div class="flex items-center gap-2">
          <button class="h-8 px-2 rounded border border-slate-300 bg-white disabled:opacity-50" disabled>Previous</button>
          <button class="h-8 px-3 rounded border border-blue-700 bg-blue-50 text-blue-700 font-medium">1</button>
          <button class="h-8 px-2 rounded border border-slate-300 bg-white disabled:opacity-50" disabled>Next</button>
        </div>
      </div>
    </main>
  </div>

<script>
const equipment = [
  { id: "EQ-1001", name: "CNC Stamping Press #1", location: "Line A — Stamping", status: "operational", lastService: "2026-09-18", nextInspection: "2026-11-08", hours: 12480 },
  { id: "EQ-1002", name: "CNC Stamping Press #2", location: "Line A — Stamping", status: "maintenance", lastService: "2026-10-30", nextInspection: "2026-11-05", hours: 15320 },
  { id: "EQ-1003", name: "Robotic Welder A1", location: "Line A — Welding", status: "operational", lastService: "2026-10-02", nextInspection: "2026-11-20", hours: 9870 },
  { id: "EQ-1004", name: "Robotic Welder A2", location: "Line A — Welding", status: "down", lastService: "2026-08-14", nextInspection: "2026-11-03", hours: 18220 },
  { id: "EQ-1005", name: "Spot Welding Unit A3", location: "Line A — Welding", status: "operational", lastService: "2026-09-25", nextInspection: "2026-12-01", hours: 7640 },
  { id: "EQ-1006", name: "Conveyor Belt B1", location: "Line B — Assembly", status: "operational", lastService: "2026-10-10", nextInspection: "2026-11-15", hours: 22010 },
  { id: "EQ-1007", name: "Assembly Robot B2", location: "Line B — Assembly", status: "operational", lastService: "2026-09-29", nextInspection: "2026-11-25", hours: 10340 },
  { id: "EQ-1008", name: "Torque Wrench Station B3", location: "Line B — Assembly", status: "operational", lastService: "2026-10-05", nextInspection: "2026-12-10", hours: 3210 },
  { id: "EQ-1009", name: "Quality Scanner B4", location: "Line B — Assembly", status: "maintenance", lastService: "2026-10-28", nextInspection: "2026-11-06", hours: 5540 },
  { id: "EQ-1010", name: "Case Packer C1", location: "Line B — Packaging", status: "operational", lastService: "2026-09-12", nextInspection: "2026-11-22", hours: 14880 },
  { id: "EQ-1011", name: "Shrink Wrap Machine C2", location: "Line B — Packaging", status: "operational", lastService: "2026-10-16", nextInspection: "2026-12-05", hours: 8990 },
  { id: "EQ-1012", name: "Pallet Wrapper C3", location: "Line B — Packaging", status: "down", lastService: "2026-07-30", nextInspection: "2026-11-04", hours: 20100 },
  { id: "EQ-1013", name: "Label Applicator C4", location: "Line B — Packaging", status: "operational", lastService: "2026-10-20", nextInspection: "2026-12-15", hours: 4320 },
  { id: "EQ-1014", name: "Paint Booth D1", location: "Line C — Paint shop", status: "maintenance", lastService: "2026-10-31", nextInspection: "2026-11-07", hours: 16720 },
  { id: "EQ-1015", name: "Paint Robot D2", location: "Line C — Paint shop", status: "operational", lastService: "2026-09-21", nextInspection: "2026-11-18", hours: 11230 },
  { id: "EQ-1016", name: "Curing Oven D3", location: "Line C — Paint shop", status: "operational", lastService: "2026-10-08", nextInspection: "2026-12-02", hours: 19440 },
  { id: "EQ-1017", name: "Overspray Extractor D4", location: "Line C — Paint shop", status: "operational", lastService: "2026-09-15", nextInspection: "2026-11-28", hours: 6780 },
  { id: "EQ-1018", name: "Forklift W1", location: "Warehouse", status: "operational", lastService: "2026-10-22", nextInspection: "2026-12-08", hours: 25600 },
  { id: "EQ-1019", name: "Forklift W2", location: "Warehouse", status: "maintenance", lastService: "2026-10-29", nextInspection: "2026-11-09", hours: 23980 },
  { id: "EQ-1020", name: "Pallet Jack W3", location: "Warehouse", status: "retired", lastService: "2026-03-11", nextInspection: "—", hours: 31200 },
  { id: "EQ-1021", name: "Automated Storage Crane W4", location: "Warehouse", status: "operational", lastService: "2026-09-30", nextInspection: "2026-11-30", hours: 13450 },
  { id: "EQ-1022", name: "Air Compressor U1", location: "Utilities room", status: "operational", lastService: "2026-10-12", nextInspection: "2026-12-12", hours: 28900 },
  { id: "EQ-1023", name: "Boiler Unit U2", location: "Utilities room", status: "operational", lastService: "2026-09-08", nextInspection: "2026-11-17", hours: 34210 },
  { id: "EQ-1024", name: "Backup Generator U3", location: "Utilities room", status: "retired", lastService: "2026-01-20", nextInspection: "—", hours: 9800 },
];

const statusMeta = {
  operational: { label: "Operational", classes: "bg-green-50 text-green-800" },
  maintenance: { label: "In maintenance", classes: "bg-blue-50 text-blue-800" },
  down: { label: "Down", classes: "bg-red-50 text-red-800" },
  retired: { label: "Retired", classes: "bg-slate-100 text-slate-700" },
};

const TODAY = new Date("2026-11-05");

function daysUntil(dateStr) {
  if (dateStr === "—") return null;
  const d = new Date(dateStr);
  return Math.round((d - TODAY) / (1000 * 60 * 60 * 24));
}

function formatDate(dateStr) {
  if (dateStr === "—") return "—";
  const d = new Date(dateStr);
  return d.toLocaleDateString("en-GB", { day: "2-digit", month: "2-digit", year: "numeric" });
}

function inspectionBadge(dateStr) {
  const diff = daysUntil(dateStr);
  if (diff === null) return "";
  if (diff < 0) return `<span class="ml-2 inline-flex h-5 items-center rounded-full bg-red-50 text-red-800 px-2 text-xs font-medium">Overdue</span>`;
  if (diff <= 14) return `<span class="ml-2 inline-flex h-5 items-center rounded-full bg-amber-50 text-amber-800 px-2 text-xs font-medium">Due soon</span>`;
  return "";
}

let state = { tab: "all", search: "", location: "", status: "" };

function applyFilters() {
  return equipment.filter((e) => {
    if (state.tab !== "all" && e.status !== state.tab) return false;
    if (state.status && e.status !== state.status) return false;
    if (state.location && e.location !== state.location) return false;
    if (state.search) {
      const q = state.search.toLowerCase();
      if (!e.name.toLowerCase().includes(q) && !e.id.toLowerCase().includes(q)) return false;
    }
    return true;
  });
}

function sortRows(rows) {
  return [...rows].sort((a, b) => {
    const da = daysUntil(a.nextInspection);
    const db = daysUntil(b.nextInspection);
    if (da === null && db === null) return 0;
    if (da === null) return 1;
    if (db === null) return -1;
    return da - db;
  });
}

function renderChips() {
  const chips = [];
  if (state.location) chips.push({ key: "location", label: `Location: ${state.location}` });
  if (state.status) chips.push({ key: "status", label: `Status: ${statusMeta[state.status].label}` });
  if (state.search) chips.push({ key: "search", label: `Search: "${state.search}"` });

  const chipsRow = document.getElementById("chipsRow");
  if (!chips.length) { chipsRow.innerHTML = ""; return; }
  chipsRow.innerHTML = chips
    .map(
      (c) =>
        `<span class="inline-flex items-center gap-1 h-6 rounded-full bg-slate-100 text-slate-700 px-2 text-xs font-medium">${c.label}<button data-clear="${c.key}" class="ml-1 text-slate-500 hover:text-slate-800" aria-label="Remove filter ${c.label}">&times;</button></span>`
    )
    .join("") +
    `<button id="clearAllChips" class="text-xs text-blue-700 font-medium hover:underline">Clear all</button>`;

  chipsRow.querySelectorAll("[data-clear]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const key = btn.getAttribute("data-clear");
      if (key === "location") { state.location = ""; document.getElementById("locationFilter").value = ""; }
      if (key === "status") { state.status = ""; document.getElementById("statusFilter").value = ""; }
      if (key === "search") { state.search = ""; document.getElementById("searchInput").value = ""; }
      render();
    });
  });
  const clearAll = document.getElementById("clearAllChips");
  if (clearAll) clearAll.addEventListener("click", clearAllFilters);
}

function clearAllFilters() {
  state.location = ""; state.status = ""; state.search = "";
  document.getElementById("locationFilter").value = "";
  document.getElementById("statusFilter").value = "";
  document.getElementById("searchInput").value = "";
  render();
}

function render() {
  const filtered = sortRows(applyFilters());
  const tbody = document.getElementById("tableBody");
  const summaryLine = document.getElementById("summaryLine");
  const paginationSummary = document.getElementById("paginationSummary");

  renderChips();

  if (equipment.length === 0) {
    tbody.innerHTML = `<tr><td colspan="7" class="px-3 py-10 text-center text-slate-600">No equipment yet. Add your first machine to start tracking maintenance.<br><button class="mt-3 h-8 px-3 rounded bg-blue-700 text-white text-sm font-medium">Add equipment</button></td></tr>`;
    summaryLine.textContent = "0 machines";
    paginationSummary.textContent = "0 of 0";
    return;
  }

  if (filtered.length === 0) {
    tbody.innerHTML = `<tr><td colspan="7" class="px-3 py-10 text-center text-slate-600">No machines match these filters.<br><button id="clearFiltersBtn" class="mt-3 h-8 px-3 rounded border border-slate-300 bg-white text-sm font-medium hover:bg-slate-50">Clear filters</button></td></tr>`;
    document.getElementById("clearFiltersBtn").addEventListener("click", clearAllFilters);
    summaryLine.textContent = "0 machines";
    paginationSummary.textContent = "0 of 0";
    return;
  }

  summaryLine.textContent = `${filtered.length} machine${filtered.length === 1 ? "" : "s"}`;
  paginationSummary.textContent = `1–${filtered.length} of ${filtered.length}`;

  tbody.innerHTML = filtered
    .map((e) => {
      const sm = statusMeta[e.status];
      return `
      <tr class="h-10 border-b border-slate-100 last:border-b-0 hover:bg-slate-50">
        <td class="px-3 py-2.5">
          <a href="#" class="font-medium text-blue-700 hover:underline">${e.name}</a>
          <div class="text-xs text-slate-500">${e.id}</div>
        </td>
        <td class="px-3 py-2.5 text-slate-700">${e.location}</td>
        <td class="px-3 py-2.5">
          <span class="inline-flex h-6 items-center rounded-full ${sm.classes} px-2 text-xs leading-5 font-medium">${sm.label}</span>
        </td>
        <td class="px-3 py-2.5 text-slate-700">${formatDate(e.lastService)}</td>
        <td class="px-3 py-2.5 text-slate-700">${formatDate(e.nextInspection)}${inspectionBadge(e.nextInspection)}</td>
        <td class="px-3 py-2.5 text-right tabular-nums text-slate-700">${e.hours.toLocaleString("en-GB")}</td>
        <td class="px-3 py-2.5 text-right">
          <button class="h-8 w-8 inline-flex items-center justify-center rounded hover:bg-slate-100 text-slate-500" aria-label="Actions for ${e.name}">&#8943;</button>
        </td>
      </tr>`;
    })
    .join("");
}

document.querySelectorAll(".tab-btn").forEach((btn) => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach((b) => {
      b.classList.remove("border-blue-700", "text-blue-700");
      b.classList.add("border-transparent", "text-slate-600");
      b.setAttribute("aria-selected", "false");
    });
    btn.classList.remove("border-transparent", "text-slate-600");
    btn.classList.add("border-blue-700", "text-blue-700");
    btn.setAttribute("aria-selected", "true");
    state.tab = btn.dataset.tab;
    render();
  });
});

document.getElementById("searchInput").addEventListener("input", (e) => {
  state.search = e.target.value;
  render();
});
document.getElementById("locationFilter").addEventListener("change", (e) => {
  state.location = e.target.value;
  render();
});
document.getElementById("statusFilter").addEventListener("change", (e) => {
  state.status = e.target.value;
  render();
});

render();
</script>
</body>
