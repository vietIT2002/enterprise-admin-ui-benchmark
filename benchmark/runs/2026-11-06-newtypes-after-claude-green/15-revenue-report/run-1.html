<script>
(function(){
  "use strict";

  /* ---------- names & data generation ---------- */
  const CUSTOMERS = [
    "Harborview Logistics Inc.", "Pinebridge Manufacturing Co.", "Solstice Retail Group",
    "NorthPeak Construction LLC", "BlueGrass Foods & Beverage", "Alder & Finch Consulting",
    "Cedarline Transport Co.", "Meridian Health Partners", "Granite State Realty",
    "Summit Ridge Hospitality", "Clearwater Energy Solutions", "Vantage Point Media",
    "Redstone Industrial Supply", "Juniper Lane Boutique"
  ];
  const PRODUCTS = [
    "Accounting Pro – Annual License", "Payroll Management Add-on", "Multi-Currency Module",
    "Bank Reconciliation Add-on", "Advanced Reporting Suite", "Tax Filing Service",
    "Priority Support Plan", "API & Integrations Access", "Mobile App Add-on",
    "Audit Trail & Compliance Module", "Onboarding & Training Package", "Inventory & COGS Module"
  ];

  const MONTH_NAMES = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const MONTH_FULL = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const START_YEAR = 2024, START_MONTH = 0, NUM_MONTHS = 35;
  function monthMeta(idx){
    const y = START_YEAR + Math.floor((START_MONTH + idx) / 12);
    const m = (START_MONTH + idx) % 12;
    return { idx, year: y, month: m, key: y + "-" + String(m + 1).padStart(2, "0") };
  }
  const MONTHS = Array.from({ length: NUM_MONTHS }, (_, i) => monthMeta(i));
  const LATEST_IDX = NUM_MONTHS - 1; // Nov 2026

  function seasonal(m){ if (m === 10 || m === 11) return 1.12; if (m === 1) return 0.92; if (m === 6 || m === 7) return 0.95; return 1.0; }
  const BASE = 380000, GROWTH = 0.006;
  const TOTAL = MONTHS.map(mm => {
    const g = BASE * Math.pow(1 + GROWTH, mm.idx);
    const s = seasonal(mm.month);
    const noise = 1 + (Math.random() - 0.5) * 0.06;
    return Math.round(g * s * noise / 100) * 100;
  });

  function makeShares(n){
    const raw = Array.from({ length: n }, (_, i) => 1 / (i + 2));
    const sum = raw.reduce((a, b) => a + b, 0);
    return raw.map(r => r / sum);
  }
  const CUSTOMER_SHARE = makeShares(CUSTOMERS.length);
  const PRODUCT_SHARE = makeShares(PRODUCTS.length);

  /* ---------- formatters ---------- */
  const nfAmount = new Intl.NumberFormat("en-US", { maximumFractionDigits: 0 });
  const nfMoney = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 });
  const nfDelta = new Intl.NumberFormat("en-US", { style: "percent", signDisplay: "exceptZero", maximumFractionDigits: 1 });
  const nfShare = new Intl.NumberFormat("en-US", { style: "percent", maximumFractionDigits: 1 });
  function fmtAmount(v){ return nfAmount.format(Math.round(v)); }
  function fmtMoneySymbol(v){ return nfMoney.format(Math.round(v)); }
  function fmtDelta(v){ return v == null ? "—" : nfDelta.format(v); }
  function fmtShare(v){ return nfShare.format(v); }
  function fmtInt(v){ return nfAmount.format(v); }
  function compactMoney(v){ return "$" + new Intl.NumberFormat("en-US", { notation: "compact", maximumFractionDigits: 1 }).format(v); }
  function deltaClass(v){ if (v == null) return "text-slate-400"; if (v > 0) return "text-emerald-700"; if (v < 0) return "text-red-700"; return "text-slate-600"; }
  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
  function abbrevLabel(idx){ const m = MONTHS[idx]; return MONTH_NAMES[m.month] + " " + m.year; }
  function fullLabel(idx){ const m = MONTHS[idx]; return MONTH_FULL[m.month] + " " + m.year; }

  /* ---------- period math ---------- */
  function idxForKey(key){ const f = MONTHS.find(m => m.key === key); return f ? f.idx : null; }
  function presetMonths(preset, customFrom, customTo){
    if (preset === "this-month") return [LATEST_IDX];
    if (preset === "last-month") return [LATEST_IDX - 1];
    if (preset === "this-quarter"){
      const latestMonth = MONTHS[LATEST_IDX].month;
      const qStart = Math.floor(latestMonth / 3) * 3;
      const n = latestMonth - qStart + 1;
      return Array.from({ length: n }, (_, k) => LATEST_IDX - n + 1 + k);
    }
    if (preset === "this-year"){
      const n = MONTHS[LATEST_IDX].month + 1;
      return Array.from({ length: n }, (_, k) => LATEST_IDX - n + 1 + k);
    }
    if (preset === "custom"){
      const a = idxForKey(customFrom), b = idxForKey(customTo);
      if (a == null || b == null || a > b) return null;
      return Array.from({ length: b - a + 1 }, (_, k) => a + k);
    }
    return null;
  }
  function previousMonths(curr){ if (!curr || !curr.length) return null; const n = curr.length, start = curr[0] - n; return Array.from({ length: n }, (_, k) => start + k); }
  function lastYearMonths(curr){ if (!curr) return null; return curr.map(i => i - 12); }
  function sumTotal(idxArr){ if (!idxArr) return null; for (const i of idxArr) if (i < 0 || i > LATEST_IDX) return null; return idxArr.reduce((a, i) => a + TOTAL[i], 0); }
  function baseLabel(idxArr){ if (!idxArr) return null; return idxArr.length === 1 ? abbrevLabel(idxArr[0]) : abbrevLabel(idxArr[0]) + "–" + abbrevLabel(idxArr[idxArr.length - 1]); }
  function periodLabel(preset, curr){
    if (!curr) return "Custom range";
    if (preset === "custom") return fullLabel(curr[0]) + " – " + fullLabel(curr[curr.length - 1]);
    if (preset === "this-month" || preset === "last-month") return fullLabel(curr[0]);
    if (preset === "this-quarter"){ const last = MONTHS[curr[curr.length - 1]]; const q = Math.floor(last.month / 3) + 1; return "Q" + q + " " + last.year + " (through " + MONTH_FULL[last.month] + ")"; }
    if (preset === "this-year"){ const last = MONTHS[curr[curr.length - 1]]; return last.year + " (through " + MONTH_FULL[last.month] + ")"; }
    return "";
  }
  function periodSlug(curr){ if (!curr) return "custom"; return curr.length === 1 ? MONTHS[curr[0]].key : MONTHS[curr[0]].key + "_" + MONTHS[curr[curr.length - 1]].key; }

  /* ---------- row computation (factorized customer x product model) ---------- */
  function computeRows(dim, curr, prev, ly, customerFilter, productFilter){
    const names = dim === "customer" ? CUSTOMERS : PRODUCTS;
    const shares = dim === "customer" ? CUSTOMER_SHARE : PRODUCT_SHARE;
    const otherShares = dim === "customer" ? PRODUCT_SHARE : CUSTOMER_SHARE;
    const otherFilter = dim === "customer" ? productFilter : customerFilter;
    const thisFilter = dim === "customer" ? customerFilter : productFilter;

    const otherMult = (otherFilter && otherFilter.size > 0)
      ? otherShares.reduce((s, sh, idx) => s + (otherFilter.has(idx) ? sh : 0), 0)
      : 1;
    const idxs = names.map((_, i) => i).filter(i => !thisFilter || thisFilter.size === 0 || thisFilter.has(i));
    const thisMult = (thisFilter && thisFilter.size > 0) ? idxs.reduce((s, i) => s + shares[i], 0) : 1;

    const currTotal = sumTotal(curr), prevTotal = sumTotal(prev), lyTotal = sumTotal(ly);

    const rows = idxs.map(i => {
      const revenue = currTotal == null ? 0 : currTotal * shares[i] * otherMult;
      const prevRevenue = prevTotal == null ? null : prevTotal * shares[i] * otherMult;
      const lyRevenue = lyTotal == null ? null : lyTotal * shares[i] * otherMult;
      return {
        idx: i, name: names[i], revenue,
        vsPrev: prevRevenue ? (revenue - prevRevenue) / prevRevenue : null,
        vsLy: lyRevenue ? (revenue - lyRevenue) / lyRevenue : null,
        share: 0
      };
    });
    const grandTotal = currTotal == null ? 0 : currTotal * otherMult * thisMult;
    const prevGrandTotal = prevTotal == null ? null : prevTotal * otherMult * thisMult;
    const lyGrandTotal = lyTotal == null ? null : lyTotal * otherMult * thisMult;
    rows.forEach(r => { r.share = grandTotal > 0 ? r.revenue / grandTotal : 0; });
    return { rows, grandTotal, prevGrandTotal, lyGrandTotal };
  }
  function sortRows(rows, sort){
    const arr = rows.slice();
    arr.sort((a, b) => {
      if (sort.key === "name") return sort.dir === "asc" ? a.name.localeCompare(b.name) : b.name.localeCompare(a.name);
      const av = a[sort.key], bv = b[sort.key];
      if (av == null && bv == null) return 0;
      if (av == null) return 1;
      if (bv == null) return -1;
      return sort.dir === "asc" ? av - bv : bv - av;
    });
    return arr;
  }

  /* ---------- state ---------- */
  const STATE_PARAM = new URLSearchParams(window.location.search).get("state");
  let firstLoadDone = (STATE_PARAM === "error" || STATE_PARAM === "empty");
  const state = {
    preset: "this-month",
    customFrom: null, customTo: null,
    customerFilter: new Set(),
    productFilter: new Set(),
    activeTab: "customer",
    sort: { customer: { key: "revenue", dir: "desc" }, product: { key: "revenue", dir: "desc" } },
    forcedState: STATE_PARAM
  };
  const lastRendered = { customer: null, product: null };
  let customerSearch = "", productSearch = "";

  /* ---------- popovers ---------- */
  function closeAllPopovers(){
    document.querySelectorAll("[data-popover-panel]").forEach(p => { p.hidden = true; });
    document.querySelectorAll("[aria-haspopup]").forEach(b => b.setAttribute("aria-expanded", "false"));
  }
  function setupPopover(btnId, panelId){
    const btn = document.getElementById(btnId), panel = document.getElementById(panelId);
    btn.addEventListener("click", e => {
      e.stopPropagation();
      const willOpen = panel.hidden;
      closeAllPopovers();
      if (willOpen){ panel.hidden = false; btn.setAttribute("aria-expanded", "true"); }
    });
    panel.addEventListener("click", e => e.stopPropagation());
  }
  document.addEventListener("click", closeAllPopovers);
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeAllPopovers(); });

  /* ---------- multi-select checklist ---------- */
  function renderCheckList(container, items, selectedSet, searchTerm, onToggle){
    const q = searchTerm.trim().toLowerCase();
    container.innerHTML = "";
    let any = false;
    items.forEach((name, i) => {
      if (q && !name.toLowerCase().includes(q)) return;
      any = true;
      const row = document.createElement("label");
      row.className = "flex h-8 items-center gap-2 rounded px-2 text-sm hover:bg-slate-50 cursor-pointer";
      const checked = selectedSet.has(i) ? "checked" : "";
      row.innerHTML = '<input type="checkbox" class="size-4 rounded border-slate-300 text-blue-700 focus-visible:ring-2 focus-visible:ring-blue-600" ' + checked + '><span class="truncate">' + escapeHtml(name) + "</span>";
      row.querySelector("input").addEventListener("change", e => onToggle(i, e.target.checked));
      container.appendChild(row);
    });
    if (!any) container.innerHTML = '<p class="px-2 py-4 text-center text-xs text-slate-500">No matches</p>';
  }
  function initCustomerFilter(){
    const onToggle = (i, checked) => { if (checked) state.customerFilter.add(i); else state.customerFilter.delete(i); recomputeAndRender(); };
    renderCheckList(document.getElementById("list-customer"), CUSTOMERS, state.customerFilter, customerSearch, onToggle);
    document.getElementById("search-customer").addEventListener("input", e => {
      customerSearch = e.target.value;
      renderCheckList(document.getElementById("list-customer"), CUSTOMERS, state.customerFilter, customerSearch, onToggle);
    });
    document.getElementById("clear-customer").addEventListener("click", () => { state.customerFilter.clear(); initCustomerFilter(); recomputeAndRender(); });
  }
  function initProductFilter(){
    const onToggle = (i, checked) => { if (checked) state.productFilter.add(i); else state.productFilter.delete(i); recomputeAndRender(); };
    renderCheckList(document.getElementById("list-product"), PRODUCTS, state.productFilter, productSearch, onToggle);
    document.getElementById("search-product").addEventListener("input", e => {
      productSearch = e.target.value;
      renderCheckList(document.getElementById("list-product"), PRODUCTS, state.productFilter, productSearch, onToggle);
    });
    document.getElementById("clear-product").addEventListener("click", () => { state.productFilter.clear(); initProductFilter(); recomputeAndRender(); });
  }
  function updateFilterTriggerLabels(){
    document.querySelector("#btn-filter-customer [data-label]").textContent = state.customerFilter.size ? "Customer · " + state.customerFilter.size : "Customer";
    document.querySelector("#btn-filter-product [data-label]").textContent = state.productFilter.size ? "Product · " + state.productFilter.size : "Product";
  }

  /* ---------- chips ---------- */
  function renderChips(){
    const chipsEl = document.getElementById("chips");
    const chips = [];
    state.customerFilter.forEach(i => chips.push({ type: "customer", idx: i, label: "Customer: " + CUSTOMERS[i] }));
    state.productFilter.forEach(i => chips.push({ type: "product", idx: i, label: "Product: " + PRODUCTS[i] }));
    if (chips.length === 0){ chipsEl.innerHTML = ""; return; }
    chipsEl.innerHTML = chips.map(c =>
      '<span class="inline-flex h-6 items-center gap-1 rounded-full border border-slate-200 bg-slate-50 pl-2 pr-1 text-xs font-medium text-slate-700">' +
        escapeHtml(c.label) +
        '<button type="button" aria-label="Remove filter ' + escapeHtml(c.label) + '" data-chip-type="' + c.type + '" data-chip-idx="' + c.idx + '" class="chip-remove inline-flex size-5 items-center justify-center rounded-full hover:bg-slate-200"><svg class="size-3.5"><use href="#i-x"/></svg></button>' +
      "</span>"
    ).join("") + '<button id="clear-all-chips" type="button" class="text-xs font-medium text-blue-700 hover:underline">Clear all</button>';
    chipsEl.querySelectorAll(".chip-remove").forEach(btn => {
      btn.addEventListener("click", () => {
        const type = btn.dataset.chipType, idx = Number(btn.dataset.chipIdx);
        (type === "customer" ? state.customerFilter : state.productFilter).delete(idx);
        initCustomerFilter(); initProductFilter();
        recomputeAndRender();
      });
    });
    document.getElementById("clear-all-chips").addEventListener("click", () => {
      state.customerFilter.clear(); state.productFilter.clear();
      initCustomerFilter(); initProductFilter();
      recomputeAndRender();
    });
  }

  /* ---------- table rendering ---------- */
  function thSort(dim, key, label, align){
    const active = state.sort[dim].key === key;
    const dir = active ? state.sort[dim].dir : null;
    const ariaSort = dir === "asc" ? "ascending" : dir === "desc" ? "descending" : null;
    const icon = dir ? '<svg class="size-3.5"><use href="#i-chevron-' + (dir === "asc" ? "up" : "down") + '"/></svg>' : "";
    const thAttr = ariaSort ? ' aria-sort="' + ariaSort + '"' : "";
    if (align === "right"){
      return '<th class="px-3 py-2.5 text-right font-medium text-slate-600"' + thAttr + '><button type="button" data-sort-dim="' + dim + '" data-sort-key="' + key + '" class="inline-flex flex-row-reverse items-center gap-1 text-right hover:text-slate-900">' + label + icon + "</button></th>";
    }
    return '<th class="px-3 py-2.5 text-left font-medium text-slate-600"' + thAttr + '><button type="button" data-sort-dim="' + dim + '" data-sort-key="' + key + '" class="inline-flex items-center gap-1 hover:text-slate-900">' + label + icon + "</button></th>";
  }
  function buildTheadHtml(dim, nameLabel, prevLabel, lyLabel){
    return "<tr>" +
      thSort(dim, "name", nameLabel, "left") +
      thSort(dim, "revenue", "Revenue (USD)", "right") +
      thSort(dim, "vsPrev", prevLabel ? ("vs " + prevLabel) : "vs prior period", "right") +
      thSort(dim, "vsLy", lyLabel ? ("vs " + lyLabel) : "vs last year", "right") +
      thSort(dim, "share", "Share", "right") +
      "</tr>";
  }
  function attachSortHandlers(dim){
    document.querySelectorAll('#thead-' + dim + ' [data-sort-dim="' + dim + '"]').forEach(btn => {
      btn.addEventListener("click", () => onHeaderClick(dim, btn.dataset.sortKey));
    });
  }
  function onHeaderClick(dim, col){
    const s = state.sort[dim];
    if (s.key !== col) state.sort[dim] = { key: col, dir: "asc" };
    else if (s.dir === "asc") state.sort[dim] = { key: col, dir: "desc" };
    else state.sort[dim] = { key: "revenue", dir: "desc" };
    recomputeAndRender();
  }
  function skeletonRowsHtml(n){
    let html = "";
    for (let r = 0; r < n; r++){
      html += '<tr class="h-10">' +
        '<td class="px-3 py-2.5"><div class="h-4 w-36 animate-pulse rounded bg-slate-200"></div></td>' +
        '<td class="px-3 py-2.5"><div class="ml-auto h-4 w-20 animate-pulse rounded bg-slate-200"></div></td>' +
        '<td class="px-3 py-2.5"><div class="ml-auto h-4 w-14 animate-pulse rounded bg-slate-200"></div></td>' +
        '<td class="px-3 py-2.5"><div class="ml-auto h-4 w-14 animate-pulse rounded bg-slate-200"></div></td>' +
        '<td class="px-3 py-2.5"><div class="ml-auto h-4 w-12 animate-pulse rounded bg-slate-200"></div></td>' +
      "</tr>";
    }
    return html;
  }
  function errorRowHtml(dim){
    return '<tr><td colspan="5" class="px-3 py-10 text-center">' +
      '<svg class="mx-auto size-6 text-slate-400"><use href="#i-alert"/></svg>' +
      '<p class="mt-2 text-sm text-slate-700">Couldn’t load revenue data. Check your connection and try again.</p>' +
      '<button id="retry-' + dim + '" type="button" class="mt-3 inline-flex h-8 items-center rounded-md border border-slate-300 px-3 text-sm font-medium hover:bg-slate-50">Retry</button>' +
      "</td></tr>";
  }
  function emptyRowHtml(dim, message){
    return '<tr><td colspan="5" class="px-3 py-10 text-center">' +
      '<svg class="mx-auto size-6 text-slate-400"><use href="#i-inbox"/></svg>' +
      '<p class="mt-2 text-sm text-slate-700">' + escapeHtml(message) + "</p>" +
      '<button id="change-period-' + dim + '" type="button" class="mt-3 inline-flex h-8 items-center rounded-md border border-slate-300 px-3 text-sm font-medium hover:bg-slate-50">Change period</button>' +
      "</td></tr>";
  }
  function wireRetry(dim){ document.getElementById("retry-" + dim).addEventListener("click", () => { state.forcedState = null; firstLoadDone = true; recomputeAndRender(); }); }
  function wireChangePeriod(dim){
    document.getElementById("change-period-" + dim).addEventListener("click", () => {
      state.preset = "this-month"; state.forcedState = null; firstLoadDone = true;
      updatePresetButtons(); recomputeAndRender();
    });
  }

  function renderTable(dim, data, curr, prev, ly){
    const thead = document.getElementById("thead-" + dim);
    const tbody = document.getElementById("tbody-" + dim);
    const tfoot = document.getElementById("tfoot-" + dim);
    const summaryEl = document.getElementById("summary-" + dim);
    const announceEl = document.getElementById("announce-" + dim);
    const nameLabel = dim === "customer" ? "Customer" : "Product";
    const prevLabel = baseLabel(prev), lyLabel = baseLabel(ly);

    thead.innerHTML = buildTheadHtml(dim, nameLabel, prevLabel, lyLabel);
    attachSortHandlers(dim);

    if (state.forcedState === "loading"){
      tbody.setAttribute("aria-busy", "true");
      tbody.innerHTML = skeletonRowsHtml(6); tfoot.innerHTML = ""; summaryEl.textContent = "";
      return;
    }
    tbody.removeAttribute("aria-busy");
    if (state.forcedState === "error"){
      tbody.innerHTML = errorRowHtml(dim); tfoot.innerHTML = ""; summaryEl.textContent = "";
      wireRetry(dim); return;
    }
    if (state.forcedState === "empty" || curr === null){
      const msg = curr ? ("No revenue recorded for " + periodLabel(state.preset, curr) + ".") : "Select a valid date range.";
      tbody.innerHTML = emptyRowHtml(dim, msg); tfoot.innerHTML = ""; summaryEl.textContent = "";
      wireChangePeriod(dim); return;
    }
    if (!firstLoadDone){
      tbody.setAttribute("aria-busy", "true");
      tbody.innerHTML = skeletonRowsHtml(6); tfoot.innerHTML = "";
      return;
    }

    const sorted = sortRows(data.rows, state.sort[dim]);
    lastRendered[dim] = { rows: sorted, totals: data, prevLabel, lyLabel, curr };

    tbody.innerHTML = sorted.map(r =>
      '<tr class="h-10 hover:bg-slate-50">' +
        '<td class="px-3 py-2.5 text-slate-900">' + escapeHtml(r.name) + "</td>" +
        '<td class="px-3 py-2.5 text-right tabular-nums">' + fmtAmount(r.revenue) + "</td>" +
        '<td class="px-3 py-2.5 text-right tabular-nums ' + deltaClass(r.vsPrev) + '">' + fmtDelta(r.vsPrev) + "</td>" +
        '<td class="px-3 py-2.5 text-right tabular-nums ' + deltaClass(r.vsLy) + '">' + fmtDelta(r.vsLy) + "</td>" +
        '<td class="px-3 py-2.5 text-right tabular-nums text-slate-600">' + fmtShare(r.share) + "</td>" +
      "</tr>"
    ).join("");

    const totalVsPrev = data.prevGrandTotal ? (data.grandTotal - data.prevGrandTotal) / data.prevGrandTotal : null;
    const totalVsLy = data.lyGrandTotal ? (data.grandTotal - data.lyGrandTotal) / data.lyGrandTotal : null;
    tfoot.innerHTML = '<tr class="h-10 border-t-2 border-slate-300 font-medium">' +
      '<td class="px-3 py-2.5">Total</td>' +
      '<td class="px-3 py-2.5 text-right tabular-nums">' + fmtAmount(data.grandTotal) + "</td>" +
      '<td class="px-3 py-2.5 text-right tabular-nums ' + deltaClass(totalVsPrev) + '">' + fmtDelta(totalVsPrev) + "</td>" +
      '<td class="px-3 py-2.5 text-right tabular-nums ' + deltaClass(totalVsLy) + '">' + fmtDelta(totalVsLy) + "</td>" +
      '<td class="px-3 py-2.5 text-right tabular-nums">100.0%</td>' +
      "</tr>";

    const count = sorted.length;
    const entity = dim === "customer" ? (count === 1 ? "customer" : "customers") : (count === 1 ? "product" : "products");
    summaryEl.textContent = fmtInt(count) + " " + entity + " · " + fmtMoneySymbol(data.grandTotal) + " total revenue";
    announceEl.textContent = fmtInt(count) + " " + entity + " shown";
  }

  /* ---------- chart ---------- */
  function renderChart(){
    const n = 12, startIdx = LATEST_IDX - n + 1;
    const points = Array.from({ length: n }, (_, k) => ({ idx: startIdx + k, value: TOTAL[startIdx + k] }));
    const w = 760, h = 180, padL = 60, padR = 12, padT = 12, padB = 26;
    const innerW = w - padL - padR, innerH = h - padT - padB;
    const vals = points.map(p => p.value);
    const min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    const domainMin = Math.floor(min * 0.92 / 10000) * 10000;
    const domainMax = Math.ceil(max * 1.05 / 10000) * 10000;
    const x = i => padL + (innerW * i) / (n - 1);
    const y = v => padT + innerH - (innerH * (v - domainMin)) / (domainMax - domainMin);
    const path = points.map((p, i) => (i === 0 ? "M" : "L") + x(i).toFixed(1) + "," + y(p.value).toFixed(1)).join(" ");
    let gridLines = "";
    [0, 0.5, 1].forEach(f => {
      const v = domainMin + (domainMax - domainMin) * f;
      const yy = y(v);
      gridLines += '<line x1="' + padL + '" y1="' + yy + '" x2="' + (w - padR) + '" y2="' + yy + '" stroke="#e2e8f0" stroke-width="1"/>' +
        '<text x="' + (padL - 8) + '" y="' + (yy + 4) + '" text-anchor="end" font-size="11" fill="#64748b">' + compactMoney(v) + "</text>";
    });
    let labels = "";
    points.forEach((p, i) => {
      const m = MONTHS[p.idx];
      labels += '<text x="' + x(i) + '" y="' + (h - 6) + '" text-anchor="middle" font-size="11" fill="#64748b">' + MONTH_NAMES[m.month] + "</text>";
    });
    const dots = '<circle cx="' + x(0) + '" cy="' + y(points[0].value) + '" r="3" fill="#1d4ed8"/><circle cx="' + x(n - 1) + '" cy="' + y(points[n - 1].value) + '" r="3" fill="#1d4ed8"/>';
    const first = points[0].value, last = points[n - 1].value;
    const pct = (last - first) / first;
    const pctFmt = new Intl.NumberFormat("en-US", { style: "percent", signDisplay: "exceptZero", maximumFractionDigits: 1 }).format(pct);
    const summary = "Revenue " + (pct >= 0 ? "rose" : "fell") + " from " + fmtMoneySymbol(first) + " to " + fmtMoneySymbol(last) + " over the past 12 months (" + pctFmt + ").";

    const svg = document.getElementById("chart-svg");
    svg.setAttribute("viewBox", "0 0 " + w + " " + h);
    svg.setAttribute("role", "img");
    svg.setAttribute("aria-label", summary);
    svg.innerHTML = gridLines + '<path d="' + path + '" fill="none" stroke="#1d4ed8" stroke-width="2.5"/>' + dots + labels;
    document.getElementById("chart-summary").textContent = summary;

    const tbl = document.getElementById("chart-table");
    tbl.innerHTML = '<thead><tr><th class="px-3 py-2 text-left text-xs font-medium text-slate-600">Month</th><th class="px-3 py-2 text-right text-xs font-medium text-slate-600">Revenue (USD)</th></tr></thead><tbody>' +
      points.map(p => '<tr class="border-t border-slate-200"><td class="px-3 py-2 tabular-nums">' + abbrevLabel(p.idx) + '</td><td class="px-3 py-2 text-right tabular-nums">' + fmtAmount(p.value) + "</td></tr>").join("") +
      "</tbody>";
  }

  /* ---------- export ---------- */
  function pct1(v){ return (v * 100).toFixed(1) + "%"; }
  function csvEscape(v){ const s = String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
  function triggerDownload(blob, filename){
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  function downloadCsv(base, header, body, totals){
    const lines = [header.map(csvEscape).join(","), ...body.map(r => r.map(csvEscape).join(",")), totals.map(csvEscape).join(",")];
    triggerDownload(new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv;charset=utf-8;" }), base + ".csv");
  }
  function downloadXls(base, header, body, totals){
    let html = "<table><thead><tr>" + header.map(h => "<th>" + escapeHtml(h) + "</th>").join("") + "</tr></thead><tbody>" +
      body.map(r => "<tr>" + r.map(c => "<td>" + escapeHtml(c) + "</td>").join("") + "</tr>").join("") +
      "</tbody><tfoot><tr>" + totals.map(c => "<td><b>" + escapeHtml(c) + "</b></td>").join("") + "</tr></tfoot></table>";
    triggerDownload(new Blob(["﻿" + html], { type: "application/vnd.ms-excel" }), base + ".xls");
  }
  function doExport(kind){
    const dim = state.activeTab;
    const data = lastRendered[dim];
    if (!data) return;
    const nameLabel = dim === "customer" ? "Customer" : "Product";
    const header = [nameLabel, "Revenue (USD)", "vs " + (data.prevLabel || "prior period"), "vs " + (data.lyLabel || "last year"), "Share"];
    const body = data.rows.map(r => [r.name, Math.round(r.revenue), r.vsPrev == null ? "" : pct1(r.vsPrev), r.vsLy == null ? "" : pct1(r.vsLy), pct1(r.share)]);
    const totalVsPrev = data.totals.prevGrandTotal ? (data.totals.grandTotal - data.totals.prevGrandTotal) / data.totals.prevGrandTotal : null;
    const totalVsLy = data.totals.lyGrandTotal ? (data.totals.grandTotal - data.totals.lyGrandTotal) / data.totals.lyGrandTotal : null;
    const totals = ["Total", Math.round(data.totals.grandTotal), totalVsPrev == null ? "" : pct1(totalVsPrev), totalVsLy == null ? "" : pct1(totalVsLy), "100.0%"];
    const base = "revenue-by-" + dim + "-" + periodSlug(data.curr);
    if (kind === "csv") downloadCsv(base, header, body, totals); else downloadXls(base, header, body, totals);
  }

  /* ---------- orchestration ---------- */
  function renderHeader(curr){ document.getElementById("period-title").textContent = curr ? periodLabel(state.preset, curr) : "Custom range"; }
  function recomputeAndRender(){
    const curr = state.preset === "custom" ? presetMonths("custom", state.customFrom, state.customTo) : presetMonths(state.preset);
    const prev = previousMonths(curr), ly = lastYearMonths(curr);
    const custData = computeRows("customer", curr, prev, ly, state.customerFilter, state.productFilter);
    const prodData = computeRows("product", curr, prev, ly, state.customerFilter, state.productFilter);
    renderHeader(curr);
    renderChips();
    updateFilterTriggerLabels();
    renderTable("customer", custData, curr, prev, ly);
    renderTable("product", prodData, curr, prev, ly);
  }
  function updatePresetButtons(){
    document.querySelectorAll(".preset-btn").forEach(btn => {
      const active = btn.dataset.preset === state.preset;
      btn.className = "preset-btn h-8 rounded px-3 text-sm font-medium " + (active ? "bg-white text-slate-900 shadow-sm" : "text-slate-600 hover:text-slate-900");
      btn.setAttribute("aria-pressed", active ? "true" : "false");
    });
  }
  function tabBtnClass(active){ return "tab-btn -mb-px border-b-2 px-3 py-2 text-sm font-medium " + (active ? "border-blue-700 text-blue-700" : "border-transparent text-slate-600 hover:text-slate-900"); }
  function selectTab(tab){
    state.activeTab = tab;
    ["customer", "product"].forEach(d => {
      const btn = document.getElementById("tab-" + d), panel = document.getElementById("panel-" + d + "-tab");
      const active = d === tab;
      btn.setAttribute("aria-selected", active ? "true" : "false");
      btn.className = tabBtnClass(active);
      panel.hidden = !active;
    });
  }

  /* ---------- wire up ---------- */
  document.querySelectorAll(".preset-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      state.preset = btn.dataset.preset;
      document.getElementById("custom-range").hidden = state.preset !== "custom";
      if (state.preset === "custom" && !state.customFrom){
        state.customFrom = MONTHS[LATEST_IDX - 2].key; state.customTo = MONTHS[LATEST_IDX].key;
        document.getElementById("custom-from").value = state.customFrom;
        document.getElementById("custom-to").value = state.customTo;
      }
      updatePresetButtons();
      recomputeAndRender();
    });
  });
  document.getElementById("custom-from").addEventListener("change", e => { state.customFrom = e.target.value; recomputeAndRender(); });
  document.getElementById("custom-to").addEventListener("change", e => { state.customTo = e.target.value; recomputeAndRender(); });

  document.getElementById("tab-customer").addEventListener("click", () => selectTab("customer"));
  document.getElementById("tab-product").addEventListener("click", () => selectTab("product"));

  setupPopover("btn-filter-customer", "panel-customer");
  setupPopover("btn-filter-product", "panel-product");
  setupPopover("btn-export", "export-menu");
  document.getElementById("export-csv").addEventListener("click", () => { doExport("csv"); closeAllPopovers(); });
  document.getElementById("export-xls").addEventListener("click", () => { doExport("xls"); closeAllPopovers(); });
  document.getElementById("btn-print").addEventListener("click", () => window.print());

  document.getElementById("toggle-chart-table").addEventListener("click", () => {
    const chartWrap = document.getElementById("chart-wrap"), tableWrap = document.getElementById("chart-table-wrap"), btn = document.getElementById("toggle-chart-table");
    const showingChart = !chartWrap.hidden;
    chartWrap.hidden = showingChart; tableWrap.hidden = !showingChart;
    btn.textContent = showingChart ? "Show chart" : "Show table";
  });

  initCustomerFilter();
  initProductFilter();
  updatePresetButtons();
  selectTab("customer");
  renderChart();
  recomputeAndRender();
  if (!STATE_PARAM){
    setTimeout(() => { firstLoadDone = true; recomputeAndRender(); }, 450);
  }
})();
</script>
</body>
</html>
