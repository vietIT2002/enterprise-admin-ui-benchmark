<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pipeline bán hàng · Quý 4/2026</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  [hidden] { display: none !important; }
  html, body { background:#f8fafc; color:#0f172a; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height:1.43; }
  * { box-sizing: border-box; }
  .tabular-nums { font-variant-numeric: tabular-nums; }
  .skeleton { background: linear-gradient(90deg,#e2e8f0 25%,#eef2f7 37%,#e2e8f0 63%); background-size: 400% 100%; animation: shimmer 1.4s ease infinite; border-radius: 4px; }
  @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }
  details > summary { list-style: none; cursor: pointer; }
  details > summary::-webkit-details-marker { display: none; }
  .dropdown-panel { position:absolute; z-index:30; margin-top:4px; }
  @page { size: A4 landscape; margin: 12mm; }
  @media print {
    html, body { background:#fff; }
    .no-print { display:none !important; }
    main { margin:0; padding:0; max-width:none; }
    table { border-collapse: collapse; width:100%; }
    thead { display: table-header-group; }
    tfoot { display: table-row-group; }
    tr, .totals { break-inside: avoid; }
    h1, h2 { break-after: avoid; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body class="text-slate-900">
<main class="mx-auto max-w-[1440px] px-4 py-6 sm:px-6">

  <!-- Breadcrumb -->
  <nav aria-label="Breadcrumb" class="mb-2 text-xs text-slate-500">
    <span>CRM</span> <span aria-hidden="true">/</span> <span>Báo cáo</span> <span aria-hidden="true">/</span>
    <span class="font-medium text-slate-700">Pipeline bán hàng</span>
  </nav>

  <!-- Header -->
  <div class="flex flex-wrap items-start justify-between gap-3 border-b border-slate-200 pb-4">
    <div>
      <h1 class="text-2xl font-semibold text-slate-900">Pipeline bán hàng · <span id="headerQuarterLabel">Quý 4/2026</span></h1>
      <p class="mt-1 text-sm text-slate-600">Số tiền bằng VND, chỉ gồm cơ hội đang mở · Cập nhật 07/11/2026 09:15</p>
    </div>
    <div class="flex items-center gap-2 no-print">
      <button type="button" id="btnPrint" class="inline-flex h-9 items-center gap-1.5 rounded-md border border-slate-300 bg-white px-3 text-sm font-medium text-slate-700 hover:bg-slate-50 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-700">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V3h12v6M6 18H4a1 1 0 0 1-1-1v-5a1 1 0 0 1 1-1h16a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1h-2M6 14h12v7H6z"/></svg>
        In báo cáo
      </button>
      <button type="button" id="btnExport" class="inline-flex h-9 items-center gap-1.5 rounded-md border border-slate-300 bg-white px-3 text-sm font-medium text-slate-700 hover:bg-slate-50 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-700">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0-4-4m4 4 4-4M5 21h14"/></svg>
        Xuất CSV
      </button>
    </div>
  </div>

  <!-- Filter bar -->
  <div class="mt-4 flex flex-wrap items-center gap-2 no-print">
    <label class="sr-only" for="quarterSelect">Quý</label>
    <select id="quarterSelect" class="h-9 rounded-md border border-slate-300 bg-white px-2.5 text-sm font-medium text-slate-700 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-700">
      <option value="2026-Q3">Quý 3/2026</option>
      <option value="2026-Q4" selected>Quý 4/2026 (hiện tại)</option>
      <option value="2027-Q1">Quý 1/2027</option>
    </select>

    <div class="relative">
      <label for="searchInput" class="sr-only">Tìm cơ hội, khách hàng</label>
      <svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" class="pointer-events-none absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="searchInput" type="text" aria-label="Tìm cơ hội, khách hàng" placeholder="Tìm cơ hội, khách hàng" class="h-9 w-[280px] rounded-md border border-slate-300 bg-white pl-8 pr-8 text-sm focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-700" />
      <button type="button" id="searchClear" aria-label="Xoá tìm kiếm" hidden class="absolute right-1.5 top-1/2 inline-flex h-6 w-6 -translate-y-1/2 items-center justify-center rounded-full hover:bg-slate-100">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <details id="repDetails" class="relative">
      <summary class="inline-flex h-9 items-center gap-1.5 rounded-md border border-slate-300 bg-white px-3 text-sm font-medium text-slate-700 hover:bg-slate-50">
        <span id="repSummaryText">Nhân viên kinh doanh</span>
        <svg aria-hidden="true" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
      </summary>
      <div class="dropdown-panel w-60 rounded-md border border-slate-200 bg-white p-2 shadow-lg" id="repCheckboxes"></div>
    </details>

    <details id="stageDetails" class="relative">
      <summary class="inline-flex h-9 items-center gap-1.5 rounded-md border border-slate-300 bg-white px-3 text-sm font-medium text-slate-700 hover:bg-slate-50">
        <span id="stageSummaryText">Giai đoạn</span>
        <svg aria-hidden="true" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
      </summary>
      <div class="dropdown-panel w-56 rounded-md border border-slate-200 bg-white p-2 shadow-lg" id="stageCheckboxes"></div>
    </details>

    <details id="moreDetails" class="relative">
      <summary id="moreSummary" class="inline-flex h-9 items-center gap-1.5 rounded-md border border-slate-300 bg-white px-3 text-sm font-medium text-slate-700 hover:bg-slate-50">
        Thêm bộ lọc
      </summary>
      <div class="dropdown-panel w-72 rounded-md border border-slate-200 bg-white p-3 shadow-lg">
        <p class="mb-2 text-xs font-semibold text-slate-500">Giá trị pipeline (₫)</p>
        <div class="flex items-center gap-2">
          <input id="valueMin" type="number" min="0" step="1000000" placeholder="Từ" class="h-8 w-full rounded-md border border-slate-300 px-2 text-sm" />
          <span class="text-slate-400">–</span>
          <input id="valueMax" type="number" min="0" step="1000000" placeholder="Đến" class="h-8 w-full rounded-md border border-slate-300 px-2 text-sm" />
        </div>
        <p class="mt-3 mb-2 text-xs font-semibold text-slate-500">Xác suất thắng (%)</p>
        <div class="flex items-center gap-2">
          <input id="probMin" type="number" min="0" max="100" placeholder="Từ" class="h-8 w-full rounded-md border border-slate-300 px-2 text-sm" />
          <span class="text-slate-400">–</span>
          <input id="probMax" type="number" min="0" max="100" placeholder="Đến" class="h-8 w-full rounded-md border border-slate-300 px-2 text-sm" />
        </div>
        <div class="mt-3 flex items-center justify-between border-t border-slate-200 pt-3">
          <button type="button" id="moreReset" class="text-sm font-medium text-slate-600 hover:underline">Đặt lại</button>
          <button type="button" id="moreApply" class="h-8 rounded-md bg-blue-700 px-3 text-sm font-medium text-white hover:bg-blue-800">Áp dụng</button>
        </div>
      </div>
    </details>
  </div>

  <!-- Applied chips -->
  <div id="chipsRow" class="flex flex-wrap items-center gap-2 py-2"></div>
  <p id="resultAnnounce" role="status" class="sr-only"></p>

  <!-- KPI tiles -->
  <div id="kpiRow" class="mt-2 grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-4"></div>

  <!-- Chart -->
  <section aria-labelledby="chartHeading" class="mt-4 rounded-md border border-slate-200 bg-white p-4">
    <div class="flex items-center justify-between gap-2">
      <h2 id="chartHeading" class="text-base font-semibold text-slate-900">Pipeline theo giai đoạn</h2>
      <button type="button" id="btnChartTable" class="h-8 rounded-md border border-slate-300 bg-white px-2.5 text-sm font-medium text-slate-700 hover:bg-slate-50 no-print">Hiện dạng bảng</button>
    </div>
    <p id="chartSummary" class="mt-1 text-sm text-slate-600"></p>
    <div id="chartArea" class="mt-3"></div>
    <div id="chartTableArea" class="mt-3" hidden></div>
  </section>

  <!-- Group-by control -->
  <div class="mt-5 flex flex-wrap items-center justify-between gap-2">
    <div class="inline-flex rounded-md bg-slate-100 p-1 text-sm no-print" role="tablist" aria-label="Nhóm theo">
      <button type="button" id="groupByRepBtn" role="tab" aria-selected="true" class="rounded-md px-3 py-1.5 font-medium">Theo nhân viên kinh doanh</button>
      <button type="button" id="groupByStageBtn" role="tab" aria-selected="false" class="rounded-md px-3 py-1.5 font-medium text-slate-600">Theo giai đoạn</button>
    </div>
    <button type="button" id="toggleCollapseAll" class="text-sm font-medium text-blue-700 hover:underline no-print">Thu gọn tất cả</button>
  </div>

  <!-- Table -->
  <div id="tableWrap" class="mt-2 overflow-x-auto overflow-y-auto rounded-md border border-slate-200 bg-white" style="max-height:70vh">
    <table class="w-full min-w-[920px] text-sm" id="pipelineTable">
      <thead id="tableHead" class="sticky top-0 z-10 bg-slate-50 text-left"></thead>
      <tbody id="tableBody"></tbody>
      <tfoot id="tableFoot" class="sticky bottom-0 border-t border-slate-200 bg-white font-medium"></tfoot>
    </table>
  </div>

</main>

<script>
(function () {
  "use strict";
  var LOCALE = "vi-VN";
  var TIME_ZONE = "Asia/Ho_Chi_Minh";
  var TODAY = new Date("2026-11-07T09:15:00+07:00");

  // ---------- formatters (memoized, mirrors lib/format.ts) ----------
  var fmtCache = {};
  function memo(kind, opts, make) {
    var key = kind + "|" + JSON.stringify(opts || {});
    if (!fmtCache[key]) fmtCache[key] = make();
    return fmtCache[key];
  }
  function nf(opts) { return memo("n", opts, function () { return new Intl.NumberFormat(LOCALE, opts); }); }
  function df(opts) { return memo("d", opts, function () { return new Intl.DateTimeFormat(LOCALE, opts); }); }
  function formatNumber(v, opts) { return nf(opts).format(v); }
  function formatAmount(v) { return nf({ minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(v); }
  function formatMoney(v) { return nf({ style: "currency", currency: "VND" }).format(v); }
  function formatPercent(v, digits) { return nf({ style: "percent", maximumFractionDigits: digits == null ? 0 : digits }).format(v); }
  function formatSignedPercent(v, digits) { return nf({ style: "percent", maximumFractionDigits: digits == null ? 1 : digits, signDisplay: "exceptZero" }).format(v); }
  function formatSignedPoints(v) {
    var s = nf({ maximumFractionDigits: 1, signDisplay: "exceptZero" }).format(v);
    return s + " điểm";
  }
  function formatDate(d) { return df({ day: "2-digit", month: "2-digit", year: "numeric", timeZone: TIME_ZONE }).format(d); }
  function formatEmpty() { return "—"; }
  function foldVi(s) {
    var COMBINING_MARKS = new RegExp("[̀-ͯ]", "g");
    return s.normalize("NFD").replace(COMBINING_MARKS, "").replace(/đ/g, "d").replace(/Đ/g, "D").toLowerCase();
  }
  function daysBetween(a, b) { return Math.round((b - a) / 86400000); }

  // ---------- mock data ----------
  var STAGES = [
    { key: "prospecting", label: "Tiếp cận", probability: 0.10 },
    { key: "qualification", label: "Xác định nhu cầu", probability: 0.25 },
    { key: "proposal", label: "Đề xuất", probability: 0.50 },
    { key: "negotiation", label: "Đàm phán", probability: 0.75 }
  ];
  var STAGE_ORDER = { prospecting: 0, qualification: 1, proposal: 2, negotiation: 3 };

  var REPS = [
    { id: "r1", name: "Nguyễn Văn An" },
    { id: "r2", name: "Trần Thị Bích" },
    { id: "r3", name: "Lê Hoàng Nam" },
    { id: "r4", name: "Phạm Thu Hà" },
    { id: "r5", name: "Hoàng Minh Quân" },
    { id: "r6", name: "Đỗ Ngọc Linh" }
  ];
  var REP_BY_ID = {}; REPS.forEach(function (r) { REP_BY_ID[r.id] = r; });

  var CUSTOMERS = [
    "Công ty TNHH Minh Phát", "Công ty CP Đầu tư Thái Dương", "Tập đoàn Hòa Bình",
    "Công ty TNHH Thương mại Đông Á", "Công ty CP Công nghệ Việt Tiến", "Công ty TNHH Xây dựng Phú Mỹ",
    "Công ty CP Dệt may Sài Gòn", "Công ty TNHH Dịch vụ Logistics An Phát", "Công ty CP Thực phẩm Sao Việt",
    "Công ty TNHH Giải pháp số Hà Nội", "Công ty CP Bán lẻ Thành Công", "Công ty TNHH Sản xuất Đại Dương",
    "Công ty CP Năng lượng Xanh", "Công ty TNHH Vận tải Hồng Hà", "Công ty CP Y tế Việt Đức"
  ];
  var PRODUCTS = [
    "Triển khai hệ thống CRM", "Nâng cấp giải pháp ERP", "Gói dịch vụ tư vấn chuyển đổi số",
    "Hợp đồng bảo trì phần mềm năm 2027", "Triển khai nền tảng thương mại điện tử",
    "Giải pháp quản lý kho thông minh", "Gói phần mềm kế toán doanh nghiệp",
    "Dịch vụ tích hợp hệ thống dữ liệu", "Giải pháp bảo mật dữ liệu doanh nghiệp",
    "Nền tảng quản lý nhân sự HRM", "Gói đào tạo và chuyển giao công nghệ", "Dự án số hóa quy trình vận hành"
  ];

  var QUARTERS = {
    "2026-Q3": { label: "Quý 3/2026", start: new Date("2026-07-01T00:00:00+07:00"), end: new Date("2026-09-30T23:59:59+07:00") },
    "2026-Q4": { label: "Quý 4/2026", start: new Date("2026-10-01T00:00:00+07:00"), end: new Date("2026-12-31T23:59:59+07:00") },
    "2027-Q1": { label: "Quý 1/2027", start: new Date("2027-01-01T00:00:00+07:00"), end: new Date("2027-03-31T23:59:59+07:00") }
  };

  // Win-rate mock ledger: closed deals per rep, current vs previous quarter
  var WIN_RATE = {
    r1: { current: { won: 4, lost: 7 }, previous: { won: 3, lost: 8 } },
    r2: { current: { won: 3, lost: 6 }, previous: { won: 4, lost: 5 } },
    r3: { current: { won: 5, lost: 7 }, previous: { won: 5, lost: 6 } },
    r4: { current: { won: 2, lost: 6 }, previous: { won: 3, lost: 5 } },
    r5: { current: { won: 3, lost: 6 }, previous: { won: 2, lost: 7 } },
    r6: { current: { won: 2, lost: 3 }, previous: { won: 2, lost: 2 } }
  };
  function winRateOf(bucket) {
    var total = bucket.won + bucket.lost;
    return total === 0 ? null : bucket.won / total;
  }
  var overallWinRate = { current: { won: 0, lost: 0 }, previous: { won: 0, lost: 0 } };
  Object.keys(WIN_RATE).forEach(function (id) {
    overallWinRate.current.won += WIN_RATE[id].current.won;
    overallWinRate.current.lost += WIN_RATE[id].current.lost;
    overallWinRate.previous.won += WIN_RATE[id].previous.won;
    overallWinRate.previous.lost += WIN_RATE[id].previous.lost;
  });

  var PREV_SNAPSHOT = { pipelineValue: 15950000000, weighted: 7430000000, openCount: 39 };

  function rand(min, max) { return Math.random() * (max - min) + min; }
  function randInt(min, max) { return Math.floor(rand(min, max + 1)); }
  function pick(arr) { return arr[randInt(0, arr.length - 1)]; }
  function roundTo(v, step) { return Math.round(v / step) * step; }
  function addDays(base, n) { return new Date(base.getTime() + n * 86400000); }

  var VALUE_RANGES = {
    prospecting: [80000000, 550000000],
    qualification: [150000000, 850000000],
    proposal: [300000000, 1700000000],
    negotiation: [600000000, 3400000000]
  };
  var STAGE_COUNTS = { prospecting: 16, qualification: 13, proposal: 11, negotiation: 6 };

  function buildOpportunities() {
    var list = [];
    var seq = 1;
    // pre-plan expected-close buckets across the generated set
    var overdueCount = 4, dueSoonCount = 10, spilloverCount = 3;
    var planned = [];
    STAGES.forEach(function (stage) {
      for (var i = 0; i < STAGE_COUNTS[stage.key]; i++) planned.push(stage.key);
    });
    // shuffle lightly so stage order isn't contiguous when assigning dates
    for (var i = planned.length - 1; i > 0; i--) {
      var j = randInt(0, i);
      var tmp = planned[i]; planned[i] = planned[j]; planned[j] = tmp;
    }
    planned.forEach(function (stageKey, idx) {
      var stage = STAGES.filter(function (s) { return s.key === stageKey; })[0];
      var rep = pick(REPS);
      var customer = pick(CUSTOMERS);
      var product = pick(PRODUCTS);
      var range = VALUE_RANGES[stageKey];
      var value = roundTo(rand(range[0], range[1]), 10000000);
      var jitter = rand(-0.05, 0.05);
      var probability = Math.max(0.02, Math.min(0.95, stage.probability + jitter));
      probability = Math.round(probability * 100) / 100;

      var expectedClose;
      if (idx < overdueCount) {
        expectedClose = addDays(new Date("2026-10-01T00:00:00+07:00"), randInt(0, 36)); // Oct1–Nov6
      } else if (idx < overdueCount + dueSoonCount) {
        expectedClose = addDays(TODAY, randInt(0, 14));
      } else if (stageKey === "negotiation" && idx >= planned.length - spilloverCount) {
        expectedClose = addDays(new Date("2027-01-05T00:00:00+07:00"), randInt(0, 20));
      } else {
        expectedClose = addDays(new Date("2026-11-22T00:00:00+07:00"), randInt(0, 39)); // Nov22–Dec31
      }

      list.push({
        id: "CH-2026-" + String(seq++).padStart(4, "0"),
        name: product,
        customer: customer,
        repId: rep.id,
        stageKey: stageKey,
        value: value,
        probability: probability,
        expectedClose: expectedClose
      });
    });
    return list;
  }

  var OPPS = buildOpportunities();

  // ---------- state ----------
  var urlState = new URLSearchParams(location.search);
  var state = {
    quarter: "2026-Q4",
    q: "",
    reps: [],
    stages: [],
    valueMin: null,
    valueMax: null,
    probMin: null,
    probMax: null,
    groupBy: "rep",
    sortKey: "expectedClose",
    sortDir: "asc",
    collapsed: {}
  };
  var simState = urlState.get("state"); // null | 'empty' | 'error' | 'loading'

  // ---------- derived data helpers ----------
  function stageLabel(key) { return STAGES.filter(function (s) { return s.key === key; })[0].label; }

  function matchesQuarter(opp) {
    var r = QUARTERS[state.quarter];
    return opp.expectedClose >= r.start && opp.expectedClose <= r.end;
  }

  function getFiltered() {
    var query = foldVi(state.q.trim());
    return OPPS.filter(function (o) {
      if (!matchesQuarter(o)) return false;
      if (state.reps.length && state.reps.indexOf(o.repId) === -1) return false;
      if (state.stages.length && state.stages.indexOf(o.stageKey) === -1) return false;
      if (state.valueMin != null && o.value < state.valueMin) return false;
      if (state.valueMax != null && o.value > state.valueMax) return false;
      if (state.probMin != null && o.probability * 100 < state.probMin) return false;
      if (state.probMax != null && o.probability * 100 > state.probMax) return false;
      if (query) {
        var hay = foldVi(o.name + " " + o.customer);
        if (hay.indexOf(query) === -1) return false;
      }
      return true;
    });
  }

  function computeKPIs(filtered) {
    var pipelineValue = 0, weighted = 0;
    filtered.forEach(function (o) { pipelineValue += o.value; weighted += o.value * o.probability; });
    return {
      pipelineValue: pipelineValue,
      weighted: weighted,
      count: filtered.length,
      winRate: winRateOf(overallWinRate.current),
      winRatePrev: winRateOf(overallWinRate.previous)
    };
  }

  // ---------- rendering: skeleton ----------
  function renderSkeleton() {
    var kpiRow = document.getElementById("kpiRow");
    kpiRow.innerHTML = "";
    for (var i = 0; i < 4; i++) {
      var tile = document.createElement("div");
      tile.className = "min-h-24 rounded-md border border-slate-200 bg-white p-4";
      tile.innerHTML = '<div class="skeleton h-3 w-24"></div><div class="skeleton mt-3 h-6 w-28"></div><div class="skeleton mt-2 h-3 w-20"></div>';
      kpiRow.appendChild(tile);
    }
    document.getElementById("chartArea").innerHTML = '<div class="skeleton h-40 w-full"></div>';
    document.getElementById("chartSummary").textContent = "";
    var body = document.getElementById("tableBody");
    var rows = "";
    for (var r = 0; r < 6; r++) {
      rows += '<tr class="border-t border-slate-100"><td class="p-3" colspan="7"><div class="skeleton h-4 w-full"></div></td></tr>';
    }
    document.getElementById("tableHead").innerHTML = "";
    document.getElementById("tableFoot").innerHTML = "";
    body.innerHTML = rows;
  }

  // ---------- rendering: error ----------
  function renderError() {
    document.getElementById("kpiRow").innerHTML = "";
    document.getElementById("chartArea").innerHTML = "";
    document.getElementById("chartSummary").textContent = "";
    document.getElementById("tableHead").innerHTML = "";
    document.getElementById("tableFoot").innerHTML = "";
    document.getElementById("tableBody").innerHTML =
      '<tr><td colspan="7" class="p-10 text-center">' +
      '<p role="alert" class="text-sm text-slate-700">Không thể tải dữ liệu pipeline bán hàng.</p>' +
      '<button type="button" id="retryBtn" class="mt-3 h-9 rounded-md border border-slate-300 bg-white px-3 text-sm font-medium text-slate-700 hover:bg-slate-50">Thử lại</button>' +
      '</td></tr>';
    document.getElementById("retryBtn").addEventListener("click", function () {
      simState = null;
      boot();
    });
  }

  // ---------- rendering: KPI tiles ----------
  function kpiTile(label, valueText, deltaText, extraClass) {
    var div = document.createElement("div");
    div.className = "min-h-24 rounded-md border border-slate-200 bg-white p-4";
    div.innerHTML =
      '<p class="text-xs font-medium text-slate-500">' + label + '</p>' +
      '<p class="mt-1 font-semibold tabular-nums ' + (extraClass || "text-2xl") + '">' + valueText + '</p>' +
      '<p class="mt-1 text-xs text-slate-600 tabular-nums">' + deltaText + '</p>';
    return div;
  }

  function renderKpis(kpis) {
    var kpiRow = document.getElementById("kpiRow");
    kpiRow.innerHTML = "";

    var pvText = formatMoney(kpis.pipelineValue);
    var pvSize = pvText.length > 13 ? "text-xl" : "text-2xl";
    var pvDelta = PREV_SNAPSHOT.pipelineValue > 0 ? (kpis.pipelineValue - PREV_SNAPSHOT.pipelineValue) / PREV_SNAPSHOT.pipelineValue : null;
    kpiRow.appendChild(kpiTile("Tổng giá trị pipeline", pvText, pvDelta == null ? "—" : formatSignedPercent(pvDelta) + " vs quý trước", pvSize));

    var wText = formatMoney(kpis.weighted);
    var wSize = wText.length > 13 ? "text-xl" : "text-2xl";
    var wDelta = PREV_SNAPSHOT.weighted > 0 ? (kpis.weighted - PREV_SNAPSHOT.weighted) / PREV_SNAPSHOT.weighted : null;
    kpiRow.appendChild(kpiTile("Dự báo có trọng số", wText, wDelta == null ? "—" : formatSignedPercent(wDelta) + " vs quý trước", wSize));

    var wrText = kpis.winRate == null ? "—" : formatPercent(kpis.winRate, 1);
    var wrDelta = (kpis.winRate != null && kpis.winRatePrev != null) ? (kpis.winRate - kpis.winRatePrev) * 100 : null;
    kpiRow.appendChild(kpiTile("Tỷ lệ thắng quý", wrText, wrDelta == null ? "—" : formatSignedPoints(wrDelta) + " vs quý trước", "text-2xl"));

    var cDelta = PREV_SNAPSHOT.openCount > 0 ? kpis.count - PREV_SNAPSHOT.openCount : null;
    kpiRow.appendChild(kpiTile("Số cơ hội đang mở", formatNumber(kpis.count), cDelta == null ? "—" : formatNumber(cDelta, { signDisplay: "exceptZero" }) + " vs quý trước", "text-2xl"));
  }

  // ---------- rendering: chart ----------
  function renderChart(filtered) {
    var totals = {};
    STAGES.forEach(function (s) { totals[s.key] = 0; });
    filtered.forEach(function (o) { totals[o.stageKey] += o.value; });
    var grand = STAGES.reduce(function (sum, s) { return sum + totals[s.key]; }, 0);
    var area = document.getElementById("chartArea");
    var tableArea = document.getElementById("chartTableArea");

    if (filtered.length === 0) {
      area.innerHTML = '<p class="py-8 text-center text-sm text-slate-600">Không có dữ liệu pipeline theo giai đoạn cho bộ lọc hiện tại.</p>';
      document.getElementById("chartSummary").textContent = "";
      tableArea.innerHTML = "";
      return;
    }

    var max = Math.max.apply(null, STAGES.map(function (s) { return totals[s.key]; }));
    var sorted = STAGES.slice().sort(function (a, b) { return totals[b.key] - totals[a.key]; });
    var topStage = sorted[0];
    var topShare = grand > 0 ? topStage ? totals[topStage.key] / grand : 0 : 0;

    document.getElementById("chartSummary").textContent =
      grand > 0 && topStage
        ? "Giai đoạn “" + topStage.label + "” có giá trị pipeline cao nhất với " + formatMoney(totals[topStage.key]) + ", chiếm " + formatPercent(topShare, 1) + " tổng pipeline."
        : "Chưa có dữ liệu pipeline trong kỳ đã chọn.";

    var html = '<div role="img" aria-label="Biểu đồ cột ngang so sánh giá trị pipeline theo giai đoạn" class="space-y-3">';
    sorted.forEach(function (s) {
      var v = totals[s.key];
      var pct = max > 0 ? (v / max) * 100 : 0;
      var share = grand > 0 ? v / grand : 0;
      html += '<div>' +
        '<div class="flex items-baseline justify-between text-sm"><span class="font-medium text-slate-700">' + s.label + '</span>' +
        '<span class="tabular-nums text-slate-600">' + formatMoney(v) + ' · ' + formatPercent(share, 1) + '</span></div>' +
        '<div class="mt-1 h-3 w-full rounded-sm bg-slate-100"><div class="h-3 rounded-sm bg-blue-700" style="width:' + pct.toFixed(1) + '%"></div></div>' +
        '</div>';
    });
    html += '</div>';
    area.innerHTML = html;

    var th = '<table class="w-full text-sm"><thead><tr>' +
      '<th class="h-10 px-3 text-left font-medium">Giai đoạn</th>' +
      '<th class="h-10 px-3 text-right font-medium">Giá trị pipeline (₫)</th>' +
      '<th class="h-10 px-3 text-right font-medium">Tỷ trọng</th></tr></thead><tbody>';
    sorted.forEach(function (s) {
      var v = totals[s.key];
      var share = grand > 0 ? v / grand : 0;
      th += '<tr class="border-t border-slate-100"><td class="h-10 px-3">' + s.label + '</td>' +
        '<td class="h-10 px-3 text-right tabular-nums">' + formatAmount(v) + '</td>' +
        '<td class="h-10 px-3 text-right tabular-nums">' + formatPercent(share, 1) + '</td></tr>';
    });
    th += '</tbody></table>';
    tableArea.innerHTML = th;
  }

  // ---------- sorting / grouping ----------
  var SORT_COLUMNS = {
    value: { label: "Giá trị (₫)" },
    probability: { label: "Xác suất" },
    weighted: { label: "Dự báo có trọng số (₫)" },
    expectedClose: { label: "Ngày dự kiến chốt" }
  };

  function sortValue(o, key) {
    if (key === "weighted") return o.value * o.probability;
    if (key === "expectedClose") return o.expectedClose.getTime();
    return o[key];
  }

  function sortRows(rows) {
    var dir = state.sortDir === "asc" ? 1 : -1;
    return rows.slice().sort(function (a, b) {
      var av = sortValue(a, state.sortKey), bv = sortValue(b, state.sortKey);
      return av < bv ? -1 * dir : av > bv ? 1 * dir : 0;
    });
  }

  function groupRows(filtered) {
    var groups = {};
    filtered.forEach(function (o) {
      var key = state.groupBy === "rep" ? o.repId : o.stageKey;
      if (!groups[key]) groups[key] = [];
      groups[key].push(o);
    });
    var keys = Object.keys(groups);
    keys.sort(function (ka, kb) {
      var va = groups[ka].reduce(function (s, o) { return s + o.value; }, 0);
      var vb = groups[kb].reduce(function (s, o) { return s + o.value; }, 0);
      return vb - va;
    });
    return keys.map(function (k) { return { key: k, rows: sortRows(groups[k]) }; });
  }

  function dateCell(o) {
    var d = daysBetween(TODAY, o.expectedClose);
    var dateText = formatDate(o.expectedClose);
    var tone = "text-slate-600", wordText;
    if (d < 0) { tone = "text-red-700 font-medium"; wordText = "Quá hạn " + formatNumber(Math.abs(d)) + " ngày"; }
    else if (d <= 14) { tone = "text-amber-700 font-medium"; wordText = "Còn " + formatNumber(d) + " ngày"; }
    else { wordText = "Còn " + formatNumber(d) + " ngày"; }
    return '<span class="tabular-nums">' + dateText + '</span> <span class="' + tone + '">· ' + wordText + '</span>';
  }

  function stageBadge(key) {
    return '<span class="inline-flex items-center rounded-full bg-slate-100 px-2 py-0.5 text-xs font-medium text-slate-700">' + stageLabel(key) + '</span>';
  }

  function groupLabel(key) {
    return state.groupBy === "rep" ? REP_BY_ID[key].name : stageLabel(key);
  }

  function renderTableHead() {
    var thirdCol = state.groupBy === "rep" ? "Giai đoạn" : "Nhân viên kinh doanh";
    var head = document.getElementById("tableHead");
    function sortBtn(key, label) {
      var active = state.sortKey === key;
      var ariaSort = active ? (state.sortDir === "asc" ? "ascending" : "descending") : "none";
      var arrow = active ? (state.sortDir === "asc" ? "↑" : "↓") : "";
      return '<th class="px-3 py-2.5 text-right font-medium" aria-sort="' + ariaSort + '">' +
        '<button type="button" data-sort="' + key + '" class="inline-flex w-full flex-row-reverse items-center gap-1 text-right">' + label + ' <span aria-hidden="true">' + arrow + '</span></button></th>';
    }
    head.innerHTML =
      '<tr>' +
      '<th class="px-3 py-2.5 text-left font-medium">Cơ hội</th>' +
      '<th class="px-3 py-2.5 text-left font-medium">Khách hàng</th>' +
      '<th class="px-3 py-2.5 text-left font-medium">' + thirdCol + '</th>' +
      sortBtn("value", "Giá trị (₫)") +
      sortBtn("probability", "Xác suất") +
      sortBtn("weighted", "Dự báo có trọng số (₫)") +
      sortBtn("expectedClose", "Ngày dự kiến chốt") +
      '</tr>';
    Array.prototype.forEach.call(head.querySelectorAll("button[data-sort]"), function (btn) {
      btn.addEventListener("click", function () {
        var key = btn.getAttribute("data-sort");
        if (state.sortKey === key) state.sortDir = state.sortDir === "asc" ? "desc" : "asc";
        else { state.sortKey = key; state.sortDir = "asc"; }
        renderTable(getFiltered());
      });
    });
  }

  function renderTableBodyAndFoot(filtered) {
    var body = document.getElementById("tableBody");
    var foot = document.getElementById("tableFoot");
    var grandValue = 0, grandWeighted = 0;

    if (filtered.length === 0) {
      body.innerHTML = '<tr><td colspan="7" class="p-10 text-center">' +
        '<p class="text-sm font-medium text-slate-700">Không có cơ hội nào khớp với bộ lọc hiện tại.</p>' +
        '<p class="mt-1 text-sm text-slate-500">Hãy kiểm tra lại từ khoá tìm kiếm hoặc mở rộng phạm vi bộ lọc.</p>' +
        '<button type="button" id="clearFiltersBtn" class="mt-3 h-9 rounded-md border border-slate-300 bg-white px-3 text-sm font-medium text-slate-700 hover:bg-slate-50">Xoá bộ lọc</button>' +
        '</td></tr>';
      foot.innerHTML = "";
      document.getElementById("clearFiltersBtn").addEventListener("click", clearAllFilters);
      return;
    }

    var groups = groupRows(filtered);
    var html = "";
    groups.forEach(function (g) {
      var subValue = 0, subWeighted = 0;
      g.rows.forEach(function (o) { subValue += o.value; subWeighted += o.value * o.probability; });
      grandValue += subValue; grandWeighted += subWeighted;
      var share = filtered.length ? subValue / (filtered.reduce(function (s, o) { return s + o.value; }, 0) || 1) : 0;
      var collapsed = !!state.collapsed[g.key];

      var winRateText = "";
      if (state.groupBy === "rep") {
        var wr = winRateOf(WIN_RATE[g.key].current);
        winRateText = ' · Tỷ lệ thắng quý ' + (wr == null ? "—" : formatPercent(wr, 1));
      }

      html += '<tr class="group-header cursor-pointer bg-slate-50 border-t border-slate-200" data-group="' + g.key + '">' +
        '<td class="px-3 py-2 font-medium text-slate-900" colspan="3">' +
        '<button type="button" class="inline-flex items-center gap-1.5 text-left" data-toggle-group="' + g.key + '" aria-expanded="' + (!collapsed) + '">' +
        '<svg aria-hidden="true" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" style="transform:rotate(' + (collapsed ? "-90deg" : "0deg") + ')"><path d="m6 9 6 6 6-6"/></svg>' +
        groupLabel(g.key) + '</button>' +
        ' <span class="text-slate-500">(' + formatNumber(g.rows.length) + ' cơ hội' + winRateText + ')</span></td>' +
        '<td class="px-3 py-2 text-right font-semibold tabular-nums">' + formatAmount(subValue) + '</td>' +
        '<td class="px-3 py-2 text-right text-slate-500 tabular-nums">' + formatPercent(share, 1) + '</td>' +
        '<td class="px-3 py-2 text-right font-semibold tabular-nums">' + formatAmount(subWeighted) + '</td>' +
        '<td class="px-3 py-2"></td>' +
        '</tr>';

      if (!collapsed) {
        g.rows.forEach(function (o) {
          var thirdCell = state.groupBy === "rep" ? stageBadge(o.stageKey) : REP_BY_ID[o.repId].name;
          html += '<tr class="border-t border-slate-100 h-10 hover:bg-slate-50">' +
            '<td class="px-3 py-2.5">' + o.name + '</td>' +
            '<td class="px-3 py-2.5">' + o.customer + '</td>' +
            '<td class="px-3 py-2.5">' + thirdCell + '</td>' +
            '<td class="px-3 py-2.5 text-right tabular-nums">' + formatAmount(o.value) + '</td>' +
            '<td class="px-3 py-2.5 text-right tabular-nums">' + formatPercent(o.probability, 0) + '</td>' +
            '<td class="px-3 py-2.5 text-right tabular-nums">' + formatAmount(Math.round(o.value * o.probability)) + '</td>' +
            '<td class="px-3 py-2.5 text-right">' + dateCell(o) + '</td>' +
            '</tr>';
        });
      }
    });

    body.innerHTML = html;
    foot.innerHTML = '<tr>' +
      '<td class="px-3 py-2.5" colspan="3">Tổng</td>' +
      '<td class="px-3 py-2.5 text-right tabular-nums">' + formatAmount(grandValue) + '</td>' +
      '<td class="px-3 py-2.5 text-right">—</td>' +
      '<td class="px-3 py-2.5 text-right tabular-nums">' + formatAmount(grandWeighted) + '</td>' +
      '<td class="px-3 py-2.5 text-right">—</td>' +
      '</tr>';

    Array.prototype.forEach.call(body.querySelectorAll("[data-toggle-group]"), function (btn) {
      btn.addEventListener("click", function () {
        var key = btn.getAttribute("data-toggle-group");
        state.collapsed[key] = !state.collapsed[key];
        renderTable(getFiltered());
      });
    });
  }

  function renderTable(filtered) {
    renderTableHead();
    renderTableBodyAndFoot(filtered);
    document.getElementById("resultAnnounce").textContent =
      filtered.length === 0 ? "Không có cơ hội nào khớp với bộ lọc" : formatNumber(filtered.length) + " cơ hội khớp với bộ lọc";
  }

  // ---------- chips ----------
  function removableChip(key, label, onRemove) {
    var span = document.createElement("span");
    span.className = "inline-flex h-6 items-center gap-1 rounded-full border border-slate-300 bg-slate-50 pl-2 pr-1 text-xs font-medium text-slate-700";
    span.innerHTML = label +
      '<button type="button" aria-label="Xoá bộ lọc ' + label + '" class="inline-flex size-6 items-center justify-center rounded-full hover:bg-slate-200">' +
      '<svg aria-hidden="true" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>';
    span.querySelector("button").addEventListener("click", onRemove);
    return span;
  }

  function clearAllFilters() {
    state.q = ""; document.getElementById("searchInput").value = "";
    state.reps = []; state.stages = [];
    state.valueMin = null; state.valueMax = null; state.probMin = null; state.probMax = null;
    document.getElementById("valueMin").value = ""; document.getElementById("valueMax").value = "";
    document.getElementById("probMin").value = ""; document.getElementById("probMax").value = "";
    syncCheckboxUI();
    renderFromFilters();
  }

  function renderChips() {
    var row = document.getElementById("chipsRow");
    row.innerHTML = "";
    var chips = [];
    if (state.q.trim()) chips.push({ label: "Tìm kiếm: " + state.q.trim(), remove: function () { state.q = ""; document.getElementById("searchInput").value = ""; renderFromFilters(); } });
    if (state.reps.length) chips.push({ label: "Nhân viên: " + state.reps.map(function (id) { return REP_BY_ID[id].name; }).join(", "), remove: function () { state.reps = []; syncCheckboxUI(); renderFromFilters(); } });
    if (state.stages.length) chips.push({ label: "Giai đoạn: " + state.stages.map(stageLabel).join(", "), remove: function () { state.stages = []; syncCheckboxUI(); renderFromFilters(); } });
    if (state.valueMin != null || state.valueMax != null) {
      var vLabel = "Giá trị: " + (state.valueMin != null ? formatAmount(state.valueMin) : "0") + " – " + (state.valueMax != null ? formatAmount(state.valueMax) : "∞") + " ₫";
      chips.push({ label: vLabel, remove: function () { state.valueMin = null; state.valueMax = null; document.getElementById("valueMin").value = ""; document.getElementById("valueMax").value = ""; renderFromFilters(); } });
    }
    if (state.probMin != null || state.probMax != null) {
      var pLabel = "Xác suất: " + (state.probMin != null ? state.probMin : "0") + "% – " + (state.probMax != null ? state.probMax : "100") + "%";
      chips.push({ label: pLabel, remove: function () { state.probMin = null; state.probMax = null; document.getElementById("probMin").value = ""; document.getElementById("probMax").value = ""; renderFromFilters(); } });
    }
    if (!chips.length) return;
    chips.forEach(function (c) { row.appendChild(removableChip(null, c.label, c.remove)); });
    var clearAll = document.createElement("button");
    clearAll.type = "button";
    clearAll.className = "text-sm font-medium text-blue-700 hover:underline";
    clearAll.textContent = "Xoá tất cả";
    clearAll.addEventListener("click", clearAllFilters);
    row.appendChild(clearAll);
  }

  // ---------- checkbox dropdowns ----------
  function buildCheckboxes(containerId, items, selectedArr, labelOf, keyOf, summaryId, summaryLabel) {
    var container = document.getElementById(containerId);
    var html = "";
    items.forEach(function (item) {
      var key = keyOf(item);
      var checked = selectedArr.indexOf(key) !== -1;
      html += '<label class="flex h-9 items-center gap-2 rounded-md px-2 text-sm hover:bg-slate-50">' +
        '<input type="checkbox" value="' + key + '" ' + (checked ? "checked" : "") + ' class="size-4 rounded border-slate-300" />' +
        labelOf(item) + '</label>';
    });
    html += '<div class="mt-1 border-t border-slate-200 pt-1"><button type="button" data-clear-dropdown="' + containerId + '" class="h-8 w-full rounded-md text-left px-2 text-sm text-slate-600 hover:bg-slate-50">Xoá lựa chọn</button></div>';
    container.innerHTML = html;
    Array.prototype.forEach.call(container.querySelectorAll("input[type=checkbox]"), function (cb) {
      cb.addEventListener("change", function () {
        var idx = selectedArr.indexOf(cb.value);
        if (cb.checked && idx === -1) selectedArr.push(cb.value);
        if (!cb.checked && idx !== -1) selectedArr.splice(idx, 1);
        updateDropdownSummary(summaryId, summaryLabel, selectedArr.length);
        renderChips();
        renderFromFilters(true);
      });
    });
    container.querySelector("[data-clear-dropdown]").addEventListener("click", function () {
      selectedArr.length = 0;
      syncCheckboxUI();
      renderFromFilters();
    });
  }

  function updateDropdownSummary(summaryId, label, count) {
    document.getElementById(summaryId).textContent = count ? label + " (" + count + ")" : label;
  }

  function syncCheckboxUI() {
    buildCheckboxes("repCheckboxes", REPS, state.reps, function (r) { return r.name; }, function (r) { return r.id; }, "repSummaryText", "Nhân viên kinh doanh");
    buildCheckboxes("stageCheckboxes", STAGES, state.stages, function (s) { return s.label; }, function (s) { return s.key; }, "stageSummaryText", "Giai đoạn");
    updateDropdownSummary("repSummaryText", "Nhân viên kinh doanh", state.reps.length);
    updateDropdownSummary("stageSummaryText", "Giai đoạn", state.stages.length);
  }

  // ---------- top-level render orchestration ----------
  function renderFromFilters(keepDropdownOpen) {
    if (simState === "empty") { renderEmptyFromFilters(); return; }
    var filtered = getFiltered();
    renderChips();
    renderKpis(computeKPIs(filtered));
    renderChart(filtered);
    renderTable(filtered);
  }

  function renderEmptyFromFilters() {
    renderChips();
    renderKpis({ pipelineValue: 0, weighted: 0, count: 0, winRate: null, winRatePrev: null });
    renderChart([]);
    document.getElementById("tableHead").innerHTML = "";
    document.getElementById("tableFoot").innerHTML = "";
    document.getElementById("tableBody").innerHTML =
      '<tr><td colspan="7" class="p-10 text-center">' +
      '<p class="text-sm font-medium text-slate-700">Chưa có cơ hội đang mở nào được ghi nhận trong CRM.</p>' +
      '<p class="mt-1 text-sm text-slate-500">Dữ liệu sẽ xuất hiện ở đây khi có cơ hội mới được tạo.</p>' +
      '</td></tr>';
  }

  function updateHeaderQuarterLabel() {
    document.getElementById("headerQuarterLabel").textContent = QUARTERS[state.quarter].label;
  }

  // ---------- CSV export ----------
  function exportCsv() {
    var filtered = simState === "empty" ? [] : getFiltered();
    var header = ["Mã cơ hội", "Cơ hội", "Khách hàng", "Nhân viên kinh doanh", "Giai đoạn", "Giá trị (VND)", "Xác suất (%)", "Dự báo có trọng số (VND)", "Ngày dự kiến chốt"];
    var lines = [header.join(",")];
    filtered.forEach(function (o) {
      var row = [
        o.id, o.name, o.customer, REP_BY_ID[o.repId].name, stageLabel(o.stageKey),
        String(o.value), String(Math.round(o.probability * 100)), String(Math.round(o.value * o.probability)),
        o.expectedClose.toISOString().slice(0, 10)
      ].map(function (v) { return '"' + String(v).replace(/"/g, '""') + '"'; });
      lines.push(row.join(","));
    });
    var csv = "﻿" + lines.join("\r\n");
    var blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "pipeline-ban-hang-" + state.quarter + ".csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // ---------- events ----------
  function debounce(fn, ms) {
    var t;
    return function () {
      var args = arguments;
      clearTimeout(t);
      t = setTimeout(function () { fn.apply(null, args); }, ms);
    };
  }

  function attachEvents() {
    document.getElementById("quarterSelect").addEventListener("change", function (e) {
      state.quarter = e.target.value;
      updateHeaderQuarterLabel();
      renderFromFilters();
    });

    var searchInput = document.getElementById("searchInput");
    var searchClear = document.getElementById("searchClear");
    var debouncedSearch = debounce(function () { renderFromFilters(); }, 300);
    searchInput.addEventListener("input", function (e) {
      state.q = e.target.value;
      searchClear.hidden = !state.q;
      debouncedSearch();
    });
    searchClear.addEventListener("click", function () {
      state.q = ""; searchInput.value = ""; searchClear.hidden = true; renderFromFilters();
    });

    document.getElementById("moreApply").addEventListener("click", function () {
      var vMin = document.getElementById("valueMin").value;
      var vMax = document.getElementById("valueMax").value;
      var pMin = document.getElementById("probMin").value;
      var pMax = document.getElementById("probMax").value;
      state.valueMin = vMin === "" ? null : Number(vMin);
      state.valueMax = vMax === "" ? null : Number(vMax);
      state.probMin = pMin === "" ? null : Number(pMin);
      state.probMax = pMax === "" ? null : Number(pMax);
      document.getElementById("moreDetails").open = false;
      renderFromFilters();
    });
    document.getElementById("moreReset").addEventListener("click", function () {
      document.getElementById("valueMin").value = "";
      document.getElementById("valueMax").value = "";
      document.getElementById("probMin").value = "";
      document.getElementById("probMax").value = "";
      state.valueMin = null; state.valueMax = null; state.probMin = null; state.probMax = null;
      renderFromFilters();
    });

    document.getElementById("groupByRepBtn").addEventListener("click", function () {
      state.groupBy = "rep";
      document.getElementById("groupByRepBtn").setAttribute("aria-selected", "true");
      document.getElementById("groupByRepBtn").classList.add("bg-white", "shadow-sm", "text-slate-900");
      document.getElementById("groupByRepBtn").classList.remove("text-slate-600");
      document.getElementById("groupByStageBtn").setAttribute("aria-selected", "false");
      document.getElementById("groupByStageBtn").classList.remove("bg-white", "shadow-sm", "text-slate-900");
      document.getElementById("groupByStageBtn").classList.add("text-slate-600");
      state.collapsed = {};
      renderTable(getFiltered());
    });
    document.getElementById("groupByStageBtn").addEventListener("click", function () {
      state.groupBy = "stage";
      document.getElementById("groupByStageBtn").setAttribute("aria-selected", "true");
      document.getElementById("groupByStageBtn").classList.add("bg-white", "shadow-sm", "text-slate-900");
      document.getElementById("groupByStageBtn").classList.remove("text-slate-600");
      document.getElementById("groupByRepBtn").setAttribute("aria-selected", "false");
      document.getElementById("groupByRepBtn").classList.remove("bg-white", "shadow-sm", "text-slate-900");
      document.getElementById("groupByRepBtn").classList.add("text-slate-600");
      state.collapsed = {};
      renderTable(getFiltered());
    });

    document.getElementById("toggleCollapseAll").addEventListener("click", function () {
      var filtered = getFiltered();
      var groups = groupRows(filtered);
      var anyExpanded = groups.some(function (g) { return !state.collapsed[g.key]; });
      groups.forEach(function (g) { state.collapsed[g.key] = anyExpanded; });
      document.getElementById("toggleCollapseAll").textContent = anyExpanded ? "Mở rộng tất cả" : "Thu gọn tất cả";
      renderTable(filtered);
    });

    document.getElementById("btnChartTable").addEventListener("click", function () {
      var chartArea = document.getElementById("chartArea");
      var tableArea = document.getElementById("chartTableArea");
      var showingTable = !tableArea.hidden;
      tableArea.hidden = showingTable;
      chartArea.hidden = !showingTable;
      document.getElementById("btnChartTable").textContent = showingTable ? "Hiện dạng bảng" : "Hiện biểu đồ";
    });

    document.getElementById("btnExport").addEventListener("click", exportCsv);
    document.getElementById("btnPrint").addEventListener("click", function () { window.print(); });

    document.addEventListener("click", function (e) {
      Array.prototype.forEach.call(document.querySelectorAll("details[open]"), function (d) {
        if (!d.contains(e.target)) d.open = false;
      });
    });
  }

  // ---------- boot ----------
  function boot() {
    renderSkeleton();
    if (simState === "loading") return; // held skeleton
    setTimeout(function () {
      if (simState === "error") { renderError(); return; }
      syncCheckboxUI();
      updateHeaderQuarterLabel();
      renderFromFilters();
    }, 500);
  }

  attachEvents();
  document.getElementById("groupByRepBtn").classList.add("bg-white", "shadow-sm", "text-slate-900");
  boot();
})();
</script>
</body>
</html>
