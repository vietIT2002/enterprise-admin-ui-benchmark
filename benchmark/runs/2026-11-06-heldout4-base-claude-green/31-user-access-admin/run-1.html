<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Users · Settings · Acme Cloud Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid #1d4ed8; outline-offset: 2px; }
  main:focus { outline: none; }
  .tabular-nums { font-variant-numeric: tabular-nums; }
  @keyframes toast-in { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
  .toast-enter { animation: toast-in 150ms ease-out; }
  @media (prefers-reduced-motion: reduce) {
    .animate-pulse, .animate-spin, .toast-enter { animation: none !important; }
  }
</style>
</head>
<body class="h-full bg-slate-50 text-slate-900 text-sm antialiased">
<a href="#main" class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-2 focus:z-50 focus:rounded focus:bg-white focus:px-3 focus:py-2 focus:text-sm focus:shadow-lg focus:border focus:border-slate-300">Skip to main content</a>

<div class="flex h-screen overflow-hidden">
  <!-- Sidebar -->
  <aside class="hidden md:flex w-60 flex-col border-r border-slate-200 bg-slate-50">
    <div class="flex h-12 items-center gap-2 px-4 border-b border-slate-200">
      <div class="flex size-6 items-center justify-center rounded bg-blue-700 text-xs font-semibold text-white">A</div>
      <span class="font-semibold text-slate-900">Acme Cloud</span>
    </div>
    <nav aria-label="Main" class="flex-1 overflow-y-auto px-2 py-3">
      <p class="px-2 pb-1 text-xs font-medium text-slate-500">Workspace</p>
      <ul class="space-y-0.5">
        <li><a href="#" class="flex items-center gap-2 rounded px-2 py-1.5 text-slate-700 hover:bg-slate-100"><svg class="size-4 shrink-0" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>Dashboard</a></li>
      </ul>
      <p class="mt-4 px-2 pb-1 text-xs font-medium text-slate-500">Administration</p>
      <ul class="space-y-0.5">
        <li><a href="#" aria-current="page" class="flex items-center gap-2 rounded bg-slate-200 px-2 py-1.5 font-medium text-slate-900"><svg class="size-4 shrink-0" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Users &amp; roles</a></li>
        <li><a href="#" class="flex items-center gap-2 rounded px-2 py-1.5 text-slate-700 hover:bg-slate-100"><svg class="size-4 shrink-0" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/></svg>Roles &amp; permissions</a></li>
        <li><a href="#" class="flex items-center gap-2 rounded px-2 py-1.5 text-slate-700 hover:bg-slate-100"><svg class="size-4 shrink-0" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>Billing</a></li>
        <li><a href="#" class="flex items-center gap-2 rounded px-2 py-1.5 text-slate-700 hover:bg-slate-100"><svg class="size-4 shrink-0" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>Settings</a></li>
      </ul>
    </nav>
    <div class="border-t border-slate-200 p-2">
      <a href="#" class="flex items-center gap-2 rounded px-2 py-1.5 text-slate-700 hover:bg-slate-100"><svg class="size-4 shrink-0" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 1 1 5.83 1c0 2-3 2-3 4"/><line x1="12" y1="17" x2="12" y2="17"/></svg>Help</a>
    </div>
  </aside>

  <div class="flex flex-1 flex-col overflow-hidden">
    <main id="main" tabindex="-1" class="flex-1 overflow-y-auto">
      <div class="mx-auto max-w-6xl px-6 py-6">

        <nav aria-label="Breadcrumb" class="mb-1 text-xs text-slate-500">
          <ol class="flex items-center gap-1">
            <li>Settings</li>
            <li aria-hidden="true">/</li>
            <li class="text-slate-700">Users &amp; roles</li>
          </ol>
        </nav>

        <div class="flex items-center justify-between gap-4 pb-4">
          <h1 class="text-xl font-semibold text-slate-900">Users</h1>
          <button type="button" id="btn-invite" class="inline-flex h-8 items-center gap-1.5 rounded bg-blue-700 px-3 text-sm font-medium text-white hover:bg-blue-800 focus-visible:ring-2 focus-visible:ring-blue-700">
            <svg class="size-4" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="16" y1="11" x2="22" y2="11"/></svg>
            Invite user
          </button>
        </div>

        <!-- Status tabs -->
        <div class="border-b border-slate-200">
          <div role="tablist" aria-label="Filter users by status" class="flex gap-5 text-sm">
            <button type="button" role="tab" data-status="all" class="status-tab border-b-2 border-blue-700 px-1 py-2 font-medium text-slate-900" aria-selected="true">All <span class="tabular-nums text-slate-500" id="tab-count-all"></span></button>
            <button type="button" role="tab" data-status="active" class="status-tab border-b-2 border-transparent px-1 py-2 font-medium text-slate-500 hover:text-slate-900" aria-selected="false">Active <span class="tabular-nums text-slate-500" id="tab-count-active"></span></button>
            <button type="button" role="tab" data-status="invited" class="status-tab border-b-2 border-transparent px-1 py-2 font-medium text-slate-500 hover:text-slate-900" aria-selected="false">Invited <span class="tabular-nums text-slate-500" id="tab-count-invited"></span></button>
            <button type="button" role="tab" data-status="deactivated" class="status-tab border-b-2 border-transparent px-1 py-2 font-medium text-slate-500 hover:text-slate-900" aria-selected="false">Deactivated <span class="tabular-nums text-slate-500" id="tab-count-deactivated"></span></button>
          </div>
        </div>

        <!-- Filter bar -->
        <div class="flex flex-wrap items-center gap-2 py-3">
          <div class="relative">
            <svg class="pointer-events-none absolute left-2 top-1/2 size-4 -translate-y-1/2 text-slate-500" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="search-input" aria-label="Search users" placeholder="Search name or email" class="h-8 w-72 rounded border border-slate-300 bg-white pl-8 pr-8 text-sm placeholder:text-slate-500 focus-visible:ring-2 focus-visible:ring-blue-700">
            <button type="button" id="search-clear" hidden aria-label="Clear search" class="absolute right-1.5 top-1/2 flex size-5 -translate-y-1/2 items-center justify-center rounded hover:bg-slate-100">
              <svg class="size-3.5 text-slate-500" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>

          <div class="relative">
            <button type="button" id="btn-role-filter" aria-haspopup="menu" aria-expanded="false" class="inline-flex h-8 items-center gap-1.5 rounded border border-slate-300 bg-white px-3 text-sm text-slate-700 hover:bg-slate-50 focus-visible:ring-2 focus-visible:ring-blue-700">
              <span id="role-filter-label">Role</span>
              <svg class="size-4 text-slate-500" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
            <div id="role-filter-panel" role="menu" aria-label="Filter by role" hidden class="absolute left-0 z-20 mt-1 w-56 rounded-md border border-slate-200 bg-white p-2 shadow-lg">
              <div id="role-filter-options" class="space-y-1"></div>
              <div class="mt-2 flex justify-end border-t border-slate-100 pt-2">
                <button type="button" id="role-filter-reset" class="rounded px-2 py-1 text-xs font-medium text-blue-700 hover:bg-blue-50">Reset</button>
              </div>
            </div>
          </div>

          <div class="relative">
            <button type="button" id="btn-more-filters" aria-haspopup="dialog" aria-expanded="false" class="inline-flex h-8 items-center gap-1.5 rounded border border-slate-300 bg-white px-3 text-sm text-slate-700 hover:bg-slate-50 focus-visible:ring-2 focus-visible:ring-blue-700">
              <svg class="size-4 text-slate-500" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="7" y1="12" x2="17" y2="12"/><line x1="10" y1="18" x2="14" y2="18"/></svg>
              <span id="more-filters-label">More filters</span>
            </button>
            <div id="more-filters-panel" hidden class="absolute left-0 z-20 mt-1 w-80 rounded-md border border-slate-200 bg-white p-3 shadow-lg">
              <p class="mb-2 text-sm font-medium text-slate-900">Last sign-in</p>
              <div class="flex items-center gap-2">
                <div class="flex-1">
                  <label for="filter-date-from" class="block text-xs font-medium text-slate-600">From</label>
                  <input type="date" id="filter-date-from" class="mt-1 h-8 w-full rounded border border-slate-300 px-2 text-sm focus-visible:ring-2 focus-visible:ring-blue-700">
                </div>
                <div class="flex-1">
                  <label for="filter-date-to" class="block text-xs font-medium text-slate-600">To</label>
                  <input type="date" id="filter-date-to" class="mt-1 h-8 w-full rounded border border-slate-300 px-2 text-sm focus-visible:ring-2 focus-visible:ring-blue-700">
                </div>
              </div>
              <div class="mt-3 flex items-center justify-between border-t border-slate-100 pt-3">
                <button type="button" id="more-filters-reset" class="rounded px-2 py-1 text-xs font-medium text-slate-600 hover:bg-slate-50">Reset</button>
                <button type="button" id="more-filters-apply" class="inline-flex h-8 items-center rounded bg-blue-700 px-3 text-sm font-medium text-white hover:bg-blue-800">Apply</button>
              </div>
            </div>
          </div>
        </div>

        <!-- Applied chips -->
        <div id="chips-row" class="flex flex-wrap items-center gap-2 pb-2" hidden></div>

        <p id="result-count-live" role="status" class="sr-only"></p>

        <!-- Bulk bar -->
        <div id="bulk-bar" hidden class="flex h-10 items-center gap-3 border-b border-slate-200 bg-blue-50 px-3 text-sm">
          <span id="bulk-count" class="font-medium text-slate-900 tabular-nums"></span>
          <button type="button" id="bulk-select-all-matching" class="text-blue-700 hover:underline"></button>
          <button type="button" id="bulk-deactivate" class="inline-flex h-7 items-center rounded border border-red-300 bg-white px-2.5 text-red-700 hover:bg-red-50">Deactivate selected</button>
          <button type="button" id="bulk-cancel" class="ml-auto rounded px-2 py-1 text-slate-600 hover:bg-white">Cancel</button>
        </div>

        <!-- Partial-failure banner -->
        <div id="result-banner" role="status" hidden class="flex items-start gap-2 border-b border-amber-200 bg-amber-50 px-3 py-2 text-sm text-amber-800">
          <svg class="mt-0.5 size-4 shrink-0" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12" y2="17"/></svg>
          <span id="result-banner-text" class="flex-1"></span>
          <button type="button" id="result-banner-close" aria-label="Dismiss" class="rounded p-0.5 hover:bg-amber-100"><svg class="size-4" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
        </div>

        <!-- Table -->
        <div class="rounded-md border border-slate-200 bg-white">
          <table class="w-full border-collapse text-left text-sm">
            <caption class="sr-only">Users</caption>
            <thead>
              <tr class="h-10 border-b border-slate-200">
                <th scope="col" class="w-10 px-3"><label class="relative inline-flex size-6 items-center justify-center"><input type="checkbox" id="select-all" class="size-4" aria-label="Select all rows on this page"></label></th>
                <th scope="col" class="px-3 font-medium text-slate-600">
                  <button type="button" id="sort-name" class="inline-flex items-center gap-1 font-medium text-slate-600 hover:text-slate-900">Name<svg class="size-4 text-slate-500" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 9l4-4 4 4M8 15l4 4 4-4"/></svg></button>
                </th>
                <th scope="col" class="px-3 font-medium text-slate-600">Email</th>
                <th scope="col" class="px-3 font-medium text-slate-600">Role</th>
                <th scope="col" class="px-3 font-medium text-slate-600">Status</th>
                <th scope="col" class="px-3 font-medium text-slate-600">
                  <button type="button" id="sort-lastSignIn" class="inline-flex items-center gap-1 font-medium text-slate-600 hover:text-slate-900">Last sign-in<svg class="size-4 text-slate-500" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 9l4-4 4 4M8 15l4 4 4-4"/></svg></button>
                </th>
                <th scope="col" class="px-3"><span class="sr-only">Actions</span></th>
              </tr>
            </thead>
            <tbody id="table-body"></tbody>
          </table>
        </div>

        <!-- Pagination -->
        <div id="pagination-bar" class="flex items-center justify-between py-3 text-sm text-slate-600">
          <p id="pagination-summary" class="tabular-nums"></p>
          <div class="flex items-center gap-3">
            <label for="page-size" class="text-slate-600">Rows per page</label>
            <select id="page-size" class="h-8 rounded border border-slate-300 bg-white px-2 text-sm focus-visible:ring-2 focus-visible:ring-blue-700">
              <option value="10">10</option>
              <option value="25" selected>25</option>
              <option value="50">50</option>
            </select>
            <div id="pagination-controls" class="flex items-center gap-1"></div>
          </div>
        </div>

      </div>
    </main>
  </div>
</div>

<!-- Toast container -->
<div id="toast-container" class="fixed right-4 top-4 z-50 flex w-80 flex-col gap-2"></div>

<!-- Invite user dialog -->
<div id="invite-dialog-backdrop" hidden class="fixed inset-0 z-40 flex items-center justify-center bg-slate-900/40 p-4">
  <div id="invite-dialog" role="dialog" aria-modal="true" aria-labelledby="invite-dialog-title" class="w-full max-w-md rounded-lg bg-white shadow-xl">
    <form id="invite-form" novalidate>
      <div class="border-b border-slate-200 px-5 py-4">
        <h2 id="invite-dialog-title" class="text-base font-semibold text-slate-900">Invite user</h2>
      </div>
      <div class="px-5 py-4">
        <p class="mb-3 text-xs text-slate-500">* Required</p>
        <div id="invite-error-summary" role="status" hidden class="mb-4 rounded border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-800">
          <p class="font-medium">Fix the following to continue:</p>
          <ul id="invite-error-list" class="mt-1 list-inside list-disc"></ul>
        </div>
        <div class="space-y-4">
          <div>
            <label for="invite-name" class="block text-sm font-medium text-slate-700">Full name <span aria-hidden="true" class="text-red-600">*</span></label>
            <input type="text" id="invite-name" aria-required="true" autocomplete="off" class="mt-1 h-8 w-full rounded border border-slate-300 px-2.5 text-sm placeholder:text-slate-500 focus-visible:ring-2 focus-visible:ring-blue-700" placeholder="Jordan Blake">
            <p id="invite-name-error" class="mt-1 hidden text-sm text-red-700"></p>
          </div>
          <div>
            <label for="invite-email" class="block text-sm font-medium text-slate-700">Email <span aria-hidden="true" class="text-red-600">*</span></label>
            <input type="email" id="invite-email" aria-required="true" autocomplete="off" class="mt-1 h-8 w-full rounded border border-slate-300 px-2.5 text-sm placeholder:text-slate-500 focus-visible:ring-2 focus-visible:ring-blue-700" placeholder="jordan.blake@acme.io">
            <p id="invite-email-error" class="mt-1 hidden text-sm text-red-700"></p>
          </div>
          <div>
            <label for="invite-role" class="block text-sm font-medium text-slate-700">Role <span aria-hidden="true" class="text-red-600">*</span></label>
            <select id="invite-role" aria-required="true" class="mt-1 h-8 w-full rounded border border-slate-300 bg-white px-2.5 text-sm focus-visible:ring-2 focus-visible:ring-blue-700">
              <option value="">Select a role</option>
              <option value="Administrator">Administrator</option>
              <option value="Billing manager">Billing manager</option>
              <option value="Editor">Editor</option>
              <option value="Viewer">Viewer</option>
            </select>
            <p id="invite-role-error" class="mt-1 hidden text-sm text-red-700"></p>
          </div>
        </div>
      </div>
      <div class="flex justify-end gap-2 border-t border-slate-200 bg-slate-50 px-5 py-3">
        <button type="button" id="invite-cancel" class="inline-flex h-8 items-center rounded border border-slate-300 bg-white px-3 text-sm font-medium text-slate-700 hover:bg-slate-50">Cancel</button>
        <button type="submit" id="invite-submit" class="inline-flex h-8 items-center gap-1.5 rounded bg-blue-700 px-3 text-sm font-medium text-white hover:bg-blue-800">
          <svg id="invite-submit-spinner" hidden class="size-4 animate-spin" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9"/></svg>
          Send invitation
        </button>
      </div>
    </form>
  </div>
</div>

<!-- Generic confirm dialog -->
<div id="confirm-dialog-backdrop" hidden class="fixed inset-0 z-40 flex items-center justify-center bg-slate-900/40 p-4">
  <div id="confirm-dialog" role="alertdialog" aria-modal="true" aria-labelledby="confirm-dialog-title" aria-describedby="confirm-dialog-desc" class="w-full max-w-md rounded-lg bg-white shadow-xl">
    <div class="px-5 py-4">
      <h2 id="confirm-dialog-title" class="text-base font-semibold text-slate-900"></h2>
      <p id="confirm-dialog-desc" class="mt-2 text-sm text-slate-600"></p>
      <p id="confirm-dialog-error" role="alert" class="mt-2 hidden text-sm text-red-700"></p>
    </div>
    <div class="flex justify-end gap-2 border-t border-slate-200 bg-slate-50 px-5 py-3">
      <button type="button" id="confirm-dialog-cancel" class="inline-flex h-8 items-center rounded border border-slate-300 bg-white px-3 text-sm font-medium text-slate-700 hover:bg-slate-50"></button>
      <button type="button" id="confirm-dialog-confirm" class="inline-flex h-8 items-center gap-1.5 rounded px-3 text-sm font-medium text-white">
        <svg id="confirm-dialog-spinner" hidden class="size-4 animate-spin" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9"/></svg>
        <span id="confirm-dialog-confirm-label"></span>
      </button>
    </div>
  </div>
</div>

<!-- Blocked action dialog -->
<div id="blocked-dialog-backdrop" hidden class="fixed inset-0 z-40 flex items-center justify-center bg-slate-900/40 p-4">
  <div id="blocked-dialog" role="dialog" aria-modal="true" aria-labelledby="blocked-dialog-title" aria-describedby="blocked-dialog-desc" class="w-full max-w-md rounded-lg bg-white shadow-xl">
    <div class="px-5 py-4">
      <h2 id="blocked-dialog-title" class="text-base font-semibold text-slate-900"></h2>
      <p id="blocked-dialog-desc" class="mt-2 text-sm text-slate-600"></p>
    </div>
    <div class="flex justify-end gap-2 border-t border-slate-200 bg-slate-50 px-5 py-3">
      <button type="button" id="blocked-dialog-close" class="inline-flex h-8 items-center rounded bg-blue-700 px-3 text-sm font-medium text-white hover:bg-blue-800">Close</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ---------------- Formatting helpers ---------------- */
  var nf = new Intl.NumberFormat('en-US');
  var rtf = new Intl.RelativeTimeFormat('en-US', { numeric: 'auto' });
  function formatNumber(n) { return nf.format(n); }
  function formatDate(d) { return new Intl.DateTimeFormat('en-US', { month: 'short', day: 'numeric', year: 'numeric' }).format(d); }
  function formatTime(d) { return new Intl.DateTimeFormat('en-US', { hour: 'numeric', minute: '2-digit' }).format(d); }
  function formatDateTime(iso) { var d = new Date(iso); return formatDate(d) + ', ' + formatTime(d); }
  function formatRelative(iso) {
    var now = new Date();
    var d = new Date(iso);
    var diffMs = d.getTime() - now.getTime();
    var diffDays = diffMs / 86400000;
    if (Math.abs(diffDays) >= 7) return null;
    var diffHours = diffMs / 3600000;
    var diffMin = diffMs / 60000;
    if (Math.abs(diffMin) < 1) return 'just now';
    if (Math.abs(diffHours) < 1) return rtf.format(Math.round(diffMin), 'minute');
    if (Math.abs(diffDays) < 1) return rtf.format(Math.round(diffHours), 'hour');
    return rtf.format(Math.round(diffDays), 'day');
  }
  function formatEmpty() { return '—'; }
  function foldText(s) { return s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }

  /* ---------------- Mock data generation ---------------- */
  var FIRST = ["Sophia","Liam","Olivia","Noah","Emma","Ethan","Ava","Mason","Isabella","Lucas","Mia","Elijah","Charlotte","James","Amelia","Benjamin","Harper","Henry","Evelyn","Alexander","Abigail","Daniel","Ella","Matthew","Scarlett","Jackson","Grace","Sebastian"];
  var LAST = ["Bennett","Russell","Coleman","Foster","Hughes","Simmons","Powell","Barnes","Reyes","Fisher","Hayes","Myers","Ford","Graham","Wallace","Stone","Jennings","Mercer","Dawson","Pierce","Lambert","Sullivan","Chen","Patel","Nguyen","Kim","Ahmed","Torres"];
  var ROLE_CYCLE = ["Viewer","Editor","Editor","Editor","Billing manager","Administrator"];
  var STATUS_CYCLE = ["active","active","active","active","active","active","active","invited","invited","deactivated"];
  var N = 56;

  function buildUsers() {
    var now = Date.now();
    var users = [];
    for (var i = 0; i < N; i++) {
      var cycle = Math.floor(i / FIRST.length);
      var local = i % FIRST.length;
      var first = FIRST[local];
      var last = LAST[(local + cycle * 5) % LAST.length];
      var name = first + ' ' + last;
      var email = (first + '.' + last).toLowerCase() + '@acme.io';
      var isOwner = i === 0;
      var role = isOwner ? 'Owner' : ROLE_CYCLE[i % ROLE_CYCLE.length];
      var status = isOwner ? 'active' : STATUS_CYCLE[i % STATUS_CYCLE.length];
      var lastSignIn = null;
      if (status === 'active') {
        var daysAgo = (i * 3 + 1) % 45;
        var hoursAgo = (i * 37) % 24;
        var minAgo = (i * 17) % 60;
        lastSignIn = new Date(now - daysAgo * 86400000 - hoursAgo * 3600000 - minAgo * 60000).toISOString();
      } else if (status === 'deactivated') {
        var oldDays = 60 + ((i * 5) % 120);
        lastSignIn = new Date(now - oldDays * 86400000).toISOString();
      }
      users.push({ id: 'u' + i, name: name, email: email, role: role, status: status, lastSignIn: lastSignIn, isOwner: isOwner });
    }
    return users;
  }

  var ALL_USERS = buildUsers();
  var ROLES = ["Owner", "Administrator", "Billing manager", "Editor", "Viewer"];

  /* ---------------- State ---------------- */
  var urlState = new URLSearchParams(location.search).get('state');
  var pageMode = (urlState === 'empty' || urlState === 'error' || urlState === 'loading') ? urlState : 'normal';

  var state = {
    loading: true,
    error: pageMode === 'error',
    q: '',
    roles: new Set(),
    dateFrom: null,
    dateTo: null,
    status: 'all',
    sort: { key: 'lastSignIn', dir: 'desc' },
    page: 1,
    pageSize: 25,
    selection: new Set(),
    allMatching: false
  };

  var DATA = pageMode === 'empty' ? [] : ALL_USERS;

  /* ---------------- DOM refs ---------------- */
  var $ = function (id) { return document.getElementById(id); };
  var tableBody = $('table-body');
  var selectAllCheckbox = $('select-all');
  var lastFocusedTrigger = null;

  /* ---------------- Filtering / sorting / pagination ---------------- */
  function matchesSearch(u, q) {
    if (!q) return true;
    var folded = foldText(q.trim());
    return foldText(u.name).indexOf(folded) !== -1 || foldText(u.email).indexOf(folded) !== -1;
  }
  function matchesRoles(u) {
    if (state.roles.size === 0) return true;
    return state.roles.has(u.role);
  }
  function matchesDate(u) {
    if (!state.dateFrom && !state.dateTo) return true;
    if (!u.lastSignIn) return false;
    var t = new Date(u.lastSignIn).getTime();
    if (state.dateFrom && t < new Date(state.dateFrom + 'T00:00:00').getTime()) return false;
    if (state.dateTo && t > new Date(state.dateTo + 'T23:59:59').getTime()) return false;
    return true;
  }
  function applyNonStatusFilters(list) {
    return list.filter(function (u) { return matchesSearch(u, state.q) && matchesRoles(u) && matchesDate(u); });
  }
  function applyStatusFilter(list, status) {
    if (status === 'all') return list;
    return list.filter(function (u) { return u.status === status; });
  }
  function getFiltered() {
    return applyStatusFilter(applyNonStatusFilters(DATA), state.status);
  }
  function sortList(list) {
    var key = state.sort.key, dir = state.sort.dir;
    var copy = list.slice();
    copy.sort(function (a, b) {
      var av, bv;
      if (key === 'name') { av = a.name.toLowerCase(); bv = b.name.toLowerCase(); }
      else { av = a.lastSignIn ? new Date(a.lastSignIn).getTime() : -Infinity; bv = b.lastSignIn ? new Date(b.lastSignIn).getTime() : -Infinity; }
      if (av < bv) return dir === 'asc' ? -1 : 1;
      if (av > bv) return dir === 'asc' ? 1 : -1;
      return 0;
    });
    return copy;
  }

  /* ---------------- Rendering ---------------- */
  var TONE = {
    active: { classes: 'bg-green-50 text-green-700', label: 'Active', icon: iconCircleCheck },
    invited: { classes: 'bg-blue-50 text-blue-700', label: 'Invited', icon: iconClock },
    deactivated: { classes: 'bg-slate-100 text-slate-700', label: 'Deactivated', icon: iconCircle }
  };

  function iconCircleCheck() { return '<svg class="size-3.5 shrink-0" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>'; }
  function iconClock() { return '<svg class="size-3.5 shrink-0" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>'; }
  function iconCircle() { return '<svg class="size-3.5 shrink-0" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/></svg>'; }
  function iconDots() { return '<svg class="size-4" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>'; }

  function statusBadge(status) {
    var t = TONE[status];
    return '<span class="inline-flex h-6 max-w-[160px] items-center gap-1 rounded-full px-2 text-xs font-medium leading-5 ' + t.classes + '">' + t.icon() + '<span class="truncate" title="' + t.label + '">' + t.label + '</span></span>';
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
  }

  function initials(name) {
    var parts = name.trim().split(/\s+/);
    return ((parts[0] || '')[0] || '') + ((parts[parts.length - 1] || '')[0] || '');
  }

  function render() {
    renderTabs();
    renderChips();
    renderTable();
    renderBulkBar();
    updateMoreFiltersLabel();
    updateRoleFilterLabel();
  }

  function renderTabs() {
    var base = applyNonStatusFilters(DATA);
    var counts = { all: base.length, active: 0, invited: 0, deactivated: 0 };
    base.forEach(function (u) { counts[u.status]++; });
    $('tab-count-all').textContent = formatNumber(counts.all);
    $('tab-count-active').textContent = formatNumber(counts.active);
    $('tab-count-invited').textContent = formatNumber(counts.invited);
    $('tab-count-deactivated').textContent = formatNumber(counts.deactivated);
    document.querySelectorAll('.status-tab').forEach(function (tab) {
      var isSel = tab.getAttribute('data-status') === state.status;
      tab.setAttribute('aria-selected', isSel ? 'true' : 'false');
      tab.classList.toggle('border-blue-700', isSel);
      tab.classList.toggle('text-slate-900', isSel);
      tab.classList.toggle('border-transparent', !isSel);
      tab.classList.toggle('text-slate-500', !isSel);
    });
  }

  function chip(label, onRemove) {
    var el = document.createElement('span');
    el.className = 'inline-flex h-6 items-center gap-1 rounded-full border border-slate-300 bg-slate-100 pl-2 pr-1 text-xs font-medium leading-5 text-slate-700';
    el.textContent = label;
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'inline-flex size-6 items-center justify-center rounded-full hover:bg-slate-200';
    btn.setAttribute('aria-label', 'Remove filter ' + label);
    btn.innerHTML = '<svg class="size-3.5" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
    btn.addEventListener('click', onRemove);
    el.appendChild(btn);
    return el;
  }

  function renderChips() {
    var row = $('chips-row');
    row.innerHTML = '';
    var any = false;
    if (state.q) {
      any = true;
      row.appendChild(chip('Search: ' + state.q, function () { state.q = ''; $('search-input').value = ''; $('search-clear').hidden = true; resetPageAndSelection(); render(); }));
    }
    state.roles.forEach(function (r) {
      any = true;
      row.appendChild(chip('Role: ' + r, function () { state.roles.delete(r); syncRoleCheckboxes(); resetPageAndSelection(); render(); }));
    });
    if (state.dateFrom || state.dateTo) {
      any = true;
      var label = 'Last sign-in: ' + (state.dateFrom ? formatDate(new Date(state.dateFrom + 'T00:00:00')) : '…') + ' – ' + (state.dateTo ? formatDate(new Date(state.dateTo + 'T00:00:00')) : '…');
      row.appendChild(chip(label, function () { state.dateFrom = null; state.dateTo = null; $('filter-date-from').value = ''; $('filter-date-to').value = ''; resetPageAndSelection(); render(); }));
    }
    if (any) {
      var clearAll = document.createElement('button');
      clearAll.type = 'button';
      clearAll.className = 'text-xs font-medium text-blue-700 hover:underline';
      clearAll.textContent = 'Clear all';
      clearAll.addEventListener('click', function () {
        state.q = ''; $('search-input').value = ''; $('search-clear').hidden = true;
        state.roles.clear(); syncRoleCheckboxes();
        state.dateFrom = null; state.dateTo = null; $('filter-date-from').value = ''; $('filter-date-to').value = '';
        resetPageAndSelection(); render();
      });
      row.appendChild(clearAll);
    }
    row.hidden = !any;
  }

  function updateRoleFilterLabel() {
    var label = $('role-filter-label');
    if (state.roles.size === 0) label.textContent = 'Role';
    else if (state.roles.size === 1) label.textContent = 'Role: ' + Array.from(state.roles)[0];
    else label.textContent = 'Role: ' + state.roles.size + ' selected';
  }
  function updateMoreFiltersLabel() {
    var count = (state.dateFrom || state.dateTo) ? 1 : 0;
    $('more-filters-label').textContent = count > 0 ? 'More filters (' + count + ')' : 'More filters';
  }

  function colSpan() { return 7; }

  function skeletonRows() {
    var html = '';
    for (var i = 0; i < 8; i++) {
      html += '<tr class="h-10" aria-hidden="true">';
      for (var c = 0; c < 7; c++) {
        html += '<td class="px-3 py-0"><div class="h-4 w-full max-w-[160px] animate-pulse rounded bg-slate-200"></div></td>';
      }
      html += '</tr>';
    }
    return html;
  }

  function emptyStateRow(variant) {
    var inner;
    if (variant === 'first-use') {
      inner = '<p class="text-base font-medium text-slate-900">No users yet</p>' +
        '<p class="mt-1 max-w-sm text-sm text-slate-500">Invite your team to this workspace. Invited users appear here until they accept.</p>' +
        '<button type="button" id="empty-invite-btn" class="mt-3 inline-flex h-8 items-center gap-1.5 rounded bg-blue-700 px-3 text-sm font-medium text-white hover:bg-blue-800">Invite user</button>';
    } else {
      var hint = state.q ? 'No users match &ldquo;' + escapeHtml(state.q) + '&rdquo;.' : 'No users match these filters.';
      inner = '<p class="text-base font-medium text-slate-900">' + hint + '</p>' +
        '<p class="mt-1 max-w-sm text-sm text-slate-500">Check the spelling or adjust your filters.</p>' +
        '<button type="button" id="empty-clear-btn" class="mt-3 inline-flex h-8 items-center rounded border border-slate-300 bg-white px-3 text-sm font-medium text-slate-700 hover:bg-slate-50">Clear filters</button>';
    }
    return '<tr><td colspan="' + colSpan() + '"><div class="flex flex-col items-center gap-1 px-6 py-12 text-center">' + inner + '</div></td></tr>';
  }

  function errorStateRow() {
    return '<tr><td colspan="' + colSpan() + '"><div class="flex flex-col items-center gap-2 px-6 py-12 text-center">' +
      '<p class="text-base font-medium text-slate-900">Couldn\'t load users</p>' +
      '<p class="max-w-sm text-sm text-slate-500">Check your connection and try again.</p>' +
      '<button type="button" id="error-retry-btn" class="mt-1 inline-flex h-8 items-center rounded border border-slate-300 bg-white px-3 text-sm font-medium text-slate-700 hover:bg-slate-50">Retry</button>' +
      '</div></td></tr>';
  }

  function userRowHtml(u) {
    var rel = u.lastSignIn ? formatRelative(u.lastSignIn) : null;
    var lastSignInHtml = u.lastSignIn
      ? '<time datetime="' + u.lastSignIn + '" class="tabular-nums">' + formatDateTime(u.lastSignIn) + (rel ? ' · ' + rel : '') + '</time>'
      : '<span class="text-slate-500" aria-hidden="true">' + formatEmpty() + '</span><span class="sr-only">Not set</span>';
    var checked = state.selection.has(u.id);
    var actions = rowActionsHtml(u);
    return '<tr class="h-10 hover:bg-slate-50" data-row-id="' + u.id + '">' +
      '<td class="px-3"><label class="relative inline-flex size-6 items-center justify-center"><input type="checkbox" class="row-checkbox size-4" data-id="' + u.id + '" aria-label="Select ' + escapeHtml(u.name) + '"' + (checked ? ' checked' : '') + '></label></td>' +
      '<td class="px-3"><div class="flex items-center gap-2">' +
        '<span class="flex size-7 shrink-0 items-center justify-center rounded-full bg-slate-200 text-xs font-medium text-slate-700" aria-hidden="true">' + escapeHtml(initials(u.name)) + '</span>' +
        '<span class="font-medium text-slate-900">' + escapeHtml(u.name) + (u.isOwner ? ' <span class="ml-1 rounded bg-slate-100 px-1.5 py-0.5 text-xs font-medium text-slate-600">Owner</span>' : '') + '</span>' +
      '</div></td>' +
      '<td class="px-3"><a href="mailto:' + escapeHtml(u.email) + '" class="text-slate-700 underline-offset-2 hover:underline">' + escapeHtml(u.email) + '</a></td>' +
      '<td class="px-3 text-slate-700">' + escapeHtml(u.role) + '</td>' +
      '<td class="px-3">' + statusBadge(u.status) + '</td>' +
      '<td class="px-3 text-slate-700">' + lastSignInHtml + '</td>' +
      '<td class="px-3 text-right"><div class="relative inline-flex items-center justify-end gap-1">' + actions + '</div></td>' +
      '</tr>';
  }

  function rowActionsHtml(u) {
    var html = '';
    if (u.status === 'active') {
      html += '<button type="button" class="action-reset-password inline-flex h-7 items-center rounded px-2 text-slate-700 hover:bg-slate-100" data-id="' + u.id + '" aria-label="Reset password for ' + escapeHtml(u.name) + '">Reset password</button>';
      html += '<div class="relative inline-block row-menu-wrap">' +
        '<button type="button" class="row-menu-trigger inline-flex size-7 items-center justify-center rounded hover:bg-slate-100" aria-haspopup="menu" aria-expanded="false" aria-label="Actions for ' + escapeHtml(u.name) + '">' + iconDots() + '</button>' +
        '<div class="row-menu absolute right-0 top-full z-20 mt-1 w-48 rounded-md border border-slate-200 bg-white p-1 shadow-lg" role="menu" hidden>' +
          '<button type="button" role="menuitem" class="action-deactivate w-full rounded px-2 py-1.5 text-left text-red-700 hover:bg-red-50" data-id="' + u.id + '">Deactivate account</button>' +
        '</div></div>';
    } else if (u.status === 'invited') {
      html += '<button type="button" class="action-resend-invite inline-flex h-7 items-center rounded px-2 text-slate-700 hover:bg-slate-100" data-id="' + u.id + '" aria-label="Resend invitation to ' + escapeHtml(u.name) + '">Resend invitation</button>';
      html += '<div class="relative inline-block row-menu-wrap">' +
        '<button type="button" class="row-menu-trigger inline-flex size-7 items-center justify-center rounded hover:bg-slate-100" aria-haspopup="menu" aria-expanded="false" aria-label="Actions for ' + escapeHtml(u.name) + '">' + iconDots() + '</button>' +
        '<div class="row-menu absolute right-0 top-full z-20 mt-1 w-48 rounded-md border border-slate-200 bg-white p-1 shadow-lg" role="menu" hidden>' +
          '<button type="button" role="menuitem" class="action-cancel-invite w-full rounded px-2 py-1.5 text-left text-red-700 hover:bg-red-50" data-id="' + u.id + '">Cancel invitation</button>' +
        '</div></div>';
    } else {
      html += '<button type="button" class="action-reactivate inline-flex h-7 items-center rounded px-2 text-slate-700 hover:bg-slate-100" data-id="' + u.id + '" aria-label="Reactivate account for ' + escapeHtml(u.name) + '">Reactivate account</button>';
    }
    return html;
  }

  var currentPageUsers = [];

  function renderTable() {
    if (state.loading) {
      tableBody.setAttribute('aria-busy', 'true');
      tableBody.innerHTML = skeletonRows();
      $('pagination-bar').hidden = true;
      return;
    }
    tableBody.setAttribute('aria-busy', 'false');

    if (state.error) {
      tableBody.innerHTML = errorStateRow();
      $('error-retry-btn').addEventListener('click', onRetry);
      $('pagination-bar').hidden = true;
      $('result-count-live').textContent = 'Couldn\'t load users';
      return;
    }

    var unfilteredTotal = DATA.length;
    if (unfilteredTotal === 0) {
      tableBody.innerHTML = emptyStateRow('first-use');
      $('empty-invite-btn').addEventListener('click', openInviteDialog);
      $('pagination-bar').hidden = true;
      $('result-count-live').textContent = 'No users yet';
      currentPageUsers = [];
      return;
    }

    var filtered = sortList(getFiltered());
    if (filtered.length === 0) {
      tableBody.innerHTML = emptyStateRow('no-results');
      $('empty-clear-btn').addEventListener('click', function () {
        state.q = ''; $('search-input').value = ''; $('search-clear').hidden = true;
        state.roles.clear(); syncRoleCheckboxes();
        state.dateFrom = null; state.dateTo = null; $('filter-date-from').value = ''; $('filter-date-to').value = '';
        state.status = 'all'; resetPageAndSelection(); render();
      });
      $('pagination-bar').hidden = true;
      $('result-count-live').textContent = 'No users match';
      currentPageUsers = [];
      return;
    }

    $('pagination-bar').hidden = false;
    var totalPages = Math.max(1, Math.ceil(filtered.length / state.pageSize));
    if (state.page > totalPages) state.page = totalPages;
    var startIdx = (state.page - 1) * state.pageSize;
    var pageItems = filtered.slice(startIdx, startIdx + state.pageSize);
    currentPageUsers = pageItems;

    tableBody.innerHTML = pageItems.map(function (u) { return userRowHtml(u); }).join('');
    attachRowHandlers();
    syncHeaderCheckboxState();
    renderPagination(filtered.length, startIdx, pageItems.length, totalPages);

    $('result-count-live').textContent = formatNumber(filtered.length) + ' user' + (filtered.length === 1 ? '' : 's') + ' match';
  }

  function renderPagination(total, startIdx, pageCount, totalPages) {
    $('pagination-summary').textContent = total === 0 ? '0 users' : ('Showing ' + formatNumber(startIdx + 1) + '–' + formatNumber(startIdx + pageCount) + ' of ' + formatNumber(total) + ' users');
    var controls = $('pagination-controls');
    controls.innerHTML = '';
    var prev = document.createElement('button');
    prev.type = 'button'; prev.textContent = 'Previous';
    prev.className = 'inline-flex h-8 items-center rounded border border-slate-300 bg-white px-2.5 text-slate-700 hover:bg-slate-50 disabled:opacity-50 disabled:cursor-not-allowed';
    prev.disabled = state.page <= 1;
    prev.addEventListener('click', function () { state.page--; clearSelection(); render(); });
    controls.appendChild(prev);

    for (var p = 1; p <= totalPages; p++) {
      var btn = document.createElement('button');
      btn.type = 'button'; btn.textContent = String(p);
      var isCur = p === state.page;
      btn.setAttribute('aria-current', isCur ? 'page' : 'false');
      btn.className = 'inline-flex h-8 min-w-8 items-center justify-center rounded px-2 tabular-nums ' + (isCur ? 'bg-blue-700 text-white font-medium' : 'text-slate-700 hover:bg-slate-100');
      btn.addEventListener('click', function (pp) { return function () { state.page = pp; clearSelection(); render(); }; }(p));
      controls.appendChild(btn);
    }

    var next = document.createElement('button');
    next.type = 'button'; next.textContent = 'Next';
    next.className = 'inline-flex h-8 items-center rounded border border-slate-300 bg-white px-2.5 text-slate-700 hover:bg-slate-50 disabled:opacity-50 disabled:cursor-not-allowed';
    next.disabled = state.page >= totalPages;
    next.addEventListener('click', function () { state.page++; clearSelection(); render(); });
    controls.appendChild(next);
  }

  function attachRowHandlers() {
    document.querySelectorAll('.row-checkbox').forEach(function (cb) {
      cb.addEventListener('change', function () {
        var id = cb.getAttribute('data-id');
        if (cb.checked) { state.selection.add(id); }
        else { state.selection.delete(id); state.allMatching = false; }
        renderBulkBar();
        syncHeaderCheckboxState();
      });
    });
    document.querySelectorAll('.action-reset-password').forEach(function (btn) {
      btn.addEventListener('click', function () { onResetPassword(findUser(btn.getAttribute('data-id'))); });
    });
    document.querySelectorAll('.action-resend-invite').forEach(function (btn) {
      btn.addEventListener('click', function () { onResendInvite(findUser(btn.getAttribute('data-id'))); });
    });
    document.querySelectorAll('.action-reactivate').forEach(function (btn) {
      btn.addEventListener('click', function () { onReactivate(findUser(btn.getAttribute('data-id'))); });
    });
    document.querySelectorAll('.action-deactivate').forEach(function (btn) {
      btn.addEventListener('click', function () { closeAllRowMenus(); onDeactivate(findUser(btn.getAttribute('data-id')), btn); });
    });
    document.querySelectorAll('.action-cancel-invite').forEach(function (btn) {
      btn.addEventListener('click', function () { closeAllRowMenus(); onCancelInvite(findUser(btn.getAttribute('data-id')), btn); });
    });
    document.querySelectorAll('.row-menu-trigger').forEach(function (trigger) {
      trigger.addEventListener('click', function (e) {
        e.stopPropagation();
        var wrap = trigger.closest('.row-menu-wrap');
        var menu = wrap.querySelector('.row-menu');
        var isOpen = !menu.hidden;
        closeAllRowMenus();
        if (!isOpen) {
          menu.hidden = false;
          trigger.setAttribute('aria-expanded', 'true');
          var first = menu.querySelector('[role="menuitem"]');
          if (first) first.focus();
        }
      });
      trigger.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowDown' || e.key === 'Enter' || e.key === ' ') {
          e.preventDefault(); trigger.click();
        }
      });
    });
    document.querySelectorAll('.row-menu').forEach(function (menu) {
      menu.addEventListener('keydown', function (e) {
        var items = Array.prototype.slice.call(menu.querySelectorAll('[role="menuitem"]'));
        var idx = items.indexOf(document.activeElement);
        if (e.key === 'ArrowDown') { e.preventDefault(); items[(idx + 1) % items.length].focus(); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); items[(idx - 1 + items.length) % items.length].focus(); }
        else if (e.key === 'Escape') { e.preventDefault(); closeAllRowMenus(); menu.closest('.row-menu-wrap').querySelector('.row-menu-trigger').focus(); }
      });
    });
  }

  function closeAllRowMenus() {
    document.querySelectorAll('.row-menu').forEach(function (m) { m.hidden = true; });
    document.querySelectorAll('.row-menu-trigger').forEach(function (t) { t.setAttribute('aria-expanded', 'false'); });
  }
  document.addEventListener('click', function () { closeAllRowMenus(); });

  function findUser(id) { return DATA.find(function (u) { return u.id === id; }); }

  function syncHeaderCheckboxState() {
    if (currentPageUsers.length === 0) { selectAllCheckbox.checked = false; selectAllCheckbox.indeterminate = false; return; }
    var selectedOnPage = currentPageUsers.filter(function (u) { return state.selection.has(u.id); }).length;
    if (selectedOnPage === 0) { selectAllCheckbox.checked = false; selectAllCheckbox.indeterminate = false; }
    else if (selectedOnPage === currentPageUsers.length) { selectAllCheckbox.checked = true; selectAllCheckbox.indeterminate = false; }
    else { selectAllCheckbox.checked = false; selectAllCheckbox.indeterminate = true; }
  }

  selectAllCheckbox.addEventListener('change', function () {
    if (selectAllCheckbox.checked) {
      currentPageUsers.forEach(function (u) { state.selection.add(u.id); });
    } else {
      currentPageUsers.forEach(function (u) { state.selection.delete(u.id); });
      state.allMatching = false;
    }
    renderTable();
    renderBulkBar();
  });

  function renderBulkBar() {
    var bar = $('bulk-bar');
    var count = state.selection.size;
    bar.hidden = count === 0;
    if (count === 0) return;
    $('bulk-count').textContent = (state.allMatching ? 'All ' : '') + formatNumber(count) + (state.allMatching ? ' matching selected' : ' selected');

    var filteredTotal = sortList(getFiltered()).length;
    var selectAllBtn = $('bulk-select-all-matching');
    var allOnPageSelected = currentPageUsers.length > 0 && currentPageUsers.every(function (u) { return state.selection.has(u.id); });
    if (!state.allMatching && allOnPageSelected && filteredTotal > currentPageUsers.length) {
      selectAllBtn.hidden = false;
      selectAllBtn.textContent = 'Select all ' + formatNumber(filteredTotal) + ' matching';
    } else if (state.allMatching) {
      selectAllBtn.hidden = false;
      selectAllBtn.textContent = 'Clear selection';
    } else {
      selectAllBtn.hidden = true;
    }
  }

  $('bulk-select-all-matching').addEventListener('click', function () {
    if (state.allMatching) { clearSelection(); renderTable(); renderBulkBar(); return; }
    var all = sortList(getFiltered());
    all.forEach(function (u) { state.selection.add(u.id); });
    state.allMatching = true;
    renderTable();
    renderBulkBar();
  });

  $('bulk-cancel').addEventListener('click', function () {
    clearSelection();
    renderTable();
    renderBulkBar();
    selectAllCheckbox.focus();
  });

  $('bulk-deactivate').addEventListener('click', function (e) {
    var selectedUsers = DATA.filter(function (u) { return state.selection.has(u.id); });
    var eligible = selectedUsers.filter(function (u) { return u.status === 'active' && !u.isOwner; });
    var skipped = selectedUsers.length - eligible.length;
    var desc = formatNumber(eligible.length) + ' account' + (eligible.length === 1 ? '' : 's') + ' will immediately lose access and all active sessions will end.';
    if (skipped > 0) desc += ' ' + formatNumber(skipped) + ' selected user' + (skipped === 1 ? '' : 's') + ' will be skipped (already inactive or the account owner).';
    openConfirmDialog({
      trigger: e.currentTarget,
      title: 'Deactivate ' + formatNumber(eligible.length) + ' account' + (eligible.length === 1 ? '' : 's') + '?',
      description: desc,
      confirmLabel: 'Deactivate accounts',
      cancelLabel: 'Keep accounts active',
      destructive: true,
      onConfirm: function () {
        return new Promise(function (resolve) {
          setTimeout(function () {
            eligible.forEach(function (u) { u.status = 'deactivated'; });
            resolve();
          }, 600);
        });
      },
      onSuccess: function () {
        if (skipped > 0) {
          var currentPageIds = new Set(currentPageUsers.map(function (u) { return u.id; }));
          var skippedOnPage = selectedUsers.filter(function (u) { return eligible.indexOf(u) === -1 && currentPageIds.has(u.id); });
          state.selection = new Set(skippedOnPage.map(function (u) { return u.id; }));
          state.allMatching = false;
          showBanner(formatNumber(eligible.length) + ' deactivated, ' + formatNumber(skipped) + ' skipped.');
        } else {
          clearSelection();
          showToast(formatNumber(eligible.length) + ' account' + (eligible.length === 1 ? '' : 's') + ' deactivated.');
        }
        render();
      }
    });
  });

  function clearSelection() { state.selection = new Set(); state.allMatching = false; }
  function resetPageAndSelection() { state.page = 1; clearSelection(); }

  /* ---------------- Row actions ---------------- */
  function onResetPassword(u) {
    showToast('Password reset link sent to ' + u.email + '.');
  }
  function onResendInvite(u) {
    showToast('Invitation resent to ' + u.email + '.');
  }
  function onReactivate(u) {
    u.status = 'active';
    u.lastSignIn = null;
    render();
    showToast('Account reactivated for ' + u.name + '.', {
      actionLabel: 'Undo',
      onAction: function () { u.status = 'deactivated'; render(); }
    });
  }
  function onDeactivate(u, triggerEl) {
    if (u.isOwner) {
      openBlockedDialog(triggerEl, 'Can’t deactivate ' + u.name, u.name + ' is the account owner. Transfer ownership to another administrator before deactivating this account.');
      return;
    }
    openConfirmDialog({
      trigger: triggerEl,
      title: 'Deactivate account for ' + u.name + '?',
      description: 'They will immediately lose access and all active sessions will end.',
      confirmLabel: 'Deactivate account',
      cancelLabel: 'Keep account active',
      destructive: true,
      onConfirm: function () { return new Promise(function (resolve) { setTimeout(function () { u.status = 'deactivated'; resolve(); }, 500); }); },
      onSuccess: function () { showToast('Account deactivated for ' + u.name + '.'); render(); }
    });
  }
  function onCancelInvite(u, triggerEl) {
    openConfirmDialog({
      trigger: triggerEl,
      title: 'Cancel invitation for ' + u.email + '?',
      description: 'They won’t be able to join using this invite.',
      confirmLabel: 'Cancel invitation',
      cancelLabel: 'Keep invitation',
      destructive: true,
      onConfirm: function () { return new Promise(function (resolve) { setTimeout(function () { DATA = DATA.filter(function (x) { return x.id !== u.id; }); resolve(); }, 500); }); },
      onSuccess: function () { showToast('Invitation canceled for ' + u.email + '.'); render(); }
    });
  }

  /* ---------------- Dialog helpers ---------------- */
  function getFocusable(container) {
    return Array.prototype.slice.call(container.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'))
      .filter(function (el) { return !el.disabled && el.offsetParent !== null; });
  }
  function trapFocus(container, e) {
    var focusables = getFocusable(container);
    if (focusables.length === 0) return;
    var first = focusables[0], last = focusables[focusables.length - 1];
    if (e.key === 'Tab') {
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  }

  var openDialogs = [];
  function openDialogGeneric(backdrop, dialog, initialFocusEl, triggerEl) {
    backdrop.hidden = false;
    var keyHandler = function (e) {
      if (e.key === 'Escape') { closeDialogGeneric(backdrop, triggerEl); }
      else { trapFocus(dialog, e); }
    };
    document.addEventListener('keydown', keyHandler);
    openDialogs.push({ backdrop: backdrop, keyHandler: keyHandler });
    setTimeout(function () { (initialFocusEl || dialog).focus(); }, 0);
  }
  function closeDialogGeneric(backdrop, triggerEl) {
    backdrop.hidden = true;
    var entry = openDialogs.pop();
    if (entry) document.removeEventListener('keydown', entry.keyHandler);
    if (triggerEl) triggerEl.focus();
  }

  /* ---------------- Confirm dialog ---------------- */
  var confirmCtx = null;
  function openConfirmDialog(opts) {
    confirmCtx = opts;
    $('confirm-dialog-title').textContent = opts.title;
    $('confirm-dialog-desc').textContent = opts.description;
    $('confirm-dialog-error').hidden = true;
    $('confirm-dialog-error').textContent = '';
    $('confirm-dialog-cancel').textContent = opts.cancelLabel || 'Cancel';
    $('confirm-dialog-confirm-label').textContent = opts.confirmLabel;
    var confirmBtn = $('confirm-dialog-confirm');
    confirmBtn.className = 'inline-flex h-8 items-center gap-1.5 rounded px-3 text-sm font-medium text-white ' + (opts.destructive ? 'bg-red-600 hover:bg-red-700' : 'bg-blue-700 hover:bg-blue-800');
    confirmBtn.disabled = false;
    $('confirm-dialog-spinner').hidden = true;
    $('confirm-dialog-cancel').disabled = false;
    openDialogGeneric($('confirm-dialog-backdrop'), $('confirm-dialog'), $('confirm-dialog-cancel'), opts.trigger || lastFocusedTrigger);
  }
  $('confirm-dialog-cancel').addEventListener('click', function () {
    closeDialogGeneric($('confirm-dialog-backdrop'), confirmCtx && (confirmCtx.trigger || lastFocusedTrigger));
  });
  $('confirm-dialog-confirm').addEventListener('click', function () {
    if (!confirmCtx) return;
    var confirmBtn = $('confirm-dialog-confirm');
    confirmBtn.disabled = true;
    $('confirm-dialog-cancel').disabled = true;
    $('confirm-dialog-spinner').hidden = false;
    Promise.resolve(confirmCtx.onConfirm()).then(function () {
      closeDialogGeneric($('confirm-dialog-backdrop'), null);
      if (confirmCtx.onSuccess) confirmCtx.onSuccess();
      confirmCtx = null;
    }).catch(function () {
      $('confirm-dialog-error').hidden = false;
      $('confirm-dialog-error').textContent = 'Something went wrong. Try again.';
      confirmBtn.disabled = false;
      $('confirm-dialog-cancel').disabled = false;
      $('confirm-dialog-spinner').hidden = true;
    });
  });

  /* ---------------- Blocked dialog ---------------- */
  function openBlockedDialog(triggerEl, title, desc) {
    $('blocked-dialog-title').textContent = title;
    $('blocked-dialog-desc').textContent = desc;
    openDialogGeneric($('blocked-dialog-backdrop'), $('blocked-dialog'), $('blocked-dialog-close'), triggerEl || lastFocusedTrigger);
  }
  $('blocked-dialog-close').addEventListener('click', function () {
    closeDialogGeneric($('blocked-dialog-backdrop'), null);
  });

  /* ---------------- Invite dialog ---------------- */
  function openInviteDialog() {
    lastFocusedTrigger = $('btn-invite');
    $('invite-form').reset();
    clearInviteErrors();
    openDialogGeneric($('invite-dialog-backdrop'), $('invite-dialog'), $('invite-name'), $('btn-invite'));
  }
  $('btn-invite').addEventListener('click', openInviteDialog);
  $('invite-cancel').addEventListener('click', function () { closeDialogGeneric($('invite-dialog-backdrop'), $('btn-invite')); });

  function clearInviteErrors() {
    ['name', 'email', 'role'].forEach(clearFieldError);
    $('invite-error-summary').hidden = true;
    $('invite-error-list').innerHTML = '';
  }

  function clearFieldError(field) {
    $('invite-' + field).removeAttribute('aria-invalid');
    $('invite-' + field).removeAttribute('aria-describedby');
    $('invite-' + field + '-error').hidden = true;
    $('invite-' + field + '-error').textContent = '';
  }

  function setFieldError(field, message) {
    $('invite-' + field).setAttribute('aria-invalid', 'true');
    $('invite-' + field).setAttribute('aria-describedby', 'invite-' + field + '-error');
    $('invite-' + field + '-error').hidden = false;
    $('invite-' + field + '-error').textContent = message;
  }

  function validateInviteField(field) {
    if (field === 'name') {
      return $('invite-name').value.trim() ? null : 'Enter the person’s full name.';
    }
    if (field === 'email') {
      var email = $('invite-email').value.trim();
      if (!email) return 'Enter an email address.';
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return 'Enter an email like name@company.com.';
      if (ALL_USERS.some(function (u) { return u.email.toLowerCase() === email.toLowerCase(); })) return 'A user with this email already exists.';
      return null;
    }
    if (field === 'role') {
      return $('invite-role').value ? null : 'Select a role.';
    }
    return null;
  }

  ['name', 'email', 'role'].forEach(function (f) {
    $('invite-' + f).addEventListener('blur', function () {
      var msg = validateInviteField(f);
      if (msg) setFieldError(f, msg); else clearFieldError(f);
    });
  });

  $('invite-form').addEventListener('submit', function (e) {
    e.preventDefault();
    clearInviteErrors();
    var errors = [];
    ['name', 'email', 'role'].forEach(function (f) {
      var msg = validateInviteField(f);
      if (msg) errors.push({ field: f, message: msg });
    });

    if (errors.length) {
      errors.forEach(function (err) { setFieldError(err.field, err.message); });
      if (errors.length >= 3) {
        $('invite-error-summary').hidden = false;
        $('invite-error-list').innerHTML = errors.map(function (err) { return '<li><a href="#invite-' + err.field + '" class="text-red-700 underline-offset-2 hover:underline">' + err.message + '</a></li>'; }).join('');
      }
      $('invite-' + errors[0].field).focus();
      return;
    }

    var name = $('invite-name').value.trim();
    var email = $('invite-email').value.trim();
    var role = $('invite-role').value;
    var submitBtn = $('invite-submit');
    submitBtn.disabled = true;
    $('invite-submit-spinner').hidden = false;
    setTimeout(function () {
      var newUser = { id: 'u-new-' + Date.now(), name: name, email: email, role: role, status: 'invited', lastSignIn: null, isOwner: false };
      ALL_USERS.unshift(newUser);
      DATA.unshift(newUser);
      submitBtn.disabled = false;
      $('invite-submit-spinner').hidden = true;
      closeDialogGeneric($('invite-dialog-backdrop'), $('btn-invite'));
      showToast('Invitation sent to ' + email + '.');
      state.page = 1;
      render();
    }, 500);
  });

  /* ---------------- Toasts ---------------- */
  var toastQueue = [];
  var toastShowing = false;
  function showToast(message, opts) {
    toastQueue.push({ message: message, opts: opts || {} });
    processToastQueue();
  }
  function processToastQueue() {
    if (toastShowing || toastQueue.length === 0) return;
    toastShowing = true;
    var item = toastQueue.shift();
    var container = $('toast-container');
    var el = document.createElement('div');
    el.setAttribute('role', 'status');
    el.className = 'toast-enter flex items-center gap-3 rounded-md border border-slate-200 bg-white px-3 py-2.5 text-sm text-slate-900 shadow-lg';
    var text = document.createElement('span');
    text.className = 'flex-1';
    text.textContent = item.message;
    el.appendChild(text);
    var duration = item.opts.actionLabel ? 10000 : 5000;
    var timer, remaining = duration, startedAt = Date.now();
    function schedule(ms) { startedAt = Date.now(); timer = setTimeout(dismiss, ms); }
    function dismiss() {
      if (el.parentNode) el.parentNode.removeChild(el);
      toastShowing = false;
      processToastQueue();
    }
    if (item.opts.actionLabel) {
      var actionBtn = document.createElement('button');
      actionBtn.type = 'button';
      actionBtn.className = 'font-medium text-blue-700 hover:underline';
      actionBtn.textContent = item.opts.actionLabel;
      actionBtn.addEventListener('click', function () { clearTimeout(timer); item.opts.onAction && item.opts.onAction(); dismiss(); });
      el.appendChild(actionBtn);
    }
    var closeBtn = document.createElement('button');
    closeBtn.type = 'button';
    closeBtn.setAttribute('aria-label', 'Dismiss notification');
    closeBtn.className = 'inline-flex size-6 items-center justify-center rounded hover:bg-slate-100';
    closeBtn.innerHTML = '<svg class="size-4" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
    closeBtn.addEventListener('click', function () { clearTimeout(timer); dismiss(); });
    el.appendChild(closeBtn);
    el.addEventListener('mouseenter', function () { clearTimeout(timer); remaining -= (Date.now() - startedAt); });
    el.addEventListener('mouseleave', function () { schedule(Math.max(remaining, 1000)); });
    container.appendChild(el);
    schedule(duration);
  }

  /* ---------------- Banner ---------------- */
  function showBanner(text) {
    $('result-banner-text').textContent = text;
    $('result-banner').hidden = false;
  }
  $('result-banner-close').addEventListener('click', function () { $('result-banner').hidden = true; });

  /* ---------------- Retry / load ---------------- */
  function onRetry() {
    state.loading = true;
    state.error = false;
    renderTable();
    setTimeout(function () {
      state.loading = false;
      render();
    }, 500);
  }

  /* ---------------- Search ---------------- */
  var searchTimer = null;
  $('search-input').addEventListener('input', function () {
    var val = $('search-input').value;
    $('search-clear').hidden = val.length === 0;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function () {
      state.q = val;
      resetPageAndSelection();
      render();
    }, 300);
  });
  $('search-clear').addEventListener('click', function () {
    $('search-input').value = '';
    $('search-clear').hidden = true;
    state.q = '';
    resetPageAndSelection();
    render();
    $('search-input').focus();
  });

  /* ---------------- Role filter popover ---------------- */
  function buildRoleOptions() {
    var container = $('role-filter-options');
    container.innerHTML = ROLES.filter(function (r) { return r !== 'Owner'; }).map(function (r) {
      var id = 'role-opt-' + r.replace(/\s+/g, '-').toLowerCase();
      return '<label for="' + id + '" class="flex min-h-6 items-center gap-2 rounded px-1 py-1 text-sm text-slate-700 hover:bg-slate-50"><input type="checkbox" id="' + id + '" class="role-option size-4" value="' + r + '">' + r + '</label>';
    }).join('');
    container.querySelectorAll('.role-option').forEach(function (cb) {
      cb.addEventListener('change', function () {
        if (cb.checked) state.roles.add(cb.value); else state.roles.delete(cb.value);
        resetPageAndSelection();
        render();
      });
    });
  }
  function syncRoleCheckboxes() {
    document.querySelectorAll('.role-option').forEach(function (cb) { cb.checked = state.roles.has(cb.value); });
  }
  buildRoleOptions();

  function togglePopover(panel, trigger, show) {
    panel.hidden = !show;
    trigger.setAttribute('aria-expanded', show ? 'true' : 'false');
  }
  $('btn-role-filter').addEventListener('click', function (e) {
    e.stopPropagation();
    var panel = $('role-filter-panel');
    togglePopover(panel, $('btn-role-filter'), panel.hidden);
    $('more-filters-panel').hidden = true;
  });
  $('role-filter-reset').addEventListener('click', function () {
    state.roles.clear(); syncRoleCheckboxes(); resetPageAndSelection(); render();
  });

  $('btn-more-filters').addEventListener('click', function (e) {
    e.stopPropagation();
    var panel = $('more-filters-panel');
    togglePopover(panel, $('btn-more-filters'), panel.hidden);
    $('role-filter-panel').hidden = true;
  });
  $('more-filters-apply').addEventListener('click', function () {
    state.dateFrom = $('filter-date-from').value || null;
    state.dateTo = $('filter-date-to').value || null;
    $('more-filters-panel').hidden = true;
    resetPageAndSelection();
    render();
    $('btn-more-filters').focus();
  });
  $('more-filters-reset').addEventListener('click', function () {
    $('filter-date-from').value = '';
    $('filter-date-to').value = '';
    state.dateFrom = null; state.dateTo = null;
    resetPageAndSelection();
    render();
  });

  document.addEventListener('click', function (e) {
    if (!e.target.closest('#btn-role-filter') && !e.target.closest('#role-filter-panel')) $('role-filter-panel').hidden = true;
    if (!e.target.closest('#btn-more-filters') && !e.target.closest('#more-filters-panel')) $('more-filters-panel').hidden = true;
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { $('role-filter-panel').hidden = true; $('more-filters-panel').hidden = true; }
  });

  /* ---------------- Status tabs ---------------- */
  document.querySelectorAll('.status-tab').forEach(function (tab) {
    tab.addEventListener('click', function () {
      state.status = tab.getAttribute('data-status');
      resetPageAndSelection();
      render();
    });
  });

  /* ---------------- Sorting ---------------- */
  function setSort(key) {
    if (state.sort.key === key) {
      state.sort.dir = state.sort.dir === 'asc' ? 'desc' : 'asc';
    } else {
      state.sort.key = key;
      state.sort.dir = key === 'name' ? 'asc' : 'desc';
    }
    updateSortIndicators();
    render();
  }
  function updateSortIndicators() {
    var headers = { name: 'sort-name', lastSignIn: 'sort-lastSignIn' };
    Object.keys(headers).forEach(function (key) {
      var th = $(headers[key]).closest('th');
      if (key === state.sort.key) th.setAttribute('aria-sort', state.sort.dir === 'asc' ? 'ascending' : 'descending');
      else th.removeAttribute('aria-sort');
    });
  }
  $('sort-name').addEventListener('click', function () { setSort('name'); });
  $('sort-lastSignIn').addEventListener('click', function () { setSort('lastSignIn'); });
  updateSortIndicators();

  /* ---------------- Page size ---------------- */
  $('page-size').value = String(state.pageSize);
  $('page-size').addEventListener('change', function () {
    state.pageSize = parseInt($('page-size').value, 10);
    state.page = 1;
    clearSelection();
    render();
  });

  /* ---------------- Initial load ---------------- */
  function init() {
    render();
    if (pageMode === 'loading') {
      return; // stays loading forever
    }
    if (pageMode === 'error') {
      setTimeout(function () {
        state.loading = false;
        render();
      }, 400);
      return;
    }
    setTimeout(function () {
      state.loading = false;
      render();
    }, 500);
  }
  init();
})();
</script>
</body>
</html>
