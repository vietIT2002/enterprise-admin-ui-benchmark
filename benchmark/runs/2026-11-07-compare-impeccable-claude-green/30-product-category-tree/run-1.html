  input, textarea, select { caret-color: var(--accent-600); }
  .tabular{ font-variant-numeric: tabular-nums; }
  .focus-ring{ outline:none; }
  .focus-ring:focus-visible{ outline:2px solid var(--accent-500); outline-offset:2px; border-radius:6px; }

  .tree-row[data-selected="true"] .count-pill { background:#e0e7ff; color:var(--accent-700); }
  .chev { transition: transform 160ms ease; }
  .chev[data-open="true"] { transform: rotate(90deg); }
  .fade-in { animation: fadeIn 180ms ease both; }
  @keyframes fadeIn { from { opacity:0; transform: translateY(2px); } to { opacity:1; transform: translateY(0); } }
  .toast-enter { animation: toastIn 220ms cubic-bezier(.16,1,.3,1) both; }
  @keyframes toastIn { from { opacity:0; transform: translateY(8px) scale(.98); } to { opacity:1; transform: translateY(0) scale(1); } }

  .switch-track { transition: background-color 160ms ease; }
  .switch-knob { transition: transform 160ms ease; }
  .nav-icon-btn { position:relative; }
  .nav-icon-btn .tip {
    position:absolute; left:calc(100% + 10px); top:50%; transform:translateY(-50%) translateX(-4px);
    background:#0f172a; color:#f1f5f9; font-size:12px; padding:4px 8px; border-radius:6px; white-space:nowrap;

      if (found) return found;
    }
    return null;
  }
  function findContainingArray(list, id, parentArr){
    for (var i = 0; i < list.length; i++){
      if (list[i].id === id) return { arr: list, index: i };
      var inner = findContainingArray(list[i].children, id);
      if (inner) return inner;
    }
    return null;
  }
  function collectDescendantIds(node, out){
    out = out || [];
    for (var i = 0; i < node.children.length; i++){ out.push(node.children[i].id); collectDescendantIds(node.children[i], out); }
    return out;
  }
  function flattenAll(list, depth, out){
    depth = depth || 0; out = out || [];
    for (var i = 0; i < list.length; i++){
      out.push({ node: list[i], depth: depth });
      flattenAll(list[i].children, depth + 1, out);
    }
    return out;
  }

  // ---------- State ----------
  var state = {
    selectedId: "computers-laptops",
    expanded: new Set(["electronics", "computers-laptops"]),
    search: "",
    dirty: false
  };

  var STATUS_META = {
    active: { label: "Active", dot: "bg-emerald-500", pill: "bg-emerald-50 text-emerald-700 ring-1 ring-emerald-200" },
    draft: { label: "Draft", dot: "bg-amber-500", pill: "bg-amber-50 text-amber-700 ring-1 ring-amber-200" },
    hidden: { label: "Hidden", dot: "bg-slate-400", pill: "bg-slate-100 text-slate-600 ring-1 ring-slate-200" }
  };

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" })[c];
    });
  }
  function highlight(text, query){
    if (!query) return escapeHtml(text);
    var idx = text.toLowerCase().indexOf(query.toLowerCase());
    if (idx === -1) return escapeHtml(text);
    return escapeHtml(text.slice(0, idx)) + '<mark class="search-hit">' + escapeHtml(text.slice(idx, idx + query.length)) + '</mark>' + escapeHtml(text.slice(idx + query.length));
  }
  function matchesSearch(node, q){
    if (node.name.toLowerCase().indexOf(q) !== -1) return true;
    for (var i = 0; i < node.children.length; i++) if (matchesSearch(node.children[i], q)) return true;
    return false;
  }
  function formatRelative(dateStr){
    var d = new Date(dateStr + "T00:00:00");
    var days = Math.round((NOW - d) / 86400000);
    if (days <= 0) return "today";
    if (days === 1) return "yesterday";
    if (days < 7) return days + " days ago";
    if (days < 30) return Math.round(days / 7) + " week" + (Math.round(days/7) > 1 ? "s" : "") + " ago";
    if (days < 365) return Math.round(days / 30) + " month" + (Math.round(days/30) > 1 ? "s" : "") + " ago";
    return Math.round(days / 365) + " year" + (Math.round(days/365) > 1 ? "s" : "") + " ago";
  }

  function toast(message, tone){
    var host = document.getElementById("toastHost");
    var el = document.createElement("div");
    tone = tone || "success";
    var iconName = tone === "success" ? "check" : "clock";
    var accent = tone === "success" ? "text-emerald-600" : "text-slate-500";
    el.className = "toast-enter flex items-center gap-2.5 bg-slate-900 text-white text-sm pl-3 pr-4 py-2.5 rounded-lg shadow-lg shadow-slate-900/20";
    el.innerHTML = '<span class="' + accent + ' flex-shrink-0">' + iconSvg(iconName, 16) + '</span><span>' + escapeHtml(message) + '</span>';
    host.appendChild(el);
    setTimeout(function(){
      el.style.transition = "opacity 200ms ease, transform 200ms ease";
      el.style.opacity = "0";
      el.style.transform = "translateY(6px)";
      setTimeout(function(){ el.remove(); }, 200);
    }, 2600);
  }

  // ---------- Tree rendering ----------

    function renderList(list, depth){
      var out = "";
      for (var i = 0; i < list.length; i++){
        var node = list[i];
        if (q && !matchesSearch(node, q)) continue;
        var hasChildren = node.children.length > 0;
        var isOpen = q ? true : state.expanded.has(node.id);
        var isSelected = node.id === state.selectedId;
        var meta = STATUS_META[node.status];
        var count = totalCount(node);
        out += '<div>';
        out += '<button data-row-id="' + node.id + '" data-selected="' + isSelected + '" class="tree-row focus-ring w-full flex items-center gap-1.5 pr-2.5 py-1.5 rounded-lg text-left hover:bg-slate-50 group" style="padding-left:' + (depth * 18 + 8) + 'px">';
        if (hasChildren){
          out += '<span data-chev="' + node.id + '" data-open="' + isOpen + '" class="chev flex-shrink-0 text-slate-400 group-hover:text-slate-600">' + iconSvg("chevronRight", 14) + '</span>';
        } else {
          out += '<span class="flex-shrink-0 w-3.5"></span>';
        }
        out += '<span class="w-1.5 h-1.5 rounded-full flex-shrink-0 ' + meta.dot + '" title="' + meta.label + '"></span>';
        out += '<span class="flex-1 min-w-0 truncate text-sm ' + (isSelected ? "font-medium" : "") + '">' + highlight(node.name, q) + '</span>';
        out += '<span class="count-pill flex-shrink-0 text-xs tabular bg-slate-100 text-slate-500 rounded-full px-2 py-0.5">' + count.toLocaleString() + '</span>';
        out += '</button>';
        if (hasChildren && isOpen){
          out += '<div data-children-of="' + node.id + '">' + renderList(node.children, depth + 1) + '</div>';
        }
        out += '</div>';
      }
      return out;
    }

    html = renderList(DATA, 0);
    if (!html){
      html = '<div class="px-4 py-10 text-center">' +
        '<p class="text-sm font-medium text-slate-600">No categories match "' + escapeHtml(state.search) + '"</p>' +
        '<p class="text-xs text-slate-400 mt-1">Try a different search term.</p></div>';
    }
    container.innerHTML = html;

    document.getElementById("treeCount").textContent = countAllNodes(DATA).toLocaleString() + " categories";
    document.getElementById("pageSubtitle").textContent =
      countAllNodes(DATA).toLocaleString() + " categories · " + totalCountAll().toLocaleString() + " products";
  }

  function updateSeoCounters(){
    var titleEl = document.getElementById("fieldSeoTitle");
    var descEl = document.getElementById("fieldSeoDesc");
    if (titleEl) document.getElementById("seoTitleCount").textContent = titleEl.value.length + " / 60";
    if (descEl) document.getElementById("seoDescCount").textContent = descEl.value.length + " / 160";
    if (titleEl) document.getElementById("seoTitleCount").className = "text-xs tabular " + (titleEl.value.length > 60 ? "text-amber-600" : "text-slate-400");
    if (descEl) document.getElementById("seoDescCount").className = "text-xs tabular " + (descEl.value.length > 160 ? "text-amber-600" : "text-slate-400");
  }

  function setDirty(isDirty){
    state.dirty = isDirty;
    var btn = document.getElementById("btnSave");
    if (!btn) return;
    btn.disabled = !isDirty;
    btn.className = "focus-ring inline-flex items-center gap-1.5 px-3.5 py-2 text-sm font-medium rounded-lg " +
      (isDirty ? "bg-indigo-600 text-white hover:bg-indigo-700 active:bg-indigo-800" : "bg-slate-100 text-slate-400 cursor-not-allowed");
  }

  function wireDetailsEvents(node){
    updateSeoCounters();
    var slugTouched = false;
    var nameEl = document.getElementById("fieldName");
    var slugEl = document.getElementById("fieldSlug");

    document.querySelectorAll("#detailsContainer input, #detailsContainer textarea, #detailsContainer select").forEach(function(el){
      el.addEventListener("input", function(){ setDirty(true); updateSeoCounters(); });
      el.addEventListener("change", function(){ setDirty(true); });
    });
    slugEl.addEventListener("input", function(){ slugTouched = true; });
    nameEl.addEventListener("input", function(){
      if (!slugTouched) slugEl.value = slugify(nameEl.value);
    });

    document.querySelectorAll("[data-crumb]").forEach(function(btn){
      btn.addEventListener("click", function(){ selectCategory(btn.getAttribute("data-crumb")); });
    });
    document.querySelectorAll("[data-subrow]").forEach(function(btn){
      btn.addEventListener("click", function(){ selectCategory(btn.getAttribute("data-subrow")); });
    });

    var switchEl = document.getElementById("fieldShowInNav");
    switchEl.addEventListener("click", function(){
      var checked = switchEl.getAttribute("aria-checked") === "true";
      switchEl.setAttribute("aria-checked", String(!checked));
      switchEl.className = switchEl.className.replace(checked ? "bg-indigo-600" : "bg-slate-200", checked ? "bg-slate-200" : "bg-indigo-600");
      switchEl.querySelector(".switch-knob").style.transform = "translateX(" + (checked ? "0" : "16px") + ")";
      setDirty(true);
    });

    var imageInput = document.getElementById("imageInput");
    if (imageInput){
      imageInput.addEventListener("change", function(){
        var file = imageInput.files && imageInput.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function(){
          node.image = reader.result;
          setDirty(true);
          renderDetails();
          toast("Image added — remember to save.", "info");
        };
        reader.readAsDataURL(file);
      });
    }
    var changeImageBtn = document.getElementById("btnChangeImage");
    if (changeImageBtn){
      changeImageBtn.addEventListener("click", function(){
        node.image = null;
        renderDetails();
      });
    }

    var viewProductsBtn = document.getElementById("btnViewProducts");
    if (viewProductsBtn){
      viewProductsBtn.addEventListener("click", function(){
        toast("Opens the Products catalog filtered by “" + node.name + "”.", "info");
      });
    }

    document.getElementById("btnAddSub").addEventListener("click", function(){
      addSubcategory(node);
    });

    document.getElementById("btnSave").addEventListener("click", function(){
      if (!state.dirty) return;
      node.name = nameEl.value.trim() || node.name;
      node.slug = slugEl.value.trim() || slugify(node.name);
      node.description = document.getElementById("fieldDescription").value;
      node.status = document.getElementById("fieldStatus").value;
      node.displayOrder = parseInt(document.getElementById("fieldOrder").value, 10) || 0;
      node.showInNav = switchEl.getAttribute("aria-checked") === "true";
      node.seoTitle = document.getElementById("fieldSeoTitle").value;
      node.seoDescription = document.getElementById("fieldSeoDesc").value;
      node.updatedAt = "2026-11-07";

      var newParentId = document.getElementById("fieldParent").value;
      reparent(node, newParentId);

      setDirty(false);
      renderTree();
      renderDetails();
      toast("Category saved.");
    });

    var deleteBtn = document.getElementById("btnDelete");
    var armTimeout = null;
    deleteBtn.addEventListener("click", function(){
      var armed = deleteBtn.getAttribute("data-armed") === "true";
      if (!armed){
        deleteBtn.setAttribute("data-armed", "true");
        deleteBtn.textContent = "Click again to confirm delete";
        deleteBtn.className = "focus-ring text-sm font-medium text-red-600 bg-red-50 px-2.5 py-1.5 rounded-md";
        armTimeout = setTimeout(function(){
          deleteBtn.setAttribute("data-armed", "false");
          deleteBtn.textContent = "Delete category";
          deleteBtn.className = "focus-ring text-sm font-medium text-slate-400 hover:text-red-600 px-2 py-1 rounded";
        }, 3000);
      } else {
        clearTimeout(armTimeout);
        deleteCategory(node.id);
      }
    });
  }

  function reparent(node, newParentId){
    var currentContainer = findContainingArray(DATA, node.id);
    if (!currentContainer) return;
    var alreadyParentId = (function(){
      var flat = flattenAll(DATA);
      for (var i = 0; i < flat.length; i++){
        for (var j = 0; j < flat[i].node.children.length; j++){
          if (flat[i].node.children[j].id === node.id) return flat[i].node.id;
        }
      }
      return "";
    })();
    if ((alreadyParentId || "") === (newParentId || "")) return;

    currentContainer.arr.splice(currentContainer.index, 1);
    if (!newParentId){
      DATA.push(node);
    } else {
      var target = findNode(DATA, newParentId);
      if (target){ target.node.children.push(node); state.expanded.add(newParentId); }
      else { DATA.push(node); }
    }
  }

  function addSubcategory(parentNode){
    var child = n(nextId(), "New Category", "draft", 0, { updatedAt: "2026-11-07", createdAt: "2026-11-07" }, []);
    parentNode.children.push(child);
    state.expanded.add(parentNode.id);
    state.selectedId = child.id;
    renderTree();
    renderDetails();
    var nameEl = document.getElementById("fieldName");
    nameEl.focus();
    nameEl.select();
    toast("Subcategory added — give it a name and save.", "info");
  }

  function deleteCategory(id){
    var container = findContainingArray(DATA, id);
    if (!container) return;
    var removed = container.arr.splice(container.index, 1)[0];
    var fallback = container.arr[container.index] || container.arr[container.index - 1] || null;
    if (!fallback){
      var flat = flattenAll(DATA);
      fallback = flat.length ? flat[0].node : null;
    }
    state.selectedId = fallback ? fallback.id : null;
    renderTree();
    renderDetails();
    toast('"' + removed.name + '" was deleted.', "info");
  }

  function selectCategory(id){
    state.selectedId = id;
    var found = findNode(DATA, id);
    if (found){
      for (var i = 0; i < found.path.length - 1; i++) state.expanded.add(found.path[i].id);
    }
    renderTree();
    renderDetails();
    var row = document.querySelector('[data-row-id="' + id + '"]');
    if (row) row.scrollIntoView({ block: "nearest" });
  }

  // ---------- Events ----------
  document.getElementById("treeContainer").addEventListener("click", function(e){
    var chev = e.target.closest("[data-chev]");
    var row = e.target.closest("[data-row-id]");
    if (chev){
      var id = chev.getAttribute("data-chev");
      if (state.expanded.has(id)) state.expanded.delete(id); else state.expanded.add(id);
      renderTree();
      return;
    }
    if (row){
      selectCategory(row.getAttribute("data-row-id"));
    }
  });

  var searchInput = document.getElementById("treeSearch");
  var clearBtn = document.getElementById("treeSearchClear");
  searchInput.addEventListener("input", function(){
    state.search = searchInput.value;
    clearBtn.classList.toggle("hidden", !state.search);
    renderTree();
  });
  clearBtn.addEventListener("click", function(){
    searchInput.value = "";
    state.search = "";
    clearBtn.classList.add("hidden");
    renderTree();
    searchInput.focus();
  });

  document.getElementById("btnExpandAll").addEventListener("click", function(){
    flattenAll(DATA).forEach(function(entry){ if (entry.node.children.length) state.expanded.add(entry.node.id); });
    renderTree();
  });
  document.getElementById("btnCollapseAll").addEventListener("click", function(){
    state.expanded.clear();
    renderTree();
  });

  document.getElementById("btnAddRootCategory").addEventListener("click", function(){
    var node = n(nextId(), "New Category", "draft", 0, { updatedAt: "2026-11-07", createdAt: "2026-11-07" }, []);
    DATA.push(node);
    state.selectedId = node.id;
    renderTree();
    renderDetails();
    var nameEl = document.getElementById("fieldName");
    nameEl.focus();
    nameEl.select();
    toast("New category added — give it a name and save.", "info");
  });

  // ---------- Init ----------
  renderTree();
  renderDetails();
})();
</script>
</body>
</html>
