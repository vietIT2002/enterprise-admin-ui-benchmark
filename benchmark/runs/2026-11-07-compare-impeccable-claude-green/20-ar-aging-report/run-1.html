  // ---------- Derived aging data ----------
  function daysPastDue(dueStr) {
    var due = new Date(dueStr + 'T00:00:00');
    return Math.round((AS_OF - due) / 86400000);
  }
  function bucketFor(days) {
    if (days <= 0) return 'current';
    if (days <= 30) return 'b1_30';
    if (days <= 60) return 'b31_60';
    if (days <= 90) return 'b61_90';
    return 'b90_plus';
  }

  var computed = CUSTOMERS.map(function (c) {
    var totals = { current: 0, b1_30: 0, b31_60: 0, b61_90: 0, b90_plus: 0, total: 0 };
    var oldestDue = null, maxDays = -Infinity;
    var invoices = c.invoices.map(function (inv) {
      var days = daysPastDue(inv.due);
      var bucket = bucketFor(days);
      totals[bucket] += inv.amount;
      totals.total += inv.amount;
      if (oldestDue === null || new Date(inv.due) < new Date(oldestDue)) oldestDue = inv.due;
      if (days > maxDays) maxDays = days;
      return { no: inv.no, issue: inv.issue, due: inv.due, amount: inv.amount, days: days, bucket: bucket };
    });
    var status = maxDays > 90 ? 'critical' : (maxDays > 0 ? 'past_due' : 'current');
    return {
      id: c.id, name: c.name, code: c.code, contact: c.contact, email: c.email,
      invoices: invoices, totals: totals, oldestDue: oldestDue, maxDays: maxDays, status: status
    };
  });

  // ---------- State ----------
  var filters = { search: '', bucket: 'all', minBalance: 0, overdueOnly: false };
  var sort = { key: 'total', dir: 'desc' };
  var expanded = {};

  function fmt(n) {
    return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(n);
  }
  function fmtDate(iso) {
    var d = new Date(iso + 'T00:00:00');
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function csvEscape(v) {
    v = String(v);
    return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  }
  var ICON_CHEVRON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>';
  var ICON_SORT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/></svg>';
  var ICON_SORT_ASC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 10 5-5 5 5"/></svg>';
  var ICON_SORT_DESC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 14 5 5 5-5"/></svg>';
  var ICON_EMPTY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/><path d="M8.5 11h5"/></svg>';

  function statusBadge(status) {
    if (status === 'critical') {
      return '<span class="inline-flex items-center gap-1 rounded-full bg-red-50 px-2.5 py-1 text-xs font-medium text-red-700 ring-1 ring-inset ring-red-200">90+ overdue</span>';
    }
    if (status === 'past_due') {
      return '<span class="inline-flex items-center gap-1 rounded-full bg-amber-50 px-2.5 py-1 text-xs font-medium text-amber-700 ring-1 ring-inset ring-amber-200">Past due</span>';
    }
    return '<span class="inline-flex items-center gap-1 rounded-full bg-slate-100 px-2.5 py-1 text-xs font-medium text-slate-600 ring-1 ring-inset ring-slate-200">Current</span>';
  }

  // ---------- Filtering & sorting ----------
  function getFiltered() {
    var rows = computed.filter(function (c) {
      if (filters.bucket !== 'all' && c.totals[filters.bucket] <= 0) return false;
      if (filters.overdueOnly && c.maxDays <= 0) return false;
      if (filters.minBalance > 0 && c.totals.total < filters.minBalance) return false;
      if (filters.search) {
        var q = filters.search.toLowerCase();
        var hay = (c.name + ' ' + c.code + ' ' + c.contact + ' ' + c.email).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });
    rows.sort(function (a, b) {
      var av, bv;
      if (sort.key === 'name') { av = a.name.toLowerCase(); bv = b.name.toLowerCase(); }
      else if (sort.key === 'maxDays') { av = a.maxDays; bv = b.maxDays; }
      else if (sort.key === 'total') { av = a.totals.total; bv = b.totals.total; }
      else { av = a.totals[sort.key]; bv = b.totals[sort.key]; }
      if (av < bv) return sort.dir === 'asc' ? -1 : 1;
      if (av > bv) return sort.dir === 'asc' ? 1 : -1;
      return 0;
    });
    return rows;
  }

  function isFilterActive() {
    return filters.search !== '' || filters.bucket !== 'all' || filters.minBalance > 0 || filters.overdueOnly;
  }

  // ---------- Rendering ----------
  function renderSummary() {
    var el = document.getElementById('summaryStrip');
    var cells = BUCKETS.map(function (b) {
      var total = computed.reduce(function (sum, c) { return sum + c.totals[b.key]; }, 0);
      var count = computed.filter(function (c) { return c.totals[b.key] > 0; }).length;
      var active = filters.bucket === b.key;
      return '' +
        '<button type="button" data-bucket="' + b.key + '" onclick="setBucketFilter(\'' + b.key + '\')" ' +
          'class="summary-cell flex flex-col gap-1 p-4 text-left transition-colors hover:bg-slate-50 focus-visible:outline-teal-600' + (active ? ' bg-teal-50 ring-2 ring-inset ring-teal-600' : '') + '">' +
          '<span class="text-xs font-medium uppercase tracking-wide ' + (active ? 'text-teal-800' : 'text-slate-500') + '">' + b.label + '</span>' +
          '<span class="text-lg font-semibold tabular-nums ' + (active ? 'text-teal-900' : 'text-slate-900') + '">' + fmt(total) + '</span>' +
          '<span class="text-xs ' + (active ? 'text-teal-700' : 'text-slate-400') + '">' + count + ' customer' + (count === 1 ? '' : 's') + '</span>' +
        '</button>';
    });
    var grandTotal = computed.reduce(function (sum, c) { return sum + c.totals.total; }, 0);
    var active = filters.bucket === 'all';
    cells.push(
      '<button type="button" data-bucket="all" onclick="setBucketFilter(\'all\')" ' +
        'class="summary-cell flex flex-col gap-1 border-l-0 bg-slate-50 p-4 text-left transition-colors hover:bg-slate-100 focus-visible:outline-teal-600' + (active ? ' ring-2 ring-inset ring-teal-600' : '') + '">' +
        '<span class="text-xs font-medium uppercase tracking-wide text-slate-500">Total Outstanding</span>' +
        '<span class="text-lg font-semibold tabular-nums text-slate-900">' + fmt(grandTotal) + '</span>' +
        '<span class="text-xs text-slate-400">' + computed.length + ' customers</span>' +
      '</button>'
    );
    el.innerHTML = cells.join('');
  }

  function bucketCell(c, b) {
    var amount = c.totals[b.key];
    if (amount <= 0) return '<td class="py-3 pr-4 text-right tabular-nums text-slate-300">—</td>';
    return '<td class="py-3 pr-4 text-right tabular-nums ' + b.amt + '">' + fmt(amount) + '</td>';
  }

  function detailRow(c) {
    var invRows = c.invoices.slice().sort(function (a, b) { return b.days - a.days; }).map(function (inv) {
      var bucketMeta = BUCKETS.filter(function (b) { return b.key === inv.bucket; })[0];
      var dayLabel = inv.days <= 0 ? 'Not yet due' : inv.days + ' day' + (inv.days === 1 ? '' : 's') + ' overdue';
      return '' +
        '<tr class="border-b border-slate-100 last:border-0">' +
          '<td class="py-2 pr-4 font-medium text-slate-700">' + inv.no + '</td>' +
          '<td class="py-2 pr-4 text-slate-500">' + fmtDate(inv.issue) + '</td>' +
          '<td class="py-2 pr-4 text-slate-500">' + fmtDate(inv.due) + '</td>' +
          '<td class="py-2 pr-4 ' + bucketMeta.amt + '">' + dayLabel + '</td>' +
          '<td class="py-2 pr-4 text-right tabular-nums font-medium text-slate-900">' + fmt(inv.amount) + '</td>' +
        '</tr>';
    }).join('');
    return '' +
      '<tr id="detail-' + c.id + '" class="border-b border-slate-100 bg-slate-50/70">' +
        '<td></td>' +
        '<td colspan="9" class="py-3 pr-4 pl-1">' +
          '<div class="rounded-lg border border-slate-200 bg-white p-3">' +
            '<table class="w-full text-xs">' +
              '<thead>' +
                '<tr class="text-left font-medium uppercase tracking-wide text-slate-400">' +
                  '<th class="pb-2 pr-4">Invoice #</th><th class="pb-2 pr-4">Issued</th><th class="pb-2 pr-4">Due</th><th class="pb-2 pr-4">Status</th><th class="pb-2 pr-4 text-right">Amount</th>' +
                '</tr>' +
              '</thead>' +
              '<tbody>' + invRows + '</tbody>' +
            '</table>' +
          '</div>' +
        '</td>' +
      '</tr>';
  }

  function renderRows(rows) {
    var body = document.getElementById('tableBody');
    if (rows.length === 0) {
      body.innerHTML = '' +
        '<tr><td colspan="10" class="py-14 text-center">' +
          '<div class="mx-auto flex max-w-xs flex-col items-center gap-2">' +
            '<span class="flex h-10 w-10 items-center justify-center rounded-full bg-slate-100 text-slate-400">' + ICON_EMPTY + '</span>' +
            '<p class="text-sm font-medium text-slate-700">No customers match your filters</p>' +
            '<p class="text-sm text-slate-500">Try widening the aging bucket or clearing the search.</p>' +
            '<button type="button" onclick="clearFilters()" class="mt-1 text-sm font-medium text-teal-700 hover:underline focus-visible:outline-teal-600">Clear filters</button>' +
          '</div>' +
        '</td></tr>';
      return;
    }
    var html = rows.map(function (c) {
      var isOpen = !!expanded[c.id];
      var row = '' +
        '<tr class="border-b border-slate-100 hover:bg-slate-50">' +
          '<td class="py-3 pl-4 pr-1">' +
            '<button type="button" aria-expanded="' + isOpen + '" aria-controls="detail-' + c.id + '" onclick="toggleExpand(\'' + c.id + '\')" ' +
              'class="flex h-6 w-6 items-center justify-center rounded text-slate-400 transition-colors hover:bg-slate-200 hover:text-slate-700 focus-visible:outline-teal-600">' +
              '<span class="h-4 w-4 inline-block transition-transform' + (isOpen ? ' rotate-90' : '') + '">' + ICON_CHEVRON + '</span>' +
            '</button>' +
          '</td>' +
          '<td class="py-3 pr-4">' +
            '<div class="font-medium text-slate-900">' + escapeHtml(c.name) + '</div>' +
            '<div class="text-xs text-slate-500">' + c.code + '</div>' +
          '</td>' +
          '<td class="hidden py-3 pr-4 md:table-cell">' +
            '<div class="text-slate-700">' + escapeHtml(c.contact) + '</div>' +
            '<div class="text-xs text-slate-500">' + escapeHtml(c.email) + '</div>' +
          '</td>' +
          '<td class="py-3 pr-4 text-right font-semibold tabular-nums text-slate-900">' + fmt(c.totals.total) + '</td>' +
          BUCKETS.map(function (b) { return bucketCell(c, b); }).join('') +
          '<td class="py-3 pr-4 text-right">' + statusBadge(c.status) + '</td>' +
        '</tr>';
      return row + (isOpen ? detailRow(c) : '');
    }).join('');
    body.innerHTML = html;
  }

  function renderFooter(rows) {
    var totals = { current: 0, b1_30: 0, b31_60: 0, b61_90: 0, b90_plus: 0, total: 0 };
    rows.forEach(function (c) {
      BUCKETS.forEach(function (b) { totals[b.key] += c.totals[b.key]; });
      totals.total += c.totals.total;
    });
    var foot = document.getElementById('tableFoot');
    foot.innerHTML = '' +
      '<tr class="border-t-2 border-slate-200 bg-slate-50 font-semibold text-slate-900">' +
        '<td></td>' +
        '<td class="py-3 pr-4">Totals (' + rows.length + ')</td>' +
        '<td class="hidden py-3 pr-4 md:table-cell"></td>' +
        '<td class="py-3 pr-4 text-right tabular-nums">' + fmt(totals.total) + '</td>' +
        BUCKETS.map(function (b) {
          return '<td class="py-3 pr-4 text-right tabular-nums">' + (totals[b.key] > 0 ? fmt(totals[b.key]) : '—') + '</td>';
        }).join('') +
        '<td></td>' +
      '</tr>';
  }

  function renderSortIndicators() {
    document.querySelectorAll('th[data-sort] .sort-btn').forEach(function (btn) {
      var th = btn.closest('th');
      var key = th.getAttribute('data-sort');
      var existingIcon = btn.querySelector('span.icon');
      if (existingIcon) existingIcon.remove();
      var iconHtml = sort.key === key ? (sort.dir === 'asc' ? ICON_SORT_ASC : ICON_SORT_DESC) : ICON_SORT;
      var span = document.createElement('span');
      span.className = 'icon h-3.5 w-3.5 ' + (sort.key === key ? 'text-teal-700' : 'text-slate-300');
      span.innerHTML = iconHtml;
      btn.appendChild(span);
      th.setAttribute('aria-sort', sort.key === key ? (sort.dir === 'asc' ? 'ascending' : 'descending') : 'none');
    });
  }

  function renderCount(rows) {
    var el = document.getElementById('resultCount');
    var total = rows.reduce(function (sum, c) { return sum + c.totals.total; }, 0);
    el.innerHTML = 'Showing <span class="font-semibold text-slate-700">' + rows.length + '</span> of ' + computed.length +
      ' customers · <span class="font-semibold text-slate-700">' + fmt(total) + '</span> total outstanding';
  }

  function renderClearButton() {
    var btn = document.getElementById('clearFiltersBtn');
    btn.classList.toggle('hidden', !isFilterActive());
  }

  function render() {
    var rows = getFiltered();
    renderCount(rows);
    renderRows(rows);
    renderFooter(rows);
    renderSortIndicators();
    renderClearButton();
  }

  // ---------- Interactions ----------
  function setSort(key) {
    if (sort.key === key) {
      sort.dir = sort.dir === 'asc' ? 'desc' : 'asc';
    } else {
      sort.key = key;
      sort.dir = key === 'name' ? 'asc' : 'desc';
    }
    render();
  }

  function setBucketFilter(key) {
    filters.bucket = key;
    document.getElementById('bucketSelect').value = key;
    renderSummary();
    render();
  }

  function toggleExpand(id) {
    expanded[id] = !expanded[id];
    render();
  }

  function clearFilters() {
    filters.search = '';
    filters.bucket = 'all';
    filters.minBalance = 0;
    filters.overdueOnly = false;
    document.getElementById('searchInput').value = '';
    document.getElementById('bucketSelect').value = 'all';
    document.getElementById('minBalanceInput').value = '';
    document.getElementById('overdueOnlyInput').checked = false;
    renderSummary();
    render();
  }

  function exportCSV() {
    var rows = getFiltered();
    var header = ['Customer', 'Customer Code', 'Contact', 'Email', 'Total Due', 'Current', '1-30 Days', '31-60 Days', '61-90 Days', '90+ Days', 'Oldest Due Date', 'Status'];
    var lines = [header.join(',')];
    rows.forEach(function (c) {
      var statusLabel = c.status === 'critical' ? 'Critical (90+ overdue)' : (c.status === 'past_due' ? 'Past due' : 'Current');
      var line = [
        c.name, c.code, c.contact, c.email,
        c.totals.total.toFixed(2), c.totals.current.toFixed(2), c.totals.b1_30.toFixed(2),
        c.totals.b31_60.toFixed(2), c.totals.b61_90.toFixed(2), c.totals.b90_plus.toFixed(2),
        c.oldestDue, statusLabel
      ].map(csvEscape).join(',');
      lines.push(line);
    });
    var csv = lines.join('\r\n');
    var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'ar-aging-report-' + AS_OF_ISO + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // ---------- Wire up ----------
  document.getElementById('searchInput').addEventListener('input', function (e) {
    filters.search = e.target.value;
    render();
  });
  document.getElementById('bucketSelect').addEventListener('change', function (e) {
    filters.bucket = e.target.value;
    renderSummary();
    render();
  });
  document.getElementById('minBalanceInput').addEventListener('input', function (e) {
    filters.minBalance = parseFloat(e.target.value) || 0;
    render();
  });
  document.getElementById('overdueOnlyInput').addEventListener('change', function (e) {
    filters.overdueOnly = e.target.checked;
    render();
  });
  document.getElementById('clearFiltersBtn').addEventListener('click', clearFilters);
  document.getElementById('exportBtn').addEventListener('click', exportCSV);
  document.getElementById('printBtn').addEventListener('click', function () { window.print(); });

  renderSummary();
  render();
</script>
</body>
</html>
