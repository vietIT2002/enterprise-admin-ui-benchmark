  // ---- Build metadata: parent refs, depth, aggregates, id index ----
  const byId = {};
  function assign(node, depth, parent) {
    node.depth = depth;
    node.parent = parent;
    byId[node.id] = node;
    if (node.children) node.children.forEach(c => assign(c, depth + 1, node));
  }
  assign(DATA, 0, null);

  function aggregate(node) {
    if (!node.children) {
      node._hc = node.headcount;
      node._or = node.openRoles;
      node._tw = node.headcount * node.avgTenure;
      return;
    }
    let hc = 0, or = 0, tw = 0;
    node.children.forEach(c => { aggregate(c); hc += c._hc; or += c._or; tw += c._tw; });
    node._hc = hc; node._or = or; node._tw = tw;
  }
  aggregate(DATA);

  function avgTenureOf(node) { return node._tw / node._hc; }

  function esc(str) {
    return String(str).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  }

    const hay = (node.name + ' ' + node.manager.name + ' ' + node.manager.title).toLowerCase();
    return hay.includes(q);
  }
  function subtreeMatches(node, q) {
    if (matchesQuery(node, q)) return true;
    return !!(node.children && node.children.some(c => subtreeMatches(c, q)));
  }

      root.innerHTML = '';
      noResults.classList.remove('hidden');
      document.getElementById('no-results-term').textContent = query.trim();
      return;
    }
    noResults.classList.add('hidden');
    root.innerHTML = buildNode(DATA, 0, q);
  }

  function buildNode(node, depth, q) {
    if (q && !subtreeMatches(node, q)) return '';
    const hasChildren = !!(node.children && node.children.length);
    const isExpanded = q ? true : expanded.has(node.id);
    const siblings = node.parent ? node.parent.children : [node];
    const maxSib = Math.max(...siblings.map(s => s._hc));
    const pct = Math.max(8, Math.round((node._hc / maxSib) * 100));
    const selected = node.id === selectedId;
    const levelLabel = LEVELS[Math.min(depth, LEVELS.length - 1)];

    const chevron = hasChildren
      ? '<svg class="h-3.5 w-3.5 shrink-0 text-slate-400 transition-transform duration-150 ' + (isExpanded ? 'rotate-90' : '') + '" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4l4 4-4 4"/></svg>'
      : '<span class="block h-1 w-1 shrink-0 rounded-full bg-slate-300"></span>';

    const row =
      '<button type="button" data-row data-id="' + node.id + '" aria-current="' + selected + '"' +
      (hasChildren ? ' aria-expanded="' + isExpanded + '"' : '') +
      ' class="group flex w-full items-center gap-2.5 rounded-md px-2.5 py-2 text-left transition ' +
      (selected ? 'bg-brand-50 ring-1 ring-inset ring-brand-200' : 'hover:bg-slate-100') +
      ' focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-400">' +
      '<span class="flex h-5 w-5 shrink-0 items-center justify-center">' + chevron + '</span>' +
      '<span class="min-w-0 flex-1">' +
        '<span class="flex items-baseline gap-2">' +
          '<span class="truncate text-[13px] font-medium ' + (selected ? 'text-brand-800' : 'text-slate-800') + '">' + esc(node.name) + '</span>' +
          '<span class="hidden shrink-0 text-[11px] text-slate-400 md:inline">' + levelLabel + '</span>' +
        '</span>' +
        '<span class="block truncate text-xs text-slate-500">' + esc(node.manager.name) + ' · ' + esc(node.manager.title) + '</span>' +
      '</span>' +
      '<span class="flex shrink-0 flex-col items-end gap-1 pl-2">' +
        '<span class="text-[13px] font-semibold tabular-nums text-slate-700">' + node._hc + '</span>' +
        '<span class="h-1 w-12 overflow-hidden rounded-full bg-slate-100"><span class="block h-full rounded-full bg-brand-400" style="width:' + pct + '%"></span></span>' +
      '</span>' +
      '</button>';

    let childrenHtml = '';
    if (hasChildren && isExpanded) {
      const inner = node.children.map(c => buildNode(c, depth + 1, q)).join('');
      if (inner) {
        childrenHtml = '<div style="margin-left:17px" class="border-l border-slate-200 pl-1.5">' + inner + '</div>';
      }
    }
    return '<div class="py-[1px]">' + row + childrenHtml + '</div>';
  }

  // ---- Detail rendering ----
  function breadcrumb(node) {
    const chain = [];
    let n = node;
    while (n) { chain.unshift(n); n = n.parent; }
    return chain.map((n, i) => {
      const isLast = i === chain.length - 1;
      return isLast
        ? '<span class="text-slate-700">' + esc(n.name) + '</span>'
        : '<button type="button" data-navigate data-id="' + n.id + '" class="text-slate-400 hover:text-brand-600 hover:underline">' + esc(n.name) + '</button>' +
          '<svg class="mx-1 inline h-3 w-3 text-slate-300" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4l4 4-4 4"/></svg>';
    }).join('');
  }

  function initials(name) {
    return name.split(' ').map(p => p[0]).filter(Boolean).slice(0, 2).join('').toUpperCase();
  }

  function compositionRows(node) {
    if (node.children) {
      const total = node._hc;
      const sorted = [...node.children].sort((a, b) => b._hc - a._hc);
      return sorted.map(c => {
        const pct = Math.round((c._hc / total) * 100);
        return '<button type="button" data-navigate data-id="' + c.id + '" class="flex w-full items-center gap-3 rounded-md px-1.5 py-1.5 text-left transition hover:bg-slate-50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-300">' +
          '<span class="min-w-0 flex-1">' +
            '<span class="block truncate text-sm font-medium text-slate-700">' + esc(c.name) + '</span>' +
            '<span class="block truncate text-xs text-slate-500">' + esc(c.manager.name) + '</span>' +
          '</span>' +
          '<span class="h-1.5 w-20 shrink-0 overflow-hidden rounded-full bg-slate-100"><span class="block h-full rounded-full bg-brand-400" style="width:' + pct + '%"></span></span>' +
          '<span class="w-10 shrink-0 text-right text-sm font-semibold tabular-nums text-slate-700">' + c._hc + '</span>' +
        '</button>';
      }).join('');
    }
    const max = Math.max(...node.roleMix.map(r => r.count));
    return node.roleMix.map(r => {
      const pct = Math.max(6, Math.round((r.count / max) * 100));
      return '<div class="flex items-center gap-3 px-1.5 py-1.5">' +
        '<span class="min-w-0 flex-1 truncate text-sm text-slate-700">' + esc(r.title) + '</span>' +
        '<span class="h-1.5 w-20 shrink-0 overflow-hidden rounded-full bg-slate-100"><span class="block h-full rounded-full bg-brand-400" style="width:' + pct + '%"></span></span>' +
        '<span class="w-10 shrink-0 text-right text-sm font-semibold tabular-nums text-slate-700">' + r.count + '</span>' +
      '</div>';
    }).join('');
  }

  function renderDetail() {
    const node = byId[selectedId];
    const panel = document.getElementById('detail-panel');
    const levelLabel = LEVELS[Math.min(node.depth, LEVELS.length - 1)];
    const tenure = avgTenureOf(node).toFixed(1);
    const compLabel = node.children ? 'Headcount by unit' : 'Team composition';

    panel.innerHTML =
      '<div class="border-b border-slate-200 p-5">' +
        '<div class="flex items-center justify-between gap-3">' +
          '<nav class="min-w-0 flex-1 truncate text-xs">' + breadcrumb(node) + '</nav>' +
          '<span class="shrink-0 text-[11px] text-slate-400">' + esc(node.costCenter) + '</span>' +
        '</div>' +
        '<div class="mt-2 flex items-center gap-2">' +
          '<h2 class="text-xl font-semibold text-slate-900">' + esc(node.name) + '</h2>' +
          '<span class="rounded-full bg-brand-50 px-2 py-0.5 text-[11px] font-medium text-brand-700 ring-1 ring-inset ring-brand-100">' + levelLabel + '</span>' +
        '</div>' +
        '<p class="mt-2 text-sm leading-relaxed text-slate-600">' + esc(node.mandate) + '</p>' +
      '</div>' +

      '<div class="border-b border-slate-200 p-5">' +
        '<p class="mb-3 text-xs font-medium uppercase tracking-wide text-slate-400">Unit leader</p>' +
        '<div class="flex items-center gap-3">' +
          '<span class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full bg-brand-600 text-sm font-semibold text-white">' + initials(node.manager.name) + '</span>' +
          '<div class="min-w-0">' +
            '<p class="truncate text-sm font-semibold text-slate-800">' + esc(node.manager.name) + '</p>' +
            '<p class="truncate text-xs text-slate-500">' + esc(node.manager.title) + '</p>' +
          '</div>' +
        '</div>' +
        '<dl class="mt-3 grid grid-cols-1 gap-1.5 text-xs sm:grid-cols-2">' +
          '<div class="flex items-center gap-1.5"><dt class="text-slate-400">Email</dt><dd class="truncate"><a class="text-brand-600 hover:underline" href="mailto:' + esc(node.manager.email) + '">' + esc(node.manager.email) + '</a></dd></div>' +
          '<div class="flex items-center gap-1.5"><dt class="text-slate-400">Leading since</dt><dd class="text-slate-700">' + esc(node.manager.since) + '</dd></div>' +
        '</dl>' +
      '</div>' +

      '<div class="grid grid-cols-2 gap-px border-b border-slate-200 bg-slate-100 sm:grid-cols-4">' +
        statTile('Headcount', node._hc.toLocaleString()) +
        statTile('Open roles', node._or, node._or > 0 ? 'text-amber-600' : 'text-slate-700') +
        statTile('Avg. tenure', tenure + ' yrs') +
        statTile('Location', node.location, 'text-slate-700 text-[13px] leading-snug') +
      '</div>' +

      '<div class="p-5">' +
        '<div class="mb-2 flex items-center justify-between">' +
          '<p class="text-xs font-medium uppercase tracking-wide text-slate-400">' + compLabel + '</p>' +
          (node.children ? '<p class="text-xs text-slate-400">' + node.children.length + ' unit' + (node.children.length === 1 ? '' : 's') + '</p>' : '') +
        '</div>' +
        '<div class="divide-y divide-slate-100">' + compositionRows(node) + '</div>' +
      '</div>';
  }

  function statTile(label, value, valueClass) {
    return '<div class="bg-white p-3.5">' +
      '<p class="text-[11px] font-medium uppercase tracking-wide text-slate-400">' + label + '</p>' +
      '<p class="mt-1 truncate text-lg font-semibold tabular-nums ' + (valueClass || 'text-slate-700') + '">' + value + '</p>' +
    '</div>';
  }

  // ---- Context line ----
  function renderContext() {
    const divisions = DATA.children.length;
    document.getElementById('context-line').textContent =
      DATA._hc.toLocaleString() + ' employees across ' + divisions + ' divisions · ' + DATA._or + ' open roles · Data refreshed Nov 3, 2026';
  }

  // ---- Events ----
  document.getElementById('tree-root').addEventListener('click', e => {
    const btn = e.target.closest('[data-row]');
    if (!btn) return;
    const id = btn.getAttribute('data-id');
    const node = byId[id];
    selectedId = id;
    if (node.children) {
      if (expanded.has(id)) expanded.delete(id); else expanded.add(id);
    }
    renderTree();
    renderDetail();
  });

  document.getElementById('detail-panel').addEventListener('click', e => {
    const btn = e.target.closest('[data-navigate]');
    if (!btn) return;
    const id = btn.getAttribute('data-id');
    selectedId = id;
    let n = byId[id].parent;
    while (n) { expanded.add(n.id); n = n.parent; }
    renderTree();
    renderDetail();
    document.querySelector('[data-row][data-id="' + id + '"]')?.scrollIntoView({ block: 'nearest' });
  });

  const searchInput = document.getElementById('search-input');
  const clearBtn = document.getElementById('clear-search');
  searchInput.addEventListener('input', () => {
    query = searchInput.value;
    clearBtn.classList.toggle('hidden', query.length === 0);
    renderTree();
  });
  clearBtn.addEventListener('click', () => {
    query = '';
    searchInput.value = '';
    clearBtn.classList.add('hidden');
    searchInput.focus();
    renderTree();
  });

  document.getElementById('expand-all').addEventListener('click', () => {
    allIds(DATA, []).forEach(id => expanded.add(id));
    renderTree();
  });
  document.getElementById('collapse-all').addEventListener('click', () => {
    expanded.clear();
    expanded.add(DATA.id);
    if (!allIds(DATA, []).includes(selectedId)) selectedId = DATA.id;
    renderTree();
    renderDetail();
  });

  document.getElementById('print-btn').addEventListener('click', () => window.print());

  // ---- Init ----
  renderContext();
  renderTree();
  renderDetail();
})();
</script>
</body>
</html>
