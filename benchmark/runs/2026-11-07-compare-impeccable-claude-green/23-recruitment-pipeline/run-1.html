<!doctype html>
<html lang="en" class="h-full">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TalentFlow — Recruitment Pipeline</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  ::selection { background: #e0e7ff; color: #312e81; }
  .scroll-thin { scrollbar-width: thin; scrollbar-color: #cbd5e1 transparent; }
  .scroll-thin::-webkit-scrollbar { width: 8px; height: 8px; }
  .scroll-thin::-webkit-scrollbar-track { background: transparent; }
  .scroll-thin::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
  .scroll-thin::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  select { background-image: none; }
  @keyframes toastIn { from { opacity: 0; transform: translateY(6px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
  .toast-anim { animation: toastIn .18s ease-out; }
  .card-drag-ghost { opacity: .4; }
  [data-drawer-panel] { transition: transform .28s cubic-bezier(.16,1,.3,1); }
  [data-drawer-backdrop] { transition: opacity .28s ease; }
  .tabular { font-variant-numeric: tabular-nums; }
</style>
</head>
<body class="h-full bg-slate-50 text-slate-900 font-sans antialiased">
<div id="app" class="h-full flex flex-col">

  <!-- Header -->
  <header class="flex-none bg-white border-b border-slate-200 px-5 sm:px-6 py-2.5 flex items-center gap-4">
    <div class="flex items-center gap-2.5 flex-none">
      <div class="w-8 h-8 rounded-lg bg-indigo-600 text-white flex items-center justify-center font-semibold text-sm">T</div>
      <span class="font-semibold text-slate-900 tracking-tight hidden sm:inline">TalentFlow</span>
    </div>
    <div class="w-px h-6 bg-slate-200 flex-none hidden sm:block"></div>

    <div class="relative flex-none">
      <svg class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h3l2-2h4l2 2h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></svg>
      <select id="jobSwitcher" class="appearance-none pl-9 pr-8 py-1.5 rounded-lg border border-slate-300 bg-white text-sm font-medium text-slate-800 hover:border-slate-400 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:border-indigo-500 cursor-pointer max-w-[15rem] sm:max-w-xs truncate"></select>
      <svg class="pointer-events-none absolute right-2.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
    </div>

    <div class="flex-1"></div>

    <button id="bellBtn" type="button" aria-label="Notifications" class="w-9 h-9 flex-none flex items-center justify-center rounded-lg text-slate-500 hover:bg-slate-100 hover:text-slate-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500">
      <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 4.5 1.5 6 2 6.5H4c.5-.5 2-2 2-6.5Z"/><path d="M10 19a2 2 0 0 0 4 0"/></svg>
    </button>
    <div class="flex items-center gap-2 pl-1 flex-none">
      <div class="w-8 h-8 rounded-full bg-amber-100 text-amber-800 flex items-center justify-center text-xs font-semibold">JL</div>
      <span class="text-sm text-slate-700 hidden md:inline">Jordan Lee</span>
    </div>
  </header>

  <!-- Toolbar -->
  <div class="flex-none bg-white border-b border-slate-200 px-5 sm:px-6 py-2.5 flex flex-wrap items-center gap-2.5">
    <div class="relative w-full sm:w-64">
      <svg class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
      <input id="searchInput" type="text" placeholder="Search candidates or titles…" class="w-full pl-9 pr-8 py-1.5 rounded-lg border border-slate-300 text-sm placeholder-slate-400 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:border-indigo-500" />
      <button id="searchClear" type="button" aria-label="Clear search" class="hidden absolute right-2 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400 hover:text-slate-600">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>

    <div class="relative">
      <select id="sourceFilter" class="appearance-none pl-3 pr-8 py-1.5 rounded-lg border border-slate-300 bg-white text-sm text-slate-700 hover:border-slate-400 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 cursor-pointer">
        <option value="all">All sources</option>
      </select>
      <svg class="pointer-events-none absolute right-2.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
    </div>

    <div class="relative">
      <select id="recruiterFilter" class="appearance-none pl-3 pr-8 py-1.5 rounded-lg border border-slate-300 bg-white text-sm text-slate-700 hover:border-slate-400 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 cursor-pointer">
        <option value="all">All recruiters</option>
      </select>
      <svg class="pointer-events-none absolute right-2.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
    </div>

    <div class="relative">
      <select id="ratingFilter" class="appearance-none pl-3 pr-8 py-1.5 rounded-lg border border-slate-300 bg-white text-sm text-slate-700 hover:border-slate-400 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 cursor-pointer">
        <option value="0">Any rating</option>
        <option value="2">2+ stars</option>
        <option value="3">3+ stars</option>
        <option value="4">4+ stars</option>
        <option value="5">5 stars</option>
      </select>
      <svg class="pointer-events-none absolute right-2.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
    </div>

    <button id="declinedToggle" type="button" role="switch" aria-checked="false" class="flex items-center gap-2 pl-1 pr-3 py-1 rounded-lg hover:bg-slate-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500">
      <span class="relative inline-flex h-5 w-9 flex-none items-center rounded-full bg-slate-300 transition-colors" data-switch-track>
        <span class="inline-block h-3.5 w-3.5 translate-x-1 rounded-full bg-white shadow transition-transform" data-switch-knob></span>
      </span>
      <span class="text-sm text-slate-600">Show declined</span>
    </button>

    <div class="flex-1"></div>

    <button id="clearFiltersBtn" type="button" class="hidden text-sm text-indigo-600 hover:text-indigo-700 hover:underline focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 rounded px-1">Clear filters</button>

    <button id="addCandidateBtn" type="button" class="flex items-center gap-1.5 bg-indigo-600 text-white text-sm font-medium rounded-lg px-3 py-1.5 hover:bg-indigo-700 active:bg-indigo-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-2">
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      Add candidate
    </button>
  </div>

  <!-- Pipeline overview -->
  <div class="flex-none bg-white border-b border-slate-200 px-5 sm:px-6 py-2.5 flex flex-wrap items-center gap-x-6 gap-y-1.5">
    <div id="jobMeta" class="text-xs text-slate-500 flex-none"></div>
    <div class="flex items-center gap-3 flex-1 min-w-[260px]">
      <div id="funnelBar" class="flex h-2 rounded-full overflow-hidden bg-slate-100 flex-1 min-w-[140px] max-w-sm"></div>
      <div id="funnelLegend" class="flex flex-wrap items-center gap-x-3 gap-y-1 text-[11px] text-slate-500 tabular"></div>
    </div>
    <div id="conversionStat" class="text-xs text-slate-500 flex-none tabular"></div>
  </div>

  <!-- Board -->
  <main id="board" class="flex-1 min-h-0 overflow-x-auto overflow-y-hidden px-5 sm:px-6 py-4 flex gap-4 items-start scroll-thin"></main>
</div>

<!-- Drawer -->
<div id="drawerRoot" class="fixed inset-0 z-50 hidden" aria-hidden="true">
  <div data-drawer-backdrop class="absolute inset-0 bg-slate-900/40 opacity-0"></div>
  <div class="absolute inset-0 flex justify-end">
    <div data-drawer-panel class="translate-x-full w-full max-w-md bg-white h-full shadow-xl flex flex-col" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
      <div id="drawerContent" class="flex flex-col h-full"></div>
    </div>
  </div>
</div>

<!-- Toasts -->
<div id="toastHost" class="fixed bottom-5 right-5 z-[60] flex flex-col gap-2 items-end"></div>

<script>
(function(){
  "use strict";

  /* ---------------- utilities ---------------- */
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const pick = (arr, i) => arr[((i % arr.length) + arr.length) % arr.length];
  const TODAY = new Date(2026, 10, 7);
  const addDays = (d, n) => { const r = new Date(d); r.setDate(r.getDate() + n); return r; };
  const formatDate = (d) => d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  const hueFromString = (s) => { let h = 0; for (let i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) % 360; return h; };

  const ICON = {
    star: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 6.3 6.9.7-5.1 4.6 1.4 6.8L12 17.6l-6.1 3.3 1.4-6.8-5.1-4.6 6.9-.7L12 2.5z"/></svg>',
    clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>',
    arrowRight: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
    x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
    mail: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',
    pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.1-7-11.5A7 7 0 0 1 19 9.5C19 14.9 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.25"/></svg>',
    user: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c1-4 4-6 7.5-6s6.5 2 7.5 6"/></svg>',
    userX: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 19c.8-3.4 3.3-5.5 6.5-5.5s5.7 2.1 6.5 5.5"/><path d="m17 8 4 4m0-4-4 4"/></svg>',
    briefcase: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h3l2-2h4l2 2h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></svg>'
  };

  /* ---------------- reference data ---------------- */
  const FIRST = ["Olivia","Liam","Emma","Noah","Priya","Ethan","Sofia","Mason","Fatima","Lucas","Mia","Elijah","Amelia","Diego","Harper","Kwame","Evelyn","Yuki","Mohammed","Aisha","Carlos","Mei","Arjun","Ngozi","Hiro","Elena","Omar","Ingrid","Sana"];
  const LAST = ["Patel","Nguyen","Garcia","Kim","Johnson","Khan","Rossi","Muller","Dubois","Silva","Cohen","Novak","Okafor","Tanaka","Petrov","Alvarez","Larsen","Haddad","Yamamoto","Brown","Davis","Martinez","Chen","Singh","Reyes","Adeyemi","Osei","Lindqvist","Hassan","Wong","Fischer"];
  const SOURCES = ["LinkedIn","Referral","Careers Site","Recruiting Agency","Job Fair","Indeed"];
  const RECRUITERS = [{initials:"MK",name:"Maya Kessler"},{initials:"RS",name:"Reem Saleh"},{initials:"JT",name:"Jordan Tran"},{initials:"AO",name:"Ava O'Connor"}];
  const LOCATIONS = ["San Francisco, CA","Austin, TX","Chicago, IL","Remote, US","New York, NY","Denver, CO","Seattle, WA","Toronto, ON"];
  const COMPANIES = ["Northwind Labs","Vertex Software","Brightpath Inc.","Lumen Analytics","Fieldstone Co.","Harbor & Co.","Quill Technologies","Atlas Retail","Meridian Health","Civic Data","Fernwood Studio","Ridgeline Systems"];
  const NOTE_TEMPLATES = [
    "Strong communicator, came across as very prepared.",
    "Portfolio/background is a good fit for the team's current needs.",
    "Some hesitation on compensation expectations — worth revisiting.",
    "Panel was impressed with problem-solving approach.",
    "Needs a follow-up on availability for next round."
  ];
  const NEXT_STEP = {
    applied: ["Resume under review","Awaiting recruiter screen","Queued for initial review"],
    screening: ["Phone screen scheduled","Awaiting screen feedback","Screen completed, pending decision"],
    interview: ["Onsite loop scheduled","Panel feedback pending","Take-home exercise due"],
    offer: ["Offer sent, awaiting response","Negotiating compensation","Verbal accept, drafting paperwork"],
    hired: ["Start date confirmed","Onboarding in progress"],
    rejected: ["Not enough relevant experience","Moved forward with another candidate","Compensation mismatch","Candidate withdrew","Did not pass technical screen"]
  };

  const STAGES = [
    { key:'applied',   label:'Applied',               dot:'bg-slate-400'  },
    { key:'screening', label:'Screening',              dot:'bg-sky-500'    },
    { key:'interview',  label:'Interview',             dot:'bg-violet-500' },
    { key:'offer',      label:'Offer',                 dot:'bg-amber-500'  },
    { key:'hired',      label:'Hired',                 dot:'bg-emerald-500'},
    { key:'rejected',   label:'Not Moving Forward',    dot:'bg-rose-400', muted:true }
  ];
  const FORWARD_ORDER = ['applied','screening','interview','offer','hired'];
  const nextStageOf = (s) => { const i = FORWARD_ORDER.indexOf(s); return (i===-1 || i===FORWARD_ORDER.length-1) ? null : FORWARD_ORDER[i+1]; };

  function makeName(gi, jobOffset){
    const fi = (gi*7 + jobOffset*5) % FIRST.length;
    const li = (gi*9 + jobOffset*13 + 3) % LAST.length;
    return { first: FIRST[fi], last: LAST[li] };
  }

  function buildCandidates(jobIndex, jobTitle, tagPool, counts){
    const list = [];
    let i = 0;
    STAGES.forEach((stage) => {
      const n = counts[stage.key] || 0;
      for (let k=0; k<n; k++){
        const gi = jobIndex*41 + i*3 + 1;
        const { first, last } = makeName(gi, jobIndex);
        const stageDepth = Math.max(0, FORWARD_ORDER.indexOf(stage.key));
        const daysInStage = (gi*3 + 5) % 17 + 1;
        const appliedDaysAgo = daysInStage + stageDepth*6 + (gi % 5);
        const appliedDateObj = addDays(TODAY, -appliedDaysAgo);
        const rating = stage.key === 'applied' ? 0 : (gi % 5) + 1;
        const t1 = pick(tagPool, gi);
        let t2i = (gi + 3) % tagPool.length;
        if (tagPool[t2i] === t1) t2i = (t2i + 1) % tagPool.length;
        const t2 = tagPool[t2i];
        const recruiter = pick(RECRUITERS, gi);
        const source = pick(SOURCES, gi + 2);
        const company = pick(COMPANIES, gi + 4);
        const nextStepPool = NEXT_STEP[stage.key];
        const nextStep = pick(nextStepPool, gi);
        const hasNote = gi % 4 === 0;
        list.push({
          id: `c-${jobIndex}-${i}`,
          first, last,
          initials: (first[0] + last[0]).toUpperCase(),
          title: jobTitle,
          company,
          source,
          recruiter,
          stage: stage.key,
          daysInStage,
          rating,
          tags: [t1, t2],
          appliedDate: appliedDateObj,
          nextStep,
          email: `${first.toLowerCase()}.${last.toLowerCase()}@mailbox.dev`,
          location: pick(LOCATIONS, gi + 1),
          notes: hasNote ? [{ author: recruiter.name, date: formatDate(addDays(TODAY, -Math.max(1, daysInStage-2))), text: pick(NOTE_TEMPLATES, gi) }] : []
        });
        i++;
      }
    });
    return list;
  }

  const JOBS = [
    { id:'pd', title:'Senior Product Designer', department:'Design', location:'San Francisco, CA', workType:'Hybrid', openSince:'Sep 2, 2026',
      tagPool:["Figma","Design systems","Strong portfolio","Prototyping","B2B SaaS","Accessibility","Motion design","User research"],
      counts:{ applied:7, screening:6, interview:5, offer:2, hired:3, rejected:7 } },
    { id:'be', title:'Backend Engineer, Platform', department:'Engineering', location:'Remote, US', workType:'Remote', openSince:'Aug 18, 2026',
      tagPool:["Go","Distributed systems","PostgreSQL","Kubernetes","AWS","System design","Open source","Kafka"],
      counts:{ applied:8, screening:5, interview:4, offer:1, hired:2, rejected:6 } },
    { id:'cs', title:'Customer Success Manager', department:'Customer Success', location:'Austin, TX', workType:'Onsite', openSince:'Oct 1, 2026',
      tagPool:["SaaS onboarding","Churn reduction","Salesforce","Team leadership","Enterprise accounts","Bilingual (ES)","QBR experience"],
      counts:{ applied:5, screening:4, interview:3, offer:1, hired:1, rejected:4 } }
  ];

  const candidatesByJob = {};
  JOBS.forEach((job, idx) => { candidatesByJob[job.id] = buildCandidates(idx, job.title, job.tagPool, job.counts); });

  /* ---------------- state ---------------- */
  const state = {
    jobId: JOBS[0].id,
    search: '',
    source: 'all',
    recruiter: 'all',
    minRating: 0,
    showDeclined: false,
    drawer: { open:false, mode:null, candidateId:null }
  };

  const currentJob = () => JOBS.find(j => j.id === state.jobId);
  const currentCandidates = () => candidatesByJob[state.jobId];
  const findCandidate = (id) => currentCandidates().find(c => c.id === id);

  function matchesFilters(c){
    const q = state.search.trim().toLowerCase();
    if (q && !(`${c.first} ${c.last}`.toLowerCase().includes(q) || c.title.toLowerCase().includes(q) || c.company.toLowerCase().includes(q))) return false;
    if (state.source !== 'all' && c.source !== state.source) return false;
    if (state.recruiter !== 'all' && c.recruiter.name !== state.recruiter) return false;
    if (state.minRating > 0 && c.rating < state.minRating) return false;
    return true;
  }

  /* ---------------- rendering ---------------- */
  function renderJobSwitcher(){
    const sel = document.getElementById('jobSwitcher');
    sel.innerHTML = JOBS.map(j => {
      const count = candidatesByJob[j.id].filter(c => c.stage !== 'rejected').length;
      return `<option value="${j.id}" ${j.id===state.jobId?'selected':''}>${esc(j.title)} — ${count} active</option>`;
    }).join('');
  }

  function renderStaticFilterOptions(){
    const sourceSel = document.getElementById('sourceFilter');
    sourceSel.innerHTML = '<option value="all">All sources</option>' + SOURCES.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join('');
    const recSel = document.getElementById('recruiterFilter');
    recSel.innerHTML = '<option value="all">All recruiters</option>' + RECRUITERS.map(r => `<option value="${esc(r.name)}">${esc(r.name)}</option>`).join('');
  }

  function syncFilterControls(){
    document.getElementById('searchInput').value = state.search;
    document.getElementById('searchClear').classList.toggle('hidden', !state.search);
    document.getElementById('sourceFilter').value = state.source;
    document.getElementById('recruiterFilter').value = state.recruiter;
    document.getElementById('ratingFilter').value = String(state.minRating);
    document.querySelector('[data-switch-track]').classList.toggle('bg-indigo-600', state.showDeclined);
    document.querySelector('[data-switch-track]').classList.toggle('bg-slate-300', !state.showDeclined);
    document.querySelector('[data-switch-knob]').classList.toggle('translate-x-4', state.showDeclined);
    document.querySelector('[data-switch-knob]').classList.toggle('translate-x-1', !state.showDeclined);
    document.getElementById('declinedToggle').setAttribute('aria-checked', String(state.showDeclined));
    const dirty = state.search || state.source!=='all' || state.recruiter!=='all' || state.minRating>0 || state.showDeclined;
    document.getElementById('clearFiltersBtn').classList.toggle('hidden', !dirty);
  }

  function renderJobMeta(){
    const j = currentJob();
    document.getElementById('jobMeta').innerHTML =
      `<span class="font-medium text-slate-700">${esc(j.department)}</span> · ${esc(j.location)} · ${esc(j.workType)} · Open since ${esc(j.openSince)}`;
  }

  function renderFunnel(){
    const all = currentCandidates();
    const total = all.length;
    const bar = document.getElementById('funnelBar');
    const legend = document.getElementById('funnelLegend');
    const pipelineStages = STAGES.filter(s => s.key !== 'rejected');
    bar.innerHTML = pipelineStages.map(s => {
      const n = all.filter(c => c.stage === s.key).length;
      const pct = total ? (n/total*100) : 0;
      return pct > 0 ? `<div class="${s.dot}" style="width:${pct}%" title="${s.label}: ${n}"></div>` : '';
    }).join('');
    legend.innerHTML = pipelineStages.map(s => {
      const n = all.filter(c => c.stage === s.key).length;
      return `<span class="inline-flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full ${s.dot}"></span>${s.label} ${n}</span>`;
    }).join('');
    const hired = all.filter(c => c.stage === 'hired').length;
    const pct = total ? Math.round(hired/total*100) : 0;
    document.getElementById('conversionStat').textContent = `${hired}/${total} hired · ${pct}% conversion`;
  }

  function starRow(rating, size){
    size = size || 'w-3.5 h-3.5';
    let out = '';
    for (let i=1;i<=5;i++){
      out += `<span class="${size} inline-block ${i<=rating ? 'text-amber-400':'text-slate-200'}">${ICON.star}</span>`;
    }
    return out;
  }

  function cardTemplate(c){
    const hue = hueFromString(c.first + c.last);
    const canAdvance = nextStageOf(c.stage) !== null;
    return `
    <div class="card group bg-white rounded-lg border border-slate-200 shadow-sm hover:shadow-md hover:border-slate-300 transition-shadow p-3 cursor-pointer focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500"
         draggable="true" data-id="${c.id}" tabindex="0" role="listitem" aria-label="${esc(c.first+' '+c.last)}, ${esc(STAGES.find(s=>s.key===c.stage).label)}">
      <div class="flex items-start gap-2.5">
        <div class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-semibold flex-none"
             style="background:hsl(${hue} 70% 90%); color:hsl(${hue} 55% 32%)">${c.initials}</div>
        <div class="min-w-0 flex-1">
          <div class="flex items-center justify-between gap-1">
            <p class="text-sm font-medium text-slate-900 truncate">${esc(c.first)} ${esc(c.last)}</p>
            ${canAdvance ? `<button type="button" class="quick-advance flex-none w-6 h-6 rounded-md text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 opacity-0 group-hover:opacity-100 focus-visible:opacity-100 transition-opacity" data-id="${c.id}" aria-label="Move to next stage"><span class="w-3.5 h-3.5 inline-block mx-auto">${ICON.arrowRight}</span></button>` : ''}
          </div>
          <p class="text-xs text-slate-500 truncate">${esc(c.title)} · ${esc(c.company)}</p>
        </div>
      </div>
      <div class="flex flex-wrap gap-1 mt-2">
        ${c.tags.slice(0,2).map(t => `<span class="text-[11px] leading-4 px-1.5 py-0.5 rounded bg-slate-100 text-slate-600">${esc(t)}</span>`).join('')}
      </div>
      <div class="flex items-center justify-between mt-2.5">
        <div class="flex items-center gap-0.5" aria-label="Rating ${c.rating} of 5">${c.rating ? starRow(c.rating) : '<span class="text-[11px] text-slate-400">Not yet rated</span>'}</div>
        <div class="flex items-center gap-1 text-[11px] text-slate-400 tabular">
          <span class="w-3.5 h-3.5">${ICON.clock}</span>${c.daysInStage}d
        </div>
      </div>
    </div>`;
  }

  function columnEmptyState(label){
    return `<div class="flex flex-col items-center justify-center text-center py-8 px-3 text-slate-400">
      <svg class="w-8 h-8 mb-2 opacity-60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>
      <p class="text-xs">No candidates match your filters in ${esc(label)}.</p>
    </div>`;
  }

  function renderBoard(){
    const board = document.getElementById('board');
    const all = currentCandidates();
    const visibleStages = STAGES.filter(s => state.showDeclined || s.key !== 'rejected');
    board.innerHTML = visibleStages.map(s => {
      const list = all.filter(c => c.stage === s.key && matchesFilters(c));
      const totalInStage = all.filter(c => c.stage === s.key).length;
      return `
      <section class="flex-none w-[300px] md:w-[320px] h-full flex flex-col rounded-xl ${s.muted ? 'bg-slate-50' : 'bg-slate-100/70'}">
        <header class="flex-none flex items-center justify-between px-3 py-2.5">
          <div class="flex items-center gap-2 min-w-0">
            <span class="w-2 h-2 rounded-full flex-none ${s.dot}"></span>
            <h2 class="text-sm font-semibold ${s.muted ? 'text-slate-500' : 'text-slate-700'} truncate">${s.label}</h2>
          </div>
          <span class="text-xs tabular rounded-full px-2 py-0.5 border ${s.muted ? 'bg-white/70 border-slate-200 text-slate-400' : 'bg-white border-slate-200 text-slate-600'}">${totalInStage}</span>
        </header>
        <div class="dropzone flex-1 min-h-[80px] overflow-y-auto scroll-thin px-2 pb-3 space-y-2 rounded-b-xl transition-colors" data-stage="${s.key}" role="list" aria-label="${s.label} candidates">
          ${list.length ? list.map(cardTemplate).join('') : (totalInStage===0 ? '' : columnEmptyState(s.label))}
        </div>
      </section>`;
    }).join('');
  }

  function renderAll(){
    renderJobSwitcher();
    renderJobMeta();
    renderFunnel();
    renderBoard();
    syncFilterControls();
  }

  /* ---------------- toasts ---------------- */
  function showToast(message){
    const host = document.getElementById('toastHost');
    const el = document.createElement('div');
    el.className = 'toast-anim bg-slate-900 text-white text-sm rounded-lg px-4 py-2.5 shadow-lg max-w-xs';
    el.textContent = message;
    host.appendChild(el);
    setTimeout(() => {
      el.style.transition = 'opacity .2s ease, transform .2s ease';
      el.style.opacity = '0';
      el.style.transform = 'translateY(6px)';
      setTimeout(() => el.remove(), 200);
    }, 2600);
  }

  /* ---------------- mutations ---------------- */
  function moveCandidate(id, newStage, opts){
    opts = opts || {};
    const c = findCandidate(id);
    if (!c || c.stage === newStage) return;
    c.stage = newStage;
    c.daysInStage = 0;
    c.nextStep = opts.nextStep || pick(NEXT_STEP[newStage], c.first.length + c.last.length);
    const label = STAGES.find(s => s.key === newStage).label;
    showToast(`Moved ${c.first} ${c.last} to ${label}`);
    renderFunnel();
    renderBoard();
    if (state.drawer.open && state.drawer.candidateId === id) openDrawer(id);
  }

  function addNote(id, text){
    const c = findCandidate(id);
    if (!c || !text.trim()) return;
    c.notes.push({ author:'Jordan Lee', date: formatDate(TODAY), text: text.trim() });
    openDrawer(id);
  }

  function setRating(id, rating){
    const c = findCandidate(id);
    if (!c) return;
    c.rating = rating;
    renderBoard();
    openDrawer(id);
  }

  function addCandidate(data){
    const job = currentJob();
    const first = data.first, last = data.last;
    const gi = Date.now() % 997;
    const newC = {
      id: `new-${Date.now()}`,
      first, last,
      initials: (first[0] + last[0]).toUpperCase(),
      title: data.title || job.title,
      company: data.company || '—',
      source: data.source || SOURCES[0],
      recruiter: RECRUITERS[0],
      stage: 'applied',
      daysInStage: 0,
      rating: 0,
      tags: [pick(job.tagPool, gi), pick(job.tagPool, gi+1)],
      appliedDate: TODAY,
      nextStep: pick(NEXT_STEP.applied, gi),
      email: data.email || `${first.toLowerCase()}.${last.toLowerCase()}@mailbox.dev`,
      location: data.location || '—',
      notes: []
    };
    candidatesByJob[job.id].unshift(newC);
    showToast(`Added ${first} ${last} to Applied`);
    renderFunnel();
    renderBoard();
  }

  /* ---------------- drawer ---------------- */
  function drawerDetailTemplate(c){
    const stageIdx = FORWARD_ORDER.indexOf(c.stage);
    const timelineStages = c.stage === 'rejected' ? STAGES.filter(s=>s.key!=='rejected') : STAGES.filter(s=>FORWARD_ORDER.indexOf(s.key) <= stageIdx && s.key!=='rejected');
    const canAdvance = nextStageOf(c.stage) !== null;
    const isTerminal = c.stage === 'hired' || c.stage === 'rejected';
    const hue = hueFromString(c.first + c.last);
    return `
    <div class="flex-none px-5 py-4 border-b border-slate-200 flex items-start justify-between gap-3">
      <div class="flex items-start gap-3 min-w-0">
        <div class="w-11 h-11 rounded-full flex items-center justify-center text-sm font-semibold flex-none" style="background:hsl(${hue} 70% 90%); color:hsl(${hue} 55% 32%)">${c.initials}</div>
        <div class="min-w-0">
          <h2 id="drawerTitle" class="text-base font-semibold text-slate-900 truncate">${esc(c.first)} ${esc(c.last)}</h2>
          <p class="text-sm text-slate-500 truncate">${esc(c.title)} · ${esc(c.company)}</p>
        </div>
      </div>
      <button type="button" data-close-drawer class="flex-none w-8 h-8 rounded-lg text-slate-400 hover:bg-slate-100 hover:text-slate-600 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500"><span class="w-4 h-4 inline-block mx-auto">${ICON.x}</span></button>
    </div>

    <div class="flex-1 overflow-y-auto scroll-thin px-5 py-4 space-y-5">
      <div class="flex flex-wrap items-center gap-2">
        <span class="inline-flex items-center gap-1.5 text-xs font-medium px-2 py-1 rounded-full bg-slate-100 text-slate-700">
          <span class="w-1.5 h-1.5 rounded-full ${STAGES.find(s=>s.key===c.stage).dot}"></span>${STAGES.find(s=>s.key===c.stage).label}
        </span>
        <span class="text-xs text-slate-400">${esc(c.source)}</span>
        <span class="text-xs text-slate-400">Applied ${formatDate(c.appliedDate)}</span>
      </div>

      <div class="space-y-1.5 text-sm text-slate-600">
        <div class="flex items-center gap-2"><span class="w-4 h-4 text-slate-400">${ICON.mail}</span>${esc(c.email)}</div>
        <div class="flex items-center gap-2"><span class="w-4 h-4 text-slate-400">${ICON.pin}</span>${esc(c.location)}</div>
        <div class="flex items-center gap-2"><span class="w-4 h-4 text-slate-400">${ICON.user}</span>Recruiter: ${esc(c.recruiter.name)}</div>
      </div>

      <div>
        <p class="text-xs font-medium text-slate-500 mb-1.5">Interview rating</p>
        <div class="flex items-center gap-1" data-rating-row>
          ${[1,2,3,4,5].map(n => `<button type="button" class="rate-star w-5 h-5 ${n<=c.rating?'text-amber-400':'text-slate-200 hover:text-amber-300'} focus:outline-none" data-id="${c.id}" data-value="${n}" aria-label="Rate ${n} star">${ICON.star}</button>`).join('')}
          <span class="text-xs text-slate-400 ml-1">${c.rating ? c.rating+'/5' : 'Not yet rated'}</span>
        </div>
      </div>

      <div>
        <p class="text-xs font-medium text-slate-500 mb-1.5">Tags</p>
        <div class="flex flex-wrap gap-1.5">
          ${c.tags.map(t => `<span class="text-xs px-2 py-0.5 rounded bg-slate-100 text-slate-600">${esc(t)}</span>`).join('')}
        </div>
      </div>

      <div>
        <p class="text-xs font-medium text-slate-500 mb-1.5">Next step</p>
        <p class="text-sm text-slate-700">${esc(c.nextStep)}</p>
      </div>

      <div>
        <p class="text-xs font-medium text-slate-500 mb-2">Pipeline history</p>
        <div class="space-y-0">
          ${timelineStages.map((s, idx) => {
            const isCurrent = s.key === c.stage;
            const isLast = idx === timelineStages.length - 1;
            return `
            <div class="flex gap-2.5">
              <div class="flex flex-col items-center">
                <span class="w-2.5 h-2.5 rounded-full flex-none ${isCurrent ? s.dot : 'bg-slate-300'}"></span>
                ${!isLast ? '<span class="w-px flex-1 bg-slate-200"></span>' : ''}
              </div>
              <div class="pb-3 -mt-0.5">
                <p class="text-sm ${isCurrent ? 'text-slate-900 font-medium':'text-slate-500'}">${s.label}</p>
                <p class="text-xs text-slate-400">${idx===0 ? formatDate(c.appliedDate) : (isCurrent ? c.daysInStage+'d ago · current' : 'Completed')}</p>
              </div>
            </div>`;
          }).join('')}
        </div>
      </div>

      <div>
        <p class="text-xs font-medium text-slate-500 mb-2">Notes</p>
        <div class="space-y-2.5 mb-3">
          ${c.notes.length ? c.notes.map(n => `
            <div class="bg-slate-50 rounded-lg px-3 py-2">
              <div class="flex items-center justify-between text-xs text-slate-400 mb-0.5"><span class="font-medium text-slate-600">${esc(n.author)}</span><span>${esc(n.date)}</span></div>
              <p class="text-sm text-slate-700">${esc(n.text)}</p>
            </div>`).join('') : '<p class="text-xs text-slate-400">No notes yet.</p>'}
        </div>
        <form data-note-form class="flex items-start gap-2">
          <input type="hidden" name="id" value="${c.id}" />
          <textarea name="text" rows="2" placeholder="Add a note…" class="flex-1 text-sm rounded-lg border border-slate-300 px-2.5 py-1.5 placeholder-slate-400 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 resize-none"></textarea>
          <button type="submit" class="flex-none text-sm font-medium text-indigo-600 hover:text-indigo-700 px-1 py-1.5">Add</button>
        </form>
      </div>
    </div>

    <div class="flex-none px-5 py-3.5 border-t border-slate-200 flex items-center gap-2">
      ${canAdvance ? `<button type="button" data-drawer-advance data-id="${c.id}" class="flex-1 bg-indigo-600 text-white text-sm font-medium rounded-lg px-3 py-2 hover:bg-indigo-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500">Move to ${STAGES.find(s=>s.key===nextStageOf(c.stage)).label}</button>` : `<span class="flex-1 text-sm text-slate-400 px-1">${c.stage==='hired' ? 'Hired — pipeline complete' : 'Not moving forward'}</span>`}
      ${!isTerminal ? `<button type="button" data-drawer-reject data-id="${c.id}" class="flex-none flex items-center gap-1.5 text-sm font-medium text-rose-600 border border-rose-200 rounded-lg px-3 py-2 hover:bg-rose-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-rose-400"><span class="w-4 h-4">${ICON.userX}</span>Reject</button>` : ''}
    </div>`;
  }

  function drawerAddTemplate(){
    const job = currentJob();
    return `
    <div class="flex-none px-5 py-4 border-b border-slate-200 flex items-center justify-between">
      <h2 id="drawerTitle" class="text-base font-semibold text-slate-900">Add candidate</h2>
      <button type="button" data-close-drawer class="w-8 h-8 rounded-lg text-slate-400 hover:bg-slate-100 hover:text-slate-600 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500"><span class="w-4 h-4 inline-block mx-auto">${ICON.x}</span></button>
    </div>
    <form data-add-form class="flex-1 overflow-y-auto scroll-thin px-5 py-4 space-y-4">
      <p class="text-xs text-slate-500">New candidates are added to <span class="font-medium text-slate-700">${esc(job.title)}</span> at the Applied stage.</p>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1">First name</label>
          <input required name="first" type="text" class="w-full text-sm rounded-lg border border-slate-300 px-2.5 py-1.5 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500" />
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1">Last name</label>
          <input required name="last" type="text" class="w-full text-sm rounded-lg border border-slate-300 px-2.5 py-1.5 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500" />
        </div>
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-500 mb-1">Email</label>
        <input name="email" type="email" placeholder="optional" class="w-full text-sm rounded-lg border border-slate-300 px-2.5 py-1.5 placeholder-slate-400 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500" />
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-500 mb-1">Current company</label>
        <input name="company" type="text" placeholder="optional" class="w-full text-sm rounded-lg border border-slate-300 px-2.5 py-1.5 placeholder-slate-400 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500" />
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-500 mb-1">Source</label>
        <select name="source" class="w-full text-sm rounded-lg border border-slate-300 px-2.5 py-1.5 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500">
          ${SOURCES.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join('')}
        </select>
      </div>
    </form>
    <div class="flex-none px-5 py-3.5 border-t border-slate-200 flex items-center gap-2">
      <button type="button" data-submit-add class="flex-1 bg-indigo-600 text-white text-sm font-medium rounded-lg px-3 py-2 hover:bg-indigo-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500">Add to Applied</button>
      <button type="button" data-close-drawer class="flex-none text-sm font-medium text-slate-600 border border-slate-300 rounded-lg px-3 py-2 hover:bg-slate-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500">Cancel</button>
    </div>`;
  }

  function openDrawer(candidateId){
    state.drawer = { open:true, mode:'detail', candidateId };
    const c = findCandidate(candidateId);
    document.getElementById('drawerContent').innerHTML = drawerDetailTemplate(c);
    showDrawer();
  }

  function openAddDrawer(){
    state.drawer = { open:true, mode:'add', candidateId:null };
    document.getElementById('drawerContent').innerHTML = drawerAddTemplate();
    showDrawer();
    const form = document.querySelector('[data-add-form]');
    form.addEventListener('submit', onAddSubmit);
    document.querySelector('[data-submit-add]').addEventListener('click', () => form.requestSubmit());
  }

  function onAddSubmit(e){
    e.preventDefault();
    const fd = new FormData(e.target);
    addCandidate({
      first: fd.get('first').trim(),
      last: fd.get('last').trim(),
      email: fd.get('email').trim(),
      company: fd.get('company').trim(),
      source: fd.get('source')
    });
    closeDrawer();
  }

  function showDrawer(){
    const root = document.getElementById('drawerRoot');
    root.classList.remove('hidden');
    root.setAttribute('aria-hidden', 'false');
    requestAnimationFrame(() => {
      document.querySelector('[data-drawer-backdrop]').classList.remove('opacity-0');
      document.querySelector('[data-drawer-panel]').classList.remove('translate-x-full');
    });
    document.querySelector('[data-drawer-panel] [data-close-drawer], [data-drawer-panel]').focus?.();
  }

  function closeDrawer(){
    document.querySelector('[data-drawer-backdrop]').classList.add('opacity-0');
    document.querySelector('[data-drawer-panel]').classList.add('translate-x-full');
    setTimeout(() => {
      document.getElementById('drawerRoot').classList.add('hidden');
      document.getElementById('drawerRoot').setAttribute('aria-hidden', 'true');
      state.drawer = { open:false, mode:null, candidateId:null };
    }, 280);
  }

  /* ---------------- events ---------------- */
  document.getElementById('jobSwitcher').addEventListener('change', (e) => {
    state.jobId = e.target.value;
    state.search = ''; state.source = 'all'; state.recruiter = 'all'; state.minRating = 0; state.showDeclined = false;
    renderAll();
  });

  document.getElementById('searchInput').addEventListener('input', (e) => { state.search = e.target.value; renderBoard(); syncFilterControls(); });
  document.getElementById('searchClear').addEventListener('click', () => { state.search=''; document.getElementById('searchInput').value=''; renderBoard(); syncFilterControls(); document.getElementById('searchInput').focus(); });
  document.getElementById('sourceFilter').addEventListener('change', (e) => { state.source = e.target.value; renderBoard(); syncFilterControls(); });
  document.getElementById('recruiterFilter').addEventListener('change', (e) => { state.recruiter = e.target.value; renderBoard(); syncFilterControls(); });
  document.getElementById('ratingFilter').addEventListener('change', (e) => { state.minRating = Number(e.target.value); renderBoard(); syncFilterControls(); });
  document.getElementById('declinedToggle').addEventListener('click', () => { state.showDeclined = !state.showDeclined; renderBoard(); syncFilterControls(); });
  document.getElementById('clearFiltersBtn').addEventListener('click', () => {
    state.search=''; state.source='all'; state.recruiter='all'; state.minRating=0; state.showDeclined=false;
    renderBoard(); syncFilterControls();
  });
  document.getElementById('addCandidateBtn').addEventListener('click', openAddDrawer);
  document.getElementById('bellBtn').addEventListener('click', () => showToast("You're all caught up — no new notifications."));

  document.getElementById('drawerRoot').addEventListener('click', (e) => {
    if (e.target.closest('[data-drawer-backdrop]') || e.target.closest('[data-close-drawer]')) closeDrawer();
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && state.drawer.open) closeDrawer(); });

  document.getElementById('drawerRoot').addEventListener('click', (e) => {
    const advanceBtn = e.target.closest('[data-drawer-advance]');
    if (advanceBtn) { const id = advanceBtn.dataset.id; const c = findCandidate(id); moveCandidate(id, nextStageOf(c.stage)); return; }
    const rejectBtn = e.target.closest('[data-drawer-reject]');
    if (rejectBtn) { const id = rejectBtn.dataset.id; moveCandidate(id, 'rejected', { nextStep: pick(NEXT_STEP.rejected, id.length) }); return; }
    const star = e.target.closest('.rate-star');
    if (star) { setRating(star.dataset.id, Number(star.dataset.value)); return; }
  });

  document.getElementById('drawerRoot').addEventListener('submit', (e) => {
    if (e.target.matches('[data-note-form]')) {
      e.preventDefault();
      const fd = new FormData(e.target);
      addNote(fd.get('id'), fd.get('text'));
    }
  });

  const board = document.getElementById('board');
  board.addEventListener('click', (e) => {
    const quick = e.target.closest('.quick-advance');
    if (quick) { e.stopPropagation(); const c = findCandidate(quick.dataset.id); if (c) moveCandidate(c.id, nextStageOf(c.stage)); return; }
    const card = e.target.closest('.card');
    if (card) openDrawer(card.dataset.id);
  });
  board.addEventListener('keydown', (e) => {
    const card = e.target.closest('.card');
    if (card && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openDrawer(card.dataset.id); }
  });

  board.addEventListener('dragstart', (e) => {
    const card = e.target.closest('.card');
    if (!card) return;
    e.dataTransfer.setData('text/plain', card.dataset.id);
    e.dataTransfer.effectAllowed = 'move';
    requestAnimationFrame(() => card.classList.add('card-drag-ghost'));
  });
  board.addEventListener('dragend', (e) => {
    const card = e.target.closest('.card');
    if (card) card.classList.remove('card-drag-ghost');
  });
  board.addEventListener('dragover', (e) => {
    const zone = e.target.closest('.dropzone');
    if (!zone) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    zone.classList.add('ring-2','ring-indigo-300','bg-indigo-50/50');
  });
  board.addEventListener('dragleave', (e) => {
    const zone = e.target.closest('.dropzone');
    if (!zone) return;
    if (zone.contains(e.relatedTarget)) return;
    zone.classList.remove('ring-2','ring-indigo-300','bg-indigo-50/50');
  });
  board.addEventListener('drop', (e) => {
    const zone = e.target.closest('.dropzone');
    if (!zone) return;
    e.preventDefault();
    zone.classList.remove('ring-2','ring-indigo-300','bg-indigo-50/50');
    const id = e.dataTransfer.getData('text/plain');
    if (id) moveCandidate(id, zone.dataset.stage);
  });

  /* ---------------- init ---------------- */
  renderStaticFilterOptions();
  renderAll();
