<script>
  tailwind.config = {

        colors: {
          background: 'var(--background)', foreground: 'var(--foreground)',
          card: { DEFAULT: 'var(--card)', foreground: 'var(--card-foreground)' },
          popover: { DEFAULT: 'var(--popover)', foreground: 'var(--popover-foreground)' },
          primary: { DEFAULT: 'var(--primary)', foreground: 'var(--primary-foreground)' },

          accent: { DEFAULT: 'var(--accent)', foreground: 'var(--accent-foreground)' },

          success: { DEFAULT: 'var(--success)', foreground: 'var(--success-foreground)', subtle: 'var(--success-subtle)', 'subtle-foreground': 'var(--success-subtle-foreground)' },
          warning: { DEFAULT: 'var(--warning)', foreground: 'var(--warning-foreground)', subtle: 'var(--warning-subtle)', 'subtle-foreground': 'var(--warning-subtle-foreground)' },
          info: { DEFAULT: 'var(--info)', foreground: 'var(--info-foreground)', subtle: 'var(--info-subtle)', 'subtle-foreground': 'var(--info-subtle-foreground)' },

<script>
(function () {
  "use strict";

  // ---------- Formatters (en-US, per project locale) ----------
  var LOCALE = "en-US";
  var nf = new Intl.NumberFormat(LOCALE);
  var dateFmt = new Intl.DateTimeFormat(LOCALE, { day: "2-digit", month: "2-digit", year: "numeric", timeZone: "UTC" });
  function formatDate(iso) {
    if (!iso) return null;
    return dateFmt.format(new Date(iso + "T00:00:00Z"));
  }
  function foldText(s) {
    return s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  }
  var TODAY = new Date("2026-11-05T00:00:00Z");
  function daysUntil(iso) {
    if (!iso) return null;
    var d = new Date(iso + "T00:00:00Z");
    return Math.round((d - TODAY) / 86400000);
  }

  // ---------- Status vocabulary ----------
  var STATUS_TONE = {
    "Operational": "success",
    "Under maintenance": "info",
    "Down": "danger",
    "Retired": "neutral"
  };
  var TONE_CLASSES = {
    success: "bg-success-subtle text-success-subtle-foreground",
    info: "bg-info-subtle text-info-subtle-foreground",
    warning: "bg-warning-subtle text-warning-subtle-foreground",
    danger: "bg-danger-subtle text-danger-subtle-foreground",
    neutral: "bg-neutral-subtle text-neutral-subtle-foreground"
  };

  function badge(text, tone) {
    return '<span class="inline-flex h-6 items-center rounded-full px-2 text-xs font-medium leading-5 ' + TONE_CLASSES[tone] + '">' + text + "</span>";
  }

  // ---------- Mock data ----------
  var EQUIPMENT = [
    { id: "EQ-1001", name: "CNC Milling Machine X200", type: "CNC Machine", location: "Plant 1 – Assembly Line A", status: "Operational", lastService: "2026-09-12", nextInspection: "2026-11-18" },
    { id: "EQ-1002", name: "Hydraulic Press HP-450", type: "Press", location: "Plant 1 – Assembly Line A", status: "Under maintenance", lastService: "2026-10-30", nextInspection: "2026-11-07" },
    { id: "EQ-1003", name: "Conveyor Belt System C-12", type: "Conveyor", location: "Plant 1 – Assembly Line B", status: "Operational", lastService: "2026-08-20", nextInspection: "2027-02-15" },
    { id: "EQ-1004", name: "Industrial Robot Arm R6-Axis", type: "Robot Arm", location: "Plant 1 – Assembly Line B", status: "Down", lastService: "2026-07-15", nextInspection: "2026-10-28" },
    { id: "EQ-1005", name: "Air Compressor AC-900", type: "Compressor", location: "Plant 1 – Packaging", status: "Operational", lastService: "2026-10-01", nextInspection: "2026-12-01" },
    { id: "EQ-1006", name: "Packaging Sealer PS-30", type: "Sealer", location: "Plant 1 – Packaging", status: "Operational", lastService: "2026-09-25", nextInspection: "2026-11-10" },
    { id: "EQ-1007", name: "Forklift FL-07", type: "Forklift", location: "Plant 2 – Warehouse", status: "Operational", lastService: "2026-10-18", nextInspection: "2027-01-18" },
    { id: "EQ-1008", name: "Forklift FL-08", type: "Forklift", location: "Plant 2 – Warehouse", status: "Under maintenance", lastService: "2026-11-02", nextInspection: "2026-11-09" },
    { id: "EQ-1009", name: "Overhead Crane OC-5T", type: "Crane", location: "Plant 2 – Machining Shop", status: "Operational", lastService: "2026-06-10", nextInspection: "2026-10-31" },
    { id: "EQ-1010", name: "CNC Lathe L-800", type: "CNC Machine", location: "Plant 2 – Machining Shop", status: "Operational", lastService: "2026-09-05", nextInspection: "2027-03-05" },
    { id: "EQ-1011", name: "Welding Station WS-14", type: "Welding Equipment", location: "Plant 2 – Machining Shop", status: "Down", lastService: "2026-05-22", nextInspection: "2026-09-22" },
    { id: "EQ-1012", name: "Boiler Unit B-200", type: "Boiler", location: "Utilities Building", status: "Operational", lastService: "2026-08-01", nextInspection: "2027-02-01" },
    { id: "EQ-1013", name: "Cooling Tower CT-3", type: "Cooling System", location: "Utilities Building", status: "Operational", lastService: "2026-10-10", nextInspection: "2026-11-20" },
    { id: "EQ-1014", name: "Backup Generator G-500", type: "Generator", location: "Utilities Building", status: "Operational", lastService: "2026-09-15", nextInspection: "2027-03-15" },
    { id: "EQ-1015", name: "Industrial Robot Arm R6-Axis", type: "Robot Arm", location: "Plant 1 – Assembly Line A", status: "Operational", lastService: "2026-10-05", nextInspection: "2026-11-12" },
    { id: "EQ-1016", name: "Conveyor Belt System C-14", type: "Conveyor", location: "Plant 1 – Packaging", status: "Retired", lastService: "2025-12-01", nextInspection: null },
    { id: "EQ-1017", name: "Hydraulic Press HP-460", type: "Press", location: "Plant 2 – Machining Shop", status: "Operational", lastService: "2026-10-22", nextInspection: "2027-01-22" },
    { id: "EQ-1018", name: "Air Compressor AC-910", type: "Compressor", location: "Plant 2 – Warehouse", status: "Under maintenance", lastService: "2026-11-01", nextInspection: "2026-11-15" },
    { id: "EQ-1019", name: "Forklift FL-09", type: "Forklift", location: "Plant 1 – Assembly Line B", status: "Operational", lastService: "2026-09-28", nextInspection: "2026-11-06" },
    { id: "EQ-1020", name: "CNC Milling Machine X210", type: "CNC Machine", location: "Plant 2 – Machining Shop", status: "Operational", lastService: "2026-10-12", nextInspection: "2027-01-12" }
  ];

  function urgency(row) {
    var d = daysUntil(row.nextInspection);
    if (d === null) return { key: "none", rank: 3, label: null, tone: null };
    if (d < 0) return { key: "overdue", rank: 0, label: "Overdue", tone: "danger", days: d };
    if (d <= 14) return { key: "due-soon", rank: 1, label: "Due in " + d + (d === 1 ? " day" : " days"), tone: "warning", days: d };
    return { key: "scheduled", rank: 2, label: null, tone: null, days: d };
  }

  // ---------- App state ----------
  var state = {
    search: "",
    statusTab: "all",
    location: "",
    type: "",
    urgencyFilter: "",
    sort: { key: "nextInspection", dir: "asc" },
    page: 1,
    pageSize: 25,
    selected: new Set(),
    allMatchingSelected: false,
    view: "loading" // loading | ready | empty | error
  };

  var params = new URLSearchParams(window.location.search);
  var forcedState = params.get("state");

  // ---------- Build filter option lists ----------
  var locations = Array.from(new Set(EQUIPMENT.map(function (r) { return r.location; }))).sort();
  var types = Array.from(new Set(EQUIPMENT.map(function (r) { return r.type; }))).sort();

  var locationSelect = document.getElementById("location-filter");
  locations.forEach(function (loc) {
    var o = document.createElement("option");
    o.value = loc; o.textContent = loc;
    locationSelect.appendChild(o);
  });
  var typeSelect = document.getElementById("type-filter");
  types.forEach(function (t) {
    var o = document.createElement("option");
    o.value = t; o.textContent = t;
    typeSelect.appendChild(o);
  });

  var STATUS_TABS = [
    { key: "all", label: "All" },
    { key: "Operational", label: "Operational" },
    { key: "Under maintenance", label: "Under maintenance" },
    { key: "Down", label: "Down" },
    { key: "Retired", label: "Retired" }
  ];

  function tabCount(key) {
    if (key === "all") return EQUIPMENT.length;
    return EQUIPMENT.filter(function (r) { return r.status === key; }).length;
  }

  function renderTabs() {
    var wrap = document.querySelector('[role="tablist"]');
    wrap.innerHTML = STATUS_TABS.map(function (t) {
      var active = state.statusTab === t.key;
      return '<button role="tab" aria-selected="' + active + '" data-tab="' + t.key + '" ' +
        'class="relative -mb-px flex items-center gap-1.5 border-b-2 px-0.5 py-2 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-ring rounded-t ' +
        (active ? "border-primary text-primary" : "border-transparent text-muted-foreground hover:text-foreground") + '">' +
        t.label + ' <span class="tabular-nums ' + (active ? "text-primary" : "text-muted-foreground") + '">' + tabCount(t.key) + "</span></button>";
    }).join("");
  }

  // ---------- Filtering / sorting / pagination ----------
  function filteredRows() {
    var q = foldText(state.search.trim());
    return EQUIPMENT.filter(function (r) {
      if (state.statusTab !== "all" && r.status !== state.statusTab) return false;
      if (state.location && r.location !== state.location) return false;
      if (state.type && r.type !== state.type) return false;
      if (state.urgencyFilter) {
        var u = urgency(r);
        if (u.key !== state.urgencyFilter) return false;
      }
      if (q) {
        var hay = foldText(r.name + " " + r.id + " " + r.location);
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });
  }

  function sortRows(rows) {
    var key = state.sort.key, dir = state.sort.dir;
    var withUrgency = rows.map(function (r) { return { row: r, u: urgency(r) }; });
    withUrgency.sort(function (a, b) {
      if (key === "nextInspection") {
        if (a.u.rank !== b.u.rank) return a.u.rank - b.u.rank;
        var av = a.row.nextInspection || "9999-99-99", bv = b.row.nextInspection || "9999-99-99";
        var cmp = av < bv ? -1 : av > bv ? 1 : 0;
        return dir === "asc" ? cmp : -cmp;
      }
      var av2, bv2;
      if (key === "lastService") { av2 = a.row.lastService; bv2 = b.row.lastService; }
      else if (key === "name") { av2 = a.row.name; bv2 = b.row.name; }
      else if (key === "location") { av2 = a.row.location; bv2 = b.row.location; }
      var cmp2 = av2 < bv2 ? -1 : av2 > bv2 ? 1 : 0;
      return dir === "asc" ? cmp2 : -cmp2;
    });
    return withUrgency.map(function (x) { return x.row; });
  }

  function pagedRows(rows) {
    var start = (state.page - 1) * state.pageSize;
    return rows.slice(start, start + state.pageSize);
  }

  // ---------- Chips ----------
  function renderChips() {
    var chips = [];
    if (state.location) chips.push({ key: "location", label: "Location: " + state.location });
    if (state.type) chips.push({ key: "type", label: "Type: " + state.type });
    if (state.urgencyFilter) chips.push({ key: "urgencyFilter", label: "Urgency: " + (state.urgencyFilter === "overdue" ? "Overdue" : "Due soon") });
    var wrap = document.getElementById("chips-row");
    if (!chips.length) { wrap.innerHTML = ""; return; }
    wrap.innerHTML = chips.map(function (c) {
      return '<span class="inline-flex h-6 items-center gap-1 rounded-full bg-secondary px-2 text-xs font-medium text-secondary-foreground">' +
        c.label + '<button data-clear-chip="' + c.key + '" aria-label="Remove filter ' + c.label + '" class="ml-0.5 rounded-full hover:bg-border focus:outline-none focus:ring-2 focus:ring-ring"><svg class="h-3 w-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M6 6l12 12M18 6 6 18"/></svg></button></span>';
    }).join("") + '<button id="clear-all-chips" class="text-xs font-medium text-primary hover:underline focus:outline-none focus:ring-2 focus:ring-ring rounded">Clear all</button>';
  }

  // ---------- Row rendering ----------
  function rowHtml(r) {
    var u = urgency(r);
    var selected = state.selected.has(r.id);
    var nextInspectionCell;
    if (!r.nextInspection) {
      nextInspectionCell = '<span class="text-muted-foreground" aria-hidden="true">—</span><span class="sr-only">Not set</span>';
    } else {
      nextInspectionCell = '<time datetime="' + r.nextInspection + '" class="tabular-nums">' + formatDate(r.nextInspection) + "</time>" +
        (u.label ? ' <span class="ml-1 inline-flex h-5 items-center rounded-full px-1.5 text-xs font-medium leading-5 ' + TONE_CLASSES[u.tone] + '">' + u.label + "</span>" : "");
    }
    return (
      '<tr class="h-10 border-b border-border last:border-0 hover:bg-muted ' + (selected ? "bg-accent" : "") + '" data-row-id="' + r.id + '">' +
      '<td class="px-3"><span class="relative inline-flex h-4 w-4 after:absolute after:-inset-2">' +
      '<input type="checkbox" class="row-checkbox h-4 w-4 rounded border-input text-primary focus:outline-none focus:ring-2 focus:ring-ring" data-id="' + r.id + '" aria-label="Select ' + r.name + '" ' + (selected ? "checked" : "") + "></span></td>" +
      '<td class="px-3 py-2.5 text-sm"><a href="#" class="font-medium text-primary hover:underline focus:outline-none focus:ring-2 focus:ring-ring rounded">' + r.name + '</a><div class="text-xs text-muted-foreground">' + r.id + "</div></td>" +
      '<td class="px-3 py-2.5 text-sm text-foreground">' + r.location + "</td>" +
      '<td class="px-3 py-2.5 text-sm">' + badge(r.status, STATUS_TONE[r.status]) + "</td>" +
      '<td class="px-3 py-2.5 text-sm tabular-nums text-foreground"><time datetime="' + r.lastService + '">' + formatDate(r.lastService) + "</time></td>" +
      '<td class="px-3 py-2.5 text-sm">' + nextInspectionCell + "</td>" +
      '<td class="px-3 text-right"><button type="button" class="row-menu-btn relative inline-flex h-8 w-8 items-center justify-center rounded hover:bg-border focus:outline-none focus:ring-2 focus:ring-ring" aria-label="Actions for ' + r.name + '" data-id="' + r.id + '">' +
      '<svg aria-hidden="true" class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg></button></td>' +
      "</tr>"
    );
  }

  function skeletonRows(n) {
    var cells = ['<td class="px-3"><div class="skeleton h-4 w-4 rounded bg-border"></div></td>'];
    [160, 180, 110, 90, 130].forEach(function (w) {
      cells.push('<td class="px-3 py-2.5"><div class="skeleton h-4 rounded bg-border" style="width:' + w + 'px"></div></td>');
    });
    cells.push('<td class="px-3"></td>');
    var row = '<tr class="h-10 border-b border-border last:border-0">' + cells.join("") + "</tr>";
    return new Array(n).fill(row).join("");
  }

  function emptyStateHtml(kind) {
    if (kind === "first-use") {
      return '<tr><td colspan="7" class="px-3 py-12 text-center">' +
        '<p class="text-sm font-medium text-foreground">No equipment yet</p>' +
        '<p class="mt-1 text-sm text-muted-foreground">Machines you register for maintenance tracking appear here.</p>' +
        '<button type="button" class="mt-3 inline-flex h-8 items-center rounded bg-primary px-3 text-sm font-medium text-primary-foreground hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-ring">Add equipment</button>' +
        "</td></tr>";
    }
    if (kind === "no-results") {
      return '<tr><td colspan="7" class="px-3 py-12 text-center">' +
        '<p class="text-sm font-medium text-foreground">No equipment matches these filters</p>' +
        '<button id="clear-filters-empty" type="button" class="mt-3 inline-flex h-8 items-center rounded border border-border bg-card px-3 text-sm font-medium text-foreground hover:bg-muted focus:outline-none focus:ring-2 focus:ring-ring">Clear filters</button>' +
        "</td></tr>";
    }
    if (kind === "error") {
      return '<tr><td colspan="7" class="px-3 py-12 text-center">' +
        '<p class="text-sm font-medium text-foreground">Couldn’t load equipment</p>' +
        '<p class="mt-1 text-sm text-muted-foreground">Check your connection and try again.</p>' +
        '<button id="retry-load" type="button" class="mt-3 inline-flex h-8 items-center rounded bg-primary px-3 text-sm font-medium text-primary-foreground hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-ring">Retry</button>' +
        "</td></tr>";
    }
    return "";
  }

  // ---------- Main render ----------
  function render() {
    renderTabs();
    renderChips();

    var table = document.getElementById("equipment-table");
    var tbody = document.getElementById("table-body");

    if (state.view === "loading") {
      table.setAttribute("aria-busy", "true");
      tbody.innerHTML = skeletonRows(8);
      document.getElementById("summary-line").textContent = "Loading equipment…";
      document.getElementById("pagination").classList.add("invisible");
      return;
    }
    document.getElementById("pagination").classList.remove("invisible");
    table.setAttribute("aria-busy", "false");

    if (state.view === "error") {
      tbody.innerHTML = emptyStateHtml("error");
      document.getElementById("summary-line").textContent = "";
      document.getElementById("page-range").textContent = "";
      document.getElementById("page-indicator").textContent = "";
      return;
    }

    if (state.view === "empty") {
      tbody.innerHTML = emptyStateHtml("first-use");
      document.getElementById("summary-line").textContent = "0 machines";
      document.getElementById("page-range").textContent = "0 of 0";
      document.getElementById("page-indicator").textContent = "Page 1 of 1";
      return;
    }

    var filtered = sortRows(filteredRows());
    var totalPages = Math.max(1, Math.ceil(filtered.length / state.pageSize));
    if (state.page > totalPages) state.page = totalPages;
    var page = pagedRows(filtered);

    if (filtered.length === 0) {
      tbody.innerHTML = emptyStateHtml("no-results");
    } else {
      tbody.innerHTML = page.map(rowHtml).join("");
    }

    var overdueCount = EQUIPMENT.filter(function (r) { return urgency(r).key === "overdue"; }).length;
    document.getElementById("summary-line").textContent =
      nf.format(filtered.length) + (filtered.length === 1 ? " machine" : " machines") +
      (state.statusTab === "all" && !state.location && !state.type && !state.urgencyFilter && !state.search
        ? " · " + nf.format(overdueCount) + " overdue inspection" + (overdueCount === 1 ? "" : "s")
        : "");

    var startIdx = filtered.length === 0 ? 0 : (state.page - 1) * state.pageSize + 1;
    var endIdx = Math.min(state.page * state.pageSize, filtered.length);
    document.getElementById("page-range").textContent = filtered.length === 0 ? "0 of 0" :
      nf.format(startIdx) + "–" + nf.format(endIdx) + " of " + nf.format(filtered.length);
    document.getElementById("page-indicator").textContent = "Page " + state.page + " of " + totalPages;
    document.getElementById("prev-page").disabled = state.page <= 1;
    document.getElementById("next-page").disabled = state.page >= totalPages;

    // selection UI
    var pageIds = page.map(function (r) { return r.id; });
    var selectedOnPage = pageIds.filter(function (id) { return state.selected.has(id); });
    var selectAll = document.getElementById("select-all");
    selectAll.checked = pageIds.length > 0 && selectedOnPage.length === pageIds.length;
    selectAll.indeterminate = selectedOnPage.length > 0 && selectedOnPage.length < pageIds.length;

    var bulkBar = document.getElementById("bulk-bar");
    var count = state.allMatchingSelected ? filtered.length : state.selected.size;
    if (count > 0) {
      bulkBar.hidden = false;
      document.getElementById("bulk-count").textContent = (state.allMatchingSelected ? "All " : "") + nf.format(count) + " selected";
      document.getElementById("selection-announce").textContent = nf.format(count) + " row" + (count === 1 ? "" : "s") + " selected";
      var selectAllBtn = document.getElementById("select-all-matching-btn");
      if (!state.allMatchingSelected && selectAll.checked && filtered.length > pageIds.length) {
        selectAllBtn.hidden = false;
        selectAllBtn.textContent = "Select all " + nf.format(filtered.length) + " matching";
      } else if (state.allMatchingSelected) {
        selectAllBtn.hidden = false;
        selectAllBtn.textContent = "Clear selection";
      } else {
        selectAllBtn.hidden = true;
      }
    } else {
      bulkBar.hidden = true;
    }
  }

  // ---------- Events ----------
  document.querySelector('[role="tablist"]').addEventListener("click", function (e) {
    var btn = e.target.closest("[data-tab]");
    if (!btn) return;
    state.statusTab = btn.getAttribute("data-tab");
    state.page = 1; state.selected.clear(); state.allMatchingSelected = false;
    render();
  });

  var searchInput = document.getElementById("search-input");
  var searchTimer;
  searchInput.addEventListener("input", function () {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function () {
      state.search = searchInput.value;
      state.page = 1; state.selected.clear(); state.allMatchingSelected = false;
      render();
    }, 150);
  });

  locationSelect.addEventListener("change", function () {
    state.location = locationSelect.value;
    state.page = 1; state.selected.clear(); state.allMatchingSelected = false;
    render();
  });

  var moreBtn = document.getElementById("more-filters-btn");
  var morePanel = document.getElementById("more-filters-panel");
  moreBtn.addEventListener("click", function () {
    var open = morePanel.hidden;
    morePanel.hidden = !open;
    moreBtn.setAttribute("aria-expanded", String(open));
  });
  document.getElementById("apply-more-filters").addEventListener("click", function () {
    state.type = typeSelect.value;
    state.urgencyFilter = document.getElementById("urgency-filter").value;
    state.page = 1; state.selected.clear(); state.allMatchingSelected = false;
    morePanel.hidden = true;
    moreBtn.setAttribute("aria-expanded", "false");
    render();
  });

  document.getElementById("chips-row").addEventListener("click", function (e) {
    var clearChip = e.target.closest("[data-clear-chip]");
    if (clearChip) {
      var key = clearChip.getAttribute("data-clear-chip");
      state[key] = "";
      if (key === "type") typeSelect.value = "";
      if (key === "urgencyFilter") document.getElementById("urgency-filter").value = "";
      state.page = 1; render();
      return;
    }
    if (e.target.id === "clear-all-chips") {
      state.location = ""; state.type = ""; state.urgencyFilter = "";
      locationSelect.value = ""; typeSelect.value = ""; document.getElementById("urgency-filter").value = "";
      state.page = 1; render();
    }
  });

  document.getElementById("equipment-table").addEventListener("click", function (e) {
    var clearBtn = e.target.closest("#clear-filters-empty");
    if (clearBtn) {
      state.search = ""; state.location = ""; state.type = ""; state.urgencyFilter = ""; state.statusTab = "all";
      searchInput.value = ""; locationSelect.value = ""; typeSelect.value = ""; document.getElementById("urgency-filter").value = "";
      state.page = 1; render();
      return;
    }
    var retryBtn = e.target.closest("#retry-load");
    if (retryBtn) {
      loadData();
      return;
    }
    var sortBtn = e.target.closest("[data-sort]");
    if (sortBtn) {
      var key = sortBtn.getAttribute("data-sort");
      if (state.sort.key === key) {
        state.sort.dir = state.sort.dir === "asc" ? "desc" : "asc";
      } else {
        state.sort = { key: key, dir: "asc" };
      }
      document.querySelectorAll("th[aria-sort]").forEach(function (th) { th.removeAttribute("aria-sort"); });
      sortBtn.closest("th").setAttribute("aria-sort", state.sort.dir === "asc" ? "ascending" : "descending");
      render();
      return;
    }
  });

  document.getElementById("table-body").addEventListener("change", function (e) {
    if (e.target.classList.contains("row-checkbox")) {
      var id = e.target.getAttribute("data-id");
      if (e.target.checked) state.selected.add(id);
      else { state.selected.delete(id); state.allMatchingSelected = false; }
      render();
    }
  });

  document.getElementById("select-all").addEventListener("change", function (e) {
    var filtered = sortRows(filteredRows());
    var page = pagedRows(filtered);
    if (e.target.checked) page.forEach(function (r) { state.selected.add(r.id); });
    else { page.forEach(function (r) { state.selected.delete(r.id); }); state.allMatchingSelected = false; }
    render();
  });

  document.getElementById("select-all-matching-btn").addEventListener("click", function () {
    if (state.allMatchingSelected) {
      state.allMatchingSelected = false;
      state.selected.clear();
    } else {
      state.allMatchingSelected = true;
    }
    render();
  });

  document.getElementById("bulk-cancel").addEventListener("click", function () {
    state.selected.clear();
    state.allMatchingSelected = false;
    render();
    document.getElementById("select-all").focus();
  });
  document.getElementById("bulk-mark-serviced").addEventListener("click", function () {
    state.selected.clear(); state.allMatchingSelected = false; render();
  });
  document.getElementById("bulk-export").addEventListener("click", function () {
    state.selected.clear(); state.allMatchingSelected = false; render();
  });

  // Row action menu
  var rowMenu = document.getElementById("row-menu");
  var activeMenuId = null;
  document.getElementById("table-body").addEventListener("click", function (e) {
    var btn = e.target.closest(".row-menu-btn");
    if (!btn) return;
    e.stopPropagation();
    var id = btn.getAttribute("data-id");
    if (activeMenuId === id && !rowMenu.hidden) { rowMenu.hidden = true; activeMenuId = null; return; }
    var rect = btn.getBoundingClientRect();
    rowMenu.style.top = (window.scrollY + rect.bottom + 4) + "px";
    rowMenu.style.left = (window.scrollX + rect.right - 208) + "px";
    rowMenu.hidden = false;
    activeMenuId = id;
  });
  document.addEventListener("click", function (e) {
    if (!rowMenu.hidden && !rowMenu.contains(e.target) && !e.target.closest(".row-menu-btn")) {
      rowMenu.hidden = true; activeMenuId = null;
    }
  });
  rowMenu.addEventListener("click", function (e) {
    var actionBtn = e.target.closest("[data-action]");
    if (!actionBtn) return;
    rowMenu.hidden = true; activeMenuId = null;
  });

  document.getElementById("page-size").addEventListener("change", function (e) {
    state.pageSize = parseInt(e.target.value, 10);
    state.page = 1;
    render();
  });
  document.getElementById("prev-page").addEventListener("click", function () {
    if (state.page > 1) { state.page -= 1; render(); }
  });
  document.getElementById("next-page").addEventListener("click", function () {
    var filtered = filteredRows();
    var totalPages = Math.max(1, Math.ceil(filtered.length / state.pageSize));
    if (state.page < totalPages) { state.page += 1; render(); }
  });

  // ---------- Load / state simulation ----------
  function loadData() {
    state.view = "loading";
    render();
    if (forcedState === "error") {
      setTimeout(function () { state.view = "error"; render(); }, 400);
    } else if (forcedState === "empty") {
      setTimeout(function () { state.view = "empty"; render(); }, 400);
    } else if (forcedState === "loading") {
      // stays on skeleton indefinitely
    } else {
      setTimeout(function () { state.view = "ready"; render(); }, 500);
    }
  }

  loadData();
})();
</script>
