<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Warehouse Operations Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
<div class="flex min-h-screen">
  <aside class="hidden lg:flex w-56 flex-col bg-slate-900 text-slate-300 p-4 gap-1 shrink-0">
    <div class="text-white font-semibold text-lg mb-6 px-2">StockFlow <span class="text-slate-500 text-xs block font-normal">WMS Console</span></div>
    <a class="px-3 py-2 rounded bg-slate-800 text-white text-sm" href="#">Operations</a>
    <a class="px-3 py-2 rounded hover:bg-slate-800 text-sm" href="#">Inbound</a>
    <a class="px-3 py-2 rounded hover:bg-slate-800 text-sm" href="#">Outbound</a>
    <a class="px-3 py-2 rounded hover:bg-slate-800 text-sm" href="#">Inventory</a>
    <a class="px-3 py-2 rounded hover:bg-slate-800 text-sm" href="#">Labor</a>
    <a class="px-3 py-2 rounded hover:bg-slate-800 text-sm" href="#">Reports</a>
  </aside>

  <main class="flex-1 min-w-0 p-4 sm:p-6 lg:p-8 space-y-6">
    <header class="flex flex-wrap items-center justify-between gap-3">
      <div>
        <h1 class="text-2xl font-semibold">Operations overview</h1>
        <p class="text-sm text-slate-500">Memphis DC-2 &middot; Wednesday, Nov 4, 2026 &middot; <span id="clock"></span></p>
      </div>
      <div class="flex items-center gap-2">
        <select id="site" class="border border-slate-300 rounded-md text-sm px-2 py-1.5 bg-white">
          <option>Memphis DC-2</option><option>Reno DC-1</option><option>Columbus DC-3</option>
        </select>
        <div class="inline-flex rounded-md border border-slate-300 bg-white overflow-hidden text-sm" id="range">
          <button data-r="7" class="px-3 py-1.5 bg-slate-800 text-white">7d</button>
          <button data-r="14" class="px-3 py-1.5">14d</button>
        </div>
      </div>
    </header>

    <section id="kpis" class="grid grid-cols-2 xl:grid-cols-4 gap-4"></section>

    <section class="grid grid-cols-1 xl:grid-cols-3 gap-4">
      <div class="xl:col-span-2 bg-white rounded-lg border border-slate-200 p-4">
        <div class="flex items-center justify-between mb-2">
          <h2 class="font-semibold">Orders shipped vs. received</h2>
          <div class="flex gap-4 text-xs text-slate-500">
            <span class="flex items-center gap-1"><i class="w-3 h-0.5 bg-blue-600 inline-block"></i>Shipped</span>
            <span class="flex items-center gap-1"><i class="w-3 h-0.5 bg-amber-500 inline-block"></i>Received</span>
          </div>
        </div>
        <div class="relative"><svg id="trend" class="w-full h-64" role="img" aria-label="Line chart of units shipped and received per day"></svg>
        <div id="tip" class="hidden absolute pointer-events-none bg-slate-900 text-white text-xs rounded px-2 py-1"></div></div>
      </div>

      <div class="bg-white rounded-lg border border-slate-200 p-4">
        <h2 class="font-semibold mb-3">Zone utilization</h2>
        <div id="zones" class="space-y-3"></div>
      </div>
    </section>

    <section class="grid grid-cols-1 xl:grid-cols-3 gap-4">
      <div class="xl:col-span-2 bg-white rounded-lg border border-slate-200">
        <div class="flex flex-wrap items-center justify-between gap-2 p-4 pb-2">
          <h2 class="font-semibold">Needs attention <span id="alertCount" class="ml-1 text-xs bg-red-100 text-red-700 rounded-full px-2 py-0.5"></span></h2>
          <div class="flex gap-1 text-xs" id="filters">
            <button data-f="all" class="px-2.5 py-1 rounded-full bg-slate-800 text-white">All</button>
            <button data-f="critical" class="px-2.5 py-1 rounded-full bg-slate-100">Critical</button>
            <button data-f="warning" class="px-2.5 py-1 rounded-full bg-slate-100">Warning</button>
          </div>
        </div>
        <ul id="alerts" class="divide-y divide-slate-100"></ul>
      </div>

      <div class="bg-white rounded-lg border border-slate-200 p-4">
        <h2 class="font-semibold mb-3">Dock schedule</h2>
        <table class="w-full text-sm">
          <thead class="text-left text-xs text-slate-500"><tr><th class="py-1 font-medium">Door</th><th class="font-medium">Carrier</th><th class="font-medium">ETA</th><th class="font-medium text-right">Status</th></tr></thead>
          <tbody id="docks" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>
    </section>
  </main>
</div>

<script>
const days14 = [];
const base = new Date(2026, 10, 4);
for (let i = 13; i >= 0; i--) { const d = new Date(base); d.setDate(d.getDate() - i); days14.push(d); }
const shipped = [11840,12310,9120,4210,12980,13450,13120,12760,13890,9410,4480,13210,14020,13640];
const received = [9650,10120,8830,3890,10440,11780,12950,9870,10560,8120,3510,11230,12480,10980];

const kpis = [
  {label:'Orders shipped today', value:'13,640', sub:'of 15,200 planned', delta:'+3.2%', good:true, spark:shipped.slice(-7)},
  {label:'Units received', value:'10,980', sub:'41 of 52 ASNs closed', delta:'-8.1%', good:false, spark:received.slice(-7)},
  {label:'On-time ship rate', value:'96.4%', sub:'target 98.0%', delta:'-1.1 pt', good:false, spark:[97.8,97.5,98.1,97.2,96.9,97.0,96.4]},
  {label:'Inventory accuracy', value:'99.2%', sub:'last cycle count', delta:'+0.2 pt', good:true, spark:[98.8,98.9,99.0,98.9,99.1,99.0,99.2]},
  {label:'Open pick backlog', value:'1,560', sub:'lines, ~2.4 h of work', delta:'+212', good:false, spark:[900,1100,1020,1240,1180,1348,1560]},
  {label:'Dock-to-stock time', value:'3.8 h', sub:'target 4.0 h', delta:'-0.4 h', good:true, spark:[4.6,4.4,4.5,4.2,4.1,4.2,3.8]},
  {label:'Labor productivity', value:'142 UPH', sub:'118 associates on shift', delta:'+4', good:true, spark:[134,137,136,139,138,140,142]},
  {label:'Warehouse capacity', value:'87%', sub:'pallet positions used', delta:'+1 pt', good:false, spark:[82,83,84,85,85,86,87]},
];

function spark(d, color){
  const w=96,h=28,mn=Math.min(...d),mx=Math.max(...d),r=(mx-mn)||1;
  const pts=d.map((v,i)=>`${(i/(d.length-1)*w).toFixed(1)},${(h-2-((v-mn)/r)*(h-4)).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" class="w-24 h-7" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round"/></svg>`;
}
document.getElementById('kpis').innerHTML = kpis.map(k=>`
  <div class="bg-white rounded-lg border border-slate-200 p-4">
    <div class="text-xs text-slate-500">${k.label}</div>
    <div class="text-2xl font-semibold mt-1 tabular-nums">${k.value}</div>
    <div class="flex items-end justify-between mt-2">
      <div>
        <div class="text-xs font-medium ${k.good?'text-emerald-700':'text-red-700'}">${k.good?'&#9650;':'&#9660;'} ${k.delta} <span class="text-slate-400 font-normal">vs. yesterday</span></div>
        <div class="text-xs text-slate-500 mt-0.5">${k.sub}</div>
      </div>
      ${spark(k.spark, k.good?'#059669':'#dc2626')}
    </div>
  </div>`).join('');

// Trend chart
let range = 7;
function drawTrend(){
  const svg = document.getElementById('trend');
  const W = svg.clientWidth || 700, H = 256, m = {l:44,r:12,t:10,b:26};
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const s = shipped.slice(-range), r = received.slice(-range), ds = days14.slice(-range);
  const max = 16000, iw = W-m.l-m.r, ih = H-m.t-m.b;
  const x = i => m.l + (i/(s.length-1))*iw, y = v => m.t + ih - (v/max)*ih;
  let out = '';
  for (let t=0;t<=16000;t+=4000){ out += `<line x1="${m.l}" x2="${W-m.r}" y1="${y(t)}" y2="${y(t)}" stroke="#e2e8f0"/><text x="${m.l-6}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="#64748b">${t/1000}k</text>`; }
  ds.forEach((d,i)=>{ if(range===7 || i%2===0) out += `<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="#64748b">${d.getMonth()+1}/${d.getDate()}</text>`; });
  const line = (a,c)=>`<polyline fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round" points="${a.map((v,i)=>x(i)+','+y(v)).join(' ')}"/>`;
  out += line(r,'#f59e0b') + line(s,'#2563eb');
  s.forEach((v,i)=>{ out += `<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="#2563eb"/><circle cx="${x(i)}" cy="${y(r[i])}" r="3" fill="#f59e0b"/>`; });
  out += `<rect id="hit" x="${m.l}" y="0" width="${iw}" height="${H}" fill="transparent"/>`;
  svg.innerHTML = out;
  const tip = document.getElementById('tip');
  svg.querySelector('#hit').onmousemove = e => {
    const rc = svg.getBoundingClientRect();
    const px = (e.clientX-rc.left)*(W/rc.width);
    const i = Math.max(0,Math.min(s.length-1,Math.round((px-m.l)/iw*(s.length-1))));
    tip.classList.remove('hidden');
    tip.innerHTML = `${ds[i].toDateString().slice(0,10)}<br>Shipped ${s[i].toLocaleString()}<br>Received ${r[i].toLocaleString()}`;
    tip.style.left = Math.min(rc.width-120, (x(i)*rc.width/W)+10)+'px'; tip.style.top = '20px';
  };
  svg.querySelector('#hit').onmouseleave = ()=>tip.classList.add('hidden');
}
document.querySelectorAll('#range button').forEach(b=>b.onclick=()=>{
  range=+b.dataset.r;
  document.querySelectorAll('#range button').forEach(x=>x.className='px-3 py-1.5'+(x===b?' bg-slate-800 text-white':''));
  drawTrend();
});
window.addEventListener('resize',drawTrend); drawTrend();

// Zones
const zones = [
  {n:'A - Fast pick',p:94},{n:'B - Bulk reserve',p:81},{n:'C - Cold storage',p:97},
  {n:'D - Returns',p:46},{n:'E - Hazmat cage',p:63},{n:'Staging / outbound',p:78}
];
document.getElementById('zones').innerHTML = zones.map(z=>{
  const c = z.p>=95?'bg-red-500':z.p>=85?'bg-amber-500':'bg-blue-600';
  return `<div><div class="flex justify-between text-sm"><span>${z.n}</span><span class="tabular-nums font-medium">${z.p}%${z.p>=95?' <span class="text-red-700 text-xs">full</span>':''}</span></div>
  <div class="h-2 bg-slate-100 rounded mt-1"><div class="h-2 rounded ${c}" style="width:${z.p}%"></div></div></div>`;
}).join('');

// Alerts
const alerts = [
  {s:'critical',t:'Cold storage at 97% - 2 inbound pallets of dairy cannot be put away',m:'Zone C · Door 7',a:'12 min ago',act:'Re-slot'},
  {s:'critical',t:'Carrier FedEx Freight missed cutoff for 18 orders (SO-48213 and 17 more)',m:'Outbound · Lane 4',a:'31 min ago',act:'Reassign'},
  {s:'critical',t:'Conveyor C-3 jam - sorter throughput down 40%',m:'Maintenance ticket MT-2291',a:'44 min ago',act:'View ticket'},
  {s:'warning',t:'Pick backlog above threshold: 1,560 lines (limit 1,400)',m:'Zone A · Wave 14',a:'1 h ago',act:'Release labor'},
  {s:'warning',t:'7 SKUs below reorder point (SKU 10442, 10871, 22015 and 4 more)',m:'Inventory',a:'2 h ago',act:'Create PO'},
  {s:'warning',t:'ASN 77120 from Delta Packaging is 3 h late',m:'Inbound · Door 2',a:'2 h ago',act:'Contact'},
  {s:'warning',t:'Cycle count variance of 14 units on bin A-12-04-B',m:'Inventory accuracy',a:'3 h ago',act:'Recount'},
  {s:'warning',t:'Overtime projected for night shift: +46 h',m:'Labor',a:'4 h ago',act:'Review'},
];
let filter='all';
function drawAlerts(){
  const list = alerts.filter(a=>filter==='all'||a.s===filter);
  document.getElementById('alertCount').textContent = alerts.filter(a=>a.s==='critical').length+' critical';
  document.getElementById('alerts').innerHTML = list.map(a=>`
    <li class="flex items-start gap-3 px-4 py-3">
      <span class="mt-0.5 text-xs font-medium rounded px-1.5 py-0.5 ${a.s==='critical'?'bg-red-100 text-red-800':'bg-amber-100 text-amber-800'}">${a.s==='critical'?'Critical':'Warning'}</span>
      <div class="flex-1 min-w-0"><div class="text-sm">${a.t}</div><div class="text-xs text-slate-500 mt-0.5">${a.m} &middot; ${a.a}</div></div>
      <button class="text-sm text-blue-700 hover:underline shrink-0">${a.act}</button>
    </li>`).join('');
}
document.querySelectorAll('#filters button').forEach(b=>b.onclick=()=>{
  filter=b.dataset.f;
  document.querySelectorAll('#filters button').forEach(x=>x.className='px-2.5 py-1 rounded-full '+(x===b?'bg-slate-800 text-white':'bg-slate-100'));
  drawAlerts();
});
drawAlerts();

// Docks
const docks = [
  ['D1','UPS Ground','14:00','Loading','bg-blue-100 text-blue-800'],
  ['D2','Delta Pkg.','11:30','Late','bg-red-100 text-red-800'],
  ['D3','XPO Logistics','14:45','Unloading','bg-blue-100 text-blue-800'],
  ['D5','Sysco','15:15','On time','bg-emerald-100 text-emerald-800'],
  ['D7','Kroger Dairy','15:40','Waiting','bg-amber-100 text-amber-800'],
  ['D8','FedEx Freight','16:30','On time','bg-emerald-100 text-emerald-800'],
];
document.getElementById('docks').innerHTML = docks.map(d=>`<tr><td class="py-2 font-medium">${d[0]}</td><td>${d[1]}</td><td class="tabular-nums">${d[2]}</td><td class="text-right"><span class="text-xs rounded px-1.5 py-0.5 ${d[4]}">${d[3]}</span></td></tr>`).join('');

function tick(){ document.getElementById('clock').textContent = 'updated '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}); }
tick(); setInterval(tick,30000);
</script>
</body>
</html>
