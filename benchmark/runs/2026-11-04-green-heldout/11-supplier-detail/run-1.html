/* ---------- toast, dialog, menu ---------- */
function toast(msg) {
  const t = document.createElement('div');
  t.className = 'flex items-start gap-3 rounded-md border border-slate-200 bg-white px-3 py-2 shadow-md';
  t.innerHTML = `<span class="flex-1 text-sm">${esc(msg)}</span><button class="${B_ICON} -mr-1 -mt-0.5 h-6 w-6" aria-label="Dismiss notification">${icon('x')}</button>`;
  $('#toasts').appendChild(t);
  let timer; const start = () => { timer = setTimeout(() => t.remove(), 5000); };
  start();
  t.addEventListener('mouseenter', () => clearTimeout(timer)); t.addEventListener('mouseleave', start);
  t.addEventListener('focusin', () => clearTimeout(timer)); t.addEventListener('focusout', start);
  t.querySelector('button').addEventListener('click', () => { clearTimeout(timer); t.remove(); });
}

const dlg = $('#dlg'); let dlgOk = null, lastFocus = null;
function openDialog(html, width = 'w-[28rem]') {
  lastFocus = document.activeElement;
  dlg.innerHTML = `<div class="${width} max-w-[92vw]">${html}</div>`;
  dlg.showModal();
}
dlg.addEventListener('close', () => {
  dlgOk = null;
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus(); else { const h = $('h1:not(.hidden)'); if (h) h.focus(); }
});
function confirmDlg({ title, body, ok, cancel = 'Cancel', danger = false, run }) {
  dlgOk = run;
  openDialog(`<div class="px-5 pt-5"><h2 id="dlg-title" class="text-base font-semibold">${title}</h2><p class="mt-2 text-sm text-slate-700">${body}</p></div>
  <div class="flex justify-end gap-2 px-5 py-4"><button autofocus class="${B_OUT}" data-act="dlg-cancel">${cancel}</button><button class="${danger ? B_DANGER : B_PRIMARY}" data-act="dlg-ok">${ok}</button></div>`);
}

/* ---------- Purchase orders ---------- */
function filteredPOs() {

  const r = S.pos.filter(p => (!status || p.status === status) && (!q || p.no.toLowerCase().includes(q.trim().toLowerCase())));
  const key = { no: 'no', date: 'date', amount: 'amount' }[sort.key], m = sort.dir === 'asc' ? 1 : -1;
  return r.sort((a, b) => (a[key] > b[key] ? 1 : a[key] < b[key] ? -1 : 0) * m);
}
function sortTH(label, key, right) {

}

/* ---------- Performance ---------- */
function chartSVG(idx) {
  const P = S.perf, W = 820, H = 280, L = 48, R = 130, T = 14, B = 36, n = idx.length;
  const x = i => L + (n === 1 ? 0 : i * (W - L - R) / (n - 1)), y = v => T + (100 - Math.max(80, v)) / 20 * (H - T - B);
  const on = idx.map(i => P.onTime[i]), q = idx.map(i => P.quality[i]);
  const line = (a, color, dash) => `<polyline fill="none" stroke="${color}" stroke-width="2" ${dash ? `stroke-dasharray="${dash}"` : ''} points="${a.map((v, i) => x(i) + ',' + y(v)).join(' ')}"/>${a.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="#fff" stroke="${color}" stroke-width="2"/>`).join('')}`;
  const grid = [80, 85, 90, 95, 100].map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="#e2e8f0"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" font-size="12" fill="#475569">${v}</text>`).join('');
  const xl = idx.map((i, k) => `<text x="${x(k)}" y="${H - 14}" text-anchor="middle" font-size="12" fill="#475569">${P.months[i]}</text>`).join('');
  const lo = n - 1;
  return `<svg viewBox="0 0 ${W} ${H}" class="w-full" role="img" aria-label="Line chart of on-time delivery and quality acceptance rate by month. Exact values are in the monthly scorecard below.">
  ${grid}<text transform="translate(12 ${(T + H - B) / 2}) rotate(-90)" text-anchor="middle" font-size="12" fill="#475569">Rate (%)</text>
  <line x1="${L}" x2="${W - R}" y1="${y(95)}" y2="${y(95)}" stroke="#64748b" stroke-dasharray="1 4" stroke-width="1.5"/><text x="${W - R + 8}" y="${y(95) + 4}" font-size="12" fill="#475569">Target 95%</text>
  ${xl}${line(q, '#475569', '6 4')}${line(on, '#1d4ed8')}
  <text x="${x(lo) + 8}" y="${y(q[lo]) + 4}" font-size="12" fill="#334155">Quality ${pct(q[lo])}</text>
  <text x="${x(lo) + 8}" y="${y(on[lo]) + 16}" font-size="12" font-weight="600" fill="#1d4ed8">On-time ${pct(on[lo])}</text></svg>`;
}
function panelPerformance() {
  const P = S.perf, last = a => mean(a.slice(-3)), prev = a => mean(a.slice(-6, -3));
  const dOn = last(P.onTime) - prev(P.onTime), dQ = last(P.quality) - prev(P.quality), dL = last(P.lead) - prev(P.lead), dS = (spend12() / P.prevSpend - 1) * 100;
  const good = 'text-green-700', bad = 'text-red-700', flat = 'text-slate-600';
  const tile = (l, v, d, tone) => `<div class="rounded-md border border-slate-200 p-4"><p class="text-xs font-medium text-slate-600">${l}</p><p class="mt-1 text-2xl font-semibold tabular-nums">${v}</p><p class="mt-1 text-xs ${tone}">${d}</p></div>`;
  const idx = P.months.map((_, i) => i).slice(-S.months);
  const rows = idx.slice().reverse().map(i => `<tr class="${TR}">${TDc(P.labels[i])}${TDc(P.deliveries[i], NUM)}${TDc(nf1.format(P.onTime[i]), NUM)}${TDc(nf1.format(P.quality[i]), NUM)}${TDc(nf1.format(P.lead[i]), NUM)}${TDc(nf.format(P.spend[i]), NUM)}</tr>`).join('');

    <div class="flex items-center gap-3"><span class="text-sm text-slate-600">Updated 04/11/2026 08:30</span><label class="sr-only" for="perf-range">Date range</label><select id="perf-range" data-ctl="perf-range" class="${INPUT} w-40"><option value="6" ${S.months === 6 ? 'selected' : ''}>Last 6 months</option><option value="12" ${S.months === 12 ? 'selected' : ''}>Last 12 months</option></select></div></div>
  <div class="grid grid-cols-2 gap-4 lg:grid-cols-4">
    ${tile('On-time delivery, last 3 months', pct(last(P.onTime)), `${signed(dOn)} pts vs previous 3 months`, dOn >= 0 ? good : bad)}
    ${tile('Quality acceptance, last 3 months', pct(last(P.quality)), `${signed(dQ)} pts vs previous 3 months`, dQ >= 0 ? good : bad)}
    ${tile('Average lead time, last 3 months', nf1.format(last(P.lead)) + ' days', `${signed(dL)} days vs previous 3 months`, dL <= 0 ? good : bad)}
    ${tile('Spend, last 12 months', vnd.format(spend12()), `${signed(dS)}% vs previous 12 months`, flat)}
  </div>
  <section class="mt-8" aria-labelledby="h-trend"><div class="mb-2 flex flex-wrap items-center justify-between gap-3"><h2 id="h-trend" class="text-base font-semibold">On-time delivery and quality acceptance by month</h2>
    <div class="flex items-center gap-4 text-xs text-slate-700"><span class="inline-flex items-center gap-1.5"><svg width="22" height="8" aria-hidden="true"><line x1="0" x2="22" y1="4" y2="4" stroke="#1d4ed8" stroke-width="2"/></svg>On-time delivery</span><span class="inline-flex items-center gap-1.5"><svg width="22" height="8" aria-hidden="true"><line x1="0" x2="22" y1="4" y2="4" stroke="#475569" stroke-width="2" stroke-dasharray="6 4"/></svg>Quality acceptance</span></div></div>
    <div class="rounded-md border border-slate-200 p-3">${chartSVG(idx)}</div></section>

/* ---------- generic forms ---------- */
function fieldHTML(sp, val, pair) {
  const id = 'f-' + sp.name, hint = sp.hint ? `<p id="hint-${sp.name}" class="mt-1 text-xs text-slate-600">${sp.hint}</p>` : '';
  const desc = `err-${sp.name}${sp.hint ? ' hint-' + sp.name : ''}`;
  let ctl;
  const common = `id="${id}" name="${sp.name}" ${sp.required ? 'aria-required="true"' : ''} aria-describedby="${desc}"`;
  if (sp.type === 'select') ctl = `<select ${common} class="${INPUT}">${sp.options.map(o => `<option ${o === val ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
  else if (sp.type === 'textarea') ctl = `<textarea ${common} rows="3" class="w-full rounded border border-slate-300 bg-white px-2 py-1.5 text-sm">${esc(val)}</textarea>`;
  else if (sp.type === 'file') ctl = `<input ${common} type="file" class="block w-full text-sm file:mr-3 file:h-8 file:cursor-pointer file:rounded file:border file:border-slate-300 file:bg-white file:px-3 file:text-sm file:font-medium">`;
  else ctl = `<input ${common} type="${sp.type === 'number' ? 'text' : sp.type || 'text'}" ${sp.type === 'number' ? 'inputmode="numeric"' : ''} value="${esc(val)}" ${sp.placeholder ? `placeholder="${esc(sp.placeholder)}"` : ''} class="${INPUT}">`;
  return `<div class="${pair ? '' : sp.w || 'max-w-sm'}"><label for="${id}" class="mb-1 block text-sm font-medium">${sp.label}${sp.required ? '<span class="text-red-700" aria-hidden="true"> *</span>' : ''}</label>${ctl}${hint}<p id="err-${sp.name}" class="mt-1 hidden text-xs text-red-700"></p></div>`;
}
function validateSpec(sp, val) {
  if (sp.type === 'file') return !val ? 'Choose a file to upload.' : '';
  val = String(val ?? '').trim();
  if (sp.required && !val) return `${sp.label} is required.`;
  if (!val) return '';
  if (sp.type === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val)) return 'Enter an email address like name@company.vn.';
  if (sp.pattern && !sp.pattern.test(val)) return sp.msg;
  if (sp.type === 'number' && (isNaN(+val.replace(/\./g, '')) || +val.replace(/\./g, '') < 0)) return `${sp.label} must be a number, 0 or more.`;
  return '';
}
function readVals(root, specs) {
  const v = {};
  specs.forEach(sp => { const el = $('#f-' + sp.name, root); v[sp.name] = sp.type === 'file' ? (el.files[0] ? { name: el.files[0].name, size: el.files[0].size } : null) : el.value; });
  return v;
}
function setErr(root, sp, msg) {
  const el = $('#f-' + sp.name, root), p = $('#err-' + sp.name, root); if (!el || !p) return;
  p.textContent = msg; p.classList.toggle('hidden', !msg);
  el.setAttribute('aria-invalid', msg ? 'true' : 'false');
  el.classList.toggle('border-red-600', !!msg); el.classList.toggle('border-slate-300', !msg);
}
function showSummary(root, errs) {
  const box = $('.err-summary', root); if (!box) return;
  if (errs.length >= 3) {
    box.innerHTML = `<p class="font-medium">${errs.length} fields need attention</p><ul class="mt-1 list-disc pl-5">${errs.map(e => `<li><a href="#f-${e.sp.name}" data-focus="f-${e.sp.name}" class="underline">${esc(e.sp.label)}</a>: ${esc(e.msg)}</li>`).join('')}</ul>`;
    box.classList.remove('hidden');
  } else { box.classList.add('hidden'); box.innerHTML = ''; }
}
function runValidation(root, specs) {
  const vals = readVals(root, specs), errs = [];
  specs.forEach(sp => { const m = validateSpec(sp, vals[sp.name]); setErr(root, sp, m); if (m) errs.push({ sp, msg: m }); });
  showSummary(root, errs);
  if (errs.length) $('#f-' + errs[0].sp.name, root).focus();
  return { vals, errs };
}
const SUMMARY = '<div class="err-summary mb-4 hidden rounded-md border border-red-300 bg-red-50 p-3 text-red-800" role="alert"></div>';
function setBusy(btn, on, label) { btn.disabled = on; btn.innerHTML = (on ? icon('loader', 'animate-spin') : '') + label; }

  const { kind, rec } = findAtt(ref), type = kind === 'cert' ? 'Certificate' : rec.type;
  openDialog(`<div class="border-b border-slate-200 px-5 py-3"><h2 id="dlg-title" class="break-words text-base font-semibold">${esc(rec.name)}</h2></div>
  <div class="space-y-3 px-5 py-4"><dl class="grid grid-cols-3 gap-3"><div><dt class="text-xs font-medium text-slate-600">Type</dt><dd>${esc(type)}</dd></div><div><dt class="text-xs font-medium text-slate-600">Size</dt><dd class="tabular-nums">${fmtSize(rec.size)}</dd></div><div><dt class="text-xs font-medium text-slate-600">${kind === 'cert' ? 'Issued' : 'Uploaded'}</dt><dd class="tabular-nums">${fmtD(kind === 'cert' ? rec.issued : rec.at)}</dd></div></dl>
  <div class="flex h-40 items-center justify-center rounded-md border border-dashed border-slate-300 bg-slate-50 px-4 text-center text-slate-700">A preview can't be shown here. Download the file to open it.</div></div>
  <div class="flex justify-end gap-2 border-t border-slate-200 px-5 py-3"><button autofocus class="${B_OUT}" data-act="dlg-cancel">Close</button><button class="${B_PRIMARY}" data-act="download" data-id="${ref}">${icon('download')}Download</button></div>`, 'w-[32rem]');
}
function poDialog(p) {
  const r = (l, v) => `<div><dt class="text-xs font-medium text-slate-600">${l}</dt><dd class="mt-0.5">${v}</dd></div>`;
  openDialog(`<div class="border-b border-slate-200 px-5 py-3"><h2 id="dlg-title" class="text-base font-semibold">${p.no}</h2></div>
  <dl class="grid grid-cols-2 gap-3 px-5 py-4">${r('Status', badge(p.status))}${r('Amount', vnd.format(p.amount))}${r('Order date', fmtD(p.date))}${r('Expected delivery', fmtD(p.expected))}${r('Items', p.items)}${r('Approval', esc(p.approval))}</dl>
  <div class="flex justify-end border-t border-slate-200 px-5 py-3"><button autofocus class="${B_OUT}" data-act="dlg-cancel">Close</button></div>`);
}
function cancelPO(p) {
  confirmDlg({
    title: `Cancel ${p.no}?`, body: `The ${vnd.format(p.amount)} order will be marked Cancelled and Việt Phát Steel will be notified by email. This can't be undone.`, ok: 'Cancel order', cancel: 'Keep order', danger: true,
    run: () => { p.status = 'Cancelled'; p.approval = '—'; logActivity('Cancelled purchase order ' + p.no, [{ field: 'Status', old: 'Open', nu: 'Cancelled' }]); renderAll(); toast(`Purchase order ${p.no} cancelled`); }
  });
}
function dupPO(p, silent) {
  const next = 'PO-2026-' + String(Math.max(...S.pos.map(x => +x.no.slice(-4))) + 1).padStart(4, '0');
  S.pos.unshift({ id: 'p' + Date.now(), no: next, date: nowISO().slice(0, 10), expected: p.expected, status: 'Draft', items: p.items, amount: p.amount, approval: 'Not submitted' });
  S.po.page = 1; logActivity('Created purchase order ' + next); renderAll(); toast(`Draft ${next} created${silent ? '' : ' from ' + p.no}`);
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target;
  const mi = t.closest('[data-mi]');
  if (mi) { const it = menuItems[+mi.dataset.mi]; if (it.disabled) return; closeMenu(); it.run(); return; }
  const trig = t.closest('[aria-haspopup="menu"]');
  if (menuBtn && trig === menuBtn) { closeMenu(true); return; }
  if (!t.closest('#menu')) closeMenu();

  const fa = t.closest('[data-focus]');
  if (fa) { e.preventDefault(); const el = $('#' + fa.dataset.focus); el && el.focus(); return; }
  const nav = t.closest('[data-nav]');
  if (nav) { e.preventDefault(); leaveGuard(() => toast('This prototype only includes the supplier detail page')); return; }
  const tab = t.closest('[role="tab"]');
  if (tab) { selectTab(tab.dataset.tab); return; }

  const el = t.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id, s = S.supplier;
  switch (act) {
    case 'toggle-sidebar': S.sidebarCollapsed = !S.sidebarCollapsed; renderNav(); break;
    case 'notif': toast('You have 3 unread notifications'); break;
    case 'acct': openMenu(el, [{ label: 'Profile', run: () => toast('Signed in as ' + USER) }, { label: 'Preferences', run: () => toast('Preferences are not part of this prototype') }, { label: 'Sign out', sep: true, run: () => toast('Signing out is disabled in this prototype') }]); break;
    case 'dlg-cancel': dlg.close(); break;
    case 'dlg-ok': { const f = dlgOk; dlgOk = null; dlg.close(); f && f(); break; }
    case 'retry': S.tabState[S.tab] = null; ensureLoaded(S.tab); break;
    case 'goto-tab':
      if (el.dataset.status) { S.po.status = el.dataset.status; S.po.q = ''; S.po.page = 1; }
      selectTab(el.dataset.tab, true); break;
    case 'edit': openEdit(); break;
    case 'cancel-edit': e.preventDefault(); leaveGuard(() => { S.dirty = false; closeEdit(); }); break;
    case 'rec-menu': openMenu(el, [
      { label: 'Export supplier profile (PDF)', run: () => toast('Supplier profile for ' + s.id + ' is being prepared') },
      s.status === 'Active'
        ? { label: 'Deactivate supplier', danger: true, sep: true, run: () => confirmDlg({ title: `Deactivate ${esc(s.legalName)}?`, body: `${S.pos.filter(p => OPEN_PO.includes(p.status)).length} open purchase orders worth ${vnd.format(S.pos.filter(p => OPEN_PO.includes(p.status)).reduce((a, p) => a + p.amount, 0))} stay open, but no new orders can be created until the supplier is reactivated.`, ok: 'Deactivate supplier', cancel: 'Keep active', danger: true, run: () => { s.status = 'Inactive'; logActivity('Deactivated the supplier', [{ field: 'Status', old: 'Active', nu: 'Inactive' }]); renderAll(); toast(`Supplier ${s.id} deactivated`); } }) }
        : { label: 'Reactivate supplier', sep: true, run: () => { s.status = 'Active'; logActivity('Reactivated the supplier', [{ field: 'Status', old: 'Inactive', nu: 'Active' }]); renderAll(); toast(`Supplier ${s.id} reactivated`); } }
    ]); break;
    /* contacts */
    case 'c-add': contactForm(); break;
    case 'c-edit': contactForm(S.contacts.find(c => c.id === id)); break;
    case 'c-clear': S.cq = ''; renderPanel(); $('#c-q') && $('#c-q').focus(); break;
    case 'c-menu': { const c = S.contacts.find(x => x.id === id); openMenu(el, [
      { label: 'Set as primary contact', disabled: c.primary, reason: c.primary ? 'Already the primary contact' : '', run: () => { const old = S.contacts.find(x => x.primary); S.contacts.forEach(x => x.primary = false); c.primary = true; logActivity('Changed the primary contact', [{ field: 'Primary contact', old: old ? old.name : '—', nu: c.name }]); renderAll(); toast(`${c.name} is now the primary contact`); } },
      { label: 'Delete contact', danger: true, sep: true, run: () => confirmDlg({ title: `Delete contact ${esc(c.name)}?`, body: c.primary ? `${esc(c.name)} is the primary contact. Order emails will have no recipient until you set another primary contact.` : `${esc(c.name)} will no longer receive purchase order emails for this supplier.`, ok: 'Delete contact', cancel: 'Keep contact', danger: true, run: () => { S.contacts = S.contacts.filter(x => x !== c); logActivity('Deleted contact ' + c.name); renderAll(); toast(`Contact ${c.name} deleted`); } }) }
    ]); break; }
    /* purchase orders */
    case 'po-new': { const base = S.pos[0]; dupPO({ no: '', expected: '2026-12-02', items: 0, amount: 0 }, true); break; }
    case 'po-open': poDialog(S.pos.find(p => p.id === id)); break;
    case 'po-dup': { const p = S.pos.find(x => x.id === id); dupPO(p); break; }
    case 'po-menu': { const p = S.pos.find(x => x.id === id), can = ['Draft', 'Pending approval', 'Approved'].includes(p.status);
      openMenu(el, [{ label: 'Print purchase order', run: () => toast(p.no + ' sent to the printer') }, { label: 'Cancel order', danger: true, sep: true, disabled: !can, reason: can ? '' : p.status === 'Cancelled' ? 'Already cancelled' : 'Shipment already started or completed', run: () => cancelPO(p) }]); break; }
    case 'po-sort': { const so = S.po.sort; so.dir = so.key === id ? (so.dir === 'asc' ? 'desc' : 'asc') : (id === 'no' ? 'asc' : 'desc'); so.key = id; S.po.page = 1; renderPanel(); $(`[data-act="po-sort"][data-id="${id}"]`).focus(); break; }
    case 'po-clear-status': S.po.status = ''; S.po.page = 1; renderPanel(); break;
    case 'po-clear-q': S.po.q = ''; S.po.page = 1; renderPanel(); break;
    case 'po-clear-all': S.po.q = ''; S.po.status = ''; S.po.page = 1; renderPanel(); break;
    case 'po-prev': S.po.page--; renderPanel(); break;
    case 'po-next': S.po.page++; renderPanel(); break;
    /* documents */
    case 'cert-add': certForm(); break;
    case 'doc-add': docForm(); break;
    case 'preview': previewAtt(id); break;
    case 'download': { const { rec } = findAtt(id); toast(`Downloading ${rec.name} (${fmtSize(rec.size)})`); break; }
    case 'cert-menu': { const c = S.certs.find(x => x.id === id), st = certStatus(c); openMenu(el, [
      { label: 'Edit details', run: () => certForm(c) },
      { label: 'Request renewal', disabled: st === 'Valid', reason: st === 'Valid' ? 'Only for expiring or expired certificates' : '', run: () => { logActivity('Requested renewal of ' + c.name); toast('Renewal request emailed to ' + (S.contacts.find(x => x.primary) || { name: 'the supplier' }).name); renderPanel(); } },
      { label: 'Delete certificate', danger: true, sep: true, run: () => confirmDlg({ title: `Delete certificate ${esc(c.name)}?`, body: `Purchasing will stop tracking its expiry${c.expires ? ' (' + fmtD(c.expires) + ')' : ''} and the file ${fmtSize(c.size)} is removed from this supplier.`, ok: 'Delete certificate', cancel: 'Keep certificate', danger: true, run: () => { S.certs = S.certs.filter(x => x !== c); logActivity('Deleted certificate ' + c.name); renderAll(); toast(`Certificate ${c.name} deleted`); } }) }
    ]); break; }
    case 'doc-menu': { const d = S.docs.find(x => x.id === id); openMenu(el, [
      { label: 'Delete document', danger: true, run: () => confirmDlg({ title: `Delete document ${esc(d.name)}?`, body: `The file (${fmtSize(d.size)}) uploaded by ${esc(d.by)} on ${fmtD(d.at)} is removed from this supplier.`, ok: 'Delete document', cancel: 'Keep document', danger: true, run: () => { S.docs = S.docs.filter(x => x !== d); logActivity('Deleted document ' + d.name); renderAll(); toast(`Document ${d.name} deleted`); } }) }
    ]); break; }
  }
});

document.addEventListener('input', e => {
  const c = e.target.dataset.ctl; if (!c) return;
  const keep = () => { const id = e.target.id, pos = e.target.selectionStart; renderPanel(); const n = $('#' + id); n.focus(); try { n.setSelectionRange(pos, pos); } catch (_) {} };
  if (c === 'c-q') { S.cq = e.target.value; keep(); }
  if (c === 'po-q') { S.po.q = e.target.value; S.po.page = 1; keep(); }
});
document.addEventListener('change', e => {
  const c = e.target.dataset.ctl; if (!c) return;
  const id = e.target.id;
  if (c === 'po-status') { S.po.status = e.target.value; S.po.page = 1; }
  if (c === 'po-size') { S.po.size = +e.target.value; S.po.page = 1; }
  if (c === 'perf-range') S.months = +e.target.value;
  if (c.startsWith('po-') || c === 'perf-range') { renderPanel(); $('#' + id).focus(); }
});
document.addEventListener('keydown', e => {
  const m = $('#menu');
  if (!m.classList.contains('hidden')) {
    const items = $$('[data-mi]:not([aria-disabled])', m), i = items.indexOf(document.activeElement);
    if (e.key === 'Escape') { e.preventDefault(); closeMenu(true); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); items[(i + 1) % items.length].focus(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
    else if (e.key === 'Tab') closeMenu();
    return;
  }
  const tab = e.target.closest && e.target.closest('[role="tab"]');
  if (tab && ['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) {
    e.preventDefault(); const ks = TABS.map(x => x[0]); let i = ks.indexOf(tab.dataset.tab);
    i = e.key === 'Home' ? 0 : e.key === 'End' ? ks.length - 1 : (i + (e.key === 'ArrowRight' ? 1 : -1) + ks.length) % ks.length;
    selectTab(ks[i], true);
  }
});
addEventListener('resize', () => closeMenu());

/* ---------- init ---------- */
if (innerWidth < 1024) S.sidebarCollapsed = true;
const hashTab = (location.hash.match(/tab=(\w+)/) || [])[1];
if (hashTab && TABS.some(t => t[0] === hashTab)) S.tab = hashTab;
renderNav(); renderHeader(); renderTabs(); ensureLoaded(S.tab);
</script>
</body>
</html>
