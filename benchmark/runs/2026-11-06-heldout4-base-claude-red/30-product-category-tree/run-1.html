<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Categories · Back Office</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html, body { height: 100%; }
  .tree-row { position: relative; }
  .tree-row.selected > .row-content { background-color: #eef2ff; border-color: #c7d2fe; }
  .row-content:hover { background-color: #f8fafc; }
  .scrollbar-thin::-webkit-scrollbar { width: 8px; height: 8px; }
  .scrollbar-thin::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 9999px; }
  .scrollbar-thin::-webkit-scrollbar-track { background-color: transparent; }
  .fade-in { animation: fadeIn .15s ease-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(2px); } to { opacity: 1; transform: translateY(0); } }
  .tab-btn.active { color: #4338ca; border-color: #4338ca; }
</style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">

<div class="min-h-screen flex flex-col">

  <!-- Top Bar -->
  <header class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between shrink-0">
    <div>
      <div class="flex items-center gap-2 text-xs text-slate-400 mb-1">
        <span>Catalog</span>
        <span>/</span>
        <span class="text-slate-600 font-medium">Categories</span>
      </div>
      <h1 class="text-xl font-semibold text-slate-900">Product Categories</h1>
    </div>
    <div class="flex items-center gap-4">
      <div class="hidden sm:flex items-center gap-4 text-sm border border-slate-200 rounded-lg px-4 py-2 bg-slate-50">
        <div>
          <div class="text-slate-400 text-xs">Categories</div>
          <div id="statCatCount" class="font-semibold text-slate-800">—</div>
        </div>
        <div class="w-px h-8 bg-slate-200"></div>
        <div>
          <div class="text-slate-400 text-xs">Total products</div>
          <div id="statProdCount" class="font-semibold text-slate-800">—</div>
        </div>
      </div>
      <button id="addRootBtn" class="inline-flex items-center gap-1.5 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-3.5 py-2 rounded-lg shadow-sm transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add Category
      </button>
    </div>
  </header>

  <!-- Main -->
  <main class="flex-1 grid grid-cols-1 lg:grid-cols-[380px_1fr] gap-4 p-4 min-h-0">

    <!-- Tree Panel -->
    <section class="bg-white border border-slate-200 rounded-xl flex flex-col min-h-0">
      <div class="p-3 border-b border-slate-100">
        <div class="relative">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 absolute left-3 top-2.5 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input id="treeSearch" type="text" placeholder="Search categories…" class="w-full pl-9 pr-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-200 focus:border-indigo-400">
        </div>
      </div>
      <div id="treeContainer" class="flex-1 overflow-y-auto scrollbar-thin p-2"></div>
    </section>

    <!-- Details Panel -->
    <section id="detailsPanel" class="bg-white border border-slate-200 rounded-xl overflow-y-auto scrollbar-thin min-h-0"></section>

  </main>
</div>

<script>
(function () {
  "use strict";

  /* ---------------------------------------------------------------- */
  /* Mock data                                                         */
  /* ---------------------------------------------------------------- */
  let nextId = 100;

  const today = "2026-11-07";

  function cat(opts) {
    return Object.assign({
      slug: opts.name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, ""),
      description: "",
      status: "active",
      directCount: 0,
      createdAt: "2023-01-10",
      updatedAt: today,
      seoTitle: "",
      seoDescription: "",
      children: []
    }, opts);
  }

  const categoryData = [
    cat({
      id: 1, name: "Electronics",
      description: "Consumer electronics including computers, phones, audio gear and cameras.",
      seoTitle: "Electronics – Shop Computers, Phones & More",
      seoDescription: "Browse our full range of electronics: laptops, smartphones, headphones, cameras and accessories.",
      children: [
        cat({ id: 2, name: "Computers", description: "Laptops, desktops and computer accessories.", children: [
          cat({ id: 20, name: "Laptops", description: "Ultrabooks, gaming laptops and 2-in-1 convertibles.", directCount: 200 }),
          cat({ id: 21, name: "Desktops", description: "Tower PCs, all-in-ones and mini PCs.", directCount: 150 }),
          cat({ id: 22, name: "Accessories", description: "Keyboards, mice, docking stations and monitor arms.", directCount: 100 }),
        ]}),
        cat({ id: 3, name: "Mobile Phones", description: "Smartphones and mobile accessories.", children: [
          cat({ id: 30, name: "Smartphones", description: "Latest Android and iOS devices.", directCount: 250 }),
          cat({ id: 31, name: "Cases & Covers", description: "Protective cases, covers and screen protectors.", directCount: 50 }),
        ]}),
        cat({ id: 4, name: "Audio", description: "Headphones, earbuds and home audio equipment.", children: [
          cat({ id: 40, name: "Headphones", description: "Over-ear, on-ear and noise-cancelling headphones.", directCount: 90 }),
          cat({ id: 41, name: "Speakers", description: "Bluetooth, smart and home theatre speakers.", directCount: 60 }),
        ]}),
        cat({ id: 5, name: "Cameras", description: "Mirrorless, DSLR and action cameras plus lenses.", directCount: 300 }),
      ]
    }),
    cat({
      id: 6, name: "Clothing",
      description: "Apparel for men, women and kids across all seasons.",
      seoTitle: "Clothing – Men's, Women's & Kids' Apparel",
      seoDescription: "Shop the latest clothing collections for men, women and kids, from everyday essentials to outerwear.",
      children: [
        cat({ id: 60, name: "Men", description: "Men's clothing and outerwear.", children: [
          cat({ id: 600, name: "Shirts", directCount: 150 }),
          cat({ id: 601, name: "Pants", directCount: 120 }),
          cat({ id: 602, name: "Outerwear", directCount: 130 }),
        ]}),
        cat({ id: 61, name: "Women", description: "Women's clothing and outerwear.", children: [
          cat({ id: 610, name: "Dresses", directCount: 200 }),
          cat({ id: 611, name: "Tops", directCount: 150 }),
          cat({ id: 612, name: "Outerwear", directCount: 150 }),
        ]}),
        cat({ id: 62, name: "Kids", description: "Clothing for children of all ages.", directCount: 80, status: "inactive" }),
      ]
    }),
    cat({
      id: 7, name: "Home & Garden",
      description: "Furniture, kitchenware, decor and outdoor essentials.",
      seoTitle: "Home & Garden – Furniture, Kitchen & Decor",
      seoDescription: "Everything for the home: furniture, kitchen tools, decor pieces and garden equipment.",
      children: [
        cat({ id: 70, name: "Furniture", description: "Sofas, tables, beds and storage.", directCount: 200 }),
        cat({ id: 71, name: "Kitchen", description: "Cookware, appliances and kitchen tools.", directCount: 180 }),
        cat({ id: 72, name: "Decor", description: "Rugs, wall art, lighting and decorative accents.", directCount: 120 }),
        cat({ id: 73, name: "Garden Tools", description: "Tools and equipment for outdoor maintenance.", directCount: 60 }),
      ]
    }),
    cat({
      id: 8, name: "Sports & Outdoors",
      description: "Equipment and gear for fitness, camping and cycling.",
      seoTitle: "Sports & Outdoors – Fitness, Camping & Cycling Gear",
      seoDescription: "Shop fitness equipment, camping gear and cycling accessories for every outdoor activity.",
      children: [
        cat({ id: 80, name: "Fitness Equipment", description: "Weights, cardio machines and yoga gear.", directCount: 120 }),
        cat({ id: 81, name: "Camping", description: "Tents, sleeping bags and camp cooking equipment.", directCount: 90 }),
        cat({ id: 82, name: "Cycling", description: "Bikes, helmets and cycling accessories.", directCount: 130 }),
      ]
    }),
    cat({
      id: 9, name: "Books",
      description: "Fiction and non-fiction titles across all genres.",
      seoTitle: "Books – Fiction & Non-Fiction",
      seoDescription: "Discover fiction and non-fiction books across every genre.",
      children: [
        cat({ id: 90, name: "Fiction", description: "Novels, short stories and graphic fiction.", directCount: 120 }),
        cat({ id: 91, name: "Non-Fiction", description: "Biographies, history, science and self-help.", directCount: 90 }),
      ]
    }),
  ];

  /* ---------------------------------------------------------------- */
  /* State                                                              */
  /* ---------------------------------------------------------------- */
  let selectedId = 20;
  let activeTab = "overview";
  let searchTerm = "";
  const expanded = new Set([1, 2, 6, 60]);

  /* ---------------------------------------------------------------- */
  /* Helpers                                                            */
  /* ---------------------------------------------------------------- */
  function allNodes(list = categoryData, acc = []) {
    for (const n of list) { acc.push(n); allNodes(n.children, acc); }
    return acc;
  }

  function findNode(id, list = categoryData) {
    for (const n of list) {
      if (n.id === id) return n;
      const found = findNode(id, n.children);
      if (found) return found;
    }
    return null;
  }

  function findParent(id, list = categoryData, parent = null) {
    for (const n of list) {
      if (n.id === id) return parent;
      const found = findParent(id, n.children, n);
      if (found !== undefined && found !== null) return found;
      if (n.children.some(c => c.id === id)) return n;
    }
    return null;
  }

  function getPath(id, list = categoryData, trail = []) {
    for (const n of list) {
      const t = [...trail, n];
      if (n.id === id) return t;
      const found = getPath(id, n.children, t);
      if (found) return found;
    }
    return null;
  }

  function totalCount(node) {
    return node.directCount + node.children.reduce((s, c) => s + totalCount(c), 0);
  }

  function countAllDescendants(node) {
    return node.children.reduce((s, c) => s + 1 + countAllDescendants(c), 0);
  }

  function matchesSearch(node) {
    if (!searchTerm) return true;
    if (node.name.toLowerCase().includes(searchTerm)) return true;
    return node.children.some(matchesSearch);
  }

  function fmt(n) { return n.toLocaleString("en-US"); }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function slugify(str) {
    return str.toLowerCase().trim().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
  }

  /* ---------------------------------------------------------------- */
  /* Icons                                                              */
  /* ---------------------------------------------------------------- */
  const ICON = {
    chevron: `<svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>`,
    folder: `<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>`,
    tag: `<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41 11 3.83A2 2 0 0 0 9.59 3.24L3 3v6.59a2 2 0 0 0 .59 1.41l9.58 9.58a2 2 0 0 0 2.82 0l4.6-4.6a2 2 0 0 0 0-2.58z"/><circle cx="7.5" cy="7.5" r="1.25" fill="currentColor" stroke="none"/></svg>`,
    pencil: `<svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 1 1 3 3L7 19l-4 1 1-4Z"/></svg>`,
    trash: `<svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>`,
    plus: `<svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`,
    power: `<svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg>`,
  };

  function statusBadge(status) {
    if (status === "active") {
      return `<span class="inline-flex items-center gap-1 text-xs font-medium px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200"><span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>Active</span>`;
    }
    return `<span class="inline-flex items-center gap-1 text-xs font-medium px-2 py-0.5 rounded-full bg-slate-100 text-slate-500 border border-slate-200"><span class="w-1.5 h-1.5 rounded-full bg-slate-400"></span>Inactive</span>`;
  }

  /* ---------------------------------------------------------------- */
  /* Tree rendering                                                     */
  /* ---------------------------------------------------------------- */
  const treeContainer = document.getElementById("treeContainer");

  function renderTree() {
    treeContainer.innerHTML = categoryData.filter(matchesSearch).map(n => renderNode(n, 0)).join("")
      || `<div class="text-sm text-slate-400 text-center py-8">No categories match your search.</div>`;
  }

  function renderNode(node, depth) {
    const hasChildren = node.children.length > 0;
    const isExpanded = expanded.has(node.id);
    const isSelected = node.id === selectedId;
    const visibleChildren = node.children.filter(matchesSearch);
    const total = totalCount(node);

    const rowHtml = `
      <div class="tree-row ${isSelected ? "selected" : ""}" data-id="${node.id}">
        <div class="row-content flex items-center gap-1.5 pl-${Math.min(depth * 3 + 2, 14)} pr-2 py-1.5 rounded-lg border border-transparent cursor-pointer select-none" style="padding-left:${depth * 18 + 8}px">
          <button class="chevron-btn shrink-0 w-5 h-5 flex items-center justify-center rounded text-slate-400 hover:text-slate-600 hover:bg-slate-100 ${hasChildren ? "" : "invisible"}" data-id="${node.id}">
            <span style="display:inline-flex;transform:rotate(${isExpanded ? 90 : 0}deg)">${ICON.chevron}</span>
          </button>
          <span class="shrink-0 ${node.status === "active" ? "text-indigo-400" : "text-slate-300"}">${hasChildren ? ICON.folder : ICON.tag}</span>
          <span class="text-sm flex-1 truncate ${node.status === "inactive" ? "text-slate-400" : "text-slate-700"} ${isSelected ? "font-semibold text-indigo-700" : ""}">${escapeHtml(node.name)}</span>
          ${node.status === "inactive" ? `<span class="shrink-0 w-1.5 h-1.5 rounded-full bg-slate-300" title="Inactive"></span>` : ""}
          <span class="shrink-0 text-xs font-medium px-1.5 py-0.5 rounded-md ${isSelected ? "bg-indigo-100 text-indigo-700" : "bg-slate-100 text-slate-500"}">${fmt(total)}</span>
        </div>
        ${hasChildren && isExpanded ? `<div class="children-wrap">${visibleChildren.map(c => renderNode(c, depth + 1)).join("")}</div>` : ""}
      </div>`;
    return rowHtml;
  }

  treeContainer.addEventListener("click", (e) => {
    const chevronBtn = e.target.closest(".chevron-btn");
    if (chevronBtn) {
      const id = Number(chevronBtn.dataset.id);
      if (expanded.has(id)) expanded.delete(id); else expanded.add(id);
      renderTree();
      return;
    }
    const row = e.target.closest(".row-content");
    if (row) {
      const id = Number(row.closest(".tree-row").dataset.id);
      selectCategory(id);
    }
  });

  document.getElementById("treeSearch").addEventListener("input", (e) => {
    searchTerm = e.target.value.trim().toLowerCase();
    if (searchTerm) {
      allNodes().forEach(n => { if (matchesSearch(n) && n.children.length) expanded.add(n.id); });
    }
    renderTree();
  });

  /* ---------------------------------------------------------------- */
  /* Details panel rendering                                           */
  /* ---------------------------------------------------------------- */
  const detailsPanel = document.getElementById("detailsPanel");

  function selectCategory(id) {
    selectedId = id;
    activeTab = "overview";
    renderTree();
    renderDetails();
  }

  function renderDetails() {
    const node = findNode(selectedId);
    if (!node) {
      detailsPanel.innerHTML = `<div class="h-full flex items-center justify-center text-slate-400 text-sm p-10">Select a category from the tree to view its details.</div>`;
      return;
    }
    const parent = findParent(node.id);
    const path = getPath(node.id);
    const total = totalCount(node);
    const descendants = countAllDescendants(node);

    detailsPanel.innerHTML = `
      <div class="fade-in p-6">
        <!-- Breadcrumb -->
        <div class="flex items-center gap-1.5 text-xs text-slate-400 mb-3 flex-wrap">
          ${path.map((p, i) => `
            <span class="${i === path.length - 1 ? "text-slate-600 font-medium" : "hover:text-indigo-600 cursor-pointer crumb"}" data-id="${p.id}">${escapeHtml(p.name)}</span>
            ${i < path.length - 1 ? '<span class="text-slate-300">/</span>' : ""}
          `).join("")}
        </div>

        <!-- Header -->
        <div class="flex items-start justify-between gap-4 mb-5">
          <div class="flex items-start gap-3">
            <div class="w-11 h-11 rounded-lg bg-indigo-50 text-indigo-500 flex items-center justify-center shrink-0 mt-0.5">${node.children.length ? ICON.folder : ICON.tag}</div>
            <div>
              <div class="flex items-center gap-2">
                <h2 class="text-lg font-semibold text-slate-900">${escapeHtml(node.name)}</h2>
                ${statusBadge(node.status)}
              </div>
              <p class="text-sm text-slate-400 mt-0.5">/${escapeHtml(node.slug)}</p>
            </div>
          </div>
          <div class="flex items-center gap-2 shrink-0">
            <button id="btnToggleStatus" class="inline-flex items-center gap-1.5 text-xs font-medium px-2.5 py-1.5 rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-50">
              ${ICON.power}${node.status === "active" ? "Deactivate" : "Activate"}
            </button>
            <button id="btnEdit" class="inline-flex items-center gap-1.5 text-xs font-medium px-2.5 py-1.5 rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-50">
              ${ICON.pencil}Edit
            </button>
            <button id="btnDelete" class="inline-flex items-center gap-1.5 text-xs font-medium px-2.5 py-1.5 rounded-lg border border-red-200 text-red-500 hover:bg-red-50">
              ${ICON.trash}Delete
            </button>
          </div>
        </div>

        <!-- Stat cards -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6">
          <div class="border border-slate-200 rounded-lg p-3">
            <div class="text-xs text-slate-400">Total products</div>
            <div class="text-xl font-semibold text-slate-800">${fmt(total)}</div>
          </div>
          <div class="border border-slate-200 rounded-lg p-3">
            <div class="text-xs text-slate-400">Direct products</div>
            <div class="text-xl font-semibold text-slate-800">${fmt(node.directCount)}</div>
          </div>
          <div class="border border-slate-200 rounded-lg p-3">
            <div class="text-xs text-slate-400">Subcategories</div>
            <div class="text-xl font-semibold text-slate-800">${fmt(node.children.length)}</div>
          </div>
          <div class="border border-slate-200 rounded-lg p-3">
            <div class="text-xs text-slate-400">Parent category</div>
            <div class="text-sm font-medium text-slate-700 truncate mt-1.5">${parent ? escapeHtml(parent.name) : "— (Root level)"}</div>
          </div>
        </div>

        <!-- Tabs -->
        <div class="border-b border-slate-200 flex gap-5 mb-5">
          ${["overview", "seo", "products", "subcategories"].map(t => `
            <button class="tab-btn ${activeTab === t ? "active" : ""} pb-2.5 text-sm font-medium border-b-2 border-transparent text-slate-400 hover:text-slate-600 capitalize" data-tab="${t}">
              ${t === "subcategories" ? `Subcategories (${node.children.length})` : t}
            </button>
          `).join("")}
        </div>

        <div id="tabContent">${renderTab(node, activeTab, descendants)}</div>
      </div>
    `;

    detailsPanel.querySelectorAll(".crumb").forEach(el => el.addEventListener("click", () => selectCategory(Number(el.dataset.id))));
    detailsPanel.querySelector("#btnToggleStatus").addEventListener("click", () => {
      node.status = node.status === "active" ? "inactive" : "active";
      node.updatedAt = today;
      renderTree(); renderDetails();
    });
    detailsPanel.querySelector("#btnEdit").addEventListener("click", () => openEditForm(node));
    detailsPanel.querySelector("#btnDelete").addEventListener("click", () => deleteCategory(node));
    detailsPanel.querySelectorAll(".tab-btn").forEach(btn => btn.addEventListener("click", () => {
      activeTab = btn.dataset.tab;
      renderDetails();
    }));

    const addSubBtn = detailsPanel.querySelector("#btnAddSub");
    if (addSubBtn) addSubBtn.addEventListener("click", () => openAddForm(node));
  }

  function renderTab(node, tab, descendants) {
    if (tab === "overview") {
      return `
        <div class="space-y-5 text-sm">
          <div>
            <div class="text-xs font-medium text-slate-400 mb-1">Description</div>
            <p class="text-slate-600 leading-relaxed">${node.description ? escapeHtml(node.description) : "<span class='text-slate-300'>No description provided.</span>"}</p>
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <div class="text-xs font-medium text-slate-400 mb-1">Storefront URL</div>
              <div class="text-indigo-600 font-mono text-xs bg-indigo-50 rounded px-2 py-1 truncate">/catalog/${escapeHtml(node.slug)}</div>
            </div>
            <div>
              <div class="text-xs font-medium text-slate-400 mb-1">Total descendants</div>
              <div class="text-slate-600">${fmt(descendants)} categor${descendants === 1 ? "y" : "ies"}</div>
            </div>
            <div>
              <div class="text-xs font-medium text-slate-400 mb-1">Created</div>
              <div class="text-slate-600">${node.createdAt}</div>
            </div>
            <div>
              <div class="text-xs font-medium text-slate-400 mb-1">Last updated</div>
              <div class="text-slate-600">${node.updatedAt}</div>
            </div>
          </div>
        </div>`;
    }
    if (tab === "seo") {
      return `
        <div class="space-y-4 text-sm">
          <div>
            <div class="text-xs font-medium text-slate-400 mb-1">Meta title</div>
            <div class="text-slate-600">${node.seoTitle ? escapeHtml(node.seoTitle) : "<span class='text-slate-300'>Not set — falls back to category name.</span>"}</div>
          </div>
          <div>
            <div class="text-xs font-medium text-slate-400 mb-1">Meta description</div>
            <p class="text-slate-600 leading-relaxed">${node.seoDescription ? escapeHtml(node.seoDescription) : "<span class='text-slate-300'>Not set.</span>"}</p>
          </div>
          <div class="border border-slate-200 rounded-lg p-3 bg-slate-50">
            <div class="text-xs text-slate-400 mb-1">Search result preview</div>
            <div class="text-sm text-indigo-700 truncate">${escapeHtml(node.seoTitle || node.name)}</div>
            <div class="text-xs text-emerald-700 truncate">yourshop.com › catalog › ${escapeHtml(node.slug)}</div>
            <div class="text-xs text-slate-500 mt-0.5 line-clamp-2">${escapeHtml(node.seoDescription || node.description || "No description available.")}</div>
          </div>
        </div>`;
    }
    if (tab === "products") {
      if (node.directCount === 0) {
        return `<div class="text-sm text-slate-400 border border-dashed border-slate-200 rounded-lg p-6 text-center">
          This category has no products assigned directly — its ${fmt(totalCount(node))} products live in the subcategories below.
        </div>`;
      }
      const sampleSize = Math.min(5, node.directCount);
      const rows = Array.from({ length: sampleSize }, (_, i) => {
        const n = i + 1;
        const price = (19.99 + (node.id * 7 + n * 13) % 180).toFixed(2);
        const stock = (node.id * 3 + n * 17) % 120;
        return `
          <tr class="border-t border-slate-100">
            <td class="py-2 pr-3 text-slate-700">${escapeHtml(node.name)} ${n === 1 ? "" : "Variant " + n}</td>
            <td class="py-2 pr-3 text-slate-400 font-mono text-xs">SKU-${node.id}${String(n).padStart(3, "0")}</td>
            <td class="py-2 pr-3 text-slate-600">$${price}</td>
            <td class="py-2 pr-3 text-slate-600">${stock}</td>
            <td class="py-2">${stock > 0 ? statusBadge("active") : statusBadge("inactive")}</td>
          </tr>`;
      }).join("");
      return `
        <div>
          <table class="w-full text-sm text-left">
            <thead>
              <tr class="text-xs text-slate-400">
                <th class="py-1.5 pr-3 font-medium">Product</th>
                <th class="py-1.5 pr-3 font-medium">SKU</th>
                <th class="py-1.5 pr-3 font-medium">Price</th>
                <th class="py-1.5 pr-3 font-medium">Stock</th>
                <th class="py-1.5 font-medium">Status</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
          <div class="text-xs text-slate-400 mt-3">Showing ${sampleSize} of ${fmt(node.directCount)} products in this category.</div>
        </div>`;
    }
    if (tab === "subcategories") {
      if (!node.children.length) {
        return `<div class="text-sm text-slate-400 border border-dashed border-slate-200 rounded-lg p-6 text-center">No subcategories yet.</div>`;
      }
      return `
        <div class="space-y-2">
          ${node.children.map(c => `
            <div class="subcat-row flex items-center justify-between border border-slate-200 rounded-lg px-3 py-2.5 hover:border-indigo-300 hover:bg-indigo-50/40 cursor-pointer transition-colors" data-id="${c.id}">
              <div class="flex items-center gap-2">
                <span class="${c.status === "active" ? "text-indigo-400" : "text-slate-300"}">${c.children.length ? ICON.folder : ICON.tag}</span>
                <span class="text-sm font-medium text-slate-700">${escapeHtml(c.name)}</span>
                ${c.status === "inactive" ? statusBadge("inactive") : ""}
              </div>
              <span class="text-xs font-medium px-2 py-0.5 rounded-md bg-slate-100 text-slate-500">${fmt(totalCount(c))} products</span>
            </div>
          `).join("")}
        </div>`;
    }
    return "";
  }

  detailsPanel.addEventListener("click", (e) => {
    const row = e.target.closest(".subcat-row");
    if (row) selectCategory(Number(row.dataset.id));
  });

  /* ---------------------------------------------------------------- */
  /* Edit / Add / Delete                                               */
  /* ---------------------------------------------------------------- */
  function openEditForm(node) {
    const overlay = document.createElement("div");
    overlay.className = "fixed inset-0 bg-slate-900/40 flex items-center justify-center z-50 p-4";
    overlay.innerHTML = `
      <div class="bg-white rounded-xl shadow-xl w-full max-w-md p-6 fade-in">
        <h3 class="text-base font-semibold text-slate-900 mb-4">Edit Category</h3>
        <div class="space-y-3">
          <div>
            <label class="text-xs font-medium text-slate-500">Name</label>
            <input id="fName" type="text" value="${escapeHtml(node.name)}" class="w-full mt-1 border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-200">
          </div>
          <div>
            <label class="text-xs font-medium text-slate-500">Slug</label>
            <input id="fSlug" type="text" value="${escapeHtml(node.slug)}" class="w-full mt-1 border border-slate-200 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-indigo-200">
          </div>
          <div>
            <label class="text-xs font-medium text-slate-500">Description</label>
            <textarea id="fDesc" rows="3" class="w-full mt-1 border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-200">${escapeHtml(node.description)}</textarea>
          </div>
          <div>
            <label class="text-xs font-medium text-slate-500">Status</label>
            <select id="fStatus" class="w-full mt-1 border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-200">
              <option value="active" ${node.status === "active" ? "selected" : ""}>Active</option>
              <option value="inactive" ${node.status === "inactive" ? "selected" : ""}>Inactive</option>
            </select>
          </div>
        </div>
        <div class="flex justify-end gap-2 mt-5">
          <button id="fCancel" class="text-sm font-medium px-3.5 py-2 rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-50">Cancel</button>
          <button id="fSave" class="text-sm font-medium px-3.5 py-2 rounded-lg bg-indigo-600 text-white hover:bg-indigo-700">Save changes</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    overlay.querySelector("#fCancel").addEventListener("click", () => overlay.remove());
    overlay.addEventListener("click", (e) => { if (e.target === overlay) overlay.remove(); });
    overlay.querySelector("#fSave").addEventListener("click", () => {
      const name = overlay.querySelector("#fName").value.trim();
      if (!name) return;
      node.name = name;
      node.slug = overlay.querySelector("#fSlug").value.trim() || slugify(name);
      node.description = overlay.querySelector("#fDesc").value.trim();
      node.status = overlay.querySelector("#fStatus").value;
      node.updatedAt = today;
      overlay.remove();
      renderTree();
      renderDetails();
    });
  }

  function openAddForm(parentNode) {
    const overlay = document.createElement("div");
    overlay.className = "fixed inset-0 bg-slate-900/40 flex items-center justify-center z-50 p-4";
    overlay.innerHTML = `
      <div class="bg-white rounded-xl shadow-xl w-full max-w-md p-6 fade-in">
        <h3 class="text-base font-semibold text-slate-900 mb-1">Add Category</h3>
        <p class="text-xs text-slate-400 mb-4">${parentNode ? `New subcategory under <span class="font-medium text-slate-600">${escapeHtml(parentNode.name)}</span>` : "New top-level category"}</p>
        <div class="space-y-3">
          <div>
            <label class="text-xs font-medium text-slate-500">Name</label>
            <input id="nName" type="text" placeholder="e.g. Smart Home" class="w-full mt-1 border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-200">
          </div>
          <div>
            <label class="text-xs font-medium text-slate-500">Description <span class="text-slate-300">(optional)</span></label>
            <textarea id="nDesc" rows="3" class="w-full mt-1 border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-200"></textarea>
          </div>
        </div>
        <div class="flex justify-end gap-2 mt-5">
          <button id="nCancel" class="text-sm font-medium px-3.5 py-2 rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-50">Cancel</button>
          <button id="nSave" class="text-sm font-medium px-3.5 py-2 rounded-lg bg-indigo-600 text-white hover:bg-indigo-700">Create category</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    overlay.querySelector("#nCancel").addEventListener("click", () => overlay.remove());
    overlay.addEventListener("click", (e) => { if (e.target === overlay) overlay.remove(); });
    overlay.querySelector("#nSave").addEventListener("click", () => {
      const name = overlay.querySelector("#nName").value.trim();
      if (!name) return;
      const newNode = cat({
        id: nextId++,
        name,
        description: overlay.querySelector("#nDesc").value.trim(),
        createdAt: today,
      });
      if (parentNode) {
        parentNode.children.push(newNode);
        expanded.add(parentNode.id);
      } else {
        categoryData.push(newNode);
      }
      overlay.remove();
      selectCategory(newNode.id);
    });
  }

  function deleteCategory(node) {
    const descendants = countAllDescendants(node);
    const msg = descendants > 0
      ? `Delete "${node.name}" and its ${descendants} subcategor${descendants === 1 ? "y" : "ies"}? This cannot be undone.`
      : `Delete "${node.name}"? This cannot be undone.`;
    if (!window.confirm(msg)) return;

    const parent = findParent(node.id);
    if (parent) {
      parent.children = parent.children.filter(c => c.id !== node.id);
    } else {
      const idx = categoryData.findIndex(c => c.id === node.id);
      if (idx !== -1) categoryData.splice(idx, 1);
    }
    selectedId = parent ? parent.id : (categoryData[0] ? categoryData[0].id : null);
    renderTree();
    renderDetails();
    updateHeaderStats();
  }

  document.getElementById("addRootBtn").addEventListener("click", () => openAddForm(null));

  /* ---------------------------------------------------------------- */
  /* Header stats                                                      */
  /* ---------------------------------------------------------------- */
  function updateHeaderStats() {
    const nodes = allNodes();
    const grandTotal = categoryData.reduce((s, n) => s + totalCount(n), 0);
    document.getElementById("statCatCount").textContent = fmt(nodes.length);
    document.getElementById("statProdCount").textContent = fmt(grandTotal);
  }

  /* ---------------------------------------------------------------- */
  /* Init                                                               */
  /* ---------------------------------------------------------------- */
  renderTree();
  renderDetails();
  updateHeaderStats();

  // patch Add Subcategory button into subcategories tab + overview actions
  const observer = new MutationObserver(() => {
    const node = findNode(selectedId);
    if (!node) return;
    const tabContent = document.getElementById("tabContent");
    if (tabContent && activeTab === "subcategories" && !document.getElementById("btnAddSub")) {
      const btn = document.createElement("button");
      btn.id = "btnAddSub";
      btn.className = "mt-3 inline-flex items-center gap-1.5 text-xs font-medium px-2.5 py-1.5 rounded-lg border border-indigo-200 text-indigo-600 hover:bg-indigo-50";
      btn.innerHTML = `${ICON.plus}Add Subcategory`;
      tabContent.appendChild(btn);
      btn.addEventListener("click", () => openAddForm(node));
    }
  });
  observer.observe(detailsPanel, { childList: true, subtree: true });

})();
</script>
</body>
</html>
