  function minsOf(hhmm) { var p = hhmm.split(':'); return parseInt(p[0], 10) * 60 + parseInt(p[1], 10); }
  function timeLabel(mins) { var h = Math.floor(mins / 60), m = mins % 60; return pad2(h) + ':' + pad2(m); }
  function longDate(d) { return WEEKDAY_NAMES[d.getDay()] === 'Sun' ? '' : (['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][d.getDay()] + ' ' + d.getDate() + ' ' + MONTH_NAMES[d.getMonth()] + ' ' + d.getFullYear()); }
  function startOfWeek(d) { var day = d.getDay(); var diff = day === 0 ? -6 : 1 - day; return addDays(d, diff); }
  function floorColor(floor) { return floor === 2 ? '#1F5C73' : '#B8872B'; }
  function floorSoft(floor) { return floor === 2 ? '#E4EEF0' : '#F3EAD9'; }

  function bookingsFor(roomId, dateIso) {
    return bookings.filter(function (b) { return b.roomId === roomId && b.date === dateIso; })
      .sort(function (a, b) { return minsOf(a.start) - minsOf(b.start); });
  }

  function activeRooms() {
    return rooms.filter(function (r) { return state.activeRoomIds.has(r.id); });
  }

  function overlaps(roomId, dateIso, startMin, endMin, excludeId) {
    return bookings.some(function (b) {
      if (b.roomId !== roomId || b.date !== dateIso || b.id === excludeId) return false;
      var bs = minsOf(b.start), be = minsOf(b.end);
      return startMin < be && endMin > bs;
    });
  }

  function equipIcons(list) {
    return list.map(function (e) {
      return '<svg class="w-3.5 h-3.5" aria-hidden="true"><use href="#' + icons[e] + '"/></svg>';
    }).join('');
  }

  // ---------- Clock ----------
  function renderClock() {
    document.getElementById('clock-date').textContent = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][appNow.getDay()] + ', ' + appNow.getDate() + ' ' + MONTH_NAMES[appNow.getMonth()];
    document.getElementById('clock-time').textContent = pad2(appNow.getHours()) + ':' + pad2(appNow.getMinutes());
  }
  setInterval(function () {
    appNow = new Date(appNow.getTime() + 1000);
    renderClock();
    positionNowLine();
  }, 1000);

  // ---------- Legend / filter ----------
  function renderLegend() {
    var el = document.getElementById('legend');
    var allActive = state.activeRoomIds.size === rooms.length;
    var html = '<button data-all="1" class="px-3 py-1.5 text-xs font-medium rounded-sm border ' +
      (allActive ? 'border-ink bg-ink text-white' : 'border-line text-inksoft hover:border-ink hover:text-ink') +
      '">All rooms</button>';
    rooms.forEach(function (r) {
      var active = state.activeRoomIds.has(r.id);
      html += '<button data-room="' + r.id + '" class="legend-chip flex items-center gap-1.5 pl-2 pr-3 py-1.5 text-xs rounded-sm border ' +
        (active ? 'border-ink' : 'border-line opacity-40 hover:opacity-70') + '">' +
        '<span class="w-1.5 h-4 inline-block" style="background:' + floorColor(r.floor) + '"></span>' +
        '<span class="font-medium">' + r.code + ' ' + r.name + '</span>' +
        '<span class="flex items-center gap-1 text-inksoft"><svg class="w-3 h-3"><use href="#i-person"/></svg>' + r.capacity + '</span>' +
        '<span class="flex items-center gap-1 text-inksoft">' + equipIcons(r.equipment) + '</span>' +
        '</button>';
    });
    el.innerHTML = html;
    el.querySelectorAll('[data-room]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var id = btn.getAttribute('data-room');
        if (state.activeRoomIds.has(id)) state.activeRoomIds.delete(id); else state.activeRoomIds.add(id);
        renderAll();
      });
    });
    el.querySelector('[data-all]').addEventListener('click', function () {
      state.activeRoomIds = new Set(rooms.map(function (r) { return r.id; }));
      renderAll();
    });
  }

  // ---------- Day view ----------
  function renderDayView() {
    var container = document.getElementById('day-view');
    var list = activeRooms();
    if (!list.length) { container.innerHTML = ''; return; }
    var dateIso = isoDate(state.currentDate);

    var cols = '64px repeat(' + list.length + ', minmax(150px, 1fr))';
    var html = '<div class="relative" style="display:grid;grid-template-columns:' + cols + ';">';

    // header row
    html += '<div class="h-16 border-b border-r border-line bg-surface sticky top-0 left-0 z-20"></div>';
    list.forEach(function (r) {
      html += '<div class="h-16 border-b border-line px-3 py-2 flex items-center gap-2 bg-surface sticky top-0 z-10">' +
        '<span class="w-1.5 self-stretch" style="background:' + floorColor(r.floor) + '"></span>' +
        '<div><div class="font-display font-semibold leading-tight">' + r.code + ' ' + r.name + '</div>' +
        '<div class="text-xs text-inksoft flex items-center gap-1 mt-0.5"><svg class="w-3 h-3"><use href="#i-person"/></svg>' + r.capacity + equipIcons(r.equipment) + '</div></div>' +
        '</div>';
    });

    // time column
    html += '<div class="relative border-r border-line sticky left-0 bg-surface z-10" style="height:' + DAY_SPAN + 'px">';
    for (var h = 7; h <= 18; h++) {
      html += '<div class="absolute right-2 -translate-y-1/2 text-xs text-inksoft tabular-nums" style="top:' + ((h - 7) * 60) + 'px">' + pad2(h) + ':00</div>';
    }
    html += '</div>';

    // room columns
    list.forEach(function (r) {
      html += '<div class="room-cell relative border-r border-line last:border-r-0 cursor-pointer" data-room="' + r.id + '" style="height:' + DAY_SPAN + 'px">';
      bookingsFor(r.id, dateIso).forEach(function (b) {
        var top = minsOf(b.start) - DAY_START;
        var h2 = minsOf(b.end) - minsOf(b.start);
        html += '<div class="booking-block absolute left-0.5 right-0.5 bg-surface border border-line rounded-sm px-2 py-1 overflow-hidden cursor-pointer" ' +
          'data-booking="' + b.id + '" style="top:' + top + 'px;height:' + Math.max(h2, 22) + 'px;border-left:3px solid ' + floorColor(r.floor) + '">' +
          '<p class="text-xs font-medium leading-snug truncate">' + b.title + '</p>' +
          '<p class="text-[11px] text-inksoft truncate">' + b.start + '&ndash;' + b.end + '</p>' +
          '</div>';
      });
      html += '</div>';
    });

    html += '</div>';
    container.innerHTML = html;

    container.querySelectorAll('[data-room]').forEach(function (cell) {
      cell.addEventListener('click', function (e) {
        if (e.target.closest('[data-booking]')) return;
        var rect = cell.getBoundingClientRect();
        var y = e.clientY - rect.top;
        var minute = DAY_START + Math.round(y / 15) * 15;
        minute = Math.max(DAY_START, Math.min(DAY_END - 30, minute));
        openBookingModal({ roomId: cell.getAttribute('data-room'), date: dateIso, start: timeLabel(minute), end: timeLabel(Math.min(minute + 30, DAY_END)) });
      });
    });
    container.querySelectorAll('[data-booking]').forEach(function (el) {
      el.addEventListener('click', function (e) {
        e.stopPropagation();
        var b = bookings.find(function (x) { return x.id === el.getAttribute('data-booking'); });
        if (b) openDetailModal(b);
      });
    });

    positionNowLine();
  }

  function positionNowLine() {
    var container = document.getElementById('day-view');
    var old = container.querySelector('#now-line');
    if (old) old.remove();
    if (state.view !== 'day') return;
    if (!sameDate(appNow, state.currentDate)) return;
    var mins = appNow.getHours() * 60 + appNow.getMinutes();
    if (mins < DAY_START || mins > DAY_END) return;
    var top = 64 + (mins - DAY_START); // header height (64px) + offset
    var line = document.createElement('div');
    line.id = 'now-line';
    line.className = 'absolute pointer-events-none z-20';
    line.style.top = top + 'px';
    line.style.left = '64px';
    line.style.right = '0';
    line.style.height = '0';
    line.innerHTML = '<div style="height:2px;background:#C8102E;position:relative;">' +
      '<span style="position:absolute;left:-7px;top:-4px;width:10px;height:10px;border-radius:9999px;background:#C8102E;"></span></div>';
    var grid = container.querySelector('div');
    if (grid) grid.appendChild(line);
  }

  // ---------- Week view ----------
  function renderWeekView() {
    var container = document.getElementById('week-view');
    var list = activeRooms();
    if (!list.length) { container.innerHTML = ''; return; }
    var monday = startOfWeek(state.currentDate);
    var days = [0, 1, 2, 3, 4].map(function (i) { return addDays(monday, i); });

    var cols = '190px repeat(5, minmax(150px, 1fr))';
    var html = '<div style="display:grid;grid-template-columns:' + cols + ';">';

    html += '<div class="h-14 border-b border-r border-line bg-surface sticky left-0 z-10"></div>';
    days.forEach(function (d) {
      var isToday = sameDate(d, appNow);
      html += '<div class="h-14 border-b border-line px-3 py-2 flex flex-col justify-center ' + (isToday ? 'bg-floor2soft' : '') + '">' +
        '<span class="font-display font-semibold">' + ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()] + ' ' + d.getDate() + '</span>' +
        '<span class="text-xs text-inksoft">' + MONTH_NAMES[d.getMonth()] + '</span></div>';
    });

    list.forEach(function (r) {
      html += '<div class="border-b border-r border-line px-3 py-2 flex items-center gap-2 sticky left-0 bg-surface z-10">' +
        '<span class="w-1.5 self-stretch" style="background:' + floorColor(r.floor) + '"></span>' +
        '<div><div class="font-display font-semibold leading-tight text-sm">' + r.code + ' ' + r.name + '</div>' +
        '<div class="text-xs text-inksoft flex items-center gap-1 mt-0.5"><svg class="w-3 h-3"><use href="#i-person"/></svg>' + r.capacity + '</div></div></div>';

      days.forEach(function (d) {
        var dateIso = isoDate(d);
        var list2 = bookingsFor(r.id, dateIso);
        html += '<div class="week-cell border-b border-line px-2 py-2 cursor-pointer hover:bg-paper" data-room="' + r.id + '" data-date="' + dateIso + '">';
        if (!list2.length) {
          html += '<div class="h-7 border border-dashed border-line rounded-sm flex items-center justify-center"><span class="text-[11px] text-inksoft">Open all day</span></div>';
        } else {
          html += '<div class="relative h-7 bg-paper rounded-sm border border-line">';
          list2.forEach(function (b) {
            var left = ((minsOf(b.start) - DAY_START) / DAY_SPAN) * 100;
            var width = ((minsOf(b.end) - minsOf(b.start)) / DAY_SPAN) * 100;
            html += '<div class="week-bar-seg absolute top-0 bottom-0 rounded-sm" title="' + b.start + '&ndash;' + b.end + ' ' + b.title + '" style="left:' + left + '%;width:' + Math.max(width, 2) + '%;background:' + floorColor(r.floor) + '"></div>';
          });
          html += '</div>';
        }
        html += '</div>';
      });
    });

    html += '</div>';
    container.innerHTML = html;

    container.querySelectorAll('.week-cell').forEach(function (cell) {
      cell.addEventListener('click', function () {
        state.currentDate = new Date(cell.getAttribute('data-date') + 'T00:00:00');
        state.view = 'day';
        renderAll();
      });
    });
  }

  // ---------- Modals ----------
  function openBookingModal(prefill) {
    document.getElementById('form-error').classList.add('hidden');
    var sel = document.getElementById('f-room');
    sel.innerHTML = rooms.map(function (r) { return '<option value="' + r.id + '">' + r.code + ' ' + r.name + ' (' + r.capacity + ' seats)</option>'; }).join('');
    document.getElementById('f-title').value = '';
    document.getElementById('f-organizer').value = 'Priya Nair';
    document.getElementById('f-attendees').value = 2;
    sel.value = prefill.roomId || rooms[0].id;
    document.getElementById('f-date').value = prefill.date;
    document.getElementById('f-start').value = prefill.start;
    document.getElementById('f-end').value = prefill.end;
    document.getElementById('booking-modal').classList.remove('hidden');
    document.getElementById('f-title').focus();
  }
  function closeBookingModal() { document.getElementById('booking-modal').classList.add('hidden'); }

  function openDetailModal(b) {
    var r = roomById[b.roomId];
    document.getElementById('detail-room-line').textContent = r.code + ' ' + r.name + ' &middot; floor ' + r.floor;
    document.getElementById('detail-room-line').innerHTML = r.code + ' ' + r.name + ' &middot; floor ' + r.floor;
    document.getElementById('detail-modal-title').textContent = b.title;
    document.getElementById('detail-time-line').textContent = longDate(new Date(b.date + 'T00:00:00')) + ' &middot; ' + b.start + '&ndash;' + b.end;
    document.getElementById('detail-time-line').innerHTML = longDate(new Date(b.date + 'T00:00:00')) + ' &middot; ' + b.start + '&ndash;' + b.end;
    document.getElementById('detail-organizer').textContent = b.organizer;
    document.getElementById('detail-attendees').textContent = b.attendees;
    var cancelBtn = document.getElementById('detail-cancel-booking');
    cancelBtn.textContent = 'Cancel booking';
    cancelBtn.dataset.id = b.id;
    cancelBtn.dataset.armed = '0';
    document.getElementById('detail-modal').classList.remove('hidden');
  }
  function closeDetailModal() { document.getElementById('detail-modal').classList.add('hidden'); }

  document.getElementById('booking-modal-close').addEventListener('click', closeBookingModal);
  document.getElementById('booking-cancel').addEventListener('click', closeBookingModal);
  document.getElementById('booking-modal').addEventListener('click', function (e) { if (e.target === this) closeBookingModal(); });

  document.getElementById('detail-modal-close').addEventListener('click', closeDetailModal);
  document.getElementById('detail-close-btn').addEventListener('click', closeDetailModal);
  document.getElementById('detail-modal').addEventListener('click', function (e) { if (e.target === this) closeDetailModal(); });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { closeBookingModal(); closeDetailModal(); }
  });

  document.getElementById('detail-cancel-booking').addEventListener('click', function () {
    if (this.dataset.armed !== '1') {
      this.dataset.armed = '1';
      this.textContent = 'Confirm cancellation';
      return;
    }
    bookings = bookings.filter(function (b) { return b.id !== this.dataset.id; }, this);
    closeDetailModal();
    renderAll();
  });

  document.getElementById('booking-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var roomId = document.getElementById('f-room').value;
    var date = document.getElementById('f-date').value;
    var start = document.getElementById('f-start').value;
    var end = document.getElementById('f-end').value;
    var title = document.getElementById('f-title').value.trim();
    var organizer = document.getElementById('f-organizer').value.trim();
    var attendees = parseInt(document.getElementById('f-attendees').value, 10) || 1;
    var errEl = document.getElementById('form-error');

    var sMin = minsOf(start), eMin = minsOf(end);
    var msg = '';
    if (!title) msg = 'Give the meeting a title.';
    else if (eMin <= sMin) msg = 'End time must be after the start time.';
    else if (sMin < DAY_START || eMin > DAY_END) msg = 'Bookings run between 07:00 and 19:00.';
    else if (overlaps(roomId, date, sMin, eMin, null)) msg = roomById[roomId].name + ' is already booked for part of that time.';

    if (msg) { errEl.textContent = msg; errEl.classList.remove('hidden'); return; }

    bookings.push({ id: 'b' + (nextBookingNum++), roomId: roomId, date: date, start: start, end: end, title: title, organizer: organizer || 'Priya Nair', attendees: attendees });
    closeBookingModal();
    state.currentDate = new Date(date + 'T00:00:00');
    state.view = 'day';
    renderAll();
  });

  // ---------- Controls ----------
  document.getElementById('btn-view-day').addEventListener('click', function () { state.view = 'day'; renderAll(); });
  document.getElementById('btn-view-week').addEventListener('click', function () { state.view = 'week'; renderAll(); });
  document.getElementById('btn-prev').addEventListener('click', function () {
    state.currentDate = addDays(state.currentDate, state.view === 'day' ? -1 : -7);
    renderAll();
  });
  document.getElementById('btn-next').addEventListener('click', function () {
    state.currentDate = addDays(state.currentDate, state.view === 'day' ? 1 : 7);
    renderAll();
  });
  document.getElementById('btn-today').addEventListener('click', function () {
    state.currentDate = new Date(appNow.getFullYear(), appNow.getMonth(), appNow.getDate());
    renderAll();
  });
  document.getElementById('btn-new-booking').addEventListener('click', function () {
    var mins = DAY_START + 60;
    openBookingModal({ roomId: activeRooms()[0] ? activeRooms()[0].id : rooms[0].id, date: isoDate(state.currentDate), start: timeLabel(mins), end: timeLabel(mins + 30) });
  });

  // ---------- Master render ----------
  function renderAll() {
    var dayBtn = document.getElementById('btn-view-day');
    var weekBtn = document.getElementById('btn-view-week');
    dayBtn.className = 'view-toggle px-4 py-1.5 text-sm font-medium font-display ' + (state.view === 'day' ? 'bg-ink text-white' : 'bg-surface text-ink hover:bg-paper');
    weekBtn.className = 'view-toggle px-4 py-1.5 text-sm font-medium font-display border-l border-ink ' + (state.view === 'week' ? 'bg-ink text-white' : 'bg-surface text-ink hover:bg-paper');

    document.getElementById('day-view').classList.toggle('hidden', state.view !== 'day');
    document.getElementById('week-view').classList.toggle('hidden', state.view !== 'week');

    if (state.view === 'day') {
      document.getElementById('range-label').textContent = longDate(state.currentDate);
    } else {
      var monday = startOfWeek(state.currentDate);
      var friday = addDays(monday, 4);
      var sameMonth = monday.getMonth() === friday.getMonth();
      document.getElementById('range-label').textContent = monday.getDate() + '–' + friday.getDate() + ' ' + MONTH_NAMES[friday.getMonth()] + ' ' + friday.getFullYear();
    }

    renderLegend();
    var noRooms = activeRooms().length === 0;
    document.getElementById('empty-filter').classList.toggle('hidden', !noRooms);
    document.getElementById('day-view').classList.toggle('hidden', noRooms || state.view !== 'day');
    document.getElementById('week-view').classList.toggle('hidden', noRooms || state.view !== 'week');

    if (!noRooms) {
      renderDayView();
      renderWeekView();
    }
  }

  renderClock();
  renderAll();
})();
</script>
</body>
