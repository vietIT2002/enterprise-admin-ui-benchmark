  var CANDIDATES = CANDIDATES_RAW.map(function (c, i) {
    var contact = deriveContact(c.name, i);
    return Object.assign({ id: 'c' + i }, c, contact);
  });

  var state = { jobId: 'design', query: '', recruiter: 'all', source: 'all', minRating: 0, showDeclined: false, selectedId: null };

  // ---------- helpers ----------
  function jobCandidates(jobId) { return CANDIDATES.filter(function (c) { return c.jobId === jobId; }); }
  function currentStageDate(c) { return c.history[c.history.length - 1].date; }
  function matchesFilters(c) {
    var q = state.query.trim().toLowerCase();
    if (q) {
      var hay = (c.name + ' ' + c.title + ' ' + c.company + ' ' + c.tags.join(' ')).toLowerCase();
      if (hay.indexOf(q) === -1) return false;
    }
    if (state.recruiter !== 'all' && c.recruiter !== state.recruiter) return false;
    if (state.source !== 'all' && c.source !== state.source) return false;
    if (c.rating < state.minRating) return false;
    return true;
  }

  // ---------- job switcher ----------
  var jobSwitcher = document.getElementById('jobSwitcher');
  JOBS.forEach(function (j) {
    var opt = document.createElement('option');
    opt.value = j.id; opt.textContent = j.title;
    jobSwitcher.appendChild(opt);
  });
  jobSwitcher.value = state.jobId;
  jobSwitcher.addEventListener('change', function () {
    state.jobId = jobSwitcher.value;
    state.query = ''; state.recruiter = 'all'; state.source = 'all'; state.minRating = 0; state.showDeclined = false;
    document.getElementById('searchInput').value = '';
    document.getElementById('toggleDeclined').setAttribute('aria-pressed', 'false');
    document.getElementById('toggleDeclined').classList.remove('bg-ink', 'text-white', 'border-ink');
    renderAll();
  });

  // ---------- job meta ----------
  function renderJobMeta() {
    var job = JOBS.filter(function (j) { return j.id === state.jobId; })[0];
    var el = document.getElementById('jobMeta');
    var meta = [
      job.department + ' team',
      job.location,
      job.type,
      'Hiring manager ' + job.manager,
      job.openings + ' openings',
      'Opened ' + daysAgo(job.opened) + ' days ago'
    ];
    el.innerHTML =
      '<h1 class="font-serif text-2xl font-medium">' + job.title + '</h1>' +
      '<div class="flex flex-wrap items-center gap-x-4 gap-y-1 mt-2">' +
      meta.map(function (m, i) {
        return '<span class="text-sm text-ink/60' + (i > 0 ? ' pl-4 border-l border-line' : '') + '">' + m + '</span>';
      }).join('') +
      '</div>';
  }

  // ---------- toolbar option lists ----------
  function renderToolbarOptions() {
    var list = jobCandidates(state.jobId);
    var recruiters = Array.from(new Set(list.map(function (c) { return c.recruiter; }))).sort();
    var sources = Array.from(new Set(list.map(function (c) { return c.source; }))).sort();
    var recSel = document.getElementById('filterRecruiter');
    var srcSel = document.getElementById('filterSource');
    recSel.innerHTML = '<option value="all">All recruiters</option>' + recruiters.map(function (r) { return '<option value="' + r + '">' + r + '</option>'; }).join('');
    srcSel.innerHTML = '<option value="all">All sources</option>' + sources.map(function (s) { return '<option value="' + s + '">' + s + '</option>'; }).join('');
    recSel.value = state.recruiter;
    srcSel.value = state.source;
    document.getElementById('filterRating').value = String(state.minRating);
  }

  // ---------- rating ticks ----------
  function ratingTicks(rating) {
    var out = '';
    for (var i = 1; i <= 5; i++) {
      out += '<span class="rating-tick ' + (i <= rating ? 'bg-teal-600' : 'bg-line') + '"></span>';
    }
    return '<div class="flex items-center gap-0.5" aria-label="Fit rating ' + rating + ' of 5">' + out + '</div>';
  }

  // ---------- board ----------
  function cardTemplate(c) {
    var flagBadge = '';
    if (c.flag === 'new') flagBadge = '<span class="text-[10px] font-medium text-brass-700 bg-brass-50 border border-brass-100 rounded-sm px-1.5 py-0.5 shrink-0">New</span>';
    if (c.flag === 'offer-out') flagBadge = '<span class="text-[10px] font-medium text-brass-700 bg-brass-50 border border-brass-100 rounded-sm px-1.5 py-0.5 shrink-0">Offer sent</span>';

    var visibleTags = c.tags.slice(0, 2);
    var extra = c.tags.length - visibleTags.length;
    var tagsHtml = visibleTags.map(function (t) {
      return '<span class="text-[11px] px-1.5 py-0.5 rounded-sm border border-line text-ink/70">' + t + '</span>';
    }).join('') + (extra > 0 ? '<span class="text-[11px] px-1 py-0.5 text-ink/40">+' + extra + '</span>' : '');

    var days = daysAgo(currentStageDate(c));
    var stageLabel = STAGE_BY_KEY[c.stage].label;

    return (
      '<div class="candidate-card bg-white border border-line rounded-sm p-3 hover:border-ink/30 focus-visible:outline focus-visible:outline-2 focus-visible:outline-teal-600" ' +
      'tabindex="0" role="button" draggable="true" data-id="' + c.id + '">' +
        '<div class="flex items-start justify-between gap-2">' +
          '<div class="min-w-0">' +
            '<p class="font-serif text-[15px] font-medium leading-snug truncate">' + c.name + '</p>' +
            '<p class="text-xs text-ink/60 mt-0.5 truncate">' + c.title + ' at ' + c.company + '</p>' +
          '</div>' + flagBadge +
        '</div>' +
        '<div class="mt-2">' + ratingTicks(c.rating) + '</div>' +
        '<div class="flex flex-wrap gap-1 mt-2">' + tagsHtml + '</div>' +
        '<div class="flex items-center justify-between mt-3 pt-2 border-t border-line">' +
          '<span class="w-5 h-5 rounded-full bg-slate-600 text-white text-[10px] flex items-center justify-center shrink-0" title="' + c.recruiter + '">' + initials(c.recruiter) + '</span>' +
          '<p class="text-[11px] text-ink/50 text-right leading-tight">From ' + c.source + '.<br>' + days + ' day' + (days === 1 ? '' : 's') + ' in ' + stageLabel + '.</p>' +
        '</div>' +
      '</div>'
    );
  }

  function columnTemplate(stage, cards) {
    var body = cards.length
      ? cards.map(cardTemplate).join('')
      : '<p class="text-sm text-ink/40 px-1 py-4">No candidates match your filters.</p>';
    return (
      '<section class="flex flex-col w-[300px] shrink-0 h-full">' +
        '<div class="rounded-t-sm px-3 py-2 flex items-center justify-between text-white shrink-0" style="background-color:' + stage.color + '">' +
          '<span class="font-serif text-sm">' + stage.label + '</span>' +
          '<span class="text-xs bg-white/25 rounded-sm px-1.5 py-0.5">' + cards.length + '</span>' +
        '</div>' +
        '<div class="column-body flex-1 min-h-0 overflow-y-auto space-y-2 p-2 bg-white/70 border border-line border-t-0 rounded-b-sm" data-stage="' + stage.key + '">' +
          body +
        '</div>' +
      '</section>'
    );
  }

  function renderBoard() {
    var all = jobCandidates(state.jobId);
    var filtered = all.filter(matchesFilters);
    var columns = STAGES.slice();
    if (state.showDeclined) columns.push(DECLINED_STAGE);

    var board = document.getElementById('board');
    board.innerHTML = columns.map(function (stage) {
      var cards = filtered.filter(function (c) { return c.stage === stage.key; });
      return columnTemplate(stage, cards);
    }).join('');

    var activeCount = filtered.filter(function (c) { return c.stage !== 'declined'; }).length;
    document.getElementById('activeCount').textContent = activeCount + ' active candidate' + (activeCount === 1 ? '' : 's');
  }

  function renderAll() {
    renderJobMeta();
    renderToolbarOptions();
    renderBoard();
  }

  // ---------- dossier ----------
  var dossier = document.getElementById('dossier');
  var backdrop = document.getElementById('backdrop');

  function stageTimelineHtml(c) {
    var sequence = STAGES;
    var reached = {};
    c.history.forEach(function (h) { reached[h.stage] = h.date; });
    var isDeclined = c.stage === 'declined';
    var items = sequence.map(function (s, i) {
      var date = reached[s.key];
      var done = !!date;
      var isCurrent = s.key === c.stage;
      var dotClass = done ? 'border-transparent' : 'border-line bg-white';
      var dotStyle = done ? 'background-color:' + s.color + ';' : '';
      return (
        '<div class="flex gap-3">' +
          '<div class="flex flex-col items-center">' +
            '<span class="w-3 h-3 rounded-full border-2 ' + dotClass + ' ' + (isCurrent ? 'ring-2 ring-offset-1 ring-ink/20' : '') + '" style="' + dotStyle + '"></span>' +
            (i < sequence.length - 1 ? '<span class="w-px flex-1 bg-line mt-1"></span>' : '') +
          '</div>' +
          '<div class="pb-4">' +
            '<p class="text-sm ' + (done ? 'text-ink' : 'text-ink/40') + '">' + s.label + '</p>' +
            '<p class="text-xs text-ink/40">' + (date ? fmtDate(date) : 'Not yet reached') + '</p>' +
          '</div>' +
        '</div>'
      );
    }).join('');
    if (isDeclined) {
      var dDate = reached['declined'];
      items += (
        '<div class="flex gap-3">' +
          '<div class="flex flex-col items-center"><span class="w-3 h-3 rounded-full" style="background-color:' + DECLINED_STAGE.color + '"></span></div>' +
          '<div>' +
            '<p class="text-sm text-ink">' + DECLINED_STAGE.label + '</p>' +
            '<p class="text-xs text-ink/40">' + (dDate ? fmtDate(dDate) : '') + '</p>' +
            '<p class="text-sm text-ink/70 mt-1 max-w-[30ch]">' + (c.declinedReason || 'Reason not recorded yet.') + '</p>' +
          '</div>' +
        '</div>'
      );
    }
    return items;
  }

  function notesHtml(c) {
    if (!c.notes || !c.notes.length) {
      return '<p class="text-sm text-ink/40">No feedback recorded yet.</p>';
    }
    return c.notes.map(function (n) {
      return (
        '<div class="border border-line rounded-sm p-3 bg-paper/50">' +
          '<p class="text-sm text-ink/90">' + n.text + '</p>' +
          '<p class="text-xs text-ink/40 mt-2">' + n.author + ', ' + fmtDate(n.date) + '</p>' +
        '</div>'
      );
    }).join('<div class="h-2"></div>');
  }

  function factRow(label, value) {
    return '<div><p class="text-xs text-ink/40">' + label + '</p><p class="text-sm text-ink mt-0.5">' + value + '</p></div>';
  }

  function renderDossierContent(c) {
    var stage = STAGE_BY_KEY[c.stage];
    var content = document.getElementById('dossierContent');
    content.innerHTML =
      '<div class="flex items-start gap-3">' +
        '<span class="w-12 h-12 rounded-full bg-ink text-white text-base font-medium flex items-center justify-center shrink-0">' + initials(c.name) + '</span>' +
        '<div class="min-w-0">' +
          '<p class="font-serif text-xl font-medium leading-tight">' + c.name + '</p>' +
          '<p class="text-sm text-ink/60 mt-0.5">' + c.title + ' at ' + c.company + '</p>' +
          '<span class="inline-block text-xs text-white rounded-sm px-2 py-0.5 mt-2" style="background-color:' + stage.color + '">' + stage.label + '</span>' +
        '</div>' +
      '</div>' +

      '<div class="grid grid-cols-2 gap-4 mt-6">' +
        factRow('Recruiter', c.recruiter) +
        factRow('Source', c.source) +
        factRow('Fit rating', '') +
        factRow('Applied', fmtDate(c.history[0].date)) +
      '</div>' +

      '<div class="mt-6 pt-5 border-t border-line">' +
        '<p class="text-sm font-medium mb-3">Contact</p>' +
        '<div class="space-y-1.5 text-sm text-ink/80">' +
          '<p>' + c.email + '</p>' +
          '<p>' + c.phone + '</p>' +
          '<p>' + c.linkedin + '</p>' +
        '</div>' +
      '</div>' +

      '<div class="mt-6 pt-5 border-t border-line">' +
        '<p class="text-sm font-medium mb-3">Skills</p>' +
        '<div class="flex flex-wrap gap-1.5">' +
          c.tags.map(function (t) { return '<span class="text-xs px-2 py-0.5 rounded-sm border border-line text-ink/70">' + t + '</span>'; }).join('') +
        '</div>' +
      '</div>' +

      '<div class="mt-6 pt-5 border-t border-line">' +
        '<p class="text-sm font-medium mb-3">Stage history</p>' +
        stageTimelineHtml(c) +
      '</div>' +

      '<div class="mt-2 pt-5 border-t border-line">' +
        '<p class="text-sm font-medium mb-3">Feedback</p>' +
        notesHtml(c) +
      '</div>' +

      '<div class="mt-6 pt-5 border-t border-line">' +
        '<p class="text-sm font-medium mb-3">Resume</p>' +
        '<div class="border border-line rounded-sm px-3 py-2 flex items-center justify-between">' +
          '<span class="text-sm text-ink/80 truncate">' + c.resumeFile + '</span>' +
        '</div>' +
        '<p class="text-xs text-ink/40 mt-1.5">Preview not available in this demo.</p>' +
      '</div>';

    // fit rating lives in the facts grid; render separately to reuse ratingTicks markup safely
    var ratingSlot = content.querySelectorAll('.grid > div')[2];
    ratingSlot.querySelector('p.mt-0\\.5').innerHTML = '';
    ratingSlot.querySelector('p.mt-0\\.5').appendChild(ratingTicksNode(c.rating));
  }

  function ratingTicksNode(rating) {
    var wrap = document.createElement('div');
    wrap.innerHTML = ratingTicks(rating);
    return wrap.firstChild;
  }

  function renderDossierActions(c) {
    var actions = document.getElementById('dossierActions');
    if (c.stage === 'hired') {
      actions.innerHTML = '<p class="text-sm text-ink/60">Hired on ' + fmtDate(currentStageDate(c)) + '.</p>';
      return;
    }
    if (c.stage === 'declined') {
      actions.innerHTML =
        '<button data-action="reopen" class="w-full text-sm border border-line rounded-sm py-2 hover:border-ink/40 focus-visible:outline focus-visible:outline-2 focus-visible:outline-teal-600">Reopen candidate</button>';
      return;
    }
    var idx = STAGES.map(function (s) { return s.key; }).indexOf(c.stage);
    var next = STAGES[idx + 1];
    var html = '';
    if (next) {
      html += '<button data-action="advance" class="w-full text-sm text-white rounded-sm py-2.5 bg-teal-600 hover:bg-teal-700 focus-visible:outline focus-visible:outline-2 focus-visible:outline-ink">Move to ' + next.label + '</button>';
    }
    html += '<button data-action="decline" class="w-full text-sm text-brick-600 mt-2 py-2 hover:underline focus-visible:outline focus-visible:outline-2 focus-visible:outline-teal-600">Mark as not moving forward</button>';
    actions.innerHTML = html;
  }

  function openDossier(id) {
    state.selectedId = id;
    var c = CANDIDATES.filter(function (x) { return x.id === id; })[0];
    if (!c) return;
    renderDossierContent(c);
    renderDossierActions(c);
    dossier.classList.remove('translate-x-full');
    dossier.setAttribute('aria-hidden', 'false');
    backdrop.classList.remove('opacity-0', 'pointer-events-none');
  }
  function closeDossier() {
    state.selectedId = null;
    dossier.classList.add('translate-x-full');
    dossier.setAttribute('aria-hidden', 'true');
    backdrop.classList.add('opacity-0', 'pointer-events-none');
  }

  document.getElementById('closeDossier').addEventListener('click', closeDossier);
  backdrop.addEventListener('click', closeDossier);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && state.selectedId) closeDossier();
  });

  document.getElementById('dossierActions').addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (!btn || !state.selectedId) return;
    var c = CANDIDATES.filter(function (x) { return x.id === state.selectedId; })[0];
    var action = btn.dataset.action;
    if (action === 'advance') {
      var idx = STAGES.map(function (s) { return s.key; }).indexOf(c.stage);
      var next = STAGES[idx + 1];
      moveCandidate(c, next.key);
    } else if (action === 'decline') {
      moveCandidate(c, 'declined');
    } else if (action === 'reopen') {
      moveCandidate(c, 'applied');
      c.declinedReason = undefined;
    }
    renderDossierContent(c);
    renderDossierActions(c);
    renderBoard();
  });

  // ---------- move / drag-drop / toast ----------
  function moveCandidate(c, stageKey) {
    c.stage = stageKey;
    c.history.push({ stage: stageKey, date: isoToday() });
    showToast('Moved ' + c.name + ' to ' + STAGE_BY_KEY[stageKey].label + '.');
  }
  function isoToday() {
    var y = REFERENCE_DATE.getFullYear(), m = REFERENCE_DATE.getMonth() + 1, d = REFERENCE_DATE.getDate();
    return y + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0');
  }

  var toast = document.getElementById('toast');
  var toastTimer = null;
  function showToast(message) {
    toast.querySelector('div').textContent = message;
    toast.classList.remove('opacity-0', 'translate-y-20');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toast.classList.add('opacity-0', 'translate-y-20');
    }, 2600);
  }

  var board = document.getElementById('board');

  board.addEventListener('click', function (e) {
    var card = e.target.closest('.candidate-card');
    if (card) openDossier(card.dataset.id);
  });
  board.addEventListener('keydown', function (e) {
    var card = e.target.closest('.candidate-card');
    if (card && (e.key === 'Enter' || e.key === ' ')) {
      e.preventDefault();
      openDossier(card.dataset.id);
    }
  });
  board.addEventListener('dragstart', function (e) {
    var card = e.target.closest('.candidate-card');
    if (!card) return;
    e.dataTransfer.setData('text/plain', card.dataset.id);
    card.classList.add('opacity-50');
  });
  board.addEventListener('dragend', function (e) {
    var card = e.target.closest('.candidate-card');
    if (card) card.classList.remove('opacity-50');
  });
  board.addEventListener('dragover', function (e) {
    var zone = e.target.closest('.column-body');
    if (zone) {
      e.preventDefault();
      zone.classList.add('ring-2', 'ring-teal-600/40');
    }
  });
  board.addEventListener('dragleave', function (e) {
    var zone = e.target.closest('.column-body');
    if (zone) zone.classList.remove('ring-2', 'ring-teal-600/40');
  });
  board.addEventListener('drop', function (e) {
    var zone = e.target.closest('.column-body');
    if (!zone) return;
    e.preventDefault();
    zone.classList.remove('ring-2', 'ring-teal-600/40');
    var id = e.dataTransfer.getData('text/plain');
    var c = CANDIDATES.filter(function (x) { return x.id === id; })[0];
    if (!c || c.stage === zone.dataset.stage) return;
    moveCandidate(c, zone.dataset.stage);
    renderBoard();
    if (state.selectedId === c.id) { renderDossierContent(c); renderDossierActions(c); }
  });

  // ---------- toolbar listeners ----------
  document.getElementById('searchInput').addEventListener('input', function (e) {
    state.query = e.target.value;
    renderBoard();
  });
  document.getElementById('filterRecruiter').addEventListener('change', function (e) {
    state.recruiter = e.target.value;
    renderBoard();
  });
  document.getElementById('filterSource').addEventListener('change', function (e) {
    state.source = e.target.value;
    renderBoard();
  });
  document.getElementById('filterRating').addEventListener('change', function (e) {
    state.minRating = Number(e.target.value);
    renderBoard();
  });
  document.getElementById('toggleDeclined').addEventListener('click', function () {
    state.showDeclined = !state.showDeclined;
    this.setAttribute('aria-pressed', String(state.showDeclined));
    this.classList.toggle('bg-ink', state.showDeclined);
    this.classList.toggle('text-white', state.showDeclined);
    this.classList.toggle('border-ink', state.showDeclined);
    this.textContent = state.showDeclined ? 'Hide not moving forward' : 'Show not moving forward';
    renderBoard();
  });

  renderAll();
})();
</script>
</body>
</html>
