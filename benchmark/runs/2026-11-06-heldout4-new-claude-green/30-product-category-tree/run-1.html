function fmtInt(n){return new Intl.NumberFormat('vi-VN').format(n);}
function fmtVND(n){return new Intl.NumberFormat('vi-VN',{style:'currency',currency:'VND',maximumFractionDigits:0}).format(n);}
function formatDate(iso){var p=iso.split('-');return p[2]+'/'+p[1]+'/'+p[0];}
function todayISO(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function slugify(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')||'category';}
function hashStr(s){var h=0;for(var i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0;}return h>>>0;}
function seededRandom(seed){var a=seed;return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}

function totalCount(node){
  var sum=node.ownCount;
  for(var i=0;i<node.children.length;i++) sum+=totalCount(node.children[i]);
  return sum;
}
function findNode(id,nodes,path){
  nodes=nodes||CATEGORIES; path=path||[];
  for(var i=0;i<nodes.length;i++){
    var n=nodes[i];
    if(n.id===id) return {node:n,path:path};
    var found=findNode(id,n.children,path.concat([n]));
    if(found.node) return found;
  }
  return {node:null,path:[]};
}
function getContainerOf(id){
  function search(nodes,parent){
    for(var i=0;i<nodes.length;i++){
      if(nodes[i].id===id) return {array:nodes,index:i,parent:parent};
      var r=search(nodes[i].children,nodes[i]);
      if(r) return r;
    }
    return null;
  }
  return search(CATEGORIES,null);
}
function flattenAll(nodes){
  nodes=nodes||CATEGORIES;
  var out=[];
  for(var i=0;i<nodes.length;i++){
    out.push(nodes[i]);
    out=out.concat(flattenAll(nodes[i].children));
  }
  return out;
}
function collectDescendantIds(node){

}

function productsFor(node){
  var n=Math.min(4,node.ownCount);
  if(n<=0) return [];
  var rnd=seededRandom(hashStr(node.id));
  var adjectives=['Pro','Lite','Max','Plus','Classic','Mini','Air','Ultra','Essential','Studio'];
  var out=[];
  for(var i=0;i<n;i++){
    var adj=adjectives[Math.floor(rnd()*adjectives.length)];
    var num=100+Math.floor(rnd()*900);
    var price=Math.round((50000+rnd()*4500000)/1000)*1000;
    var roll=rnd();
    var stock=roll<0.08?'Out of stock':roll<0.22?'Low stock':'In stock';
    out.push({name:node.name+' '+adj+' '+num,sku:node.slug.slice(0,4).toUpperCase()+'-'+num,price:price,stock:stock});
  }
  return out;
}

function highlightMatch(text,query){
  var idx=text.toLowerCase().indexOf(query.toLowerCase());
  if(idx===-1) return escapeHtml(text);
  return escapeHtml(text.slice(0,idx))+'<mark>'+escapeHtml(text.slice(idx,idx+query.length))+'</mark>'+escapeHtml(text.slice(idx+query.length));
}
function markMatches(node,query,matchSet){
  var any=false;
  for(var i=0;i<node.children.length;i++){
    if(markMatches(node.children[i],query,matchSet)) any=true;
  }
  var selfMatch=node.name.toLowerCase().indexOf(query.toLowerCase())!==-1;
  if(selfMatch||any) matchSet.add(node.id);
  return selfMatch||any;
}

function rowHTML(node,level,posinset,setsize,parentId,matchSet){
  var hasChildren=node.children.length>0;
  var isSearching=!!searchQuery;
  var isExpanded=isSearching?true:expandedIds.has(node.id);

  var selClasses=isSelected?'bg-blue-50 text-blue-900':'hover:bg-slate-100 text-slate-800';
  var html='<div role="treeitem" id="row-'+node.id+'" data-id="'+node.id+'" data-parent="'+(parentId||'')+'" data-haschildren="'+hasChildren+'" aria-level="'+(level+1)+'" aria-posinset="'+posinset+'" aria-setsize="'+setsize+'"'+
    (hasChildren?' aria-expanded="'+isExpanded+'"':'')+
    ' aria-selected="'+isSelected+'" tabindex="'+(node.id===treeFocusId?0:-1)+'"'+
    ' class="tree-row flex h-9 cursor-pointer items-center rounded-sm pr-2 text-sm '+selClasses+'" style="padding-left:'+indent+'px">'+
    '<button type="button" tabindex="-1" aria-hidden="true" class="chevron-btn flex size-6 shrink-0 items-center justify-center text-slate-500" style="'+(hasChildren?'':'visibility:hidden')+'">'+
      '<svg class="size-4 transition-transform '+(isExpanded?'rotate-90':'')+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>'+
    '</button>'+
    '<span class="min-w-0 flex-1 truncate" title="'+escapeHtml(node.name)+'">'+nameHtml+'</span>'+
    (node.status==='inactive'?'<span class="ml-2 shrink-0 rounded-full bg-slate-100 px-2 py-0.5 text-xs font-medium text-slate-600">Inactive</span>':'')+
    '<span class="ml-2 w-14 shrink-0 text-right text-xs tabular-nums text-slate-500">'+fmtInt(total)+'</span>'+
  '</div>';
  if(hasChildren&&isExpanded){
    var kids=isSearching?node.children.filter(function(c){return matchSet.has(c.id);}):node.children;
    var group='';
    kids.forEach(function(c,i){group+=rowHTML(c,level+1,i+1,kids.length,node.id,matchSet);});
    html+='<div role="group">'+group+'</div>';
  }
  return html;
}

function renderTree(){
  var container=document.getElementById('tree-root');
  var status=document.getElementById('tree-count-status');
  if(appState==='loading'){container.innerHTML=treeSkeletonHTML();status.textContent='';return;}
  if(appState==='error'){container.innerHTML=treeErrorHTML();status.textContent='';var rb=document.getElementById('tree-retry');if(rb) rb.addEventListener('click',retryLoad);return;}
  if(appState==='empty'){container.innerHTML=treeEmptyHTML();status.textContent='0 categories';var eb=document.getElementById('tree-empty-add');if(eb) eb.addEventListener('click',function(){openCategoryPanel(null);});return;}
  if(searchQuery){
    var matchSet=new Set();
    CATEGORIES.forEach(function(n){markMatches(n,searchQuery,matchSet);});
    var matchCount=0;
    matchSet.forEach(function(id){var n=findNode(id).node;if(n&&n.name.toLowerCase().indexOf(searchQuery.toLowerCase())!==-1) matchCount++;});
    if(matchSet.size===0){
      container.innerHTML=treeNoMatchHTML(searchQuery);
      var cb=document.getElementById('tree-clear-search');
      if(cb) cb.addEventListener('click',clearSearch);
      status.textContent='0 of '+fmtInt(TOTAL_CATEGORY_COUNT)+' categories match';
      return;
    }
    var roots=CATEGORIES.filter(function(n){return matchSet.has(n.id);});
    var html='';
    roots.forEach(function(n,i){html+=rowHTML(n,0,i+1,roots.length,null,matchSet);});
    container.innerHTML=html;
    status.textContent=matchCount+' of '+fmtInt(TOTAL_CATEGORY_COUNT)+' categories match “'+searchQuery+'”';
  } else {
    var html2='';
    CATEGORIES.forEach(function(n,i){html2+=rowHTML(n,0,i+1,CATEGORIES.length,null,null);});
    container.innerHTML=html2;
    status.textContent=ROOT_COUNT+' root categories · '+fmtInt(TOTAL_CATEGORY_COUNT)+' total';
  }
  syncTreeTabindex();
}

function onTreeKeydown(e){
  var container=document.getElementById('tree-root');
  var rows=Array.prototype.slice.call(container.querySelectorAll('[role="treeitem"]'));
  if(!rows.length) return;
  var currentId=treeFocusId||rows[0].dataset.id;
  var i=rows.findIndex(function(r){return r.dataset.id===currentId;});
  if(i===-1) i=0;
  var r=rows[i];
  function go(id){if(id){e.preventDefault();focusTreeRow(id);}}
  switch(e.key){
    case 'ArrowDown': return go(rows[i+1]&&rows[i+1].dataset.id);
    case 'ArrowUp': return go(rows[i-1]&&rows[i-1].dataset.id);
    case 'Home': return go(rows[0].dataset.id);
    case 'End': return go(rows[rows.length-1].dataset.id);
    case 'ArrowRight': {
      e.preventDefault();
      var hasChildren=r.dataset.haschildren==='true';
      var expanded=r.getAttribute('aria-expanded')==='true';
      if(hasChildren&&!expanded){expandNode(r.dataset.id);return;}
      var next=rows[i+1];
      if(hasChildren&&expanded&&next&&next.dataset.parent===r.dataset.id) focusTreeRow(next.dataset.id);
      return;
    }
    case 'ArrowLeft': {
      e.preventDefault();
      var exp=r.getAttribute('aria-expanded')==='true';
      if(exp){collapseNode(r.dataset.id);return;}
      if(r.dataset.parent) focusTreeRow(r.dataset.parent);
      return;
    }
    case 'Enter': case ' ':
      e.preventDefault();
      guardNavigation(function(){selectCategory(r.dataset.id);});
      return;
    case '*': {
      e.preventDefault();
      var parentId=r.dataset.parent;
      rows.filter(function(x){return x.dataset.parent===parentId&&x.dataset.haschildren==='true';}).forEach(function(x){expandedIds.add(x.dataset.id);});
      saveExpanded();treeFocusId=r.dataset.id;pendingTreeFocus=true;renderTree();
      return;
    }
    default:
      if(e.key.length===1&&/\S/.test(e.key)){
        var ordered=rows.slice(i+1).concat(rows.slice(0,i+1));
        var match=ordered.find(function(x){return x.textContent.trim().toLowerCase().indexOf(e.key.toLowerCase())===0;});
        if(match) go(match.dataset.id);
      }
  }
}

function pathHTML(path,node,clickable){

function renderDetail(){
  var panel=document.getElementById('detail-panel');
  if(appState==='loading'){panel.innerHTML=detailSkeletonHTML();return;}
  if(appState==='error'){panel.innerHTML=detailErrorHTML();var rb=document.getElementById('detail-retry');if(rb) rb.addEventListener('click',retryLoad);return;}
  if(appState==='empty'){panel.innerHTML=detailEmptyHTML();var eb=document.getElementById('detail-empty-add');if(eb) eb.addEventListener('click',function(){openCategoryPanel(null);});return;}
  if(!selectedId){
    panel.innerHTML=detailNoSelectionHTML();
    var nb=document.getElementById('detail-noselect-add');
    if(nb) nb.addEventListener('click',function(){openCategoryPanel(null);});
    return;
  }
  var r=findNode(selectedId);
  if(!r.node){selectedId=null;location.hash='';return;}
  if(editing){renderDetailEdit(r.node,r.path);return;}
  renderDetailRead(r.node,r.path);
}

    products.forEach(function(p){
      productsSection+='<tr class="h-10"><td class="truncate pr-2">'+escapeHtml(p.name)+'</td><td class="pr-2 text-slate-500">'+escapeHtml(p.sku)+'</td>'+

    });
    productsSection+='</tbody></table></div>';
  }
  productsSection+='</section>';

  var activity='<p class="mt-6 text-xs text-slate-500">Last changed by '+escapeHtml(node.updatedBy)+' on '+formatDate(node.updatedAt)+'</p>';

  panel.innerHTML=
    '<nav aria-label="Breadcrumb" class="text-sm text-slate-500">'+pathHTML(path,node,true)+'</nav>'+
    '<div class="mt-2 flex flex-wrap items-start justify-between gap-3">'+
      '<div class="flex items-center gap-2">'+
        '<h2 class="text-xl font-semibold text-slate-900">'+escapeHtml(node.name)+'</h2>'+

      '</div>'+
      '<div class="flex items-center gap-2">'+

        '<div class="relative">'+
          '<button type="button" id="btn-overflow" aria-haspopup="menu" aria-expanded="false" aria-label="More actions for '+escapeHtml(node.name)+'" class="inline-flex size-8 items-center justify-center rounded-md border border-slate-300 bg-white hover:bg-slate-50">'+
            '<svg class="size-4" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>'+

            '<button type="button" role="menuitem" id="act-add-sub" class="flex h-9 w-full items-center px-3 text-left text-sm hover:bg-slate-50">Add subcategory</button>'+

            '<div class="my-1 border-t border-slate-100"></div>'+
            '<button type="button" role="menuitem" id="act-toggle-status" class="flex h-9 w-full items-center px-3 text-left text-sm hover:bg-slate-50">'+(node.status==='active'?'Deactivate category':'Activate category')+'</button>'+
            '<div class="my-1 border-t border-slate-100"></div>'+

          '</div>'+

      '</div>'+
    '</div>'+
    '<div class="mt-4">'+figures+'</div>'+
    detailsSection+
    productsSection+
    activity;

  panel.querySelectorAll('[data-goto]').forEach(function(b){
    b.addEventListener('click',function(){guardNavigation(function(){selectCategory(b.dataset.goto);});});
  });
  panel.querySelectorAll('[data-noop]').forEach(function(a){a.addEventListener('click',function(e){e.preventDefault();});});
  document.getElementById('btn-edit').addEventListener('click',function(){enterEdit(node);});
  var overflowBtn=document.getElementById('btn-overflow');
  var overflowMenu=document.getElementById('overflow-menu');
  overflowBtn.addEventListener('click',function(e){
    e.stopPropagation();
    var open=!overflowMenu.hidden;
    overflowMenu.hidden=open;
    overflowBtn.setAttribute('aria-expanded',String(!open));
  });
  document.getElementById('act-add-sub').addEventListener('click',function(){overflowMenu.hidden=true;guardNavigation(function(){openCategoryPanel(node.id);});});
  document.getElementById('act-move').addEventListener('click',function(){overflowMenu.hidden=true;openMovePanel(node);});
  document.getElementById('act-toggle-status').addEventListener('click',function(){overflowMenu.hidden=true;toggleStatus(node.id);});

document.addEventListener('click',function(){
  var m=document.getElementById('overflow-menu');
  if(m&&!m.hidden){m.hidden=true;var b=document.getElementById('btn-overflow');if(b) b.setAttribute('aria-expanded','false');}
});
function toggleStatus(id){
  var node=findNode(id).node;
  var prev=node.status;
  var next=prev==='active'?'inactive':'active';
  node.status=next;node.updatedBy='You';node.updatedAt=todayISO();
  renderTree();renderDetail();
  var verb=next==='inactive'?'deactivated':'activated';
  showToast('Category '+node.name+' '+verb,{actionLabel:'Undo',onAction:function(){
    node.status=prev;renderTree();renderDetail();
  }});
}
function openDeleteDialog(node){
  var blockedChildren=node.children.length>0;
  var blockedProducts=node.ownCount>0;
  if(blockedChildren||blockedProducts){
    var reason;
    if(blockedChildren&&blockedProducts){
      reason='Can’t delete <strong>'+escapeHtml(node.name)+'</strong>: it has '+fmtInt(node.children.length)+' subcategories and '+fmtInt(node.ownCount)+' products assigned directly. Move or remove them first.';
    } else if(blockedChildren){
      reason='Can’t delete <strong>'+escapeHtml(node.name)+'</strong>: it has '+fmtInt(node.children.length)+' subcategories. Move or delete them first.';
    } else {
      reason='Can’t delete <strong>'+escapeHtml(node.name)+'</strong>: '+fmtInt(node.ownCount)+' products are assigned directly to it. Reassign or remove them first.';
    }
    openInfoDialog('Can’t delete this category',reason);
    return;
  }
  openConfirm({
    title:'Delete category '+node.name+'?',
    body:'This cannot be undone.',
    confirmLabel:'Delete category',
    cancelLabel:'Cancel',
    destructive:true,
    onConfirm:function(){
      var c=getContainerOf(node.id);
      c.array.splice(c.index,1);
      if(selectedId===node.id){selectedId=null;location.hash='';}
      renderTree();renderDetail();
      showToast('Category '+node.name+' deleted');
    }
  });
}
function enterEdit(node){
  editing=true;
  editDirty=false;
  editOriginal={name:node.name,slug:node.slug,description:node.description,displayOrder:node.displayOrder,status:node.status};
  renderDetail();
}
function renderDetailEdit(node,path){
  var panel=document.getElementById('detail-panel');
  var parentPath=path.length?path.map(function(a){return a.name;}).join(' / '):'— (root category)';
  panel.innerHTML=
    '<nav aria-label="Breadcrumb" class="text-sm text-slate-500">'+pathHTML(path,node,false)+'</nav>'+
    '<h2 class="mt-2 text-xl font-semibold text-slate-900">Edit '+escapeHtml(node.name)+'</h2>'+
    '<p class="mt-1 text-sm text-slate-500"><span aria-hidden="true">*</span> Required</p>'+
    '<div id="edit-summary" role="status"></div>'+
    '<form id="edit-form" novalidate class="mt-4 space-y-5">'+
      '<div class="max-w-md space-y-1"><label for="edit-name" class="block text-sm font-medium">Name <span aria-hidden="true">*</span></label>'+
        '<input id="edit-name" type="text" class="h-8 w-full rounded-md border border-slate-300 px-2 text-sm focus:border-blue-700 focus:outline-none focus:ring-1 focus:ring-blue-700" value="'+escapeHtml(node.name)+'" aria-required="true">'+
        '<p id="edit-name-error" class="hidden items-center gap-1 text-sm text-red-600"></p></div>'+
      '<div class="max-w-md space-y-1"><label for="edit-slug" class="block text-sm font-medium">URL slug <span aria-hidden="true">*</span></label>'+
        '<input id="edit-slug" type="text" class="h-8 w-full rounded-md border border-slate-300 px-2 text-sm focus:border-blue-700 focus:outline-none focus:ring-1 focus:ring-blue-700" value="'+escapeHtml(node.slug)+'" aria-required="true" aria-describedby="edit-slug-help">'+
        '<p id="edit-slug-help" class="text-sm text-slate-500">Used in the storefront URL, e.g. /category/'+escapeHtml(node.slug)+'</p>'+
        '<p id="edit-slug-error" class="hidden items-center gap-1 text-sm text-red-600"></p></div>'+
      '<div class="max-w-xl space-y-1"><label for="edit-description" class="block text-sm font-medium">Description</label>'+
        '<textarea id="edit-description" rows="3" class="w-full rounded-md border border-slate-300 px-2 py-1.5 text-sm focus:border-blue-700 focus:outline-none focus:ring-1 focus:ring-blue-700">'+escapeHtml(node.description||'')+'</textarea></div>'+
      '<div class="w-28 space-y-1"><label for="edit-order" class="block text-sm font-medium">Display order <span aria-hidden="true">*</span></label>'+
        '<input id="edit-order" type="number" min="0" step="1" class="h-8 w-full rounded-md border border-slate-300 px-2 text-sm tabular-nums focus:border-blue-700 focus:outline-none focus:ring-1 focus:ring-blue-700" value="'+node.displayOrder+'" aria-required="true">'+
        '<p id="edit-order-error" class="hidden items-center gap-1 text-sm text-red-600"></p></div>'+
      '<div class="max-w-xs space-y-1"><label for="edit-status" class="block text-sm font-medium">Status</label>'+
        '<select id="edit-status" class="h-8 w-full rounded-md border border-slate-300 px-2 text-sm focus:border-blue-700 focus:outline-none focus:ring-1 focus:ring-blue-700">'+
          '<option value="active"'+(node.status==='active'?' selected':'')+'>Active</option>'+
          '<option value="inactive"'+(node.status==='inactive'?' selected':'')+'>Inactive</option>'+
        '</select></div>'+
      '<div class="max-w-md space-y-1"><p class="block text-sm font-medium text-slate-500">Parent category</p>'+
        '<p class="text-sm text-slate-700">'+escapeHtml(parentPath)+'</p>'+
        '<p class="text-sm text-slate-400">Change the parent with Move to…</p></div>'+
      '<div class="flex items-center justify-end gap-3 border-t border-slate-200 pt-3">'+
        '<span role="status" id="edit-dirty" class="text-sm text-slate-500"></span>'+
        '<button type="button" id="edit-cancel" class="inline-flex h-8 items-center rounded-md border border-slate-300 bg-white px-3 text-sm font-medium text-slate-700 hover:bg-slate-50">Cancel</button>'+
        '<button type="submit" id="edit-save" class="inline-flex h-8 items-center rounded-md bg-blue-700 px-3 text-sm font-medium text-white hover:bg-blue-800">Save category</button>'+
      '</div>'+
    '</form>';

  var form=document.getElementById('edit-form');
  var nameEl=document.getElementById('edit-name');
  var slugEl=document.getElementById('edit-slug');
  var orderEl=document.getElementById('edit-order');
  var statusEl=document.getElementById('edit-status');
  var descEl=document.getElementById('edit-description');
  var dirtyEl=document.getElementById('edit-dirty');

  function fieldError(id,msg){
    var el=document.getElementById(id+'-error');
    var input=document.getElementById(id);
    if(msg){
      el.textContent=msg;el.classList.remove('hidden');el.classList.add('flex');
      input.setAttribute('aria-invalid','true');input.setAttribute('aria-describedby',id+'-error');
      input.classList.add('border-red-600');
    } else {
      el.textContent='';el.classList.add('hidden');el.classList.remove('flex');
      input.removeAttribute('aria-invalid');
      input.classList.remove('border-red-600');
    }
  }
  function validateName(){
    if(!nameEl.value.trim()){fieldError('edit-name','Enter a category name');return false;}
    fieldError('edit-name',null);return true;
  }
  function validateSlug(){
    var v=slugEl.value.trim();
    if(!v){fieldError('edit-slug','Enter a URL slug');return false;}
    if(!/^[a-z0-9]+(-[a-z0-9]+)*$/.test(v)){fieldError('edit-slug','Use lowercase letters, numbers and hyphens');return false;}
    var dup=flattenAll().some(function(n){return n.id!==node.id&&n.slug===v;});
    if(dup){fieldError('edit-slug','Slug “'+v+'” is already used by another category');return false;}
    fieldError('edit-slug',null);return true;
  }
  function validateOrder(){
    var v=orderEl.value;
    if(v===''||isNaN(v)||parseInt(v,10)<0){fieldError('edit-order','Enter a whole number, 0 or more');return false;}
    fieldError('edit-order',null);return true;
  }
  function updateDirty(){
    var current={name:nameEl.value,slug:slugEl.value,description:descEl.value,displayOrder:parseInt(orderEl.value||'0',10),status:statusEl.value};
    editDirty=JSON.stringify(current)!==JSON.stringify(editOriginal);
    dirtyEl.innerHTML=editDirty?'<span aria-hidden="true" class="mr-1.5 inline-block size-1.5 rounded-full bg-amber-500"></span>Unsaved changes':'';
  }
  nameEl.addEventListener('blur',validateName);
  slugEl.addEventListener('blur',validateSlug);
  orderEl.addEventListener('blur',validateOrder);
  [nameEl,slugEl,descEl,orderEl,statusEl].forEach(function(el){
    el.addEventListener('input',function(){
      updateDirty();
      if(el===nameEl&&nameEl.getAttribute('aria-invalid')) validateName();
      if(el===slugEl&&slugEl.getAttribute('aria-invalid')) validateSlug();
      if(el===orderEl&&orderEl.getAttribute('aria-invalid')) validateOrder();
    });
    el.addEventListener('change',updateDirty);
  });

  window.onbeforeunload=function(e){if(editing&&editDirty){e.preventDefault();e.returnValue='';}};

  document.getElementById('edit-cancel').addEventListener('click',function(){
    if(editDirty){
      openConfirm({title:'You have unsaved changes',body:'Leave without saving?',confirmLabel:'Leave page',cancelLabel:'Stay',destructive:true,onConfirm:function(){
        editing=false;editDirty=false;editOriginal=null;window.onbeforeunload=null;renderDetail();
      }});
    } else {
      editing=false;editOriginal=null;window.onbeforeunload=null;renderDetail();
    }
  });

  form.addEventListener('submit',function(e){
    e.preventDefault();
    var okName=validateName(),okSlug=validateSlug(),okOrder=validateOrder();
    var errs=[];
    if(!okName) errs.push(['edit-name','Name']);
    if(!okSlug) errs.push(['edit-slug','URL slug']);
    if(!okOrder) errs.push(['edit-order','Display order']);
    var summary=document.getElementById('edit-summary');
    if(errs.length>=3){
      summary.innerHTML='<div class="mt-3 rounded-md border border-red-200 bg-red-50 p-3 text-sm text-red-800"><p class="font-medium">'+errs.length+' fields need attention</p>'+
        '<ul class="mt-1 list-disc pl-5">'+errs.map(function(f){return '<li><a href="#'+f[0]+'" class="underline" data-jump="'+f[0]+'">'+f[1]+': see field</a></li>';}).join('')+'</ul></div>';
      summary.querySelectorAll('[data-jump]').forEach(function(a){a.addEventListener('click',function(e2){e2.preventDefault();document.getElementById(a.dataset.jump).focus();});});
    } else {
      summary.innerHTML='';
    }
    if(!okName||!okSlug||!okOrder){
      var firstBad=!okName?nameEl:(!okSlug?slugEl:orderEl);
      firstBad.focus();
      return;
    }
    node.name=nameEl.value.trim();
    node.slug=slugEl.value.trim();
    node.description=descEl.value.trim();
    node.displayOrder=parseInt(orderEl.value,10);
    node.status=statusEl.value;
    node.updatedBy='You';
    node.updatedAt=todayISO();
    editing=false;editDirty=false;editOriginal=null;
    window.onbeforeunload=null;
    renderTree();
    renderDetail();
    showToast('Category '+node.name+' saved');
  });
}
function openCategoryPanel(parentId){

  var html=
    '<div class="flex h-14 shrink-0 items-center justify-between border-b border-slate-200 px-5">'+
      '<h2 class="text-base font-semibold text-slate-900">'+(parentNode?'Add subcategory':'Add category')+'</h2>'+
      '<button type="button" data-close-overlay aria-label="Close panel" class="flex size-8 items-center justify-center rounded hover:bg-slate-100"><svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>'+
    '</div>'+
    '<div class="min-h-0 flex-1 overflow-y-auto px-5 py-4">'+
      '<p class="text-sm text-slate-500"><span aria-hidden="true">*</span> Required</p>'+
      '<div id="add-summary" role="status"></div>'+
      '<form id="add-form" novalidate class="mt-3 space-y-5">'+
        '<div class="space-y-1"><label for="add-name" class="block text-sm font-medium">Name <span aria-hidden="true">*</span></label>'+
          '<input id="add-name" data-autofocus type="text" placeholder="e.g. Running shoes" class="h-8 w-full rounded-md border border-slate-300 px-2 text-sm focus:border-blue-700 focus:outline-none focus:ring-1 focus:ring-blue-700" aria-required="true">'+
          '<p id="add-name-error" class="hidden items-center gap-1 text-sm text-red-600"></p></div>'+
        '<div class="space-y-1"><label for="add-slug" class="block text-sm font-medium">URL slug <span aria-hidden="true">*</span></label>'+
          '<input id="add-slug" type="text" placeholder="running-shoes" class="h-8 w-full rounded-md border border-slate-300 px-2 text-sm focus:border-blue-700 focus:outline-none focus:ring-1 focus:ring-blue-700" aria-required="true">'+
          '<p id="add-slug-error" class="hidden items-center gap-1 text-sm text-red-600"></p></div>'+
        '<div class="space-y-1"><label for="add-description" class="block text-sm font-medium">Description</label>'+
          '<textarea id="add-description" rows="3" class="w-full rounded-md border border-slate-300 px-2 py-1.5 text-sm focus:border-blue-700 focus:outline-none focus:ring-1 focus:ring-blue-700"></textarea></div>'+
        '<div class="w-28 space-y-1"><label for="add-order" class="block text-sm font-medium">Display order <span aria-hidden="true">*</span></label>'+
          '<input id="add-order" type="number" min="0" step="1" value="'+(siblingCount+1)+'" class="h-8 w-full rounded-md border border-slate-300 px-2 text-sm tabular-nums focus:border-blue-700 focus:outline-none focus:ring-1 focus:ring-blue-700" aria-required="true">'+
          '<p id="add-order-error" class="hidden items-center gap-1 text-sm text-red-600"></p></div>'+
        '<div class="space-y-1"><p class="block text-sm font-medium text-slate-500">Parent category</p><p class="text-sm text-slate-700">'+escapeHtml(parentPath)+'</p></div>'+
      '</form>'+
    '</div>'+
    '<div class="flex shrink-0 items-center justify-end gap-3 border-t border-slate-200 bg-white px-5 py-3">'+
      '<span role="status" id="add-dirty" class="mr-auto text-sm text-slate-500"></span>'+
      '<button type="button" data-close-overlay class="inline-flex h-8 items-center rounded-md border border-slate-300 bg-white px-3 text-sm font-medium text-slate-700 hover:bg-slate-50">Cancel</button>'+
      '<button type="submit" form="add-form" class="inline-flex h-8 items-center rounded-md bg-blue-700 px-3 text-sm font-medium text-white hover:bg-blue-800">Create category</button>'+
    '</div>';

  var dirty=false;
  var overlay=openOverlay(html,function(){return dirty;});
  var nameEl=document.getElementById('add-name');
  var slugEl=document.getElementById('add-slug');
  var orderEl=document.getElementById('add-order');
  var descEl=document.getElementById('add-description');
  var dirtyEl=document.getElementById('add-dirty');
  var slugTouched=false;

  function fieldError(id,msg){
    var el=document.getElementById(id+'-error');
    var input=document.getElementById(id);
    if(msg){el.textContent=msg;el.classList.remove('hidden');el.classList.add('flex');input.setAttribute('aria-invalid','true');input.classList.add('border-red-600');}
    else{el.textContent='';el.classList.add('hidden');el.classList.remove('flex');input.removeAttribute('aria-invalid');input.classList.remove('border-red-600');}
  }
  function validateName(){if(!nameEl.value.trim()){fieldError('add-name','Enter a category name');return false;}fieldError('add-name',null);return true;}
  function validateSlug(){
    var v=slugEl.value.trim();
    if(!v){fieldError('add-slug','Enter a URL slug');return false;}
    if(!/^[a-z0-9]+(-[a-z0-9]+)*$/.test(v)){fieldError('add-slug','Use lowercase letters, numbers and hyphens');return false;}
    fieldError('add-slug',null);return true;
  }
  function validateOrder(){
    var v=orderEl.value;
    if(v===''||isNaN(v)||parseInt(v,10)<0){fieldError('add-order','Enter a whole number, 0 or more');return false;}
    fieldError('add-order',null);return true;
  }
  function markDirty(){
    dirty=!!(nameEl.value||slugEl.value.length&&slugTouched||descEl.value);
    dirtyEl.innerHTML=dirty?'<span aria-hidden="true" class="mr-1.5 inline-block size-1.5 rounded-full bg-amber-500"></span>Unsaved changes':'';
    window.onbeforeunload=dirty?function(e){e.preventDefault();e.returnValue='';}:null;
  }

  nameEl.addEventListener('input',function(){
    if(!slugTouched) slugEl.value=slugify(nameEl.value);
    markDirty();
    if(nameEl.getAttribute('aria-invalid')) validateName();
  });
  slugEl.addEventListener('input',function(){slugTouched=true;markDirty();if(slugEl.getAttribute('aria-invalid')) validateSlug();});
  orderEl.addEventListener('input',function(){markDirty();if(orderEl.getAttribute('aria-invalid')) validateOrder();});
  descEl.addEventListener('input',markDirty);
  nameEl.addEventListener('blur',validateName);
  slugEl.addEventListener('blur',validateSlug);
  orderEl.addEventListener('blur',validateOrder);

  document.getElementById('add-form').addEventListener('submit',function(e){
    e.preventDefault();
    var okName=validateName(),okSlug=validateSlug(),okOrder=validateOrder();
    var errs=[];
    if(!okName) errs.push('Name');
    if(!okSlug) errs.push('URL slug');
    if(!okOrder) errs.push('Display order');
    var summary=document.getElementById('add-summary');
    summary.innerHTML=errs.length>=3?('<div class="mt-3 rounded-md border border-red-200 bg-red-50 p-3 text-sm text-red-800"><p class="font-medium">'+errs.length+' fields need attention</p><ul class="mt-1 list-disc pl-5">'+errs.map(function(l){return '<li>'+l+'</li>';}).join('')+'</ul></div>'):'';
    if(!okName||!okSlug||!okOrder){(!okName?nameEl:(!okSlug?slugEl:orderEl)).focus();return;}
    var id=uniqueIdFrom(slugEl.value.trim());
    var newNode={id:id,name:nameEl.value.trim(),slug:slugEl.value.trim(),status:'active',ownCount:0,description:descEl.value.trim(),displayOrder:parseInt(orderEl.value,10),updatedBy:'You',updatedAt:todayISO(),children:[]};
    if(parentNode) parentNode.children.push(newNode); else CATEGORIES.push(newNode);
    dirty=false;
    overlay.close();
    guardNavigation(function(){selectCategory(id);});
    showToast('Category '+newNode.name+' created');
  });
}
function openMovePanel(node){
  var excluded=new Set([node.id].concat(collectDescendantIds(node)));
  var currentParent=getContainerOf(node.id).parent;
  var candidates=flattenAll().filter(function(n){return !excluded.has(n.id);}).map(function(n){
    var p=findNode(n.id).path.concat([n]).map(function(a){return a.name;}).join(' / ');
    return {id:n.id,label:p};
  });
  candidates.unshift({id:'__root__',label:'— (root category)'});

  var html=
    '<div class="flex h-14 shrink-0 items-center justify-between border-b border-slate-200 px-5">'+
      '<h2 class="text-base font-semibold text-slate-900">Move '+escapeHtml(node.name)+'</h2>'+
      '<button type="button" data-close-overlay aria-label="Close panel" class="flex size-8 items-center justify-center rounded hover:bg-slate-100"><svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>'+
    '</div>'+
    '<div class="min-h-0 flex-1 overflow-y-auto px-5 py-4">'+
      '<p class="text-sm text-slate-500">Categories already under '+escapeHtml(node.name)+' aren’t shown, to avoid creating a loop.</p>'+
      '<div class="mt-3 space-y-1">'+
        '<label for="move-filter" class="block text-sm font-medium">New parent</label>'+
        '<input id="move-filter" data-autofocus type="text" placeholder="Search categories" class="h-8 w-full rounded-md border border-slate-300 px-2 text-sm focus:border-blue-700 focus:outline-none focus:ring-1 focus:ring-blue-700">'+
      '</div>'+
      '<div id="move-list" role="listbox" aria-label="New parent" class="mt-2 max-h-72 overflow-y-auto rounded-md border border-slate-200"></div>'+
      '<p class="mt-3 text-sm text-slate-700">Selected: <span id="move-selected" class="font-medium">none</span></p>'+
    '</div>'+
    '<div class="flex shrink-0 items-center justify-end gap-3 border-t border-slate-200 bg-white px-5 py-3">'+
      '<button type="button" data-close-overlay class="inline-flex h-8 items-center rounded-md border border-slate-300 bg-white px-3 text-sm font-medium text-slate-700 hover:bg-slate-50">Cancel</button>'+
      '<button type="button" id="move-confirm" disabled class="inline-flex h-8 items-center rounded-md bg-blue-700 px-3 text-sm font-medium text-white hover:bg-blue-800 disabled:cursor-not-allowed disabled:bg-slate-300">Move category</button>'+
    '</div>';

  var overlay=openOverlay(html,function(){return false;});
  var listEl=document.getElementById('move-list');
  var filterEl=document.getElementById('move-filter');
  var selectedEl=document.getElementById('move-selected');
  var confirmBtn=document.getElementById('move-confirm');
  var moveTarget=null;

  function renderList(query){
    var filtered=candidates.filter(function(c){return c.label.toLowerCase().indexOf((query||'').toLowerCase())!==-1;});
    if(!filtered.length){
      listEl.innerHTML='<p class="p-3 text-sm text-slate-500">No categories match “'+escapeHtml(query)+'”</p>';
      return;
    }
    listEl.innerHTML=filtered.map(function(c){
      var isCurrent=currentParent?c.id===currentParent.id:c.id==='__root__';
      return '<button type="button" role="option" aria-selected="'+(moveTarget===c.id)+'" data-id="'+c.id+'" '+(isCurrent?'disabled':'')+' class="flex h-9 w-full items-center justify-between px-3 text-left text-sm '+(moveTarget===c.id?'bg-blue-50 text-blue-900':'hover:bg-slate-50')+' disabled:cursor-not-allowed disabled:text-slate-400">'+
        '<span class="truncate">'+escapeHtml(c.label)+'</span>'+(isCurrent?'<span class="shrink-0 text-xs">Current</span>':'')+
      '</button>';
    }).join('');
    listEl.querySelectorAll('[role="option"]:not([disabled])').forEach(function(btn){
      btn.addEventListener('click',function(){
        moveTarget=btn.dataset.id;
        selectedEl.textContent=candidates.find(function(c){return c.id===moveTarget;}).label;
        confirmBtn.disabled=false;
        renderList(filterEl.value);
      });
    });
  }
  renderList('');
  filterEl.addEventListener('input',function(){renderList(filterEl.value);});
  confirmBtn.addEventListener('click',function(){
    if(!moveTarget) return;
    var c=getContainerOf(node.id);
    c.array.splice(c.index,1);
    var newParentPath;
    if(moveTarget==='__root__'){CATEGORIES.push(node);newParentPath='— (root category)';}
    else{var pnode=findNode(moveTarget).node;pnode.children.push(node);newParentPath=findNode(moveTarget).path.concat([pnode]).map(function(a){return a.name;}).join(' / ');}
    node.updatedBy='You';node.updatedAt=todayISO();
    overlay.close();
    expandAncestors(node.id);saveExpanded();
    renderTree();renderDetail();
    showToast('Category '+node.name+' moved to '+newParentPath);
  });
}
var treeRootEl=document.getElementById('tree-root');
treeRootEl.addEventListener('keydown',onTreeKeydown);
treeRootEl.addEventListener('click',function(e){
  var chevron=e.target.closest('.chevron-btn');
  var row=e.target.closest('[role="treeitem"]');
  if(!row) return;
  if(chevron){
    var hasChildren=row.dataset.haschildren==='true';
    if(!hasChildren) return;
    var expanded=row.getAttribute('aria-expanded')==='true';
    if(expanded) collapseNode(row.dataset.id); else expandNode(row.dataset.id);
    return;
  }
  guardNavigation(function(){selectCategory(row.dataset.id);});
});

document.getElementById('btn-add-root').addEventListener('click',function(){guardNavigation(function(){openCategoryPanel(null);});});
document.getElementById('btn-expand-all').addEventListener('click',function(){
  flattenAll().forEach(function(n){if(n.children.length>0) expandedIds.add(n.id);});
  saveExpanded();renderTree();
});
document.getElementById('btn-collapse-all').addEventListener('click',function(){
  expandedIds.clear();saveExpanded();renderTree();
});

var searchDebounce;
var searchInput=document.getElementById('tree-search');
var searchClear=document.getElementById('tree-search-clear');
searchInput.addEventListener('input',function(e){
  clearTimeout(searchDebounce);
  var value=e.target.value;
  searchClear.hidden=!value;
  searchDebounce=setTimeout(function(){
    if(!searchQuery&&value) expandedSnapshot=new Set(expandedIds);
    if(searchQuery&&!value&&expandedSnapshot) expandedIds=new Set(expandedSnapshot);
    searchQuery=value.trim();
    renderTree();
  },200);
});
searchClear.addEventListener('click',clearSearch);

function finishLoad(){
  appState='ready';
  var saved=loadExpanded();
  if(saved===null){expandedIds=new Set();if(CATEGORIES[0]) expandedIds.add(CATEGORIES[0].id);}
  else{expandedIds=saved;}
  var hashId=getIdFromHash();
  if(hashId&&findNode(hashId).node){
    selectedId=hashId;treeFocusId=hashId;expandAncestors(hashId);saveExpanded();
  }
  renderTree();renderDetail();
}
function init(){
  appState='loading';
  renderTree();renderDetail();
  var urlState=new URLSearchParams(location.search).get('state');
  if(urlState==='loading') return;
  setTimeout(function(){
    if(urlState==='error'){appState='error';renderTree();renderDetail();return;}
    if(urlState==='empty'){appState='empty';renderTree();renderDetail();return;}
    finishLoad();
  },450);
}
init();
</script>
</body>
</html>
