<script>

  function slugEmail(name) {
    return name.toLowerCase().replace(/[^a-z\s]/g, "").trim().split(/\s+/).join(".") + "@meridianhq.com";
  }

  function initials(name) {
    var parts = name.split(" ");
    return (parts[0][0] + (parts[parts.length - 1][0] || "")).toUpperCase();
  }

  var seqActive = 0, seqDeactivated = 0;
  var USERS = RAW_USERS.map(function (row, i) {
    var name = row[0], role = row[1], status = row[2];
    var lastSignIn = null;
    if (status === "Active") {
      lastSignIn = SIGNIN_POOL[seqActive % SIGNIN_POOL.length];
      seqActive++;
    } else if (status === "Deactivated") {
      lastSignIn = DEACTIVATED_SIGNIN[seqDeactivated % DEACTIVATED_SIGNIN.length];
      seqDeactivated++;
    }
    return {
      id: "u" + (i + 1),
      name: name,
      email: slugEmail(name),
      role: role,
      status: status,
      lastSignIn: lastSignIn
    };
  });

  /* ---------------------------------------------------------------- */
  /* Helpers                                                            */
  /* ---------------------------------------------------------------- */

  function qs(sel, root) { return (root || document).querySelector(sel); }
  function qsa(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function debounce(fn, wait) {
    var t;
    return function () {
      var args = arguments;
      clearTimeout(t);
      t = setTimeout(function () { fn.apply(null, args); }, wait);
    };
  }

  function formatDateTime(iso) {
    if (!iso) return null;
    var d = new Date(iso);
    return d.toLocaleString("en-US", { month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit" });
  }

  function relativeTime(iso) {
    if (!iso) return null;
    var d = new Date(iso);
    var now = new Date();
    var diffMs = now - d;
    var diffDay = Math.floor(diffMs / 86400000);
    if (diffDay <= 0) return "today";
    if (diffDay === 1) return "1d ago";
    if (diffDay < 30) return diffDay + "d ago";
    var diffMonth = Math.floor(diffDay / 30);
    if (diffMonth < 12) return diffMonth + "mo ago";
    return Math.floor(diffMonth / 12) + "y ago";
  }

  function focusableIn(container) {
    return qsa('a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])', container)
      .filter(function (el) { return el.offsetParent !== null; });
  }

  /* ---------------------------------------------------------------- */
  /* State                                                              */
  /* ---------------------------------------------------------------- */

  var state = {
    statusTab: "all",
    q: "",
    roles: [],           // selected role filters
    sort: { key: "lastSignIn", dir: "desc" },
    page: 1,
    pageSize: 25,
    selected: {},         // id -> true
    selectAllMatching: false,
    pageMode: "loading"   // loading | empty | error | ready
  };

  var lastFocusedBeforeModal = null;

  /* ---------------------------------------------------------------- */
  /* Status tone mapping                                                */
  /* ---------------------------------------------------------------- */

  var STATUS_TONE = {
    Active: { classes: "bg-emerald-50 text-emerald-700", dot: "bg-emerald-600" },
    Invited: { classes: "bg-blue-50 text-blue-700", dot: "bg-blue-600" },
    Deactivated: { classes: "bg-slate-100 text-slate-700", dot: "bg-slate-500" }
  };

  function statusBadge(status) {
    var t = STATUS_TONE[status];
    return '<span class="inline-flex h-6 max-w-[160px] items-center gap-1.5 whitespace-nowrap rounded-full px-2 text-xs font-medium leading-5 ' + t.classes + '">' +
      '<span class="inline-block size-1.5 shrink-0 rounded-full ' + t.dot + '" aria-hidden="true"></span>' +
      escapeHtml(status) + "</span>";
  }

  /* ---------------------------------------------------------------- */
  /* Filtering / sorting / pagination                                  */
  /* ---------------------------------------------------------------- */

  function foldText(s) { return s.toLowerCase(); }

  function getFiltered() {
    var q = foldText(state.q.trim());
    return USERS.filter(function (u) {
      if (state.statusTab !== "all" && u.status !== state.statusTab) return false;
      if (state.roles.length && state.roles.indexOf(u.role) === -1) return false;
      if (q) {
        var hay = foldText(u.name + " " + u.email);
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });
  }

  function sortRows(rows) {
    var key = state.sort.key, dir = state.sort.dir;
    var sorted = rows.slice().sort(function (a, b) {
      var av, bv;
      if (key === "name") { av = a.name.toLowerCase(); bv = b.name.toLowerCase(); }
      else { av = a.lastSignIn; bv = b.lastSignIn; }
      if (key === "lastSignIn") {
        var at = av ? new Date(av).getTime() : -Infinity;
        var bt = bv ? new Date(bv).getTime() : -Infinity;
        return dir === "asc" ? at - bt : bt - at;
      }
      if (av < bv) return dir === "asc" ? -1 : 1;
      if (av > bv) return dir === "asc" ? 1 : -1;
      return 0;
    });
    return sorted;
  }

        'aria-current="' + (active ? "true" : "false") + '">' +

    }).join("");
    qsa("button[data-tab]", nav).forEach(function (btn) {

  function skeletonRows(n) {

  function renderRows(rows) {
    return rows.map(function (u) {

      var lastSignInCell = dt
        ? '<span class="tabular-nums">' + dt + '</span> <span class="text-slate-400">· ' + rel + "</span>"
        : '<span class="text-slate-500">Never</span>';
      return '<tr class="h-10 ' + (selected ? "bg-blue-50/60" : "hover:bg-slate-50") + '">' +

        '<td class="px-3 py-0"><div class="flex items-center gap-2">' +
        '<span class="flex size-6 shrink-0 items-center justify-center rounded-full bg-slate-200 text-xs font-medium text-slate-700" aria-hidden="true">' + escapeHtml(initials(u.name)) + "</span>" +
        '<span class="truncate font-medium text-slate-900">' + escapeHtml(u.name) + "</span></div></td>" +

    }).join("");

  var currentPageRows = []; // ids currently rendered, for select-all-on-page

  function renderTable() {
    var tbody = qs("#table-body");
    var pagination = qs("#pagination");
    var bulkBar = qs("#bulk-bar");
    var filterBar = qs("#filter-bar");

    if (state.pageMode === "loading") {
      filterBar.style.visibility = "visible";
      tbody.setAttribute("aria-busy", "true");
      tbody.innerHTML = skeletonRows(9);
      pagination.innerHTML = "";
      bulkBar.hidden = true;
      qs("#result-count").textContent = "";
      return;
    }
    tbody.removeAttribute("aria-busy");

    if (state.pageMode === "empty") {
      tbody.innerHTML = emptyStateHtml();
      pagination.innerHTML = "";
      bulkBar.hidden = true;
      qs("#filter-bar").hidden = true;
      qs("#result-count").textContent = "";
      qs("#empty-invite-btn") && qs("#empty-invite-btn").addEventListener("click", openInviteDialog);
      return;
    }
    qs("#filter-bar").hidden = false;

    if (state.pageMode === "error") {
      tbody.innerHTML = errorStateHtml();
      pagination.innerHTML = "";
      bulkBar.hidden = true;
      qs("#result-count").textContent = "";
      qs("#error-retry").addEventListener("click", function () {
        setUrlState(null);
        state.pageMode = "loading";
        render();
        setTimeout(function () { state.pageMode = "ready"; render(); }, 600);
      });
      return;
    }

    // ready
    var filtered = sortRows(getFiltered());
    var total = filtered.length;
    var totalPages = Math.max(1, Math.ceil(total / state.pageSize));
    if (state.page > totalPages) state.page = totalPages;
    var start = (state.page - 1) * state.pageSize;
    var pageRows = filtered.slice(start, start + state.pageSize);
    currentPageRows = pageRows.map(function (u) { return u.id; });

    var allTotal = USERS.length;
    qs("#result-count").textContent = (getFiltered().length === allTotal) ? (allTotal + " users") : (total + " of " + allTotal + " users");
    qs("#live-status").textContent = total === 0 ? "No users match" : total + " users match";

    if (total === 0) {
      tbody.innerHTML = noResultsHtml();
      pagination.innerHTML = "";
      bulkBar.hidden = true;
      var crBtn = qs("#no-results-clear");
      if (crBtn) crBtn.addEventListener("click", function () {
        state.q = ""; state.roles = [];
        qs("#search-input").value = "";
        qs("#search-clear").hidden = true;
        resetPageAndSelection();
        render();
      });
      return;
    }

    tbody.innerHTML = renderRows(pageRows);
    wireRowEvents();

    // pagination
    var from = start + 1, to = Math.min(start + state.pageSize, total);
    pagination.innerHTML =
      '<p class="tabular-nums">' + from + "–" + to + " of " + total + "</p>" +
      '<div class="flex items-center gap-3">' +
      '<label class="flex items-center gap-1.5 text-sm">Rows per page' +
      '<select id="page-size" class="h-8 rounded border border-slate-300 bg-white px-1.5 text-sm">' +
      [25, 50, 100].map(function (n) { return '<option value="' + n + '" ' + (state.pageSize === n ? "selected" : "") + ">" + n + "</option>"; }).join("") +
      "</select></label>" +
      '<div class="flex items-center gap-1">' +
      '<button type="button" id="page-prev" ' + (state.page === 1 ? "disabled" : "") + ' aria-label="Previous page" class="flex size-8 items-center justify-center rounded border border-slate-300 bg-white text-slate-600 hover:bg-slate-50 disabled:opacity-40 disabled:hover:bg-white">' +
      '<svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg></button>' +
      '<span class="px-2 text-sm tabular-nums">Page ' + state.page + " of " + totalPages + "</span>" +
      '<button type="button" id="page-next" ' + (state.page === totalPages ? "disabled" : "") + ' aria-label="Next page" class="flex size-8 items-center justify-center rounded border border-slate-300 bg-white text-slate-600 hover:bg-slate-50 disabled:opacity-40 disabled:hover:bg-white">' +
      '<svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg></button>' +
      "</div></div>";

    qs("#page-size").addEventListener("change", function (e) {
      state.pageSize = Number(e.target.value);
      resetPageAndSelection(true);
      render();
    });
    qs("#page-prev").addEventListener("click", function () { if (state.page > 1) { state.page--; resetSelectionOnly(); render(); } });
    qs("#page-next").addEventListener("click", function () { if (state.page < totalPages) { state.page++; resetSelectionOnly(); render(); } });

    renderBulkBar(total);
    updateHeaderCheckbox();
    updateSortIcons();
  }

  /* ---------------------------------------------------------------- */
  /* Row-level interactions (checkbox, actions, overflow menu)         */
  /* ---------------------------------------------------------------- */

  function wireRowEvents() {
    qsa("input[data-row-select]").forEach(function (cb) {
      cb.addEventListener("change", function () {
        var id = cb.getAttribute("data-row-select");
        if (cb.checked) state.selected[id] = true; else { delete state.selected[id]; state.selectAllMatching = false; }
        render();
      });
    });

    qsa("button[data-action]").forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        var action = btn.getAttribute("data-action");
        var id = btn.getAttribute("data-id");
        if (action === "toggle-menu") { toggleRowMenu(id); return; }
        closeAllRowMenus();
        handleRowAction(action, id);
      });
    });
  }

  function closeAllRowMenus() {
    qsa('[data-menu-for]').forEach(function (m) { m.hidden = true; });
    qsa('button[data-action="toggle-menu"]').forEach(function (b) { b.setAttribute("aria-expanded", "false"); });
  }

  function toggleRowMenu(id) {
    var menu = qs('[data-menu-for="' + id + '"]');
    var wasHidden = menu.hidden;
    closeAllRowMenus();
    menu.hidden = !wasHidden;
    qs('button[data-action="toggle-menu"][data-id="' + id + '"]').setAttribute("aria-expanded", String(!wasHidden));
  }

  document.addEventListener("click", function () { closeAllRowMenus(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeAllRowMenus(); });

  function findUser(id) { return USERS.filter(function (u) { return u.id === id; })[0]; }

  function handleRowAction(action, id) {
    var u = findUser(id);
    if (!u) return;
    if (action === "reset-password") {
      showToast("Password reset link sent to " + u.email);
    } else if (action === "resend-invite") {
      showToast("Invitation resent to " + u.email);
    } else if (action === "reactivate") {
      u.status = "Active";
      render();
      showToast("Account for " + u.name + " reactivated");
    } else if (action === "deactivate") {
      confirmDialog({
        title: "Deactivate account for " + u.name + "?",
        body: "They'll immediately lose access and be signed out of all active sessions. You can reactivate the account at any time.",
        confirmLabel: "Deactivate account",
        destructive: true,
        onConfirm: function () {
          u.status = "Deactivated";
          delete state.selected[u.id];
          render();
          showToast("Account for " + u.name + " deactivated");
        }
      });
    } else if (action === "cancel-invite") {
      confirmDialog({
        title: "Cancel invite for " + u.name + "?",
        body: "They won't be able to accept this invitation anymore. You can invite them again later.",
        confirmLabel: "Cancel invite",
        destructive: true,
        onConfirm: function () {
          u.status = "Deactivated";
          delete state.selected[u.id];
          render();
          showToast("Invite for " + u.name + " cancelled");
        }
      });
    }
  }

  /* ---------------------------------------------------------------- */
  /* Selection / bulk bar                                              */
  /* ---------------------------------------------------------------- */

  function selectedCount() { return Object.keys(state.selected).length; }

  function resetPageAndSelection(keepPage) {
    if (!keepPage) state.page = 1;
    state.page = 1;
    state.selected = {};
    state.selectAllMatching = false;
  }
  function resetSelectionOnly() { state.selected = {}; state.selectAllMatching = false; }

  function updateHeaderCheckbox() {
    var headerCb = qs("#select-all");
    var onPageSelected = currentPageRows.filter(function (id) { return state.selected[id]; }).length;
    if (onPageSelected === 0) { headerCb.checked = false; headerCb.indeterminate = false; }
    else if (onPageSelected === currentPageRows.length) { headerCb.checked = true; headerCb.indeterminate = false; }
    else { headerCb.checked = false; headerCb.indeterminate = true; }
  }

  function renderBulkBar(totalFiltered) {
    var bar = qs("#bulk-bar");
    var count = selectedCount();
    if (count === 0) { bar.hidden = true; return; }
    bar.hidden = false;
    var countLabel = qs("#bulk-count-text");
    if (state.selectAllMatching) {
      countLabel.innerHTML = '<span class="tabular-nums">' + totalFiltered + '</span> selected (all matching)';
    } else {
      countLabel.innerHTML = '<span class="tabular-nums">' + count + "</span> selected";
    }

    var matchBtn = qs("#bulk-select-all-matching");
    var allOnPageSelected = currentPageRows.length > 0 && currentPageRows.every(function (id) { return state.selected[id]; });
    if (state.selectAllMatching) {
      matchBtn.hidden = false;
      matchBtn.textContent = "Clear selection";
      matchBtn.onclick = function () { state.selected = {}; state.selectAllMatching = false; render(); };
    } else if (allOnPageSelected && totalFiltered > currentPageRows.length) {
      matchBtn.hidden = false;
      matchBtn.textContent = "Select all " + totalFiltered + " matching";
      matchBtn.onclick = function () {
        state.selectAllMatching = true;
        getFiltered().forEach(function (u) { state.selected[u.id] = true; });
        render();
      };
    } else {
      matchBtn.hidden = true;
    }

    qs("#bulk-cancel").onclick = function () {
      state.selected = {}; state.selectAllMatching = false;
      render();
      qs("#select-all").focus();
    };

    qs("#bulk-deactivate").onclick = function () {
      var ids = Object.keys(state.selected);
      var targets = USERS.filter(function (u) { return ids.indexOf(u.id) !== -1 && u.status !== "Deactivated"; });
      if (targets.length === 0) { showToast("Selected accounts are already deactivated"); return; }
      confirmDialog({
        title: "Deactivate " + targets.length + " account" + (targets.length === 1 ? "" : "s") + "?",
        body: "They'll immediately lose access and be signed out of all active sessions. You can reactivate any of them later.",
        confirmLabel: "Deactivate " + targets.length + " account" + (targets.length === 1 ? "" : "s"),
        destructive: true,
        onConfirm: function () {
          targets.forEach(function (u) { u.status = "Deactivated"; });
          state.selected = {}; state.selectAllMatching = false;
          render();
          showToast(targets.length + " account" + (targets.length === 1 ? "" : "s") + " deactivated");
        }
      });
    };
  }

  qs("#select-all").addEventListener("change", function () {
    var checked = qs("#select-all").checked;
    currentPageRows.forEach(function (id) {
      if (checked) state.selected[id] = true; else delete state.selected[id];
    });
    if (!checked) state.selectAllMatching = false;
    render();
  });

  /* ---------------------------------------------------------------- */
  /* Sorting                                                            */
  /* ---------------------------------------------------------------- */

  function setSort(key) {
    if (state.sort.key !== key) { state.sort = { key: key, dir: "asc" }; }
    else if (state.sort.dir === "asc") { state.sort.dir = "desc"; }
    else { state.sort = { key: "lastSignIn", dir: "desc" }; }
    resetSelectionOnly();
    render();
  }
  qs("#sort-name").addEventListener("click", function () { setSort("name"); });
  qs("#sort-lastsignin").addEventListener("click", function () { setSort("lastSignIn"); });

  function updateSortIcons() {
    var nameTh = qs("#sort-name").closest("th");
    var lsTh = qs("#th-lastsignin");
    nameTh.removeAttribute("aria-sort");
    lsTh.removeAttribute("aria-sort");
    if (state.sort.key === "name") nameTh.setAttribute("aria-sort", state.sort.dir === "asc" ? "ascending" : "descending");
    if (state.sort.key === "lastSignIn") lsTh.setAttribute("aria-sort", state.sort.dir === "asc" ? "ascending" : "descending");
  }

  /* ---------------------------------------------------------------- */
  /* Search + role filter wiring                                       */
  /* ---------------------------------------------------------------- */

  var debouncedSearch = debounce(function (val) {
    state.q = val;
    resetPageAndSelection();
    render();
  }, 300);

  qs("#search-input").addEventListener("input", function (e) {
    qs("#search-clear").hidden = e.target.value.length === 0;
    debouncedSearch(e.target.value);
  });
  qs("#search-clear").addEventListener("click", function () {
    qs("#search-input").value = "";
    qs("#search-clear").hidden = true;
    state.q = "";
    resetPageAndSelection();
    render();
  });

  var roleBtn = qs("#role-filter-btn"), rolePanel = qs("#role-filter-panel");
  roleBtn.addEventListener("click", function (e) {
    e.stopPropagation();
    var opening = rolePanel.hidden;
    rolePanel.hidden = !opening;
    roleBtn.setAttribute("aria-expanded", String(opening));
    if (opening) renderRoleFilterOptions();
  });
  qs("#role-filter-done").addEventListener("click", function () { rolePanel.hidden = true; roleBtn.setAttribute("aria-expanded", "false"); roleBtn.focus(); });
  qs("#role-filter-reset").addEventListener("click", function () {
    state.roles = [];
    resetPageAndSelection();
    render();
    renderRoleFilterOptions();
  });
  document.addEventListener("click", function (e) {
    if (!rolePanel.hidden && !rolePanel.contains(e.target) && e.target !== roleBtn) {
      rolePanel.hidden = true;
      roleBtn.setAttribute("aria-expanded", "false");
    }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !rolePanel.hidden) { rolePanel.hidden = true; roleBtn.setAttribute("aria-expanded", "false"); roleBtn.focus(); }
  });

  /* ---------------------------------------------------------------- */
  /* Sidebar collapse                                                   */
  /* ---------------------------------------------------------------- */

  qs("#btn-toggle-sidebar").addEventListener("click", function () {
    var sb = qs("#sidebar");
    var collapsed = sb.classList.contains("md:w-14");
    sb.classList.toggle("md:w-14", !collapsed);
    sb.classList.toggle("md:w-60", collapsed);
    qs("#btn-toggle-sidebar").setAttribute("aria-expanded", String(collapsed));
    qsa("#sidebar nav span, #sidebar .truncate, #sidebar p").forEach(function (el) { el.hidden = !collapsed ? true : false; });
  });

  /* ---------------------------------------------------------------- */
  /* Toasts                                                             */
  /* ---------------------------------------------------------------- */

  function showToast(message) {
    var root = qs("#toast-root");
    var el = document.createElement("div");
    el.setAttribute("role", "status");
    el.className = "flex items-center gap-2 rounded-md border border-slate-200 bg-white px-3 py-2 text-sm text-slate-900 shadow-md";
    el.innerHTML = '<svg class="size-4 shrink-0 text-emerald-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>' +
      '<span>' + escapeHtml(message) + "</span>";
    root.appendChild(el);
    var timer = setTimeout(remove, 5000);
    el.addEventListener("mouseenter", function () { clearTimeout(timer); });
    el.addEventListener("mouseleave", function () { timer = setTimeout(remove, 2000); });
    function remove() { el.remove(); }
  }

  /* ---------------------------------------------------------------- */
  /* Confirm dialog (AlertDialog pattern)                               */
  /* ---------------------------------------------------------------- */

  function confirmDialog(opts) {
    lastFocusedBeforeModal = document.activeElement;
    var root = qs("#overlay-root");
    var titleId = "confirm-title-" + Date.now();
    var descId = "confirm-desc-" + Date.now();
    root.innerHTML =
      '<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 p-4" id="confirm-backdrop">' +
      '<div role="alertdialog" aria-modal="true" aria-labelledby="' + titleId + '" aria-describedby="' + descId + '" class="w-full max-w-md rounded-lg bg-white p-5 shadow-lg" id="confirm-panel">' +
      '<h2 id="' + titleId + '" class="text-base font-semibold text-slate-900">' + escapeHtml(opts.title) + "</h2>" +
      '<p id="' + descId + '" class="mt-2 text-sm text-slate-600">' + escapeHtml(opts.body) + "</p>" +
      '<div class="mt-5 flex justify-end gap-3">' +
      '<button type="button" id="confirm-cancel" class="h-8 rounded border border-slate-300 bg-white px-3 text-sm font-medium text-slate-700 hover:bg-slate-50">' + (opts.cancelLabel || "Cancel") + "</button>" +
      '<button type="button" id="confirm-ok" class="h-8 rounded px-3 text-sm font-medium text-white ' + (opts.destructive ? "bg-red-600 hover:bg-red-700" : "bg-blue-700 hover:bg-blue-800") + '">' + escapeHtml(opts.confirmLabel) + "</button>" +
      "</div></div></div>";

    function close() {
      root.innerHTML = "";
      document.removeEventListener("keydown", onKeydown);
      if (lastFocusedBeforeModal && lastFocusedBeforeModal.focus) lastFocusedBeforeModal.focus();
    }
    function onKeydown(e) {
      if (e.key === "Escape") { close(); return; }
      if (e.key === "Tab") {
        var items = focusableIn(qs("#confirm-panel"));
        if (items.length === 0) return;
        var first = items[0], last = items[items.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    }
    document.addEventListener("keydown", onKeydown);
    qs("#confirm-backdrop").addEventListener("mousedown", function (e) { if (e.target.id === "confirm-backdrop") close(); });
    qs("#confirm-cancel").addEventListener("click", close);
    qs("#confirm-ok").addEventListener("click", function () {
      var btn = qs("#confirm-ok");
      btn.disabled = true;
      btn.innerHTML = '<svg class="size-4 animate-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9"/></svg>';
      setTimeout(function () { opts.onConfirm(); close(); }, 300);
    });
    qs("#confirm-cancel").focus();
  }

  /* ---------------------------------------------------------------- */
  /* Invite user dialog (form)                                         */
  /* ---------------------------------------------------------------- */

  function openInviteDialog() {
    lastFocusedBeforeModal = document.activeElement;
    var root = qs("#overlay-root");
    var titleId = "invite-title";
    root.innerHTML =
      '<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 p-4" id="invite-backdrop">' +
      '<div role="dialog" aria-modal="true" aria-labelledby="' + titleId + '" class="w-full max-w-md rounded-lg bg-white p-5 shadow-lg" id="invite-panel">' +
      '<div class="flex items-start justify-between">' +
      '<h2 id="' + titleId + '" class="text-base font-semibold text-slate-900">Invite user</h2>' +
      '<button type="button" id="invite-close" aria-label="Close" class="flex size-7 items-center justify-center rounded text-slate-500 hover:bg-slate-100">' +
      '<svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>' +
      "</div>" +
      '<p class="mt-1 text-sm text-slate-600">We\'ll email them a link to set up their account.</p>' +
      '<form id="invite-form" novalidate class="mt-4 space-y-4">' +
      '<p class="text-xs text-slate-500">* Required</p>' +
      '<div id="invite-error-summary" role="status"></div>' +
      '<div class="space-y-1">' +
      '<label for="invite-name" class="block text-sm font-medium text-slate-900">Full name <span aria-hidden="true">*</span></label>' +
      '<input id="invite-name" name="name" type="text" class="h-8 w-full rounded border border-slate-300 px-2 text-sm focus:border-blue-700 focus:outline focus:outline-2 focus:outline-blue-700" placeholder="Jordan Avery" />' +
      '<p id="invite-name-error" class="hidden items-center gap-1 text-sm text-red-600"></p>' +
      "</div>" +
      '<div class="space-y-1">' +
      '<label for="invite-email" class="block text-sm font-medium text-slate-900">Email <span aria-hidden="true">*</span></label>' +
      '<input id="invite-email" name="email" type="email" class="h-8 w-full rounded border border-slate-300 px-2 text-sm focus:border-blue-700 focus:outline focus:outline-2 focus:outline-blue-700" placeholder="jordan.avery@meridianhq.com" />' +
      '<p id="invite-email-error" class="hidden items-center gap-1 text-sm text-red-600"></p>' +
      "</div>" +
      '<div class="space-y-1 w-48">' +
      '<label for="invite-role" class="block text-sm font-medium text-slate-900">Role <span aria-hidden="true">*</span></label>' +
      '<select id="invite-role" name="role" class="h-8 w-full rounded border border-slate-300 px-2 text-sm focus:border-blue-700 focus:outline focus:outline-2 focus:outline-blue-700">' +
      ROLES.map(function (r) { return '<option value="' + r + '" ' + (r === "Viewer" ? "selected" : "") + ">" + r + "</option>"; }).join("") +
      "</select></div>" +
      '<div class="flex items-center justify-end gap-3 border-t border-slate-200 pt-4">' +
      '<button type="button" id="invite-cancel" class="h-8 rounded border border-slate-300 bg-white px-3 text-sm font-medium text-slate-700 hover:bg-slate-50">Cancel</button>' +
      '<button type="submit" id="invite-submit" class="h-8 rounded bg-blue-700 px-3 text-sm font-medium text-white hover:bg-blue-800">Send invite</button>' +
      "</div></form></div></div>";

    var form = qs("#invite-form");
    var nameInput = qs("#invite-name"), emailInput = qs("#invite-email");

    function isDirty() { return nameInput.value.trim() !== "" || emailInput.value.trim() !== ""; }

    function close(force) {
      if (!force && isDirty()) {
        if (!window.confirm("Discard this invitation? Your changes won't be saved.")) return;
      }
      qs("#overlay-root").innerHTML = "";
      document.removeEventListener("keydown", onKeydown);
      if (lastFocusedBeforeModal && lastFocusedBeforeModal.focus) lastFocusedBeforeModal.focus();
    }
    function onKeydown(e) {
      if (e.key === "Escape") { close(); return; }
      if (e.key === "Tab") {
        var items = focusableIn(qs("#invite-panel"));
        if (items.length === 0) return;
        var first = items[0], last = items[items.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    }
    document.addEventListener("keydown", onKeydown);
    qs("#invite-backdrop").addEventListener("mousedown", function (e) { if (e.target.id === "invite-backdrop") close(); });
    qs("#invite-close").addEventListener("click", function () { close(); });
    qs("#invite-cancel").addEventListener("click", function () { close(); });

    var EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    function fieldError(input, errorEl, message) {
      if (message) {
        input.classList.add("border-red-600");
        input.setAttribute("aria-invalid", "true");
        errorEl.className = "flex items-center gap-1 text-sm text-red-600";
        errorEl.innerHTML = '<svg class="size-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg><span>' + escapeHtml(message) + "</span>";
      } else {
        input.classList.remove("border-red-600");
        input.removeAttribute("aria-invalid");
        errorEl.className = "hidden";
        errorEl.innerHTML = "";
      }
    }

    function validateName(onBlurOnly) {
      var v = nameInput.value.trim();
      if (!v) { fieldError(nameInput, qs("#invite-name-error"), "Enter the user's full name"); return false; }
      fieldError(nameInput, qs("#invite-name-error"), null);
      return true;
    }
    function validateEmail() {
      var v = emailInput.value.trim();
      if (!v) { fieldError(emailInput, qs("#invite-email-error"), "Enter an email address"); return false; }
      if (!EMAIL_RE.test(v)) { fieldError(emailInput, qs("#invite-email-error"), "Enter an email like name@company.com"); return false; }
      fieldError(emailInput, qs("#invite-email-error"), null);
      return true;
    }

    var nameTouched = false, emailTouched = false;
    nameInput.addEventListener("blur", function () { nameTouched = true; validateName(); });
    emailInput.addEventListener("blur", function () { emailTouched = true; validateEmail(); });
    nameInput.addEventListener("input", function () { if (nameTouched) validateName(); });
    emailInput.addEventListener("input", function () { if (emailTouched) validateEmail(); });

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var okName = validateName(), okEmail = validateEmail();
      var errors = [];
      if (!okName) errors.push(["invite-name", "Full name"]);
      if (!okEmail) errors.push(["invite-email", "Email"]);

      var summary = qs("#invite-error-summary");
      if (errors.length >= 3) {
        summary.innerHTML = '<div class="mb-2 rounded-md border border-red-200 bg-red-50 p-3 text-sm text-red-700">' +
          "<p class=\"font-medium\">" + errors.length + " fields need attention</p>" +
          '<ul class="mt-1 list-disc pl-5">' + errors.map(function (er) { return '<li><a href="#' + er[0] + '" class="underline">' + er[1] + "</a></li>"; }).join("") + "</ul></div>";
      } else { summary.innerHTML = ""; }

      if (errors.length > 0) {
        qs("#" + errors[0][0]).focus();
        return;
      }

      var submitBtn = qs("#invite-submit");
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<svg class="mr-1.5 inline size-4 animate-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9"/></svg>Send invite';

      setTimeout(function () {
        var name = nameInput.value.trim();
        var email = emailInput.value.trim();
        var role = qs("#invite-role").value;
        var newUser = { id: "u" + (USERS.length + 1 + Date.now() % 1000), name: name, email: email, role: role, status: "Invited", lastSignIn: null };
        USERS.unshift(newUser);
        close(true);
        if (state.pageMode === "empty") state.pageMode = "ready";
        state.statusTab = "all"; state.q = ""; state.roles = [];
        qs("#search-input").value = ""; qs("#search-clear").hidden = true;
        resetPageAndSelection();
        render();
        showToast("Invitation sent to " + email);
      }, 500);
    });

    setTimeout(function () { nameInput.focus(); }, 0);
  }

  qs("#btn-invite").addEventListener("click", openInviteDialog);

  /* ---------------------------------------------------------------- */
  /* URL state (?state=empty|error|loading)                            */
  /* ---------------------------------------------------------------- */

  function getUrlState() {
    return new URLSearchParams(location.search).get("state");
  }
  function setUrlState(val) {
    var url = new URL(location.href);
    if (val) url.searchParams.set("state", val); else url.searchParams.delete("state");
    history.replaceState(null, "", url.toString());
  }

  /* ---------------------------------------------------------------- */
  /* Main render                                                        */
  /* ---------------------------------------------------------------- */

  function render() {
    renderTabs();
    renderChips();
    if (state.pageMode === "ready") updateRoleFilterLabel();
    renderTable();
  }

  function init() {
    var urlState = getUrlState();
    if (urlState === "empty") {
      USERS.length = 0;
      state.pageMode = "empty";
      render();
      return;
    }
    if (urlState === "error") {
      state.pageMode = "error";
      render();
      return;
    }
    if (urlState === "loading") {
      state.pageMode = "loading";
      render();
      return;
    }
    state.pageMode = "loading";
    render();
    setTimeout(function () {
      state.pageMode = "ready";
      render();
    }, 500);
  }

  init();
})();
</script>
</body>
</html>
