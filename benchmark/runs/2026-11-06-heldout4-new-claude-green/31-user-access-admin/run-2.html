<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Người dùng · Quản trị hệ thống</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  [hidden] { display: none !important; }
  * { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .tabular-nums { font-variant-numeric: tabular-nums; }
  @keyframes pulse-bg { 0%,100% { opacity: 1; } 50% { opacity: .5; } }
  .skeleton { animation: pulse-bg 1.5s ease-in-out infinite; background-color: #e2e8f0; border-radius: 4px; }
  @media (prefers-reduced-motion: reduce) { .skeleton { animation: none; } }
</style>
</head>
<body class="bg-white text-slate-900 text-sm">

<div class="flex min-h-screen">

  <aside id="sidebar" class="shrink-0 w-60 border-r border-slate-200 bg-slate-50 flex flex-col transition-[width]">
    <div class="h-12 flex items-center gap-2 px-3 border-b border-slate-200">
      <div class="size-6 rounded bg-blue-700 shrink-0" aria-hidden="true"></div>
      <span id="brandLabel" class="font-semibold text-slate-900 truncate">NovaWork Admin</span>
    </div>
    <nav aria-label="Điều hướng chính" class="flex-1 overflow-y-auto p-2 flex flex-col gap-4">
      <div class="flex flex-col gap-0.5">
        <p id="grp1" class="px-2 py-1 text-xs font-medium text-slate-500">Tổng quan</p>
        <a href="#" title="Bảng điều khiển" aria-label="Bảng điều khiển" class="flex h-8 items-center gap-2 rounded px-2 text-sm text-slate-700 hover:bg-slate-100">
          <svg class="size-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
          <span class="nav-label truncate">Bảng điều khiển</span>
        </a>
      </div>
      <div class="flex flex-col gap-0.5">
        <p id="grp2" class="px-2 py-1 text-xs font-medium text-slate-500">Quản trị</p>
        <a href="#" aria-current="page" title="Người dùng" aria-label="Người dùng" class="flex h-8 items-center gap-2 rounded px-2 text-sm font-medium bg-slate-100 text-slate-900">
          <svg class="size-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span class="nav-label truncate">Người dùng</span>
        </a>
        <a href="#" title="Vai trò &amp; quyền" aria-label="Vai trò và quyền" class="flex h-8 items-center gap-2 rounded px-2 text-sm text-slate-700 hover:bg-slate-100">
          <svg class="size-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 4 6v6c0 5 4 8 8 10 4-2 8-5 8-10V6l-8-4Z"/></svg>
          <span class="nav-label truncate">Vai trò &amp; quyền</span>
        </a>
        <a href="#" title="Nhật ký hoạt động" aria-label="Nhật ký hoạt động" class="flex h-8 items-center gap-2 rounded px-2 text-sm text-slate-700 hover:bg-slate-100">
          <svg class="size-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="9"/></svg>
          <span class="nav-label truncate">Nhật ký hoạt động</span>
        </a>
        <a href="#" title="Cấu hình hệ thống" aria-label="Cấu hình hệ thống" class="flex h-8 items-center gap-2 rounded px-2 text-sm text-slate-700 hover:bg-slate-100">
          <svg class="size-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
          <span class="nav-label truncate">Cấu hình hệ thống</span>
        </a>
      </div>
    </nav>
  </aside>

  <div class="flex-1 min-w-0 flex flex-col">
    <!-- Header -->
    <header class="h-12 border-b border-slate-200 flex items-center justify-between px-3 shrink-0 bg-white">
      <button type="button" id="collapseBtn" aria-label="Thu gọn thanh điều hướng" aria-expanded="true" class="size-8 inline-flex items-center justify-center rounded hover:bg-slate-100 text-slate-600">
        <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
      </button>
      <div class="flex items-center gap-2">
        <button type="button" class="hidden sm:inline-flex h-8 items-center gap-2 rounded border border-slate-200 px-3 text-sm text-slate-500 hover:bg-slate-50" aria-label="Tìm kiếm hoặc chạy lệnh">
          <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          Tìm kiếm hoặc chạy lệnh
          <kbd class="ml-4 rounded border border-slate-300 bg-slate-50 px-1 text-xs text-slate-500">Ctrl K</kbd>
        </button>
        <button type="button" aria-label="3 thông báo chưa đọc" class="relative size-8 inline-flex items-center justify-center rounded hover:bg-slate-100 text-slate-600">
          <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
          <span class="absolute top-1 right-1 size-1.5 rounded-full bg-red-600" aria-hidden="true"></span>
        </button>
        <button type="button" aria-label="Menu tài khoản" class="size-8 inline-flex items-center justify-center rounded-full bg-blue-700 text-white text-xs font-medium">QA</button>
      </div>
    </header>

    <main class="flex-1 p-6 min-w-0">
      <div class="mx-auto max-w-[1400px]">
        <!-- Page header -->
        <header class="mb-4 flex flex-col gap-2">
          <nav aria-label="Breadcrumb">
            <ol class="flex items-center gap-1 text-sm text-slate-500">
              <li>Quản trị hệ thống</li>
              <li aria-hidden="true">/</li>
              <li><span aria-current="page" class="text-slate-900">Người dùng</span></li>
            </ol>
          </nav>
          <div class="flex flex-wrap items-center justify-between gap-2">
            <h1 class="text-xl font-semibold text-slate-900">Người dùng</h1>
            <div class="flex items-center gap-2">
              <button type="button" id="exportBtn" class="h-8 inline-flex items-center gap-1.5 rounded border border-slate-300 bg-white px-3 text-sm font-medium text-slate-700 hover:bg-slate-50">
                <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
                <span id="exportLabel">Xuất 0 người dùng</span>
              </button>
              <button type="button" id="inviteBtn" class="h-8 inline-flex items-center gap-1.5 rounded bg-blue-700 px-3 text-sm font-medium text-white hover:bg-blue-800">
                <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6"/><path d="M22 11h-6"/></svg>
                Mời người dùng
              </button>
            </div>
          </div>
        </header>

        <!-- Status tabs -->
        <div class="border-b border-slate-200 mb-3" role="tablist" aria-label="Lọc theo trạng thái">
          <div class="flex items-center gap-5" id="statusTabs"></div>
        </div>

        <!-- Filter bar -->
        <div class="flex flex-wrap items-center gap-2 py-1">
          <div class="relative">
            <svg class="pointer-events-none absolute left-2.5 top-1/2 -translate-y-1/2 size-4 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input id="searchInput" type="text" placeholder="Tìm theo tên hoặc email" aria-label="Tìm người dùng" class="h-8 w-72 rounded border border-slate-300 pl-8 pr-8 text-sm placeholder:text-slate-400 focus:outline-2 focus:outline-blue-700">
            <button type="button" id="searchClear" hidden aria-label="Xóa ô tìm kiếm" class="absolute right-1.5 top-1/2 -translate-y-1/2 size-5 inline-flex items-center justify-center rounded hover:bg-slate-100 text-slate-500">
              <svg class="size-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="M6 6l12 12"/></svg>
            </button>
          </div>

          <div class="relative">
            <button type="button" id="roleFilterBtn" aria-expanded="false" class="h-8 inline-flex items-center gap-1.5 rounded border border-slate-300 bg-white px-3 text-sm text-slate-700 hover:bg-slate-50">
              <span id="roleFilterLabel">Vai trò</span>
              <svg class="size-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div id="roleFilterPanel" hidden class="absolute z-20 mt-1 w-56 rounded-md border border-slate-200 bg-white p-2 shadow-lg">
              <div id="roleFilterOptions" class="flex flex-col gap-0.5"></div>
            </div>
          </div>

          <div class="relative">
            <button type="button" id="moreFiltersBtn" aria-expanded="false" class="h-8 inline-flex items-center gap-1.5 rounded border border-slate-300 bg-white px-3 text-sm text-slate-700 hover:bg-slate-50">
              <svg class="size-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3Z"/></svg>
              <span id="moreFiltersLabel">Thêm bộ lọc</span>
            </button>
            <div id="moreFiltersPanel" hidden class="absolute z-20 mt-1 w-72 rounded-md border border-slate-200 bg-white p-3 shadow-lg">
              <label class="block text-sm font-medium text-slate-700 mb-1">Đăng nhập gần nhất</label>
              <select id="lastLoginSelect" class="h-8 w-full rounded border border-slate-300 px-2 text-sm focus:outline-2 focus:outline-blue-700">
                <option value="all">Mọi lúc</option>
                <option value="7">Trong 7 ngày qua</option>
                <option value="30">Trong 30 ngày qua</option>
                <option value="never">Chưa từng đăng nhập</option>
                <option value="90plus">Không hoạt động trên 90 ngày</option>
              </select>
              <div class="mt-3 flex justify-end gap-2">
                <button type="button" id="moreFiltersReset" class="h-8 rounded px-3 text-sm font-medium text-slate-700 hover:bg-slate-50">Đặt lại</button>
                <button type="button" id="moreFiltersApply" class="h-8 rounded bg-blue-700 px-3 text-sm font-medium text-white hover:bg-blue-800">Áp dụng</button>
              </div>
            </div>
          </div>
        </div>

        <!-- Applied chips -->
        <div id="chipsRow" class="flex flex-wrap items-center gap-2 py-2"></div>

        <!-- Result count live region -->
        <p id="resultCountSr" role="status" class="sr-only"></p>
        <p id="resultCount" class="text-sm text-slate-600 mb-2"></p>

        <!-- Toolbar / Bulk bar -->
        <div id="toolbar" class="h-10 flex items-center justify-between rounded-t-md border border-b-0 border-slate-200 bg-slate-50 px-3 text-sm text-slate-500">
          <span>Danh sách người dùng</span>
        </div>
        <div id="bulkBar" hidden class="h-10 flex items-center justify-between rounded-t-md border border-b-0 border-blue-200 bg-blue-50 px-3 text-sm">
          <div class="flex items-center gap-3">
            <span id="bulkCount" class="font-medium text-slate-900 tabular-nums"></span>
            <button type="button" id="selectAllMatchingBtn" class="text-blue-700 hover:underline font-medium"></button>
          </div>
          <div class="flex items-center gap-2">
            <button type="button" id="bulkResendBtn" class="h-8 rounded border border-slate-300 bg-white px-3 text-sm font-medium text-slate-700 hover:bg-slate-50">Gửi lại lời mời</button>
            <button type="button" id="bulkDisableBtn" class="h-8 rounded border border-red-300 bg-white px-3 text-sm font-medium text-red-700 hover:bg-red-50">Vô hiệu hóa</button>
            <button type="button" id="bulkCancelBtn" class="h-8 rounded px-3 text-sm font-medium text-slate-700 hover:bg-slate-100">Hủy chọn</button>
          </div>
        </div>

        <!-- Table -->
        <div class="overflow-x-auto border border-slate-200 rounded-b-md">
          <table class="w-full border-collapse" aria-label="Danh sách người dùng">
            <thead>
              <tr class="border-b border-slate-200 bg-white">
                <th scope="col" class="h-10 w-10 px-3">
                  <input type="checkbox" id="selectAllCheckbox" aria-label="Chọn tất cả người dùng trên trang này" class="size-4 rounded border-slate-300 relative after:absolute after:-inset-2">
                </th>
                <th scope="col" class="h-10 px-3 text-left font-medium text-slate-600">
                  <button type="button" id="sortName" class="inline-flex items-center gap-1 hover:text-slate-900">Tên<svg class="size-3.5 opacity-0 sort-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></button>
                </th>
                <th scope="col" class="h-10 px-3 text-left font-medium text-slate-600">Email</th>
                <th scope="col" class="h-10 px-3 text-left font-medium text-slate-600">Vai trò</th>
                <th scope="col" class="h-10 px-3 text-left font-medium text-slate-600">Trạng thái</th>
                <th scope="col" class="h-10 px-3 text-left font-medium text-slate-600">
                  <button type="button" id="sortLogin" class="inline-flex items-center gap-1 hover:text-slate-900">Đăng nhập gần nhất<svg class="size-3.5 sort-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></button>
                </th>
                <th scope="col" class="h-10 px-3 text-right font-medium text-slate-600"><span class="sr-only">Hành động</span></th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>

        <!-- Pagination -->
        <div id="paginationBar" class="mt-3 flex flex-wrap items-center justify-between gap-2 text-sm text-slate-600">
          <div class="flex items-center gap-3">
            <span id="pageRangeText" class="tabular-nums"></span>
            <label class="flex items-center gap-1.5">
              <span>Số dòng/trang</span>
              <select id="pageSizeSelect" class="h-8 rounded border border-slate-300 px-2 text-sm focus:outline-2 focus:outline-blue-700">
                <option value="10">10</option>
                <option value="25" selected>25</option>
                <option value="50">50</option>
              </select>
            </label>
          </div>
          <div class="flex items-center gap-2">
            <button type="button" id="prevPageBtn" class="h-8 rounded border border-slate-300 px-3 font-medium text-slate-700 hover:bg-slate-50 disabled:opacity-40 disabled:cursor-not-allowed">« Trước</button>
            <span id="pageIndicator" class="tabular-nums px-1"></span>
            <button type="button" id="nextPageBtn" class="h-8 rounded border border-slate-300 px-3 font-medium text-slate-700 hover:bg-slate-50 disabled:opacity-40 disabled:cursor-not-allowed">Sau »</button>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Row actions menu (single, repositioned) -->
<div id="rowMenu" hidden class="fixed z-30 w-52 rounded-md border border-slate-200 bg-white py-1 shadow-lg text-sm" role="menu"></div>

<!-- Invite dialog -->
<div id="inviteOverlay" hidden class="fixed inset-0 z-40 bg-slate-900/40 flex items-center justify-center p-4">
  <div id="inviteDialog" role="dialog" aria-modal="true" aria-labelledby="inviteTitle" class="w-full max-w-md rounded-lg bg-white shadow-xl">
    <form id="inviteForm" novalidate>
      <div class="px-5 py-4 border-b border-slate-200">
        <h2 id="inviteTitle" class="text-base font-semibold text-slate-900">Mời người dùng mới</h2>
      </div>
      <div class="px-5 py-4 flex flex-col gap-4">
        <p class="text-sm text-slate-500">* Bắt buộc</p>
        <div role="alert">
          <p id="inviteServerError" hidden class="rounded-md bg-red-50 p-3 text-sm text-red-700"></p>
        </div>
        <div class="flex flex-col gap-1.5">
          <label for="inviteEmail" class="block text-sm font-medium text-slate-700">Email <span aria-hidden="true">*</span></label>
          <input id="inviteEmail" type="email" class="h-8 max-w-full rounded border border-slate-300 px-2.5 text-sm focus:outline-2 focus:outline-blue-700" placeholder="ten@novawork.vn" aria-required="true">
          <p id="inviteEmailError" class="hidden items-center gap-1 text-sm text-red-700"></p>
        </div>
        <div class="flex flex-col gap-1.5">
          <label for="inviteRole" class="block text-sm font-medium text-slate-700">Vai trò <span aria-hidden="true">*</span></label>
          <select id="inviteRole" class="h-8 max-w-full rounded border border-slate-300 px-2.5 text-sm focus:outline-2 focus:outline-blue-700" aria-required="true">
            <option value="">Chọn vai trò</option>
            <option>Quản trị viên</option>
            <option>Quản lý</option>
            <option>Biên tập viên</option>
            <option>Nhân viên hỗ trợ</option>
            <option>Chỉ xem</option>
          </select>
          <p id="inviteRoleError" class="hidden items-center gap-1 text-sm text-red-700"></p>
        </div>
        <div class="flex flex-col gap-1.5">
          <label for="inviteNote" class="block text-sm font-medium text-slate-700">Lời nhắn</label>
          <textarea id="inviteNote" rows="2" class="w-full rounded border border-slate-300 px-2.5 py-1.5 text-sm focus:outline-2 focus:outline-blue-700" placeholder="Thêm lời nhắn gửi kèm lời mời (không bắt buộc)"></textarea>
        </div>
      </div>
      <div class="flex items-center justify-end gap-3 border-t border-slate-200 bg-white px-5 py-3 rounded-b-lg">
        <button type="button" id="inviteCancelBtn" class="h-8 rounded px-3 text-sm font-medium text-slate-700 hover:bg-slate-100">Hủy</button>
        <button type="submit" id="inviteSubmitBtn" class="h-8 inline-flex items-center gap-1.5 rounded bg-blue-700 px-3 text-sm font-medium text-white hover:bg-blue-800">
          <svg id="inviteSpinner" hidden class="size-4 animate-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
          Gửi lời mời
        </button>
      </div>
    </form>
  </div>
</div>

<!-- Generic confirm (AlertDialog) -->
<div id="confirmOverlay" hidden class="fixed inset-0 z-40 bg-slate-900/40 flex items-center justify-center p-4">
  <div role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle" aria-describedby="confirmBody" class="w-full max-w-sm rounded-lg bg-white shadow-xl">
    <div class="px-5 py-4">
      <h2 id="confirmTitle" class="text-base font-semibold text-slate-900"></h2>
      <p id="confirmBody" class="mt-2 text-sm text-slate-600"></p>
      <div role="alert"><p id="confirmError" hidden class="mt-2 rounded-md bg-red-50 p-2 text-sm text-red-700"></p></div>
    </div>
    <div class="flex items-center justify-end gap-3 border-t border-slate-200 px-5 py-3 rounded-b-lg">
      <button type="button" id="confirmCancelBtn" class="h-8 rounded px-3 text-sm font-medium text-slate-700 hover:bg-slate-100"></button>
      <button type="button" id="confirmActionBtn" class="h-8 inline-flex items-center gap-1.5 rounded px-3 text-sm font-medium text-white">
        <svg id="confirmSpinner" hidden class="size-4 animate-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
        <span id="confirmActionLabel"></span>
      </button>
    </div>
  </div>
</div>

<!-- Toasts -->
<div id="toastRegion" role="status" aria-live="polite" class="fixed top-4 right-4 z-50 flex flex-col gap-2 w-80"></div>

<script>
(function () {
  'use strict';

  var LOCALE = 'vi-VN';
  var TIME_ZONE = 'Asia/Ho_Chi_Minh';
  var ANCHOR = Date.parse('2026-11-07T08:00:00Z');
  var DAY = 86400000;

  function foldVi(s) {
    return s.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase();
  }
  function formatDateTime(ms) {
    var d = new Date(ms);
    var datePart = new Intl.DateTimeFormat(LOCALE, { day: '2-digit', month: '2-digit', year: 'numeric', timeZone: TIME_ZONE }).format(d);
    var timePart = new Intl.DateTimeFormat(LOCALE, { hour: '2-digit', minute: '2-digit', hourCycle: 'h23', timeZone: TIME_ZONE }).format(d);

    if (abs < 3600) return rtf.format(Math.round(diffSec / 60), 'minute');

  // ---------- Mock data ----------
  var SURNAMES = ['Nguyễn', 'Trần', 'Lê', 'Phạm', 'Hoàng', 'Huỳnh', 'Phan', 'Vũ', 'Võ', 'Đặng', 'Bùi', 'Đỗ', 'Hồ', 'Ngô', 'Dương'];
  var GIVENS = ['Văn An', 'Thị Hương', 'Minh Quân', 'Thu Hà', 'Hải Đăng', 'Ngọc Linh', 'Quốc Huy', 'Thanh Tùng', 'Mai Anh', 'Đức Anh', 'Gia Bảo', 'Thảo Vy', 'Tuấn Kiệt', 'Bảo Ngọc', 'Khánh Duy', 'Yến Nhi', 'Trọng Nghĩa', 'Hồng Nhung', 'Anh Tuấn', 'Diệu Linh', 'Công Danh', 'Thùy Trang', 'Việt Hoàng', 'Kim Ngân', 'Xuân Mai', 'Hữu Phước', 'Lan Anh', 'Chí Thanh', 'Phương Linh', 'Đình Khoa', 'Nhật Minh'];
  var ROLES = ['Quản trị viên', 'Quản lý', 'Biên tập viên', 'Nhân viên hỗ trợ', 'Chỉ xem'];

  function buildUsers() {
    var users = [];
    var n = 62;
    for (var i = 0; i < n; i++) {
      var surname = SURNAMES[i % SURNAMES.length];
      var given = GIVENS[(i * 7 + 3) % GIVENS.length];
      var name = surname + ' ' + given;
      var emailLocal = foldVi(name).replace(/\s+/g, '.');
      var email = emailLocal + '@novawork.vn';
      var role = (i % 20 === 0) ? ROLES[0] : ROLES[1 + (i % 4)];
      var status, lastLogin, createdAt;
      if (i >= 53) {
        status = 'invited';
        lastLogin = null;
        createdAt = ANCHOR - (i - 52) * DAY;
      } else if (i >= 46) {
        status = 'disabled';
        lastLogin = ANCHOR - (40 + (i - 46) * 5) * DAY;
        createdAt = lastLogin - (120 + i) * DAY;
      } else {
        status = 'active';
        var daysAgo = i % 15;
        var hoursAgo = (i * 3) % 24;
        lastLogin = ANCHOR - daysAgo * DAY - hoursAgo * 3600000;
        createdAt = lastLogin - (100 + i * 10) * DAY;
      }
      users.push({ id: 'U-' + (1000 + i), name: name, email: email, role: role, status: status, lastLogin: lastLogin, createdAt: createdAt });
    }
    return users;
  }
  var ALL_USERS = buildUsers();
  var nextSeq = ALL_USERS.length;

  // ---------- State ----------
  var urlState = new URLSearchParams(window.location.search).get('state'); // null | loading | empty | error
  var state = {
    q: '',
    roles: [],
    lastLoginRange: 'all',
    statusTab: 'all',
    sort: { key: 'lastLogin', dir: 'desc' },
    page: 1,
    pageSize: 25,
    selected: new Set(),
    selectAllMatching: false,
    loading: urlState !== 'empty' && urlState !== 'error',
    errored: urlState === 'error',
    forceEmpty: urlState === 'empty'
  };

  var STATUS_META = {
    active: { label: 'Hoạt động', tone: 'success' },

    disabled: { label: 'Vô hiệu hóa', tone: 'danger' }
  };
  var TONE_CLASSES = {
    neutral: 'bg-slate-100 text-slate-700',
    info: 'bg-blue-50 text-blue-700',
    success: 'bg-emerald-50 text-emerald-700',
    warning: 'bg-amber-50 text-amber-800',
    danger: 'bg-red-50 text-red-700'
  };
  var TONE_ICON = {
    neutral: '<svg class="size-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg>',
    info: '<svg class="size-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>',
    success: '<svg class="size-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="m8.5 12.5 2.3 2.3 4.7-5.1"/></svg>',
    warning: '<svg class="size-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.3 3.9 1.9 18a1.8 1.8 0 0 0 1.5 2.6h17.2a1.8 1.8 0 0 0 1.5-2.6L13.7 3.9a1.8 1.8 0 0 0-3.4 0Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>',
    danger: '<svg class="size-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="m9 9 6 6"/><path d="m15 9-6 6"/></svg>'
  };

  function statusBadge(status) {

      TONE_ICON[meta.tone] + '<span class="truncate" title="' + meta.label + '">' + meta.label + '</span></span>';
  }

  function initials(name) {
    var parts = name.trim().split(/\s+/);
    var last = parts[parts.length - 1] || '';
    var first = parts[0] || '';

  }

  // ---------- Filtering ----------
  function matchesNonStatus(u) {
    if (state.q) {
      var needle = foldVi(state.q.trim());

      if (hay.indexOf(needle) === -1) return false;
    }
    if (state.roles.length && state.roles.indexOf(u.role) === -1) return false;
    if (state.lastLoginRange !== 'all') {
      var days = u.lastLogin == null ? Infinity : (Date.now() - u.lastLogin) / DAY;
      if (state.lastLoginRange === '7' && !(days <= 7)) return false;
      if (state.lastLoginRange === '30' && !(days <= 30)) return false;
      if (state.lastLoginRange === 'never' && u.lastLogin !== null) return false;
      if (state.lastLoginRange === '90plus' && !(days > 90)) return false;
    }
    return true;
  }
  function matchesAll(u) {
    if (!matchesNonStatus(u)) return false;
    if (state.statusTab !== 'all' && u.status !== state.statusTab) return false;
    return true;
  }

  function getUsers() { return state.forceEmpty ? [] : ALL_USERS; }

  function sortUsers(list) {
    var key = state.sort.key, dir = state.sort.dir;
    var arr = list.slice();
    arr.sort(function (a, b) {
      var av = a[key], bv = b[key];
      if (key === 'lastLogin') {
        if (av == null && bv == null) return 0;
        if (av == null) return 1;
        if (bv == null) return -1;
        return dir === 'asc' ? av - bv : bv - av;
      }
      var cmp = String(av).localeCompare(String(bv), 'vi');
      return dir === 'asc' ? cmp : -cmp;
    });
    return arr;
  }

  // ---------- Rendering ----------
  var els = {};
  ['statusTabs', 'chipsRow', 'resultCount', 'resultCountSr', 'tableBody', 'toolbar', 'bulkBar', 'bulkCount',
    'selectAllMatchingBtn', 'bulkResendBtn', 'bulkDisableBtn', 'bulkCancelBtn', 'paginationBar', 'pageRangeText',
    'pageIndicator', 'prevPageBtn', 'nextPageBtn', 'pageSizeSelect', 'selectAllCheckbox', 'sortName', 'sortLogin',
    'roleFilterLabel', 'roleFilterOptions', 'roleFilterBtn', 'roleFilterPanel', 'moreFiltersBtn', 'moreFiltersPanel',
    'moreFiltersLabel', 'lastLoginSelect', 'searchInput', 'searchClear', 'exportLabel', 'rowMenu'
  ].forEach(function (id) { els[id] = document.getElementById(id); });

  function renderTabs() {
    var tabs = [
      { key: 'all', label: 'Tất cả' },
      { key: 'active', label: 'Hoạt động' },
      { key: 'invited', label: 'Đã mời' },
      { key: 'disabled', label: 'Vô hiệu hóa' }
    ];
    var html = tabs.map(function (t) {
      var count = getUsers().filter(matchesNonStatus).filter(function (u) { return t.key === 'all' || u.status === t.key; }).length;
      var active = state.statusTab === t.key;
      return '<button type="button" role="tab" aria-selected="' + active + '" data-tab="' + t.key + '" class="h-10 inline-flex items-center gap-1.5 border-b-2 text-sm px-0.5 ' +
        (active ? 'border-blue-700 text-blue-700 font-medium' : 'border-transparent text-slate-600 hover:text-slate-900') + '">' +
        t.label + ' <span class="tabular-nums ' + (active ? 'text-blue-700' : 'text-slate-400') + '">' + count + '</span></button>';
    }).join('');

        resetPageAndSelection();
        render();
      });
    });
  }

  function renderRoleOptions() {
    els.roleFilterOptions.innerHTML = ROLES.map(function (r) {
      var checked = state.roles.indexOf(r) !== -1;
      var id = 'role-opt-' + r.replace(/\s+/g, '-');
      return '<label for="' + id + '" class="flex h-8 items-center gap-2 rounded px-2 text-sm hover:bg-slate-50 cursor-pointer">' +
        '<input type="checkbox" id="' + id + '" value="' + r + '" ' + (checked ? 'checked' : '') + ' class="size-4 rounded border-slate-300">' + r + '</label>';
    }).join('');
    Array.prototype.forEach.call(els.roleFilterOptions.querySelectorAll('input'), function (cb) {
      cb.addEventListener('change', function () {
        var v = cb.value;
        var idx = state.roles.indexOf(v);
        if (cb.checked && idx === -1) state.roles.push(v);
        if (!cb.checked && idx !== -1) state.roles.splice(idx, 1);
        resetPageAndSelection();
        render();
      });
    });
  }

  function renderChips() {
    var chips = [];
    if (state.q) chips.push({ key: 'q', label: 'Tìm: ' + state.q, onRemove: function () { state.q = ''; els.searchInput.value = ''; } });
    state.roles.forEach(function (r) {
      chips.push({ key: 'role:' + r, label: 'Vai trò: ' + r, onRemove: function () {
        state.roles = state.roles.filter(function (x) { return x !== r; });
      } });
    });
    if (state.lastLoginRange !== 'all') {
      var labels = { '7': 'Đăng nhập: 7 ngày qua', '30': 'Đăng nhập: 30 ngày qua', 'never': 'Chưa từng đăng nhập', '90plus': 'Không hoạt động trên 90 ngày' };
      chips.push({ key: 'lastLogin', label: labels[state.lastLoginRange], onRemove: function () {
        state.lastLoginRange = 'all'; els.lastLoginSelect.value = 'all';
      } });
    }
    if (!chips.length) { els.chipsRow.innerHTML = ''; return; }
    els.chipsRow.innerHTML = chips.map(function (c, i) {
      return '<span class="inline-flex h-6 items-center gap-1 rounded-full border border-slate-200 bg-slate-50 pl-2 pr-1 text-xs leading-5 font-medium text-slate-700" data-chip="' + i + '">' +
        escapeHtml(c.label) +
        '<button type="button" aria-label="Xóa bộ lọc ' + escapeHtml(c.label) + '" class="inline-flex size-5 items-center justify-center rounded-full hover:bg-slate-200">' +
        '<svg class="size-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="M6 6l12 12"/></svg></button></span>';
    }).join('') + '<button type="button" id="clearAllChips" class="text-sm font-medium text-blue-700 hover:underline">Xóa tất cả</button>';
    Array.prototype.forEach.call(els.chipsRow.querySelectorAll('[data-chip]'), function (el, i) {

  function resetPageAndSelection() {

  function lastLoginCellHtml(u) {

  }

  function renderSortIcons() {

  function skeletonRows() {

      for (var c = 0; c < cols; c++) {
        rows += '<td class="px-3 py-0"><div class="skeleton h-4 w-full"></div></td>';
      }
      rows += '</tr>';
    }
    return rows;
  }

  function emptyStateRow(kind) {

  function errorStateRow() {

  }

  function renderRow(u) {
    var checked = state.selected.has(u.id);

        escapeHtml(u.role) + '</span></td>' +

      '<td class="px-3 py-0 text-slate-600">' + lastLoginCellHtml(u) + '</td>' +
      '<td class="px-3 py-0 text-right">' +

          '<svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="12" cy="19" r="1.2"/></svg>' +
        '</button>' +
      '</td>' +
    '</tr>';
  }

  var currentPageIds = [];

  function render() {
    renderTabs();
    renderRoleOptions();
    renderChips();

    els.roleFilterLabel.textContent = state.roles.length ? 'Vai trò (' + state.roles.length + ')' : 'Vai trò';
    els.moreFiltersLabel.textContent = state.lastLoginRange !== 'all' ? 'Thêm bộ lọc (1)' : 'Thêm bộ lọc';

    if (state.loading) {
      els.tableBody.innerHTML = skeletonRows();
      els.tableBody.closest('table').setAttribute('aria-busy', 'true');
      els.resultCount.textContent = '';
      els.resultCountSr.textContent = '';
      els.paginationBar.classList.add('invisible');
      currentPageIds = [];
      renderSortIcons();
      updateSelectAllCheckbox();
      return;
    }
    els.tableBody.closest('table').setAttribute('aria-busy', 'false');

    if (state.errored) {
      els.tableBody.innerHTML = errorStateRow();
      document.getElementById('retryBtn').addEventListener('click', function () {
        state.errored = false; state.loading = true; render();
        setTimeout(function () { state.loading = false; render(); }, 500);
      });
      els.resultCount.textContent = '';
      els.resultCountSr.textContent = '';
      els.paginationBar.classList.add('invisible');
      currentPageIds = [];
      renderSortIcons();
      updateSelectAllCheckbox();
      return;
    }

    els.paginationBar.classList.remove('invisible');

    var unfilteredTotal = getUsers().length;
    var filtered = sortUsers(getUsers().filter(matchesAll));
    var hasAnyFilterApplied = !!(state.q || state.roles.length || state.lastLoginRange !== 'all' || state.statusTab !== 'all');

    els.exportLabel.textContent = 'Xuất ' + filtered.length + ' người dùng';

    if (unfilteredTotal === 0) {
      els.tableBody.innerHTML = emptyStateRow('first-use');
      document.getElementById('emptyInviteBtn').addEventListener('click', openInviteDialog);
      els.resultCount.textContent = '';
      els.resultCountSr.textContent = 'Chưa có người dùng';
      currentPageIds = [];
      renderSortIcons();
      updateSelectAllCheckbox();
      return;
    }

    if (filtered.length === 0) {
      els.tableBody.innerHTML = emptyStateRow('no-results');
      document.getElementById('emptyClearBtn').addEventListener('click', function () {
        state.q = ''; els.searchInput.value = ''; state.roles = []; state.lastLoginRange = 'all'; els.lastLoginSelect.value = 'all'; state.statusTab = 'all';
        resetPageAndSelection(); render();
      });
      els.resultCount.textContent = hasAnyFilterApplied ? '0 người dùng phù hợp' : '';
      els.resultCountSr.textContent = 'Không có người dùng phù hợp';
      currentPageIds = [];
      renderSortIcons();
      updateSelectAllCheckbox();
      return;
    }

    var totalPages = Math.max(1, Math.ceil(filtered.length / state.pageSize));
    if (state.page > totalPages) state.page = totalPages;
    var start = (state.page - 1) * state.pageSize;
    var pageItems = filtered.slice(start, start + state.pageSize);
    currentPageIds = pageItems.map(function (u) { return u.id; });

    els.tableBody.innerHTML = pageItems.map(renderRow).join('');
    Array.prototype.forEach.call(els.tableBody.querySelectorAll('[data-select]'), function (cb) {
      cb.addEventListener('change', function () {
        var id = cb.getAttribute('data-select');
        if (cb.checked) state.selected.add(id); else { state.selected.delete(id); state.selectAllMatching = false; }
        renderToolbarBulk(filtered.length);
        updateSelectAllCheckbox();
        var row = cb.closest('tr');
        row.classList.toggle('bg-blue-50/40', cb.checked);
      });
    });
    Array.prototype.forEach.call(els.tableBody.querySelectorAll('[data-menu-trigger]'), function (btn) {
      btn.addEventListener('click', function (e) { e.stopPropagation(); openRowMenu(btn); });
    });

    var rangeEnd = Math.min(filtered.length, start + state.pageSize);
    els.resultCount.textContent = hasAnyFilterApplied
      ? (filtered.length + ' người dùng phù hợp')
      : (filtered.length + ' người dùng');
    els.resultCountSr.textContent = filtered.length + ' người dùng phù hợp';
    els.pageRangeText.textContent = 'Hiển thị ' + (start + 1) + '–' + rangeEnd + ' trong ' + filtered.length;
    els.pageIndicator.textContent = 'Trang ' + state.page + ' / ' + totalPages;
    els.prevPageBtn.disabled = state.page <= 1;
    els.nextPageBtn.disabled = state.page >= totalPages;

    renderSortIcons();
    renderToolbarBulk(filtered.length);
    updateSelectAllCheckbox();
  }

  function updateSelectAllCheckbox() {
    if (!currentPageIds.length) { els.selectAllCheckbox.checked = false; els.selectAllCheckbox.indeterminate = false; return; }
    var selectedOnPage = currentPageIds.filter(function (id) { return state.selected.has(id); }).length;
    els.selectAllCheckbox.checked = selectedOnPage === currentPageIds.length;
    els.selectAllCheckbox.indeterminate = selectedOnPage > 0 && selectedOnPage < currentPageIds.length;
  }

  function renderToolbarBulk(totalMatching) {
    var n = state.selected.size;
    if (n === 0) {
      els.toolbar.hidden = false;
      els.bulkBar.hidden = true;
      return;
    }
    els.toolbar.hidden = true;
    els.bulkBar.hidden = false;
    els.bulkCount.textContent = (state.selectAllMatching ? 'Đã chọn tất cả ' + totalMatching : n + ' đã chọn');
    var allOnPageSelected = currentPageIds.length > 0 && currentPageIds.every(function (id) { return state.selected.has(id); });
    if (state.selectAllMatching) {
      els.selectAllMatchingBtn.hidden = false;
      els.selectAllMatchingBtn.textContent = 'Bỏ chọn tất cả';
      els.selectAllMatchingBtn.onclick = function () {
        state.selectAllMatching = false; state.selected = new Set(); renderToolbarBulk(totalMatching); updateSelectAllCheckbox(); render();
      };
    } else if (allOnPageSelected && totalMatching > currentPageIds.length) {
      els.selectAllMatchingBtn.hidden = false;
      els.selectAllMatchingBtn.textContent = 'Chọn tất cả ' + totalMatching + ' phù hợp';
      els.selectAllMatchingBtn.onclick = function () {
        state.selectAllMatching = true;
        sortUsers(getUsers().filter(matchesAll)).forEach(function (u) { state.selected.add(u.id); });
        renderToolbarBulk(totalMatching);
      };
    } else {
      els.selectAllMatchingBtn.hidden = true;
    }
  }

  // ---------- Row menu ----------
  var activeMenuTrigger = null;
  function openRowMenu(trigger) {
    closeRowMenu();
    var id = trigger.getAttribute('data-menu-trigger');
    var items = JSON.parse(trigger.getAttribute('data-menu-items'));
    var user = ALL_USERS.find(function (u) { return u.id === id; });
    els.rowMenu.innerHTML = items.map(function (it) {
      return '<button type="button" role="menuitem" data-action="' + it.action + '" class="flex w-full h-8 items-center px-3 text-left hover:bg-slate-50 ' + (it.destructive ? 'text-red-700' : 'text-slate-700') + '">' + it.label + '</button>';
    }).join('');
    var rect = trigger.getBoundingClientRect();
    els.rowMenu.style.top = Math.min(rect.bottom + 4, window.innerHeight - 160) + 'px';
    els.rowMenu.style.left = Math.max(8, rect.right - 208) + 'px';
    els.rowMenu.hidden = false;
    trigger.setAttribute('aria-expanded', 'true');
    activeMenuTrigger = trigger;
    Array.prototype.forEach.call(els.rowMenu.querySelectorAll('[data-action]'), function (btn) {
      btn.addEventListener('click', function () { handleRowAction(user, btn.getAttribute('data-action')); closeRowMenu(); });
    });
    var first = els.rowMenu.querySelector('button');
    if (first) first.focus();
  }
  function closeRowMenu() {
    els.rowMenu.hidden = true;
    if (activeMenuTrigger) { activeMenuTrigger.setAttribute('aria-expanded', 'false'); activeMenuTrigger = null; }
  }
  document.addEventListener('click', function (e) {
    if (!els.rowMenu.hidden && !els.rowMenu.contains(e.target)) closeRowMenu();
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeRowMenu(); });

  function handleRowAction(user, action) {
    if (action === 'reset') {
      toast('Đã gửi email đặt lại mật khẩu cho ' + user.email);
    } else if (action === 'resend') {
      toast('Đã gửi lại lời mời cho ' + user.email);
    } else if (action === 'enable') {
      user.status = 'active';
      toast('Đã kích hoạt lại tài khoản ' + user.name);
      render();
    } else if (action === 'disable') {
      openConfirm({
        title: 'Vô hiệu hóa tài khoản ' + user.name + '?',
        body: 'Họ sẽ ngay lập tức mất quyền truy cập vào hệ thống. Bạn có thể kích hoạt lại tài khoản sau.',
        confirmLabel: 'Vô hiệu hóa tài khoản',
        destructive: true,
        onConfirm: function (done) {
          setTimeout(function () { user.status = 'disabled'; done(); toast('Đã vô hiệu hóa tài khoản ' + user.name); render(); }, 500);
        }
      });
    } else if (action === 'remove') {
      openConfirm({
        title: 'Xóa tài khoản ' + user.name + '?',
        body: 'Tài khoản và lịch sử hoạt động sẽ bị xóa vĩnh viễn và không thể khôi phục.',
        confirmLabel: 'Xóa tài khoản',
        destructive: true,
        onConfirm: function (done) {
          setTimeout(function () {
            var idx = ALL_USERS.indexOf(user);
            if (idx !== -1) ALL_USERS.splice(idx, 1);
            state.selected.delete(user.id);
            done();
            toast('Đã xóa tài khoản ' + user.name);
            render();
          }, 500);
        }
      });
    }
  }

  // ---------- Bulk actions ----------
  els.bulkCancelBtn.addEventListener('click', function () {
    state.selected = new Set(); state.selectAllMatching = false; render();
    els.selectAllCheckbox.focus();
  });
  els.bulkResendBtn.addEventListener('click', function () {
    var targets = ALL_USERS.filter(function (u) { return state.selected.has(u.id) && u.status === 'invited'; });
    if (!targets.length) { toast('Không có tài khoản Đã mời trong số đã chọn'); return; }
    toast('Đã gửi lại lời mời cho ' + targets.length + ' tài khoản');
  });
  els.bulkDisableBtn.addEventListener('click', function () {
    var targets = ALL_USERS.filter(function (u) { return state.selected.has(u.id) && u.status !== 'disabled'; });
    if (!targets.length) { toast('Các tài khoản đã chọn đều đã bị vô hiệu hóa'); return; }
    openConfirm({
      title: 'Vô hiệu hóa ' + targets.length + ' tài khoản?',
      body: 'Những người dùng này sẽ ngay lập tức mất quyền truy cập vào hệ thống.',
      confirmLabel: 'Vô hiệu hóa ' + targets.length + ' tài khoản',
      destructive: true,
      onConfirm: function (done) {
        setTimeout(function () {
          targets.forEach(function (u) { u.status = 'disabled'; });
          state.selected = new Set(); state.selectAllMatching = false;
          done();
          toast('Đã vô hiệu hóa ' + targets.length + ' tài khoản');
          render();
        }, 600);
      }
    });
  });

  // ---------- Confirm dialog ----------
  var confirmOverlay = document.getElementById('confirmOverlay');
  var confirmCancelBtn = document.getElementById('confirmCancelBtn');
  var confirmActionBtn = document.getElementById('confirmActionBtn');
  var confirmSpinner = document.getElementById('confirmSpinner');
  var confirmActionLabel = document.getElementById('confirmActionLabel');
  var confirmError = document.getElementById('confirmError');
  var lastFocused = null;
  var pendingConfirm = null;

  function openConfirm(opts) {
    pendingConfirm = opts;
    document.getElementById('confirmTitle').textContent = opts.title;
    document.getElementById('confirmBody').textContent = opts.body;
    confirmActionLabel.textContent = opts.confirmLabel;
    confirmCancelBtn.textContent = opts.cancelLabel || 'Hủy';
    confirmActionBtn.className = 'h-8 inline-flex items-center gap-1.5 rounded px-3 text-sm font-medium text-white ' + (opts.destructive ? 'bg-red-600 hover:bg-red-700' : 'bg-blue-700 hover:bg-blue-800');
    confirmError.hidden = true;
    confirmSpinner.hidden = true;
    lastFocused = document.activeElement;
    confirmOverlay.hidden = false;
    confirmCancelBtn.focus();
  }
  function closeConfirm() {
    confirmOverlay.hidden = true;
    pendingConfirm = null;
    if (lastFocused) lastFocused.focus();
  }
  confirmCancelBtn.addEventListener('click', closeConfirm);
  confirmOverlay.addEventListener('click', function (e) { if (e.target === confirmOverlay) closeConfirm(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !confirmOverlay.hidden) closeConfirm(); });
  confirmActionBtn.addEventListener('click', function () {
    if (!pendingConfirm) return;
    confirmActionBtn.disabled = true;
    confirmSpinner.hidden = false;
    pendingConfirm.onConfirm(function () {
      confirmActionBtn.disabled = false;
      confirmSpinner.hidden = true;
      closeConfirm();
    });
  });

  // ---------- Invite dialog ----------
  var inviteOverlay = document.getElementById('inviteOverlay');
  var inviteForm = document.getElementById('inviteForm');
  var inviteEmail = document.getElementById('inviteEmail');
  var inviteRole = document.getElementById('inviteRole');
  var inviteNote = document.getElementById('inviteNote');
  var inviteEmailError = document.getElementById('inviteEmailError');
  var inviteRoleError = document.getElementById('inviteRoleError');
  var inviteServerError = document.getElementById('inviteServerError');
  var inviteSubmitBtn = document.getElementById('inviteSubmitBtn');
  var inviteSpinner = document.getElementById('inviteSpinner');
  var inviteLastFocused = null;

  function openInviteDialog() {
    inviteForm.reset();
    clearInviteErrors();
    inviteLastFocused = document.activeElement;
    inviteOverlay.hidden = false;
    inviteEmail.focus();
  }
  function isInviteDirty() {
    return !!(inviteEmail.value || inviteRole.value || inviteNote.value);
  }
  function closeInviteDialog(force) {
    if (!force && isInviteDirty()) {
      if (!window.confirm('Hủy mời người dùng? Thông tin đã nhập sẽ bị mất.')) return;
    }
    inviteOverlay.hidden = true;
    if (inviteLastFocused) inviteLastFocused.focus();
  }
  function clearInviteErrors() {
    inviteEmailError.classList.add('hidden'); inviteEmailError.classList.remove('flex'); inviteEmailError.textContent = '';
    inviteRoleError.classList.add('hidden'); inviteRoleError.classList.remove('flex'); inviteRoleError.textContent = '';
    inviteServerError.hidden = true;
    inviteEmail.removeAttribute('aria-invalid');
    inviteRole.removeAttribute('aria-invalid');
  }
  function setFieldError(input, errorEl, message) {
    errorEl.textContent = message;
    errorEl.classList.remove('hidden'); errorEl.classList.add('flex');
    input.setAttribute('aria-invalid', 'true');
  }
  function validEmail(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }

  document.getElementById('inviteBtn').addEventListener('click', openInviteDialog);
  document.getElementById('inviteCancelBtn').addEventListener('click', function () { closeInviteDialog(false); });
  inviteOverlay.addEventListener('click', function (e) { if (e.target === inviteOverlay) closeInviteDialog(false); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !inviteOverlay.hidden) closeInviteDialog(false); });

  inviteEmail.addEventListener('blur', function () {
    if (!inviteEmail.value) { setFieldError(inviteEmail, inviteEmailError, 'Nhập email người nhận'); return; }
    if (!validEmail(inviteEmail.value)) { setFieldError(inviteEmail, inviteEmailError, 'Nhập email hợp lệ, ví dụ ten@novawork.vn'); return; }
    var exists = ALL_USERS.some(function (u) { return u.email.toLowerCase() === inviteEmail.value.toLowerCase(); });
    if (exists) { setFieldError(inviteEmail, inviteEmailError, 'Email này đã có trong hệ thống'); return; }
    inviteEmailError.classList.add('hidden'); inviteEmail.removeAttribute('aria-invalid');
  });
  inviteRole.addEventListener('blur', function () {
    if (!inviteRole.value) { setFieldError(inviteRole, inviteRoleError, 'Chọn vai trò cho người dùng'); return; }
    inviteRoleError.classList.add('hidden'); inviteRole.removeAttribute('aria-invalid');
  });

  inviteForm.addEventListener('submit', function (e) {
    e.preventDefault();
    clearInviteErrors();
    var ok = true;
    if (!inviteEmail.value) { setFieldError(inviteEmail, inviteEmailError, 'Nhập email người nhận'); ok = false; }
    else if (!validEmail(inviteEmail.value)) { setFieldError(inviteEmail, inviteEmailError, 'Nhập email hợp lệ, ví dụ ten@novawork.vn'); ok = false; }
    else if (ALL_USERS.some(function (u) { return u.email.toLowerCase() === inviteEmail.value.toLowerCase(); })) {
      setFieldError(inviteEmail, inviteEmailError, 'Email này đã có trong hệ thống'); ok = false;
    }
    if (!inviteRole.value) { setFieldError(inviteRole, inviteRoleError, 'Chọn vai trò cho người dùng'); ok = false; }
    if (!ok) { (inviteEmail.getAttribute('aria-invalid') ? inviteEmail : inviteRole).focus(); return; }

    inviteSubmitBtn.disabled = true;
    inviteSpinner.hidden = false;
    setTimeout(function () {
      var email = inviteEmail.value.trim();
      var newUser = {
        id: 'U-' + (1000 + nextSeq++),
        name: email.split('@')[0].replace(/\./g, ' '),
        email: email,
        role: inviteRole.value,
        status: 'invited',
        lastLogin: null,
        createdAt: Date.now()
      };
      ALL_USERS.unshift(newUser);
      inviteSubmitBtn.disabled = false;
      inviteSpinner.hidden = true;
      closeInviteDialog(true);
      toast('Đã gửi lời mời đến ' + email);
      state.statusTab = 'all';
      render();
    }, 600);
  });

  // ---------- Toast ----------
  function toast(message) {
    var el = document.createElement('div');
    el.className = 'rounded-md border border-slate-200 bg-white shadow-lg px-4 py-3 text-sm text-slate-900 flex items-start gap-2';
    el.innerHTML = '<svg class="size-4 shrink-0 text-emerald-600 mt-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="m8.5 12.5 2.3 2.3 4.7-5.1"/></svg><span>' + escapeHtml(message) + '</span>';
    els.toastRegion = document.getElementById('toastRegion');
    els.toastRegion.appendChild(el);
    var timer = setTimeout(remove, 5000);
    el.addEventListener('mouseenter', function () { clearTimeout(timer); });
    el.addEventListener('mouseleave', function () { timer = setTimeout(remove, 5000); });
    function remove() { el.remove(); }
  }

  // ---------- Export ----------
  document.getElementById('exportBtn').addEventListener('click', function () {
    var filtered = getUsers().filter(matchesAll);
    toast('Đã xuất ' + filtered.length + ' người dùng');
  });

  // ---------- Search ----------
  var searchTimer = null;
  els.searchInput.addEventListener('input', function () {
    els.searchClear.hidden = !els.searchInput.value;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function () {
      state.q = els.searchInput.value;
      resetPageAndSelection();
      render();
    }, 300);
  });
  els.searchClear.addEventListener('click', function () {
    els.searchInput.value = ''; els.searchClear.hidden = true; state.q = '';
    resetPageAndSelection(); render(); els.searchInput.focus();
  });

  // ---------- Role filter popover ----------
  function toggleRoleFilter(show) {
    els.roleFilterPanel.hidden = !show;
    els.roleFilterBtn.setAttribute('aria-expanded', String(show));
  }
  els.roleFilterBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    toggleRoleFilter(els.roleFilterPanel.hidden);
  });
  document.addEventListener('click', function (e) {
    if (!els.roleFilterPanel.hidden && !els.roleFilterPanel.contains(e.target) && e.target !== els.roleFilterBtn) toggleRoleFilter(false);
  });

  // ---------- More filters popover ----------
  var pendingLastLoginRange = state.lastLoginRange;
  function toggleMoreFilters(show) {
    if (show) { els.lastLoginSelect.value = state.lastLoginRange; }
    els.moreFiltersPanel.hidden = !show;
    els.moreFiltersBtn.setAttribute('aria-expanded', String(show));
  }
  els.moreFiltersBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    toggleMoreFilters(els.moreFiltersPanel.hidden);
  });
  document.addEventListener('click', function (e) {
    if (!els.moreFiltersPanel.hidden && !els.moreFiltersPanel.contains(e.target) && e.target !== els.moreFiltersBtn) toggleMoreFilters(false);
  });
  document.getElementById('moreFiltersApply').addEventListener('click', function () {
    state.lastLoginRange = els.lastLoginSelect.value;
    toggleMoreFilters(false);
    resetPageAndSelection();
    render();
  });
  document.getElementById('moreFiltersReset').addEventListener('click', function () {
    els.lastLoginSelect.value = 'all';
    state.lastLoginRange = 'all';
    toggleMoreFilters(false);
    resetPageAndSelection();
    render();
  });

  // ---------- Sorting ----------
  els.sortName.addEventListener('click', function () { toggleSort('name'); });
  els.sortLogin.addEventListener('click', function () { toggleSort('lastLogin'); });
  var DEFAULT_SORT = { key: 'lastLogin', dir: 'desc' };
  function toggleSort(key) {
    if (state.sort.key !== key) {
      state.sort = { key: key, dir: 'asc' };
    } else if (state.sort.dir === 'asc') {
      state.sort = { key: key, dir: 'desc' };
    } else {
      state.sort = { key: DEFAULT_SORT.key, dir: DEFAULT_SORT.dir };
    }
    render();
  }

  // ---------- Select all on page ----------
  els.selectAllCheckbox.addEventListener('change', function () {
    if (els.selectAllCheckbox.checked) {
      currentPageIds.forEach(function (id) { state.selected.add(id); });
    } else {
      currentPageIds.forEach(function (id) { state.selected.delete(id); state.selectAllMatching = false; });
    }
    render();
  });

  // ---------- Pagination ----------
  els.pageSizeSelect.addEventListener('change', function () {
    state.pageSize = Number(els.pageSizeSelect.value);
    resetPageAndSelection();
    render();
  });
  els.prevPageBtn.addEventListener('click', function () { state.page -= 1; state.selected = new Set(); state.selectAllMatching = false; render(); });
  els.nextPageBtn.addEventListener('click', function () { state.page += 1; state.selected = new Set(); state.selectAllMatching = false; render(); });

  // ---------- Sidebar collapse ----------
  var collapsed = false;
  document.getElementById('collapseBtn').addEventListener('click', function () {
    collapsed = !collapsed;
    var sidebar = document.getElementById('sidebar');
    sidebar.classList.toggle('w-60', !collapsed);
    sidebar.classList.toggle('w-14', collapsed);
    document.getElementById('collapseBtn').setAttribute('aria-expanded', String(!collapsed));
    Array.prototype.forEach.call(document.querySelectorAll('.nav-label, #brandLabel, #grp1, #grp2'), function (el) {
      el.hidden = collapsed;
    });
  });

  // ---------- Initial load ----------
  render();
  if (state.loading) {
    setTimeout(function () {
      state.loading = false;
      render();
    }, 500);
  }
})();
</script>
</body>
</html>
