<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IT Service Desk Board</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  .card-drag-over { outline: 2px dashed #6366f1; outline-offset: -2px; background-color: #eef2ff; }
  .card-dragging { opacity: 0.4; }
  .scrollbar-thin::-webkit-scrollbar { height: 8px; width: 8px; }
  .scrollbar-thin::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 9999px; }
  .scrollbar-thin::-webkit-scrollbar-track { background-color: transparent; }
  @keyframes pop-in { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
  .animate-pop-in { animation: pop-in 0.15s ease-out; }
  [draggable="true"] { cursor: grab; }
  [draggable="true"]:active { cursor: grabbing; }
</style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

<!-- Header -->
<header class="bg-slate-900 text-white sticky top-0 z-30 shadow-md">
  <div class="max-w-[1600px] mx-auto px-6 py-4 flex items-center justify-between gap-4 flex-wrap">
    <div class="flex items-center gap-3">
      <div class="h-9 w-9 rounded-lg bg-indigo-500 flex items-center justify-center font-bold text-lg shrink-0">IT</div>
      <div>
        <h1 class="text-lg font-semibold leading-tight">IT Service Desk Board</h1>
        <p class="text-xs text-slate-400 leading-tight">Ticket triage &amp; tracking</p>
      </div>
    </div>

    <div class="flex items-center gap-3 flex-wrap">
      <div class="relative">
        <svg class="absolute left-3 top-1/2 -translate-y-1/2 h-4 w-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M17 10a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <input id="searchInput" type="text" placeholder="Search tickets..." class="bg-slate-800 text-sm placeholder-slate-500 text-white pl-9 pr-3 py-2 rounded-lg border border-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 w-56">
      </div>

      <select id="priorityFilter" class="bg-slate-800 text-sm text-white px-3 py-2 rounded-lg border border-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <option value="">All priorities</option>
        <option value="Critical">Critical</option>
        <option value="High">High</option>
        <option value="Medium">Medium</option>
        <option value="Low">Low</option>
      </select>

      <select id="assigneeFilter" class="bg-slate-800 text-sm text-white px-3 py-2 rounded-lg border border-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <option value="">All assignees</option>
      </select>

      <button id="newTicketBtn" class="bg-indigo-500 hover:bg-indigo-400 transition text-white text-sm font-medium px-4 py-2 rounded-lg flex items-center gap-1.5 shadow-sm">
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
        New Ticket
      </button>
    </div>
  </div>
</header>

<!-- Stats bar -->
<div class="max-w-[1600px] mx-auto px-6 pt-5">
  <div id="statsBar" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-3"></div>
</div>

<!-- Board -->
<main class="max-w-[1600px] mx-auto px-6 py-6">
  <div id="board" class="flex gap-4 overflow-x-auto pb-4 scrollbar-thin items-start"></div>
</main>

<!-- Ticket Modal -->
<div id="ticketModal" class="hidden fixed inset-0 bg-black/40 z-40 flex items-center justify-center p-4">
  <div class="bg-white rounded-xl shadow-xl w-full max-w-lg animate-pop-in max-h-[90vh] overflow-y-auto">
    <div class="flex items-center justify-between px-6 py-4 border-b border-slate-200">
      <h2 id="modalTitle" class="text-base font-semibold text-slate-900">New Ticket</h2>
      <button id="closeModalBtn" class="text-slate-400 hover:text-slate-600">
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
    <form id="ticketForm" class="px-6 py-5 space-y-4">
      <input type="hidden" id="ticketId">
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">Subject</label>
        <input id="ticketSubject" required type="text" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="e.g. VPN disconnects every 10 minutes">
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">Description</label>
        <textarea id="ticketDescription" rows="3" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Details reported by the user..."></textarea>
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Status</label>
          <select id="ticketStatus" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"></select>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Priority</label>
          <select id="ticketPriority" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option>Critical</option>
            <option>High</option>
            <option selected>Medium</option>
            <option>Low</option>
          </select>
        </div>
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Assignee</label>
          <select id="ticketAssignee" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"></select>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Due date</label>
          <input id="ticketDueDate" type="date" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">Category</label>
        <select id="ticketCategory" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <option>Hardware</option>
          <option>Software</option>
          <option>Network</option>
          <option>Access &amp; Accounts</option>
          <option>Email</option>
          <option>Other</option>
        </select>
      </div>

      <div class="flex items-center justify-between pt-2">
        <button type="button" id="deleteTicketBtn" class="hidden text-sm text-red-600 hover:text-red-700 font-medium">Delete ticket</button>
        <div class="flex gap-2 ml-auto">
          <button type="button" id="cancelModalBtn" class="px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-lg">Cancel</button>
          <button type="submit" class="px-4 py-2 text-sm font-medium text-white bg-indigo-500 hover:bg-indigo-400 rounded-lg shadow-sm">Save ticket</button>
        </div>
      </div>
    </form>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="hidden fixed bottom-5 right-5 bg-slate-900 text-white text-sm px-4 py-2.5 rounded-lg shadow-lg z-50"></div>

<script>
(function () {
  "use strict";

  const STATUSES = [
    { key: "new",        label: "New",         color: "bg-sky-500",    headerBg: "bg-sky-50",    headerText: "text-sky-700" },
    { key: "inprogress", label: "In Progress", color: "bg-amber-500",  headerBg: "bg-amber-50",  headerText: "text-amber-700" },
    { key: "pending",    label: "Pending",     color: "bg-purple-500", headerBg: "bg-purple-50", headerText: "text-purple-700" },
    { key: "resolved",   label: "Resolved",    color: "bg-emerald-500",headerBg: "bg-emerald-50",headerText: "text-emerald-700" },
    { key: "closed",     label: "Closed",      color: "bg-slate-400",  headerBg: "bg-slate-50",  headerText: "text-slate-600" }
  ];

  const PRIORITY_STYLES = {
    Critical: "bg-red-100 text-red-700 ring-1 ring-red-200",
    High:     "bg-orange-100 text-orange-700 ring-1 ring-orange-200",
    Medium:   "bg-amber-100 text-amber-700 ring-1 ring-amber-200",
    Low:      "bg-slate-100 text-slate-600 ring-1 ring-slate-200"
  };

  const PRIORITY_DOT = {
    Critical: "bg-red-500",
    High: "bg-orange-500",
    Medium: "bg-amber-500",
    Low: "bg-slate-400"
  };

  const ASSIGNEES = [
    { name: "Dana Whitfield", initials: "DW", color: "bg-indigo-500" },
    { name: "Marcus Lee",     initials: "ML", color: "bg-rose-500" },
    { name: "Priya Nandakumar", initials: "PN", color: "bg-teal-500" },
    { name: "Colin Baptiste", initials: "CB", color: "bg-fuchsia-500" },
    { name: "Hannah Ortiz",   initials: "HO", color: "bg-cyan-600" },
    { name: "Unassigned",    initials: "–",  color: "bg-slate-300" }
  ];

  function assigneeByName(name) {
    return ASSIGNEES.find(a => a.name === name) || ASSIGNEES[ASSIGNEES.length - 1];
  }

  function daysFromToday(offset) {
    const d = new Date();
    d.setDate(d.getDate() + offset);
    return d.toISOString().slice(0, 10);
  }

  let tickets = [
    { id: "ITSD-1042", subject: "VPN disconnects every 10 minutes", description: "User reports VPN client drops connection repeatedly on the Seattle office WiFi, requiring manual reconnect.", status: "new", priority: "High", assignee: "Marcus Lee", dueDate: daysFromToday(1), category: "Network", requester: "J. Alvarez" },
    { id: "ITSD-1041", subject: "New hire laptop setup - R. Kapoor", description: "Provision and image a new laptop for incoming analyst starting Monday.", status: "new", priority: "Medium", assignee: "Dana Whitfield", dueDate: daysFromToday(4), category: "Hardware", requester: "HR Onboarding" },
    { id: "ITSD-1039", subject: "Cannot access shared Finance drive", description: "Permissions appear to have been revoked after last night's AD sync.", status: "new", priority: "Critical", assignee: "Unassigned", dueDate: daysFromToday(0), category: "Access & Accounts", requester: "T. Nguyen" },
    { id: "ITSD-1037", subject: "Printer on 3rd floor jamming constantly", description: "HP LaserJet near the east stairwell jams on every duplex print job.", status: "new", priority: "Low", assignee: "Unassigned", dueDate: daysFromToday(6), category: "Hardware", requester: "Facilities" },

    { id: "ITSD-1035", subject: "Outlook crashes when opening calendar invites", description: "Reproducible crash on Windows 11 build 23H2 when double-clicking .ics attachments.", status: "inprogress", priority: "High", assignee: "Priya Nandakumar", dueDate: daysFromToday(2), category: "Software", requester: "B. Shaw" },
    { id: "ITSD-1033", subject: "Password reset loop for SSO portal", description: "User stuck in reset loop, receives 'token expired' even with fresh link.", status: "inprogress", priority: "Critical", assignee: "Colin Baptiste", dueDate: daysFromToday(0), category: "Access & Accounts", requester: "L. Fischer" },
    { id: "ITSD-1030", subject: "Conference room AV not pairing with laptops", description: "Bluetooth and HDMI both fail intermittently in Boardroom B.", status: "inprogress", priority: "Medium", assignee: "Hannah Ortiz", dueDate: daysFromToday(3), category: "Hardware", requester: "Office Admin" },

    { id: "ITSD-1026", subject: "Waiting on vendor callback for firewall license", description: "Renewal ticket opened with vendor support, awaiting case update before proceeding.", status: "pending", priority: "Medium", assignee: "Marcus Lee", dueDate: daysFromToday(5), category: "Network", requester: "IT Infra" },
    { id: "ITSD-1024", subject: "User needs manager approval for admin rights", description: "Requested local admin on workstation for dev tooling; pending manager sign-off.", status: "pending", priority: "Low", assignee: "Dana Whitfield", dueDate: daysFromToday(7), category: "Access & Accounts", requester: "S. Blackwood" },

    { id: "ITSD-1018", subject: "Email migration to new mailbox completed", description: "Confirmed mailbox migrated, user validated access and archived folders.", status: "resolved", priority: "Medium", assignee: "Priya Nandakumar", dueDate: daysFromToday(-1), category: "Email", requester: "R. Patel" },
    { id: "ITSD-1015", subject: "Replaced failing SSD on finance workstation", description: "Swapped drive, restored from backup, verified boot and data integrity.", status: "resolved", priority: "High", assignee: "Colin Baptiste", dueDate: daysFromToday(-2), category: "Hardware", requester: "Finance Team" },
    { id: "ITSD-1012", subject: "Reset MFA device for traveling exec", description: "Verified identity via secondary channel, re-enrolled authenticator app.", status: "resolved", priority: "High", assignee: "Hannah Ortiz", dueDate: daysFromToday(-3), category: "Access & Accounts", requester: "C. Romano" },

    { id: "ITSD-1005", subject: "Legacy printer decommissioned", description: "Removed from domain and print server after department relocation.", status: "closed", priority: "Low", assignee: "Dana Whitfield", dueDate: daysFromToday(-10), category: "Hardware", requester: "Facilities" },
    { id: "ITSD-1002", subject: "Guest WiFi password rotation", description: "Quarterly rotation completed and communicated to front desk.", status: "closed", priority: "Low", assignee: "Marcus Lee", dueDate: daysFromToday(-14), category: "Network", requester: "Front Desk" }
  ];

  let nextIdNum = 1043;
  let draggedId = null;
  let editingId = null;

  const boardEl = document.getElementById("board");
  const statsBarEl = document.getElementById("statsBar");
  const searchInput = document.getElementById("searchInput");
  const priorityFilter = document.getElementById("priorityFilter");
  const assigneeFilter = document.getElementById("assigneeFilter");
  const toastEl = document.getElementById("toast");

  const modal = document.getElementById("ticketModal");
  const form = document.getElementById("ticketForm");
  const modalTitle = document.getElementById("modalTitle");
  const deleteBtn = document.getElementById("deleteTicketBtn");

  function initSelectOptions() {
    const statusSelect = document.getElementById("ticketStatus");
    statusSelect.innerHTML = STATUSES.map(s => `<option value="${s.key}">${s.label}</option>`).join("");

    const assigneeSelect = document.getElementById("ticketAssignee");
    assigneeSelect.innerHTML = ASSIGNEES.map(a => `<option value="${a.name}">${a.name}</option>`).join("");

    assigneeFilter.innerHTML = `<option value="">All assignees</option>` +
      ASSIGNEES.filter(a => a.name !== "Unassigned").map(a => `<option value="${a.name}">${a.name}</option>`).join("") +
      `<option value="Unassigned">Unassigned</option>`;
  }

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.remove("hidden");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toastEl.classList.add("hidden"), 2200);
  }

  function fmtDate(iso) {
    const d = new Date(iso + "T00:00:00");
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
  }

  function dueMeta(iso, status) {
    if (status === "resolved" || status === "closed") {
      return { text: fmtDate(iso), cls: "text-slate-400" };
    }
    const today = new Date(); today.setHours(0,0,0,0);
    const due = new Date(iso + "T00:00:00");
    const diffDays = Math.round((due - today) / 86400000);
    if (diffDays < 0) return { text: `${fmtDate(iso)} (overdue)`, cls: "text-red-600 font-medium" };
    if (diffDays === 0) return { text: `${fmtDate(iso)} (today)`, cls: "text-orange-600 font-medium" };
    if (diffDays <= 2) return { text: fmtDate(iso), cls: "text-amber-600 font-medium" };
    return { text: fmtDate(iso), cls: "text-slate-500" };
  }

  function matchesFilters(t) {
    const q = searchInput.value.trim().toLowerCase();
    const p = priorityFilter.value;
    const a = assigneeFilter.value;
    if (p && t.priority !== p) return false;
    if (a && t.assignee !== a) return false;
    if (q) {
      const hay = `${t.id} ${t.subject} ${t.description} ${t.assignee} ${t.category}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }

  function renderStats() {
    const total = tickets.length;
    const critical = tickets.filter(t => t.priority === "Critical" && t.status !== "resolved" && t.status !== "closed").length;
    const overdue = tickets.filter(t => {
      if (t.status === "resolved" || t.status === "closed") return false;
      const today = new Date(); today.setHours(0,0,0,0);
      return new Date(t.dueDate + "T00:00:00") < today;
    }).length;
    const open = tickets.filter(t => t.status !== "resolved" && t.status !== "closed").length;

    const cards = [
      { label: "Total tickets", value: total, accent: "text-slate-900" },
      { label: "Open", value: open, accent: "text-sky-600" },
      { label: "Critical (open)", value: critical, accent: "text-red-600" },
      { label: "Overdue", value: overdue, accent: "text-orange-600" },
      { label: "Resolved", value: tickets.filter(t => t.status === "resolved").length, accent: "text-emerald-600" },
      { label: "Closed", value: tickets.filter(t => t.status === "closed").length, accent: "text-slate-500" }
    ];

    statsBarEl.innerHTML = cards.map(c => `
      <div class="bg-white rounded-xl border border-slate-200 px-4 py-3 shadow-sm">
        <div class="text-2xl font-semibold ${c.accent}">${c.value}</div>
        <div class="text-xs text-slate-500 mt-0.5">${c.label}</div>
      </div>
    `).join("");
  }

  function cardHtml(t) {
    const assignee = assigneeByName(t.assignee);
    const due = dueMeta(t.dueDate, t.status);
    const statusIdx = STATUSES.findIndex(s => s.key === t.status);
    const prevStatus = STATUSES[statusIdx - 1];
    const nextStatus = STATUSES[statusIdx + 1];

    return `
      <div class="bg-white rounded-lg border border-slate-200 shadow-sm hover:shadow-md transition-shadow p-3.5 cursor-pointer group"
           draggable="true" data-id="${t.id}">
        <div class="flex items-start justify-between gap-2">
          <span class="text-[11px] font-mono text-slate-400">${t.id}</span>
          <span class="shrink-0 inline-flex items-center gap-1 text-[11px] font-medium px-2 py-0.5 rounded-full ${PRIORITY_STYLES[t.priority]}">
            <span class="h-1.5 w-1.5 rounded-full ${PRIORITY_DOT[t.priority]}"></span>${t.priority}
          </span>
        </div>
        <p class="mt-1.5 text-sm font-medium text-slate-800 leading-snug line-clamp-2">${escapeHtml(t.subject)}</p>
        <p class="mt-1 text-[11px] text-slate-400">${escapeHtml(t.category)}</p>

        <div class="mt-3 flex items-center justify-between">
          <div class="flex items-center gap-1.5" title="${escapeHtml(t.assignee)}">
            <span class="h-6 w-6 rounded-full ${assignee.color} text-white text-[10px] font-semibold flex items-center justify-center">${assignee.initials}</span>
            <span class="text-xs text-slate-500 max-w-[90px] truncate">${escapeHtml(t.assignee)}</span>
          </div>
          <div class="flex items-center gap-1 text-xs ${due.cls}">
            <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
            ${due.text}
          </div>
        </div>

        <div class="mt-3 pt-2.5 border-t border-slate-100 flex items-center justify-between opacity-0 group-hover:opacity-100 transition-opacity">
          <button data-action="prev" data-id="${t.id}" class="text-[11px] px-2 py-1 rounded-md text-slate-500 hover:bg-slate-100 disabled:opacity-0 disabled:cursor-default flex items-center gap-1" ${!prevStatus ? "disabled" : ""}>
            <svg class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
            ${prevStatus ? prevStatus.label : ""}
          </button>
          <button data-action="next" data-id="${t.id}" class="text-[11px] px-2 py-1 rounded-md text-indigo-600 hover:bg-indigo-50 disabled:opacity-0 disabled:cursor-default flex items-center gap-1" ${!nextStatus ? "disabled" : ""}>
            ${nextStatus ? nextStatus.label : ""}
            <svg class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
          </button>
        </div>
      </div>
    `;
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function renderBoard() {
    const visible = tickets.filter(matchesFilters);

    boardEl.innerHTML = STATUSES.map(s => {
      const colTickets = visible.filter(t => t.status === s.key);
      return `
        <div class="flex-shrink-0 w-[300px] bg-slate-50 rounded-xl border border-slate-200 flex flex-col max-h-[calc(100vh-230px)]" data-col="${s.key}">
          <div class="px-3.5 py-3 rounded-t-xl ${s.headerBg} flex items-center justify-between sticky top-0 z-10 border-b border-slate-200">
            <div class="flex items-center gap-2">
              <span class="h-2 w-2 rounded-full ${s.color}"></span>
              <h3 class="text-sm font-semibold ${s.headerText}">${s.label}</h3>
            </div>
            <span class="text-xs font-medium text-slate-500 bg-white/70 rounded-full px-2 py-0.5">${colTickets.length}</span>
          </div>
          <div class="flex-1 overflow-y-auto scrollbar-thin px-2.5 py-2.5 space-y-2.5 drop-zone min-h-[80px]" data-col="${s.key}">
            ${colTickets.map(cardHtml).join("") || `<div class="text-xs text-slate-400 text-center py-8">No tickets</div>`}
          </div>
        </div>
      `;
    }).join("");

    attachCardEvents();
  }

  function attachCardEvents() {
    boardEl.querySelectorAll('[data-id][draggable="true"]').forEach(card => {
      card.addEventListener("dragstart", e => {
        draggedId = card.dataset.id;
        card.classList.add("card-dragging");
        e.dataTransfer.effectAllowed = "move";
      });
      card.addEventListener("dragend", () => {
        card.classList.remove("card-dragging");
        draggedId = null;
      });
      card.addEventListener("click", (e) => {
        if (e.target.closest("[data-action]")) return;
        openEditModal(card.dataset.id);
      });
    });

    boardEl.querySelectorAll("[data-action]").forEach(btn => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        const id = btn.dataset.id;
        const dir = btn.dataset.action;
        moveTicketStep(id, dir);
      });
    });

    boardEl.querySelectorAll(".drop-zone").forEach(zone => {
      zone.addEventListener("dragover", e => {
        e.preventDefault();
        zone.classList.add("card-drag-over");
      });
      zone.addEventListener("dragleave", () => zone.classList.remove("card-drag-over"));
      zone.addEventListener("drop", e => {
        e.preventDefault();
        zone.classList.remove("card-drag-over");
        if (!draggedId) return;
        setStatus(draggedId, zone.dataset.col);
      });
    });
  }

  function moveTicketStep(id, dir) {
    const t = tickets.find(x => x.id === id);
    if (!t) return;
    const idx = STATUSES.findIndex(s => s.key === t.status);
    const newIdx = dir === "next" ? idx + 1 : idx - 1;
    if (newIdx < 0 || newIdx >= STATUSES.length) return;
    setStatus(id, STATUSES[newIdx].key);
  }

  function setStatus(id, statusKey) {
    const t = tickets.find(x => x.id === id);
    if (!t || t.status === statusKey) return;
    t.status = statusKey;
    renderBoard();
    renderStats();
    const label = STATUSES.find(s => s.key === statusKey).label;
    showToast(`${id} moved to ${label}`);
  }

  function openNewModal() {
    editingId = null;
    modalTitle.textContent = "New Ticket";
    deleteBtn.classList.add("hidden");
    form.reset();
    document.getElementById("ticketId").value = "";
    document.getElementById("ticketStatus").value = "new";
    document.getElementById("ticketPriority").value = "Medium";
    document.getElementById("ticketAssignee").value = "Unassigned";
    document.getElementById("ticketDueDate").value = daysFromToday(3);
    modal.classList.remove("hidden");
  }

  function openEditModal(id) {
    const t = tickets.find(x => x.id === id);
    if (!t) return;
    editingId = id;
    modalTitle.textContent = `Edit ${t.id}`;
    deleteBtn.classList.remove("hidden");
    document.getElementById("ticketId").value = t.id;
    document.getElementById("ticketSubject").value = t.subject;
    document.getElementById("ticketDescription").value = t.description;
    document.getElementById("ticketStatus").value = t.status;
    document.getElementById("ticketPriority").value = t.priority;
    document.getElementById("ticketAssignee").value = t.assignee;
    document.getElementById("ticketDueDate").value = t.dueDate;
    document.getElementById("ticketCategory").value = t.category;
    modal.classList.remove("hidden");
  }

  function closeModal() {
    modal.classList.add("hidden");
    editingId = null;
  }

  form.addEventListener("submit", e => {
    e.preventDefault();
    const data = {
      subject: document.getElementById("ticketSubject").value.trim(),
      description: document.getElementById("ticketDescription").value.trim(),
      status: document.getElementById("ticketStatus").value,
      priority: document.getElementById("ticketPriority").value,
      assignee: document.getElementById("ticketAssignee").value,
      dueDate: document.getElementById("ticketDueDate").value,
      category: document.getElementById("ticketCategory").value
    };

    if (editingId) {
      const t = tickets.find(x => x.id === editingId);
      Object.assign(t, data);
      showToast(`${t.id} updated`);
    } else {
      const id = `ITSD-${nextIdNum++}`;
      tickets.unshift({ id, requester: "—", ...data });
      showToast(`${id} created`);
    }
    closeModal();
    renderBoard();
    renderStats();
  });

  deleteBtn.addEventListener("click", () => {
    if (!editingId) return;
    tickets = tickets.filter(t => t.id !== editingId);
    showToast(`${editingId} deleted`);
    closeModal();
    renderBoard();
    renderStats();
  });

  document.getElementById("newTicketBtn").addEventListener("click", openNewModal);
  document.getElementById("closeModalBtn").addEventListener("click", closeModal);
  document.getElementById("cancelModalBtn").addEventListener("click", closeModal);
  modal.addEventListener("click", e => { if (e.target === modal) closeModal(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !modal.classList.contains("hidden")) closeModal(); });

  searchInput.addEventListener("input", renderBoard);
  priorityFilter.addEventListener("change", renderBoard);
  assigneeFilter.addEventListener("change", renderBoard);

  initSelectOptions();
  renderBoard();
  renderStats();
})();
</script>
</body>
</html>
