const byId = {};
ACCOUNTS.forEach(a => byId[a.id] = a);
function childrenOf(id){ return ACCOUNTS.filter(a => a.parent === id).sort((a,b) => a.id.localeCompare(b.id)); }
function ancestorsOf(id){
  const chain = [];
  let cur = byId[id];
  while (cur && cur.parent){ cur = byId[cur.parent]; if (cur) chain.unshift(cur); }
  return chain;
}
function computeBalance(id){
  const a = byId[id];
  if (!a.header){
    const catNorm = categoryNormal[a.cat];
    return a.normal === catNorm ? a.balance : -a.balance;
  }
  return childrenOf(id).reduce((s,c) => s + computeBalance(c.id), 0);
}
function dcLabel(normal){ return normal === 'debit' ? 'Dr' : 'Cr'; }

// ---------------------------------------------------------------------------
// Formatting helpers
// ---------------------------------------------------------------------------
function fmt(n){
  const abs = Math.abs(n);
  return abs.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function money(n){ return '$' + fmt(n); }

// ---------------------------------------------------------------------------
// Deterministic pseudo-random mock transactions
// ---------------------------------------------------------------------------
function seedFromString(s){ let h = 0; for (let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) | 0; } return Math.abs(h) || 1; }
function mulberry32(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function pick(rand, arr){ return arr[Math.floor(rand() * arr.length)]; }

const MEMO_POOLS = {
  asset:     ['Deposit — Customer Payment', 'Check #{n} — Vendor Payment', 'Wire Transfer — Funding', 'Bank Service Fee', 'Interest Earned', 'ATM Withdrawal', 'Transfer Between Accounts'],
  liability: ['Bill Received — {vendor}', 'Payment Issued — Check #{n}', 'Accrual Adjustment', 'Vendor Credit Applied', 'Period-End Accrual'],
  equity:    ['Capital Contribution', 'Owner Distribution', 'Year-End Closing Entry', 'Adjusting Entry'],
  revenue:   ['Invoice #{n} — {customer}', 'Sales Receipt #{n}', 'Credit Memo — {customer}', 'Invoice #{n} — {customer}'],
  expense:   ['Payment — {vendor}', 'Expense Report #{n}', 'Recurring Payment — {vendor}', 'Bill Payment — {vendor}'],
};
const VENDORS = ['Staples Inc.', 'Pacific Power & Light', 'WeWork', 'Verizon Business', 'ADP Payroll Services', 'Acme Logistics', 'CDW Technology', 'Marsh Insurance'];
const CUSTOMERS = ['Acme Corp', 'Globex Inc.', 'Beta Industries', 'Initech LLC', 'Umbrella Group', 'Stark Enterprises'];
const TX_DATES = ['Oct 9, 2026', 'Oct 16, 2026', 'Oct 23, 2026', 'Nov 2, 2026', 'Nov 5, 2026'];

function generateTransactions(a){
  const rand = mulberry32(seedFromString(a.id));
  const pool = MEMO_POOLS[a.cat];
  const changes = [];
  for (let i=0;i<5;i++){
    const magnitude = (0.03 + rand()*0.08) * Math.max(a.balance, 5000);
    const dir = rand() > 0.3 ? 1 : -1;
    changes.push(dir * magnitude);
  }
  const opening = a.balance - changes.reduce((s,c)=>s+c,0);
  let running = opening;
  const rows = [];
  for (let i=0;i<5;i++){
    running += changes[i];
    const n = 1000 + Math.floor(rand()*8999);
    const vendor = pick(rand, VENDORS);
    const customer = pick(rand, CUSTOMERS);
    const memo = pick(rand, pool).replaceAll('{n}', n).replaceAll('{vendor}', vendor).replaceAll('{customer}', customer);
    const mag = Math.abs(changes[i]);
    const inc = changes[i] > 0;
    let debit = 0, credit = 0;
    if (a.normal === 'debit'){ if (inc) debit = mag; else credit = mag; }
    else { if (inc) credit = mag; else debit = mag; }
    rows.push({ date: TX_DATES[i], memo, debit, credit, balance: running });
  }
  return { opening, rows };
}

// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------
let expanded = new Set(ACCOUNTS.filter(a => a.header).map(a => a.id));
let selectedId = '1111';
let activeFilter = 'all';
let searchTerm = '';

// ---------------------------------------------------------------------------
// Tree rendering
// ---------------------------------------------------------------------------
function matchesSearch(a){
  if (!searchTerm) return true;
  const t = searchTerm.toLowerCase();
  return a.name.toLowerCase().includes(t) || a.id.includes(t);
}
function subtreeHasMatch(a){
  if (matchesSearch(a)) return true;
  if (!a.header) return false;
  return childrenOf(a.id).some(subtreeHasMatch);
}
function passesFilter(a){ return activeFilter === 'all' || a.cat === activeFilter; }

function childList(a){
  let kids = childrenOf(a.id);
  if (searchTerm) kids = kids.filter(subtreeHasMatch);
  return kids;
}

function renderNode(a, depth){
  const kids = a.header ? childList(a) : [];
  const hasKids = kids.length > 0;
  const open = searchTerm ? true : expanded.has(a.id);
  const raw = computeBalance(a.id);
  const magnitude = Math.abs(raw);
  const suffix = a.header ? dcLabel(categoryNormal[a.cat]) : dcLabel(a.normal);

  const selected = a.id === selectedId;
  const isContra = !a.header && a.normal !== categoryNormal[a.cat];
  const indent = 10 + depth * 18;

      <span class="inline-block text-[10px] transition-transform duration-150 ${open ? 'rotate-90' : ''}">&#9656;</span>
    </button>`;
  }

  let html = `<div>
    <div onclick="selectAccount('${a.id}')" class="flex items-center justify-between gap-2 mx-1 rounded-md cursor-pointer select-none px-2 py-[7px] ${selected ? 'bg-slate-900 text-white' : 'hover:bg-slate-50'}" style="padding-left:${indent}px">
      <div class="flex items-center gap-2 min-w-0">
        ${toggleHtml}
        <span class="w-1.5 h-1.5 rounded-full ${style.dot} shrink-0"></span>
        <span class="font-mono text-[11px] ${selected ? 'text-slate-300' : 'text-slate-400'} shrink-0">${a.id}</span>
        <span class="truncate text-[13px] ${a.header ? 'font-semibold' : ''} ${selected ? 'text-white' : (a.header ? 'text-slate-700' : 'text-slate-600')} ${a.status === 'inactive' ? 'line-through opacity-60' : ''}">${a.name}</span>
        ${isContra ? `<span class="text-[10px] px-1.5 py-0.5 rounded shrink-0 ${selected ? 'bg-white/15 text-slate-200' : 'bg-slate-100 text-slate-500'}">Contra</span>` : ''}
      </div>
      <div class="flex items-baseline gap-1 shrink-0 font-mono text-[13px] tnum ${a.header ? 'font-semibold' : ''} ${selected ? 'text-white' : 'text-slate-700'}">
        <span>${money(magnitude)}</span><span class="text-[10px] ${selected ? 'text-slate-300' : 'text-slate-400'}">${suffix}</span>
      </div>
    </div>
    ${a.header && hasKids && open ? `<div>${kids.map(k => renderNode(k, depth+1)).join('')}</div>` : ''}
  </div>`;
  return html;
}

function renderTree(){
  let roots = childrenOf(null).filter(passesFilter);
  if (searchTerm) roots = roots.filter(subtreeHasMatch);
  document.getElementById('tree').innerHTML = roots.length
    ? roots.map(r => renderNode(r, 0)).join('')
    : `<div class="px-4 py-8 text-center text-sm text-slate-400">No accounts match your search.</div>`;

  const total = ACCOUNTS.length;
  const visibleLeaves = ACCOUNTS.filter(a => !a.header && passesFilter(a) && matchesSearch(a)).length;
  document.getElementById('treeFooter').textContent = searchTerm || activeFilter !== 'all'
    ? `Showing ${visibleLeaves} of ${ACCOUNTS.filter(a=>!a.header).length} accounts`
    : `${total} accounts total`;
}

function renderChips(){
  const cats = ['all','asset','liability','equity','revenue','expense'];
  document.getElementById('filterChips').innerHTML = cats.map(c => {
    const active = activeFilter === c;
    const label = c === 'all' ? 'All' : categoryLabel[c] + 's';
    const base = 'text-xs font-medium px-2.5 py-1 rounded-full border transition-colors';
    const cls = active
      ? 'bg-slate-900 text-white border-slate-900'
      : 'bg-white text-slate-500 border-slate-200 hover:bg-slate-50';
    return `<button type="button" onclick="setFilter('${c}')" class="${base} ${cls}">${label}</button>`;
  }).join('');
}

function toggleExpand(id, evt){
  evt.stopPropagation();
  if (expanded.has(id)) expanded.delete(id); else expanded.add(id);
  renderTree();
}
function setFilter(cat){ activeFilter = cat; renderChips(); renderTree(); }
function onSearchInput(val){ searchTerm = val.trim(); renderTree(); }
function selectAccount(id){ selectedId = id; renderTree(); renderDetail(); }

// ---------------------------------------------------------------------------
// Summary cards
// ---------------------------------------------------------------------------
function renderSummary(){
  const assets = computeBalance('1000');
  const liabilities = computeBalance('2000');
  const equity = computeBalance('3000');
  const revenue = computeBalance('4000');
  const cogs = computeBalance('5000');
  const opex = computeBalance('6000');
  const netIncome = revenue - cogs - opex;

  const cards = [
    { label: 'Total Assets', value: assets, suffix: 'Dr', cat: 'asset', note: 'Across ' + ACCOUNTS.filter(a=>a.cat==='asset' && !a.header).length + ' accounts' },
    { label: 'Total Liabilities', value: liabilities, suffix: 'Cr', cat: 'liability', note: 'Across ' + ACCOUNTS.filter(a=>a.cat==='liability' && !a.header).length + ' accounts' },
    { label: "Total Equity", value: equity, suffix: 'Cr', cat: 'equity', note: 'Across ' + ACCOUNTS.filter(a=>a.cat==='equity' && !a.header).length + ' accounts' },
    { label: 'Net Income (YTD)', value: netIncome, suffix: netIncome >= 0 ? 'Cr' : 'Dr', cat: netIncome >= 0 ? 'revenue' : 'expense', note: 'Revenue less COGS and operating expenses' },
  ];

  document.getElementById('summaryCards').innerHTML = cards.map(c => {
    const s = typeStyles[c.cat];
    return `<div class="bg-white rounded-xl border border-slate-200 p-4 flex items-start justify-between">
      <div>
        <p class="text-xs font-medium text-slate-400">${c.label}</p>
        <p class="mt-1 text-xl font-semibold text-slate-900 font-mono tnum">${money(Math.abs(c.value))} <span class="text-xs font-normal text-slate-400">${c.suffix}</span></p>
        <p class="mt-1 text-[11px] text-slate-400">${c.note}</p>
      </div>
      <span class="w-2.5 h-2.5 rounded-full ${s.dot} mt-1 shrink-0"></span>
    </div>`;
  }).join('');

  const balanced = Math.abs(assets - (liabilities + equity)) < 0.01;
  const badge = document.getElementById('balancedBadge');
  badge.classList.remove('hidden');
  if (balanced){
    badge.className = 'hidden sm:inline-flex items-center gap-1.5 text-xs font-medium px-2.5 py-1.5 rounded-full border bg-emerald-50 text-emerald-700 border-emerald-200';
    badge.innerHTML = '<svg viewBox="0 0 20 20" fill="currentColor" class="w-3.5 h-3.5"><path fill-rule="evenodd" d="M16.7 5.3a1 1 0 0 1 0 1.4l-7.3 7.3a1 1 0 0 1-1.4 0L3.3 9.3a1 1 0 1 1 1.4-1.4L8 11.2l6.3-6.3a1 1 0 0 1 1.4 0Z" clip-rule="evenodd"/></svg> Books Balanced';
  } else {
    badge.className = 'hidden sm:inline-flex items-center gap-1.5 text-xs font-medium px-2.5 py-1.5 rounded-full border bg-amber-50 text-amber-700 border-amber-200';
    badge.innerHTML = '&#9888; Out of Balance';
  }
}

// ---------------------------------------------------------------------------
// Detail panel
// ---------------------------------------------------------------------------
function breadcrumbHtml(a){
  const chain = [...ancestorsOf(a.id), a];
  return chain.map((node, i) => {
    const isLast = i === chain.length - 1;
    return `<span class="${isLast ? 'text-slate-600 font-medium' : 'text-slate-400 hover:text-slate-600 cursor-pointer'}" ${isLast ? '' : `onclick="selectAccount('${node.id}')"`}>${node.name}</span>`
      + (isLast ? '' : '<span class="text-slate-300">/</span>');
  }).join(' ');
}

function badgePill(text, style){
  return `<span class="text-xs font-medium px-2 py-0.5 rounded-full border ${style.bg} ${style.text} ${style.border}">${text}</span>`;
}

function renderDetail(){
  const a = byId[selectedId];
  const style = typeStyles[a.cat];
  const raw = computeBalance(a.id);
  const magnitude = Math.abs(raw);
  const suffix = a.header ? dcLabel(categoryNormal[a.cat]) : dcLabel(a.normal);
  const isContra = !a.header && a.normal !== categoryNormal[a.cat];
  const statusStyle = a.status === 'active'
    ? 'bg-emerald-50 text-emerald-700 border-emerald-200'
    : 'bg-slate-100 text-slate-500 border-slate-200';

  let body = '';

  if (a.header){
    const kids = childrenOf(a.id);
    body = `<div class="divide-y divide-slate-100">
      <div class="px-4 py-2.5 text-xs font-semibold text-slate-400 uppercase tracking-wide flex justify-between">
        <span>${kids.length} Sub-Account${kids.length === 1 ? '' : 's'}</span>
        <span>Balance</span>
      </div>
      ${kids.map(k => {
        const kRaw = computeBalance(k.id);
        const kMag = Math.abs(kRaw);
        const kSuffix = k.header ? dcLabel(categoryNormal[k.cat]) : dcLabel(k.normal);
        const kStyle = typeStyles[k.cat];
        return `<div class="px-4 py-2.5 flex items-center justify-between gap-3 hover:bg-slate-50 cursor-pointer" onclick="selectAccount('${k.id}')">
          <div class="flex items-center gap-2 min-w-0">
            <span class="w-1.5 h-1.5 rounded-full ${kStyle.dot} shrink-0"></span>
            <span class="font-mono text-[11px] text-slate-400 shrink-0">${k.id}</span>
            <span class="truncate text-sm ${k.header ? 'font-semibold text-slate-700' : 'text-slate-600'}">${k.name}</span>
            ${k.header ? `<span class="text-[10px] px-1.5 py-0.5 rounded bg-slate-100 text-slate-500 shrink-0">Group</span>` : ''}
          </div>
          <div class="font-mono text-sm tnum shrink-0 ${k.header ? 'font-semibold text-slate-800' : 'text-slate-600'}">${money(kMag)} <span class="text-[10px] text-slate-400">${kSuffix}</span></div>
        </div>`;
      }).join('')}
      <div class="px-4 py-3 flex items-center justify-between bg-slate-50">
        <span class="text-sm font-semibold text-slate-700">Total — ${a.name}</span>
        <span class="font-mono text-base font-semibold text-slate-900 tnum">${money(magnitude)} <span class="text-xs text-slate-400">${suffix}</span></span>
      </div>
    </div>`;
  } else {
    const { opening, rows } = generateTransactions(a);
    const catTotal = Math.abs(computeBalance(a.cat === 'equity' ? '3000' : (a.cat === 'asset' ? '1000' : (a.cat === 'liability' ? '2000' : (a.cat === 'revenue' ? '4000' : '6000')))));
    const share = catTotal > 0 ? Math.min(100, (a.balance / catTotal) * 100) : 0;

    body = `
      <div class="px-5 py-4 border-b border-slate-100">
        <p class="text-xs text-slate-400 mb-1">Share of Total ${categoryLabel[a.cat]}s</p>
        <div class="flex items-center gap-3">
          <div class="flex-1 h-1.5 rounded-full bg-slate-100 overflow-hidden">
            <div class="h-full rounded-full ${style.dot}" style="width:${share.toFixed(1)}%"></div>
          </div>
          <span class="text-xs font-mono text-slate-500 w-12 text-right">${share.toFixed(1)}%</span>
        </div>
      </div>
      <div class="px-5 py-4">
        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wide mb-2.5">Recent Activity</p>
        <div class="overflow-x-auto rounded-lg border border-slate-100">
          <table class="w-full text-sm">
            <thead>
              <tr class="bg-slate-50 text-left text-[11px] font-semibold text-slate-400 uppercase tracking-wide">
                <th class="px-3 py-2">Date</th>
                <th class="px-3 py-2">Memo</th>
                <th class="px-3 py-2 text-right">Debit</th>
                <th class="px-3 py-2 text-right">Credit</th>
                <th class="px-3 py-2 text-right">Balance</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
              <tr class="text-slate-400">
                <td class="px-3 py-2" colspan="4">Opening Balance</td>
                <td class="px-3 py-2 text-right font-mono tnum">${money(Math.abs(opening))}</td>
              </tr>
              ${rows.map(r => `
                <tr class="hover:bg-slate-50">
                  <td class="px-3 py-2 text-slate-500 whitespace-nowrap">${r.date}</td>
                  <td class="px-3 py-2 text-slate-600">${r.memo}</td>
                  <td class="px-3 py-2 text-right font-mono tnum text-slate-600">${r.debit ? money(r.debit) : '—'}</td>
                  <td class="px-3 py-2 text-right font-mono tnum text-slate-600">${r.credit ? money(r.credit) : '—'}</td>
                  <td class="px-3 py-2 text-right font-mono tnum text-slate-700">${money(Math.abs(r.balance))}</td>
                </tr>`).join('')}
              <tr class="bg-slate-50 font-semibold">
                <td class="px-3 py-2 text-slate-700" colspan="4">Current Balance</td>
                <td class="px-3 py-2 text-right font-mono tnum text-slate-900">${money(magnitude)} <span class="text-[10px] font-normal text-slate-400">${suffix}</span></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>`;
  }

  document.getElementById('detail').innerHTML = `
    <div class="px-5 py-4 border-b border-slate-100">
      <div class="text-xs flex items-center gap-1 flex-wrap mb-3">${breadcrumbHtml(a)}</div>
      <div class="flex items-start justify-between gap-4">
        <div class="min-w-0">
          <div class="flex items-center gap-2 flex-wrap">
            <span class="font-mono text-sm text-slate-400">${a.id}</span>
            <h2 class="text-lg font-semibold text-slate-900 ${a.status === 'inactive' ? 'line-through text-slate-400' : ''}">${a.name}</h2>
          </div>
          <div class="mt-2 flex items-center gap-1.5 flex-wrap">
            ${badgePill(categoryLabel[a.cat], style)}
            <span class="text-xs font-medium px-2 py-0.5 rounded-full border bg-slate-50 text-slate-600 border-slate-200">${a.subtype}</span>
            ${a.header ? `<span class="text-xs font-medium px-2 py-0.5 rounded-full border bg-slate-50 text-slate-600 border-slate-200">Account Group</span>` : ''}
            ${isContra ? `<span class="text-xs font-medium px-2 py-0.5 rounded-full border bg-slate-50 text-slate-600 border-slate-200">Contra Account</span>` : ''}
            <span class="text-xs font-medium px-2 py-0.5 rounded-full border ${statusStyle}">${a.status === 'active' ? 'Active' : 'Inactive'}</span>
          </div>
          <p class="mt-3 text-sm text-slate-500 max-w-lg">${a.desc}</p>
        </div>
        <div class="text-right shrink-0">
          <p class="text-xs text-slate-400">Current Balance</p>
          <p class="text-2xl font-semibold text-slate-900 font-mono tnum">${money(magnitude)}</p>
          <p class="text-xs text-slate-400">${a.normal === 'debit' ? 'Debit' : 'Credit'} Normal (${suffix})</p>
        </div>
      </div>
      <div class="mt-4 grid grid-cols-2 sm:grid-cols-4 gap-3 text-sm">
        <div><p class="text-[11px] text-slate-400">Account Number</p><p class="font-mono text-slate-700">${a.id}</p></div>
        <div><p class="text-[11px] text-slate-400">Normal Balance</p><p class="text-slate-700">${a.normal === 'debit' ? 'Debit' : 'Credit'}</p></div>
        <div><p class="text-[11px] text-slate-400">Currency</p><p class="text-slate-700">USD</p></div>
        <div><p class="text-[11px] text-slate-400">Parent Account</p><p class="text-slate-700 truncate">${a.parent ? byId[a.parent].name : '—'}</p></div>
      </div>
    </div>
    ${body}
  `;
}

// ---------------------------------------------------------------------------
// Init
// ---------------------------------------------------------------------------
renderSummary();
renderChips();
renderTree();
renderDetail();
</script>
</body>
</html>
